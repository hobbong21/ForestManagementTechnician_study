um": 49, "part": 3, "stem": "계류에서 수제(水制)를 설치하는 목적은?", "options": ["비탈면 녹화", "산사태 감지", "토석류 포착", "유수 방향을 조절하고 유속을 줄여 계안을 보호"], "answer": 3, "explain": "수제 = 유수 방향 조절·유속 감소 → 계안 보호", "ref": "사방공학"}, {"id": "산림토목-50", "subject": "산림토목", "num": 50, "part": 3, "stem": "해안사방에서 퇴사울(퇴사울타리)을 세우는 주된 목적은?", "options": ["해수 담수화", "방풍림을 벌채하기 위해", "날리는 모래를 퇴적시켜 사구(전사구)를 조성", "해안도로 배수"], "answer": 2, "explain": "퇴사울세우기로 모래를 쌓아 전사구 조성 → 이후 사초 심기·정사울 등", "ref": "사방공학"}, {"id": "산림토목-51", "subject": "산림토목", "num": 51, "part": 4, "stem": "산악지형에서 임도망을 배치할 때 능선을 따라 개설하는 능선임도(Ridge road)의 장점으로 옳은 것은?", "options": ["배수 처리가 용이하고 교량이나 암거 등 구조물 공사비가 적게 든다", "산 아래 골짜기의 집재 거리가 매우 짧아진다", "노폭을 넓히기 쉽고 곡선반경 확보가 항상 유리하다", "토공량이 사면임도에 비해 월등히 많이 든다"], "answer": 0, "explain": "능선임도는 계곡임도에 비해 집수면적이 작아 배수가 쉽고 암거·교량 등 배수구조물 공사비 절감", "ref": "임도공학"}, {"id": "산림토목-52", "subject": "산림토목", "num": 52, "part": 4, "stem": "임도 설계 시 자동차가 직선부에서 원곡선부로 진입할 때 원심력의 급격한 변화를 완화시켜 안전성을 높이기 위해 설치하는 완화곡선의 대표적인 곡선은?", "options": ["포물선", "클로소이드(Clothoid) 곡선", "쌍곡선", "타원곡선"], "answer": 1, "explain": "직선과 원곡선 사이에 완화구간으로 반경이 연속적으로 변하는 클로소이드(Clothoid) 곡선 적용", "ref": "임도설계학"}, {"id": "산림토목-53", "subject": "산림토목", "num": 53, "part": 4, "stem": "임도 노면 아래에 매설하는 횡단배수관의 파손을 방지하기 위한 최소 토피(흙덮기 두께) 기준은?", "options": ["20cm 이상", "30cm 이상", "50cm 이상", "100cm 이상"], "answer": 2, "explain": "횡단배수관은 트럭 바퀴 하중에 의한 파손 방지를 위해 최소 토피 50cm 이상 확보 필수", "ref": "임도시공규정"}, {"id": "산림토목-54", "subject": "산림토목", "num": 54, "part": 4, "stem": "임도의 종단기울기가 급변하는 변곡점에 주행 충격을 완화하기 위해 설치하는 종단곡선(Vertical curve)에 주로 적용되는 곡선은?", "options": ["단심원곡선", "2차 포물선", "클로소이드", "반향곡선"], "answer": 1, "explain": "종단곡선은 경사 변화에 따른 충격을 완화하기 위해 2차 포물선(Parabola) 적용", "ref": "도로공학"}, {"id": "산림토목-55", "subject": "산림토목", "num": 55, "part": 4, "stem": "흙깎기(절토) 비탈면에서 지하수 침투로 인해 원호 모양의 미끄럼면을 따라 사면 전체가 대규모로 쓸려 내려가는 붕괴 형태는?", "options": ["표주 붕괴", "원호 슬라이딩(Rotational slide)", "쐐기 파괴", "낙석"], "answer": 1, "explain": "점착력이 있는 점토질 비탈면이 지하수로 포화되어 원호면을 따라 미끄러지는 현상은 원호 슬라이딩", "ref": "사면안정학"}, {"id": "산림토목-56", "subject": "산림토목", "num": 56, "part": 4, "stem": "성토 구간에서 점성토(진흙질 흙)의 다짐에 가장 효과적인 토공 다짐 장비는?", "options": ["마카담 롤러", "탠덤 롤러", "탬핑 롤러(Sheepsfoot roller)", "진동 콤팩터"], "answer": 2, "explain": "탬핑 롤러(Sheepsfoot roller)는 돌기형 바퀴로 점성토의 깊은 층까지 전압하는 데 최적", "ref": "토공기계학"}, {"id": "산림토목-57", "subject": "산림토목", "num": 57, "part": 4, "stem": "가선집재 장치 중 작업선(스카이라인)에 통나무를 매달고 양방향으로 윈치를 당겨 평지 및 완경사지에서 목재를 끌어모으는 연속식 집재 방식은?", "options": ["중력식 가선집재", "타일러(Tyler) 방식", "엔드리스 타일러(Endless Tyler) 방식", "러닝 스카이라인"], "answer": 2, "explain": "엔드리스 타일러는 순환 와이어로프를 이용해 평지나 완경사지에서 전후 양방향 견인이 가능한 방식", "ref": "가선집재학"}, {"id": "산림토목-58", "subject": "산림토목", "num": 58, "part": 4, "stem": "동력사슬톱(체인소) 작업 시 킥백(Kick-back: 톱날 끝이 튀어 오르는 현상) 발생 시 작업자의 왼손 손등이 밀치면서 체인을 0.1초 내로 멈추게 하는 안전장치는?", "options": ["체인 캐처", "체인 브레이크(핸드가드 연동)", "스로틀 인터록", "방진 스프링"], "answer": 1, "explain": "킥백 시 왼손 손등이 전방 가드를 밀치면서 밴드 브레이크가 작동해 체인이 즉각 정지됨", "ref": "임업기계안전"}, {"id": "산림토목-59", "subject": "산림토목", "num": 59, "part": 4, "stem": "사방댐이 계곡 상류에서 밀려 내려온 토사를 가두어 저사(貯砂) 기능을 수행한 후 최종적으로 안정화되는 계곡 바닥의 기울기를 무엇이라 하는가?", "options": ["원지반 기울기", "평형하상 기울기(퇴사 기울기)", "임계 경사", "수로 구배"], "answer": 1, "explain": "사방댐에 토사가 채워져 침식과 퇴적이 평형을 이루는 바닥 경사를 평형하상 기울기(퇴사기울기)라 함", "ref": "사방공학"}, {"id": "산림토목-60", "subject": "산림토목", "num": 60, "part": 4, "stem": "사방댐의 안정 조건을 계산할 때 댐체를 하류 쪽으로 밀어내거나 넘어뜨리려 하는 주된 외력(작용력)의 조합은?", "options": ["댐 자체 중량 + 기초 마찰력", "정수압 + 동수압(토사 충격력) + 토압", "지반 지지력 + 양압력", "저수량 + 침하력"], "answer": 1, "explain": "사방댐을 전도·활동시키는 외력은 상류의 정수압, 쇄도하는 토석류의 동수압, 퇴사 토압", "ref": "사방구조역학"}, {"id": "산림토목-61", "subject": "산림토목", "num": 61, "part": 4, "stem": "황폐한 계곡 상류의 붕괴지나 계류 지류의 바닥 깎임을 막기 위해 설치하는 공작물로, 사방댐보다 규모가 작고 물받이 공작물을 생략할 수 있는 소규모 횡단 구조물은?", "options": ["골막이", "기슭막이", "수제", "바닥막이"], "answer": 0, "explain": "골막이는 사방댐보다 작은 규모로 계곡 상류 지류에 시공하며 물받이를 생략하는 경우가 많음", "ref": "사방공학"}, {"id": "산림토목-62", "subject": "산림토목", "num": 62, "part": 4, "stem": "계곡의 유속이 빠르고 거센 급류 구역에서 계안(계곡 양 언덕)의 기슭이 침식되어 무너지는 것을 방지하기 위해 계류 흐름과 평행하게 축조하는 공작물은?", "options": ["사방댐", "기슭막이(Revetment)", "골막이", "암거배수로"], "answer": 1, "explain": "기슭막이는 계곡 옆 언덕(계안)의 침식을 방지하기 위해 물길 방향과 나란히 축조하는 공작물", "ref": "계간사방공학"}, {"id": "산림토목-63", "subject": "산림토목", "num": 63, "part": 4, "stem": "산복사방에서 급경사 비탈면을 깎아내어 사면을 완만하게 만든 후 일정한 높이 간격으로 계단 모양의 참을 설치하는 공정은?", "options": ["단끊기(Bench terrace)", "떼심기", "편책공", "비탈다듬기"], "answer": 0, "explain": "비탈다듬기 후 계단 모양의 턱을 만드는 공정을 단끊기(Bench terrace)라 함", "ref": "산복사방공학"}, {"id": "산림토목-64", "subject": "산림토목", "num": 64, "part": 4, "stem": "돌쌓기 공법 중 돌과 돌 사이에 시멘트 모르타르를 채워 넣어 수밀성과 일체 강도를 극대화하는 돌쌓기 방식은?", "options": ["메쌓기(Dry masonry)", "찰쌓기(Wet masonry)", "잡석쌓기", "야면석쌓기"], "answer": 1, "explain": "모르타르를 사용하여 일체화하는 것은 찰쌓기(Wet masonry), 물빠짐을 고려해 돌만 쌓는 것은 메쌓기", "ref": "토목시공학"}, {"id": "산림토목-65", "subject": "산림토목", "num": 65, "part": 4, "stem": "비탈면 녹화 공법 중 흙이 척박하거나 급경사인 비탈면에 흙, 부엽토, 풀씨, 비료를 넣은 자루를 계단 모양으로 쌓아 비탈 안정을 도모하는 공법은?", "options": ["떼붙임공법", "식생자루(새주머니) 공법", "종자뿜어붙이기", "짚덮기"], "answer": 1, "explain": "새주머니(식생자루) 공법은 흙자루에 종자를 넣어 급경사지에 계단식으로 축조하는 녹화공법", "ref": "사면녹화학"}, {"id": "산림토목-66", "subject": "산림토목", "num": 66, "part": 4, "stem": "해안사방에서 해변 모래밭의 모래가 강풍에 날려 내륙으로 이동하는 것을 막고 모래언덕(사구)의 높이를 높여 고정하기 위해 설치하는 격자형 모래방패 울타리는?", "options": ["퇴사울타리(정사울타리)", "방조제", "방파제", "침사지"], "answer": 0, "explain": "해안사구의 모래 이동을 막고 퇴적을 유도하는 시설은 퇴사울타리(정사울타리)", "ref": "해안사방학"}, {"id": "산림토목-67", "subject": "산림토목", "num": 67, "part": 4, "stem": "집중호우 시 상류 붕괴지에서 쏟아진 흙, 거대한 바위, 부러진 통나무가 빗물과 한 덩어리가 되어 맹렬한 속도로 계곡을 따라 쓸고 내려오는 자연재해 현상은?", "options": ["토석류(Debris flow)", "땅밀림", "지반침하", "동결융해"], "answer": 0, "explain": "물과 토사, 암석, 유목이 일체화되어 계곡을 고속으로 질주하는 현상은 토석류(Debris flow)", "ref": "산사태방재학"}, {"id": "산림토목-68", "subject": "산림토목", "num": 68, "part": 4, "stem": "사방댐 본체 중앙에 강재 격자형 빔(Slit)을 설치하여 평상시에는 물과 잔모래를 자연 방류하고, 산사태 발생 시에만 거목과 큰 암석을 선별 차단하는 친환경 사방댐은?", "options": ["콘크리트 중력식 사방댐", "슬릿(Slit) 사방댐(투과형 사방댐)", "석재 사방댐", "흙사방댐"], "answer": 1, "explain": "투과형 슬릿(Slit) 사방댐은 평상시 생태계 단절을 막고 토석류 발생 시 거목과 암석을 차단", "ref": "사방공학"}, {"id": "산림토목-69", "subject": "산림토목", "num": 69, "part": 4, "stem": "임도의 횡단면도 작성 시 표준적인 축척은?", "options": ["1:100", "1:500", "1:1,000", "1:5,000"], "answer": 0, "explain": "임도 횡단면도는 상세한 단면 확인을 위해 1:100 축척으로 제도", "ref": "임도측량학"}, {"id": "산림토목-70", "subject": "산림토목", "num": 70, "part": 4, "stem": "산사태취약지역에 대한 실태조사를 실시해야 하는 주기는?", "options": ["6개월마다", "매년 1회 이상", "3년마다", "5년마다"], "answer": 3, "explain": "· 학습모듈(사방 p.21~22): 산림청장이 5년마다 산사태 발생우려지역 기초조사 → 지역산사태예방기관의 장이 그 결과에 따라 5년마다 실태조사\n· 2026.2.1부터 근거는 「산림재난방지법」 제21조(기초조사 5년마다, 필요 지역 실태조사)\n· 지정된 취약지역·대피소 현지점검은 연 2회 이상(제25조)\n· (2026.11 정정: 기존 정답 '매년 1회 이상'은 모듈·법령 근거가 없어 ④로 바로잡음)", "ref": "사방 모듈 3-5-3, 산림재난방지법 제21·25조"}, {"id": "산림토목-71", "subject": "산림토목", "num": 71, "part": 4, "stem": "임도 노면 배수를 위한 횡단배수관의 유입구와 유출구에서 빗물에 의한 비탈면 세굴을 막고 물길을 모아주기 위해 배수관 양옆에 설치하는 콘크리트 구조물은?", "options": ["날개벽(Wing wall)", "소단", "길어깨", "방호책"], "answer": 0, "explain": "배수관 양옆에 'V'자나 사다리꼴로 날개벽을 달아주어야 빗물이 배수관 바깥으로 새어 비탈면을 깎아먹지 않습니다.", "ref": "임도시공학"}, {"id": "산림토목-72", "subject": "산림토목", "num": 72, "part": 4, "stem": "사방댐 여수토(방수로)에서 홍수 시 통과하는 최대 유출량(Q)을 수리학적으로 계산할 때 사용하는 표준적인 사다리꼴 위어(Weir) 공식 형태는?", "options": ["Q = C · B · H^(3/2)", "Q = A · V^2", "Q = C · I · A", "Q = 2gH"], "answer": 0, "explain": "· 위어(Weir) 공식: 유출량(Q)은 수로 폭(B)과 수심의 1.5승(H^(3/2))에 유량계수(C)를 곱하여 산출합니다 (Q = C\n· B\n· H^(3/2)).", "ref": "수리학 및 사방공학"}, {"id": "산림토목-73", "subject": "산림토목", "num": 73, "part": 4, "stem": "절토 비탈면의 암반에 균열이 심하여 대규모 암반 붕괴가 우려될 때 사면 깊숙이 강철 인장재를 천공 삽입하고 시멘트 밀크로 그라우팅하여 인장력을 가하는 공법은?", "options": ["그라운드 앵커(Ground anchor) 공법", "떼심기공법", "비탈덮기공법", "파종공"], "answer": 0, "explain": "영구 그라운드 앵커는 깊은 암반까지 쇠줄을 박아 프리스트레스를 주어 사면을 강하게 압착 고정합니다.", "ref": "사면안정공학"}, {"id": "산림토목-74", "subject": "산림토목", "num": 74, "part": 4, "stem": "가선집재 시 무거운 통나무를 공중에 지탱하는 주 와이어로프(주삭, Skyline)의 안전율(파단하중 ÷ 최대장력) 기준으로 옳은 것은?", "options": ["1.0 이상", "1.5 이상", "2.7 이상", "10 이상"], "answer": 2, "explain": "집재기계 안전기준상 주삭(스카이라인)은 안전율 2.7 이상, 예인삭 및 작업선은 안전율 4 이상을 확보해야 합니다.", "ref": "임업기계학"}, {"id": "산림토목-75", "subject": "산림토목", "num": 75, "part": 4, "stem": "지하수위가 높아 붕괴 위험이 있는 절토 비탈면 내부에 구멍을 뚫고 타공 PVC 유공관을 수평으로 삽입하여 물을 빼내는 배수 시설은?", "options": ["수평배수공(Subsurface horizontal drain)", "산마루측구", "종단측구", "집수정"], "answer": 0, "explain": "사면 속의 물을 직접 빼내어 간극수압을 낮추는 시설을 수평배수공(수평 유공관)이라 합니다.", "ref": "사면배수공학"}, {"id": "산림토목-76", "subject": "산림토목", "num": 76, "part": 4, "stem": "임도 노선 측량 시 능선이나 계곡을 따라 주어진 종단경사(예: 8%)를 유지하면서 지표면과 만나는 점들을 연결한 계획 가상선은?", "options": ["영선(Zero line)", "중심선", "지적선", "등고선"], "answer": 0, "explain": "절토나 성토가 전혀 발생하지 않는 계획 경사의 지표면 교차선을 '영선(Zero line)'이라 하며 노선 배치의 기준이 됩니다.", "ref": "임도측량학"}, {"id": "산림토목-77", "subject": "산림토목", "num": 77, "part": 4, "stem": "유역면적 A(km²), 유출계수 C, 강우강도 I(mm/hr)일 때 사방댐 설계를 위한 최대홍수유출량 Q(m³/s)를 구하는 합리식(Rational formula)은?", "options": ["Q = 0.2778 · C · I · A", "Q = C · I / A", "Q = A · I^2", "Q = 100 · C · I"], "answer": 0, "explain": "· 수문학에서 소유역 홍수량 산정에 가장 널리 쓰이는 합리식 공식은 Q = 0.2778\n· C\n· I\n· A (또는 Q = 1/3.6\n· C\n· I\n· A, 단위: m³/s)입니다.", "ref": "수문학 사방공학"}, {"id": "산림토목-78", "subject": "산림토목", "num": 78, "part": 4, "stem": "사방댐 콘크리트 타설 시 하루에 전부 치지 못하고 이어칠 때 발생하는 시공이음(Construction joint) 사이로 물이 새는 것을 방지하기 위해 이음부에 매설하는 자재는?", "options": ["수밀 지수판(Water stop)", "철조망", "비닐 테이프", "자갈"], "answer": 0, "explain": "콘크리트 타설 이음면에는 고무나 구리 재질의 '지수판(Water stop)'을 끼워 넣어 누수를 완벽 차단합니다.", "ref": "토목시공학"}, {"id": "산림토목-79", "subject": "산림토목", "num": 79, "part": 4, "stem": "높이가 높은 절토 비탈면에서 사면의 안정을 유지하고 점검 통로를 확보하기 위해 비탈면 높이 5m마다 설치하는 수평 계단 턱의 명칭은?", "options": ["소단(Berm)", "노견", "암거", "측구"], "answer": 0, "explain": "가파른 절개지 사면 높이 5m(또는 10m)마다 폭 1~1.5m의 수평 턱(소단, Berm)을 두어 비탈 안정과 배수를 돕습니다.", "ref": "토목설계기준"}, {"id": "산림토목-80", "subject": "산림토목", "num": 80, "part": 4, "stem": "산림경관을 해치지 않고 중차량의 통행 하중을 지탱하기 위해 깬 자갈(쇄석)을 맞물려 다진 후 석분을 채워 전압하는 전통적 임도 노면 공법은?", "options": ["쇄석 머캐덤(Macadam) 공법", "아스팔트 콘크리트 포장", "고무 매트 포장", "잔디 포장"], "answer": 0, "explain": "머캐덤(Macadam) 공법은 쇄석의 물림과 다짐을 이용한 친환경 비포장 임도 쇄석부설 공법입니다.", "ref": "임도공학"}, {"id": "산림토목-81", "subject": "산림토목", "num": 81, "part": 4, "stem": "임도 노선 측량 시 기준점 간의 각도와 거리를 순차적으로 측정하여 노선의 뼈대를 형성하는 골격 측량법은?", "options": ["트래버스 측량(다각 측량)", "수준 측량", "평판 측량", "항공 측량"], "answer": 0, "explain": "임도 설계의 골격은 다각 측량(Traverse survey)을 통해 각 측점의 평면 좌표(X, Y)와 방위각을 결정하는 중심선 측량으로 이루어집니다.", "ref": "임도측량학"}, {"id": "산림토목-82", "subject": "산림토목", "num": 82, "part": 4, "stem": "산림청 「임도설치 및 관리 등에 관한 규정」상 간선임도의 설계속도 기준 범위는?", "options": ["시속 40~20km", "시속 80~60km", "시속 100km 이상", "시속 10km 이하"], "answer": 0, "explain": "설계속도는 간선임도 시속 40~20km, 지선임도 시속 30~20km, 작업임도 시속 20km 이하로 규정되어 있습니다.", "ref": "임도시설규정 별표"}, {"id": "산림토목-83", "subject": "산림토목", "num": 83, "part": 4, "stem": "임도의 종단기울기가 변하는 변곡점에서 차량 주행 시 운전자의 시거(Sight distance)를 확보하고 충격을 완화하기 위해 설치하는 종단곡선(Vertical curve)의 형태는?", "options": ["포물선(Parabola)", "원호", "사이클로이드", "하이퍼볼라"], "answer": 0, "explain": "종단곡선은 종단경사의 변화율을 일정하게 유지하기 위해 2차 포물선(Parabola) 곡선으로 설계 및 시공합니다.", "ref": "도로공학 및 임도설계"}, {"id": "산림토목-84", "subject": "산림토목", "num": 84, "part": 4, "stem": "노상 흙의 지지력을 현장에서 직접 평가하기 위해 표준 원형 하중판(지름 30cm)에 하중을 가하여 침하량을 측정하는 지반 시험법은?", "options": ["평판재하시험(PBT, Plate bearing test)", "다짐 시험", "소성한계 시험", "비중계 시험"], "answer": 0, "explain": "평판재하시험(PBT)은 노상 지지력계수(K값)를 측정하는 시험이며, 도로 포장 설계 시 CBR 시험과 함께 가장 기본이 되는 현장 시험입니다.", "ref": "토질역학 및 도로공학"}, {"id": "산림토목-85", "subject": "산림토목", "num": 85, "part": 4, "stem": "토공사에서 절토량과 성토량의 균형을 계획하고 토사의 합리적인 운반 거리와 방향을 결정하기 위해 작성하는 토량 곡선은?", "options": ["유토곡선(토적곡선, Mass curve)", "S-곡선", "하이드로그래프", "입도분포곡선"], "answer": 0, "explain": "유토곡선(Mass curve)은 측점별 절·성토 토량을 누적하여 도식화한 곡선으로, 절토와 성토의 균형점, 토취장 및 사토장의 위치, 덤프트럭의 평균 운반거리를 산출하는 데 활용됩니다.", "ref": "토목시공학 토공론"}, {"id": "산림토목-86", "subject": "산림토목", "num": 86, "part": 4, "stem": "절토 비탈면의 붕괴를 방지하기 위해 콘크리트 격자틀을 사면에 설치하고 격자 내부에 흙을 채운 뒤 식생을 도입하는 사면 보호공법은?", "options": ["격자블록공(콘크리트 격자틀공)", "떼붙이기공", "편책공", "돌망태공"], "answer": 0, "explain": "콘크리트 격자블록공은 사면의 표층 붕괴를 격자틀의 자중과 앵커로 억제하고, 내부 공간에 녹화를 유도하는 구조적+식생적 복합 사면안정 공법입니다.", "ref": "사면안정공학"}, {"id": "산림토목-87", "subject": "산림토목", "num": 87, "part": 4, "stem": "계곡의 종침식(바닥 깎임)을 방지하고 계상(계곡 바닥)의 종단 물매를 완만하게 안정시키기 위해 계류를 횡단하여 설치하는 높이 2m 이하의 소규모 공작물은?", "options": ["바닥막이(Bed sill)", "사방댐", "도수구", "소단"], "answer": 0, "explain": "바닥막이는 사방댐에 비해 규모가 작고(보통 높이 1.5~2.0m 내외) 저사 기능보다는 계상 바닥의 파임(세굴)을 막아 물길 경사를 안정시키는 것이 주된 목적입니다.", "ref": "계간사방공학"}, {"id": "산림토목-88", "subject": "산림토목", "num": 88, "part": 4, "stem": "사방댐 상류에 유출된 토사 중 물과 잔모래는 하류로 자연 유하시키고, 위험한 거목(유목)과 대형 암석(전석)만을 선별 포착하여 하류의 피해를 막는 사방댐 형식은?", "options": ["강재 슬릿(Slit) 사방댐(투과형 사방댐)", "중력식 콘크리트 사방댐", "흙사방댐", "석재 사방댐"], "answer": 0, "explain": "투과형 사방댐(슬릿댐, 버트리스댐)은 본체에 틈(Slit)이 있어 평상시 계류 생태계의 연속성을 보장하고, 토석류 발생 시 유목과 큰 돌만을 걸러내는 친환경 사방 구조물입니다.", "ref": "사방공학"}, {"id": "산림토목-89", "subject": "산림토목", "num": 89, "part": 4, "stem": "산사태(Landslide)와 토석류(Debris flow)의 역학적 특성 차이로 옳은 것은?", "options": ["산사태는 수분을 전혀 포함하지 않는다.", "토석류는 물과 흙, 자갈, 거목이 반유체 상태로 뒤섞여 계곡을 따라 빠른 속도로 유하하는 현상이다.", "산사태가 토석류보다 이동 속도가 훨씬 빠르다.", "토석류는 반드시 평지에서만 발생한다."], "answer": 1, "explain": "산사태는 사면의 흙덩어리가 미끄럼면을 따라 블록 형태로 활동하는 것이며, 토석류는 산사태 물질이 계곡의 급류와 섞여 진흙-암석 혼합 유체로 시속 20~40km 이상의 맹렬한 속도로 쏟아져 내리는 현상입니다.", "ref": "산사태방재공학"}, {"id": "산림토목-90", "subject": "산림토목", "num": 90, "part": 4, "stem": "비탈면의 흙이 흘러내리는 것을 막기 위해 비탈을 계단 모양으로 깎고 말뚝을 박은 후 싸리나무나 잡목 가지를 엮어 흙을 받쳐주는 전통적 산비탈 공종은?", "options": ["산비탈 바자얽기(편책공, Hurdle work)", "사방댐", "콘크리트 옹벽", "낙석방지망"], "answer": 0, "explain": "바자얽기(편책공)는 말뚝 사이에 나뭇가지나 바자(편책)를 엮어 계단 턱을 지탱하고 토사를 억류하여 식생 활착을 돕는 친환경 전통 사방공종입니다.", "ref": "산복사방공학"}, {"id": "산림토목-91", "subject": "산림토목", "num": 91, "part": 4, "stem": "암반 절토 비탈면이나 척박한 토사 비탈면에 종자, 비료, 양생제, 침식방지제, 유기물 피복재를 물과 섞어 압축공기로 사면에 고압 살포하는 녹화 공법은?", "options": ["하이드로시딩(취부공, Hydro-seeding)", "묘목 줄심기", "잔디 뗏장 붙이기", "객토공"], "answer": 0, "explain": "종비토 취부공(하이드로시딩)은 사람의 손이 닿기 힘든 급경사 비탈면에 기계를 이용해 녹화 재료를 일시에 살포 부착시키는 현대 사면녹화의 대표 공법입니다.", "ref": "비탈면녹화공학"}, {"id": "산림토목-92", "subject": "산림토목", "num": 92, "part": 4, "stem": "임도 배수시설 중 노면의 종단경사가 급할수록 횡단배수관의 설치 간격을 어떻게 조정해야 하는가?", "options": ["경사가 급할수록 배수관 간격을 좁혀 자주 설치한다. ns": ["찌그러짐(Collapse)", "표면경화(Case hardening)", "청변", "틀어짐"], "answer": 1, "explain": "표면이 먼저 마르고 내부가 뒤늦게 마르면서 잔류 응력이 생겨 굳어지는 결함을 표면경화라 함", "ref": "목재건조학"}, {"id": "임산가공-54", "subject": "임산가공", "num": 54, "part": 4, "stem": "목재 방부제 중 과거 널리 사용되던 비소·크롬계(CCA)의 유해성을 개선하여 현대에 널리 쓰이는 구리·알킬암모늄계 친환경 방부제는?", "options": ["크레오소트유", "ACQ(구리·알킬암모늄 화합물)", "PCP", "볼덴염"], "answer": 1, "explain": "ACQ(Alkaline Copper Quaternary)는 인체 유해 중금속(비소, 크롬)을 배제한 대표 방부제", "ref": "목재보존학"}, {"id": "임산가공-55", "subject": "임산가공", "num": 55, "part": 4, "stem": "원목을 얇은 단판(Veneer)으로 회전 절삭한 후, 인접한 단판의 섬유 방향이 서로 직교하도록 홀수 겹으로 겹쳐 접착한 목질 판상 재료는?", "options": ["파티클보드(PB)", "합판(Plywood)", "중밀도섬유판(MDF)", "지향성스트랜드보드(OSB)"], "answer": 1, "explain": "베니어를 홀수 매로 직교 적층하여 접착한 목질 판상 제품은 합판(Plywood)", "ref": "목재가공학"}, {"id": "임산가공-56", "subject": "임산가공", "num": 56, "part": 4, "stem": "목질 접착제 중 내수성과 내열성이 가장 우수하여 실외용 방수 합판이나 구조용 집성재 제조에 필수적으로 사용되는 접착제는?", "options": ["요소수지 접착제", "페놀수지 접착제", "초산비닐수지 접착제", "녹말풀"], "answer": 1, "explain": "페놀수지(PF) 및 레조르시놀수지 접착제는 내수·내후성이 탁월하여 외장구조용으로 사용", "ref": "목재접착학"}, {"id": "임산가공-57", "subject": "임산가공", "num": 57, "part": 4, "stem": "제지용 펄프 제조법 중 목재 칩을 수산화나트륨(NaOH)과 황화나트륨(Na₂S) 용액으로 증해하여 강도가 매우 강한 포장용 크라프트지를 생산하는 화학펄프는?", "options": ["쇄목펄프(GP)", "크라프트펄프(KP, 황산염펄프)", "아황산펄프(SP)", "반화학펄프(SCP)"], "answer": 1, "explain": "크라프트펄프(KP)는 황화소다 증해로 리그닌을 제거하며 섬유 손상이 적어 강도가 최고", "ref": "펄프제지학"}, {"id": "임산가공-58", "subject": "임산가공", "num": 58, "part": 4, "stem": "숯(목탄) 제조 시 가마 안에서 탄화가 완료된 후 가마 입구를 활짝 열어 공기를 통하게 하여 1,000℃ 이상으로 달군 뒤 재와 흙을 덮어 급랭시켜 껍질이 희고 단단한 숯은?", "options": ["검탄(흑탄)", "백탄", "활성탄", "성형탄"], "answer": 1, "explain": "백탄은 고온 탄화 후 소화토로 급랭하여 재가 묻어 희고 단단함 (검탄은 가마를 밀폐해 서랭)", "ref": "임산화학"}, {"id": "임산가공-59", "subject": "임산가공", "num": 59, "part": 4, "stem": "숯을 구울 때 발생하는 연기를 냉각 채취하여 얻은 액체(조목초액)를 6개월 이상 정치 숙성시켜 타르를 분리 정제한 친환경 농임업 자재는?", "options": ["목타르", "목초액", "테르펜유", "피톤치드"], "answer": 1, "explain": "숯 굽는 연기를 냉각 액화하여 숙성·정제한 산성 액체는 목초액(Wood vinegar)", "ref": "임산화학"}, {"id": "임산가공-60", "subject": "임산가공", "num": 60, "part": 4, "stem": "표고버섯 원목재배용 골목으로 가장 널리 사용되는 최적의 원목 수종 군은?", "options": ["소나무류", "참나무류(상수리나무, 신갈나무 등)", "오리나무류", "포플러류"], "answer": 1, "explain": "표고버섯은 리그닌과 셀룰로오스가 풍부한 참나무류(상수리, 신갈 등) 원목이 가장 우수함", "ref": "버섯재배학"}, {"id": "임산가공-61", "subject": "임산가공", "num": 61, "part": 4, "stem": "목재의 역학적 강도 중 섬유 방향(결 방향)으로 작용할 때 강도가 가장 큰 외력은?", "options": ["섬유평행 인장강도", "섬유직각 인장강도", "전단강도", "지압강도"], "answer": 0, "explain": "목재는 섬유 평행 방향으로 당기는 인장강도가 모든 역학적 강도 중 가장 큼", "ref": "목재역학"}, {"id": "임산가공-62", "subject": "임산가공", "num": 62, "part": 4, "stem": "얇은 제재판을 섬유 방향이 서로 평행하도록 길이 및 두께 방향으로 접착하여 대형 단면과 긴 스팬을 구현할 수 있는 공학목재는?", "options": ["집성재(Glulam)", "파티클보드", "코어합판", "하드보드"], "answer": 0, "explain": "제재판을 섬유 방향이 서로 평행하게 적층 접착하여 대형 보나 기둥을 만드는 재료는 집성재", "ref": "공학목재"}, {"id": "임산가공-63", "subject": "임산가공", "num": 63, "part": 4, "stem": "톱밥이나 목재 분쇄물을 고압으로 압축 성형하여 지름 6~8mm, 길이 30mm 내외의 원통형 펠릿으로 만든 친환경 청정 바이오매스 연료는?", "options": ["목재 칩", "목재 펠릿(Wood pellet)", "바이오 에탄올", "성형목탄"], "answer": 1, "explain": "톱밥을 무바인더 또는 고압 압축 성형한 직경 6~8mm 고체 바이오연료는 목재 펠릿", "ref": "바이오에너지"}, {"id": "임산가공-64", "subject": "임산가공", "num": 64, "part": 4, "stem": "침엽수 목재 조직의 약 90~95%를 차지하며, 수분 통도 기능과 지지 기능을 동시에 담당하는 가늘고 긴 세포는?", "options": ["도관(Vessel)", "가도관(Tracheid, 헛물관)", "목섬유", "방사유세포"], "answer": 1, "explain": "침엽수재는 도관이 없으며 가도관(Tracheid)이 통도와 지지 기능을 겸함", "ref": "목재해부학"}, {"id": "임산가공-65", "subject": "임산가공", "num": 65, "part": 4, "stem": "활엽수 목재 단면에서 봄철에 형성된 조재(춘재)부에 직경이 거대한 도관이 띠 모양으로 배열되고, 만재부에는 작은 도관이 분포하는 수종의 목재 분류는?", "options": ["환공재(Ring-porous wood, 참나무·물푸레 등)", "산공재(Diffuse-porous wood, 자작나무·단풍나무 등)", "무도관재", "무공재"], "answer": 0, "explain": "봄철에 큰 도관이 연륜을 따라 고리 모양으로 배열되는 수종은 환공재(Ring-porous)", "ref": "목재조직학"}, {"id": "임산가공-66", "subject": "임산가공", "num": 66, "part": 4, "stem": "활엽수 심재화 과정에서 인접한 유세포의 내용물이 도관 내벽의 벽공을 통해 도관 속으로 풍선처럼 부풀어 들어가 도관을 꽉 틀어막는 물질은?", "options": ["수지(Resin)", "타일로시스(Tylosis)", "리그닌", "펙틴"], "answer": 1, "explain": "유세포막이 도관 내로 침입하여 도관을 폐쇄하는 조직은 타일로시스(Tylosis)", "ref": "목재해부학"}, {"id": "임산가공-67", "subject": "임산가공", "num": 67, "part": 4, "stem": "목재에 난연(방염) 성능을 부여하기 위해 목재 내부에 주입하는 주된 난연 약제 성분은?", "options": ["인산암모늄, 붕산 및 붕사 화합물", "염화나트륨 및 황산구리", "수산화칼륨 및 알코올", "메탄올 및 아세톤"], "answer": 0, "explain": "인산염 및 붕소 화합물은 가열 시 불연성 가스를 방출하고 탄화층을 형성하여 방염 작용", "ref": "목재보존학"}, {"id": "임산가공-68", "subject": "임산가공", "num": 68, "part": 4, "stem": "목재 건조 시 목재 표면에서 수분이 증발하는 속도가 내부에서 표면으로 수분이 이동하는 속도보다 훨씬 빠를 때 목재 마구리(단면)나 표면에 생기는 갈라짐 결함은?", "options": ["할렬(Check)", "변색", "옹이", "절삭 결함"], "answer": 0, "explain": "수분 증발 불균형으로 표면이나 끝단이 갈라져 터지는 결함을 할렬(Check)이라 함", "ref": "목재건조학"}, {"id": "임산가공-69", "subject": "임산가공", "num": 69, "part": 4, "stem": "국산 침엽수 제재목의 품등 구분 시 품질을 저하시키는 가장 대표적인 목재 내부 결함은?", "options": ["옹이(죽은 옹이, 썩은 옹이) 및 부후", "나이테의 균일성", "심재의 짙은 색상", "가도관의 길이"], "answer": 0, "explain": "제재목 품등 판정 시 옹이의 직경비율, 부후(썩음), 꺾임 등 결점이 등급을 좌우함", "ref": "원목규격고시"}, {"id": "임산가공-70", "subject": "임산가공", "num": 70, "part": 4, "stem": "목재의 3대 주성분(세포벽 구성 물질)과 그 구성 비율로 옳은 것은?", "options": ["셀룰로오스(약 40~50%), 헤미셀룰로오스(약 20~30%), 리그닌(약 20~30%)", "셀룰로오스(80%), 전분(10%), 펙틴(10%)", "단백질(50%), 지질(30%), 무기질(20%)", "헤미셀룰로오스(70%), 회분(20%), 수지(10%)"], "answer": 0, "explain": "목재 주성분은 셀룰로오스(40~50%), 헤미셀룰로오스(20~30%), 리그닌(20~30%)", "ref": "목재화학"}, {"id": "임산가공-71", "subject": "임산가공", "num": 71, "part": 4, "stem": "목재의 내부 결함(내부 썩음, 옹이, 공동)을 원목을 자르지 않고 외부에서 초음파나 충격 탄성파의 전파 속도로 진단하는 검사법은?", "options": ["비파괴 검사법(Non-destructive testing)", "화학 침출법", "인열 검사", "소각 분석"], "answer": 0, "explain": "음파나 초음파는 건강하고 단단한 목재일수록 속도가 빠르고, 썩은 부위를 만나면 속도가 급격히 느려지는 원리를 이용한 비파괴 검사입니다.", "ref": "목재물리학"}, {"id": "임산가공-72", "subject": "임산가공", "num": 72, "part": 4, "stem": "제재목을 나뭇결 방향이 서로 직교(90도)하도록 층층이 쌓아 접착하여 두껍고 거대한 구조용 목재 판을 만들어 10층 이상의 고층 목조건축에 사용되는 최첨단 공학목재는?", "options": ["CLT (Cross-Laminated Timber, 구조용 직교 집성판)", "합판", "파티클보드", "MDF"], "answer": 0, "explain": "CLT는 제재목을 직교 적층하여 콘크리트 판처럼 높은 강도를 내며 고층 목조건축의 혁신 재료로 각광받고 있습니다.", "ref": "목조건축공학"}, {"id": "임산가공-73", "subject": "임산가공", "num": 73, "part": 4, "stem": "목재 펠릿(Wood pellet) 제조 시 톱밥 자체에 함유되어 있어 별도의 인공 화학 접착제를 넣지 않아도 고온·고압 압출 시 천연 바인더 역할을 하는 목재 성분은?", "options": ["리그닌(Lignin)", "셀룰로오스", "헤미셀룰로오스", "수지"], "answer": 0, "explain": "리그닌은 약 80~100℃의 열과 압력을 받으면 연화되어 끈적끈적해져 톱밥을 단단히 결합시키는 천연 접착제 역할을 합니다.", "ref": "바이오에너지학"}, {"id": "임산가공-74", "subject": "임산가공", "num": 74, "part": 4, "stem": "펄프 제조 공정에서 화학펄프 속에 남아있는 잔류 리그닌의 함량을 측정하여 표백에 필요한 화학 약품의 양을 결정하는 척도는?", "options": ["카파값(Kappa number)", "산가", "요오드가", "비누화값"], "answer": 0, "explain": "카파값(Kappa number)은 펄프 속 리그닌 잔여량을 나타내며, 수치가 낮을수록 리그닌이 잘 제거된 고급 펄프입니다.", "ref": "펄프제지공학"}, {"id": "임산가공-75", "subject": "임산가공", "num": 75, "part": 4, "stem": "산림바이오매스 에너지 이용 시 목재 칩이나 펠릿의 품질 등급을 결정하는 가장 중요한 물리적 인자는?", "options": ["함수율 및 회분(재) 함량", "원목의 색상", "껍질의 광택", "단판의 무늬"], "answer": 0, "explain": "함수율(수분)이 낮아야 발열량이 높고, 연소 후 남는 찌꺼기인 회분(재)이 적어야 보일러를 망가뜨리지 않습니다.", "ref": "목재펠릿품질규격고시"}, {"id": "임산가공-76", "subject": "임산가공", "num": 76, "part": 4, "stem": "목재 방부 처리 시 밀폐 가압탱크 내에서 목재에 초기 진공을 걸지 않고 곧바로 방부액을 고압 주입한 후 나중에 진공을 걸어 여분의 약액을 회수하는 공정은?", "options": ["루핑법 (Empty-cell process)", "베델법 (Full-cell process)", "침지법", "온냉욕법"], "answer": 0, "explain": "루핑법(Empty-cell)은 세포벽에만 방부제를 묻히고 세포 내강의 약제는 회수하여 방부제 소모를 아끼는 경제적 방법입니다.", "ref": "목재보존학"}, {"id": "임산가공-77", "subject": "임산가공", "num": 77, "part": 4, "stem": "합판을 만들기 위해 거대한 통나무를 고속 회전시키며 얇은 단판(베니어)을 깎아낼 때 사용하는 대형 기계는?", "options": ["로터리 레이스 (Rotary lathe)", "체인소", "밴드쏘", "갱쏘"], "answer": 0, "explain": "통나무를 두루마리 휴지 풀듯 얇게 깎아내는 합판용 핵심 장비는 로터리 레이스(Rotary lathe)입니다.", "ref": "합판제조학"}, {"id": "임산가공-78", "subject": "임산가공", "num": 78, "part": 4, "stem": "침엽수 목재의 횡단면(단면) 관찰 시 수직방향으로 송진(레진)이 흐르는 수지구가 존재하는 대표적인 수종 군은?", "options": ["소나무속, 낙엽송속, 가문비나무속", "주목, 편백, 삼나무", "참나무, 밤나무", "자작나무, 단풍나무"], "answer": 0, "explain": "· 소나무, 잣나무, 낙엽송, 가문비나무는 수지구(Resin canal)가 정상적으로 발달해 송진을 분비합니다.\n· (주목, 전나무, 편백은 정상 수지구가 없음)", "ref": "목재해부학"}, {"id": "임산가공-79", "subject": "임산가공", "num": 79, "part": 4, "stem": "목조건축에서 대형 화재 발생 시 두꺼운 기둥이나 보의 표면이 불에 타면서 탄화층(숯)을 형성하여 내부로 산소와 열이 전달되는 것을 차단하는 현상은?", "options": ["탄화 단열 효과 (Charring effect)", "융해 현상", "증발 잠열", "산화 폭발"], "answer": 0, "explain": "두꺼운 목재는 표면이 타면서 생긴 숯(탄화층)이 뛰어난 단열재 역할을 하여 내부 목재의 강도를 오랫동안 유지합니다.", "ref": "목조건축안전"}, {"id": "임산가공-80", "subject": "임산가공", "num": 80, "part": 4, "stem": "목재 섬유(Cellulose)를 나노 단위(10억분의 1m)로 잘게 쪼개어 강철보다 5배 강하고 무게는 1/5에 불과한 미래형 바이오 신소재는?", "options": ["CNF (Cellulose Nano Fiber, 나노셀룰로오스)", "리그닌 수지", "파티클보드", "목초액"], "answer": 0, "explain": "친환경 나노셀룰로오스(CNF)는 자동차 경량화 부품, 전자 디스플레이, 배터리 분리막 등에 쓰이는 미래 친환경 소재입니다.", "ref": "첨단임산화학"}, {"id": "임산가공-81", "subject": "임산가공", "num": 81, "part": 4, "stem": "침엽수재와 활엽수재의 해부학적 구조 차이에 대한 설명으로 옳은 것은?", "options": ["침엽수는 도관(Vessel)이 발달하여 수액을 이동시킨다.", "침엽수재의 부피 90~95%는 가도관(Tracheid)으로 구성되어 통도와 지지 기능을 겸한다.", "활엽수재는 가도관이 주된 세포이다.", "침엽수재가 활엽수재보다 세포의 구성 종류가 훨씬 복잡하다."], "answer": 1, "explain": "침엽수는 구조가 단순하여 부피의 90% 이상이 '가도관(헛물관)'으로 이루어져 통도와 지지를 모두 담당하며, 활엽수는 수액 통도를 전담하는 '도관'과 지지를 전담하는 '목섬유'로 분화되어 구조가 복잡합니다.", "ref": "목재해부학"}, {"id": "임산가공-82", "subject": "임산가공", "num": 82, "part": 4, "stem": "수목의 줄기 단면에서 중심부에 위치하며 짙은 색을 띠고 추출물이 축적되어 내구성이 높은 부위는?", "options": ["변재(Sapwood)", "심재(Heartwood)", "형성층", "수피"], "answer": 1, "explain": "심재(Heartwood)는 죽은 유조직 세포에 페놀, 탄닌, 수지 등 추출물이 침착되고 도관 내에 타일로시스(Tylosis)가 형성되어 방부성, 내충성이 강하고 짙은 색을 띱니다.", "ref": "목재물리학"}, {"id": "임산가공-83", "subject": "임산가공", "num": 83, "part": 4, "stem": "목재 2차 세포벽(Secondary wall)의 세 층(S1, S2, S3) 중 두께가 가장 두껍고 미세섬유 경사각이 축 방향과 거의 나란하여 목재의 세로 인장강도와 역학적 특성을 지배하는 층은?", "options": ["S1층 (외층)", "S2층 (중층)", "S3층 (내층)", "복합세포간층"], "answer": 1, "explain": "2차벽의 중층인 S2층은 2차벽 두께의 약 80%를 차지하며 셀룰로오스 미세섬유가 세포 장축과 10~30도의 작은 각도로 평행하게 배열되어 있어 목재의 강도와 물리적 성질을 결정합니다.", "ref": "목재이학"}, {"id": "임산가공-84", "subject": "임산가공", "num": 84, "part": 4, "stem": "목재가 특정 온습도 조건의 공기 중에 장시간 노출되었을 때 목재 내부의 수분과 대기 중의 습도가 평형을 이루어 더 이상 수분의 출입이 없는 상태의 함수율은?", "options": ["섬유포화점(FSP)", "평형함수율(EMC, Equilibrium moisture content)", "전건함수율", "포화함수율"], "answer": 1, "explain": "· 목재는 흡습성 재료이므로 주위 공기의 상대습도와 온도에 따라 수분을 흡수하거나 방출하며, 대기와 평형에 도달한 함수율을 평형함수율(EMC)이라 합니다.\n· (우리나라 대기 EMC는 평균 12~14%)", "ref": "목재건조학"}, {"id": "임산가공-85", "subject": "임산가공", "num": 85, "part": 4, "stem": "목재 건조 시 수축률의 이방성(접선방향 : 방사방향 : 섬유방향 = 약 10 : 5 : 1)으로 인해 발생하는 대표적인 건조 결함이 **아닌** 것은?", "options": ["넙죽임(다이아몬딩)", "배굽음(보잉)", "찌그러짐(붕괴, Collapse)", "변재의 청변(청변균 감염)"], "answer": 3, "explain": "청변(Blue stain)은 곰팡이류의 균사가 변재 유조직에 침입하여 착색을 일으키는 생물학적 결함이며, 수축률 차이에 의한 물리적 건조 결함이 아닙니다.", "ref": "목재건조학"}, {"id": "임산가공-86", "subject": "임산가공", "num": 86, "part": 4, "stem": "건조실 내부의 온도와 습도를 인위적으로 정밀하게 조절하여 목재 내부의 건조응력을 완화시키면서 신속하게 건조하는 현대 인공건조법의 표준 방식은?", "options": ["증기 가열식 제어 건조(증기건조)", "노지 천연건조", "수침건조", "퇴비건조"], "answer": 0, "explain": "증기식 인공건조실은 보일러 증기와 송풍팬, 분무노즐을 이용하여 건조 스케줄표(온·습도 단계)에 따라 목재 손상(할렬)을 최소화하며 단기간에 건조하는 가장 널리 쓰이는 방식입니다.", "ref": "목재가공건조학"}, {"id": "임산가공-87", "subject": "임산가공", "num": 87, "part": 4, "stem": "목재의 기본 외력 방향에 따른 역학적 강도 크기 순서로 옳은 것은?", "options": ["인장강도 > 휨강도 > 압축강도 > 전단강도", "전단강도 > 압축강도 > 휨강도 > 인장강도", "압축강도 > 인장강도 > 전단강도 > 휨강도", "휨강도 > 전단강도 > 인장강도 > 압축강도"], "answer": 0, "explain": "목재는 섬유 주향 방향의 세로 '인장강도'가 가장 크고, 그다음이 보(Beam)로 쓰일 때의 '휨강도', 기둥으로 쓰일 때의 '압축강도' 순이며, 섬유를 따라 미끄러지는 '전단강도'가 가장 약합니다.", "ref": "목재역학"}, {"id": "임산가공-88", "subject": "임산가공", "num": 88, "part": 4, "stem": "목재를 밀폐된 탄화로에서 공기 공급을 제한하고 가열할 때 발생하는 부산물 중 연기를 냉각하여 액화·정제한 산성 액체는?", "options": ["목초액(Wood vinegar)", "테레빈유", "리그닌", "펄프"], "answer": 0, "explain": "숯(목탄)을 구울 때 연기 중의 타르와 수증기를 포집·냉각하여 숙성 분리한 액체를 '목초액'이라 하며, 초산 성분이 풍부하여 항균 및 토양개량제로 쓰입니다.", "ref": "임산화학"}, {"id": "임산가공-89", "subject": "임산가공", "num": 89, "part": 4, "stem": "합판(Plywood) 제조 시 원목을 회전축에 물리고 칼날을 밀어붙여 두루마리 휴지처럼 넓고 긴 단판(Veneer)을 깎아내는 대표적인 박판 절삭기계는?", "options": ["로터리 레이스(Rotary lathe)", "슬라이서(Slicer)", "갱소(Gang saw)", "밴드소(띠톱)"], "answer": 0, "explain": "· 합판용 단판(베니어)의 90% 이상은 통나무를 회전시키며 연속 절삭하는 로터리 레이스(Rotary lathe)로 생산됩니다.\n· 슬라이서는 무늬목 단판 절삭에 쓰입니다.", "ref": "목질복합재료학"}, {"id": "임산가공-90", "subject": "임산가공", "num": 90, "part": 4, "stem": "목재 잔재나 삭편(Chip)을 고온고압에서 해섬하여 미세한 단섬유로 분리한 후 합성수지 접착제와 혼합하여 성형·열압한 보드는?", "options": ["중밀도섬유판(MDF, Medium density fiberboard)", "파티클보드(PB)", "합판", "집성재"], "answer": 0, "explain": "삭편(부스러기)을 접착한 것은 파티클보드(PB)이며, 고온 해섬기(Defibrator)로 목재 섬유(Fiber) 단위까지 해섬하여 제조한 균질한 판재는 섬유판(MDF)입니다.", "ref": "목질판상재료학"}, {"id": "임산가공-91", "subject": "임산가공", "num": 91, "part": 4, "stem": "야외 데크재나 침목 등 고도의 내구성이 요구되는 목재에 방부제를 주입할 때, 주입관 내부를 진공으로 만들어 목재 세포 내 공기를 배출한 후 방부액을 채우고 높은 압력을 가하는 가압주입법은?", "options": ["전세포법(Bethell 공정)", "침지법", "도포법", "훈증법"], "answer": 0, "explain": "베델(Bethell)법은 초기 진공으로 세포 내강의 공기를 완전히 뽑아낸 후 가압하여 세포 내강까지 방부제를 100% 충전하는 대표적인 전세포 가압주입 공정입니다.", "ref": "목재보존학"}, {"id": "임산가공-92", "subject": "임산가공", "num": 92, "part": 4, "stem": "목재를 산소가 차단된 환경에서 180~220℃의 고온으로 열처리하여 친환경적으로 치수안정성과 내후성을 획기적으로 향상시킨 목재는?", "options": ["열처리 목재(Thermally modified wood)", "가압 방부목", "표백 목재", "압축 목재"], "answer": 0, "explain": "고온 열처리를 거치면 목재 내의 흡습성분인 헤미셀룰로오스가 분해되어 평형함수율이 절반으로 떨어지고 치수안정성과 목재부후균에 대한 저항성이 크게 향상됩니다.", "ref": "목재물리화학"}, {"id": "임산가공-93", "subject": "임산가공", "num": 93, "part": 4, "stem": "목재 칩을 화학약품 용액(수산화나트륨 및 황화나트륨)과 함께 고온고압으로 증해하여 리그닌을 녹여내고 강도가 우수한 종이 원료를 생산하는 대표적인 화학펄프 공정은?", "options": ["크라프트 펄프(KP, Kraft pulp) 공정", "쇄목 펄프(GP) 공정", "기계 펄프 공정", "아황산 펄프 공정"], "answer": 0, "explain": "황산염 펄프라고도 불리는 크라프트(Kraft) 펄프 공정은 수산화나트륨(NaOH)과 황화나트륨(Na2S) 혼합액을 사용하여 섬유 손상이 적고 강도가 매우 우수한 펄프를 생산합니다.", "ref": "펄프종이공학"}, {"id": "임산가공-94", "subject": "임산가공", "num": 94, "part": 4, "stem": "산림바이오매스 에너지원으로 활용되는 목재펠릿(Wood pellet)의 표준 제조 공정에서 압축 성형 시 별도의 화학 접착제를 첨가하지 않아도 자체 접착력을 발휘하는 목재 성분은?", "options": ["리그닌(Lignin)", "셀룰로오스", "수분", "회분"], "answer": 0, "explain": "톱밥을 고온·고압으로 압축할 때 목재 세포 간 물질인 리그닌(Lignin)이 열에 의해 연화·용융되면서 천연 바인더(접착제) 역할을 하여 펠릿 형태로 단단히 성형됩니다.", "ref": "바이오매스에너지학"}, {"id": "임산가공-95", "subject": "임산가공", "num": 95, "part": 4, "stem": "목재의 3대 주성분(셀룰로오스, 헤미셀룰로오스, 리그닌) 중 전체 건조 중량의 약 40~50%를 차지하며 포도당(Glucose)이 β-1,4 결합으로 길게 연결된 결정성 고분자 물질은?", "options": ["셀룰로오스(Cellulose)", "리그닌", "펙틴", "수지"], "answer": 0, "explain": "셀룰로오스는 목재 세포벽 골격을 이루는 주성분으로 목재 건중량의 40~50%를 차지하며, 헤미셀룰로오스는 약 20~30%, 방향족 고분자인 리그닌은 20~30%를 차지합니다.", "ref": "목재화학"}, {"id": "임산가공-96", "subject": "임산가공", "num": 96, "part": 4, "stem": "목재 인공건조의 마무리 단계에서 건조 중 형성된 목재 표면과 내부 간의 응력 차이(응력 역전 현상)를 해소하고 할렬을 방지하기 위해 고온다습한 증기를 쐬어주는 공정은?", "options": ["이퀄라이징 및 컨디셔닝(Conditioning)", "예열", "급속 냉각", "박피"], "answer": 0, "explain": "건조 말기에 표면은 압축, 내부는 인장 응력을 받는 잔류 건조응력(Casehardening)을 제거하기 위해 증기를 분사하여 표면을 일시적으로 부드럽게 완화시키는 공정을 '컨디셔닝(조습처리)'이라 합니다.", "ref": "목재건조학"}, {"id": "임산가공-97", "subject": "임산가공", "num": 97, "part": 4, "stem": "두꺼운 목재 판재를 나뭇결 방향이 서로 직교(90도 교차)하도록 층층이 접착하여 대형 건축물의 벽체 및 슬래브용 구조재로 사용하는 혁신적인 공학목재는?", "options": ["구조용 직교적층목재(CLT, Cross-Laminated Timber)", "일반 합판", "단판적층재(LVL)", "코르크판"], "answer": 0, "explain": "CLT는 제재목을 서로 직각으로 교차 적층한 차세대 매스팀버(Mass timber) 건축 자재로, 고층 목조건축의 내력벽과 바닥판을 시공할 수 있는 뛰어난 치수안정성과 내화성을 지닙니다.", "ref": "목재공학 및 목조건축"}, {"id": "임산가공-98", "subject": "임산가공", "num": 98, "part": 4, "stem": "목재 표면에 도장(도료 칠)을 실시할 때 방부, 방충 및 방수 기능을 하면서도 목재 고유의 나뭇결 무늬를 자연스럽게 살려주는 침투성 외부 도료는?", "options": ["오일스테인(Oil stain)", "락카", "에폭시 퍼티", "타르"], "answer": 0, "explain": "오일스테인은 목재 표면에 두꺼운 도막을 형성하지 않고 내부로 깊숙이 침투하여 통기성을 유지하면서 자외선과 빗물 침투를 차단하는 친환경 목재 보호 도료입니다.", "ref": "목재도장학"}, {"id": "임산가공-99", "subject": "임산가공", "num": 99, "part": 4, "stem": "국립산림과학원 침엽수 원목 규격에서 원목의 굽음(곡률도)을 측정하여 백분율(%)로 계산하는 공식으로 옳은 것은?", "options": ["(최대 굽음 깊이 ÷ 양단면을 잇는 재장) × 100", "(말구직경 ÷ 원목 길이) × 100", "(옹이 수 ÷ 재적) × 100", "(원목 무게 ÷ 원목 부피) × 100"], "answer": 0, "explain": "· 원목의 곡률도(%) = (양 마구의 중심을 연결한 직선에서 굽은 활 모양의 가장 깊은 깊이\n· 원목의 재장) × 100으로 산정합니다.", "ref": "목재규격 고시"}, {"id": "임산가공-100", "subject": "임산가공", "num": 100, "part": 4, "stem": "수확된 목재가 건축물, 가구 등에 사용되어 장기간 탄소를 가두어 둠으로써 지구온난화를 방지하는 효과를 정량적으로 인정하는 기후변화협약상의 개념은?", "options": ["수확된 목제품의 탄소저장(HWP, Harvested Wood Products)", "탄소 누출", "바이오 차", "산림 전용"], "answer": 0, "explain": "IPCC 가이드라인에 따른 HWP(수확된 목제품) 탄소계정은 벌채된 목재가 제품으로 사용되는 동안 대기 중으로 탄소를 방출하지 않고 고정하고 있는 양을 국가 온실가스 감축 실적으로 인정하  "accept": [3], "explain": "· 가 — 폭목은 제외\n· 나 — 최소 5m 이상\n· 다 — 가지치기는 반드시 톱으로 한다\n· 라 — 옳음", "ref": "조림 모듈 5-7-5 미래목 선정·관리"}, {"id": "공개-조림-6", "subject": "조림", "num": 6, "part": 0, "stem": "조림지 활착률 조사요령에서 빈칸에 들어갈 용어를 순서대로 맞게 고른 것은?\n\n(2) 표준지 조사비율은 ( ① )으로 한다.\n\n(4) 표준지 크기는 ( ② )을 원칙으로 하되, 소반 또는 필지단위 사업면적이 1ha 미만의 경우에는 ( ③ ) 크기로 할 수 있다.", "options": ["① 조림사업면적의 1% 이상 → ② 400㎡ → ③ 200㎡", "① 조림사업면적의 2% 이상 → ② 200㎡ → ③ 100㎡", "① 풀베기사업면적의 1% 이상 → ② 400㎡ → ③ 200㎡", "① 풀베기사업면적의 2% 이상 → ② 200㎡ → ③ 100㎡"], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "표준지 조사비율 = 풀베기사업 면적의 2% 이상, 크기 = 200㎡(반지름 8.0m 원형), 1ha 미만이면 100㎡(반지름 5.67m 원형). 활착률(%) = 생존본수 ÷ 조사본수 × 100", "ref": "조림 모듈 [붙임] 조림지 활착률 조사요령 2·4항"}]}, {"name": "산림보호", "questions": [{"id": "공개-산림보호-1", "subject": "산림보호", "num": 1, "part": 0, "stem": "다음 중 온대지방에서 내화수림대로 이용 가능한 수종을 고르시오.", "options": ["잣나무", "굴참나무", "소나무", "동백나무"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "⚠️ 확인 필요\n· 온대지방 내화수림대 수종 = 참나무류·아왜나무·잣나무·밤나무·가시나무류·낙엽송·잎갈나무. 두꺼운 코르크 수피를 가진 굴참나무가 대표적인 답이다.\n· 소나무는 수지가 많아 불에 약하고, 동백나무는 난대 수종이다.\n· ⚠️ 모듈 목록에 잣나무도 들어 있어 가·나 복수정답 소지가 있다.\n· 시험장에서는 \"참나무류(굴참나무)\"를 우선 고른다.", "ref": "산림보호 모듈 산불 간접소화법(내화수림대, 폭 30m 내외 띠숲)"}, {"id": "공개-산림보호-2", "subject": "산림보호", "num": 2, "part": 0, "stem": "살충효과를 조사하고자 한다. 대조구의 생충율이 98.3%이고, 약제 처리구의 생충율이 88.3%였다면 처리구의 보정살충률은 몇 %인가?", "options": ["10.17%", "10.56%", "10.94%", "11.33%"], "marks": ["가.", "나.", "다.", "라."], "answer": 0, "accept": [0], "explain": "Abbott 보정식: 보정살충률 = (대조구 생충율 − 처리구 생충율) ÷ 대조구 생충율 × 100 = (98.3 − 88.3) ÷ 98.3 × 100 = 10.17%", "ref": "산림보호 — 약효 시험(Abbott 공식)"}, {"id": "공개-산림보호-3", "subject": "산림보호", "num": 3, "part": 0, "stem": "다음 빈칸에 들어갈 산불 환경인자는?\n\n\"산불의 연소환경은 열·산소·연료를 함유하며 상호작용을 하고 산불의 형태 결정은 환경인자인 ( )·( )·( ) 등의 매개변수에 의하여 영향을 받는다.\"", "options": ["바람, 열, 지형", "바람, 연료, 지형", "산소, 열, 지형", "바람, 연료, 지형"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1, 3], "explain": "⚠️ 확인 필요\n· 산불 행동(형태)을 결정하는 3대 환경인자 = 연료·기상(바람)·지형. 열·산소는 연소의 3요소이지 환경인자가 아니다.\n· ⚠️ 원문 보기 나와 라가 똑같은 문장(출제 오류)이므로 둘 다 정답으로 본다.", "ref": "산림보호 모듈 산불의 발생과 확산 요인"}, {"id": "공개-산림보호-4", "subject": "산림보호", "num": 4, "part": 0, "stem": "다음 조건을 기준으로 나무주사를 실시하려고 한다. 병해충별 천공수 및 천공당 주입량, 본당 주입량을 가장 알맞게 산출한 것을 고르시오.\n\n[나무주사 방제약제 조건] 1) 솔잎혹파리: 포스팜 액제 50% 2) 솔껍질깍지벌레: 포스팜 액제 50% 3) 소나무재선충병: 아바멕틴 유제 1.8%\n\n흉고직경 | 솔잎혹파리 천공수 | 천공당(mL) | 솔껍질깍지벌레 천공수 | 천공당(mL) | 흉고직경 | 재선충병 천공수 | 천공당(mL) | 본당(mL)\n10~12 | 1 | ① | 2 | ② | 10~15 | 2 | ③ | ④\n14~16 | 2 | ① | 4 | ② | 15~20 | 4 | ③ |", "options": ["① 5, ② 5, ③ 4, ④ 8", "① 4, ② 5, ③ 5, ④ 10", "① 5, ② 4, ③ 4, ④ 8", "① 4, ② 4, ③ 5, ④ 10"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "⚠️ 확인 필요\n· 주입량 기준은 흉고직경 1cm당 양으로 생각하면 쉽다.\n· 솔잎혹파리(포스팜 50%) ≒ 흉고 1cm당 약 0.3~0.4mL → 천공당 4mL (10~12cm: 4mL, 14~16cm: 8mL)\n· 솔껍질깍지벌레(포스팜 50%) ≒ 흉고 1cm당 약 1mL → 천공당 5mL (10~12cm: 10mL)\n· 소나무재선충병(아바멕틴 1.8%) ≒ 흉고 1cm당 약 1mL → 천공당 5mL, 본당 2 × 5 = 10mL\n· ⚠️ 천공당 주입량 표는 학습모듈에 없다.\n· 「산림병해충 방제 지침」의 나무주사 기준으로 풀었다.", "ref": "산림병해충 방제 지침(나무주사 약량 기준), 산림보호 모듈 소나무재선충병 나무주사 작업요령"}, {"id": "공개-산림보호-5", "subject": "산림보호", "num": 5, "part": 0, "stem": "다음에서 설명하는 산림병해충 종류와 빈칸에 들어갈 내용을 순서대로 고르시오.\n\n\"외부로 충태가 노출되는 시기가 제한적이므로 침투성 약제를 나무주사하는 것이 효과적이다. 벌레혹 형성율이 ( ① ) 이상인 임지에서 산란 및 부화최성기인 6월에 포스팜 액제( ② )를 나무줄기에 주사한다. 또 유충이 낙하하는 11월 하순경에 이미다클로프리드 입제( ③ )를 지면에 살포한다.\"", "options": ["솔잎혹파리, 10%, 50%, 20%", "솔잎혹파리, 20%, 50%, 20%", "솔껍질깍지벌레, 10%, 50%, 20%", "솔껍질깍지벌레, 20%, 50%, 20%"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "\"벌레혹(충영)\"이 나오면 솔잎혹파리. 벌레혹 형성율 20% 이상 임지에서 6월에 포스팜 액제(50%) 나무주사, 이미다클로프리드 입제(20%) 지면 살포", "ref": "산림보호 모듈 2-2 솔잎혹파리 \"다. 방제시기 및 방법\""}, {"id": "공개-산림보호-6", "subject": "산림보호", "num": 6, "part": 0, "stem": "다음 설명에 해당하는 수목피해의 명칭과 이런 현상이 발생하는 수종 및 방제방법을 가장 잘 설명한 것을 고르시오.\n\n[① 피해명칭] 강한 복사광선으로 줄기 수피 일부에서 급격한 수분증발이 일어나 조직이 건조하여 떨어져 나가고, 상처에 부후균이 침투해 2차 피해를 유발한다.\n\n[② 피해수종] 코르크층이 발달하지 않고 평활한 수피를 지닌 수종, 남서방향 임연부 성목·고립목\n\n[③ 방제방법] 울폐된 숲이 심하게 개방되지 않게 하여 강한 직사광선을 피한다.", "options": ["① 열사, ② 가문비나무, ③ 석회유 도포", "① 볕데기, ② 호두나무, ③ 관수", "① 볕데기, ② 오동나무, ③ 석회유 도포", "① 열사, ② 전나무, ③ 관수"], "marks": ["가.", "나.", "다.", "라."], "answer": 2, "accept": [2], "explain": "수피가 건조해 떨어져 나가는 고온 피해 = 볕데기(피소). 피해수종 = 오동나무·호두나무·가문비나무처럼 수피가 평활한 수종. 방제 = 급격한 임상 개방 지양, 가로수·정원수는 석회유 살포(도포)·짚 감기·해가림. \"관수\"는 볕데기 방제법이 아니므로 나는 오답이다.", "ref": "산림보호 모듈 1-1-1 고온에 의한 피해 \"가. 볕데기\""}]}, {"name": "산림경영", "questions": [{"id": "공개-산림경영-1", "subject": "산림경영", "num": 1, "part": 0, "stem": "임목수확작업에 미치는 환경인자 중 지형적 요인에 해당하는 것은?", "options": ["기온", "강수", "토양의 연경도", "계절적 영향"], "marks": ["가.", "나.", "다.", "라."], "answer": 2, "accept": [2], "explain": "· 기온·강수·계절은 기상(기후)적 요인이다.\n· 작업지의 경사·지표구조·토양(강도·연경도)처럼 땅과 관련된 성질이 지형·지반 쪽 요인이다.", "ref": "산림경영 모듈 1-3 임목수확작업의 환경인자(지형 요인·토양 요인 \"나. 토양의 연경도\")"}, {"id": "공개-산림경영-2", "subject": "산림경영", "num": 2, "part": 0, "stem": "20년 전의 재적이 200㎥이고 현재 재적이 300㎥일 때 프레슬러식에 의한 재적 성장률은 얼마인가?", "options": ["8%", "6%", "4%", "2%"], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "Pressler 식: P = (V − v) ÷ (V + v) × 200 ÷ n = (300 − 200) ÷ (300 + 200) × 200 ÷ 20 = 0.2 × 10 = 2%", "ref": "산림경영 모듈 2-2-3 프레슬러 공식"}, {"id": "공개-산림경영-3", "subject": "산림경영", "num": 3, "part": 0, "stem": "산림경영계획에 대한 설명으로 틀린 것은?", "options": ["산림기본계획은 20년마다 수립하되, 산림의 상황 또는 경제사정의 현저한 변경 등의 사유가 있는 경우에는 이를 변경할 수 있다.", "도지사는 산림기본계획에 따라 관할구역에 소재한 산림의 특수성을 고려하여 지역산림계획을 20년마다 수립한다.", "국유림종합계획은 지방산림청 국유림관리소 단위로 10년마다 수립한다.", "사유림경영계획구는 일반경영계획구, 협업경영계획구, 기업경영림계획구로 구분하며 산림경영계획서는 10년마다 반드시 산림소유자가 작성해야 한다."], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "· 계획구 구분(일반·협업·기업경영림)은 맞다.\n· 그러나 산림경영계획서는 산림조합·산림경영기술자 등이 대행 작성할 수 있으므로 \"반드시 산림소유자가 작성\"은 틀리다.\n· 가·나·다는 모듈 내용과 같다(지역산림계획 20년, 국유림종합계획은 국유림관리소 단위로 10년).", "ref": "산림경영 모듈 1-3-1~1-3-5 산림계획 체계"}, {"id": "공개-산림경영-4", "subject": "산림경영", "num": 4, "part": 0, "stem": "Kameraltaxe 공식을 활용한 표준연벌채량은 얼마인가?\n\n경영계획구 산림면적 100ha, 현실축적을 법정축적으로 유도하는 갱정기 20년, 윤벌기 50년, 현실축적 1,000㎥, 평균생장량 50㎥, 법정축적 1,500㎥ (소수점 이하 절사)", "options": ["25㎥", "30㎥", "35㎥", "40㎥"], "marks": ["가.", "나.", "다.", "라."], "answer": 0, "accept": [0], "explain": "카메랄탁세: E = Z + (Vr − Vn) ÷ a = 50 + (1,000 − 1,500) ÷ 20 = 50 − 25 = 25㎥ (Z 생장량, Vr 현실축적, Vn 법정축적, a 갱정기. 윤벌기 50년은 쓰지 않는 함정 수치)", "ref": "산림경영 모듈 수확조정 — 축적법(Kameraltaxe)"}, {"id": "공개-산림경영-5", "subject": "산림경영", "num": 5, "part": 0, "stem": "[공통 지문] 귀산촌을 희망하는 산주 A는 벌기에 도달한 50년생 잣나무림 1ha의 임목 400㎥를 매각하고, 그 수익으로 두릅을 식재할 계획이다.\n\n① 잣나무 임목가는 시장가역산법으로 계산한다: 원목 1㎥당 시장가 300,000원, 1㎥당 생산비용 100,000원, 조재율 70%, 투하자본 회수기간 5개월, 월이율 4%, 기업이익률 30%\n\n② 두릅 판매가 50,000원/㎏, 변동비 30,000원/㎏, 고정비 600,000원\n\n시장가역산법에 따른 현재의 임목가치는 얼마인가?", "options": ["19,600,000원", "28,000,000원", "36,000,000원", "56,000,000원"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "· 시장가역산식: x = f × { a ÷ (1 + m·p + r) − b }\n· = 0.7 × { 300,000 ÷ (1 + 5 × 0.04 + 0.3) − 100,000 } = 0.7 × (200,000 − 100,000) = 70,000원/㎥\n· → 70,000 × 400㎥ = 28,000,000원", "ref": "산림경영 모듈 임목평가 — 시장가역산법"}, {"id": "공개-산림경영-6", "subject": "산림경영", "num": 6, "part": 0, "stem": "[공통 지문] 귀산촌을 희망하는 산주 A는 벌기에 도달한 50년생 잣나무림 1ha의 임목 400㎥를 매각하고, 그 수익으로 두릅을 식재할 계획이다.\n\n① 잣나무 임목가는 시장가역산법으로 계산한다: 원목 1㎥당 시장가 300,000원, 1㎥당 생산비용 100,000원, 조재율 70%, 투하자본 회수기간 5개월, 월이율 4%, 기업이익률 30%\n\n② 두릅 판매가 50,000원/㎏, 변동비 30,000원/㎏, 고정비 600,000원\n\n두릅의 손익분기점 판매량은 얼마인가? (원문 발문은 \"판매액과 생산액\"이지만 보기 단위는 ㎏)", "options": ["25㎏", "30㎏", "35㎏", "40㎏"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "손익분기점 판매량 = 고정비 ÷ (판매단가 − 단위변동비) = 600,000 ÷ (50,000 − 30,000) = 30㎏ (손익분기점 매출액 = 30 × 50,000 = 1,500,000원)", "ref": "산림경영 모듈 손익분기점 분석"}]}, {"name": "산림법규", "questions": [{"id": "공개-산림법규-1", "subject": "산림법규", "num": 1, "part": 0, "stem": "지방자치단체나 그 밖의 공공단체가 소유하는 산림은?", "options": ["국유림", "공유림", "사유림", "민유림"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "· 국유림 = 국가 소유\n· 공유림 = 지방자치단체·그 밖의 공공단체 소유\n· 사유림 = 그 외 소유", "ref": "산림자원법 제3조(산림 를 확인\n\nB. 원목으로부터 제재한 제재목의 특성을 확인\n\nC. 제재목을 생산할 원목의 소요량, 규격 및 길이 등을 확인\n\nD. 생산된 제재목의 재적이 확인되면, 다음 가공공정에 이송을 준비", "options": ["A – B – C – D", "A – C – B – D", "C – B – A – D", "C – B – D – A"], "marks": ["①", "②", "③", "④"], "answer": 0, "accept": [0], "explain": "· 모듈의 \"제재목 품질 확인\" 순서가 8-1(A) → 8-2(B) → 8-3(C) → 8-4(D)이다.\n· 상식적으로는 ②(소요량 확인 후 특성 확인)가 끌리지만, 출제는 모듈 순서를 그대로 따랐다.", "ref": "임산가공 모듈 8-1~8-4"}, {"id": "공개-임산가공-5", "subject": "임산가공", "num": 5, "part": 0, "stem": "제재목 함수율 검사를 위해 전건중량법으로 함수율을 계산하시오. 시험재의 전건무게가 2,000g이고 건조 중 시험재의 무게가 2,600g일 때 건조 중 함수율은?", "options": ["10%", "20%", "30%", "40%"], "marks": ["가.", "나.", "다.", "라."], "answer": 2, "accept": [2], "explain": "함수율(%) = (W − W₀) ÷ W₀ × 100 = (2,600 − 2,000) ÷ 2,000 × 100 = 30% (분모는 전건중량)", "ref": "임산가공 모듈 함수율 측정(전건중량법)"}, {"id": "공개-임산가공-6", "subject": "임산가공", "num": 6, "part": 0, "stem": "대청호 둘레길 데크로드 1km에 쓸 방부데크목을 구매하려 한다. 시공 위치는 토양과 접하지 않는 실외 비접지로서 강우로부터 보호되지 않는 지상부 노출 환경이다. 구매해야 할 방부목 등급은?", "options": ["H3A", "H3B", "H4A", "H4B"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "· H3 = 실외 비접지. H3A = 도장되었거나 수직부재여서 강우 침투가 어려운 환경, H3B = 도장되지 않아 강우 침투가 쉬운 환경. 수평으로 깔린 무도장 데크가 비에 노출되므로 H3B이다.\n· H4A·H4B는 접지(토양·담수 접촉) 환경이다.", "ref": "임산가공 모듈 방부목재 사용환경범주(KS F 3112 / 목재제품 규격)"}, {"id": "공개-임산가공-7", "subject": "임산가공", "num": 7, "part": 0, "stem": "국내 원목의 재적 및 해당 등급을 고르시오.\n\n굴참나무 원목: 수피 포함 말구 최소지름 300mm, 그 직각지름 330mm / 수피 포함 원구 최소지름 360mm, 그 직각지름 420mm / 원구·말구 수피 30mm / 길이 6.3m / 옹이 150mm 이하, 할렬 30% 이하, 굽음 20% 이하, 썩음 등 20% 이하, 기타결점 경미", "options": ["0.478㎥, 1등급", "0.506㎥, 1등급", "0.537㎥, 3등급", "0.567㎥, 3등급"], "marks": ["가.", "나.", "다.", "라."], "answer": 0, "accept": [0], "explain": "⚠️ 확인 필요\n· ① 말구지름(수피 제외 최소지름) = 300 − 30 = 270mm (최소지름이 300mm 이하라 직각지름 보정 없음)\n· ② 원구지름 = 360 − 30 = 330mm. 300mm를 넘으므로 직각지름(420 − 30 = 390mm)과의 차 60mm → 30mm마다 10mm 가산 → 330 + 20 = 350mm\n· ③ 스말리안식: V = (g₁ + g₂) ÷ 2 × L = π/4 × (0.27² + 0.35²) ÷ 2 × 6.3 ≒ 0.483㎥ → 가장 가까운 보기 0.478㎥\n· ④ 등급: 활엽수류 1등급 = 지름 270mm 이상·재장 2.1m 이상·옹이 긴지름 150mm 이하·할렬 30%·굽음 20%·썩음 20% 이하·기타결점 경미 → 1등급\n· ⚠️ 등급(1등급)은 확실하다.\n· 재적은 현행 모듈 기준(스말리안식)으로 계산하면 0.483㎥로 보기와 정확히 맞지 않는다.\n· 출제 당시(2021) 규격의 재적 계산식이 달랐을 수 있다.\n· 1등급 보기(가·나) 가운데 가까운 가를 골랐다.", "ref": "국산 원목 등급 규격 제9조(지름)·제11조(재적계산)·제12조(활엽수류 품등)"}]}];

천매장은 눈·빗물이 스며드는 곳에 한다.\n· 은행·주목·잣나무 등은 가을 정선 후 바로, 소나무·낙엽송·편백은 파종 1개월 전에 묻는다(①·④는 거꾸로).\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-7", "subject": "조림", "num": 7, "part": 6, "stem": "벌채작업 후 단위면적당 잔존 본수가 적은 것부터 순서대로 바르게 나열한 것은?", "options": ["개벌작업, 산벌작업, 모수림작업, 택벌작업", "택벌작업, 모수림작업, 산벌작업, 개벌작업", "택벌작업, 산벌작업, 모수림작업, 개벌작업", "개벌작업, 모수림작업, 산벌작업, 택벌작업"], "answer": 3, "explain": "잔존 본수: 개벌 < 모수림 < 산벌 < 택벌.\n중요도: ★★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-8", "subject": "조림", "num": 8, "part": 6, "stem": "상수리나무 묘목 생산과 종자에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 묘목 생산은 저상에서 한다.\n\nㄴ. 접목묘 양성이 어려운 수종이다.\n\nㄷ. 종자는 개화 다음해에 성숙한다.\n\nㄹ. 곤포당 1년생 묘목 수는 3,000본이다.", "options": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄷ, ㄹ"], "answer": 2, "explain": "상수리나무는 접목이 어렵고 종자는 개화 다음 해에 성숙(ㄴ·ㄷ).\n중요도: ★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-9", "subject": "조림", "num": 9, "part": 6, "stem": "수목생장 및 생리에 대한 설명으로 옳은 것은?", "options": ["수목이 생장하면서 필수로 요구하는 영양분 중 미량원소는 황, 염소, 망간 등이 있다.", "직경생장은 형성층이 세포분열을 해서 자신의 안쪽으로 체관부 조직을, 바깥쪽으로 물관부 조직을 생산함으로써 이루어진다.", "고정생장을 하는 은행나무, 낙엽송은 1년에 1개의 마디를 생산하기 때문에 줄기에 있는 마디 수를 세어 나무의 나이를 추정할 수 있다.", "단풍은 여러 가지 색소가 나타나는 현상인데, 노란 단풍은 크산토필 (xanthophyll)이, 빨간 단풍은 안토시아닌(anthocyanin)이 주로 관여한다."], "answer": 3, "explain": "노란 단풍은 크산토필, 빨간 단풍은 안토시아닌. 황은 다량원소, 형성층은 안쪽에 물관부, 바깥쪽에 체관부, 은행·낙엽송은 자유생장.\n중요도: ★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-10", "subject": "조림", "num": 10, "part": 6, "stem": "다음 특징을 갖는 수종은?\n\n○ 양수이며, 천근성이다.\n\n○ 잎은 수십 개씩 모여 달린다.\n\n○ 낙엽교목으로 초기생장이 빠르고 수간이 곧은 특징을 보인다.\n\n○ 원산지는 일본이며 우리나라 전역에 인공조림 수종으로 사용되어 왔다.", "options": ["Chamaecyparis obtusa", "Cryptomeria japonica", "Larix kaempferi", "Taxodium distichum"], "answer": 2, "explain": "양수·천근성·잎이 모여 나는 낙엽교목·일본 원산 = 일본잎갈나무(*Larix kaempferi*).\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-11", "subject": "조림", "num": 11, "part": 6, "stem": "내음성이 강한 수종으로만 나열한 것은?", "options": ["Abies holophylla, Taxus cuspidata, Torreya nucifera", "Picea jezoensis, Pinus densiflora, Pinus koraiensis", "Castanea crenata, Juniperus chinensis, Robinia pseudoacacia", "Alnus japonica, Carpinus laxiflora, Prunus serrulata"], "answer": 0, "explain": "전나무(*Abies holophylla*)·주목(*Taxus*)·비자나무(*Torreya*)는 내음성이 강하다.\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-12", "subject": "조림", "num": 12, "part": 6, "stem": "다음 식물호르몬에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 옥신(auxin)은 일반적으로 줄기 끝에서 생성되어 아래로 이동하며, 정아우세 현상을 유발한다.\n\nㄴ. 지베렐린(gibberellin)은 휴면 타파와 개화 촉진, 줄기의 신장 생장에 관여한다.\n\nㄷ. 아브시스산(abscisic acid)은 수분 스트레스를 받을 때 기공을 열어 증산작용을 촉진한다.\n\nㄹ. 에틸렌(ethylene)은 과실의 성숙을 촉진하고 잎의 탈리를 유도한다.", "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 2, "explain": "· ㄱ·ㄴ·ㄹ이 옳다.\n· 아브시스산은 수분 스트레스 때 기공을 닫는다.\n중요도: ★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-13", "subject": "조림", "num": 13, "part": 6, "stem": "균근에 대한 설명으로 옳지 않은 것은?", "options": ["토양에 있는 영양소 중 특히 인산 흡수를 촉진시켜 준다.", "소나무의 뿌리 피층세포 사이의 간극에 하티그망(Hartig net)을 형성한다.", "산성이 심한 산림토양에서 수목의 암모늄태(NH₄⁺) 질소 흡수에 도움을 준다.", "고산지대와 툰드라 지역과 같이 생육환경이 좋지 않은 곳에서는 공생관계를 맺지 않는다."], "answer": 3, "explain": "균근은 척박한 고산·툰드라에서 오히려 중요하다(공생한다).\n중요도: ★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-14", "subject": "조림", "num": 14, "part": 6, "stem": "이단림에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 상층목에 대한 벌채량 조절이 어렵고, 높은 작업기술 수준을 요한다.\n\nㄴ. 임지의 노출을 방지할 수 있고, 상층목을 통해 천연하종갱신이 가능하다.\n\nㄷ. 상층부와 하층부를 분기시키는 중ㆍ소 직경목은 우선적으로 남겨둬야 한다.\n\nㄹ. 상층부의 수관이 열려 치수의 생장을 촉진할 수 있어, 상층부와 하층부 모두 양수 위주로 조성한다.", "options": ["ㄱ, ㄴ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ"], "answer": 0, "explain": "· ㄱ·ㄴ이 옳다.\n· 상·하층을 가르는 중·소경목은 정리하고, 하층은 음수 위주.\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-15", "subject": "조림", "num": 15, "part": 6, "stem": "모두베기(개벌) 방법에 대한 설명으로 옳지 않은 것은?", "options": ["양수성 수종의 갱신에 유리하다.", "군상개벌에서 한 벌채구의 최소 면적은 5 ha이다.", "개벌 후 동령림이 형성되어 모든 생육단계에서 숲가꾸기작업이 비교적 편리하다.", "숲을 띠모양으로 나누고, 순차적으로 벌채해 나가는 방법을 대상개벌작업이라고 한다."], "answer": 1, "explain": "· 군상개벌의 한 벌채구는 소면적이다.\n· '최소 5ha'가 틀림.\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-16", "subject": "조림", "num": 16, "part": 6, "stem": "직파(direct seeding) 방법으로 조림하기에 비교적 쉬운 수종만을 모두 고르면?\n\nㄱ. 벚나무\n\nㄴ. 분비나무\n\nㄷ. 전나무\n\nㄹ. 곰솔(해송)", "options": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 1, "explain": "· 벚나무·곰솔(해송)은 직파가 비교적 쉽다.\n· 분비나무·전나무는 어렵다.\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-17", "subject": "조림", "num": 17, "part": 6, "stem": "어린나무 가꾸기에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 원하지 않는 수종으로부터 목표하는 수종을 보호하기 위해 실시한다.\n\nㄴ. 조림 이후에 조림목 간 수관 경쟁이 발생될 때 실시한다.\n\nㄷ. 형질 불량목 등을 제거하며, 연 3회 이상 실시한다.\n\nㄹ. 작업 시기는 수목 생육이 정지하는 11월 이후 겨울철이다.", "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "answer": 0, "explain": "· ㄱ·ㄴ이 옳다.\n· 어린나무가꾸기는 보통 연 1회, 6~9월(생육기)에 실시.\n중요도: ★★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-18", "subject": "조림", "num": 18, "part": 6, "stem": "다음 설명에 해당하는 우리나라 천연림 숲가꾸기의 수형급은?\n\n○ 임분구성에 필요한 예비목\n\n○ 미래목과 함께 선발되지 못한 우세목\n\n○ 임분 밀도에 따라 간벌재 또는 미래목으로 대체", "options": ["보호목", "중용목", "무관목", "중립목"], "answer": 1, "explain": "미래목과 함께 선발되지 못한 우세목·예비목 = 중용목(천연림 숲가꾸기 수형급).\n중요도: ★★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-19", "subject": "조림", "num": 19, "part": 6, "stem": "수목의 대사에 대한 설명으로 옳지 않은 것은?", "options": ["수목의 지질 함량은 겨울철에 높아지고 여름철에 낮아진다.", "수목세포 내의 단백질 함량은 동물세포에 비해 현저히 낮다.", "질소는 여러 대사작용에 직접 관여하기 때문에 잎, 분열조직, 형성층 등에서 함량이 높다.", "전분은 저장탄수화물로서 체내에서 이동되지 않기 때문에 단단하고 두꺼운 2차세포벽이 있는 후벽세포 내에 저장된다."], "answer": 3, "explain": "전분은 이동하지 않는 저장 탄수화물로 유세포에 저장된다.\n중요도: ★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-20", "subject": "조림", "num": 20, "part": 6, "stem": "종자의 발아에 대한 설명으로 옳지 않은 것은?", "options": ["산소 흡수속도는 종자 발아의 지표로 이용될 수 있다.", "고농도 이산화탄소는 때때로 종자 휴면에 영향을 줄 수 있다.", "에틸렌은 식물체 내에서 생성되는 생장조절물질로 종자 휴면을 촉진시킨다.", "파이토크롬(phytochrome)이 빛의 파장에 가역적으로 반응하기 때문에 발아가 억제되거나 촉진된다."], "answer": 2, "explain": "에틸렌은 종자 휴면을 타파하고 발아를 촉진한다.\n중요도: ★", "ref": "", "exam": "2026 조림"}]}, {"name": "2026 임업경영", "year": "2026", "subject": "임업경영", "questions": [{"id": "9급-2026-임업경영-1", "subject": "임업경영", "num": 1, "part": 6, "stem": "임 26 임업경영"}, {"id": "9급-2026-임업경영-16", "subject": "임업경영", "num": 16, "part": 6, "stem": "제6차 산림기본계획(변경)의 추진전략에서 ‘한국형 산림자원순환 경영으로 탄소중립 실현’의 핵심과제가 아닌 것은?", "options": ["국산목재 이용 촉진", "한반도 산림탄소흡수원 보전 및 복원", "스마트 임업으로 산림자원순환경영 활성화", "산림기반 융ㆍ복합 신산업 저변 확대"], "answer": 3, "explain": "'산림기반 융·복합 신산업 저변 확대'는 이 추진전략의 핵심과제가 아니다.\n중요도: ★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-17", "subject": "임업경영", "num": 17, "part": 6, "stem": "다음 조건의 노령림이 많은 작업급에서 개량기간 중의 표준연벌 면적[ha/년]은?\n\n○ 작업급의 면적(ha): 2,000\n\n○ 갱신면적(ha): 200\n\n○ 개량기(년): 20", "options": ["60", "70", "80", "90"], "answer": 3, "explain": "노령림이 많을 때 개량기간 연벌면적 = (작업급 면적 − 갱신면적)/개량기 = 1,800/20 = 90ha/년\n중요도: ★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-18", "subject": "임업경영", "num": 18, "part": 6, "stem": "수입되는 목재ㆍ목재제품의 합법벌채 판단 세부기준 상 합법벌채된 목재 또는 목재제품임을 증명하는 서류에 해당하지 않는 것은?", "options": ["수입국의 법령에 따라 발급된 수입승인서", "FSC에 의해 발급된 산림경영인증, 임산물제품인증 서류", "수출국의 정부 또는 정부로부터 위임받은 기관에서 운영하는 산림인증제도에 따라 발급된 인증서류", "수출국의 법령에 따라 해당 목재 또는 목재제품이 합법벌채 되었음을 확인할 수 있는 수출허가서"], "answer": 0, "explain": "수입국(우리나라) 수입승인서는 합법벌채 증명서류가 아니다.\n중요도: ★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-19", "subject": "임업경영", "num": 19, "part": 6, "stem": "다음 법정림의 법정영급면적[ha]과 영급수[개]를 바르게 연결한 것은?\n\n산림면적 100ha · 윤벌기 40년 · 1개 영급의 영계수 10개", "options": ["법정영급면적 25 · 영급수 2", "법정영급면적 25 · 영급수 4", "법정영급면적 40 · 영급수 2", "법정영급면적 40 · 영급수 4"], "answer": 1, "explain": "법정영급면적 = A/U × n = 100/40 × 10 = 25ha, 영급수 = U/n = 40/10 = 4개\n중요도: ★★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-20", "subject": "임업경영", "num": 20, "part": 6, "stem": "신규조림/재조림 청정개발체제(A/R CDM) 사업에 의한 온실가스 배출 감축량 산정에 대한 설명으로 옳지 않은 것은?", "options": ["사업자는 베이스라인 및 모니터링 방법론에 대하여 사업대상지의 특성에 따라 기존 등록되어 있는 방법론을 선택하거나 또는 사업에 적합한 방법론을 개발하여 사용할 수 있다.", "베이스라인 시나리오란 A/R CDM 활동이 시행되지 않을 경우, 대상지의 토지이용계획에 따라 나타나는 탄소축적량 변화 추이이다.", "탄소저장고는 사업대상지 내 탄소축적량 변화에 관여하는 온실가스 흡수원으로서 지상부 및 지하부 바이오매스, 낙엽, 고사목 및 토양유기물 등이다.", "대상지 구획화는 대상지의 탄소저장고인 목본식물과 다년생 관목의 지상부와 지하부 바이오매스로 구분하는 과정이다."], "answer": 3, "explain": "· 대상지 구획화는 토지·식생 특성이 비슷한 구역으로 나누는 과정이다.\n· 바이오매스 구분이 아니다.\n중요도: ★", "ref": "", "exam": "2026 임업경영"}]}, {"name": "2025 조림", "year": "2025", "subject": "조림", "questions": [{"id": "9급-2025-조림-1", "subject": "조림", "num": 1, "part": 6, "stem": "열대우림의 특성으로 옳지 않은 것은?", "options": ["많은 강우량이 지속되며 연중 고온으로 순생산성이 높다.", "상관은 단조로우나 종다양성이 매우 높다.", "만경식물과 착생식물의 비율이 높다.", "유기물 분해 속도가 빠르고 토양의 비옥도가 높다."], "answer": 3, "explain": "열대우림은 분해가 빠르지만 양분이 쉽게 용탈되어 토양이 척박하다.\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-2", "subject": "조림", "num": 2, "part": 6, "stem": "숲의 종류에 대한 설명으로 옳지 않은 것은?", "options": ["교림은 일반적으로 종자에서 발생한 치수가 기원이 되어 이루어진 숲이다.", "순림은 보호관리에 많은 경비가 소요되어 경제성이 낮다.", "동령림은 흉고직경급별 본수가 정규분포를 이룬다.", "침엽수림은 수목의 줄기가 곧고 재질이 좋아 목재 생산에 유리하다."], "answer": 1, "explain": "· 순림은 관리·작업이 간편하고 경제적이다.\n· 보호관리 경비가 많이 든다는 설명은 틀림.\n중요도: ★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-3", "subject": "조림", "num": 3, "part": 6, "stem": "산불이 산림식생에 미치는 영향에 대한 설명으로 옳지 않은 것은?", "options": ["산불 발생 후 소생력은 참나무류보다 소나무가 강한 편이다.", "줄기의 피해는 주로 형성층 조직이 상처를 입음으로써 발생한다.", "지표화로부터 임목의 밑가지에 불이 닿고 바람과 불길이 세어지면 수관화로 이어진다.", "수관화는 수목에 큰 피해를 주며, 임분이 전소할 수 있고 비화로 이어질 수 있다."], "answer": 0, "explain": "소나무는 맹아력이 약해 산불 후 소생력이 참나무류보다 약하다.\n중요도: ★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-4", "subject": "조림", "num": 4, "part": 6, "stem": "삽목묘 양성에 대한 설명으로 옳은 것은?", "options": ["수목의 가지, 뿌리, 잎, 눈의 일부를 완전한 개체로 발달시키는 방법이다.", "아까시나무, 포플러류, 동백나무는 발근이 어려운 수종이다.", "소나무, 상수리나무, 팽나무는 발근이 용이한 수종이다.", "줄기 삽수의 기극에서는 줄기가 발생한다."], "answer": 0, "explain": "· 삽목은 영양기관 일부로 개체를 만드는 방법. 아까시·포플러는 발근이 쉽고, 소나무·상수리는 어렵다.\n· 기극(아래쪽)에서는 뿌리가 생긴다.\n중요도: ★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-5", "subject": "조림", "num": 5, "part": 6, "stem": "무성번식에 대한 설명으로 옳은 것은?", "options": ["암ㆍ수 배우자 간의 접합을 통해 번식한다.", "같은 개체 내의 암술과 수술 사이에서 수분이 일어난 것이다.", "피자식물은 중복수정하고, 나자식물은 단일수정한다.", "하나의 모체에서 번식된 개체들은 동일한 유전정보를 갖는다."], "answer": 3, "explain": "무성번식으로 생긴 개체(클론)는 모체와 유전정보가 같다.\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-6", "subject": "조림", "num": 6, "part": 6, "stem": "수목의 근계에 대한 설명으로 옳은 것은?", "options": ["낙우송과 자작나무는 심근성이기 때문에 건조에 강하다.", "건조한 지역에 자라는 수목은 지하부에 대한 지상부의 비율이 낮다.", "일본잎갈나무와 소나무는 천근성이기 때문에 건조에 약하다.", "일반적으로 사토보다 식토에서 근계가 깊게 발달하는 경향이 있다."], "answer": 1, "explain": "· 건조지 수목은 뿌리를 많이 만들어 지상부/지하부 비율이 낮다.\n· 낙우송·자작나무는 천근성, 소나무는 심근성, 근계는 사토에서 더 깊다.\n중요도: ★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-7", "subject": "조림", "num": 7, "part": 6, "stem": "모수림작업에 대한 설명으로 옳지 않은 것은?", "options": ["토양 침식과 표토 유실 등이 우려된다.", "모수 수종 선택에 제한을 받는다.", "벌채가 까다롭고 어린나무에 손상을 줄 수 있다.", "벌채가 일시에 집중되어 경비가 절약된다."], "answer": 2, "explain": "· 모수림작업은 벌채가 간단하다.\n· '벌채가 까다롭고 어린나무 손상'은 산벌·택벌작업의 단점.\n중요도: ★★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-8", "subject": "조림", "num": 8, "part": 6, "stem": "덩굴제거(vine cutting)에 대한 설명으로 옳지 않은 것은?", "options": ["덩굴식물이 수관을 덮어 생육에 장애를 주고, 줄기를 감아 잘록 해지면 목재가치가 떨어진다.", "산림 내 덩굴식물에는 다래, 머루, 마삭줄, 으아리 등이 있다.", "칡의 경우 주두부나 줄기에 약제를 주입하여 처리한다.", "임관이 형성된 후에는 실시하지 않는다."], "answer": 3, "explain": "덩굴은 임관이 형성된 뒤에도 피해가 있으면 제거한다.\n중요도: ★★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-9", "subject": "조림", "num": 9, "part": 6, "stem": "산림 갱신 작업종에 대한 설명으로 옳은 것은?", "options": ["교호대상개벌법은 전임분을 3개의 조로 나누고, 다시 각 조는 3개의 대로 구분한다.", "군상개벌천연하종갱신은 지형이 불규칙하고 험준하며, 일제성이 없는 동령림에 적용한다.", "산벌작업에서 예비벌은 1회, 하종벌은 3회의 벌채로 목적을 달성하는 것이 바람직하다.", "보잔모수법은 모수림작업법보다 모수의 수를 적게 남겨 품질 좋은 대경재 생산을 목적으로 한다."], "answer": 1, "explain": "· 군상개벌천연하종갱신 설명이 옳다.\n· 교호대상개벌은 2개 조, 산벌의 예비벌·하종벌은 1회씩이고, 보잔모수법은 모수를 더 많이 남긴다.\n중요도: ★★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-10", "subject": "조림", "num": 10, "part": 6, "stem": "Oliver(1981)는 교란 이후의 산림천이에 대해 4단계의 임분 발달 모델을 제시하였다. 다음 현상이 모두 나타나는 임분 발달 단계는?\n\n○ 수관이 울폐됨\n\n○ 피압된 치수는 고사함\n\n○ 수목 갱신은 제한되거나 정지함", "options": ["임분 시작(임분 이입기)", "수간 배제(수관 경쟁기)", "하층 재진입(하층 재형성기)", "노령림(장령기)"], "answer": 1, "explain": "울폐·피압 치수 고사·갱신 정지 = Oliver의 수간 배제(수관 경쟁)기.\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-11", "subject": "조림", "num": 11, "part": 6, "stem": "산림천이 용어에 대한 설명으로 옳지 않은 것은?", "options": ["교란: 산불, 바람, 병해충, 개벌 등 기존 생태계를 파괴하는 외부 요인에 의한 사건", "천이계열: 초기 식생이 극상군집까지 지속적인 변화 과정을 거치는 일련의 천이단계", "이차천이: 식물군집이 있던 곳에 교란으로 식물군집이 훼손된 후 다시 시작되는 천이", "자발천이: 생태계 내의 생물상이 없는 곳에서 외부 요인에 의해 유발되는 천이"], "answer": 3, "explain": "외부 요인으로 유발되는 천이는 타발천이. 자발천이는 생물 자체의 작용으로 일어난다.\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-12", "subject": "조림", "num": 12, "part": 6, "stem": "산림생태계 복원 관련 용어에 대한 설명으로 옳은 것은?", "options": ["대체(replacement): 현재의 상태를 개선하기 위하여 다른 생태계로 변화시키는 행위", "향상(enhancement): 환경 피해를 완화하기 위한 행위", "개조(remediation): 최소 과거 50년 동안 산림이 없는 지역에 산림을 조성하는 것", "복원(restoration): 환경의 피해를 멈추거나 교정하여 생태계를 좋게 만드는 행위"], "answer": 0, "explain": "· 대체(replacement) 정의가 옳다.\n· 나머지는 용어와 정의를 서로 바꿔 놓았다.\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-13", "subject": "조림", "num": 13, "part": 6, "stem": "임목 종자 발아에 대한 설명으로 옳은 것은?", "options": ["소나무는 빛이 있을 때보다 없을 때 발아가 촉진된다.", "아브시스산은 지베렐린 생산을 촉진하여 발아율을 높인다.", "잣나무와 목련은 가을에 파종하면 발아가 촉진된다.", "박달나무는 상수리나무보다 발아율과 효율이 높다."], "answer": 2, "explain": "잣나무·목련 등 휴면이 깊은 종자는 가을 파종(또는 노천매장)이 유리. 소나무는 광발아, ABA는 발아 억제, 박달나무는 발아율이 낮다.\n중요도: ★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-14", "subject": "조림", "num": 14, "part": 6, "stem": "수목의 수분생리에 대한 설명으로 옳지 않은 것은?", "options": ["팽압은 세포의 확장, 기공 개폐, 어린잎의 모양을 유지하는 데 필요하다.", "수분퍼텐셜은 물이 이동하는 데 사용할 수 있는 에너지의 양을 뜻한다.", "세포의 물은 삼투현상에 의해 용질의 농도가 낮은 곳에서 높은 곳으로 이동한다.", "수분퍼텐셜은 잎이 가장 높고, 줄기가 중간이고, 뿌리가 가장 낮다."], "answer": 3, "explain": "수분퍼텐셜은 토양 > 뿌리 > 줄기 > 잎 순으로 낮아진다(잎이 가장 낮음).\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-15", "subject": "조림", "num": 15, "part": 6, "stem": "활엽수종의 열매 분류에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 견과는 2개 또는 여러 개의 심피가 유합하여 1실 또는 여러 실로 된 자방을 만들고 각 심피에 종자가 붙어 있다.\n\nㄴ. 삭과는 과피가 목질 또는 혁질로 되어 있으며, 그 안에 1개의 종자가 들어 있으나 과피와 종자가 밀착하지 않는다.\n\nㄷ. 시과는 과피가 발달하여 날개처럼 된 것을 말하며, 물푸레 나무가 이에 해당된다.\n\nㄹ. 장과는 과피가 3개의 층으로 뚜렷이 나누어진다.", "options": ["ㄷ", "ㄱ, ㄴ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ"], "answer": 0, "explain": "· ㄷ(시과–물푸레나무)만 옳다.\n· ㄱ은 삭과, ㄴ은 견과 설명이며, 과피 3층이 뚜렷한 것은 핵과.\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-16", "subject": "조림", "num": 16, "part": 6, "stem": "묘포 적지 선정 기준에 대한 설명으로 옳은 것은?", "options": ["일반적으로 토심이 깊고, 부식질이 많은 사질양토가 좋다.", "침엽수종을 위한 토양은 알칼리성(pH 7.0 이상)이 적당하다.", "관수와 배수를 고려하면 10 ° 이상의 경사지가 좋다.", "따뜻한 남쪽 지방에서는 남향이 적합하다."], "answer": 0, "explain": "묘포는 토심 깊고 부식질 많은 사질양토. 침엽수는 약산성(pH 5~6), 경사는 5° 이하 완경사, 남쪽 지방은 북향이 알맞다.\n중요도: ★★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-17", "subject": "조림", "num": 17, "part": 6, "stem": "산벌작업의 장점만을 모두 고르면?\n\nㄱ. 갱신되는 임분의 유전적 형질을 개량할 수 있다.\n\nㄴ. 성숙한 임목의 보호 아래에서 동령림이 갱신될 수 있는 방법이다.\n\nㄷ. 천연갱신으로 진행할 때 갱신기간이 길어진다.\n\nㄹ. 윤벌기가 끝나기 전에 갱신이 이미 시작되어 윤벌기간을 단축할 수 있다.", "options": ["ㄱ, ㄴ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ"], "answer": 2, "explain": "ㄱ·ㄴ·ㄹ이 장점. 갱신기간이 길어지는 것(ㄷ)은 장점이 아니다.\n중요도: ★★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-18", "subject": "조림", "num": 18, "part": 6, "stem": "자연전지에 대한 설명으로 옳은 것은?", "options": ["임분밀도가 높을수록 자연적으로 고사하는 가지가 굵어진다.", "소나무는 한랭 건조한 북부 지역보다 온난 다습한 남부 지역에서 고사지의 탈락이 빠르다.", "잔지의 매입은 줄기의 직경 생장속도보다 잔지의 굵기와 상관이 높다.", "밑가지의 고사 속도는 주로 임분의 후기 밀도와 관련이 깊다."], "answer": 1, "explain": "공식 정답 ②. 밀도가 높을수록 고사지는 가늘어진다.\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-19", "subject": "조림", "num": 19, "part": 6, "stem": "다음 순환택벌 모식도에 적용된 회귀년(가)과 윤벌기(나)를 바르게 연결한 것은? (단, 모식도의 숫자는 수령을 의미한다)\n\n임분 A | 임분 B | 임분 C | 임분 D | 임분 E\n1, 6, 11, 16, 21, 26 | 2, 7, 12, 17, 22, 27 | 3, 8, 13, 18, 23, 28 | 4, 9, 14, 19, 24, 29 | 5, 10, 15, 20, 25, 30", "options": ["(가) 5년 · (나) 5년", "(가) 5년 · (나) 6년", "(가) 5년 · (나) 30년", "(가) 30년 · (나) 30년"], "answer": 2, "explain": "임분 A~E가 매년 하나씩 돌아가며 벌채 → 같은 임분은 5년마다(회귀년), 최고 수령 30년(윤벌기).\n중요도: ★★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-20", "subject": "조림", "num": 20, "part": 6, "stem": "우리나라 산림토양에 대한 설명으로 옳은 것은?", "options": ["산림토양은 농경지토양에 비해 용적밀도가 높다.", "갈색산림토양군은 화강암과 사암 모재에서 유래한다.", "토양 내 식물유효수분 함량은 사토보다 1]. 정답 ①.\n중요도: ★★★", "ref": "", "exam": "2025 임업경영"}]}, {"name": "2024 조림", "year": "2024", "subject": "조림", "questions": [{"id": "9급-2024-조림-1", "subject": "조림", "num": 1, "part": 6, "stem": "채종원의 조성과 관리에 대한 설명으로 옳은 것은?", "options": ["채종원 주위에 다른 수종으로 방풍림을 조성하는 것은 바람직하지 않다.", "같은 클론을 이웃하여 식재하는 것은 바람직하지 않다.", "외부 화분과의 수정을 유도하기 위해 동종 임분과 가까운 거리에 위치해야 한다.", "채종원은 무성증식된 개체가 아닌 종자에 의한 실생묘로만 조성해야 한다."], "answer": 1, "explain": "· 같은 클론이 이웃하면 근친교배가 일어나므로 피한다.\n· 채종원은 외부 화분을 막도록 동종 임분과 격리하고, 방풍림 조성은 바람직하며, 접목(무성증식) 클론으로도 조성한다.\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-2", "subject": "조림", "num": 2, "part": 6, "stem": "나무가 병에 감염되었을 때 관찰되는 표징이 아닌 것은?", "options": ["가지에 나타나는 마름 증상", "잎에 형성된 자낭각", "가루 모양의 분생포자경", "흰색의 균사매트"], "answer": 0, "explain": "· 가지 마름은 기주의 반응인 병징이다.\n· 자낭각·분생포자경·균사매트는 병원체 자체가 보이는 표징.\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-3", "subject": "조림", "num": 3, "part": 6, "stem": "(가)와 (나)에 들어갈 내용을 바르게 연결한 것은?\n\n하나의 꽃에 암술과 수술이 함께 있는 꽃을 (가) 라고 하며, 그 예로 (나) 가 있다.", "options": ["(가) 단성화 · (나) 소나무", "(가) 단성화 · (나) 벚나무", "(가) 양성화 · (나) 벚나무", "(가) 양성화 · (나) 소나무"], "answer": 2, "explain": "암술·수술이 한 꽃에 있으면 양성화(예: 벚나무). 소나무는 암수한그루의 단성화.\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-4", "subject": "조림", "num": 4, "part": 6, "stem": "다음에서 설명하는 수목병은?\n\n○ 병원균: Raffaelea quercus-mongolicae\n\n○ 매개충: 광릉긴나무좀\n\n○ 병징: 매개충의 침입을 받은 나무줄기 하단부에서 관찰되는 나무 부스러기\n\n○ 방제법: 고사목은 벌채 후 훈증 처리", "options": ["참나무 시들음병", "모잘록병", "밤나무 줄기마름병", "벚나무 빗자루병"], "answer": 0, "explain": "*Raffaelea* 균 + 광릉긴나무좀 + 줄기 밑동의 목분(나무 부스러기) = 참나무 시들음병. 고사목은 벌채 후 훈증.\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-5", "subject": "조림", "num": 5, "part": 6, "stem": "다음 중 뿌리의 나이가 2년생인 묘목만을 모두 고르면?\n\nㄱ. C1/1묘\n\nㄴ. 1－1묘\n\nㄷ. 0/2묘\n\nㄹ. 2－2묘\n\nㅁ. 2/3묘", "options": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄷ, ㄹ", "ㄹ, ㅁ"], "answer": 1, "explain": "'-'는 이식, '/'는 단근. 1-1묘(파종상 1년+이식 1년)와 0/2묘(줄기 0년·뿌리 2년)가 뿌리 나이 2년. 2-2묘는 4년, 2/3묘는 뿌리 3년.\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-6", "subject": "조림", "num": 6, "part": 6, "stem": "임목의 교잡육종에 대한 설명으로 옳은 것은?", "options": ["현사시나무는 은백양과 수원사시나무의 교잡종이다.", "리기테다소나무는 생장이 빠른 리기다소나무와 내한성이 강한 테다소나무의 교잡종이다.", "잡종강세의 유도는 교잡육종의 목표가 될 수 없다.", "종 간 교잡을 의미하고 품종 간의 교잡은 의미하지 않는다."], "answer": 0, "explain": "현사시 = 은백양 × 수원사시. 리기테다는 내한성 강한 리기다 × 생장 빠른 테다(②는 거꾸로). 잡종강세는 교잡육종의 주목표이고, 품종 간 교잡도 포함.\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-7", "subject": "조림", "num": 7, "part": 6, "stem": "다음 조건을 가진 소나무 파종상 1,000㎡당 파종량[kg]은?\n\n○ 단위면적당 잔존본수: 800본/㎡\n\n○ 1 g당 종자수: 200개\n\n○ 발아율: 80 %\n\n○ 종자효율: 80 %\n\n○ 득묘율: 50 %", "options": ["1.0", "1.25", "10.0", "12.5"], "answer": 2, "explain": "W = (1,000 × 800) / (200 × 0.8 × 0.8 × 0.5) = 12,500g = 12.5kg\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-8", "subject": "조림", "num": 8, "part": 6, "stem": "임목의 유전과 육종에 대한 설명으로 옳지 않은 것은?", "options": ["수형목은 임목의 표현형이 아닌 유전형을 바탕으로 선발해야 한다.", "차대검정은 선발한 양친수의 유전적 특성을 자손의 형질 조사로 검정하는 것이다.", "유전획득량은 유전력과 선발차의 곱으로 나타낼 수 있다.", "산지시험은 조림 대상 지역의 기후, 풍토 등에 적합한 산지를 선택할 목적으로 실시한다."], "answer": 0, "explain": "수형목은 표현형으로 먼저 선발한 뒤 차대검정으로 유전형을 확인한다.\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-9", "subject": "조림", "num": 9, "part": 6, "stem": "다음 중 파종 시 조파(줄뿌림)하는 수종만을 모두 고르면?\n\nㄱ. Quercus acutissima\n\nㄴ. Alnus japonica\n\nㄷ. Zelkova serrata\n\nㄹ. Larix kaempferi\n\nㅁ. Fraxinus mandshurica", "options": ["ㄱ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㅁ", "ㄹ, ㅁ"], "answer": 2, "explain": "느티나무(*Zelkova serrata*)·물푸레나무(*Fraxinus*)는 줄뿌림. 상수리나무(*Quercus acutissima*)는 점뿌림, 오리나무(*Alnus*)·낙엽송(*Larix*)은 흩어뿌림.\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-10", "subject": "조림", "num": 10, "part": 6, "stem": "산림유전자원의 보전 방법에 대한 설명으로 옳지 않은 것은?", "options": ["자연보호구 지정은 현지 내 보전(in situ conservation)에 해당한다.", "현지 외 보전(ex situ conservation)은 자연 생육지 이외의 장소에서 보전하는 방법이다.", "현지 내 보전 방법으로는 대규모의 종 내 다양성을 보전할 수 없다.", "유전자은행 운영은 현지 외 보전에 해당한다."], "answer": 2, "explain": "현지 내 보전은 넓은 자생지를 보호하므로 대규모 종내 다양성 보전에 유리하다.\n중요도: ★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-11", "subject": "조림", "num": 11, "part": 6, "stem": "다음 중 삽목 발근이 상대적으로 어려운 수종만을 고르면?", "options": ["향나무, 은행나무", "비자나무, 버드나무", "삼나무, 낙엽송", "전나무, 자작나무"], "answer": 3, "explain": "· 전나무·자작나무는 삽목 발근이 어렵다.\n· 향나무·버드나무·삼나무 등은 쉬운 편.\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-12", "subject": "조림", "num": 12, "part": 6, "stem": "숲의 인위적 피해에 대한 설명으로 옳은 것은?", "options": ["산불이 발생하면 토양의 투수성이 증가하여 토양 침식이 심해진다.", "산성비는 pH 5.6 이하의 빗물을 말하며, 토양 미생물의 유기물 분해 활동이 촉진된다.", "대기오염에 의한 수목의 불가시적 피해로 생장과 결실의 불량이 초래된다.", "지구온난화가 산림생태에 미치는 영향은 특히 열대림에서 가장 심할 것으로 예측된다."], "answer": 2, "explain": "· 불가시적 피해로 생장·결실이 나빠진다.\n· 산불 후 투수성은 감소, 산성비는 미생물 분해를 억제, 온난화 영향은 한대림에서 가장 크다.\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-13", "subject": "조림", "num": 13, "part": 6, "stem": "벌채작업에 대한 설명으로 옳지 않은 것은?", "options": ["산벌작업은 종자가 커서 멀리 날아가지 못하는 수종에는 부적합하다.", "왜림작업은 기상, 병해충 등 외부인자에 대한 저항력이 비교적 크다.", "중림작업의 하층임목은 소경재 생산을 목적으로 한다.", "택벌작업은 면적이 작은 숲에서 보속생산을 하는 데 적당하다."], "answer": 0, "explain": "· 산벌작업은 종자가 무거워 멀리 날지 못하는 수종(참나무류 등)에 알맞은 갱신법이다.\n· ①이 틀린 지문. (이전 자체풀이 ②는 오답이었음)\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-14", "subject": "조림", "num": 14, "part": 6, "stem": "간벌(솎아베기) 작업에 대한 설명으로 옳지 않은 것은?", "options": ["Hawley의 택벌식 간벌은 우세목을 벌채하여 그 아래에 자라는 나무의 생육을 촉진하는 간벌형식이다.", "데라사끼(寺崎)의 간벌은 수관급 구분에 의하지 않고 임목 간 거리를 대상으로 한 간벌 방법이다.", "정성간벌은 줄기의 형태와 수관의 특성으로 구분되는 수관급 또는 수형급을 바탕으로 간벌목을 선정하는 방법이다.", "도태간벌은 조림수종 외에 다른 수종이 많이 혼효되어 정량간벌이나 열식간벌이 어려운 산림에도 적용할 수 있다."], "answer": 1, "explain": "데라사끼 간벌은 수관급(1~5급) 구분에 따라 A~E종으로 간벌한다.\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-15", "subject": "조림", "num": 15, "part": 6, "stem": "다음 중 풀베기에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 모두베기는 주로 음수에 적용된다.\n\nㄴ. 둘레베기는 현장에서 가장 흔히 적용되는 방법이다.\n\nㄷ. 줄베기는 묘목을 한풍해(寒風害)로부터 보호할 수 있다.\n\nㄹ. 한해ㆍ풍해의 위험성이 있는 지역에서는 9월 이후 풀베기를 하지 않는 것이 좋다.", "options": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄷ, ㄹ"], "answer": 3, "explain": "· ㄷ·ㄹ이 옳다.\n· 모두베기는 양수, 현장에서 가장 흔한 것은 줄베기.\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-16", "subject": "조림", "num": 16, "part": 6, "stem": "가지치기에 대한 설명으로 옳지 않은 것은?", "options": ["산 가지의 제거는 생장휴지기인 11월 ～ 2월에 실시하는 것이 좋다.", "소나무, 잣나무, 낙엽송, 편백 등의 목재생산 수종을 대상으로 실시한다.", "아랫부분부터 수관의 30 ～ 70 %까지 제거해도 수고생장에는 큰 영향이 미치지 않는다.", "생산력이 떨어지는 아랫가지가 줄기생장을 감소시키지 않는다면 가지치기를 생략하는 것이 좋다."], "answer": 3, "explain": "· 목재생산림의 가지치기는 옹이 없는 무절재 생산이 목적이므로 아랫가지가 생장을 해치지 않아도 실시한다.\n· ④가 틀린 지문. (이전 자체풀이 ③은 오답이었음)\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-17", "subject": "조림", "num": 17, "part": 6, "stem": "우리나라 기후대별 조림 수종으로 적합하지 않은 것은?", "options": ["온대 북부 － Abies holophylla", "온대 중부 － Machilus thunbergii", "온대 남부 － Pinus densiflora", "난대 － Chamaecyparis obtusa"], "answer": 1, "explain": "*Machilus thunbergii*(후박나무)는 난대 수종. 전나무(*Abies holophylla*)–온대 북부, 소나무–온대 남부, 편백(*Chamaecyparis obtusa*)–난대는 맞다.\n중요도: ★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-18", "subject": "조림", "num": 18, "part": 6, "stem": "시설양묘와 용기묘에 대한 설명으로 옳은 것은?", "options": ["용기묘의 현지 수송과 묘목 운반은 노지묘에 비해 비교적 용이하다.", "용기묘는 순화과정을 생략하고 조림지로 바로 반출해야 한다.", "시설온실 내에서 용기묘를 월동시킬 경우에는 관수를 실시하지 않는다.", "시설양묘는 노지양묘에 비해 단기에 대량생산이 가능하고 묘목의 굴취가 생략된다."], "answer": 3, "explain": "· 시설양묘는 단기 대량생산이 가능하고 굴취가 필요 없다.\n· 용기묘는 부피가 커 운반이 불리하고, 반출 전 순화(경화) 과정이 필요하며, 월동 중에도 관수한다.\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-19", "subject": "조림", "num": 19, "part": 6, "stem": "수목의 구조와 직경생장에 대한 설명으로 옳지 않은 것은?", "options": ["형성층은 세포분열을 통하여 바깥쪽으로 2차사부, 안쪽으로 2차목부를 생산한다.", "사세포는 나자식물의 사부조직을 구성하는 기본세포로서 탄수화물을 운반하는 기능을 한다.", "생리적으로 체내 옥신 함량이 높고 지베렐린 농도가 낮으면 사부를 생산하는 것으로 알려져 있다.", "늦가을이 되면 제일 먼저 수간의 밑동에서부터 끝부분을 향해 형성층이 활동을 멈춘다."], "answer": 2, "explain": "옥신이 높고 지베렐린이 낮으면 목부를 만든다.\n중요도: ★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-20", "subject": "조림", "num": 20, "part": 6, "stem": "다음 중 직파조림이 용이한 수종만을 모두 고르면?\n\nㄱ. 소나무\n\nㄴ. 전나무\n\nㄷ. 가래나무\n\nㄹ. 분비나무\n\nㅁ. 상수리나무", "options": ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㅁ", "ㄴ, ㄷ, ㄹ", "ㄴ, ㄹ, ㅁ"], "answer": 1, "explain": "소나무·가래나무·상수리나무가 직파 용이. 전나무·분비나무는 어렵다.\n중요도: ★★", "ref": "", "exam": "2024 조림"}]}, {"name": "2024 임업경영", "year": "2024", "subject": "임업경영", "questions": [{"id": "9급-2024-임업경영-1", "subject": "임업경영", "num": 1, "part": 6, "stem": "임분생장의 특성에 대한 설명으로 옳지 않은 것은?", "options": ["임분은 생장 과정에서 자체 경쟁에 의하여 자연적으로 본수가 감소된다.", "임분의 직경이나 수고의 평균값은 인위적으로 조절되지 않는다.", "지위가 높을수록 흉고직경이나 수고가 크게 마련이다.", "임분의 단위면적당 흉고단면적 및 재적은 간벌 후에는 감소되었다가 생장에 의하여 다음 주기까지 다시 증가하는 형태를 보인다."], "answer": 1, "explain": "간벌로 작은 나무를 제거하면 평균 직경·수고가 달라지므로 인위적으로 조절된다.\n중요도: ★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-2", "subject": "임업경영", "num": 2, "part": 6, "stem": "선형계획법에서 선형계획모형의 전제조건에 해당하지 않는 것은?", "options": ["비례성", "확률성", "분할성", "제한성"], "answer": 1, "explain": "선형계획 전제는 비례성·부가성·분할성·제한성·선형성·확정성. 확률성은 해당 없음.\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-3", "subject": "임업경영", "num": 3, "part": 6, "stem": "벌채목의 재적측정 방법 중 중앙단면적에 가중치를 부여하여 계산 하는 재적공식은?", "options": ["Brereton 식", "Newton 식", "Smalian 식", "Huber 식"], "answer": 1, "explain": "Newton식 V = L/6 × (g₀ + 4gₘ + gₙ) — 중앙단면적에 4배 가중치.\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-4", "subject": "임업경영", "num": 4, "part": 6, "stem": "산림교육의 활성화에 관한 법률 상 산림교육전문가에 해당하지 않는 것은?", "options": ["숲해설가", "유아숲지도사", "숲길등산지도사", "산림치유지도사"], "answer": 3, "explain": "산림교육전문가는 숲해설가·유아숲지도사·숲길등산지도사. 산림치유지도사는 산림복지법상 자격.\n중요도: ★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-5", "subject": "임업경영", "num": 5, "part": 6, "stem": "산림경영계획서 작성에 있어서 다음 조건의 B층 토양건습도는? 손으로 꽉 쥐었을 때 손바닥 전체에 습기가 묻고 물에 대한 감촉이 뚜렷함", "options": ["약건", "적윤", "약습", "습"], "answer": 1, "explain": "학습모듈(산림경영 p.56) 건습도표: 적윤 = 손바닥 전체에 습기가 묻고 물에 대한 감촉이 뚜렷함. 약습은 손가락 사이에 물기가 비치는 정도. (이전 자료의 '약습'은 오답이었음)\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-6", "subject": "임업경영", "num": 6, "part": 6, "stem": "동령림과 이령림의 임분구조에 대한 설명으로 옳지 않은 것은?", "options": ["동령림은 임령이 증가할수록 평균직경급으로 집중 정도가 강해져 직경급 분포가 점차 좁아지는 형태를 보인다.", "동령림이       h("label", { class: "chip" }, h("input", { type: "radio", name: "elective", value: s.name, checked: i === 0 }), s.name))),
    h("div", { class: "row", style: "margin-top:10px" },
      h("label", { class: "chip" }, h("input", { type: "radio", name: "pool", value: "mix", checked: true }), "전체에서 무작위"),
      h("label", { class: "chip" }, h("input", { type: "radio", name: "pool", value: "1" }), "기본 1~20번 고정")),
    h("div", { style: "margin-top:14px" }, h("button", { class: "primary", onclick: startExam }, "시작")),
  );

  const practiceCard = h("div", { class: "card" },
    h("h2", {}, "과목별 연습"),
    h("p", { class: "muted" }, "한 문제씩 풀고 바로 정답과 해설 확인"),
    h("div", { class: "row" },
      h("select", { id: "pSubject" }, ...DATA.map(s => h("option", { value: s.name }, `${s.name} (${s.kind})`))),
      h("select", { id: "pPart" },
        h("option", { value: "0" }, "전체 파트"), h("option", { value: "1" }, "Part 1 기본"),
        h("option", { value: "2" }, "Part 2 심화"), h("option", { value: "3" }, "Part 3 참고자료"), h("option", { value: "4" }, "Part 4 산림기사 기출"), h("option", { value: "5" }, "Part 5 법령·지침 원문")),
      h("label", { class: "chip" }, h("input", { type: "checkbox", id: "pShuffle", checked: true }), "섞기")),
    h("div", { style: "margin-top:14px" }, h("button", { class: "primary", onclick: startPractice }, "시작")),
  );

  const nPublic = PUBLIC.reduce((n, s) => n + s.questions.length, 0);
  const publicCard = h("div", { class: "card" },
    h("h2", {}, `2021 공개문제 ${nPublic}제`),
    h("p", { class: "muted" }, "산림조합중앙회가 공개한 유일한 실제 출제 형식 문제 · 원문 보기(가~라) 그대로 · 공식 정답표가 없어 학습모듈 근거로 푼 해설(⚠️ 표시는 확인 필요)"),
    h("div", { class: "row" },
      h("select", { id: "pubSubject" }, h("option", { value: "" }, `전 과목 (${nPublic}문항)`),
        ...PUBLIC.map(s => h("option", { value: s.name }, `${s.name} (${s.questions.length}문항)`))),
      h("label", { class: "chip" }, h("input", { type: "checkbox", id: "pubShuffle" }), "섞기")),
    h("div", { style: "margin-top:14px" }, h("button", { class: "primary", onclick: startPublic }, "시작")),
  );

  const nGm = GONGMU.reduce((n, s) => n + s.questions.length, 0);
  const gmCount = subj => GONGMU.filter(s => s.subject === subj).reduce((n, s) => n + s.questions.length, 0);
  const gongmuCard = h("div", { class: "card" },
    h("h2", {}, `국가직 9급 조림·임업경영 기출 ${nGm}제`),
    h("p", { class: "muted" }, "2024~2026 국가공무원 9급 시험지 원문 · 인사혁신처 공식 정답 · 학습모듈 기준 해설과 중요도(★)"),
    h("div", { class: "row" },
      h("select", { id: "gmSet" },
        h("option", { value: "" }, `전체 (${nGm}문항)`),
        h("option", { value: "subj:조림" }, `조림 전 회차 (${gmCount("조림")}문항)`),
        h("option", { value: "subj:임업경영" }, `임업경영 전 회차 (${gmCount("임업경영")}문항)`),
        ...GONGMU.map(s => h("option", { value: s.name }, `${s.name} (${s.questions.length}문항)`))),
      h("label", { class: "chip" }, h("input", { type: "checkbox", id: "gmShuffle" }), "섞기")),
    h("div", { style: "margin-top:14px" }, h("button", { class: "primary", onclick: startGongmu }, "시작")),
  );

  const w = wrongSet();
  const wrongCard = h("div", { class: "card" },
    h("h2", {}, "오답노트"),
    h("p", { class: "muted" }, `저장된 오답 ${w.size}문항 · 맞히면 목록에서 빠집니다`),
    h("div", { class: "row" },
      h("button", { class: "primary", disabled: w.size === 0, onclick: () => startWrong() }, "오답 다시 풀기"),
      h("button", { disabled: w.size === 0, onclick: () => { if (confirm("오답노트를 비울까요?")) { saveWrong(new Set()); home(); } } }, "비우기")),
  );

  app.append(h("div", { class: "grid" }, examCard, practiceCard), publicCard, gongmuCard, wrongCard);

  const hist = store.get("history", []);
  if (hist.length) {
    app.append(h("div", { class: "card" }, h("h2", {}, "최근 모의고사 기록"),
      h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "날짜"), h("th", {}, "선택"), h("th", {}, "점수"), h("th", {}, "판정"))),
        h("tbody", {}, ...hist.slice(-8).reverse().map(r => h("tr", {},
          h("td", {}, r.date), h("td", {}, r.elective), h("td", {}, `${r.avg.toFixed(1)}점`),
          h("td", {}, h("span", { class: "pill " + (r.pass ? "ok" : "no") }, r.pass ? "통과" : r.fail || "미달"))))))));
  }
}

/* ---------- 실전 ---------- */
function startExam() {
  const elective = document.querySelector("input[name=elective]:checked").value;
  const pool = document.querySelector("input[name=pool]:checked").value;
  const subjects = DATA.filter(s => s.kind === "필수" || s.name === elective);
  const sections = subjects.map(s => {
    const qs = pool === "1" ? s.questions.filter(q => q.part === 1) : shuffle(s.questions).slice(0, PER_SUBJECT).sort((a, b) => a.num - b.num);
    return { name: s.name, qs };
  });
  state = { mode: "exam", elective, sections, picks: {}, tab: 0, deadline: Date.now() + EXAM_MIN * 60000 };
  renderExam();
  timerId = setInterval(tick, 1000);
}
function tick() {
  const el = document.getElementById("timer");
  if (!el || !state) return;
  const left = Math.max(0, state.deadline - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
  el.textContent = `${String(m).padStart(3, " ")}:${String(s).padStart(2, "0")}`;
  el.classList.toggle("low", left < 10 * 60000);
  if (left === 0) { clearInterval(timerId); alert("시험 시간이 끝났습니다. 자동 채점합니다."); gradeExam(); }
}
function renderExam() {
  app.replaceChildren();
  const answered = Object.keys(state.picks).length;
  const totalQ = state.sections.reduce((n, s) => n + s.qs.length, 0);
  app.append(h("div", { class: "topbar" }, h("div", { class: "inner" },
    h("div", {}, h("span", { class: "timer", id: "timer" }, ""), h("span", { class: "muted", style: "margin-left:10px" }, `${answered}/${totalQ} 표기`)),
    h("div", { class: "row" },
      h("button", { onclick: () => { if (confirm("시험을 그만두고 처음으로 갈까요?")) home(); } }, "나가기"),
      h("button", { class: "primary", onclick: () => { if (answered < totalQ && !confirm(`${totalQ - answered}문항이 비어 있습니다. 제출할까요?`)) return; gradeExam(); } }, "제출")))));

  app.append(h("div", { class: "tabs" }, ...state.sections.map((s, i) => {
    const done = s.qs.filter(q => q.id in state.picks).length;
    return h("button", { class: i === state.tab ? "on" : "", onclick: () => { state.tab = i; renderExam(); window.scrollTo(0, 0); } }, `${s.name} ${done}/${s.qs.length}`);
  })));

  const sec = state.sections[state.tab];
  const omr = h("div", { class: "omr" }, ...sec.qs.map((q, i) =>
    h("button", { class: q.id in state.picks ? "done" : "", onclick: () => document.getElementById("q-" + q.id).scrollIntoView({ behavior: "smooth", block: "center" }) },
      `${i + 1}${q.id in state.picks ? " " + MARKS[state.picks[q.id]] : ""}`)));
  app.append(h("div", { class: "card" }, h("div", { class: "muted" }, "답안 표기 현황"), omr));

  app.append(h("div", { class: "card" }, ...sec.qs.map((q, i) => h("div", { class: "q", id: "q-" + q.id },
    h("div", { class: "stem" }, `${i + 1}. ${q.stem}`, h("span", { class: "tag" }, `${partLabel(q.part)} #${q.num}`)),
    ...q.options.map((o, k) => h("button", { class: "opt" + (state.picks[q.id] === k ? " sel" : ""),
      onclick: () => { state.picks[q.id] = k; const y = window.scrollY; renderExam(); window.scrollTo(0, y); } }, `${MARKS[k]} ${o}`))))));

  const nav = h("div", { class: "row" });
  if (state.tab > 0) nav.append(h("button", { onclick: () => { state.tab--; renderExam(); window.scrollTo(0, 0); } }, "← 이전 과목"));
  if (state.tab < state.sections.length - 1) nav.append(h("button", { class: "primary", onclick: () => { state.tab++; renderExam(); window.scrollTo(0, 0); } }, "다음 과목 →"));
  app.append(nav);
  tick();
}
function gradeExam() {
  clearInterval(timerId);
  const rows = state.sections.map(s => {
    const right = s.qs.filter(q => state.picks[q.id] === q.answer).length;
    return { name: s.name, right, n: s.qs.length, score: right / s.qs.length * 100 };
  });
  const avg = rows.reduce((a, r) => a + r.score, 0) / rows.length;
  const cut = rows.filter(r => r.score < 40);
  const pass = cut.length === 0 && avg >= 60;
  recordAnswers(state.sections.flatMap(s => s.qs.map(q => ({ q, picked: state.picks[q.id] }))));
  const hist = store.get("history", []);
  hist.push({ date: new Date().toLocaleDateString("ko-KR"), elective: state.elective, avg, pass,
    fail: cut.length ? `과락 ${cut.map(r => r.name).join("·")}` : avg < 60 ? "평균 미달" : "" });
  store.set("history", hist.slice(-30));
  state.result = { rows, avg, pass, cut };
  state.mode = "review";
  renderResult(false);
}
function renderResult(onlyWrong) {
  app.replaceChildren();
  const { rows, avg, pass, cut } = state.result;
  app.append(h("h1", {}, "채점 결과"),
    h("div", { class: "card" },
      h("div", { class: "row", style: "justify-content:space-between" },
        h("div", {}, h("div", { class: "muted" }, "평균(가산점 제외)"), h("div", { class: "big" }, `${avg.toFixed(1)}점`)),
        h("span", { class: "pill " + (pass ? "ok" : "no"), style: "font-size:1rem;padding:6px 14px" },
          pass ? "기준 통과" : cut.length ? `과락: ${cut.map(r => r.name).join(", ")}` : "평균 60점 미달")),
      h("p", { class: "muted" }, "실제 합격은 지역별 고득점순(선발인원 130%)이라 기준 통과만으로 합격이 보장되지는 않습니다. 목표는 평균 70점 이상."),
      h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "과목"), h("th", {}, "정답"), h("th", {}, "점수"), h("th", {}, ""))),
        h("tbody", {}, ...rows.map(r => h("tr", {}, h("td", {}, r.name), h("td", {}, `${r.right}/${r.n}`),
          h("td", { style: "min-width:140px" }, h("div", {}, `${r.score.toFixed(0)}점`), h("div", { class: "bar" }, h("span", { style: `width:${r.score}%` }))),
          h("td", {}, h("span", { class: "pill " + (r.score < 40 ? "no" : r.score < 60 ? "warn" : "ok") }, r.score < 40 ? "과락" : r.score < 60 ? "보강" : "양호"))))))),
    h("div", { class: "row", style: "margin-bottom:16px" },
      h("button", { class: onlyWrong ? "" : "primary", onclick: () => renderResult(false) }, "전체 해설"),
      h("button", { class: onlyWrong ? "primary" : "", onclick: () => renderResult(true) }, "틀린 문제만"),
      h("button", { onclick: home }, "처음으로")));
  state.sections.forEach(s => {
    const qs = s.qs.filter(q => !onlyWrong || state.picks[q.id] !== q.answer);
    if (!qs.length) return;
    app.append(h("div", { class: "card" }, h("h2", {}, s.name), ...qs.map(q => reviewBlock(q, state.picks[q.id]))));
  });
  window.scrollTo(0, 0);
}
function reviewBlock(q, picked) {
  return h("div", { class: "q" },
    h("div", { class: "stem" }, `${q.subject} #${q.num}. ${q.stem}`, h("span", { class: "tag" }, partLabel(q.part))),
    ...q.options.map((o, k) => h("div", { class: "opt" + (isRight(q, k) ? " right" : k === picked ? " wrong" : "") }, `${mark(q, k)} ${o}`)),
    h("div", { class: "explain" }, h("strong", {}, `정답 ${(q.accept || [q.answer]).map(k => mark(q, k)).join(" 또는 ")}`), picked == null ? " · 미표기" : isRight(q, picked) ? " · 맞음" : ` · 내 답 ${mark(q, picked)}`,
      h("div", {}, q.explain), h("div", { class: "muted" }, `근거: ${q.ref}`)));
}

/* ---------- 연습 / 오답 ---------- */
function startPractice() {
  const name = document.getElementById("pSubject").value;
  const part = +document.getElementById("pPart").value;
  let qs = DATA.find(s => s.name === name).questions.filter(q => !part || q.part === part);
  if (document.getElementById("pShuffle").checked) qs = shuffle(qs);
  runDrill(qs, `${name}${part ? " · Part " + part : ""}`);
}
function startPublic() {
  const name = document.getElementById("pubSubject").value;
  let qs = PUBLIC.filter(s => !name || s.name === name).flatMap(s => s.questions);
  if (document.getElementById("pubShuffle").checked) qs = shuffle(qs);
  runDrill(qs, `2021 공개문제${name ? " · " + name : ""}`);
}
function startGongmu() {
  const v = document.getElementById("gmSet").value;
  let qs = GONGMU.filter(s => !v || s.name === v || (v.startsWith("subj:") && s.subject === v.slice(5))).flatMap(s => s.questions);
  if (document.getElementById("gmShuffle").checked) qs = shuffle(qs);
  runDrill(qs, `국가직 9급 기출${v ? " · " + v.replace("subj:", "") : ""}`);
}
function startWrong() {
  const qs = shuffle([...wrongSet()].map(id => byId[id]).filter(Boolean));
  runDrill(qs, "오답노트");
}
function runDrill(qs, title) {
  clearInterval(timerId);
  state = { mode: "drill", qs, i: 0, right: 0, title };
  renderDrill(null);
}
function renderDrill(picked) {
  app.replaceChildren();
  const { qs, i, title } = state;
  if (i >= qs.length) {
    app.append(h("h1", {}, `${title} 완료`),
      h("div", { class: "card" }, h("div", { class: "big" }, `${state.right}/${qs.length}`),
        h("p", { class: "muted" }, "틀린 문제는 오답노트에 저장됐습니다."),
        h("div", { class: "row" }, h("button", { class: "primary", onclick: home }, "처음으로"))));
    return;
  }
  const q = qs[i];
  app.append(h("div", { class: "topbar" }, h("div", { class: "inner" },
    h("div", {}, h("strong", {}, title), h("span", { class: "muted", style: "margin-left:10px" }, `${i + 1}/${qs.length} · 정답 ${state.right}`)),
    h("button", { onclick: home }, "그만하기"))));
  const card = h("div", { class: "card" });
  if (picked == null) {
    card.append(h("div", { class: "stem", style: "font-weight:600;margin-bottom:10px;white-space:pre-line" },
      `${q.subject} #${q.num}. ${q.stem}`, h("span", { class: "tag muted" }, ` ${partLabel(q.part)}`)),
      ...q.options.map((o, k) => h("button", { class: "opt", onclick: () => {
        if (isRight(q, k)) state.right++;
        recordAnswers([{ q, picked: k }]);
        renderDrill(k);
      } }, `${mark(q, k)} ${o}`)));
  } else {
    card.append(reviewBlock(q, picked),
      h("div", { style: "margin-top:12px" }, h("button", { class: "primary", onclick: () => { state.i++; renderDrill(null); window.scrollTo(0, 0); } }, i + 1 < qs.length ? "다음 문제" : "결과 보기")));
  }
  app.append(card);
}

home();
</script>
