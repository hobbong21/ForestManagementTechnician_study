ions": ["구조용 직교적층목재(CLT, Cross-Laminated Timber)", "일반 합판", "단판적층재(LVL)", "코르크판"], "answer": 0, "explain": "CLT는 제재목을 서로 직각으로 교차 적층한 차세대 매스팀버(Mass timber) 건축 자재로, 고층 목조건축의 내력벽과 바닥판을 시공할 수 있는 뛰어난 치수안정성과 내화성을 지닙니다.\n쉬운 풀이: CLT는 두꺼운 판재를 결이 직각으로 엇갈리게 층층이 쌓아 붙인 대형 구조재예요. 벽과 바닥판으로 써서 고층 목조건물을 지을 수 있어요. 72번과 같은 내용이에요.\n용어 풀이:\n· CLT(직교적층목재): 직교 적층한 대형 판\n· LVL(단판적층재): 단판을 평행하게 쌓은 재료\n· 매스팀버: 대형 목재 건축 자재", "ref": "목재공학 및 목조건축"}, {"id": "임산가공-98", "subject": "임산가공", "num": 98, "part": 4, "stem": "목재 표면에 도장(도료 칠)을 실시할 때 방부, 방충 및 방수 기능을 하면서도 목재 고유의 나뭇결 무늬를 자연스럽게 살려주는 침투성 외부 도료는?", "options": ["오일스테인(Oil stain)", "락카", "에폭시 퍼티", "타르"], "answer": 0, "explain": "오일스테인은 목재 표면에 두꺼운 도막을 형성하지 않고 내부로 깊숙이 침투하여 통기성을 유지하면서 자외선과 빗물 침투를 차단하는 친환경 목재 보호 도료입니다.\n쉬운 풀이: 오일스테인은 목재 겉에 두꺼운 막을 만들지 않고 속으로 스며들어 보호해요. 그래서 나뭇결이 그대로 보이고 숨도 쉬면서, 자외선·빗물을 막아 데크·울타리에 많이 써요.\n용어 풀이:\n· 오일스테인: 침투형 목재 보호 도료\n· 도막: 칠이 굳어 생긴 막\n· 통기성: 공기가 통하는 성질", "ref": "목재도장학"}, {"id": "임산가공-99", "subject": "임산가공", "num": 99, "part": 4, "stem": "국립산림과학원 침엽수 원목 규격에서 원목의 굽음(곡률도)을 측정하여 백분율(%)로 계산하는 공식으로 옳은 것은?", "options": ["(최대 굽음 깊이 ÷ 양단면을 잇는 재장) × 100", "(말구직경 ÷ 원목 길이) × 100", "(옹이 수 ÷ 재적) × 100", "(원목 무게 ÷ 원목 부피) × 100"], "answer": 0, "explain": "· 원목의 곡률도(%) = (양 마구의 중심을 연결한 직선에서 굽은 활 모양의 가장 깊은 깊이\n· 원목의 재장) × 100으로 산정합니다.\n쉬운 풀이: 원목 굽음 정도(곡률도)는 양 끝 중심을 잇는 직선에서 가장 많이 휜 깊이를 원목 길이로 나눠 %로 나타내요. 곡률도 = (최대 굽음 깊이 ÷ 재장) × 100. 4m 원목이 8cm 휘었다면 2%예요.\n용어 풀이:\n· 곡률도: 굽은 정도를 %로 나타낸 값\n· 재장: 원목 길이\n· 마구: 원목 양 끝 단면", "ref": "목재규격 고시"}, {"id": "임산가공-100", "subject": "임산가공", "num": 100, "part": 4, "stem": "수확된 목재가 건축물, 가구 등에 사용되어 장기간 탄소를 가두어 둠으로써 지구온난화를 방지하는 효과를 정량적으로 인정하는 기후변화협약상의 개념은?", "options": ["수확된 목제품의 탄소저장(HWP, Harvested Wood Products)", "탄소 누출", "바이오 차", "산림 전용"], "answer": 0, "explain": "IPCC 가이드라인에 따른 HWP(수확된 목제품) 탄소계정은 벌채된 목재가 제품으로 사용되는 동안 대기 중으로 탄소를 방출하지 않고 고정하고 있는 양을 국가 온실가스 감축 실적으로 인정하는 제도입니다.\n쉬운 풀이: 벤 나무로 만든 가구·건축재는 쓰는 동안 탄소를 계속 가두고 있어요. 기후변화협약에서는 이 저장량을 HWP(수확된 목제품) 탄소로 인정해 나라의 온실가스 감축 실적에 넣어요.\n용어 풀이:\n· HWP: 수확된 목제품의 탄소저장\n· IPCC: 기후변화에 관한 정부간 협의체\n· 탄소계정: 탄소 흡수·배출을 계산하는 장부", "ref": "기후변화협약 및 탄소흡수원제도"}, {"id": "임산가공-101", "subject": "임산가공", "num": 101, "part": 5, "stem": "목재 플라스틱 복합재(WPC) 바닥판의 품명 표시 방법으로 옳은 것은?", "options": ["WPC(목분 30% 이상)", "WPC(목분 50% 이상)", "WPC(목분 70% 이상)", "WPC(플라스틱 50% 이상)"], "answer": 1, "explain": "· 부속서 4: 품명은 WPC(목분 50% 이상)\n· 규격·시험은 KS F 3230\n· 열가소성 수지 종류, 최대 굴곡하중/지지대 간격, 두께×너비×길이 표시\n쉬운 풀이: WPC(목재 플라스틱 복합재)는 나무 가루(목분)와 플라스틱을 섞어 만든 재료예요. 목분이 50% 이상이어야 'WPC(목분 50% 이상)'로 표시할 수 있어요. 2026 개정 부속서 4 내용이에요.\n용어 풀이:\n· WPC: 목재 플라스틱 복합재\n· 목분: 나무 가루\n· 열가소성 수지: 열을 가하면 녹는 플라스틱", "ref": "목재제품의 규격과 품질기준 부속서 4"}, {"id": "임산가공-102", "subject": "임산가공", "num": 102, "part": 5, "stem": "주거용·소규모 상업용 목재펠릿(A1·A2·B 등급)의 수령 시 함수율 기준은?", "options": ["5% 이하", "10% 이하", "15% 이하", "20% 이하"], "answer": 1, "explain": "· 부속서 11 <표 1>: 전 등급 함수율 ≤10%(습량)\n· 겉보기밀도 ≥600kg/㎥\n· 순발열량 ≥16.5MJ/kg\n쉬운 풀이: 목재펠릿은 모든 등급(A1·A2·B)에서 받을 때 함수율이 10% 이하여야 해요. 물이 많으면 덜 타고 곰팡이가 생기기 때문이에요. 겉보기밀도 600kg/㎥ 이상, 발열량 16.5MJ/kg 이상도 함께 외우세요.\n용어 풀이:\n· 함수율(습량): 젖은 무게 기준 물 비율\n· 수령 시: 받을 때 / MJ\n· kg: 1kg이 낼 수 있는 열량", "ref": "목재제품의 규격과 품질기준 부속서 11"}, {"id": "임산가공-103", "subject": "임산가공", "num": 103, "part": 5, "stem": "주거용 목재펠릿 **A1 등급**의 회분 기준은?", "options": ["0.7% 이하", "1.2% 이하", "2.0% 이하", "3.0% 이하"], "answer": 0, "explain": "· 회분(건량): A1 ≤0.7%\n· A2 ≤1.2%\n· B ≤2.0%\n쉬운 풀이: 재(회분)가 적을수록 좋은 펠릿이에요. 가장 좋은 A1 등급은 0.7% 이하, A2는 1.2% 이하, B는 2.0% 이하예요. '0.7-1.2-2.0'으로 외우세요.\n용어 풀이:\n· 회분: 타고 남은 재\n· 건량: 마른 무게 기준\n· A1 등급: 가장 높은 펠릿 등급", "ref": "목재제품의 규격과 품질기준 부속서 11"}, {"id": "임산가공-104", "subject": "임산가공", "num": 104, "part": 5, "stem": "주거용 목재펠릿의 겉보기밀도 기준은?", "options": ["400kg/㎥ 이상", "500kg/㎥ 이상", "600kg/㎥ 이상", "800kg/㎥ 이상"], "answer": 2, "explain": "· 부속서 11: 수령 시 600kg/㎥ 이상\n· 길이 3.15~40mm, 지름 6±1 또는 8±1mm\n쉬운 풀이: 겉보기밀도는 펠릿을 통에 담았을 때의 무게예요. 600kg/㎥ 이상이어야 단단하게 잘 압축된 펠릿이에요. 크기는 지름 6±1 또는 8±1mm, 길이 3.15~40mm예요.\n용어 풀이:\n· 겉보기밀도: 빈틈 포함 부피당 무게 / kg\n· ㎥: 1㎥당 kg", "ref": "목재제품의 규격과 품질기준 부속서 11"}, {"id": "임산가공-105", "subject": "임산가공", "num": 105, "part": 5, "stem": "목재펠릿·목재칩·숯의 원료로 사용할 수 **있는** 것은?", "options": ["방부처리 목재", "도색·접착 처리된 목재", "건축물에서 해체된 목재", "제재 부산물"], "answer": 3, "explain": "· 부속서 11·12·15 공통: 방부처리·화학처리(접착·도색·침지)·건축물 해체 목재는 사용 불가, 섞이면 혼합량과 관계없이 불가\n· 제재부산물·산지개발 산물 등 오염되지 않은 순수 목재는 사용 가능\n쉬운 풀이: 펠릿·칩·숯 원료로는 오염되지 않은 순수 목재만 써야 해요. 방부처리·도색·접착 처리된 목재나 건물 해체 목재는 태울 때 유해물질이 나와서 조금만 섞여도 사용 불가예요. 제재하고 남은 부산물은 깨끗해서 쓸 수 있어요.\n용어 풀이:\n· 제재 부산물: 제재하고 남은 톱밥·조각\n· 화학처리: 약품으로 처리함\n· 해체 목재: 건물을 부수며 나온 목재", "ref": "목재제품의 규격과 품질기준 부속서 11·12·15"}, {"id": "임산가공-106", "subject": "임산가공", "num": 106, "part": 5, "stem": "나무숯·대나무숯 **1등급**의 고위발열량 기준은?", "options": ["6,200kcal/kg 이상", "7,000kcal/kg 이상", "7,800kcal/kg 이상", "8,500kcal/kg 이상"], "answer": 2, "explain": "· 부속서 15: 1등급 ≥7,800 / 2등급 ≥7,000 / 3등급 ≥6,200kcal/kg\n· 함수율 ≤10%, 회분 ≤5.5%\n쉬운 풀이: 숯 등급은 태울 때 나오는 열(고위발열량)로 정해요. 1등급 7,800kcal/kg 이상, 2등급 7,000, 3등급 6,200 이상이에요. 함수율 10% 이하, 회분 5.5% 이하도 기준이에요.\n용어 풀이:\n· 고위발열량: 수증기 응축열까지 포함한 발열량 / kcal\n· kg: 1kg당 킬로칼로리", "ref": "목재제품의 규격과 품질기준 부속서 15"}, {"id": "임산가공-107", "subject": "임산가공", "num": 107, "part": 5, "stem": "나무숯의 크기 기준으로 옳은 것은?", "options": ["10mm 체를 통과하는 것이 5% 이하", "31.5mm 체를 통과하는 것이 7% 이하", "50mm 체를 통과하는 것이 10% 이하", "100mm 체를 통과하는 것이 15% 이하"], "answer": 1, "explain": "· 부속서 15: 31.5mm 체 통과분 7% 이하\n· 톱밥숯은 함수율 ≤30%, 회분 ≤10%, 고위발열량 ≥5,500kcal/kg\n쉬운 풀이: 숯이 너무 잘게 부서져 있으면 품질이 낮아요. 그래서 31.5mm 구멍 체를 통과하는 작은 조각이 7% 이하여야 해요.\n용어 풀이:\n· 체: 구멍 크기로 알갱이를 거르는 도구\n· 통과분: 체 구멍을 빠져나간 양", "ref": "목재제품의 규격과 품질기준 부속서 15"}, {"id": "임산가공-108", "subject": "임산가공", "num": 108, "part": 5, "stem": "목재펠릿·목재칩에서 '미세분'으로 보는 입자 크기 기준은?", "options": ["1.0mm 미만", "3.15mm 미만", "6.3mm 미만", "10mm 미만"], "answer": 1, "explain": "· 부속서 11·12: 미세분 = 입자크기 3.15mm 미만 부스러기\n· 펠릿 미세분 ≤1%\n· 칩은 F02~F30+ 등급\n쉬운 풀이: 펠릿·칩 속의 아주 작은 부스러기(3.15mm 미만)를 미세분이라 해요. 미세분이 많으면 먼지가 나고 보일러에 고장을 일으켜서, 펠릿은 1% 이하로 제한해요.\n용어 풀이:\n· 미세분: 아주 작은 부스러기\n· 입자크기: 알갱이 크기", "ref": "목재제품의 규격과 품질기준 부속서 11·12"}, {"id": "임산가공-109", "subject": "임산가공", "num": 109, "part": 5, "stem": "「목재제품의 규격과 품질기준」의 부속서에 해당하지 **않는** 제품은?", "options": ["난연목재", "목질바닥재", "목재브리켓", "목초액"], "answer": 3, "explain": "부속서 1~15: 제재목·방부목재·난연목재·WPC·집성재·합판·파티클보드·섬유판·OSB·목질바닥재·목재펠릿·목재칩·목재브리켓·성형숯·숯\n쉬운 풀이: 목재제품 품질기준 부속서는 15가지예요: 제재목·방부목재·난연목재·WPC·집성재·합판·파티클보드·섬유판·OSB·목질바닥재·펠릿·칩·브리켓·성형숯·숯. 목초액은 여기 없어요.\n용어 풀이:\n· 부속서: 본문에 딸린 세부 기준 문서\n· 목재브리켓: 톱밥을 압축한 벽돌 모양 연료\n· 성형숯: 숯가루를 뭉쳐 만든 숯", "ref": "목재제품의 규격과 품질기준"}, {"id": "임산가공-110", "subject": "임산가공", "num": 110, "part": 5, "stem": "목재이용법 시행규칙상 산림바이오매스 에너지 보급사업 중 생산시설 설치사업에서 **제외**되는 것은?", "options": ["목재펠릿 생산시설", "목재칩 생산시설", "숯 생산시설", "폐기물을 재활용하는 시설"], "answer": 3, "explain": "· 제29조의2: 펠릿·칩·브리켓·장작·성형탄·숯 생산시설 설치\n· 폐기물 재활용 시설은 제외\n· 연소기 보급사업·기술개발도 포함\n쉬운 풀이: 산림바이오매스 에너지 보급사업은 펠릿·칩·브리켓·장작·성형탄·숯 생산시설 설치를 지원해요. 폐기물을 재활용하는 시설은 깨끗한 산림바이오매스가 아니라서 제외돼요.\n용어 풀이:\n· 산림바이오매스: 숲에서 나온 에너지용 목재 자원\n· 보급사업: 널리 퍼뜨리기 위한 지원 사업\n· 연소기: 연료를 태우는 기구", "ref": "목재의 지속가능한 이용에 관한 법률 시행규칙 제29조의2"}]}];
const PUBLIC = [{"name": "조림", "questions": [{"id": "공개-조림-1", "subject": "조림", "num": 1, "part": 0, "stem": "광의의 조림은 숲이 없는 지역에 새로 임분을 조성하는 갱신과 조성된 임분을 가꾸는 육림(숲가꾸기)으로 이루어지며, 육림은 다시 조성단계와 관리단계로 나눌 수 있다. 이 중 관리단계에 해당하는 무육방법은?", "options": ["솎아베기(간벌)", "가지치기", "어린나무가꾸기", "풀베기"], "marks": ["가.", "나.", "다.", "라."], "answer": 0, "accept": [0], "explain": "· 조성단계 = 풀베기·어린나무가꾸기·가지치기\n· 관리단계 = 솎아베기·임연부 형성·수하식재(천연림은 천연림보육·천연림 개량)\n쉬운 풀이: 숲 가꾸기(육림)는 두 단계예요. 어린 숲을 키우는 '조성단계'(풀베기·어린나무가꾸기·가지치기)와, 자란 숲을 다듬는 '관리단계'(솎아베기 등)예요. 솎아베기는 나무가 꽤 자란 뒤에 하니까 관리단계예요.\n용어 풀이:\n· 육림(무육): 숲을 키우고 가꾸는 일\n· 갱신: 새 숲을 만드는 일\n· 솎아베기(간벌): 빽빽한 나무 일부를 베는 작업", "ref": "조림 모듈 1-2-1·1-2-2 <조성단계/관리단계 육림 방법> 표"}, {"id": "공개-조림-2", "subject": "조림", "num": 2, "part": 0, "stem": "10ha의 임지에 1.8m 간격으로 정방형 식재 시 필요한 묘목 본수는?", "options": ["20,000본", "30,000본", "40,000본", "50,000본"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "정방형 본수 = 면적 ÷ (간격)² = 100,000㎡ ÷ (1.8 × 1.8 = 3.24㎡) ≒ 30,864본 → 약 30,000본\n쉬운 풀이: 정사각형으로 심을 때 한 그루가 차지하는 넓이는 간격 × 간격이에요. 1.8 × 1.8 = 3.24㎡. 10ha = 100,000㎡이니 100,000 ÷ 3.24 ≈ 30,864본, 약 30,000본이에요. 1ha당 3,000본(1.8m)이라는 기준과도 딱 맞아요.\n용어 풀이:\n· 정방형 식재: 정사각형 간격으로 심기\n· 본수: 그루 수\n· 10ha: 100,000㎡", "ref": "조림 모듈 식재밀도 계산"}, {"id": "공개-조림-3", "subject": "조림", "num": 3, "part": 0, "stem": "파종조림에 대한 설명으로 틀린 것은?", "options": ["파종조림은 연 1회만 풀베기를 실시하기 때문에 일반조림보다 사후관리비가 덜 소요된다.", "조류 및 서류 등 동물에 의한 피해만 방지하면 성공할 수 있는데 망사, 플라스틱 원통 등으로 방조물을 설치하면 효과적이다.", "파종조림을 직파조림이라고도 한다.", "파종시기는 봄과 가을이 좋으며, 가을파종은 10~11월이 적합하다."], "marks": ["가.", "나.", "다.", "라."], "answer": 0, "accept": [0], "explain": "파종조림의 가장 큰 단점은 연 3회 이상 주위 풀베기를 해야 해서 일반조림보다 사후관리비가 더 든다는 점이다.\n쉬운 풀이: 파종조림(직파)은 씨를 산에 직접 뿌리는 방법이에요. 어린 싹이 잡초에 쉽게 덮여서 1년에 3번 이상 풀베기를 해야 해요. 그래서 묘목을 심는 일반조림보다 관리비가 '더' 들어요. '연 1회만, 덜 든다'가 틀렸어요.\n용어 풀이:\n· 파종조림(직파조림): 씨앗을 산에 직접 뿌려 숲을 만드는 방법\n· 사후관리: 심은 뒤의 관리\n· 방조물: 새를 막는 시설", "ref": "조림 모듈 2-5 파종조림, 2-5-3 관리 \"가\""}, {"id": "공개-조림-4", "subject": "조림", "num": 4, "part": 0, "stem": "임령 30년인 잣나무 인공림의 평균 가슴높이지름이 20cm이며, ha당 본수가 800본이다. 25% 간벌률을 적용한 정량간벌 시 잔존목의 간격은?", "options": ["약 3.0m", "약 4.0m", "약 4.5m", "약 5.0m"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "잔존본수 = 800 × (1 − 0.25) = 600본/ha → 간격 = √(10,000㎡ ÷ 600) = √16.7 ≒ 4.08m\n쉬운 풀이: 800본에서 25%를 베면 600본이 남아요. 600그루가 1ha(10,000㎡)를 고르게 나눠 쓰면 한 그루당 10,000 ÷ 600 ≈ 16.7㎡. 정사각형 한 변은 √16.7 ≈ 4.08m, 약 4m예요.\n용어 풀이:\n· 간벌률: 베어 내는 비율\n· 정량간벌: 정해진 본수만큼 남기는 간벌\n· 잔존목: 남는 나무", "ref": "조림 모듈 정량간벌(솎아베기) — 본수와 정방형 간격의 관계"}, {"id": "공개-조림-5", "subject": "조림", "num": 5, "part": 0, "stem": "미래목의 선정·관리에 관한 설명으로 맞는 것은?", "options": ["피압을 받지 않은 상층의 우세목으로 선정하되 폭목도 포함한다.", "미래목 간의 거리는 최소 7m 이상으로 임지 내에 고르게 분포하도록 한다.", "가지치기는 톱과 무육낫을 사용한다.", "미래목은 활엽수의 경우 ha당 200본 내외, 침엽수의 경우 ha당 200~400본을 선정한다."], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "· 가 — 폭목은 제외\n· 나 — 최소 5m 이상\n· 다 — 가지치기는 반드시 톱으로 한다\n· 라 — 옳음\n쉬운 풀이: 미래목은 끝까지 키울 좋은 나무예요. 활엽수 ha당 200본 내외, 침엽수 200~400본을 골라요. 너무 크고 모양 나쁜 폭목은 빼고, 미래목 사이는 최소 5m, 가지치기는 반드시 톱으로 해요(낫은 상처가 커요).\n용어 풀이:\n· 미래목: 최종 수확까지 키울 우량목\n· 폭목: 지나치게 커서 주변을 누르는 나쁜 나무\n· 무육낫: 숲가꾸기용 낫", "ref": "조림 모듈 5-7-5 미래목 선정·관리"}, {"id": "공개-조림-6", "subject": "조림", "num": 6, "part": 0, "stem": "조림지 활착률 조사요령에서 빈칸에 들어갈 용어를 순서대로 맞게 고른 것은?\n\n(2) 표준지 조사비율은 ( ① )으로 한다.\n\n(4) 표준지 크기는 ( ② )을 원칙으로 하되, 소반 또는 필지단위 사업면적이 1ha 미만의 경우에는 ( ③ ) 크기로 할 수 있다.", "options": ["① 조림사업면적의 1% 이상 → ② 400㎡ → ③ 200㎡", "① 조림사업면적의 2% 이상 → ② 200㎡ → ③ 100㎡", "① 풀베기사업면적의 1% 이상 → ② 400㎡ → ③ 200㎡", "① 풀베기사업면적의 2% 이상 → ② 200㎡ → ③ 100㎡"], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "표준지 조사비율 = 풀베기사업 면적의 2% 이상, 크기 = 200㎡(반지름 8.0m 원형), 1ha 미만이면 100㎡(반지름 5.67m 원형). 활착률(%) = 생존본수 ÷ 조사본수 × 100\n쉬운 풀이: 활착률 조사는 풀베기 사업 면적의 2% 이상을 표준지로 잡고, 표준지 크기는 200㎡(반지름 8m 원)이에요. 1ha 미만 작은 사업지는 100㎡(반지름 5.67m)로 해도 돼요. 예상문제 조림 3번과 같은 내용이에요.\n용어 풀이:\n· 활착률: 심은 나무가 살아남은 비율\n· 표준지: 표본 조사 구역\n· 조사비율: 전체 중 조사하는 면적 비율", "ref": "조림 모듈 [붙임] 조림지 활착률 조사요령 2·4항"}]}, {"name": "산림보호", "questions": [{"id": "공개-산림보호-1", "subject": "산림보호", "num": 1, "part": 0, "stem": "다음 중 온대지방에서 내화수림대로 이용 가능한 수종을 고르시오.", "options": ["잣나무", "굴참나무", "소나무", "동백나무"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "⚠️ 확인 필요\n· 온대지방 내화수림대 수종 = 참나무류·아왜나무·잣나무·밤나무·가시나무류·낙엽송·잎갈나무. 두꺼운 코르크 수피를 가진 굴참나무가 대표적인 답이다.\n· 소나무는 수지가 많아 불에 약하고, 동백나무는 난대 수종이다.\n· ⚠️ 모듈 목록에 잣나무도 들어 있어 가·나 복수정답 소지가 있다.\n· 시험장에서는 \"참나무류(굴참나무)\"를 우선 고른다.\n쉬운 풀이: 내화수림대는 불에 강한 나무로 만든 숲띠예요. 굴참나무는 두꺼운 코르크 껍질 덕분에 불에 아주 강해서 대표적인 답이에요. 소나무는 송진이 많아 약하고, 동백나무는 따뜻한 남쪽(난대) 나무라 '온대' 조건에 안 맞아요. 잣나무도 모듈 목록에 있어 복수정답 논란이 있지만 시험에선 굴참나무를 고르세요.\n용어 풀이:\n· 내화수림대: 산불을 막는 내화성 수종의 띠 숲\n· 코르크: 굴참나무 껍질의 두꺼운 층\n· 온대: 사계절이 뚜렷한 중위도 기후", "ref": "산림보호 모듈 산불 간접소화법(내화수림대, 폭 30m 내외 띠숲)"}, {"id": "공개-산림보호-2", "subject": "산림보호", "num": 2, "part": 0, "stem": "살충효과를 조사하고자 한다. 대조구의 생충율이 98.3%이고, 약제 처리구의 생충율이 88.3%였다면 처리구의 보정살충률은 몇 %인가?", "options": ["10.17%", "10.56%", "10.94%", "11.33%"], "marks": ["가.", "나.", "다.", "라."], "answer": 0, "accept": [0], "explain": "Abbott 보정식: 보정살충률 = (대조구 생충율 − 처리구 생충율) ÷ 대조구 생충율 × 100 = (98.3 − 88.3) ÷ 98.3 × 100 = 10.17%\n쉬운 풀이: 약을 안 뿌린 곳(대조구)에서도 자연히 죽는 벌레가 있어요. 그래서 그만큼을 빼고 약 효과만 계산하는 게 Abbott 보정식이에요. (98.3 − 88.3) ÷ 98.3 × 100 ≈ 10.17%예요.\n용어 풀이:\n· 보정살충률: 자연 사망을 뺀 실제 약효\n· 대조구: 약을 처리하지 않은 비교 구역\n· 생충율: 살아 있는 벌레 비율", "ref": "산림보호 — 약효 시험(Abbott 공식)"}, {"id": "공개-산림보호-3", "subject": "산림보호", "num": 3, "part": 0, "stem": "다음 빈칸에 들어갈 산불 환경인자는?\n\n\"산불의 연소환경은 열·산소·연료를 함유하며 상호작용을 하고 산불의 형태 결정은 환경인자인 ( )·( )·( ) 등의 매개변수에 의하여 영향을 받는다.\"", "options": ["바람, 열, 지형", "바람, 연료, 지형", "산소, 열, 지형", "바람, 연료, 지형"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1, 3], "explain": "⚠️ 확인 필요\n· 산불 행동(형태)을 결정하는 3대 환경인자 = 연료·기상(바람)·지형. 열·산소는 연소의 3요소이지 환경인자가 아니다.\n· ⚠️ 원문 보기 나와 라가 똑같은 문장(출제 오류)이므로 둘 다 정답으로 본다.\n쉬운 풀이: 불이 붙으려면 열·산소·연료(연소의 3요소)가 필요하지만, 산불이 '어떤 모양으로 번지느냐'는 연료(무엇이 타나), 바람(기상), 지형(경사·방향)이 정해요. 원문에서 나와 라가 똑같아서 둘 다 정답으로 봐요.\n용어 풀이:\n· 연소의 3요소: 열·산소·연료\n· 산불 환경인자: 연료·기상·지형\n· 매개변수: 결과에 영향을 주는 조건", "ref": "산림보호 모듈 산불의 발생과 확산 요인"}, {"id": "공개-산림보호-4", "subject": "산림보호", "num": 4, "part": 0, "stem": "다음 조건을 기준으로 나무주사를 실시하려고 한다. 병해충별 천공수 및 천공당 주입량, 본당 주입량을 가장 알맞게 산출한 것을 고르시오.\n\n[나무주사 방제약제 조건] 1) 솔잎혹파리: 포스팜 액제 50% 2) 솔껍질깍지벌레: 포스팜 액제 50% 3) 소나무재선충병: 아바멕틴 유제 1.8%\n\n흉고직경 | 솔잎혹파리 천공수 | 천공당(mL) | 솔껍질깍지벌레 천공수 | 천공당(mL) | 흉고직경 | 재선충병 천공수 | 천공당(mL) | 본당(mL)\n10~12 | 1 | ① | 2 | ② | 10~15 | 2 | ③ | ④\n14~16 | 2 | ① | 4 | ② | 15~20 | 4 | ③ |", "options": ["① 5, ② 5, ③ 4, ④ 8", "① 4, ② 5, ③ 5, ④ 10", "① 5, ② 4, ③ 4, ④ 8", "① 4, ② 4, ③ 5, ④ 10"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "⚠️ 확인 필요\n· 주입량 기준은 흉고직경 1cm당 양으로 생각하면 쉽다.\n· 솔잎혹파리(포스팜 50%) ≒ 흉고 1cm당 약 0.3~0.4mL → 천공당 4mL (10~12cm: 4mL, 14~16cm: 8mL)\n· 솔껍질깍지벌레(포스팜 50%) ≒ 흉고 1cm당 약 1mL → 천공당 5mL (10~12cm: 10mL)\n· 소나무재선충병(아바멕틴 1.8%) ≒ 흉고 1cm당 약 1mL → 천공당 5mL, 본당 2 × 5 = 10mL\n· ⚠️ 천공당 주입량 표는 학습모듈에 없다.\n· 「산림병해충 방제 지침」의 나무주사 기준으로 풀었다.\n쉬운 풀이: 나무주사 약 양은 나무 굵기(흉고직경)에 비례해요. 솔잎혹파리는 구멍당 4mL, 솔껍질깍지벌레와 재선충병은 구멍당 5mL 정도로 계산해요. 재선충병 10~15cm는 구멍 2개 × 5mL = 10mL예요. 이 표는 모듈 밖 방제지침 기준이라 '확인 필요'로 표시했어요.\n용어 풀이:\n· 나무주사: 줄기에 구멍을 뚫어 약을 넣는 방제\n· 천공: 구멍 뚫기\n· 주입량: 넣는 약의 양", "ref": "산림병해충 방제 지침(나무주사 약량 기준), 산림보호 모듈 소나무재선충병 나무주사 작업요령"}, {"id": "공개-산림보호-5", "subject": "산림보호", "num": 5, "part": 0, "stem": "다음에서 설명하는 산림병해충 종류와 빈칸에 들어갈 내용을 순서대로 고르시오.\n\n\"외부로 충태가 노출되는 시기가 제한적이므로 침투성 약제를 나무주사하는 것이 효과적이다. 벌레혹 형성율이 ( ① ) 이상인 임지에서 산란 및 부화최성기인 6월에 포스팜 액제( ② )를 나무줄기에 주사한다. 또 유충이 낙하하는 11월 하순경에 이미다클로프리드 입제( ③ )를 지면에 살포한다.\"", "options": ["솔잎혹파리, 10%, 50%, 20%", "솔잎혹파리, 20%, 50%, 20%", "솔껍질깍지벌레, 10%, 50%, 20%", "솔껍질깍지벌레, 20%, 50%, 20%"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "\"벌레혹(충영)\"이 나오면 솔잎혹파리. 벌레혹 형성율 20% 이상 임지에서 6월에 포스팜 액제(50%) 나무주사, 이미다클로프리드 입제(20%) 지면 살포\n쉬운 풀이: '벌레혹(충영)'이라는 단어가 나오면 솔잎혹파리예요. 벌레혹 형성률 20% 이상인 숲에서 6월에 포스팜 액제 50%를 줄기에 주사하고, 애벌레가 땅으로 떨어지는 11월 하순엔 이미다클로프리드 입제 20%를 땅에 뿌려요.\n용어 풀이:\n· 벌레혹(충영): 곤충 때문에 생긴 혹\n· 침투성 약제: 식물 몸속으로 스며드는 약\n· 입제: 알갱이 형태 농약", "ref": "산림보호 모듈 2-2 솔잎혹파리 \"다. 방제시기 및 방법\""}, {"id": "공개-산림보호-6", "subject": "산림보호", "num": 6, "part": 0, "stem": "다음 설명에 해당하는 수목피해의 명칭과 이런 현상이 발생하는 수종 및 방제방법을 가장 잘 설명한 것을 고르시오.\n\n[① 피해명칭] 강한 복사광선으로 줄기 수피 일부에서 급격한 수분증발이 일어나 조직이 건조하여 떨어져 나가고, 상처에 부후균이 침투해 2차 피해를 유발한다.\n\n[② 피해수종] 코르크층이 발달하지 않고 평활한 수피를 지닌 수종, 남서방향 임연부 성목·고립목\n\n[③ 방제방법] 울폐된 숲이 심하게 개방되지 않게 하여 강한 직사광선을 피한다.", "options": ["① 열사, ② 가문비나무, ③ 석회유 도포", "① 볕데기, ② 호두나무, ③ 관수", "① 볕데기, ② 오동나무, ③ 석회유 도포", "① 열사, ② 전나무, ③ 관수"], "marks": ["가.", "나.", "다.", "라."], "answer": 2, "accept": [2], "explain": "수피가 건조해 떨어져 나가는 고온 피해 = 볕데기(피소). 피해수종 = 오동나무·호두나무·가문비나무처럼 수피가 평활한 수종. 방제 = 급격한 임상 개방 지양, 가로수·정원수는 석회유 살포(도포)·짚 감기·해가림. \"관수\"는 볕데기 방제법이 아니므로 나는 오답이다.\n쉬운 풀이: 강한 햇빛에 껍질이 말라 떨어져 나가는 피해는 볕데기(피소)예요. 껍질이 얇고 매끈한 오동나무·호두나무·가문비나무에 잘 생겨요. 방제는 숲을 갑자기 확 열지 않고, 가로수엔 석회유를 바르거나 짚을 감아요. '관수(물주기)'는 방제법이 아니에요.\n용어 풀이:\n· 볕데기(피소): 강한 햇볕에 수피가 상하는 피해\n· 석회유: 석회를 물에 탄 흰 액체\n· 임연부: 숲 가장자리", "ref": "산림보호 모듈 1-1-1 고온에 의한 피해 \"가. 볕데기\""}]}, {"name": "산림경영", "questions": [{"id": "공개-산림경영-1", "subject": "산림경영", "num": 1, "part": 0, "stem": "임목수확작업에 미치는 환경인자 중 지형적 요인에 해당하는 것은?", "options": ["기온", "강수", "토양의 연경도", "계절적 영향"], "marks": ["가.", "나.", "다.", "라."], "answer": 2, "accept": [2], "explain": "· 기온·강수·계절은 기상(기후)적 요인이다.\n· 작업지의 경사·지표구조·토양(강도·연경도)처럼 땅과 관련된 성질이 지형·지반 쪽 요인이다.\n쉬운 풀이: 기온·강수·계절은 날씨(기상) 요인이고, 땅의 경사·지표 구조·흙의 단단함(연경도)은 지형·지반 요인이에요. 흙이 무르면 기계가 빠지고, 단단하면 작업하기 좋아요.\n용어 풀이:\n· 연경도: 흙이 무르거나 단단한 정도\n· 지형적 요인: 땅 모양·성질과 관련된 요인\n· 기상 요인: 날씨와 관련된 요인", "ref": "산림경영 모듈 1-3 임목수확작업의 환경인자(지형 요인·토양 요인 \"나. 토양의 연경도\")"}, {"id": "공개-산림경영-2", "subject": "산림경영", "num": 2, "part": 0, "stem": "20년 전의 재적이 200㎥이고 현재 재적이 300㎥일 때 프레슬러식에 의한 재적 성장률은 얼마인가?", "options": ["8%", "6%", "4%", "2%"], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "Pressler 식: P = (V − v) ÷ (V + v) × 200 ÷ n = (300 − 200) ÷ (300 + 200) × 200 ÷ 20 = 0.2 × 10 = 2%\n쉬운 풀이: Pressler 공식에 넣어요: (300 − 200) ÷ (300 + 200) × 200 ÷ 20 = 0.2 × 10 = 2%. 예상문제 산림경영 15번은 기간이 10년이라 4%였는데, 여기는 20년이라 절반인 2%예요. 기간(n)을 꼭 확인하세요.\n용어 풀이:\n· Pressler 공식: 두 시점 재적으로 생장률을 구하는 식\n· 재적 성장률: 부피가 늘어난 비율\n· n: 경과 연수", "ref": "산림경영 모듈 2-2-3 프레슬러 공식"}, {"id": "공개-산림경영-3", "subject": "산림경영", "num": 3, "part": 0, "stem": "산림경영계획에 대한 설명으로 틀린 것은?", "options": ["산림기본계획은 20년마다 수립하되, 산림의 상황 또는 경제사정의 현저한 변경 등의 사유가 있는 경우에는 이를 변경할 수 있다.", "도지사는 산림기본계획에 따라 관할구역에 소재한 산림의 특수성을 고려하여 지역산림계획을 20년마다 수립한다.", "국유림종합계획은 지방산림청 국유림관리소 단위로 10년마다 수립한다.", "사유림경영계획구는 일반경영계획구, 협업경영계획구, 기업경영림계획구로 구분하며 산림경영계획서는 10년마다 반드시 산림소유자가 작성해야 한다."], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "· 계획구 구분(일반·협업·기업경영림)은 맞다.\n· 그러나 산림경영계획서는 산림조합·산림경영기술자 등이 대행 작성할 수 있으므로 \"반드시 산림소유자가 작성\"은 틀리다.\n· 가·나·다는 모듈 내용과 같다(지역산림계획 20년, 국유림종합계획은 국유림관리소 단위로 10년).\n쉬운 풀이: 산림경영계획서는 산주가 직접 쓸 수도 있지만, 산림조합이나 산림경영기술자에게 맡겨서(대행) 쓸 수도 있어요. 그래서 '반드시 산림소유자가 작성'이 틀렸어요. 산림기본계획·지역산림계획 20년, 국유림종합계획 10년은 맞는 내용이에요.\n용어 풀이:\n· 대행 작성: 다른 사람이 대신 작성\n· 국유림종합계획: 국유림 경영의 종합계획\n· 사유림경영계획구: 사유림 경영계획 단위", "ref": "산림경영 모듈 1-3-1~1-3-5 산림계획 체계"}, {"id": "공개-산림경영-4", "subject": "산림경영", "num": 4, "part": 0, "stem": "Kameraltaxe 공식을 활용한 표준연벌채량은 얼마인가?\n\n경영계획구 산림면적 100ha, 현실축적을 법정축적으로 유도하는 갱정기 20년, 윤벌기 50년, 현실축적 1,000㎥, 평균생장량 50㎥, 법정축적 1,500㎥ (소수점 이하 절사)", "options": ["25㎥", "30㎥", "35㎥", "40㎥"], "marks": ["가.", "나.", "다.", "라."], "answer": 0, "accept": [0], "explain": "카메랄탁세: E = Z + (Vr − Vn) ÷ a = 50 + (1,000 − 1,500) ÷ 20 = 50 − 25 = 25㎥ (Z 생장량, Vr 현실축적, Vn 법정축적, a 갱정기. 윤벌기 50년은 쓰지 않는 함정 수치)\n쉬운 풀이: Kameraltaxe 공식: 생장량 + (현실축적 − 법정축적) ÷ 갱정기 = 50 + (1,000 − 1,500) ÷ 20 = 50 − 25 = 25㎥. 현실 숲이 부족하니 생장량보다 적게 베요. 윤벌기 50년은 쓰지 않는 함정 숫자예요.\n용어 풀이:\n· Kameraltaxe(오스트리아 공식): 생장량 + 축적 차이 조정\n· 갱정기: 법정림으로 맞추는 기간\n· 함정 수치: 계산에 쓰지 않는 숫자", "ref": "산림경영 모듈 수확조정 — 축적법(Kameraltaxe)"}, {"id": "공개-산림경영-5", "subject": "산림경영", "num": 5, "part": 0, "stem": "[공통 지문] 귀산촌을 희망하는 산주 A는 벌기에 도달한 50년생 잣나무림 1ha의 임목 400㎥를 매각하고, 그 수익으로 두릅을 식재할 계획이다.\n\n① 잣나무 임목가는 시장가역산법으로 계산한다: 원목 1㎥당 시장가 300,000원, 1㎥당 생산비용 100,000원, 조재율 70%, 투하자본 회수기간 5개월, 월이율 4%, 기업이익률 30%\n\n② 두릅 판매가 50,000원/㎏, 변동비 30,000원/㎏, 고정비 600,000원\n\n시장가역산법에 따른 현재의 임목가치는 얼마인가?", "options": ["19,600,000원", "28,000,000원", "36,000,000원", "56,000,000원"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "· 시장가역산식: x = f × { a ÷ (1 + m·p + r) − b }\n· = 0.7 × { 300,000 ÷ (1 + 5 × 0.04 + 0.3) − 100,000 } = 0.7 × (200,000 − 100,000) = 70,000원/㎥\n· → 70,000 × 400㎥ = 28,000,000원\n쉬운 풀이: 시장가역산: x = 이용률 × {원목가 ÷ (1 + 월수×월이율 + 이익률) − 생산비} = 0.7 × {300,000 ÷ (1 + 0.2 + 0.3) − 100,000} = 0.7 × (200,000 − 100,000) = 70,000원/㎥. 400㎥ × 70,000 = 2,800만원이에요.\n용어 풀이:\n· 시장가역산법: 시장가에서 비용을 빼 임목가를 구함\n· 이용률(f): 쓸 수 있는 목재 비율\n· 기업이익률(r): 사업자 적정 이익 비율", "ref": "산림경영 모듈 임목평가 — 시장가역산법"}, {"id": "공개-산림경영-6", "subject": "산림경영", "num": 6, "part": 0, "stem": "[공통 지문] 귀산촌을 희망하는 산주 A는 벌기에 도달한 50년생 잣나무림 1ha의 임목 400㎥를 매각하고, 그 수익으로 두릅을 식재할 계획이다.\n\n① 잣나무 임목가는 시장가역산법으로 계산한다: 원목 1㎥당 시장가 300,000원, 1㎥당 생산비용 100,000원, 조재율 70%, 투하자본 회수기간 5개월, 월이율 4%, 기업이익률 30%\n\n② 두릅 판매가 50,000원/㎏, 변동비 30,000원/㎏, 고정비 600,000원\n\n두릅의 손익분기점 판매량은 얼마인가? (원문 발문은 \"판매액과 생산액\"이지만 보기 단위는 ㎏)", "options": ["25㎏", "30㎏", "35㎏", "40㎏"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "손익분기점 판매량 = 고정비 ÷ (판매단가 − 단위변동비) = 600,000 ÷ (50,000 − 30,000) = 30㎏ (손익분기점 매출액 = 30 × 50,000 = 1,500,000원)\n쉬운 풀이: 손익분기점 판매량 = 고정비 ÷ (판매가 − 변동비) = 600,000 ÷ (50,000 − 30,000) = 30kg. 1kg 팔 때마다 2만원씩 남아서 고정비 60만원을 메우려면 30kg을 팔아야 해요.\n용어 풀이:\n· 손익분기점: 이익이 0이 되는 지점\n· 고정비: 판매량과 관계없는 비용\n· 단위변동비: 1단위 생산에 드는 비용", "ref": "산림경영 모듈 손익분기점 분석"}]}, {"name": "산림법규", "questions": [{"id": "공개-산림법규-1", "subject": "산림법규", "num": 1, "part": 0, "stem": "지방자치단체나 그 밖의 공공단체가 소유하는 산림은?", "options": ["국유림", "공유림", "사유림", "민유림"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "· 국유림 = 국가 소유\n· 공유림 = 지방자치단체·그 밖의 공공단체 소유\n· 사유림 = 그 외 소유\n쉬운 풀이: 산림은 주인에 따라 나눠요. 국가 소유는 국유림, 지방자치단체나 공공단체 소유는 공유림, 그 밖의 개인·회사 소유는 사유림이에요.\n용어 풀이:\n· 국유림: 국가 소유 산림\n· 공유림: 지자체 등 공공 소유 산림\n· 사유림: 개인·법인 소유 산림", "ref": "산림자원법 제3조(산림의 구분)"}, {"id": "공개-산림법규-2", "subject": "산림법규", "num": 2, "part": 0, "stem": "다음 중 산림에 대한 설명으로 올바르지 않은 것은? (단, 농지·초지·주택지·도로 등 대통령령으로 정하는 토지에 있는 입목·대나무와 그 토지는 제외)", "options": ["집단적으로 자라고 있는 입목·대나무와 그 토지", "집단적으로 자라고 있는 입목·대나무가 영구적으로 없어지게 된 토지", "입목·대나무를 집단적으로 키우는 데에 사용하게 된 토지", "산림의 경영 및 관리를 위하여 설치한 도로"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "· 법 문언은 \"집단적으로 자라고 있던 입목·대나무가 일시적으로 없어지게 된 토지\"이다.\n· '영구적'이 틀렸다.\n· 라(임도)는 산림에 포함된다.\n쉬운 풀이: 법에서 산림은 '나무가 자라고 있던 곳에서 나무가 일시적으로 없어진 땅'도 포함해요(예: 벌채 직후). '영구적으로' 없어진 땅은 더 이상 산림이 아니에요. 한 단어(일시적 ↔ 영구적)를 바꾼 함정 문제예요.\n용어 풀이:\n· 입목: 땅에 서 있는 나무\n· 일시적: 잠깐 동안\n· 영구적: 계속해서", "ref": "산림자원법 제2조 제1호(정의), 법규 모듈"}, {"id": "공개-산림법규-3", "subject": "산림법규", "num": 3, "part": 0, "stem": "다음 중 산림사업에 해당하지 않는 것은?", "options": ["임도사업, 산불예방·진화시설 등 산림관리기반시설의 설치를 위하여 시행하는 사업", "산림병해충의 예방 및 방제를 위하여 시행하는 사업", "건설업 중 조경공사업과 조경식재공사업으로 시행하는 사업", "산불의 예방 및 진화를 위하여 시행하는 사업"], "marks": ["가.", "나.", "다.", "라."], "answer": 2, "accept": [2], "explain": "산림사업 정의의 단서: \"「건설산업기본법 시행령」 별표 1에 따른 건설업 중 조경공사업과 조경식재공사업으로 시행하는 사업은 제외한다.\"\n쉬운 풀이: 산림사업에는 임도·산불시설 설치, 병해충 방제, 산불 예방·진화 등이 포함돼요. 하지만 건설업 중 조경공사업·조경식재공사업으로 하는 일은 법에서 명시적으로 빼 놨어요.\n용어 풀이:\n· 산림사업: 법에서 정한 산림 관련 사업\n· 조경공사업: 정원·공원을 꾸미는 건설업\n· 단서: 예외를 정한 조항", "ref": "산림자원법 제2조(산림사업), 법규 모듈"}, {"id": "공개-산림법규-4", "subject": "산림법규", "num": 4, "part": 0, "stem": "다음을 읽고 기능인영림단의 구성비율로 맞는 것은?\n\n00산림조합의 A영림단(10명)과 B영림단(6명)이 해체되어, 남은 A 4명 + B 3명으로 7명의 기능인영림단을 새로 구성한다. 필요한 산림경영기술자 기능 2급 이상 기술자는 ( )% 이상이다.", "options": ["30%", "40%", "50%", "60%"], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "· 기능인영림단은 기능 2급 이상 산림경영기술자가 구성원 6~10명이면 60%, 11~30명이면 50% 이상이어야 한다.\n· 7명이므로 60%(4.2명 → 5명 이상). 영림단 구성원은 6명 이상 30명 이하이다.\n· 30%는 기계화영림단의 교육이수자 비율이다.\n쉬운 풀이: 기능인영림단은 기술 있는 사람이 일정 비율 이상 있어야 해요. 구성원이 6~10명이면 기능 2급 이상이 60% 이상, 11~30명이면 50% 이상이에요. 이 문제는 7명이니 60%예요. 사람 수가 적을수록 비율이 높아요.\n용어 풀이:\n· 기능인영림단: 산림사업을 하는 기능인 작업단\n· 산림경영기술자 기능2급: 기능 분야 자격 등급", "ref": "산림기술진흥법 시행령(영림단 필수인력기준), 법규 모듈 12-3"}, {"id": "공개-산림법규-5", "subject": "산림법규", "num": 5, "part": 0, "stem": "다음 중 임업인에 해당하지 않는 것을 고르시오.", "options": ["3헥타르 이상의 산림에서 임업을 경영하는 자", "1년 중 90일 이상 임업에 종사하는 자", "임업경영을 통한 임산물의 연간 판매액이 120만원 이상인 자", "잣나무 5천제곱미터 이상을 재배하는 자"], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "잣나무는 1만㎡ 이상이어야 한다(5천㎡는 밤나무 기준). 함께 외울 기준: 대추나무·호두나무 1천㎡, 포지 3백㎡, 표고자목 연 20㎥\n쉬운 풀이: 임업인 기준 중 특용수 재배 면적이 수종마다 달라요. 밤나무 5천㎡, 잣나무 1만㎡, 대추·호두 1천㎡, 포지 300㎡예요. 잣나무는 1만㎡ 이상이어야 해서 '5천㎡'가 틀렸어요.\n용어 풀이:\n· 임업인: 법에서 정한 임업 종사자\n· 포지: 묘목을 키우는 밭\n· 표고자목: 표고버섯을 키우는 원목", "ref": "임업 및 산촌 진흥촉진에 관한 법률 시행령 제2조(임업인의 범위)"}, {"id": "공개-산림법규-6", "subject": "산림법규", "num": 6, "part": 0, "stem": "다음을 읽고 조합원으로 가입할 수 없는 경우를 고르시오. (지문 이외의 사항은 고려하지 않음)\n\nA. 서울에 살고 경기도 가평에 임야를 소유 → 가평조합 가입\n\nB. 경기도 평택에 살고 전북 임실에 임야를 소유 → 평택조합 가입\n\nC. 서울에 살며 강원도 철원에서 임산물을 재배하는 임업인 → 서울조합 가입\n\nD. 임야를 소유한 서울조합 조합원이 경북 상주에 귀산촌하여 임산물 재배 → 상주조합 가입", "options": ["A", "B", "C", "D"], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "· 지역조합원 자격은 구역에 주소 또는 산림이 있는 산림소유자, 구역에 주소 또는 사업장이 있는 임업인이다.\n· A(산림 소재)·B(주소)·C(주소)는 가입할 수 있다.\n· D는 이미 서울조합 조합원이며, \"조합원은 둘 이상의 지역조합의 조합원이 될 수 없다\"(제18조 제1항 단서). 서울조합을 탈퇴하지 않으면 상주조합에 가입할 수 없다.\n쉬운 풀이: 지역조합원은 그 구역에 주소나 산림이 있으면 될 수 있어요. 그런데 한 사람이 두 지역조합의 조합원이 될 수는 없어요. D는 이미 서울조합 조합원이라 탈퇴하지 않으면 상주조합에 가입할 수 없어요.\n용어 풀이:\n· 지역조합: 지역 단위 산림조합\n· 귀산촌: 도시에서 산촌으로 이주\n· 조합원 자격: 조합원이 될 수 있는 조건", "ref": "산림조합법 제18조(조합원의 자격 등)"}]}, {"name": "산림토목", "questions": [{"id": "공개-산림토목-1", "subject": "산림토목", "num": 1, "part": 0, "stem": "사방사업의 효과 중 직접적 효과로 부적절한 것은?", "options": ["산각고정 및 땅밀림 방지", "하천공작물 보호", "농경지 매몰 방지", "하구 및 항만의 토사퇴적 방지"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "· 직접적 효과 = 산지침식·토사유출 방지, 산복·계안 붕괴 방지, 산각 고정·땅밀림 방지, 계상기울기 완화, 비사 고정, 홍수조절, 하구·항만 토사퇴적 방지, 저수지·탄갱·농경지 매몰 방지, 국토보전\n· 간접적 효과 = 용수 보전, 하천 공작물 보호, 경지·택지 조성, 자연환경 복구\n쉬운 풀이: 사방사업의 직접 효과는 흙이 무너지거나 쓸려 내려가는 것 자체를 막는 거예요(산각 고정, 농경지 매몰 방지, 항만 토사 퇴적 방지 등). 하천
