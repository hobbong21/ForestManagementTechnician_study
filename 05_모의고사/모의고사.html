은 한 지역에서 늘 같은 방향으로 부는 초속 10~15m의 바람이에요. 오랫동안 불어 나무 모양을 한쪽으로 기울게 만들어요. 폭풍은 초속 29m 이상의 아주 센 바람으로 나무를 부러뜨리거나 뽑아요.\n용어 풀이:\n· 주풍: 일정 방향으로 오래 부는 바람\n· 폭풍: 매우 강한 바람 / m\n· s: 초속(1초에 이동하는 거리)", "ref": "p.7"}, {"id": "산림보호-25", "subject": "산림보호", "num": 25, "part": 2, "stem": "주풍 때문에 생기는 편심생장으로 옳은 것은?", "options": ["침엽수·활엽수 모두 하방편심", "침엽수 하방편심, 활엽수 상방편심", "침엽수·활엽수 모두 상방편심", "침엽수 상방편심, 활엽수 하방편심"], "answer": 3, "explain": "침엽수 상방편심, 활엽수 하방편심\n쉬운 풀이: 바람을 오래 받으면 줄기가 한쪽으로만 두꺼워져요(편심생장). 침엽수와 활엽수는 기울어진 줄기를 버티는 방식이 반대라서(침엽수는 눌리는 쪽, 활엽수는 당겨지는 쪽을 보강) 두꺼워지는 방향도 반대예요. 시험에서는 교재 표현대로 '침엽수 상방편심, 활엽수 하방편심'을 고르세요. '침상·활하'로 외우면 돼요.\n용어 풀이:\n· 편심생장: 줄기가 한쪽으로 치우쳐 두꺼워지는 것\n· 이상재: 기울어진 줄기에 생기는 특수한 목재(침엽수 압축이상재, 활엽수 인장이상재)", "ref": "p.7"}, {"id": "산림보호-26", "subject": "산림보호", "num": 26, "part": 2, "stem": "밀식으로 가늘고 길게 자란 임목은 적설량이 어느 정도인 신설에서도 관설해를 심하게 받을 수 있는가?", "options": ["약 20cm", "약 50cm", "약 1m", "약 2m"], "answer": 0, "explain": "적설량 약 20cm 신설에서도 심한 피해 가능\n쉬운 풀이: 나무를 빽빽하게 심으면 서로 햇빛을 얻으려고 가늘고 길게만 자라요. 이런 나무는 약해서 갓 내린 눈(신설)이 20cm만 쌓여도 무게를 못 이기고 휘거나 부러져요. 이걸 관설해라고 해요.\n용어 풀이:\n· 관설해(冠雪害): 나무 위에 쌓인 눈 무게로 생기는 피해\n· 신설: 새로 내린 눈\n· 밀식: 빽빽하게 심음", "ref": "p.7"}, {"id": "산림보호-27", "subject": "산림보호", "num": 27, "part": 2, "stem": "산불 소화 방법 중 간접소화법에 해당하는 것은?", "options": ["물을 직접 뿌린다", "토사를 끼얹어 산소를 차단한다", "연소 전방에 방화선을 만들어 가연물을 제거한다", "헬기로 소화약제를 살포한다"], "answer": 2, "explain": "· 방화선·맞불·내화수림대 = 간접소화\n· 물·토사·소화약제 = 직접소화\n쉬운 풀이: 불에 물이나 흙을 직접 뿌려 끄는 건 직접소화, 불 앞쪽의 탈 것을 미리 없애서 불이 스스로 꺼지게 하는 건 간접소화예요. 방화선 만들기, 맞불 놓기, 내화수림대가 간접소화예요.\n용어 풀이:\n· 직접소화: 불에 직접 물·흙·약제를 뿌려 끄기\n· 간접소화: 연료를 없애 불이 번지지 못하게 하기\n· 맞불: 마주 불을 놓아 연료를 미리 태우기", "ref": "p.14"}, {"id": "산림보호-28", "subject": "산림보호", "num": 28, "part": 2, "stem": "산림보호 모듈에서 내화수림대 조성 수종으로 든 것이 **아닌** 것은?", "options": ["참나무류", "아왜나무", "가시나무류", "소나무"], "answer": 3, "explain": "참나무류·아왜나무·잣나무·밤나무·가시나무류·낙엽송·잎갈나무 (소나무는 내화력 약함)\n쉬운 풀이: 내화수림대에는 불에 잘 안 타는 참나무류·아왜나무·가시나무류·잣나무·밤나무·낙엽송 등을 써요. 소나무는 송진이 많아 불에 약하니 들어가면 안 돼요.\n용어 풀이:\n· 아왜나무: 남부 지방의 상록 활엽수(잎에 물기가 많아 불에 강함)\n· 가시나무류: 남부의 상록 참나무 종류", "ref": "p.14"}, {"id": "산림보호-29", "subject": "산림보호", "num": 29, "part": 2, "stem": "솔나방의 가해 수종으로 학습모듈에 적힌 것이 **아닌** 것은?", "options": ["소나무", "곰솔", "리기다소나무", "낙엽송"], "answer": 3, "explain": "솔나방 가해 수종: 소나무·곰솔·리기다소나무\n쉬운 풀이: 솔나방 애벌레(송충이)는 소나무·곰솔·리기다소나무의 잎을 갉아먹어요. 낙엽송은 이름은 비슷하게 침엽수지만 솔나방 가해 수종에 들어가지 않아요.\n용어 풀이:\n· 가해 수종: 해충이 피해를 주는 나무\n· 송충이: 솔나방의 애벌레", "ref": "p.25"}, {"id": "산림보호-30", "subject": "산림보호", "num": 30, "part": 2, "stem": "오리나무잎벌레의 월동 형태는?", "options": ["알", "유충", "성충", "번데기"], "answer": 2, "explain": "성충으로 지피물 밑·흙 속에서 월동, 연 1회\n쉬운 풀이: 오리나무잎벌레는 오리나무 잎을 갉아먹는 딱정벌레예요. 1년에 한 번 생기고, 다 자란 어른벌레(성충)로 낙엽 밑이나 흙 속에서 겨울을 나요.\n용어 풀이:\n· 성충: 다 자란 곤충(어른벌레)\n· 지피물: 땅 위를 덮은 낙엽·풀 등", "ref": "p.25"}, {"id": "산림보호-31", "subject": "산림보호", "num": 31, "part": 2, "stem": "잣나무넓적잎벌에 대한 설명으로 옳은 것은?", "options": ["노숙 유충이 땅속(5~25cm) 흙집에서 월동하며, 주로 20년생 이상 밀생 임분에 발생한다", "연 3회 발생하며 알로 월동한다", "수피 밑을 가해하는 천공성 해충이다", "벌레혹을 만드는 충영형성 해충이다"], "answer": 0, "explain": "연 1회(일부 2년 1회), 땅속 5~25cm에서 유충 월동\n쉬운 풀이: 잣나무넓적잎벌은 잣나무 잎을 먹는 벌의 일종이에요. 다 자란 애벌레가 땅속 5~25cm에 흙집을 짓고 겨울을 나고, 주로 20년생 이상 빽빽한 잣나무 숲에 생겨요. 보통 1년에 1번, 일부는 2년에 1번 생겨요.\n용어 풀이:\n· 노숙 유충: 다 자라 번데기가 되기 직전의 애벌레\n· 흙집(토굴): 흙으로 만든 방\n· 밀생 임분: 빽빽한 숲", "ref": "p.26"}, {"id": "산림보호-32", "subject": "산림보호", "num": 32, "part": 2, "stem": "매미나방의 월동 형태와 장소는?", "options": ["유충, 지피물 밑", "알, 수간", "번데기, 흙 속", "성충, 수피 틈"], "answer": 1, "explain": "· 알로 수간에서 월동, 알 기간 약 9개월\n· 어스렝이나방도 알로 월동\n쉬운 풀이: 매미나방은 나무줄기(수간)에 알을 덩어리로 낳고, 그 알 상태로 겨울을 나요. 알 기간이 약 9개월로 아주 길어요. 겨울에 줄기에 붙은 알덩어리를 긁어내면 방제할 수 있어요.\n용어 풀이:\n· 수간: 나무줄기\n· 알덩어리: 여러 알을 털로 덮어 모아 낳은 것", "ref": "p.27"}, {"id": "산림보호-33", "subject": "산림보호", "num": 33, "part": 2, "stem": "솔잎벌의 연간 발생 횟수는?", "options": ["1회", "2년에 1회", "4~5회", "2~3회"], "answer": 3, "explain": "연 2~3회, 1세대는 구엽·2세대는 신엽 식해\n쉬운 풀이: 솔잎벌은 1년에 2~3번 생겨요. 첫 세대는 지난해 잎(구엽)을, 두 번째 세대는 그해 새로 난 잎(신엽)을 갉아먹어요. 1년에 1번 생기는 솔나방과 헷갈리지 마세요.\n용어 풀이:\n· 구엽: 묵은 잎\n· 신엽: 새 잎\n· 식해: 갉아먹어 생긴 피해", "ref": "p.28"}, {"id": "산림보호-34", "subject": "산림보호", "num": 34, "part": 2, "stem": "소나무좀의 '후식피해'란?", "options": ["새로 우화한 성충이 1년생 신초 속을 뚫고 들어가 고사시키는 피해", "유충이 뿌리를 갉아먹는 피해", "성충이 잎을 갉아먹는 피해", "월동 유충이 수피 밑을 가해하는 피해"], "answer": 0, "explain": "성충이 신초를 뚫고 들어가 꺾이거나 구부러지게 함\n쉬운 풀이: 소나무좀은 두 번 피해를 줘요. 먼저 약한 나무 껍질 밑에 알을 낳아 애벌레가 갉아먹고(번식 피해), 새로 나온 어른벌레가 건강한 나무의 새 가지(신초) 속을 뚫고 들어가 먹어요. 이 두 번째 피해를 '후식피해'라고 하고, 가지가 꺾이거나 휘어요.\n용어 풀이:\n· 후식피해: 성충이 된 뒤 먹이 활동으로 주는 피해\n· 신초: 새로 자란 가지\n· 우화: 번데기에서 성충이 나오는 것", "ref": "p.29"}, {"id": "산림보호-35", "subject": "산림보호", "num": 35, "part": 2, "stem": "박쥐나방에 대한 설명으로 옳은 것은?", "options": ["침엽수만 가해한다", "연 3회 발생한다", "수피와 목질부 표면을 환상으로 식해하며 배설물을 철해 혹처럼 보인다", "잎을 말아 그 속에서 번데기가 된다"], "answer": 2, "explain": "활엽수 가해, 1년 1세대 또는 2년 1세대, 알로 지표에서 월동\n쉬운 풀이: 박쥐나방 애벌레는 활엽수 줄기 껍질과 겉 목재를 고리 모양으로 갉아먹고, 자기 똥과 나무 부스러기를 실로 엮어 구멍을 막아서 혹처럼 보여요. 1년에 1세대 또는 2년에 1세대이고, 알로 땅 위에서 겨울을 나요.\n용어 풀이:\n· 환상: 고리 모양\n· 철하다: 실로 엮어 붙이다\n· 목질부: 나무의 단단한 목재 부분", "ref": "p.30"}, {"id": "산림보호-36", "subject": "산림보호", "num": 36, "part": 2, "stem": "버즘나무방패벌레의 월동 형태는?", "options": ["알", "성충", "유충", "번데기"], "answer": 1, "explain": "성충으로 수피 틈에서 월동, 연 2회\n쉬운 풀이: 버즘나무(플라타너스) 잎 뒤에 붙어 즙을 빨아먹는 방패벌레예요. 1년에 2번 생기고, 어른벌레로 나무껍질 틈에서 겨울을 나요. 도시 가로수 플라타너스 잎이 하얗게 변하는 게 이 벌레 때문이에요.\n용어 풀이:\n· 방패벌레: 몸이 방패 모양인 즙 빨아먹는 곤충\n· 버즘나무(플라타너스): 가로수로 많이 쓰는 활엽수", "ref": "p.31–32"}, {"id": "산림보호-37", "subject": "산림보호", "num": 37, "part": 2, "stem": "솔잎혹파리에 대한 설명으로 옳은 것은?", "options": ["피해 잎은 건전 솔잎 길이의 절반 정도밖에 자라지 못하고, 유충이 지피물 밑이나 얕은 흙 속에서 월동한다", "연 3회 발생한다", "성충의 수명은 약 30일이다", "주로 잣나무를 가해한다"], "answer": 0, "explain": "연 1회, 성충 수명 1~2일, 소나무·해송 가해\n쉬운 풀이: 솔잎혹파리 애벌레가 솔잎 밑에 혹을 만들면 그 솔잎은 정상 길이의 절반밖에 못 자라고 말라요. 1년에 1번 생기고, 애벌레가 낙엽 밑이나 얕은 흙 속에서 겨울을 나요. 어른벌레는 1~2일밖에 못 살아요.\n용어 풀이:\n· 혹파리: 식물에 혹을 만드는 작은 파리\n· 지피물: 땅을 덮은 낙엽 등", "ref": "p.33"}, {"id": "산림보호-38", "subject": "산림보호", "num": 38, "part": 2, "stem": "밤나무혹벌의 월동 형태와 장소는?", "options": ["알, 가지 표면", "성충, 수피 틈", "번데기, 흙 속", "유충, 눈 조직 안"], "answer": 3, "explain": "겨울눈 조직 안에서 유충으로 월동, 직경 10~15mm 충영\n쉬운 풀이: 밤나무혹벌은 밤나무 겨울눈 속에 알을 낳고, 애벌레가 눈 조직 안에서 겨울을 나요. 봄에 눈이 자라면서 지름 1~1.5cm 혹(충영)이 생겨 그 가지엔 꽃과 열매가 안 달려요.\n용어 풀이:\n· 겨울눈: 겨울을 나는 눈(다음 해 가지·꽃이 될 부분)\n· 충영: 벌레혹", "ref": "p.33–34"}, {"id": "산림보호-39", "subject": "산림보호", "num": 39, "part": 2, "stem": "흡즙성 해충에 해당하는 것은?", "options": ["솔나방", "솔껍질깍지벌레", "소나무좀", "밤나무혹벌"], "answer": 1, "explain": "· 흡즙성: 깍지벌레·방패벌레·진딧물\n· ① 식엽성, ③ 천공성, ④ 충영형성\n쉬운 풀이: 해충은 먹는 방식으로 나눠요. 잎을 갉아먹으면 식엽성(솔나방), 줄기를 뚫고 들어가면 천공성(소나무좀), 혹을 만들면 충영형성(밤나무혹벌), 즙을 빨면 흡즙성(깍지벌레·진딧물·방패벌레)이에요.\n용어 풀이:\n· 흡즙성: 즙을 빨아먹는\n· 식엽성: 잎을 갉아먹는\n· 천공성: 구멍을 뚫고 들어가는", "ref": "p.31"}, {"id": "산림보호-40", "subject": "산림보호", "num": 40, "part": 2, "stem": "🆕 개정 산림보호법 시행령 과태료 일반기준상 부과권자가 과태료를 감경할 수 있는 범위는?", "options": ["5분의 1", "3분의 1", "2분의 1", "3분의 2"], "answer": 2, "explain": "감경·가중 모두 2분의 1 범위 (가중 사유 중 위반상태 6개월 이상)\n쉬운 풀이: 과태료는 상황에 따라 줄이거나(감경) 늘릴(가중) 수 있어요. 사소한 실수이거나 바로 고친 경우 2분의 1까지 줄일 수 있고, 고의이거나 6개월 이상 위반 상태면 2분의 1까지 늘릴 수 있어요. 감경·가중 모두 '절반'이에요.\n용어 풀이:\n· 감경: 줄여 줌\n· 가중: 늘림\n· 부과권자: 과태료를 매기는 기관장", "ref": "p.16"}, {"id": "산림보호-41", "subject": "산림보호", "num": 41, "part": 3, "stem": "병 발생에 필요한 '병의 삼각형' 3요소는?", "options": ["병원체·기주·환경", "병원체·매개충·기주", "기주·토양·기후", "병원체·농약·환경"], "answer": 0, "explain": "· 병원체(주인)\n· 기주(소인)\n· 환경(유인)\n쉬운 풀이: 병이 생기려면 세 가지가 동시에 있어야 해요. 병을 일으키는 병원체(주인), 병에 걸리는 식물인 기주(소인), 병이 생기기 좋은 환경(유인)이에요. 셋 중 하나만 없애도 병이 안 생겨서, 방제는 이 삼각형의 한 변을 끊는 거예요.\n용어 풀이:\n· 병원체: 병을 일으키는 미생물 등\n· 기주: 병원체가 기생하는 식물\n· 소인·유인: 병에 걸리기 쉬운 성질·병을 부추기는 조건", "ref": "산림보호학"}, {"id": "산림보호-42", "subject": "산림보호", "num": 42, "part": 3, "stem": "코흐의 원칙(Koch's postulates)의 목적은?", "options": ["농약 효과 판정", "특정 병원체가 그 병의 원인임을 입증", "해충 밀도 조사", "저항성 품종 선발"], "answer": 1, "explain": "병원체 분리 → 순수배양 → 접종 재현 → 재분리로 병원성 입증\n쉬운 풀이: 코흐의 원칙은 '이 미생물이 정말 이 병의 원인인가?'를 증명하는 4단계 절차예요. 병든 식물에서 병원체를 분리 → 그것만 순수하게 키움 → 건강한 식물에 접종해 같은 병 재현 → 다시 같은 병원체를 분리. 범인을 확정하는 과학 수사 같은 거예요.\n용어 풀이:\n· 분리: 병든 조직에서 미생물을 따로 떼어냄\n· 순수배양: 한 종류만 키움\n· 접종: 병원체를 식물에 일부러 감염시킴", "ref": "산림보호학"}, {"id": "산림보호-43", "subject": "산림보호", "num": 43, "part": 3, "stem": "잣나무털녹병의 중간기주는?", "options": ["향나무", "졸참나무", "송이풀·까치밥나무", "쑥부쟁이"], "answer": 2, "explain": "잣나무털녹병 = 송이풀·까치밥나무 기주교대\n쉬운 풀이: 녹병균은 두 가지 식물을 번갈아 오가며 살아요(기주교대). 잣나무털녹병균은 잣나무와 송이풀·까치밥나무를 오가요. 그래서 잣나무 숲 주변의 송이풀을 없애면 병을 막을 수 있어요.\n용어 풀이:\n· 기주교대: 병원균이 서로 다른 두 식물을 오가며 생활하는 것\n· 중간기주: 주 기주가 아닌 다른 쪽 기주\n· 녹병: 쇠녹 같은 가루를 만드는 곰팡이병", "ref": "산림보호학"}, {"id": "산림보호-44", "subject": "산림보호", "num": 44, "part": 3, "stem": "배나무 붉은별무늬병(향나무 녹병)의 기주교대 상대 수종은?", "options": ["향나무", "송이풀", "참나무", "소나무"], "answer": 0, "explain": "향나무와 배나무·사과나무 사이 기주교대\n쉬운 풀이: 배나무 잎에 붉은 별무늬가 생기는 붉은별무늬병균은 향나무와 배나무·사과나무를 오가며 살아요. 그래서 배 과수원 근처엔 향나무를 심지 말라고 해요. '배-향나무' 짝을 기억하세요.\n용어 풀이:\n· 붉은별무늬병(적성병): 배·사과 잎에 붉은 반점이 생기는 녹병\n· 기주교대: 두 식물을 오가는 생활", "ref": "산림보호학"}, {"id": "산림보호-45", "subject": "산림보호", "num": 45, "part": 3, "stem": "소나무혹병의 중간기주는?", "options": ["까치밥나무", "참나무류(졸참나무·신갈나무 등)", "뽕나무", "향나무"], "answer": 1, "explain": "소나무 ↔ 참나무류\n쉬운 풀이: 소나무혹병균은 소나무와 참나무류(졸참나무·신갈나무 등)를 오가며 살아요. 소나무 가지에는 혹을 만들고, 참나무 잎 뒷면에는 녹가루를 만들어요. 녹병 짝 정리: 잣나무–송이풀, 배나무–향나무, 소나무혹병–참나무.\n용어 풀이:\n· 혹병: 가지·줄기에 혹이 생기는 병\n· 중간기주: 병원균이 번갈아 사는 다른 식물", "ref": "산림보호학"}, {"id": "산림보호-46", "subject": "산림보호", "num": 46, "part": 3, "stem": "뿌리혹병의 병원체는?", "options": ["균류", "바이러스", "세균", "선충"], "answer": 2, "explain": "*Agrobacterium tumefaciens* (세균) — 모듈 병원 분류표에도 세균으로 분류\n쉬운 풀이: 뿌리혹병은 아그로박테리움이라는 세균이 뿌리나 줄기 밑동에 혹을 만드는 병이에요. 세균이 식물 유전자에 자기 유전자를 넣어 세포가 마구 자라게 해요. 균류(곰팡이)가 아니라 '세균'인 점이 자주 출제돼요.\n용어 풀이:\n· 세균(박테리아): 단세포 미생물\n· 아그로박테리움: 뿌리혹병을 일으키는 세균", "ref": "산림보호학 · 모듈 p.18"}, {"id": "산림보호-47", "subject": "산림보호", "num": 47, "part": 3, "stem": "불완전변태를 하는 곤충은?", "options": ["나방류", "딱정벌레류", "벌류", "진딧물류"], "answer": 3, "explain": "· 알 → 약충 → 성충 (번데기 없음)\n· 진딧물·깍지벌레·매미 등\n쉬운 풀이: 곤충이 자라는 방식은 두 가지예요. 알 → 애벌레 → 번데기 → 어른벌레로 모습이 확 바뀌면 완전변태(나방·딱정벌레·벌), 번데기 없이 알 → 약충 → 성충으로 비슷한 모양으로 크면 불완전변태(진딧물·매미·깍지벌레)예요.\n용어 풀이:\n· 완전변태: 번데기 단계가 있는 탈바꿈\n· 불완전변태: 번데기 단계가 없는 탈바꿈\n· 약충: 불완전변태 곤충의 어린 시기", "ref": "산림해충학"}, {"id": "산림보호-48", "subject": "산림보호", "num": 48, "part": 3, "stem": "미생물 살충제 BT(*Bacillus thuringiensis*)가 주로 방제하는 대상은?", "options": ["나방류 유충", "응애", "선충", "균류"], "answer": 0, "explain": "BT는 나비목 유충(솔나방·매미나방 등) 방제용\n쉬운 풀이: BT는 흙에 사는 세균(바실루스 투린지엔시스)이 만드는 독소를 이용한 살충제예요. 나비·나방 애벌레가 먹으면 장이 망가져 죽지만 사람·새에겐 거의 해가 없어요. 솔나방·매미나방 같은 나방류 애벌레 방제에 써요.\n용어 풀이:\n· 미생물 살충제: 미생물을 이용한 친환경 살충제\n· 나비목: 나비와 나방 무리\n· 유충: 애벌레", "ref": "산림해충학"}, {"id": "산림보호-49", "subject": "산림보호", "num": 49, "part": 3, "stem": "50% 유제를 1,000배로 희석해 물 20L에 탈 때 필요한 약량은?", "options": ["2mL", "20mL", "200mL", "2,000mL"], "answer": 1, "explain": "20,000mL ÷ 1,000 = 20mL\n쉬운 풀이: 1,000배로 희석한다는 건 물 1,000에 약 1을 섞는다는 뜻이에요. 물 20L = 20,000mL이니 20,000 ÷ 1,000 = 20mL를 넣으면 돼요. 약의 농도(50%)는 이 계산에 쓰이지 않는 함정 숫자예요.\n용어 풀이:\n· 희석: 물을 섞어 묽게 함\n· 유제: 기름에 녹인 액체 농약\n· 배수 희석: 약 1에 물을 몇 배 섞는지로 나타냄", "ref": "농약학"}, {"id": "산림보호-50", "subject": "산림보호", "num": 50, "part": 3, "stem": "산불경보의 단계를 낮은 단계부터 바르게 나열한 것은?", "options": ["주의 → 관심 → 경계 → 심각", "관심 → 경계 → 주의 → 심각", "관심 → 주의 → 경계 → 심각", "경계 → 주의 → 관심 → 심각"], "answer": 2, "explain": "관심 → 주의 → 경계 → 심각 (2026 모듈 본문에는 경보 표가 없으므로 전공서적·법령 범위)\n쉬운 풀이: 산불경보는 위험이 커지는 순서로 '관심 → 주의 → 경계 → 심각' 4단계예요. 일반 재난경보 단계와 같은 순서라 '관·주·경·심'으로 외우세요.\n용어 풀이:\n· 산불경보: 산불 위험 정도를 알리는 경보\n· 심각: 가장 높은 위험 단계", "ref": "산림보호법 시행규칙"}, {"id": "산림보호-51", "subject": "산림보호", "num": 51, "part": 4, "stem": "배나무 붉은별무늬병(적성병)의 병원균이 겨울을 보내는 중간기주 수종은?", "options": ["잣나무", "향나무", "아까시나무", "밤나무"], "answer": 1, "explain": "배나무 적성병균(Gymnosporangium)의 중간기주는 향나무속(노간주나무 등)\n쉬운 풀이: 배나무 붉은별무늬병균은 여름엔 배나무 잎에서, 겨울엔 향나무(노간주나무 포함)에서 지내요. 그래서 배 과수원 주변 향나무를 없애는 게 효과적인 방제법이에요.\n용어 풀이:\n· 적성병: 붉은별무늬병\n· 중간기주: 병원균이 다른 계절을 보내는 식물\n· 향나무속: 향나무·노간주나무 등의 무리", "ref": "수목병리학"}, {"id": "산림보호-52", "subject": "산림보호", "num": 52, "part": 4, "stem": "잎 표면에 밀가루를 뿌려놓은 듯한 흰 균사가 생기며 가을철에 흑색의 자낭각을 형성하는 수병은?", "options": ["그을음병", "탄저병", "흰가루병", "모잘록병"], "answer": 2, "explain": "흰가루병균(Erysiphales)은 표생균으로 백색 균사층 형성 후 흑색 자낭각으로 월동\n쉬운 풀이: 흰가루병은 이름처럼 잎 표면에 밀가루를 뿌린 듯 흰 곰팡이가 덮이는 병이에요. 곰팡이가 잎 겉에서 자라고, 가을이 되면 검은 알갱이(자낭각)를 만들어 그 상태로 겨울을 나요.\n용어 풀이:\n· 흰가루병: 잎에 흰 가루 모양 곰팡이가 생기는 병\n· 균사: 곰팡이의 실 모양 몸\n· 자낭각: 포자가 든 작은 주머니 구조", "ref": "수목병리학"}, {"id": "산림보호-53", "subject": "산림보호", "num": 53, "part": 4, "stem": "느티나무, 사시나무 등의 잎에 발생하는 그을음병(Sooty mold)의 직접적인 유발 원인은?", "options": ["토양 내 질소질 비료 결핍", "진딧물·깍지벌레류가 분비한 감로(단물)에 곰팡이가 번식", "강한 자외선에 의한 엽록소 파괴", "산성비에 의한 잎 표면 왁스층 용해"], "answer": 1, "explain": "진딧물·깍지벌레의 배설물(감로)이 잎에 묻으면 부생성 곰팡이가 번식해 그을음 형성\n쉬운 풀이: 그을음병은 잎이 그을음을 뒤집어쓴 것처럼 까맣게 되는 병이에요. 진딧물·깍지벌레가 즙을 빨고 내놓은 끈적한 단물(감로)에 곰팡이가 자라서 생겨요. 그래서 그을음병을 막으려면 먼저 진딧물·깍지벌레를 잡아야 해요.\n용어 풀이:\n· 감로: 진딧물 등이 배설하는 달콤한 액체\n· 부생성 곰팡이: 죽은 물질이나 분비물을 먹고 사는 곰팡이", "ref": "산림보호학"}, {"id": "산림보호-54", "subject": "산림보호", "num": 54, "part": 4, "stem": "묘포장에서 발생하는 모잘록병(Damping-off)의 주요 원인균 속(Genus)에 해당하지 않는 것은?", "options": ["*Rhizoctonia*", "*Pythium*", "*Fusarium*", "*Puccinia*"], "answer": 3, "explain": "· *Puccinia*는 녹병균속(Rust)\n· 모잘록병 4대 균은 *Pythium*, *Rhizoctonia*, *Fusarium*, *Phytophthora*\n쉬운 풀이: 모잘록병은 어린 묘목 밑동이 잘록하게 썩어 쓰러지는 병으로, 피시움·리족토니아·푸사리움·파이토프토라 같은 흙 속 곰팡이가 일으켜요. 푸치니아(Puccinia)는 녹병균이라 관계없어요.\n용어 풀이:\n· 모잘록병(입고병): 어린 묘가 밑동이 썩어 쓰러지는 병\n· 속(Genus): 생물 분류 단위\n· 녹병균: 녹 같은 가루를 만드는 곰팡이", "ref": "묘포병리학"}, {"id": "산림보호-55", "subject": "산림보호", "num": 55, "part": 4, "stem": "밤나무 줄기마름병(동고병, *Cryphonectria parasitica*)의 주요 침입 경로는?", "options": ["기공을 통한 직접 침입", "껍질의 상처나 동해 피해 부위를 통한 침입", "뿌리의 균근을 통한 침입", "잎의 수공(물구멍)을 통한 침입"], "answer": 1, "explain": "밤나무 동고병균은 상처 침입균으로 수피의 동해·가지치기 상처를 통해 균사 침입\n쉬운 풀이: 밤나무 줄기마름병균은 스스로 껍질을 뚫지 못하고 상처로 들어가요. 추위로 터진 곳(동해 부위)이나 가지치기 상처가 주요 통로예요. 그래서 상처에 도포제를 바르고 동해를 막는 게 중요해요.\n용어 풀이:\n· 줄기마름병(동고병): 줄기 껍질이 말라 죽는 병\n· 동해: 추위로 생긴 피해\n· 상처 침입균: 상처를 통해서만 들어가는 균", "ref": "수목병리학"}, {"id": "산림보호-56", "subject": "산림보호", "num": 56, "part": 4, "stem": "오동나무 빗자루병을 매개하는 곤충은?", "options": ["마름무늬매미충", "담배장님노린재", "솔수염하늘소", "잣나무넓적잎벌"], "answer": 1, "explain": "오동나무 빗자루병은 담배장님노린재, 대추나무 빗자루병은 마름무늬매미충이 매개\n쉬운 풀이: 빗자루병을 옮기는 곤충은 나무마다 달라요. 오동나무 빗자루병은 담배장님노린재, 대추나무 빗자루병은 마름무늬매미충이 옮겨요. '오동-담배, 대추-마름'으로 짝지어 외우세요.\n용어 풀이:\n· 매개: 병원체를 옮기는 것\n· 노린재: 즙을 빠는 곤충 무리\n· 매미충: 작은 매미 비슷한 곤충", "ref": "파이토플라스마병"}, {"id": "산림보호-57", "subject": "산림보호", "num": 57, "part": 4, "stem": "소나무재선충의 매개충인 솔수염하늘소의 주된 월동 태는?", "options": ["알", "노숙 유충(목질부 속 갱도)", "번데기", "성충"], "answer": 1, "explain": "솔수염하늘소는 목질부 갱도 속에서 3~4령 노숙유충 상태로 월동 후 봄에 번데기가 됨\n쉬운 풀이: 솔수염하늘소 애벌레는 죽어 가는 소나무 목재 속에 굴(갱도)을 파고 살면서, 다 자란 애벌레(노숙 유충) 상태로 겨울을 나요. 봄에 번데기가 되고 5~8월에 어른벌레가 나오면서 재선충을 몸에 싣고 다른 소나무로 옮겨요.\n용어 풀이:\n· 갱도: 곤충이 나무 속에 판 굴\n· 노숙 유충: 다 자란 애벌레\n· 목질부: 나무의 목재 부분", "ref": "산림곤충학"}, {"id": "산림보호-58", "subject": "산림보호", "num": 58, "part": 4, "stem": "남부 해안지대 곰솔림 등에 극심한 피해를 주며, 암수 형태가 전혀 다르고 겨울철에 수액을 흡즙하는 해충은?", "options": ["솔잎혹파리", "솔껍질깍지벌레", "솔알락명나방", "소나무좀"], "answer": 1, "explain": "· 솔껍질깍지벌레는 암컷 성충이 무시(날개 없음), 수컷은 유시\n· 겨울~봄철 후식 피해 극심\n쉬운 풀이: 솔껍질깍지벌레는 암컷과 수컷 모습이 완전히 달라요. 암컷은 날개가 없고 껍질 틈에 붙어 즙을 빨고, 수컷은 날개가 있어요. 다른 해충이 쉬는 겨울~봄에 즙을 빨아 남해안 곰솔을 많이 죽였어요.\n용어 풀이:\n· 무시: 날개가 없음\n· 유시: 날개가 있음\n· 흡즙: 즙을 빨아먹음", "ref": "산림곤충학"}, {"id": "산림보호-59", "subject": "산림보호", "num": 59, "part": 4, "stem": "미국흰불나방의 생태적 특성으로 옳지 **않은** 것은?", "options": ["1년에 보통 2~3회 발생한다", "어린 유충 시기에는 거미줄을 치고 군서 생활을 한다", "번데기 상태로 수피 틈이나 낙엽 밑에서 월동한다", "침엽수 수종만 선택적으로 가해하는 식엽성 해충이다"], "answer": 3, "explain": "미국흰불나방은 광식성(활엽수 수백 종 가해) 식엽성 해충 (침엽수 전용 아님)\n쉬운 풀이: 미국흰불나방은 1년에 2~3번 생기고, 어린 애벌레가 거미줄 같은 실을 치고 무리 지어 살며 잎을 갉아먹어요. 번데기로 껍질 틈이나 낙엽 밑에서 겨울을 나요. 수백 종의 '활엽수'를 가리지 않고 먹으니 '침엽수만 가해'가 틀렸어요.\n용어 풀이:\n· 광식성: 여러 종류 식물을 가리지 않고 먹는 성질\n· 군서: 무리 지어 삶\n· 식엽성: 잎을 먹는", "ref": "산림곤충학"}, {"id": "산림보호-60", "subject": "산림보호", "num": 60, "part": 4, "stem": "버즘나무(플라타너스) 잎 뒷면에 기생하여 즙액을 빨아먹고 검은 배설물을 남겨 잎을 황백색으로 탈색시키는 해충은?", "options": ["버즘나무방패벌레", "매미나방", "오리나무잎벌레", "솔수염하늘소"], "answer": 0, "explain": "버즘나무방패벌레는 성충과 약충이 잎 뒷면에서 흡즙하여 백화 현상 유발\n쉬운 풀이: 버즘나무방패벌레는 플라타너스 잎 뒷면에 붙어 즙을 빨고 까만 똥을 남겨요. 즙을 빨린 잎은 엽록소가 빠져 하얗게 얼룩져요(백화). 어른벌레와 애벌레(약충) 모두 피해를 줘요.\n용어 풀이:\n· 백화: 잎이 하얗게 탈색되는 현상\n· 약충: 불완전변태 곤충의 어린 시기", "ref": "산림해충학"}, {"id": "산림보호-61", "subject": "산림보호", "num": 61, "part": 4, "stem": "농약의 독성을 나타낼 때 시험동물의 50%를 치사시키는 데 필요한 체중 1kg당 약량(mg/kg)을 뜻하는 기호는?", "options": ["TLm", "LC50", "LD50", "EC50"], "answer": 2, "explain": "반수치사량은 LD50 (Lethal Dose 50%), 수치가 작을수록 독성이 강함\n쉬운 풀이: LD50은 실험동물의 절반(50%)이 죽는 약의 양을 체중 1kg당 mg으로 나타낸 거예요. 아주 조금만 먹어도 절반이 죽는다면 독성이 강한 거니까, LD50 숫자가 작을수록 더 위험한 농약이에요.\n용어 풀이:\n· LD50(반수치사량): 50%가 죽는 투여량\n· LC50: 공기·물 속 농도로 나타낸 반수치사농도\n· 독성: 생물에 해를 주는 성질", "ref": "농약학"}, {"id": "산림보호-62", "subject": "산림보호", "num": 62, "part": 4, "stem": "유기인계 살충제가 곤충의 신경계를 마비시켜 살충 작용을 나타내는 생화학적 기작은?", "options": ["아세틸콜린에스테라제(AChE) 활성 저해", "큐티클층 키틴 합성 억제", "미토콘드리아 전자전달계 차단", "세포벽 합성 효소 분해"], "answer": 0, "explain": "유기인계 및 카바메이트계는 신경전달물질 분해효소인 AChE를 저해하여 신경 마비 초래\n쉬운 풀이: 신경은 아세틸콜린이라는 물질로 신호를 전달하고, 아세틸콜린에스테라제(AChE)라는 효소가 그 신호를 꺼 줘요. 유기인계 살충제는 이 효소를 막아서 신호가 계속 켜진 채로 있게 해 곤충이 경련하다 마비돼 죽어요.\n용어 풀이:\n· AChE: 신경 신호 물질을 분해하는 효소\n· 유기인계: 인을 포함한 유기 화합물 살충제\n· 저해: 작용을 방해함", "ref": "농약학"}, {"id": "산림보호-63", "subject": "산림보호", "num": 63, "part": 4, "stem": "월동기 수목의 응애류 및 병원균 방제를 위해 황분말과 생석회를 끓여 제조하는 알칼리성 살균·살충제는?", "options": ["석회보르도액", "석회황합제(석회유황합제)", "포르말린", "다이센 M-45"], "answer": 1, "explain": "석회황합제는 생석회+황분말을 1:2 비율로 끓여 조제하며 월동기 월동 병해충 방제에 탁월\n쉬운 풀이: 석회황합제는 생석회와 황 가루를 물에 넣고 끓여 만든 알칼리성 약이에요. 겨울철 나무에 붙어 겨울을 나는 응애·깍지벌레·병원균을 없애는 데 효과가 좋아요. 보르도액(석회+황산구리)과 헷갈리지 마세요.\n용어 풀이:\n· 석회황합제(석회유황합제): 생석회+황을 끓인 살균·살충제\n· 응애: 거미 친척인 아주 작은 해충\n· 생석회: 산화칼슘", "ref": "농약학"}, {"id": "산림보호-64", "subject": "산림보호", "num": 64, "part": 4, "stem": "산불 위험 예보 시 산림 내 마른 낙엽의 건조 상태를 나타내는 실효습도(Effective humidity)의 기준 중 산불 경보 발령 기준(매우 위험)에 해당하는 것은?", "options": ["실효습도 60% 이상", "실효습도 50%", "실효습도 40%", "실효습도 25% 이하"], "answer": 3, "explain": "실효습도 35% 이하 시 주의보, 25% 이하가 2일 이상 지속 시 산불경보 발령\n쉬운 풀이: 실효습도는 며칠간의 습도를 종합해 '나무와 낙엽이 얼마나 말랐는지'를 나타내는 습도예요. 35% 이하면 산불 주의보, 25% 이하가 2일 이상 계속되면 산불 경보를 내려요. 숫자가 낮을수록 위험해요.\n용어 풀이:\n· 실효습도: 며칠간의 습도를 반영한 건조 지수\n· 주의보·경보: 위험 정도에 따른 알림 단계", "ref": "산불통계규정"}, {"id": "산림보호-65", "subject": "산림보호", "num": 65, "part": 4, "stem": "강풍을 동반한 대형 산불 시 솔방울이나 나뭇가지 등 불씨가 공중으로 치솟아 주 산불 전방 수백 미터 이상 날아가 새로운 불을 지르는 현상은?", "options": ["비화(Spotting fire)", "수관화", "지중화", "대류열 복사"], "answer": 0, "explain": "강풍에 의해 불씨가 원거리로 날아가는 현상을 비화(Spotting)라 하며 대형화의 주원인\n쉬운 풀이: 센 바람이 불면 불붙은 솔방울·나뭇가지가 하늘로 날아올라 수백 m 앞에 떨어져 새로운 불을 내요. 이걸 비화(날아가는 불)라고 하고, 산불이 갑자기 커지는 가장 큰 원인이에요. 강원도 대형 산불에서 자주 나타나요.\n용어 풀이:\n· 비화(飛火): 불씨가 날아가 새 불을 붙이는 현상\n· 지중화: 땅속 유기물층이 타는 산불", "ref": "산불진화학"}, {"id": "산림보호-66", "subject": "산림보호", "num": 66, "part": 4, "stem": "겨울철 또는 초봄 낮 동안 햇볕을 받아 따뜻해진 줄기 남서쪽 수피가 밤에 급격히 냉각되면서 수축 팽창 차이로 줄기가 세로로 터져 갈라지는 현상은?", "options": ["동사", "만상", "상렬(Frost crack)", "한해"], "answer": 2, "explain": "상렬(Frost crack)은 낮과 밤의 급격한 온도차로 줄기 바깥쪽과 안쪽 수축 차에 의해 터짐\n쉬운 풀이: 겨울 낮엔 햇볕을 받는 줄기 남서쪽 껍질이 따뜻해졌다가, 밤에 갑자기 얼어붙으면서 바깥만 확 줄어들어요. 안쪽과 수축 차이가 커서 줄기가 세로로 쩍 갈라지는데, 이게 상렬이에요.\n용어 풀이:\n· 상렬(Frost crack): 추위로 줄기가 세로로 갈라짐\n· 수축·팽창: 줄어들고 늘어남", "ref": "수목생리학"}, {"id": "산림보호-67", "subject": "산림보호", "num": 67, "part": 4, "stem": "대기오염 물질인 아황산가스(SO₂)에 대한 수목의 내성 비교로 옳은 것은?", "options": ["은행나무는 침엽수보다 아황산가스에 매우 취약하다", "소나무, 잣나무 등 침엽수는 활엽수에 비해 일반적으로 감수성(피해)이 크다", "플라타너스는 공해에 가장 약한 대표 수종이다", "활엽수의 잎이 침엽수의 잎보다 기공 저항이 항상 낮다"], "answer": 1, "explain": "침엽수는 상록성으로 잎의 수명이 길어 만성적인 아황산가스 축적 피해에 훨씬 취약함\n쉬운 풀이: 소나무·잣나무 같은 침엽수는 잎이 2~3년 이상 달려 있어서 그동안 아황산가스를 계속 흡수해 쌓여요. 그래서 1년마다 잎을 떨구는 활엽수보다 피해가 커요. 은행나무·플라타너스는 오히려 공해에 강한 가로수예요.\n용어 풀이:\n· 아황산가스(SO₂): 화석연료를 태울 때 나오는 오염물질\n· 감수성: 피해를 받기 쉬운 정도\n· 상록성: 잎이 1년 내내 달려 있는 성질", "ref": "환경수목학"}, {"id": "산림보호-68", "subject": "산림보호", "num": 68, "part": 4, "stem": "소나무재선충병 감염목의 훈증 방제 작업 시 밀폐용 타포린 비닐 피복재의 두께 기준으로 알맞은 것은?", "options": ["0.01mm 이상", "0.05mm 이상", "0.10mm 이상", "0.50mm 이상"], "answer": 2, "explain": "훈증용 타포린 비닐은 약제 가스 누출 방지를 위해 두께 0.1mm 이상 기준\n쉬운 풀이: 훈증 처리할 때 덮는 비닐이 얇으면 약 가스가 새어 나가 효과가 떨어져요. 그래서 타포린 비닐 두께를 0.1mm 이상으로 정해 두었어요.\n용어 풀이:\n· 타포린: 방수 처리한 두꺼운 비닐 천\n· 피복재: 덮는 재료\n· 훈증: 가스로 해충을 죽이는 방법", "ref": "소나무재선충방제지침"}, {"id": "산림보호-69", "subject": "산림보호", "num": 69, "part": 4, "stem": "암컷 곤충이 수컷을 유인할 때 분비하는 성 페로몬(Sex pheromone)을 트랩에 넣어 해충을 유인 포살하는 방제법의 분류는?", "options": ["화학적 방제", "생물학적 방제(생물학적 제제 활용)", "기계적 방제", "임업적 방제"], "answer": 1, "explain": "페로몬 트랩은 곤충 고유의 화학물질을 모방한 생물적 방제 수단으로 분류\n쉬운 풀이: 곤충 암컷은 수컷을 부르는 냄새 물질(성 페로몬)을 내요. 이 냄새를 인공으로 만들어 덫(트랩)에 넣으면 수컷이 몰려와 잡혀요. 곤충 고유의 생물학적 신호를 이용하는 거라 생물학적 방제로 분류해요.\n용어 풀이:\n· 페로몬: 같은 종끼리 신호를 주고받는 화학물질\n· 트랩: 해충을 유인해 잡는 덫\n· 생물학적 방제: 천적·미생물·생물 신호를 이용한 방제", "ref": "해충방제학"}, {"id": "산림보호-70", "subject": "산림보호", "num": 70, "part": 4, "stem": "산림보호법상 산불예방을 위해 입산통제구역으로 지정·고시할 수 있는 권한권자는?", "options": ["관할 지방산림청장 또는 지방자치단체의 장", "소방청장", "국방부장관", "산림조합중앙회장"], "answer": 0, "explain": "산림보호법상 입산통제구역 지정 권한은 관할 지방산림청장 또는 지자체장(시장·군수·구청장)\n쉬운 풀이: 산불이 나기 쉬운 계절에는 사람 출입을 막는 입산통제구역을 정해요. 이걸 지정하는 권한은 관할 지방산림청장이나 지방자치단체장(시장·군수·구청장)에게 있어요.\n용어 풀이:\n· 입산통제구역: 사람 출입을 막는 산림 구역\n· 지방산림청장: 지역별 산림청 기관장\n· 고시: 공식적으로 알림", "ref": "산림보호법"}, {"id": "산림보호-71", "subject": "산림보호", "num": 71, "part": 4, "stem": "최근 온난화로 인해 대발생하여 과수 및 산림 활엽수의 줄기에 집단으로 달라붙어 수액을 빨아먹고 그을음병을 유발하는 외래 돌발해충은?", "options": ["미국선녀벌레, 꽃매미", "솔잎혹파리", "밤나무혹벌", "솔껍질깍지벌레"], "answer": 0, "explain": "꽃매미와 미국선녀벌레는 2000년대 이후 정착한 대표 외래 흡즙성 돌발해충입니다.\n쉬운 풀이: 꽃매미와 미국선녀벌레는 2000년대 이후 외국에서 들어와 정착한 해충이에요. 줄기에 떼로 붙어 즙을 빨고 끈적한 배설물을 남겨 그을음병까지 일으켜요. 갑자기 대발생해서 '돌발해충'이라고 불러요.\n용어 풀이:\n· 외래 해충: 외국에서 들어온 해충\n· 돌발해충: 갑자기 대량 발생하는 해충\n· 흡즙성: 즙을 빨아먹는", "ref": "산림보호학 돌발해충"}, {"id": "산림보호-72", "subject": "산림보호", "num": 72, "part": 4, "stem": "소나무 줄기나 가지에 큰 혹(Gall)을 형성하며 봄철에 오렌지색 포자퇴를 터뜨리는 소나무 혹병(Cronartium quercuum)의 중간기주는?", "options": ["참나무류(신갈, 갈참 등)", "배나무", "향나무", "송이풀"], "answer": 0, "explain": "소나무 혹병균은 소나무 ↔ 참나무류 잎을 번갈아 가며 기주교대합니다.\n쉬운 풀이: 소나무혹병은 소나무 가지에 큰 혹을 만들고, 봄에 혹이 터지면서 주황색 가루(포자)를 날려요. 이 포자는 참나무 잎으로 날아가 감염시키고, 참나무에서 만든 포자가 다시 소나무로 와요. 중간기주는 참나무류예요.\n용어 풀이:\n· 포자퇴: 포자가 모여 터져 나오는 덩어리\n· 기주교대: 두 식물을 번갈아 오감", "ref": "수목병리학"}, {"id": "산림보호-73", "subject": "산림보호", "num": 73, "part": 4, "stem": "잣나무 잎을 갉아먹는 해충으로, 유충이 실을 토해 여러 개의 잣나무 잎을 원통형으로 엮어 집을 짓고 그 속에서 가해하는 해충은?", "options": ["잣나무넓적잎벌", "솔나방", "솔알락명나방", "매미나방"], "answer": 0, "explain": "잣나무넓적잎벌 유충은 잎을 엮어 만든 방 속에 숨어 살며 잣나무 잎을 집단 식해합니다.\n쉬운 풀이: 잣나무넓적잎벌 애벌레는 실을 토해서 잣나무 잎 여러 개를 원통 모양으로 엮어 집을 만들고, 그 안에 숨어서 잎을 갉아먹어요. 무리로 먹어서 잣나무 숲이 붉게 변할 정도로 피해가 커요.\n용어 풀이:\n· 식해: 갉아먹어 생긴 피해\n· 유충: 애벌레", "ref": "산림해충학"}, {"id": "산림보호-74", "subject": "산림보호", "num": 74, "part": 4, "stem": "수목의 바이러스(Virus) 병해의 진단 및 전염 특성으로 옳지 **않은** 것은?", "options": ["즙액 접종, 접목, 진딧물이나 선충 매개에 의해 전염된다.", "일반 광학현미경으로 병원체를 쉽게 직접 관찰할 수 있다.", "잎에 모자이크 무늬, 얼룩 반점, 왜화(난쟁이화) 증상이 나타난다.", "살균제를 뿌려도 바이러스 자체를 직접 치료하기 어렵다."], "answer": 1, "explain": "바이러스는 크기가 수십~수백 nm로 매우 작아 전자현미경으로만 관찰 가능합니다.\n쉬운 풀이: 바이러스는 수십~수백 nm(나노미터)로 너무 작아서 일반 광학현미경으로는 안 보이고 전자현미경으로만 보여요. 즙액·접목·진딧물로 옮고, 잎에 모자이크 무늬가 생기며, 살균제로도 치료가 어려워요.\n용어 풀이:\n· nm(나노미터): 10억분의 1m\n· 전자현미경: 전자빔으로 아주 작은 것을 보는 현미경\n· 왜화: 식물이 작게 자라는 증상", "ref": "수목병리학"}, {"id": "산림보호-75", "subject": "산림보호", "num": 75, "part": 4, "stem": "산불 진화 전술에서 지표화가 수관화로 번지는 것을 막기 위해 수목을 벌채하고 낙엽을 긁어내어 불길을 차단하는 방화선(Fireline)의 표준 너비는?", "options": ["10cm 내외", "수관 높이의 1.5~2배 내외", "500m 이상", "폭은 관계없음"], "answer": 1, "explain": "방화선의 폭은 나무의 키(수고)에 비례하여 불길이 복사열이나 화염으로 건너뛰지 못하도록 수고의 1.5~2배 이상 확보합니다.\n쉬운 풀이: 방화선은 나무를 베고 낙엽을 긁어 '탈 것이 없는 띠'를 만들어 불을 막는 선이에요. 불꽃과 열이 건너뛰지 못하게 폭을 나무 키의 1.5~2배 이상으로 넓게 만들어요.\n용어 풀이:\n· 방화선: 불이 번지지 못하게 만든 빈 띠\n· 복사열: 불에서 직접 퍼져 나오는 열", "ref": "산불방제학"}, {"id": "산림보호-76", "subject": "산림보호", "num": 76, "part": 4, "stem": "국내 농산물 및 임산물에 잔류허용기준이 설정되지 않은 농약이 검출되었을 때 일괄적으로 적용하는 불검출 기준(PLS 제도) 수치는?", "options": ["0.01 mg/kg(ppm) 이하", "0.1 mg/kg", "1.0 mg/kg", "5.0 mg/kg"], "answer": 0, "explain": "농약 허용기준 강화제도(PLS)상 등록되지 않은 농약은 0.01ppm 이하(사실상 불검출) 기준이 적용됩니다.\n쉬운 풀이: PLS 제도는 '등록되지 않은 농약은 사실상 쓰지 말라'는 제도예요. 기준이 정해지지 않은 농약이 검출되면 0.01mg/kg(ppm) 이하, 즉 거의 안 나와야 통과해요.\n용어 풀이:\n· PLS(농약 허용기준 강화제도): 미등록 농약에 엄격한 기준을 적용하는 제도\n· 잔류허용기준: 농산물에 남아도 되는 농약 양\n· ppm: 백만분의 1", "ref": "농약안전사용기준"}, {"id": "산림보호-77", "subject": "산림보호", "num": 77, "part": 4, "stem": "소나무재선충병 예방을 위해 겨울철(1~2월)에 건전한 소나무의 줄기 기부에 구멍을 뚫고 주입하는 약제로 2년간 예방 효과가 지속되는 수간주사제는?", "options": ["아바멕틴(또는 에마멕틴벤조에이트) 유제", "석회황합제", "메탐소듐", "만코제브"], "answer": 0, "explain": "아바멕틴계 살충제는 나무 수액을 타고 전신에 퍼져 재선충이 침입해도 번식하지 못하게 막습니다.\n쉬운 풀이: 예방 나무주사는 겨울(1~2월)에 건강한 소나무 밑동에 구멍을 뚫고 아바멕틴·에마멕틴벤조에이트를 넣는 거예요. 약이 수액을 타고 나무 전체에 퍼져서 2년 정도 재선충이 들어와도 번식하지 못하게 막아요.\n용어 풀이:\n· 수간주사: 줄기에 약을 주입하는 방법\n· 기부: 줄기 밑동\n· 수액: 나무 속을 흐르는 액체", "ref": "소나무재선충방제지침"}, {"id": "산림보호-78", "subject": "산림보호", "num": 78, "part": 4, "stem": "한겨울 수목이 영하의 저온에 노출될 때 일어나는 '세포 외 동결(Extracellular freezing)'에 대한 설명으로 옳은 것은?", "options": ["세포벽 바깥(세포간극)의 물이 먼저 얼면서 세포 내부의 수분을 끌어당겨 세포가 탈수된다.", "세포 내부의 원형질이 먼저 얼어 세포벽을 파괴한다.", "수목의 당분 함량이 낮을수록 동결을 잘 견딘다.", "세포 외 동결이 일어나면 수목은 100% 즉시 고사한다."], "answer": 0, "explain": "내한성이 강한 수목은 세포 밖에서 먼저 얼음이 얼게 유도하여 세포 내 수분을 밖으로 빼냄으로써 세포 원형질의 파괴를 방어합니다.\n쉬운 풀이: 추위에 강한 나무는 세포 '바깥' 틈의 물이 먼저 얼게 해요. 그러면 세포 안 물이 밖으로 빠져나가 세포 안은 진해지고 잘 얼지 않아요. 세포 안에서 얼음이 생기면 세포가 터져 죽기 때문에 이렇게 스스로 방어하는 거예요.\n용어 풀이:\n· 세포 외 동결: 세포 밖에서 얼음이 생기는 현상\n· 세포간극: 세포 사이의 틈\n· 원형질: 세포 안의 살아 있는 물질", "ref": "수목생리학"}, {"id": "산림보호-79", "subject": "산림보호", "num": 79, "part": 4, "stem": "아까시나무 잎에 벌레혹을 만들어 잎을 누렇게 말라 떨어뜨리는 아까시잎혹파리의 월동 형태와 장소는?", "options": ["알 상태로 나뭇가지 끝", "유충 또는 번데기 상태로 땅속(토양)", "성충으로 수피 틈", "거미줄 속"], "answer": 1, "explain": "아까시잎혹파리는 가을에 땅으로 떨어져 흙 속에서 유충 또는 번데기로 겨울을 납니다.\n쉬운 풀이: 아까시잎혹파리는 아까시나무 잎 가장자리를 말아 혹을 만들어요. 가을이 되면 애벌레가 땅으로 떨어져 흙 속에서 애벌레나 번데기 상태로 겨울을 나요.\n용어 풀이:\n· 혹파리: 식물에 혹을 만드는 작은 파리\n· 월동: 겨울나기", "ref": "산림곤충학"}, {"id": "산림보호-80", "subject": "산림보호", "num": 80, "part": 4, "stem": "산림보호법상 산불을 발생하게 한 자가 부담해야 하는 법적 책임의 범위로 옳은 것은?", "options": ["형사처벌(징역·벌금)과 별도로 산림 피해에 대한 민사상 손해배상 책임도 함께 진다.", "형사처벌을 받으면 민사상 책임은 전액 면제된다.", "고의가 아닌 과실인 경우에는 아무런 법적 처벌을 받지 않는다.", "국유림 산불에 대해서는 국가가 전액 부담하므로 가해자 책임이 없다."], "answer": 0, "explain": "산불 실화자는 형사처벌(3년 이하 징역/3천만원 벌금)과 함께 진화 비용 및 입목 피해액에 대한 민사 배상 책임을 모두 집니다.\n쉬운 풀이: 산불을 낸 사람은 형사처벌(징역·벌금)을 받는 것과 별개로, 진화 비용과 불탄 나무 피해를 물어 주는 민사상 손해배상 책임도 져요. 실수(과실)로 냈어도 처벌받아요. 두 책임은 따로따로예요.\n용어 풀이:\n· 형사처벌: 범죄에 대한 국가의 처벌(징역·벌금)\n· 민사 책임: 피해를 돈으로 물어 주는 책임\n· 실화: 실수로 불을 냄", "ref": "산림보호법"}, {"id": "산림보호-81", "subject": "산림보호", "num": 81, "part": 4, "stem": "수목의 세균(Bacteria) 및 진균(Fungi) 병원체가 기주의 온전한 큐티클층(각피)을 직접 뚫지 못하고 기공, 피목, 수공 등 식물체의 자연 개구부를 통해 주로 침입하는 감염 경로는?", "options": ["직접 침입", "자연 개구부 침입", "매개충 매개 침입", "접목 침입"], "answer": 1, "explain": "· 세균은 효소나 기계적 힘으로 각피를 뚫지 못하므로 기공, 피목, 수공 같은 자연 개구부나 상처를 통해서만 침입합니다.\n· 진균 중에서도 일부 불완전균은 자연 개구부로 주로 침입합니다.\n쉬운 풀이: 세균은 식물 겉의 왁스막(각피)을 뚫을 힘이 없어서, 원래 열려 있는 구멍으로 들어가요. 잎의 숨구멍(기공), 줄기의 숨구멍(피목), 잎 가장자리 물구멍(수공) 같은 '자연 개구부'나 상처가 통로예요.\n용어 풀이:\n· 자연 개구부: 식물에 원래 뚫려 있는 구멍\n· 피목: 줄기·가지 껍질의 숨구멍\n· 수공: 잎 가장자리의 물 배출 구멍", "ref": "산림수병학"}, {"id": "산림보호-82", "subject": "산림보호", "num": 82, "part": 4, "stem": "잣나무 털녹병균(*Cronartium ribicola*)의 생활사에서 중간기주인 송이풀이나 까치밥나무 잎 뒷면에 가을철에 형성되어 잣나무로 날아가 감염을 일으키는 포자는?", "options": ["녹포자(Aeciospore)", "여름포자(Urediniospore)", "담자포자(소생자, Basidiospore)", "동포자(Teliospore)"], "answer": 2, "explain": "잣나무 털녹병의 병환환: 잣나무(녹병포자퇴·녹포자퇴) → 녹포자가 송이풀로 이동 → 송이풀에서 여름포자(반복전염) → 가을에 동포자퇴 형성 → 동포자가 발아하여 담자포자(소생자) 형성 → 담자포자가 잣나무 잎의 기공으로 침입.\n쉬운 풀이: 잣나무털녹병균은 여러 종류 포자를 만들며 두 식물을 오가요. 가을에 송이풀 잎 뒷면에서 동포자가 싹 터 '담자포자(소생자)'를 만들고, 이게 날아가 잣나무 잎 기공으로 들어가 감염시켜요. 잣나무로 '돌아가는' 포자가 담자포자라는 점이 핵심이에요.\n용어 풀이:\n· 포자: 곰팡이의 씨앗 역할을 하는 세포\n· 담자포자(소생자): 동포자가 발아해 만든 포자\n· 동포자: 겨울을 나는 두꺼운 포자", "ref": "산림수병학"}, {"id": "산림보호-83", "subject": "산림보호", "num": 83, "part": 4, "stem": "소나무 줄기나 가지에 방추형 또는 구형의 큰 혹을 형성하며, 참나무류 잎을 중간기주로 교대하는 녹병균은?", "options": ["소나무혹병균(*Cronartium quercuum*)", "잣나무털녹병균", "향나무녹병균", "포플러녹병균"], "answer": 0, "explain": "소나무혹병(Gall rust)은 기주가 소나무·곰솔이며 중간기주는 신갈나무, 상수리나무 등 참나무류입니다.\n쉬운 풀이: 소나무혹병균은 소나무·곰솔 가지에 공 모양이나 방추형(가운데가 볼록한) 혹을 만들고, 중간기주로 신갈나무·상수리나무 같은 참나무류를 오가요. 녹병 짝(잣나무-송이풀, 배나무-향나무, 소나무혹병-참나무)을 다시 확인하세요.\n용어 풀이:\n· 방추형: 가운데가 굵고 양 끝이 가는 모양\n· 녹병균: 녹 같은 포자를 만드는 곰팡이", "ref": "산림수병학"}, {"id": "산림보호-84", "subject": "산림보호", "num": 84, "part": 4, "stem": "겨울철 수간의 남서쪽 수피가 한낮의 햇볕으로 온도가 올라갔다가 일몰 후 급격히 냉각되면서 수액 동결과 수피 수축으로 세로로 길게 갈라지는 피해는?", "options": ["열해", "상렬(Frost crack)", "피소(Sunscald)", "조상"], "answer": 1, "explain": "· 한겨울 수간 목질부와 수피의 급격한 온도 변화와 수분 동결 팽창 차이로 줄기가 세로로 쪼개지는 현상을 상렬(Frost crack)이라 합니다.\n· (피소는 여름철 수피 고사)\n쉬운 풀이: 한겨울 낮에 햇볕 받은 줄기 남서쪽 껍질이 데워졌다가 해가 지면 급히 얼어붙어요. 바깥과 안쪽의 줄어드는 정도가 달라 줄기가 세로로 길게 쪼개지는데, 이게 상렬이에요. 여름에 껍질이 햇볕에 타 죽는 피소와 구분하세요.\n용어 풀이:\n· 상렬: 추위로 줄기가 갈라짐\n· 피소(볕데기): 햇볕에 수피가 타 죽음\n· 조상: 가을 이른서리", "ref": "산림기상재해학"}, {"id": "산림보호-85", "subject": "산림보호", "num": 85, "part": 4, "stem": "대기오염물질 중 불화수소(HF) 가스에 극히 민감하여 잎 끝이나 가장자리가 적갈색으로 괴사하여 오염 감시 지표식물로 활용되는 수종은?", "options": ["은행나무", "소나무, 글라디올러스", "회양목", "가시나무"], "answer": 1, "explain": "불화수소(HF)는 식물에 극미량(0.1 ppb)으로도 큰 피해를 주며, 글라디올러스와 소나무, 잣나무류가 극히 민감한 지표식물입니다.\n쉬운 풀이: 불화수소(HF)는 아주 적은 양으로도 식물에 큰 피해를 줘서 잎 끝·가장자리가 갈색으로 타 죽어요. 글라디올러스와 소나무·잣나무가 특히 민감해서, 이 식물의 잎을 보고 공기 오염을 감시하는 '지표식물'로 써요.\n용어 풀이:\n· 불화수소(HF): 알루미늄 공장 등에서 나오는 오염가스\n· 지표식물: 환경 상태를 알려 주는 식물\n· 괴사: 조직이 죽는 것", "ref": "환경수목보호학"}, {"id": "산림보호-86", "subject": "산림보호", "num": 86, "part": 4, "stem": "솔잎혹파리(Thecodiplosis japonensis)의 피해 증상 및 월동 생태에 대한 설명으로 옳은 것은?", "options": ["잎의 선단부에 충영을 만들고 성충으로 월동한다.", "당년생 신엽 기부에 2장의 잎이 붙어 혹(충영)을 형성하며, 11월경 지표로 낙하하여 땅속에서 유충으로 월동한다.", "줄기 목질부에 구멍을 뚫고 갱도 속에서 번데기로 월동한다.", "연 2~3회 발생하며 알로 수피 틈에서 월동한다."], "answer": 1, "explain": "솔잎혹파리는 연 1회 발생하며, 유충이 솔잎 기부에 충영을 만들어 즙액을 빨아먹다가 10~11월 비가 올 때 땅으로 떨어져 모래흙 속에서 유충 상태로 월동합니다.\n쉬운 풀이: 솔잎혹파리 애벌레는 그해 새로 난 솔잎 밑동에 혹을 만들어 그 안에서 즙을 빨아요. 혹이 생긴 두 잎은 붙어서 짧게 자라요. 가을(10~11월) 비 오는 날 땅에 떨어져 흙 속에서 애벌레로 겨울을 나요. 1년에 1번 생겨요.\n용어 풀이:\n· 충영: 벌레혹\n· 신엽: 새 잎\n· 기부: 밑동", "ref": "산림곤충학"}, {"id": "산림보호-87", "subject": "산림보호", "num": 87, "part": 4, "stem": "소나무좀(Tomicus piniperda)의 가해 습성 중 성충이 봄철 벌채목이나 쇠약목의 수피 밑에 알을 낳고 우화한 신성충이 건전목의 새 가지(신초) 속을 갉아먹어 가지가 부러지게 하는 피해는?", "options": ["산란 피해", "후식(유령기 섭식, Maturation feeding) 피해", "월동 피해", "충영 피해"], "answer": 1, "explain": "소나무좀의 신성충은 성숙을 위해 건전한 소나무의 당년생 신초 속으로 파고 들어가 가해하는 '후식(後食)'을 행하며, 이로 인해 신초가 부러져 수관이 우산 모양으로 변합니다.\n쉬운 풀이: 소나무좀은 봄에 약한 나무나 베어 둔 나무 껍질 밑에 알을 낳아요. 거기서 자라 새로 나온 어른벌레(신성충)는 몸을 성숙시키려고 건강한 소나무의 새 가지 속을 파먹는데, 이게 후식 피해예요. 새 가지가 꺾여 나무 꼭대기가 우산 모양이 돼요.\n용어 풀이:\n· 신성충: 갓 나온 어른벌레\n· 후식: 성충이 된 뒤 하는 먹이 활동\n· 쇠약목: 약해진 나무", "ref": "산림곤충학"}, {"id": "산림보호-88", "subject": "산림보호", "num": 88, "part": 4, "stem": "참나무시들음병을 매개하는 광릉긴나무좀(Platypus koryoensis) 암컷 성충이 목질부에 천공할 때 병원균을 운반하기 위해 체내에 지니고 있는 특수한 주머니 기관은?", "options": ["자낭각", "균낭(Mycangia)", "저정낭", "기문"], "answer": 1, "explain": "광릉긴나무좀 등 암브로시아 비틀(Ambrosia beetle)류는 등판에 '균낭(Mycangia)'이라는 특수 기관을 가지고 있어 병원성 진균(*Raffaelea*)을 보관·운반하여 서식 목질부에 접종합니다.\n쉬운 풀이: 광릉긴나무좀 암컷은 등판에 곰팡이를 담는 작은 주머니(균낭)를 가지고 다녀요. 나무에 구멍을 뚫을 때 이 주머니 속 라펠리아 곰팡이를 심어 주고, 그 곰팡이를 먹고 살아요. 이 곰팡이가 물관을 막아 참나무가 시들어요.\n용어 풀이:\n· 균낭(Mycangia): 곤충 몸의 곰팡이 보관 주머니\n· 암브로시아 비틀: 곰팡이를 키워 먹는 나무좀류", "ref": "산림수병학 및 곤충학"}, {"id": "산림보호-89", "subject": "산림보호", "num": 89, "part": 4, "stem": "곤충이 계절의 변화(일장 및 온도)를 감지하여 불리한 환경(겨울의 혹한 등)을 이겨내기 위해 발육을 일시적으로 정지하는 생리적 현상은?", "options": ["탈피", "변태", "휴면(Diapause)", "다형현상"], "answer": 2, "explain": "곤충의 휴면(Diapause)은 단순한 환경 저온에 의한 활동 둔화(마비)와 달리, 일장(광주기) 등의 신호에 의해 호르몬계가 제어되어 유전적으로 발육을 정지하고 내한성을 극대화하는 생리적 기작입니다.\n쉬운 풀이: 휴면은 곤충이 '곧 겨울이 온다'는 신호(낮 길이, 온도)를 느끼고 미리 몸의 성장을 멈춘 상태예요. 단순히 추워서 굳는 게 아니라 호르몬으로 스스로 조절하는 거라서, 추위를 견디는 힘도 커져요.\n용어 풀이:\n· 휴면(Diapause): 호르몬으로 발육을 멈춘 상태\n· 일장(광주기): 하루 중 낮의 길이\n· 탈피: 허물 벗기", "ref": "산림곤충학"}, {"id": "산림보호-90", "subject": "산림보호", "num": 90, "part": 4, "stem": "농약의 제형 중 물에 녹지 않는 미세한 원제 분말을 계면활성제 및 증량제와 혼합하여 물에 타면 균일하게 분산되어 우윳빛 현탁액(Suspension)을 형성하는 제형은?", "options": ["유제(EC)", "수화제(WP)", "입제(GR)", "분제(DP)"], "answer": 1, "explain": "수화제(Wettable powder)는 물에 녹지 않는 농약 원제를 친수성 미분말 형태로 가공한 것으로 물에 타면 침전되지 않고 현탁액을 이룹니다.\n쉬운 풀이: 농약은 여러 형태(제형)로 만들어요. 수화제는 물에 녹지 않는 약 가루를 물에 잘 퍼지게 만든 것이라, 물에 타면 우유처럼 뿌연 액체(현탁액)가 돼요. 유제는 기름에 녹인 액체, 입제는 알갱이, 분제는 가루 그대로 뿌리는 형태예요.\n용어 풀이:\n· 제형: 농약의 형태\n· 수화제(WP): 물에 분산되는 가루 농약\n· 현탁액: 고체 알갱이가 떠 있는 뿌연 액체", "ref": "산림농약학"}, {"id": "산림보호-91", "subject": "산림보호", "num": 91, "part": 4, "stem": "알칼리성 농약인 석회보르도액이나 석회유황합제를 유기인계 살충제와 혼용 살포할 때 발생하는 주된 부작용은?", "options": ["살충 효과가 수십 배 증가한다.", "유효성분이 알칼리에 의해 신속히 분해되어 약효가 상실되고 약해(Phytotoxicity)가 발생한다.", "아무런 화학 반응이 일어나지 않는다.", "물에 더 잘 녹아 전착성이 좋아진다."], "answer": 1, "explain": "대부분의 유기인계, 카바메이트계 살충제는 알칼리성 물질과 섞이면 가수분해되어 유효성분이 급격히 파괴되며, 수목 잎에 심각한 약해(잎마름, 반점)를 유발합니다.\n쉬운 풀이: 석회보르도액·석회황합제는 알칼리성이에요. 유기인계 살충제는 알칼리를 만나면 성분이 분해돼 효과가 사라지고, 오히려 잎이 타는 약해가 생길 수 있어요. 그래서 둘을 섞어 뿌리면 안 돼요.\n용어 풀이:\n· 혼용: 두 약을 섞어 쓰는 것\n· 약해: 약 때문에 식물이 입는 피해\n· 가수분해: 물과 반응해 분해됨", "ref": "산림농약학"}, {"id": "산림보호-92", "subject": "산림보호", "num": 92, "part": 4, "stem": "산불 진화 시 강풍으로 인해 불길이 급속히 번져 직접 진화가 불가능할 때, 주 산불 전방의 방화선 위치에서 주 산불 방향을 향해 불을 놓아 연료를 미리 태워 없애는 소화 전술은?", "options": ["직화법", "맞불(Backfire) 놓기", "냉각법", "질식법"], "answer": 1, "explain": "맞불(Backfire)은 대형 산불의 중심 상승기류가 주변 공기를 빨아들이는 흡인력을 이용하여, 방화선에서 주 산불 방향으로 마주 불을 놓아 중간의 연료를 소진시켜 산불을 진화하는 고도의 간접소화 기술입니다.\n쉬운 풀이: 큰 산불은 위로 솟는 뜨거운 공기 때문에 주변 공기를 빨아들여요. 이 성질을 이용해 방화선에서 산불 쪽으로 일부러 불을 놓으면, 그 불이 산불 쪽으로 끌려가 중간의 탈 것을 미리 태워 없애요. 그러면 산불이 더 번질 연료가 없어져 꺼져요. 이게 맞불이에요.\n용어 풀이:\n· 맞불(Backfire): 진행하는 불 쪽으로 마주 놓는 불\n· 상승기류: 위로 올라가는 공기 흐름\n· 간접소화: 연료를 없애 불을 끄는 방법", "ref": "산불방제학"}, {"id": "산림보호-93", "subject": "산림보호", "num": 93, "part": 4, "stem": "산불 피해지에서 발생하기 쉬운 2차 재해(토사 유출, 산사태 등)를 방지하기 위해 벌채 후 응급으로 시행하는 사방 공법으로 가장 적합한 것은?", "options": ["바닥막이 및 골막이, 사면 떼붙이기", "아스팔트 포장", "제초제 살포", "전면 굴착"], "answer": 0, "explain": "산불로 지피식생과 유기물이 소실된 급경사지는 폭우 시 표토 침식과 산사태 위험이 매우 크므로 골막이, 기슭막이, 사면 녹화망 및 떼붙이기 등 긴급 응급복구 사방공사를 시행합니다.\n쉬운 풀이: 산불이 지나간 산은 풀과 낙엽이 다 타서 흙이 맨살로 드러나요. 이때 큰비가 오면 흙이 쓸려 내려가고 산사태가 날 수 있어요. 그래서 계곡에 작은 둑(골막이·바닥막이)을 쌓고 비탈에 떼를 붙여 흙을 붙잡는 응급 사방공사를 해요.\n용어 풀이:\n· 골막이: 계곡에 쌓는 작은 둑\n· 바닥막이: 계곡 바닥이 깎이지 않게 하는 구조물\n· 떼붙이기: 잔디 뗏장을 붙이는 것", "ref": "산림공학 및 방재학"}, {"id": "산림보호-94", "subject": "산림보호", "num": 94, "part": 4, "stem": "수목의 가지나 줄기에 기생하여 엽록소가 전혀 없이 기주 수목의 체관부와 물관부에 기생근(흡기, Haustorium)을 박아 양분과 수분을 모두 탈취하는 순수 전합생 기생식물은?", "options": ["겨우살이", "새삼(Cuscuta)", "참나무", "소나무"], "answer": 1, "explain": "· 새삼(Cuscuta)은 잎과 뿌리가 퇴화하고 엽록소가 전혀 없어 기주에 100% 의존하는 전합생(완전기생) 식물입니다.\n· (겨우살이는 스스로 광합성을 하는 반기생 식물)\n쉬운 풀이: 새삼은 잎과 뿌리가 거의 없고 엽록소도 없어서 스스로 광합성을 못 해요. 다른 식물 줄기를 감고 흡기라는 빨대 같은 뿌리를 꽂아 물과 양분을 전부 빼앗아 살아요(완전기생). 겨우살이는 초록 잎으로 광합성도 해서 반기생이에요.\n용어 풀이:\n· 전기생(완전기생): 양분과 물을 모두 숙주에게 의존\n· 반기생: 물·무기양분만 빼앗고 광합성은 스스로 함\n· 흡기: 기생식물이 숙주에 박는 뿌리", "ref": "산림수병학"}, {"id": "산림보호-95", "subject": "산림보호", "num": 95, "part": 4, "stem": "오리나무 잎을 갉아먹는 대표적인 식엽성 해충인 오리나무잎벌레(Agelastica coerulea)의 생활경과 및 월동태로 옳은 것은?", "options": ["연 1회 발생, 성충으로 지표의 낙엽 밑이나 흙 속에서 월동", "연 3회 발생, 알로 수피 틈에서 월동", "2년에 1회 발생, 유충으로 목질부 내에서 월동", "연 1회 발생, 번데기로 가지에 붙어 월동"], "answer": 0, "explain": "오리나무잎벌레는 연 1회 발생하며, 늦여름부터 낙엽 밑이나 얕은 흙 속으로 들어가 '성충'으로 월동한 뒤 이듬해 봄 잎이 필 때 나와 잎을 식해하고 산란합니다.\n쉬운 풀이: 오리나무잎벌레는 1년에 1번 생겨요. 늦여름부터 낙엽 밑이나 얕은 흙 속에 들어가 어른벌레(성충)로 겨울을 나고, 봄에 잎이 나면 나와서 잎을 갉아먹고 알을 낳아요.\n용어 풀이:\n· 식엽성: 잎을 먹는\n· 생활경과: 곤충이 1년 동안 사는 과정\n· 월동태: 겨울을 나는 형태", "ref": "산림곤충학"}, {"id": "산림보호-96", "subject": "산림보호", "num": 96, "part": 4, "stem": "밤나무 열매에 구멍을 뚫고 들어가 밤 과육을 갉아먹는 밤바구미(Curculio sikkimensis)의 친환경 물리적 방제법으로 널리 쓰이는 온탕 침법의 조건은?", "options": ["30℃ 물에 10분", "50℃ 온수에 약 30분간 침지", "100℃ 끓는 물에 5분", "10℃ 찬물에 1일"], "answer": 1, "explain": "수확한 생밤의 밤바구미 유충 방제를 위해 밤을 50℃의 따뜻한 물에 30분간 담갔다가 건져 냉각 건조하는 온탕 침법을 실시하면 밤의 품질 저하 없이 충란과 유충을 사멸시킬 수 있습니다.\n쉬운 풀이: 밤바구미는 밤 속에 알을 낳아 애벌레가 밤을 파먹어요. 수확한 밤을 50℃ 따뜻한 물에 30분 담그면 밤은 멀쩡하고 속의 알·애벌레만 죽어요. 약을 안 쓰는 친환경 방법이에요.\n용어 풀이:\n· 온탕 침법: 따뜻한 물에 담그는 방제법\n· 충란: 곤충의 알\n· 물리적 방제: 열·도구 등으로 하는 방제", "ref": "산림곤충학"}, {"id": "산림보호-97", "subject": "산림보호", "num": 97, "part": 4, "stem": "매미나방(Lymantria dispar)의 유충 대발생 시 환경오염을 방지하면서 알 덩어리(난괴)를 효과적으로 제거하는 물리적 방제 요령은?", "options": ["겨울철 또는 이른 봄에 나무 줄기나 바위에 붙은 난괴를 쇠솔(와이어 브러시)이나 끌로 긁어내어 소각 또는 매몰한다.", "고농도 제초제를 전면에 살포한다.", "줄기를 환상박피한다.", "피해목을 모두 베어낸다."], "answer": 0, "explain": "매미나방은 여름철 수간이나 바위 틈에 털로 덮인 스펀지 모양의 알 덩어리로 월동하므로, 부화 전(이듬해 4월 이전)에 긁어모아 물리적으로 파쇄하거나 소각하는 것이 가장 친환경적이고 효과적입니다.\n쉬운 풀이: 매미나방은 줄기나 바위에 털로 덮인 스펀지 같은 알덩어리를 붙여 겨울을 나요. 알이 깨기 전인 겨울~이른 봄에 쇠솔이나 끌로 긁어내 태우거나 묻으면, 약을 안 쓰고도 대발생을 막을 수 있어요.\n용어 풀이:\n· 난괴: 알덩어리\n· 부화: 알에서 깨어남\n· 소각: 불에 태움", "ref": "산림보호학 실무"}, {"id": "산림보호-98", "subject": "산림보호", "num": 98, "part": 4, "stem": "산림보호법령상 산림보호구역의 구분에 해당하지 **않는** 것은?", "options": ["생활환경보호구역", "수원함양보호구역", "산림유전자원보호구역", "임업소득증진구역"], "answer": 3, "explain": "산림보호구역 5개 구분: 생활환경보호구역, 수원함양보호구역, 재해방지보호구역, 산림유전자원보호구역, 특별산림보호구역. (임업소득증진구역은 법정 산림보호구역이 아님)\n쉬운 풀이: 산림보호구역은 5가지예요: 생활환경보호구역, 수원함양보호구역, 재해방지보호구역, 산림유전자원보호구역, 특별산림보호구역. '생·수·재·유·특'으로 외우세요. 임업소득증진구역은 없는 이름이에요.\n용어 풀이:\n· 산림보호구역: 법으로 특별히 보호하는 산림\n· 수원함양: 물을 저장·공급\n· 산림유전자원: 희귀·고유 식물 유전자원", "ref": "산림보호법 제7조"}, {"id": "산림보호-99", "subject": "산림보호", "num": 99, "part": 4, "stem": "「소나무재선충병 방제특별법」상 소나무류 반출금지구역에서 소나무류를 이동시킬 수 있는 예외 사유로 옳은 것은?", "options": ["개인이 정원수로 쓰기 위해 굴취하는 경우", "관할 지자체장 또는 산림청장의 방제명령을 받아 방제 처리를 거친 후 이동 확인증을 발급받은 경우", "밤에 화물차로 운반하는 경우", "묘목의 직경이 5cm 이하인 경우"], "answer": 1, "explain": "반출금지구역 내의 소나무류는 원칙적으로 이동이 금지되나, 파쇄·열처리·훈증 등 완전 방제 처리를 거치고 방제공무원의 검인을 받거나 이동확인증을 발급받은 경우에만 제한적으로 이동할 수 있습니다.\n쉬운 풀이: 반출금지구역의 소나무는 원칙적으로 밖으로 못 가져가요. 다만 잘게 부수기(파쇄)·열처리·훈증 같은 방제 처리를 마치고 담당 공무원 확인을 받아 이동확인증을 발급받으면 예외적으로 옮길 수 있어요.\n용어 풀이:\n· 반출금지구역: 소나무류를 밖으로 옮길 수 없는 구역\n· 파쇄: 잘게 부숨\n· 이동확인증: 이동을 허가하는 증명서", "ref": "소나무재선충병 방제특별법"}, {"id": "산림보호-100", "subject": "산림보호", "num": 100, "part": 4, "stem": "산림청 산림병해충 예찰방제단의 주된 임무로 옳지 **않은** 것은?", "options": ["주요 산림병해충의 발생 실태 조사 및 조기 발견 예찰", "소나무재선충병 감염 의심목 시료 채취 및 GPS 위치 좌표 기록", "피해목 제거, 훈증, 나무주사 등 현장 방제 작업 수행", "민간 농약 판매상의 유통 가격 통제 및 영업 정지 행정처분"], "answer": 3, "explain": "산림병해충 예찰방제단은 현장 예찰, 시료 채취, 의심목 마킹, 방제 작업(수간주사, 훈증, 파쇄 등)을 수행하는 실무 현장 조직이며, 민간 농약상의 영업정지 등 행정처분 권한은 없습니다.\n쉬운 풀이: 예찰방제단은 현장에서 뛰는 실무팀이에요. 병해충을 미리 찾아내고(예찰), 의심 나무 시료를 채취해 GPS로 위치를 기록하고, 훈증·나무주사 같은 방제 작업을 해요. 농약 가게 영업정지 같은 행정처분 권한은 없어요.\n용어 풀이:\n· 예찰: 미리 살펴 발생을 알아냄\n· 시료: 검사용으로 채취한 샘플\n· 행정처분: 행정기관이 내리는 제재", "ref": "산림병해충 예찰방제 지침"}, {"id": "산림보호-101", "subject": "산림보호", "num": 101, "part": 5, "stem": "「산림재난방지법」상 '산림재난'에 해당하지 **않는** 것은?", "options": ["산불", "산사태·토석류", "산림병해충", "대기오염 피해"], "answer": 3, "explain": "· 제2조: 산림재난 = 산불\n· 산사태\n· 토석류\n· 산림병해충\n· 2026.2.1 시행, 종전 「산림보호법」의 산불·산사태·병해충 규정을 옮겨 옴\n쉬운 풀이: 2026년부터 「산림재난방지법」이 새로 시행되면서, 산불·산사태·토석류·산림병해충이 '산림재난'으로 묶였어요. 예전엔 산림보호법에 있던 내용이 옮겨 온 거예요. 대기오염 피해는 산림재난에 포함되지 않아요.\n용어 풀이:\n· 산림재난: 산림에서 생기는 재난\n· 토석류: 흙·돌이 물과 섞여 빠르게 흘러내리는 것\n· 시행: 법의 효력이 발생함", "ref": "산림재난방지법 제2조"}, {"id": "산림보호-102", "subject": "산림보호", "num": 102, "part": 5, "stem": "「산림재난방지법」상 산불 규정이 적용되는 '산림인접지역'의 범위는?", "options": ["산림으로부터 50m 이내 토지", "산림으로부터 100m 이내 토지", "산림으로부터 200m 이내 토지", "산림으로부터 500m 이내 토지"], "answer": 1, "explain": "제4조제1호: 산림으로부터 100m 이내 토지(건물의 부속 토지 제외)\n쉬운 풀이: 산불 관련 규정은 숲 안뿐 아니라 숲에서 100m 이내 땅에도 적용돼요. 이 구역을 '산림인접지역'이라 해요. 숲 가까이서 쓰레기를 태우다 산불이 나는 경우가 많아서 범위를 넓혀 둔 거예요.\n용어 풀이:\n· 산림인접지역: 산림에서 100m 이내 토지\n· 부속 토지: 건물에 딸린 땅", "ref": "산림재난방지법 제4조"}, {"id": "산림보호-103", "subject": "산림보호", "num": 103, "part": 5, "stem": "타인 소유의 산림에 불을 지른 사람에 대한 벌칙은?", "options": ["1년 이상 10년 이하의 징역", "3년 이상 10년 이하의 징역", "5년 이상 15년 이하의 징역", "3년 이하의 징역 또는 3천만원 이하의 벌금"], "answer": 2, "explain": "· 제76조: 타인 산림 5~15년\n· 자기 산림 1~10년\n· 자기 산림 불이 타인 산림으로 번지면 3~10년\n· 실화 3년 이하 또는 3천만원 이하\n· 미수범 처벌\n쉬운 풀이: 산불을 낸 경우 처벌은 상황에 따라 달라요. 남의 산에 일부러 불을 지르면 5~15년 징역으로 가장 무겁고, 자기 산은 1~10년, 자기 산 불이 남의 산으로 번지면 3~10년이에요. 실수(실화)는 3년 이하 징역 또는 3천만원 이하 벌금이에요.\n용어 풀이:\n· 방화: 일부러 불을 지름\n· 실화: 실수로 불을 냄\n· 미수범: 범죄를 시도했으나 끝내지 못한 사람", "ref": "산림재난방지법 제76조"}, {"id": "산림보호-104", "subject": "산림보호", "num": 104, "part": 5, "stem": "「산림재난방지법」상 산림재난방지 기본계획의 수립 주체와 주기로 옳은 것은?", "options": ["산림청장, 5년마다", "산림청장, 10년마다", "시·도지사, 3년마다", "국립산림과학원장, 매년"], "answer": 0, "explain": "· 제7조: 기본계획 = 산림청장 5년마다(국회 소관 상임위 제출) / 지역계획 = 시·도지사·지방산림청장 5년마다\n· 산사태 발생우려지역 기초조사도 산림청장 5년마다(제21조)\n쉬운 풀이: 산림재난방지 기본계획은 산림청장이 5년마다 세워요. 지역계획은 시·도지사와 지방산림청장이 5년마다 세우고, 산사태 우려 지역 기초조사도 산림청장이 5년마다 해요. 이 법은 '5년'이 반복되니 묶어서 외우세요.\n용어 풀이:\n· 기본계획: 국가 차원의 큰 계획\n· 지역계획: 지역 단위 세부 계획\n· 상임위: 국회의 분야별 위원회", "ref": "산림재난방지법 제7조"}, {"id": "산림보호-105", "subject": "산림보호", "num": 105, "part": 5, "stem": "공·사유림에서 산사태취약지역을 지정하는 자는?", "options": ["산림청장", "시·도지사", "특별자치시장·특별자치도지사·시장·군수·구청장", "국립산림과학원장"], "answer": 2, "explain": "· 제22조: 국유림 = 지방산림청장\n· 공·사유림 = 시장·군수·구청장(특별자치시장·도지사 포함)\n· 이의신청은 받은 날부터 20일 이내 결정\n· 취약지역·대피소는 연 2회 이상 현지점검(제25조)\n쉬운 풀이: 산사태취약지역 지정 주체는 산림 소유에 따라 달라요. 국유림은 지방산림청장, 공·사유림은 시장·군수·구청장(특별자치시장·도지사 포함)이 지정해요. 지정된 곳과 대피소는 1년에 2번 이상 현장 점검해요.\n용어 풀이:\n· 산사태취약지역: 산사태 위험이 높아 지정한 지역\n· 공·사유림: 공공기관·개인 소유 산림\n· 이의신청: 결정에 이의를 제기하는 것", "ref": "산림재난방지법 제22·25조"}, {"id": "산림보호-106", "subject": "산림보호", "num": 106, "part": 5, "stem": "소나무재선충병 반출금지구역에 대한 설명으로 옳은 것은?", "options": ["산림청장이 시·군·구 단위로 지정한다.", "시장·군수·구청장이 행정동·리 단위로 지정한다.", "시·도지사가 읍·면 단위로 지정한다.", "국립산림과학원장이 반경 10km로 지정한다."], "answer": 1, "explain": "· 제9조: 시장·군수·구청장\n· 발생지역과 그로부터 5km 이내 범위에서 대통령령이 정한 거리(시행령·모듈 2km)\n· 행정동·리 단위\n쉬운 풀이: 반출금지구역은 현장을 잘 아는 시장·군수·구청장이 행정동·리 단위로 지정해요. 범위는 발생지역에서 법상 최대 5km 안에서 대통령령으로 정하는데, 시행령·학습모듈 기준으로는 2km예요.\n용어 풀이:\n· 행정동·리: 가장 작은 행정구역 단위\n· 대통령령: 대통령이 정하는 시행령", "ref": "소나무재선충병 방제특별법 제9조"}, {"id": "산림보호-107", "subject": "산림보호", "num": 107, "part": 5, "stem": "재선충병 방제작업을 할 때 방제지역·일시·방법 등을 공고해야 하는 시기는? (긴급한 경우 제외)", "options": ["실시 3일 전까지", "실시 7일 전까지", "실시 14일 전까지", "실시 30일 전까지"], "answer": 2, "explain": "· 제11조⑦: 실시 14일 전까지 공고, 긴급하면 먼저 방제 후 공고\n· 방제방법 = 항공방제 + 감염목 벌채, 벌채목은 훈증·파쇄·소각\n쉬운 풀이: 재선충병 방제작업(항공방제·벌채 등)을 하기 전에는 주민들이 알 수 있게 방제 지역·일시·방법을 실시 14일 전까지 공고해야 해요. 다만 급하면 먼저 방제하고 나중에 공고할 수 있어요.\n용어 풀이:\n· 공고: 널리 알림\n· 항공방제: 헬기·드론으로 약을 뿌리는 방제\n· 파쇄: 잘게 부숨", "ref": "소나무재선충병 방제특별법 제11조"}, {"id": "산림보호-108", "subject": "산림보호", "num": 108, "part": 5, "stem": "반출금지구역에서 소나무류를 무단으로 이동한 자에 대한 벌칙은?", "options": ["200만원 이하의 과태료", "500만원 이하의 벌금", "1년 이하의 징역 또는 1천만원 이하의 벌금", "3년 이하의 징역 또는 3천만원 이하의 벌금"], "answer": 2, "explain": "· 제17조①: 1년 이하 / 1천만원 이하\n· 감염목 판매·미신고는 500만원 이하 벌금\n· 생산확인표 없이 이동은 200만원 이하 벌금\n· 모두베기 후 조림 미이행은 조림비용 전액 과태료(제19조)\n쉬운 풀이: 반출금지구역 소나무를 몰래 옮기면 재선충병이 다른 지역으로 퍼질 수 있어 처벌이 무거워요. 1년 이하 징역 또는 1천만원 이하 벌금이에요. 감염목을 팔거나 신고 안 하면 500만원 이하 벌금, 생산확인표 없이 옮기면 200만원 이하 벌금이에요.\n용어 풀이:\n· 벌금: 형벌로 내는 돈\n· 과태료: 행정 위반에 내는 돈(형벌 아님)\n· 생산확인표: 소나무 생산·이동을 확인하는 서류", "ref": "소나무재선충병 방제특별법 제17·19조"}, {"id": "산림보호-109", "subject": "산림보호", "num": 109, "part": 5, "stem": "산림병해충 방제규정상 병해충 발생예보 단계를 낮은 단계부터 바르게 나열한 것은?", "options": ["주의 → 관심 → 경계 → 심각", "관심 → 주의 → 경계 → 심각", "관심 → 경계 → 주의 → 심각", "주의 → 경계 → 관심 → 심각"], "answer": 1, "explain": "· 제15조: 관심(Blue) → 주의(Yellow) → 경계(Orange) → 심각(Red)\n· 외래·돌발 '심' 피해 기준: 주의 20ha(1개 시군구)\n· 경계 50ha\n· 심각 100ha\n쉬운 풀이: 산림병해충 발생예보도 '관심(파랑) → 주의(노랑) → 경계(주황) → 심각(빨강)' 4단계예요. 산불경보와 같은 순서라 '관·주·경·심'으로 함께 외우면 돼요.\n용어 풀이:\n· 발생예보: 병해충 발생 위험을 미리 알리는 것\n· 외래·돌발 해충: 외국에서 들어오거나 갑자기 대발생하는 해충", "ref": "산림병해충 방제규정(산림청고시 제2026-97호) 제15조"}, {"id": "산림보호-110", "subject": "산림보호", "num": 110, "part": 5, "stem": "유인헬기 항공방제 대상지에서 제외되는 고압송전선·케이블카 주변의 범위는?", "options": ["양쪽 50m 이내", "양쪽 100m 이내", "양쪽 150m 이내", "양쪽 300m 이내"], "answer": 2, "explain": "· 제51조: 유인헬기 150m\n· 드론 100m\n· 양봉·양잠·친환경농산물·상수원·생활권 지역도 제외\n쉬운 풀이: 헬기로 약을 뿌릴 때 고압 송전선·케이블카에 걸리면 큰 사고가 나요. 그래서 유인헬기는 양쪽 150m, 드론은 100m 안쪽은 항공방제에서 빼요. 양봉장·상수원·친환경 농장 근처도 제외예요.\n용어 풀이:\n· 유인헬기: 사람이 조종하는 헬기\n· 양봉: 꿀벌 기르기\n· 상수원: 수돗물의 원천이 되는 물", "ref": "산림병해충 방제규정(산림청고시 제2026-97호) 제51조"}, {"id": "산림보호-111", "subject": "산림보호", "num": 111, "part": 5, "stem": "산림병해충 방제방법 중 '친환경 방제'에 해당하지 **않는** 것은?", "options": ["유인목 설치", "끈끈이롤트랩 설치", "천적 방사", "훈증"], "answer": 3, "explain": "· 제48조: 친환경 = 유인목·유인트랩·끈끈이롤트랩·천적 방사\n· 훈증은 화학적 방제(지상살포·나무주사·항공·토양·훈증)\n· 임업적 = 모두베기·소구역모두베기·소구역골라베기·솎아베기\n· 기계·물리적 = 파쇄·소각·매몰·박피·건조·열처리\n쉬운 풀이: 방제 방법은 네 가지로 나눠요. 친환경(유인목·유인트랩·끈끈이롤트랩·천적), 화학적(약 뿌리기·나무주사·훈증), 임업적(벌채·솎아베기), 기계·물리적(파쇄·소각·열처리)이에요. 훈증은 약 가스를 쓰니 화학적 방제예요.\n용어 풀이:\n· 유인목: 해충을 끌어모으려고 세워 둔 나무\n· 천적: 해충을 잡아먹는 생물\n· 끈끈이롤트랩: 줄기에 감는 끈끈이 덫", "ref": "산림병해충 방제규정(산림청고시 제2026-97호) 제48조"}, {"id": "산림보호-112", "subject": "산림보호", "num": 112, "part": 5, "stem": "솔잎혹파리 나무주사의 방제효과 조사 시기는?", "options": ["방제 당해 연도 4~6월", "방제 당해 연도 10~12월", "방제 다음 연도 2~4월", "방제 다음 연도 6~10월"], "answer": 1, "explain": "· 제62조: 솔잎혹파리 나무주사 당해 10~12월\n· 솔껍질깍지벌레 나무주사 다음해 2~4월\n· 참나무시들음병 롤트랩 다음해 6~10월\n· 표준지 조사비율 0.5% 이상\n쉬운 풀이: 방제 효과는 해충이 다시 활동할 시기에 맞춰 확인해요. 솔잎혹파리 나무주사는 그해 10~12월, 솔껍질깍지벌레 나무주사는 다음 해 2~4월, 참나무시들음병 롤트랩은 다음 해 6~10월에 조사해요.\n용어 풀이:\n· 방제효과: 방제가 얼마나 잘 됐는지\n· 표준지: 표본 조사 구역\n· 당해: 그해", "ref": "산림병해충 방제규정(산림청고시 제2026-97호) 제62조"}, {"id": "산림보호-113", "subject": "산림보호", "num": 113, "part": 5, "stem": "산림병해충 방제 약제 선정 기준으로 옳지 **않은** 것은?", "options": ["입목에 대한 약해가 적을 것", "사람·동물에 대한 독성이 적을 것", "대량구입이 가능할 것", "항공방제용은 전착제가 포함될 것"], "answer": 3, "explain": "· 제72조: 항공방제는 전착제가 포함되지 않을 것\n· 유기농업자재는 약효시험 50% 이상 방제효과\n쉬운 풀이: 방제 약은 나무에 해가 적고, 사람·동물에 독성이 적고, 많이 살 수 있어야 해요. 그런데 항공방제용 약은 '전착제가 포함되지 않아야' 해요. 공중에서 뿌린 약이 사람·차·물에 끈적하게 붙으면 피해가 커지기 때문이에요.\n용어 풀이:\n· 전착제: 약이 잘 퍼지고 붙게 하는 보조제\n· 약해: 약 때문에 식물이 입는 피해\n· 유기농업자재: 친환경 농업용 자재", "ref": "산림병해충 방제규정(산림청고시 제2026-97호) 제72조"}, {"id": "산림보호-114", "subject": "산림보호", "num": 114, "part": 5, "stem": "산림병해충 예찰조사를 매년 실시하고 위험도평가 결과를 산림청장에게 보고하는 자는?", "options": ["시장·군수·구청장", "국립산림과학원장", "한국산림재난안전기술공단 이사장", "산림조합중앙회장"], "answer": 1, "explain": "· 제4조: 국립산림과학원장이 고정조사구·상습발생지·선단지 예찰\n· 시·도 산림연구기관과 기술공단이 협조\n쉬운 풀이: 병해충이 언제 어디서 얼마나 생길지 미리 조사(예찰)하는 일은 연구기관인 국립산림과학원장이 매년 해요. 위험도를 평가해 산림청장에게 보고하고, 시·도 연구기관과 기술공단이 도와요.\n용어 풀이:\n· 예찰조사: 병해충 발생을 미리 살피는 조사\n· 위험도평가: 피해 위험 정도를 평가\n· 선단지: 피해가 퍼지는 맨 앞 지역", "ref": "산림병해충 방제규정(산림청고시 제2026-97호) 제4조"}, {"id": "산림보호-115", "subject": "산림보호", "num": 115, "part": 5, "stem": "방제규정상 광릉긴나무좀 우화상황 조사를 위한 유인목 설치 시기는?", "options": ["3월 초순까지", "4월 중순까지", "5월 말까지", "6월 중순까지"], "answer": 1, "explain": "· 제14조: 광릉긴나무좀 유인목 4월 중순까지 + 끈끈이트랩\n· 솔잎혹파리 우화상 4월 15일까지\n쉬운 풀이: 광릉긴나무좀이 언제 나오는지(우화) 알려면, 벌레가 좋아하는 참나무를 미리 베어 놓은 유인목과 끈끈이트랩을 4월 중순까지 설치해요. 솔잎혹파리 우화상은 4월 15일까지 설치해요. 둘 다 '4월 중순'이에요.\n용어 풀이:\n· 우화: 번데기에서 어른벌레가 나옴\n· 유인목: 해충을 모으려고 둔 나무\n· 우화상: 우화를 관찰하는 상자", "ref": "산림병해충 방제규정(산림청고시 제2026-97호) 제14조"}]}, {"code": "03", "name": "산림경영", "kind": "필수", "questions": [{"id": "산림경영-1", "subject": "산림경영", "num": 1, "part": 1, "stem": "산림경영의 최고 지도원칙으로 짝지은 것은?", "options": ["경제성 · 생산성", "공공성 · 수익성", "보속성 · 합자연성", "생산성 · 환경보전"], "answer": 1, "explain": "공공성·수익성이 최고 지도원칙\n쉬운 풀이: 산림경영은 돈을 버는 일(수익성)이면서 동시에 숲이 주는 공공의 이익(맑은 공기·물·재해 방지)을 지키는 일(공공성)이에요. 그래서 이 두 가지가 모든 원칙 위에 있는 '최고 지도원칙'이에요. 경제성·생산성·보속성 등은 그 아래 일반 원칙이에요.\n용어 풀이:\n· 지도원칙: 경영의 방향을 정하는 기본 원칙\n· 공공성: 사회 전체의 이익\n· 수익성: 이익을 내는 성질\n· 보속성: 꾸준히 계속 생산하는 성질", "ref": "모듈 p.4–5"}, {"id": "산림경영-2", "subject": "산림경영", "num": 2, "part": 1, "stem": "토지순수익 최대 벌기령에 대한 설명으로 옳은 것은?", "options": ["재적수확 최대 벌기령과 항상 같다", "이율이 높을수록 짧아진다", "생리적 벌기령이라고도 한다", "화폐수익과 관계없이 정해진다"], "answer": 1, "explain": "토지기망가 최대 = 이재적 벌기령, 이율 높으면 짧아짐\n쉬운 풀이: 토지순수익 최대 벌기령은 '땅에서 얻는 돈의 가치가 가장 큰 나무 나이'예요. 이율이 높으면 미래의 돈 가치가 많이 깎이니까, 나무를 오래 키우기보다 빨리 베어 돈으로 바꾸는 게 유리해서 벌기령이 짧아져요.\n용어 풀이:\n· 벌기령: 나무를 베어 수확하는 나이\n· 토지기망가: 그 땅에서 앞으로 얻을 수익을 현재 가치로 합한 값\n· 이율: 이자율", "ref": "p.5–7"}, {"id": "산림경영-3", "subject": "산림경영", "num": 3, "part": 1, "stem": "법정림의 요건이 **아닌** 것은?", "options": ["법정영급분배", "법정임분배치", "법정생장량", "법정이율"], "answer": 3, "explain": "4요건 = 영급분배·임분배치·생장량·축적\n쉬운 풀이: 법정림은 매년 같은 양을 영원히 벨 수 있는 '이상적인 숲'이에요. 그러려면 4가지가 맞아야 해요: 나이별 면적이 고르게(법정영급분배), 나무 배치가 작업하기 좋게(법정임분배치), 정해진 생장량(법정생장량), 정해진 숲의 총량(법정축적). 법정이율은 요건이 아니에요.\n용어 풀이:\n· 법정림: 해마다 같은 수확을 영속할 수 있는 이상적인 숲\n· 영급: 나이를 10년 단위로 묶은 것\n· 축적: 숲 전체 나무의 부피", "ref": "p.7–9"}, {"id": "산림경영-4", "subject": "산림경영", "num": 4, "part": 1, "stem": "면적 100ha, 윤벌기 40년인 작업급에서 벌기 임분의 ha당 재적이 400㎥일 때, 벌기수확법으로 구한 하계 법정축적은?", "options": ["8,000㎥", "16,000㎥", "20,000㎥", "40,000㎥"], "answer": 2, "explain": "Vn = (U/2) × m_u × (F/U) = (40/2) × 400 × (100/40) = 20,000㎥\n쉬운 풀이: 벌기수확법은 '법정림에는 0살부터 벌기(40살)까지 나무가 고르게 있으니 평균은 벌기 재적의 절반'이라는 생각이에요. 공식: (윤벌기 ÷ 2) × 벌기 ha당 재적 × (면적 ÷ 윤벌기) = 20 × 400 × 2.5 = 20,000㎥. 간단히 '면적 × 벌기재적 ÷ 2'로 계산해도 100 × 400 ÷ 2 = 20,000이에요.\n용어 풀이:\n· 법정축적: 법정림 상태일 때의 총 재적\n· 윤벌기: 숲 전체를 한 바퀴 다 베는 데 걸리는 기간\n· 하계: 여름(생장 중간) 기준", "ref": "p.7–9"}, {"id": "산림경영-5", "subject": "산림경영", "num": 5, "part": 1, "stem": "현실축적 30,000㎥, 법정축적 25,000㎥, 법정벌채량(법정생장량) 1,000㎥일 때 Hundeshagen법에 따른 표준연벌채량은?", "options": ["1,000㎥", "1,200㎥", "1,400㎥", "1,500㎥"], "answer": 1, "explain": "E = Vw × En/Vn = 30,000 × 1,000/25,000 = 1,200㎥ (En = 법정벌채량)\n쉬운 풀이: Hundeshagen법은 '현실 숲이 법정 숲보다 크면 그만큼 더 베자'는 비례식이에요. 표준연벌채량 = 현실축적 × (법정벌채량 ÷ 법정축적) = 30,000 × 1,000 ÷ 25,000 = 1,200㎥. 현실축적이 법정의 1.2배이니 벌채량도 1,000의 1.2배가 된 거예요.\n용어 풀이:\n· 표준연벌채량: 매년 베어도 되는 기준 양\n· 현실축적: 지금 실제 숲의 재적\n· 수확조절: 해마다 벨 양을 정하는 것", "ref": "p.11–12"}, {"id": "산림경영-6", "subject": "산림경영", "num": 6, "part": 1, "stem": "임업이율의 성격으로 옳지 **않은** 것은?", "options": ["자본이자이다", "평정이율이다", "실질이율이다", "장기이율이다"], "answer": 2, "explain": "실질이율이 아니라 명목이율\n쉬운 풀이: 임업이율은 나무에 묶인 돈(자본)에 대한 이자예요. 실제 거래되는 금리가 아니라 평가하려고 정한 '평정이율'이고, 기간이 아주 긴 '장기이율'이며, 물가 변동을 빼지 않은 '명목이율'이에요. 그래서 '실질이율'이 틀렸어요.\n용어 풀이:\n· 평정이율: 평가 목적으로 정한 이율\n· 명목이율: 물가 상승을 고려하지 않은 겉보기 이율\n· 실질이율: 물가 상승을 뺀 이율", "ref": "p.17"}, {"id": "산림경영-7", "subject": "산림경영", "num": 7, "part": 1, "stem": "임지기망가에 대한 설명으로 옳지 **않은** 것은?", "options": ["이율이 높을수록 임지기망가는 작아진다", "이율이 높을수록 최대값에 빨리 도달한다", "조림비가 클수록 최대값에 늦게 도달한다", "관리비가 클수록 최대값에 늦게 도달한다"], "answer": 3, "explain": "관리비는 최대값 도달 시점과 무관\n쉬운 풀이: 임지기망가는 땅의 미래 수익을 현재가치로 계산한 값이에요. 이율이 높으면 값이 작아지고 최대값엔 빨리 도달하며, 조림비가 크면 최대값에 늦게 도달해요. 하지만 관리비는 매년 똑같이 나가는 돈이라 '언제 최대가 되느냐'에는 영향을 주지 않아요.\n용어 풀이:\n· 임지기망가: 임지에서 기대되는 순수익의 현재가치\n· 조림비: 나무 심는 비용\n· 관리비: 매년 드는 관리 비용", "ref": "p.22–23"}, {"id": "산림경영-8", "subject": "산림경영", "num": 8, "part": 1, "stem": "중령림의 임목평가에 쓰며 이율을 사용하지 않는 방법은?", "options": ["Glaser법", "임목기망가법", "임목비용가법", "시장가역산법"], "answer": 0, "explain": "Glaser법: Am = (Au − C)m²/u² + C, 이율 안 씀\n쉬운 풀이: Glaser법은 중간 나이 숲의 나무 가격을, 이율 계산 없이 나이의 제곱 비율로 구하는 간단한 공식이에요. Am = (벌기 수익 − 조림비) × (현재나이² ÷ 벌기²) + 조림비. 이율을 쓰지 않는다는 점이 시험 포인트예요.\n용어 풀이:\n· 중령림: 어리지도 다 자라지도 않은 중간 나이 숲\n· 임목평가: 서 있는 나무의 가치를 돈으로 계산\n· 비용가·기망가: 비용·기대수익 기준 평가법", "ref": "p.24–28"}, {"id": "산림경영-9", "subject": "산림경영", "num": 9, "part": 1, "stem": "500만원을 연 5% 복리로 10년 동안 거치했을 때 후가는? (1.05¹⁰ ≈ 1.6289)", "options": ["약 750만원", "약 814만원", "약 863만원", "1,000만원"], "answer": 1, "explain": "500 × 1.6289 ≈ 814.4만원\n쉬운 풀이: 후가는 '지금 돈이 나중에 얼마가 되나'예요. 복리이니 매년 이자에 이자가 붙어요. 공식 후가 = 원금 × (1 + 이율)^기간 = 500 × 1.05¹⁰ = 500 × 1.6289 ≈ 814만원이에요.\n용어 풀이:\n· 후가(미래가치): 현재 금액의 미래 가치\n· 복리: 이자에도 이자가 붙는 방식\n· 거치: 일정 기간 그대로 둠", "ref": "p.17–18"}, {"id": "산림경영-10", "subject": "산림경영", "num": 10, "part": 1, "stem": "매년 말 30만원의 순수익이 영구히 발생하는 산림의 전가는? (이율 6%)", "options": ["180만원", "300만원", "450만원", "500만원"], "answer": 3, "explain": "무한연년이자 전가 = r/P = 30/0.06 = 500만원\n쉬운 풀이: 매년 같은 돈이 영원히 들어오는 경우의 현재가치는 '연간 수익 ÷ 이율'로 아주 간단해요. 30만원 ÷ 0.06 = 500만원. 500만원을 6% 이자로 맡기면 매년 이자 30만원이 영원히 나오는 것과 같다고 생각하면 이해돼요.\n용어 풀이:\n· 전가(현재가치): 미래 금액을 지금 가치로 환산\n· 무한연년이자: 매년 영원히 받는 일정 수익\n· 순수익: 비용을 뺀 이익", "ref": "p.17–18"}, {"id": "산림경영-11", "subject": "산림경영", "num": 11, "part": 1, "stem": "시장가역산법으로 원목 1㎥당 임목가를 구하면? (이용률 80%, 원목 시장가 150,000원/㎥, 벌채·운반 등 생산비 30,000원/㎥, 월이율 2%, 자본회수기간 5개월, 기업이익률은 고려하지 않음)", "options": ["약 72,000원", "약 85,090원", "약 96,000원", "120,000원"], "answer": 1, "explain": "x = 0.8 × [150,000/(1 + 5 × 0.02) − 30,000] = 0.8 × (136,364 − 30,000) ≈ 85,091원\n쉬운 풀이: 시장가역산법은 원목 시장 가격에서 거꾸로 비용을 빼서 서 있는 나무 값을 구하는 방법이에요. ① 원목가를 이자만큼 할인: 150,000 ÷ (1 + 5×0.02) = 150,000 ÷ 1.1 ≈ 136,364 ② 생산비 빼기: 136,364 − 30,000 = 106,364 ③ 이용률 곱하기: × 0.8 ≈ 85,091원이에요.\n용어 풀이:\n· 시장가역산법: 시장가에서 비용을 거꾸로 빼서 임목가를 구하는 법\n· 이용률(조재율): 나무 중 실제로 쓸 수 있는 목재 비율\n· 자본회수기간: 투자한 돈이 돌아오기까지의 기간", "ref": "p.27–28"}, {"id": "산림경영-12", "subject": "산림경영", "num": 12, "part": 1, "stem": "취득원가 2,000만원, 잔존가치 200만원, 내용연수 10년인 장비의 정액법 연간 감가상각비는?", "options": ["100만원", "150만원", "180만원", "200만원"], "answer": 2, "explain": "(2,000 − 200)/10 = 180만원\n쉬운 풀이: 감가상각은 장비 값이 쓰면서 줄어드는 만큼을 비용으로 나누는 거예요. 정액법은 매년 똑같이 나눠요. (살 때 값 − 다 썼을 때 남는 값) ÷ 쓰는 햇수 = (2,000 − 200) ÷ 10 = 180만원이에요.\n용어 풀이:\n· 감가상각: 자산 가치 감소분을 비용으로 배분\n· 잔존가치: 다 쓴 뒤 남는 가치\n· 내용연수: 사용할 수 있는 기간", "ref": "p.29–31"}, {"id": "산림경영-13", "subject": "산림경영", "num": 13, "part": 1, "stem": "내용연수 5년인 장비를 연수합계법으로 상각할 때 1년차 상각률은?", "options": ["1/5", "5/15", "4/15", "5/10"], "answer": 1, "explain": "분모 1+2+3+4+5 = 15, 1년차 5/15\n쉬운 풀이: 연수합계법은 처음에 많이, 갈수록 적게 상각해요. 내용연수 5년이면 1+2+3+4+5 = 15가 분모이고, 1년차는 남은 연수 5를 분자로 써서 5/15, 2년차 4/15 … 이렇게 줄어들어요.\n용어 풀이:\n· 연수합계법: 연수의 합을 분모로 해 초기에 많이 상각하는 방법\n· 상각률: 그해 상각하는 비율", "ref": "p.29–31"}, {"id": "산림경영-14", "subject": "산림경영", "num": 14, "part": 1, "stem": "제재목 판매단가 40,000원/㎥, 변동비 25,000원/㎥, 고정비 300만원일 때 손익분기 판매량은?", "options": ["120㎥", "150㎥", "200㎥", "300㎥"], "answer": 2, "explain": "300만/(40,000 − 25,000) = 200㎥\n쉬운 풀이: 손익분기점은 이익도 손해도 없는 판매량이에요. 1㎥ 팔 때마다 남는 돈(공헌이익) = 40,000 − 25,000 = 15,000원. 고정비 300만원을 메우려면 3,000,000 ÷ 15,000 = 200㎥를 팔아야 해요.\n용어 풀이:\n· 손익분기점: 수익 = 비용이 되는 지점\n· 고정비: 판매량과 관계없이 드는 비용(임대료 등)\n· 변동비: 판매량에 따라 늘어나는 비용(원료비 등)", "ref": "p.34–36"}, {"id": "산림경영-15", "subject": "산림경영", "num": 15, "part": 1, "stem": "10년 전 재적 200㎥, 현재 재적 300㎥인 임분의 Pressler 생장률은?", "options": ["3%", "4%", "5%", "6%"], "answer": 1, "explain": "(300 − 200)/(300 + 200) × 200/10 = 0.2 × 20 = 4%\n쉬운 풀이: Pressler 생장률은 지난 n년 동안 숲이 연평균 몇 % 자랐는지 구하는 공식이에요. (현재 − 과거) ÷ (현재 + 과거) × 200 ÷ n = (300 − 200) ÷ 500 × 200 ÷ 10 = 0.2 × 20 = 4%예요.\n용어 풀이:\n· 생장률: 일정 기간 동안 자란 비율\n· 재적: 나무 부피\n· Pressler식: 두 시점 재적으로 생장률을 구하는 공식", "ref": "p.94–96"}, {"id": "산림경영-16", "subject": "산림경영", "num": 16, "part": 1, "stem": "투자분석 판단 기준으로 옳지 **않은** 것은?", "options": ["NPV가 0보다 크면 투자한다", "B/C비가 1보다 크면 투자한다", "NPV는 절대치라서 투자규모가 다른 사업끼리 비교하기 어렵다", "IRR이 시장이자율보다 작으면 투자한다"], "answer": 3, "explain": "IRR이 시장이자율보다 커야 투자\n쉬운 풀이: 투자 판단 기준: NPV(순현재가치)가 0보다 크면 이익, B/C비(편익÷비용)가 1보다 크면 이익, IRR(내부수익률)이 시장이자율보다 '커야' 은행에 넣는 것보다 나으니 투자해요. ④는 반대로 써서 틀렸어요.\n용어 풀이:\n· NPV: 편익 현재가치 − 비용 현재가치 / B\n· C비: 편익 ÷ 비용\n· IRR(내부수익률): NPV를 0으로 만드는 수익률", "ref": "p.36–39"}, {"id": "산림경영-17", "subject": "산림경영", "num": 17, "part": 1, "stem": "산림기본계획의 수립 주기는? (2017년 이후)", "options": ["5년", "10년", "15년", "20년"], "answer": 3, "explain": "산림기본계획·지역산림계획 20년\n쉬운 풀이: 산림기본계획은 나라 전체 숲의 큰 그림을 그리는 계획으로, 2017년부터 20년마다 세워요(산림청장). 지역산림계획도 20년이에요. 산림경영계획(개별 산주)은 10년이니 헷갈리지 마세요.\n용어 풀이:\n· 산림기본계획: 국가 산림정책의 최상위 장기계획\n· 지역산림계획: 시·도 단위 산림계획\n· 산림경영계획: 개별 산림의 10년 경영계획", "ref": "p.40–43"}, {"id": "산림경영-18", "subject": "산림경영", "num": 18, "part": 1, "stem": "산림경영계획 인가에 따른 혜택으로 옳지 **않은** 것은?", "options": ["벌채할 때 허가 대신 사전신고로 할 수 있다", "인가 후 5년 이상 경영한 보전산지를 양도하면 양도소득세를 감면받는다", "5년 이상 조림한 보전산지는 상속세 계산 때 30억원 한도로 재산가액을 공제받는다", "5년 이상 조림한 29.7ha 이내 산림지를 영농자녀에게 증여하면 증여세를 100% 감면받는다"], "answer": 1, "explain": "양도소득세 감면은 인가 후 10년 이상 경영\n쉬운 풀이: 산림경영계획을 인가받으면 혜택이 있어요. 벌채 때 허가 대신 신고, 상속세 30억원 한도 공제, 영농자녀 증여세 100% 감면 등이에요. 양도소득세 감면은 인가 후 '10년 이상' 경영해야 받을 수 있어서 '5년'이 틀렸어요. 2026 개정 내용이에요.\n용어 풀이:\n· 인가: 행정기관이 공식 승인함\n· 양도소득세: 부동산을 팔아 생긴 이익에 내는 세금\n· 보전산지: 보전 목적으로 지정된 산지", "ref": "p.79 (2026 개정)"}, {"id": "산림경영-19", "subject": "산림경영", "num": 19, "part": 1, "stem": "산림조사 기준으로 옳지 **않은** 것은?", "options": ["임반은 100ha 내외로 고정 구획한다", "입목도 30%를 넘으면 입목지로 본다", "흉고직경 6cm 이상인 입목의 재적을 측정한다", "표준지는 소반 면적의 5% 이상으로 한다"], "answer": 3, "explain": "표준지는 소반 면적의 2% 이상 (조림지 1%)\n쉬운 풀이: 산림조사 기준: 임반은 100ha 내외로 나누고, 입목도 30% 초과면 입목지, 흉고직경 6cm 이상 나무만 재적을 재요. 표준지는 소반 면적의 2% 이상(조림지는 1%)이라서 '5%'가 틀렸어요.\n용어 풀이:\n· 임반: 산림을 큰 단위로 나눈 구역\n· 소반: 임반을 다시 나눈 작은 구역\n· 입목도: 나무가 서 있는 정도의 비율", "ref": "p.52–60"}, {"id": "산림경영-20", "subject": "산림경영", "num": 20, "part": 1, "stem": "연년생장량(CAI)과 평균생장량(MAI)의 관계로 옳은 것은?", "options": ["평균생장량이 최대일 때 연년생장량과 평균생장량은 같다", "연년생장량 최대 시점은 평균생장량 최대 시점보다 늦다", "평균생장량 최대 이후에는 연년생장량이 평균생장량보다 크다", "연년생장량 최대 시점은 원점에서 그은 접선이 총생장곡선에 닿는 점이다"], "answer": 0, "explain": "· MAI 최대 = 접선의 접점, 이때 CAI = MAI\n· CAI 최대(변곡점)가 더 빠름\n쉬운 풀이: 연년생장량(CAI)은 '올해 1년 동안 자란 양', 평균생장량(MAI)은 '지금까지 평균 1년에 자란 양'이에요. 올해 자란 양이 평균보다 크면 평균이 계속 오르다가, 같아지는 순간 평균이 최고가 돼요. 그래서 MAI 최대일 때 CAI = MAI예요. CAI 최대는 그보다 빨리 와요.\n용어 풀이:\n· 연년생장량(CAI): 1년 동안 자란 양\n· 평균생장량(MAI): 총 생장량 ÷ 나이\n· 변곡점: 곡선의 휘는 방향이 바뀌는 점", "ref": "p.94–96"}, {"id": "산림경영-21", "subject": "산림경영", "num": 21, "part": 2, "stem": "Kameraltaxe법으로 표준연벌채량을 구하면? (현실축적 12,000㎥, 법정축적 10,000㎥, 생장량 500㎥, 갱정기 20년)", "options": ["400㎥", "500㎥", "600㎥", "700㎥"], "answer": 2, "explain": "E = Z + (Vw − Vn)/a = 500 + 2,000/20 = 600㎥\n쉬운 풀이: Kameraltaxe(오스트리아)법은 '매년 자라는 양만큼 베되, 넘치거나 모자란 축적을 갱정기 동안 나눠 조정하자'는 공식이에요. E = 생장량 + (현실축적 − 법정축적) ÷ 갱정기 = 500 + (12,000 − 10,000) ÷ 20 = 500 + 100 = 600㎥예요.\n용어 풀이:\n· 갱정기: 현실림을 법정림 상태로 맞추는 기간\n· Kameraltaxe법(오스트리아식): 생장량+축적 차이 조정으로 벌채량을 정하는 법", "ref": "모듈 p.11"}, {"id": "산림경영-22", "subject": "산림경영", "num": 22, "part": 2, "stem": "Mantel법으로 표준연벌채량을 구하면? (현실축적 24,000㎥, 윤벌기 40년)", "options": ["600㎥", "1,200㎥", "2,400㎥", "4,800㎥"], "answer": 1, "explain": "E = Vw ÷ (U/2) = 24,000 ÷ 20 = 1,200㎥\n쉬운 풀이: Mantel법은 가장 간단한 공식이에요. 법정림 축적은 '벌기재적 × 윤벌기 ÷ 2'이니 거꾸로 벌채량 = 현실축적 ÷ (윤벌기 ÷ 2) = 2 × 현실축적 ÷ 윤벌기예요. 24,000 ÷ 20 = 1,200㎥.\n용어 풀이:\n· Mantel법: 현실축적과 윤벌기만으로 벌채량을 구하는 법\n· 윤벌기: 숲을 한 바퀴 다 베는 기간", "ref": "p.12"}, {"id": "산림경영-23", "subject": "산림경영", "num": 23, "part": 2, "stem": "수확표에 의한 방법으로 하계 법정축적을 구하면? (면적 60ha, 윤벌기 30년, 영급 폭 10년, ha당 재적 10년생 30㎥·20년생 150㎥·30년생 300㎥)", "options": ["4,500㎥", "6,600㎥", "9,000㎥", "13,200㎥"], "answer": 1, "explain": "Vs = n(m₁₀ + m₂₀ + m₃₀/2) × F/U = 10 × (30 + 150 + 150) × 60/30 = 6,600㎥\n쉬운 풀이: 수확표법 법정축적은 각 영급의 재적을 더하되, 마지막 벌기 영급은 절반만 넣어요(여름 기준이라 반쯤 자란 상태). 영급 폭 × (10년 30 + 20년 150 + 30년 300 ÷ 2) × (면적 ÷ 윤벌기) = 10 × 330 × 2 = 6,600㎥예요.\n용어 풀이:\n· 수확표: 나이별로 예상되는 ha당 재적을 정리한 표\n· 영급 폭: 영급 하나가 차지하는 연수", "ref": "p.9"}, {"id": "산림경영-24", "subject": "산림경영", "num": 24, "part": 2, "stem": "Kameraltaxe법의 갱정기 설정으로 옳은 것은?", "options": ["현실축적이 법정축적보다 많으면 짧게, 적으면 길게 한다", "현실축적이 법정축적보다 많으면 길게, 적으면 짧게 한다", "항상 윤벌기와 같게 한다", "표준연벌채량이 생장량의 2배를 넘도록 정한다"], "answer": 0, "explain": "· Vw > Vn이면 짧게, Vw < Vn이면 길게\n· 표준연벌채량이 생장량의 1/2보다 적지 않게\n쉬운 풀이: 갱정기는 넘치거나 모자란 숲을 정상으로 맞추는 기간이에요. 숲이 너무 많으면(현실 > 법정) 빨리 줄여도 되니 짧게, 숲이 부족하면(현실 < 법정) 천천히 키워야 하니 길게 잡아요. 또 벌채량이 생장량의 절반보다 적어지지 않게 해요.\n용어 풀이:\n· 갱정기: 축적 조정 기간\n· 법정축적: 이상적인 숲의 축적\n· 현실축적: 실제 축적", "ref": "p.11"}, {"id": "산림경영-25", "subject": "산림경영", "num": 25, "part": 2, "stem": "벌구식 작업에만 적용되어 동령 단순림에 가장 적합한 수확조절 방법은?", "options": ["조사법", "Hundeshagen법", "생장률법", "평분법"], "answer": 3, "explain": "· 평분법은 벌구식 작업에만 적용 → 동령 단순림\n· 조사법은 택벌작업\n쉬운 풀이: 평분법은 숲을 같은 면적(벌구)으로 나눠 순서대로 베는 방식에만 쓸 수 있어요. 그래서 한꺼번에 심어 나이가 같은 동령 단순림에 가장 잘 맞아요. 나이가 섞인 숲에서 골라 베는 택벌작업에는 조사법을 써요.\n용어 풀이:\n· 평분법: 면적·재적을 균등하게 나눠 벌채량을 정하는 법\n· 벌구식 작업: 구역을 나눠 순서대로 베는 작업\n· 동령 단순림: 나이와 수종이 같은 숲", "ref": "p.10, 12"}, {"id": "산림경영-26", "subject": "산림경영", "num": 26, "part": 2, "stem": "임목비용가법에 대한 설명으로 옳지 **않은** 것은?", "options": ["비용의 후가합계에서 수입의 후가합계를 뺀다", "우량임지의 임목가가 불량임지보다 높게 평가되는 경향이 있다", "임목가의 최저 하한가를 제공한다", "유령림에서만 적용할 수 있다"], "answer": 1, "explain": "불량임지보다 우량임지의 임목가가 더 적게 평가되는 경향\n쉬운 풀이: 임목비용가법은 '지금까지 들어간 돈(이자 포함)'으로 나무 값을 정하는 방법이에요. 그래서 땅이 좋아 나무가 잘 자라도 비용은 비슷하니 가치가 제대로 반영 안 돼요. 오히려 좋은 땅(우량임지)의 나무가 실제보다 '적게' 평가되는 경향이 있어서 ②가 틀렸어요.\n용어 풀이:\n· 임목비용가: 투입 비용의 후가합계로 계산한 임목 가치\n· 우량임지: 나무가 잘 자라는 좋은 땅\n· 하한가: 최저 가격", "ref": "p.25"}, {"id": "산림경영-27", "subject": "산림경영", "num": 27, "part": 2, "stem": "Glaser식으로 20년생 임목가를 구하면? (적정 벌기령 40년의 주벌수익 1,000만원, 초년도 조림비 100만원)", "options": ["250만원", "300만원", "325만원", "400만원"], "answer": 2, "explain": "Am = (m²/n²)(An − C₀) + C₀ = (400/1,600) × 900 + 100 = 325만원\n쉬운 풀이: Glaser식에 넣으면: (현재나이² ÷ 벌기²) × (주벌수익 − 조림비) + 조림비 = (20² ÷ 40²) × (1,000 − 100) + 100 = (400 ÷ 1,600) × 900 + 100 = 0.25 × 900 + 100 = 325만원. 나이가 절반이면 가치는 1/4(제곱 비율)이라는 점이 특징이에요.\n용어 풀이:\n· Glaser식: 나이 제곱 비율로 중령림 가치를 구하는 공식\n· 주벌수익: 최종 수확 때 얻는 수익\n· 조림비: 초기 식재 비용", "ref": "p.26"}, {"id": "산림경영-28", "subject": "산림경영", "num": 28, "part": 2, "stem": "임목 소유자가 직영으로 생산할 때 임목평가액은? (원목 시장가격 5,000만원, 총사업비 1,000만원, 자본회수기간 3개월, 월이율 2%, X = A − B(1 + lp))", "options": ["3,940만원", "4,000만원", "4,060만원", "4,900만원"], "answer": 0, "explain": "5,000 − 1,000 × (1 + 3 × 0.02) = 5,000 − 1,060 = 3,940만원\n쉬운 풀이: 직영 생산이면 '원목을 팔아 받을 돈 − 생산비(이자 포함)'가 나무 값이에요. 생산비에 3개월 이자를 붙이면 1,000 × (1 + 3 × 0.02) = 1,060만원. 5,000 − 1,060 = 3,940만원이에요.\n용어 풀이:\n· 직영 생산: 소유자가 직접 벌채·판매\n· 총사업비: 벌채·운반 등 전체 생산비\n· 월이율: 한 달 기준 이자율", "ref": "p.28"}, {"id": "산림경영-29", "subject": "산림경영", "num": 29, "part": 2, "stem": "임지기망가 적용의 전제조건이 **아닌** 것은?", "options": ["임지는 잔존 임목이 없는 상태에서 시작한다", "임지는 영속적으로 숲으로만 유지된다", "매 벌기마다 현금흐름이 같다", "이율은 벌기마다 달라진다"], "answer": 3, "explain": "· 전제: 잔존임목 없음\n· 영속적 숲 유지\n· 벌기마다 현금흐름 동일\n쉬운 풀이: 임지기망가는 '빈 땅에 나무를 심고 베는 일을 영원히 똑같이 반복한다'고 가정해서 계산해요. 그래서 처음엔 나무가 없고, 영원히 숲으로 쓰이며, 벌기마다 돈의 흐름이 같고, 이율도 변하지 않는다고 봐요. '이율이 벌기마다 달라진다'는 틀려요.\n용어 풀이:\n· 전제조건: 계산의 바탕이 되는 가정\n· 잔존 임목: 남아 있는 나무\n· 현금흐름: 들어오고 나가는 돈", "ref": "p.21"}, {"id": "산림경영-30", "subject": "산림경영", "num": 30, "part": 2, "stem": "3년 전 2,000만원에 산 임지의 비용가는? (연이율 5%, 1.05³ = 1.157625, 다른 비용 없음)", "options": ["약 2,100만원", "약 2,315만원", "약 2,431만원", "2,500만원"], "answer": 1, "explain": "2,000 × 1.157625 ≈ 2,315만원 (비용가 = 취득원가의 복리합계)\n쉬운 풀이: 임지비용가는 땅을 산 값에 그동안의 이자를 붙인 값이에요. 2,000만원 × 1.05³ = 2,000 × 1.157625 ≈ 2,315만원이에요. '산 값 × (1+이율)^경과연수'로 기억하세요.\n용어 풀이:\n· 임지비용가: 임지 취득 비용의 후가\n· 취득원가: 살 때 든 비용", "ref": "p.19–21"}, {"id": "산림경영-31", "subject": "산림경영", "num": 31, "part": 2, "stem": "학습모듈의 임지 평가방법 중 '연년수입의 전가합계'로 평가하는 것은?", "options": ["원가방법", "비용가법", "환원가법", "직접 비교법"], "answer": 2, "explain": "· 기망가법 = 장래 기대 수입의 전가합계\n· 환원가법 = 연년수입의 전가합계\n쉬운 풀이: 임지 평가법 정리: 기망가법은 '앞으로 기대되는 수입'의 현재가치, 비용가법은 '들어간 비용'의 후가, 환원가법은 '매년 들어오는 수입'을 현재가치로 합한 것이에요. 연년수입 = 환원가법이에요.\n용어 풀이:\n· 환원가법: 연년 수익을 이율로 나눠 현재가치화하는 방법\n· 기망가법: 기대 수익 기준 평가\n· 비용가법: 투입 비용 기준 평가", "ref": "p.19"}, {"id": "산림경영-32", "subject": "산림경영", "num": 32, "part": 2, "stem": "지방자치단체장이 산림경영계획을 작성할 때 '준공검사' 다음 단계는?", "options": ["성과품 납품", "인가신청", "초안검토", "산림조사"], "answer": 1, "explain": "산림조사 → 계획수립 → 초안검토 → 성과품 납품 → 준공검사 → 인가신청 → 인가 → 확정\n쉬운 풀이: 지자체가 산림경영계획을 만드는 순서예요: 산림조사 → 계획수립 → 초안검토 → 성과품 납품 → 준공검사 → 인가신청 → 인가 → 확정. 일이 다 끝났는지 검사(준공검사)한 다음에 공식 승인을 신청(인가신청)한다고 생각하면 돼요.\n용어 풀이:\n· 준공검사: 일이 계획대로 끝났는지 확인하는 검사\n· 성과품: 작업 결과물\n· 인가신청: 공식 승인을 요청함", "ref": "p.44"}, {"id": "산림경영-33", "subject": "산림경영", "num": 33, "part": 2, "stem": "사유림 산림소유자가 산림경영계획을 작성할 때 작성자가 될 수 있는 사람은?", "options": ["산주 또는 산림경영기술자(기술 초급 이상)", "시장·군수만", "산림조합 직원만", "엔지니어링 업체 누구나"], "answer": 0, "explain": "· 산주 또는 산림경영기술자(기술 초급 이상)\n· 지자체 발주는 산림조합·등록 산림법인으로 입찰 제한\n쉬운 풀이: 개인 산주는 직접 산림경영계획을 짜거나, 산림경영기술자(기술 초급 이상)에게 맡길 수 있어요. 지자체가 발주하는 경우엔 산림조합이나 등록된 산림법인만 입찰할 수 있어요.\n용어 풀이:\n· 산주: 산의 주인\n· 산림경영기술자: 산림경영 기술 자격자\n· 입찰: 일을 맡으려고 가격을 제시해 경쟁", "ref": "p.44, 46"}, {"id": "산림경영-34", "subject": "산림경영", "num": 34, "part": 2, "stem": "산림경영계획 인가 신청의 '정당한 권원'이 있는 자란?", "options": ["임야를 임차한 모든 자", "「입목에 관한 법률」에 따라 입목 소유권 보존등기를 받은 자", "산림조합원", "인접 토지 소유자"], "answer": 1, "explain": "입목 소유권 보존등기를 받은 자\n쉬운 풀이: 땅 주인이 아니어도 그 땅의 나무에 대한 권리가 법적으로 등록된 사람은 산림경영계획 인가를 신청할 수 있어요. 「입목에 관한 법률」에 따라 나무 소유권을 등기한 사람이 '정당한 권원이 있는 자'예요.\n용어 풀이:\n· 정당한 권원: 법적으로 인정되는 권리 근거\n· 입목: 땅에 서 있는 나무\n· 보존등기: 소유권을 처음 등록하는 등기", "ref": "p.46"}, {"id": "산림경영-35", "subject": "산림경영", "num": 35, "part": 2, "stem": "산림조사 항목 중 '지황' 조사 항목이 **아닌** 것은?", "options": ["지종", "방위", "경사도", "소밀도"], "answer": 3, "explain": "· 지황: 지종·방위·경사도·표고·토성·토심·건습도·지위·지리·하층식생\n· 소밀도는 임황\n쉬운 풀이: 산림조사는 '땅에 대한 조사(지황)'와 '나무에 대한 조사(임황)'로 나눠요. 지황은 지종·방위·경사도·표고·토성·토심·건습도·지위·지리·하층식생이에요. 소밀도(나무가 빽빽한 정도)는 나무에 대한 조사라 임황이에요.\n용어 풀이:\n· 지황: 땅의 상태\n· 임황: 숲(나무)의 상태\n· 소밀도: 나무 수관이 빽빽한 정도", "ref": "p.44"}, {"id": "산림경영-36", "subject": "산림경영", "num": 36, "part": 2, "stem": "임목수확 작업이 가능한 풍속 한계는?", "options": ["초속 8m까지", "초속 14m까지", "초속 20m까지", "초속 24m까지"], "answer": 1, "explain": "초속 14m까지 가능, 24m 이상이면 천근성 수종 풍도목 발생\n쉬운 풀이: 바람이 세면 벤 나무가 엉뚱한 방향으로 넘어가 위험해요. 수확작업은 초속 14m까지만 가능하고, 초속 24m 이상이면 뿌리가 얕은 나무가 바람에 넘어지는 풍도목이 생길 정도예요.\n용어 풀이:\n· 풍속: 바람의 속도\n· 풍도목: 바람에 쓰러진 나무\n· 천근성: 뿌리가 얕게 뻗는 성질", "ref": "p.101"}, {"id": "산림경영-37", "subject": "산림경영", "num": 37, "part": 2, "stem": "겨울 수확작업의 장점이 **아닌** 것은?", "options": ["해충과 균류 피해가 없다", "수액 정지기간이라 양질의 목재를 수확한다", "일조시간이 길고 작업장 접근이 쉽다", "농한기라 인력 수급이 원활하다"], "answer": 2, "explain": "· ③은 여름작업의 장점\n· 겨울은 잔존 임분 영향도 적음\n쉬운 풀이: 겨울 수확의 장점은 벌레·곰팡이 피해가 없고, 수액이 멈춰 목재 질이 좋고, 농사철이 아니라 일손 구하기 쉽다는 거예요. 하지만 겨울은 해가 짧고 눈 때문에 현장 접근도 어려워요. '해가 길고 접근이 쉽다'는 여름 작업의 장점이에요.\n용어 풀이:\n· 수액 정지기: 나무 속 수액 이동이 멈추는 시기\n· 농한기: 농사일이 한가한 시기\n· 일조시간: 해가 비치는 시간", "ref": "p.101"}, {"id": "산림경영-38", "subject": "산림경영", "num": 38, "part": 2, "stem": "가공본줄의 처짐 여유가 커서 가선집재에 가장 알맞은 경사형은?", "options": ["凹형", "凸형", "평탄형", "굴곡형"], "answer": 0, "explain": "凹형은 가선집재 적합, 凸형은 시야 불량·중간지주 많아 불리\n쉬운 풀이: 가선집재는 공중에 줄(가공본줄)을 걸어 통나무를 옮기는 방법이에요. 가운데가 움푹 들어간 凹형 지형이면 줄이 충분히 처져도 땅에 안 닿아서 가장 좋아요. 볼록한 凸형은 줄이 땅에 걸려 중간 기둥이 많이 필요해 불리해요.\n용어 풀이:\n· 가선집재: 공중 케이블로 목재를 모으는 방법\n· 가공본줄: 공중에 거는 주 케이블\n· 처짐: 줄이 아래로 늘어지는 정도", "ref": "p.102"}, {"id": "산림경영-39", "subject": "산림경영", "num": 39, "part": 2, "stem": "기계톱 벌도에서 벌도맥(holding wood)의 적당한 두께는?", "options": ["입목직경의 1/20", "입목직경의 1/10", "입목직경의 1/4", "입목직경의 1/3"], "answer": 1, "explain": "수구는 근주직경 1/4 이상(흉고 50cm 이상은 1/3), 경사 30~45°, 추구는 수구 높이 2/3, 벌도맥 1/10\n쉬운 풀이: 벌도맥은 방향베기와 따라베기 사이에 남기는 경첩 같은 부분으로, 나무가 정해진 방향으로 천천히 넘어가게 잡아 줘요. 두께는 나무 지름의 1/10 정도예요. 너무 얇으면 경첩이 끊겨 엉뚱한 방향으로, 너무 두꺼우면 안 넘어가요.\n용어 풀이:\n· 벌도맥(holding wood): 넘어지는 방향을 잡아 주는 남긴 부분\n· 수구: 방향베기 홈\n· 추구: 따라베기", "ref": "p.106"}, {"id": "산림경영-40", "subject": "산림경영", "num": 40, "part": 2, "stem": "트랙터 집재작업에 대한 설명으로 옳지 **않은** 것은?", "options": ["윈칭 거리는 최대 50m를 넘지 않게 한다", "와이어로프는 보통 8~12mm를 쓴다", "30% 이내 경사가 능률과 안전에 유리하다", "하향집재를 원칙으로 한다"], "answer": 3, "explain": "트랙터 집재는 상향집재가 원칙\n쉬운 풀이: 트랙터 집재는 트랙터가 와이어로 통나무를 끌어오는 방법이에요. 트랙터는 무거운 통나무를 매달고 내려가면 미끄러지고 위험해서, 아래에서 위로 끌어올리는 '상향집재'가 원칙이에요. 윈치 거리는 50m 이내, 경사는 30% 이내가 좋아요.\n용어 풀이:\n· 집재: 벤 나무를 한곳으로 모으는 작업\n· 윈칭: 윈치(감는 기계)로 줄을 감아 끄는 것\n· 상향집재: 아래에서 위로 끌어 모음", "ref": "p.109–110"}, {"id": "산림경영-41", "subject": "산림경영", "num": 41, "part": 3, "stem": "각산정 표준지법(Bitterlich)에서 단면적계수(BAF) 2로 측정해 12본이 카운트되었다. ha당 흉고단면적은?", "options": ["6㎡", "12㎡", "24㎡", "48㎡"], "answer": 2, "explain": "ha당 단면적 = BAF × 카운트 본수 = 2 × 12 = 24㎡\n쉬운 풀이: 각산정 표준지법은 한 지점에 서서 프리즘(각산정기)으로 주변 나무를 360° 둘러보며 '걸리는' 나무 수만 세는 간편한 방법이에요. ha당 흉고단면적 = 단면적계수(BAF) × 센 본수 = 2 × 12 = 24㎡. 나무를 일일이 재지 않아도 돼요.\n용어 풀이:\n· 각산정 표준지법(Bitterlich법): 각도를 이용해 흉고단면적을 추정하는 방법\n· BAF(단면적계수): 한 그루당 대표하는 ha당 단면적\n· 흉고단면적: 가슴높이 줄기 단면 넓이", "ref": "산림측정학"}, {"id": "산림경영-42", "subject": "산림경영", "num": 42, "part": 3, "stem": "수고를 측정하는 기구가 **아닌** 것은?", "options": ["하가측고기", "순토측고기", "아브네이 핸드레블", "윤척"], "answer": 3, "explain": "윤척은 직경 측정 기구\n쉬운 풀이: 하가·순토 측고기, 아브네이 핸드레블은 각도를 재서 나무 키(수고)를 구하는 기구예요. 윤척은 집게처럼 생긴 자로 나무 줄기 지름을 재는 기구라서 수고 측정 기구가 아니에요.\n용어 풀이:\n· 측고기: 나무 높이를 재는 기구\n· 윤척(캘리퍼): 줄기 지름을 재는 집게형 자\n· 수고: 나무 높이", "ref": "산림측정학"}, {"id": "산림경영-43", "subject": "산림경영", "num": 43, "part": 3, "stem": "흉고형수의 정의는?", "options": ["수간재적 ÷ (흉고단면적 × 수고)", "흉고직경 ÷ 수고", "수고 ÷ 흉고직경", "근원단면적 ÷ 흉고단면적"], "answer": 0, "explain": "형수 = 수간재적 ÷ 원주(흉고단면적 × 수고)\n쉬운 풀이: 나무 줄기는 원기둥이 아니라 위로 갈수록 가늘어져요. 그래서 '같은 굵기·높이의 원기둥에 비해 실제 줄기 부피가 몇 배인가'를 형수라고 해요. 흉고형수 = 실제 줄기 부피 ÷ (가슴높이 단면적 × 나무 키). 보통 0.4~0.5 정도예요.\n용어 풀이:\n· 형수: 실제 재적 ÷ 원기둥 부피\n· 원주: 원기둥\n· 수간재적: 줄기의 부피", "ref": "산림측정학"}, {"id": "산림경영-44", "subject": "산림경영", "num": 44, "part": 3, "stem": "임업의 경제적 특성으로 옳지 **않은** 것은?", "options": ["생산기간이 매우 길다", "생산기간이 짧아 자본 회수가 빠르다", "육성임업과 채취임업이 함께 있다", "임목은 생산물이면서 동시에 생산수단이다"], "answer": 1, "explain": "임업은 생산기간이 길어 자본 회수가 느림\n쉬운 풀이: 임업은 나무가 클 때까지 수십 년이 걸려서 투자한 돈이 아주 늦게 돌아와요. 또 나무는 팔 '물건'이면서 계속 자라는 '생산 수단'이기도 해요. '생산기간이 짧아 회수가 빠르다'는 정반대라 틀렸어요.\n용어 풀이:\n· 자본 회수: 투자한 돈이 돌아오는 것\n· 육성임업: 나무를 심고 키우는 임업\n· 채취임업: 자연에서 거두는 임업", "ref": "임업경영학"}, {"id": "산림경영-45", "subject": "산림경영", "num": 45, "part": 3, "stem": "파우스트만(Faustmann) 공식으로 구하는 것은?", "options": ["토지기망가", "임목비용가", "감가상각비", "손익분기점"], "answer": 0, "explain": "Faustmann식 = 토지(임지)기망가 → 최대 시점이 토지순수익 최대 벌기령\n쉬운 풀이: 파우스트만 공식은 '빈 땅에 나무를 심고 베는 일을 영원히 반복할 때 얻을 수익의 현재가치 합', 즉 토지(임지)기망가를 구하는 공식이에요. 이 값이 최대가 되는 벌기령이 경제적으로 가장 좋은 벌기령이에요.\n용어 풀이:\n· 파우스트만 공식: 임지기망가를 구하는 고전 공식\n· 토지기망가: 땅의 미래 순수익을 현재가치로 합한 값", "ref": "임업경영학"}, {"id": "산림경영-46", "subject": "산림경영", "num": 46, "part": 3, "stem": "감가상각 정률법의 특징으로 옳은 것은?", "options": ["매년 같은 금액을 상각한다", "사용시간에 비례해 상각한다", "초기 상각액이 크고 해마다 줄어든다", "잔존가치를 고려하지 않는다"], "answer": 2, "explain": "· 정률법은 미상각잔액에 일정률 → 초기 상각액 큼\n· ①은 정액법, ②는 작업시간비례법\n쉬운 풀이: 정률법은 '남은 장부 가치'에 매년 같은 비율을 곱해 상각해요. 처음엔 남은 가치가 커서 상각액이 크고, 해마다 줄어들어요. 매년 같은 금액은 정액법, 쓴 시간에 비례하는 건 작업시간비례법이에요.\n용어 풀이:\n· 정률법: 미상각 잔액 × 일정률로 상각\n· 정액법: 매년 같은 금액 상각\n· 미상각잔액: 아직 상각하지 않은 남은 가치", "ref": "모듈 p.29–30 · 회계"}, {"id": "산림경영-47", "subject": "산림경영", "num": 47, "part": 3, "stem": "윤척으로 흉고직경을 잴 때의 올바른 방법은?", "options": ["지상 0.5m에서 한 방향만 잰다", "지상 1.2m에서 서로 직각인 두 방향을 재어 평균한다", "지상 2m에서 최대 직경만 잰다", "수피를 벗기고 잰다"], "answer": 1, "explain": "흉고 지상 1.2m(모듈 산림조사 기준), 직교 두 방향 평균\n쉬운 풀이: 흉고직경은 땅에서 1.2m(가슴 높이) 위치에서 재요. 나무 줄기는 완전한 원이 아니니 서로 직각인 두 방향을 재서 평균을 내야 정확해요.\n용어 풀이:\n· 흉고직경(DBH): 가슴높이 지름\n· 윤척: 지름 측정 자\n· 직각: 90도", "ref": "모듈 p.52~ · 산림측정학"}, {"id": "산림경영-48", "subject": "산림경영", "num": 48, "part": 3, "stem": "통나무 재적식 중 중앙단면적과 길이를 곱하는 식은?", "options": ["Smalian식", "Huber식", "Newton식", "Pressler식"], "answer": 1, "explain": "· Huber = 중앙단면적 × 길이\n· Smalian = 양단면적 평균 × 길이\n쉬운 풀이: 통나무 부피 공식 3가지예요. Huber식 = 가운데 단면적 × 길이(가장 간단), Smalian식 = 양 끝 단면적 평균 × 길이, Newton식 = 양 끝과 가운데(4배 가중)를 모두 써서 가장 정확해요. 'Huber는 가운데(중앙)'로 외우세요.\n용어 풀이:\n· 중앙단면적: 통나무 가운데의 단면 넓이\n· 재적식: 부피를 구하는 공식", "ref": "산림측정학"}, {"id": "산림경영-49", "subject": "산림경영", "num": 49, "part": 3, "stem": "생장추(increment borer)의 주된 용도는?", "options": ["수고 측정", "수관폭 측정", "목편을 뽑아 연륜(나이테) 측정", "토양 경도 측정"], "answer": 2, "explain": "· 목편 채취 → 연륜폭·연령 측정\n· Schneider 생장률(수피 안쪽 1cm 연륜수)에 쓰임\n쉬운 풀이: 생장추는 나무에 꽂아 돌리면 연필 굵기의 나무 막대(목편)를 뽑아내는 도구예요. 나무를 베지 않고도 나이테를 세어 나이와 최근 자란 폭을 알 수 있어요. Schneider 생장률 계산에도 써요.\n용어 풀이:\n· 생장추: 나무 속 목편을 뽑는 송곳\n· 목편: 뽑아낸 나무 조각\n· 연륜: 나이테", "ref": "모듈 p.96 · 산림측정학"}, {"id": "산림경영-50", "subject": "산림경영", "num": 50, "part": 3, "stem": "지위지수(site index)의 정의는?", "options": ["임분의 ha당 본수", "임분의 평균 흉고직경", "토양의 pH", "기준임령에서 우세목의 평균 수고"], "answer": 3, "explain": "· 지위지수 = 기준임령(예: 30년)에서 우세목 평균수고\n· 모듈은 우세목 3~5본으로 지위 판정\n쉬운 풀이: 지위지수는 '그 땅이 나무를 얼마나 잘 키우는가'를 나타내요. 기준 나이(예: 30년)에서 우세목들의 평균 키로 정해요. 키가 클수록 좋은 땅이에요. 직경보다 키가 밀도 영향을 덜 받아 땅심을 잘 보여 주기 때문이에요.\n용어 풀이:\n· 지위지수: 기준임령 우세목 평균 수고로 나타낸 땅의 생산력\n· 기준임령: 비교 기준 나이\n· 우세목: 숲 상층의 세력 좋은 나무", "ref": "산림경영학"}, {"id": "산림경영-51", "subject": "산림경영", "num": 51, "part": 4, "stem": "서 있는 나무(입목)의 재적을 구할 때 수고의 기준을 흉고(1.2m)로 잡고 그 단면적과 원기둥의 비율로 계산하는 가장 실용적인 형수는?", "options": ["흉고형수", "절대형수", "정형수", "진정형수"], "answer": 0, "explain": "흉고형수(Breast-height form factor)는 지상 1.2m 단면적을 기준으로 하여 실무에서 가장 널리 쓰임\n쉬운 풀이: 서 있는 나무의 부피를 구할 때는 가슴높이(1.2m) 단면적을 기준으로 한 흉고형수를 가장 많이 써요. 가슴높이는 사람이 서서 쉽게 잴 수 있어서 실무에 편리하기 때문이에요.\n용어 풀이:\n· 흉고형수: 가슴높이 단면적 기준 형수\n· 절대형수: 밑동 단면 기준 형수\n· 정형수: 수고의 일정 비율 위치 기준 형수", "ref": "산림측정학"}, {"id": "산림경영-52", "subject": "산림경영", "num": 52, "part": 4, "stem": "벌채한 원목 줄기를 일정 구간(보통 1~2m)으로 잘라 각 단면의 연륜을 측정하여 나무의 일생 동안의 생장 과정을 정밀하게 복원하는 조사법은?", "options": ["수간석해(Stem analysis)", "표준목법", "매목조사", "지위지수법"], "answer": 0, "explain": "수간석해(Stem analysis)는 벌채목의 원판을 채취하여 과거 5년, 10년 단위의 생장 궤적을 복원\n쉬운 풀이: 수간석해는 나무를 베어 줄기를 일정 간격으로 잘라 원판을 만들고, 각 원판의 나이테를 재서 '이 나무가 몇 살 때 키·굵기가 얼마였는지' 일생을 복원하는 조사예요. 성장 과정을 가장 정밀하게 알 수 있어요.\n용어 풀이:\n· 수간석해: 줄기 원판 나이테로 생장 과정을 분석\n· 원판: 줄기를 둥글게 자른 조각\n· 매목조사: 모든 나무를 하나하나 재는 조사", "ref": "산림측정학"}, {"id": "산림경영-53", "subject": "산림경영", "num": 53, "part": 4, "stem": "흉고직경(D)과 최근 반경생장량(나이테 폭 n)을 측정하여 수목의 생장률(P)을 간편하게 추정하는 슈나이더(Schneider) 공식의 형태는?", "options": ["P = K / (n · D)", "P = (D / n) × 100", "P = (V - v) / (V + v)", "P = K · n · D"], "answer": 0, "explain": "슈나이더 생장률 공식은 P = K / (n · D) (여기서 K는 상수, n은 수피 안쪽 1cm당 나이테 수, D는 흉고직경)\n쉬운 풀이: Schneider 공식은 P = K ÷ (n × D)예요. n은 껍질 안쪽 1cm 안의 나이테 수, D는 흉고직경, K는 상수예요. 1cm 안에 나이테가 적다(n 작음)는 건 빨리 자랐다는 뜻이라 생장률이 커져요.\n용어 풀이:\n· Schneider식: 나이테 수와 직경으로 생장률을 추정하는 공식\n· 상수(K): 정해진 숫자\n· 반경생장량: 반지름 방향으로 자란 양", "ref": "산림측정학"}, {"id": "산림경영-54", "subject": "산림경영", "num": 54, "part": 4, "stem": "훈데스하겐(Hundeshagen) 법정벌채량(Y) 산정 공식의 기본 가정으로 옳은 것은?", "options": ["현실임분의 생장량은 항상 법정생장량보다 크다", "현실축적에 대한 법정벌채량의 비율은 법정축적에 대한 법정생장량의 비율과 같다", "벌채량은 림목의 수고생장량에만 비례한다", "영급배치가 불균등할 때는 면적만을 기준으로 벌채한다"], "answer": 1, "explain": "· 훈데스하겐 공식은 현실축적(V)과 법정축적(V_n)의 비가 현실벌채량(Y)과 법정벌채량(E)의 비와 같다는 가정 (Y = V × E\n· V_n)\n쉬운 풀이: Hundeshagen법은 비례식이에요. '현실벌채량 : 현실축적 = 법정벌채량 : 법정축적'이라는 가정이죠. 그래서 현실벌채량 = 현실축적 × (법정벌채량 ÷ 법정축적)이 돼요. 숲이 법정보다 크면 그 비율만큼 더 베요.\n용어 풀이:\n· 법정벌채량: 법정림에서 매년 베는 양(= 법정생장량)\n· 비례식: 두 비율이 같다는 식", "ref": "산림경영학"}, {"id": "산림경영-55", "subject": "산림경영", "num": 55, "part": 4, "stem": "산림의 토지(산지)에서 영구히 얻을 수 있는 순수익의 현재가치 합계를 계산하여 토지의 가치를 평가하는 파우스트만(Faustmann) 식의 명칭은?", "options": ["토지비용가", "토지기대가치", "임목기망가", "토지매매가"], "answer": 1, "explain": "Faustmann의 토지기대가치(Bu)는 영구 순수익의 현재가치 합계를 산출하는 고전적 산림평가 공식\n쉬운 풀이: 파우스트만 공식으로 구하는 것은 땅에서 영원히 얻을 순수익을 지금 가치로 합한 '토지기대가치(임지기망가)'예요. 산림평가에서 가장 고전적이고 중요한 공식이에요.\n용어 풀이:\n· 토지기대가치(기망가): 땅의 미래 수익 현재가치 합계\n· 순수익: 비용을 뺀 이익", "ref": "산림평가학"}, {"id": "산림경영-56", "subject": "산림경영", "num": 56, "part": 4, "stem": "다 자란 성숙림(벌기에 도달한 임목)의 경제적 가치를 평가할 때, 시장의 원목 판매가격에서 벌채비·집재비·운재비 및 기업자의 정상이윤을 공제하여 산정하는 평가법은?", "options": ["글라저(Gläser) 공식", "비용가법", "시장가역산법(원목매매가법)", "복리이자법"], "answer": 2, "explain": "시장가역산법(원목매매가법)은 시장 원목가격에서 투입 비용과 적정 이윤을 역산하여 입목가격을 산정\n쉬운 풀이: 다 자란 나무는 곧 팔 수 있으니, 원목 시장가격에서 거꾸로 벌채·집재·운반 비용과 사업자의 적정 이윤을 빼면 서 있는 나무 값이 나와요. 이게 시장가역산법(원목매매가법)이에요.\n용어 풀이:\n· 시장가역산법: 시장가에서 비용·이윤을 빼 임목가를 구하는 방법\n· 집재비: 벤 나무를 모으는 비용\n· 운재비: 운반 비용", "ref": "산림평가학"}, {"id": "산림경영-57", "subject": "산림경영", "num": 57, "part": 4, "stem": "임업기계(포워더, 굴착기 등)의 감가상각 시 실제 작업시간이나 가동 거리에 비례하여 상각비를 계상하는 방식은?", "options": ["정액법", "정률법", "비례법(작업시간비례법)", "연수합계법"], "answer": 2, "explain": "비례법(작업시간비례법)은 장비의 실제 가동량이나 작업시간에 비례하여 감가상각비를 균등 배분\n쉬운 풀이: 포워더·굴착기 같은 기계는 많이 쓸수록 빨리 닳아요. 그래서 실제 작업시간이나 이동 거리에 비례해 감가상각비를 계산하는 비례법(작업시간비례법)을 써요.\n용어 풀이:\n· 작업시간비례법: 사용 시간에 비례해 상각\n· 포워더: 목재를 실어 나르는 임업 기계\n· 감가상각: 자산 가치 감소분 배분", "ref": "임업기계학"}, {"id": "산림경영-58", "subject": "산림경영", "num": 58, "part": 4, "stem": "임업 경영에서 적용되는 임업이율의 일반적인 경제적 특성으로 옳은 것은?", "options": ["일반 상업은행의 상업이율보다 대체로 낮다", "단기 이율로서 변동성이 매우 크다", "인플레이션이 심할수록 실질이율이 급상승한다", "화폐이율보다 명목이율이 항상 낮다"], "answer": 0, "explain": "임업이율은 장기성, 안전성, 현물생장 등의 특성으로 인해 일반 상업이율(3~5%)보다 낮은 2~3% 수준\n쉬운 풀이: 임업은 투자 기간이 아주 길고, 나무 자체가 계속 자라는 '현물 생장'이 있으며, 비교적 안전한 투자라서 임업이율은 일반 은행 이율보다 낮게(2~3%) 잡아요.\n용어 풀이:\n· 임업이율: 산림 평가에 쓰는 이율\n· 상업이율: 은행 등에서 쓰는 이율\n· 현물생장: 나무 자체가 자라 가치가 늘어남", "ref": "산림경제학"}, {"id": "산림경영-59", "subject": "산림경영", "num": 59, "part": 4, "stem": "우리나라 산림경영계획에서 수목의 수령을 10년 단위로 묶어 표기하는 영급(Age class) 중 'IV영급'에 해당하는 임령 범위는?", "options": ["11~20년생", "21~30년생", "31~40년생", "41~50년생"], "answer": 2, "explain": "영급은 10년 단위: I(1~10), II(11~20), III(21~30), IV(31~40), V(41~50)\n쉬운 풀이: 영급은 나무 나이를 10년씩 묶은 거예요. Ⅰ영급 1~10년, Ⅱ 11~20년, Ⅲ 21~30년, Ⅳ 31~40년, Ⅴ 41~50년. 로마숫자 × 10이 그 영급의 마지막 나이라고 기억하면 쉬워요.\n용어 풀이:\n· 영급: 10년 단위 나이 등급\n· 임령: 숲의 나이\n· 수령: 나무의 나이", "ref": "산림자원조사지침"}, {"id": "산림경영-60", "subject": "산림경영", "num": 60, "part": 4, "stem": "산림경영계획을 수립하기 위해 산림을 구획할 때, 영구적인 경계(능선, 하천, 도로 등)를 기준으로 나누는 가장 큰 산림 구획 단위는?", "options": ["소반", "임반(Compartment)", "시업지", "표준지"], "answer": 1, "explain": "산림 구획에서 가장 큰 단위는 임반(Compartment), 그 하부 세분화 단위는 소반(Sub-compartment)\n쉬운 풀이: 산림을 관리 구역으로 나눌 때 가장 큰 단위가 임반이에요. 능선·하천·도로처럼 잘 안 바뀌는 경계로 100ha 내외로 나눠요. 임반 안을 수종·나이가 비슷한 곳끼리 다시 나눈 게 소반이에요.\n용어 풀이:\n· 임반(Compartment): 산림 구획의 큰 단위\n· 소반: 임반 안의 작은 구획\n· 고정 경계: 잘 변하지 않는 경계(능선·하천)", "ref": "산림경영계획"}, {"id": "산림경영-61", "subject": "산림경영", "num": 61, "part": 4, "stem": "특정 수종의 지위(산림의 입지 생산력)를 판정하기 위해 기준 연령(보통 30년생)에서 우세목의 평균 수고를 나타낸 지표는?", "options": ["수확표", "지위지수(Site index)", "형수", "임목축적도"], "answer": 1, "explain": "지위지수(Site index)는 기준임령(보통 30년생)에서 우세목의 수고로 해당 산지의 생산 잠재력을 판정\n쉬운 풀이: 지위지수는 기준 나이(보통 30년)에 우세목 평균 키가 몇 m인지로 땅의 생산력을 나타내요. 예를 들어 지위지수 16이면 30년생 우세목 평균 키가 16m라는 뜻이에요.\n용어 풀이:\n· 지위: 땅이 나무를 키우는 능력\n· 수확표: 나이별 재적 예상표\n· 임목축적도: 숲의 축적 정도", "ref": "산림측정학"}, {"id": "산림경영-62", "subject": "산림경영", "num": 62, "part": 4, "stem": "매목조사 시 직경 측정기구인 윤척(Caliper)의 사용 요령으로 옳지 **않은** 것은?", "options": ["윤척의 고정각과 유동각은 항상 자의 눈금대와 직각을 유지해야 한다", "타원형 나무는 최대 직경과 최소 직경을 각각 측정하여 평균한다", "경사지에서는 반드시 경사면 아래쪽에 서서 가슴높이를 잰다", "가슴높이 부위에 혹이나 가지가 있으면 그 바로 위나 아래를 잰다"], "answer": 2, "explain": "경사지에서 흉고직경을 측정할 때는 반드시 경사 위쪽(Higher side)에 서서 1.2m 위치를 측정\n쉬운 풀이: 경사진 곳에서 나무 가슴높이를 잴 때는 '위쪽'에 서서 1.2m를 재요. 아래쪽에 서면 땅이 낮아 실제보다 낮은 위치를 재게 되고, 밑동은 더 굵어서 직경이 크게 나와요. '경사지는 위에서'.\n용어 풀이:\n· 윤척 고정각·유동각: 윤척의 고정된 다리와 움직이는 다리\n· 경사지: 기울어진 땅", "ref": "산림조사요령"}, {"id": "산림경영-63", "subject": "산림경영", "num": 63, "part": 4, "stem": "산림경영의 지속성(보속성)을 검토하기 위해 일정 기간 동안의 벌채량과 임분의 생장량을 비교하는 수확조정 기법 중, 전 임분의 면적을 벌기령 연수만큼 똑같이 나누어 매년 균등한 면적을 벌채하도록 계획하는 방법은?", "options": ["면적평분법", "재적평분법", "이용률법", "생장량법"], "answer": 0, "explain": "면적평분법은 임분 면적을 윤벌기 연수로 나누어 매년 일정 면적을 윤번 벌채하는 가장 단순한 보속법\n쉬운 풀이: 면적평분법은 숲 전체 면적을 윤벌기 연수로 똑같이 나눠서 매년 같은 면적만 베는 방법이에요. 100ha 숲, 윤벌기 50년이면 매년 2ha씩 베는 식이에요. 가장 단순한 보속 수확법이에요.\n용어 풀이:\n· 면적평분법: 면적을 균등하게 나눠 벌채\n· 재적평분법: 재적을 균등하게 나눠 벌채\n· 윤벌기: 숲을 한 바퀴 다 베는 기간", "ref": "산림경영계획"}, {"id": "산림경영-64", "subject": "산림경영", "num": 64, "part": 4, "stem": "산림탄소상쇄제도에서 산주나 사업자가 흡수한 온실가스 감축량을 인증받아 배출권 거래시장에서 거래할 수 있는 사업 유형은?", "options": ["거래형 산림탄소상쇄사업", "비거래형 산림탄소상쇄사업", "사회공헌형 사업", "단순녹색사업"], "answer": 0, "explain": "탄소배출권 시장에서 현금 거래가 가능한 사업 유형은 거래형 산림탄소상쇄사업\n쉬운 풀이: 산림탄소상쇄사업은 숲이 흡수한 이산화탄소를 인정받는 제도예요. 그중 '거래형'은 인증받은 흡수량을 배출권 시장에서 돈을 받고 팔 수 있어요. 사회공헌형은 기업이 사회공헌으로 하는 것이라 거래가 안 돼요.\n용어 풀이:\n· 산림탄소상쇄: 숲의 탄소 흡수량을 인증해 배출량을 상쇄\n· 배출권: 온실가스를 배출할 수 있는 권리\n· 거래형: 시장 거래가 가능한 유형", "ref": "산림탄소상쇄제도"}, {"id": "산림경영-65", "subject": "산림경영", "num": 65, "part": 4, "stem": "임목수확 시 목재의 이용 목적 중 전신주, 비계목, 통나무집 건축용 등 특정 규격의 굵기와 형태에 도달했을 때 벌채하는 벌기령은?", "options": ["재적벌기령", "공예적 벌기령", "화폐수익최대 벌기령", "토지순수익최대 벌기령"], "answer": 1, "explain": "특정한 공예적 목적(가공 규격)에 도달하는 시기를 기준으로 정한 벌기를 공예적 벌기령이라 함\n쉬운 풀이: 벌기령은 목적에 따라 달라요. 전신주·비계목·통나무집처럼 '특정 굵기와 모양'이 필요한 용도에 맞춰 그 크기가 됐을 때 베는 게 공예적 벌기령이에요. 재적이 가장 많을 때는 재적벌기령, 돈이 가장 클 때는 화폐수익 최대 벌기령이에요.\n용어 풀이:\n· 공예적 벌기령: 특정 용도 규격에 맞는 시기\n· 비계목: 공사장 발판용 나무\n· 재적벌기령: 평균생장량이 최대인 시기", "ref": "산림경영학"}, {"id": "산림경영-66", "subject": "산림경영", "num": 66, "part": 4, "stem": "광학적 원리를 이용하여 서 있는 나무의 높은 위치의 직경을 지상에서 원격으로 측정할 수 있는 측정 기구는?", "options": ["휠러 오각주(Wheeler pentaprism)", "윤척", "와이제 테이프", "하이트미터"], "answer": 0, "explain": "Wheeler pentaprism은 지상에서 서 있는 나무 상부 임의 위치의 줄기 직경을 측정하는 광학기구\n쉬운 풀이: 휠러 오각주(펜타프리즘)는 땅에 서서 들여다보면 나무 높은 곳의 줄기 지름을 잴 수 있는 광학기구예요. 높은 곳까지 올라가지 않고도 위쪽 직경을 알 수 있어 재적 계산에 써요.\n용어 풀이:\n· 오각주(펜타프리즘): 빛을 꺾는 다섯 면 유리 기구\n· 원격 측정: 멀리서 재는 것", "ref": "산림측정학"}, {"id": "산림경영-67", "subject": "산림경영", "num": 67, "part": 4, "stem": "산림조합법상 산림조합의 일반 조합원이 될 수 있는 자격 기준으로 옳은 것은?", "options": ["주소지가 속한 구역에 3ha 이상의 산림을 소유한 자", "주소지가 속한 구역에 0.1ha(1,000㎡) 이상의 산림을 소유하거나 1년 중 90일 이상 임업에 종사하는 자", "주소지가 속한 구역에 10ha 이상의 산림을 소유한 임업후계자", "산림기사 자격증을 취득하고 1년 이상 경과한 자"], "answer": 1, "explain": "산림조합법상 조합원은 구역 내 산림 1,000㎡ 이상 소유자 또는 연간 90일 이상 임업 종사자\n쉬운 풀이: 산림조합 조합원이 되려면 조합 구역 안에 주소가 있고, 산림을 1,000㎡(0.1ha) 이상 갖고 있거나 1년에 90일 이상 임업 일을 해야 해요. 임업인 요건(3ha·90일)과 숫자가 다르니 주의하세요.\n용어 풀이:\n· 조합원: 조합에 가입한 구성원\n· 임업 종사: 임업 일을 하는 것\n· 0.1ha: 1,000㎡", "ref": "산림조합법"}, {"id": "산림경영-68", "subject": "산림경영", "num": 68, "part": 4, "stem": "산림 자산의 회계처리 시 심은 지 얼마 되지 않아 지속적으로 육림비가 투입되는 어린나무 숲(유령림)의 임목은 재무상태표에 어떤 자산으로 분류하는가?", "options": ["유동자산 (원자재)", "비유동자산 (투자자산 또는 생물자산)", "당좌자산", "이연부채"], "answer": 1, "explain": "유령림은 성숙하여 수익을 창출하기 전까지 장기 투자자산(생물자산)으로 회계 계상\n쉬운 풀이: 어린 숲의 나무는 아직 팔 수 없고 계속 돈이 들어가지만, 나중에 큰 수익을 낼 장기 자산이에요. 그래서 1년 안에 현금화되는 유동자산이 아니라 비유동자산(투자자산·생물자산)으로 분류해요.\n용어 풀이:\n· 비유동자산: 1년 이상 보유하는 장기 자산\n· 생물자산: 살아 있는 동식물 자산\n· 유령림: 어린 숲", "ref": "산림자산회계"}, {"id": "산림경영-69", "subject": "산림경영", "num": 69, "part": 4, "stem": "산림의 다원적 기능(공익기능) 중 숲이 빗물을 흡수·저장했다가 서서히 흘려보내 홍수와 가뭄을 완화하는 기능을 무엇이라 하는가?", "options": ["녹색댐 기능(수원함양 기능)", "대기정화 기능", "산림치유 기능", "생물다양성 보전 기능"], "answer": 0, "explain": "산림의 녹색댐 기능은 빗물을 저장하여 유출량을 조절하고 수질을 정화하는 수자원 함양 기능\n쉬운 풀이: 숲은 스펀지처럼 빗물을 머금었다가 천천히 흘려보내요. 그래서 큰비엔 홍수를 줄이고 가뭄엔 물을 공급해요. 댐 역할을 한다고 '녹색댐(수원함양) 기능'이라고 불러요.\n용어 풀이:\n· 녹색댐: 숲의 물 저장·조절 기능\n· 수원함양: 물을 저장해 공급하는 기능\n· 유출량: 흘러나가는 물의 양", "ref": "산림공학"}, {"id": "산림경영-70", "subject": "산림경영", "num": 70, "part": 4, "stem": "림분의 밀도를 정량적으로 나타내는 지표 중 수관이 지표면을 덮고 있는 비율을 나타내는 것은?", "options": ["입목도", "수관울폐도(Crown closure)", "지위지수", "형수"], "answer": 1, "explain": "임관(수관)이 하늘에서 보았을 때 지표면을 가리고 있는 비율을 수관울폐도(Crown closure)라 함\n쉬운 풀이: 하늘에서 내려다봤을 때 나무 윗부분(수관)이 땅을 얼마나 가리고 있는지를 수관울폐도라고 해요. 수관울폐도가 높으면 빽빽한 숲, 낮으면 성긴 숲이에요.\n용어 풀이:\n· 수관울폐도: 수관이 지표를 덮은 비율\n· 입목도: 이상적 밀도 대비 실제 밀도 비율\n· 수관: 나무의 잎·가지 덩어리", "ref": "산림측정학"}, {"id": "산림경영-71", "subject": "산림경영", "num": 71, "part": 4, "stem": "천연림이나 이령림(나이가 다른 숲)에서 지름이 작은 나무가 많고 굵은 나무로 갈수록 본수가 급격히 줄어드는 전형적인 직경분포 형태는?", "options": ["정규분포(대칭 종모양)", "역J자형(Negative exponential)", "직사각형 균등분포", "이항분포"], "answer": 1, "explain": "천연림·택벌림은 치수(어린나무)가 가장 많고 대경목으로
