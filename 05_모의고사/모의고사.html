급함", "ref": "p.210"}, {"id": "산림토목-40", "subject": "산림토목", "num": 40, "part": 2, "stem": "학습모듈 Manning 조도계수표에서 콘크리트 수로의 조도계수 범위는?", "options": ["0.012~0.017", "0.030~0.040", "0.075~0.150", "0.060~0.080"], "answer": 0, "explain": "목재 0.01~0.016, 콘크리트 0.012~0.017, 균일한 흙수로 0.017~0.025\n쉬운 풀이: 조도계수(n)는 수로 바닥이 얼마나 거친지예요. 매끄러울수록 작아요. 콘크리트 수로는 0.012~0.017로 작고, 흙수로는 0.017~0.025, 풀·돌이 많은 자연 하천은 더 커요.\n용어 풀이:\n· 조도계수: 수로 표면 거칠기를 나타내는 계수\n· 수로: 물이 흐르는 길", "ref": "p.206"}, {"id": "산림토목-41", "subject": "산림토목", "num": 41, "part": 3, "stem": "임도밀도의 단위로 옳은 것은?", "options": ["ha/km", "m/ha", "km/㎡", "㎥/ha"], "answer": 1, "explain": "임도밀도 = 임도연장(m) ÷ 산림면적(ha)\n쉬운 풀이: 임도밀도는 '숲 1ha에 임도가 몇 m 있나'예요. 임도 총 길이(m) ÷ 산림 면적(ha)이라 단위는 m/ha예요. 값이 클수록 길이 촘촘해 작업하기 편해요.\n용어 풀이:\n· 임도밀도: 산림 면적당 임도 길이\n· 임도연장: 임도의 총 길이", "ref": "산림공학"}, {"id": "산림토목-42", "subject": "산림토목", "num": 42, "part": 3, "stem": "적정 임도밀도를 정하는 기본 원리는?", "options": ["집재비와 임도개설·유지비의 합이 최소가 되는 밀도", "임도개설비가 최대가 되는 밀도", "집재거리가 최대가 되는 밀도", "산림면적과 관계없이 일정한 밀도"], "answer": 0, "explain": "임도 간격이 좁으면 개설비↑ 집재비↓ → 합계 최소점이 적정밀도\n쉬운 풀이: 임도를 촘촘히 내면 길 만드는 비용은 늘지만 나무를 길까지 끌어오는 비용(집재비)은 줄어요. 반대로 듬성하면 그 반대예요. 두 비용을 합친 총비용이 가장 작아지는 지점이 '적정 임도밀도'예요.\n용어 풀이:\n· 적정 임도밀도: 총비용이 최소가 되는 임도밀도\n· 집재비: 벤 나무를 모으는 비용\n· 개설비: 길을 새로 내는 비용", "ref": "산림공학"}, {"id": "산림토목-43", "subject": "산림토목", "num": 43, "part": 3, "stem": "1/25,000 지형도의 주곡선 간격은?", "options": ["5m", "10m", "20m", "50m"], "answer": 1, "explain": "1/25,000 주곡선 10m, 계곡선 50m (1/50,000은 주곡선 20m)\n쉬운 풀이: 등고선은 높이가 같은 점을 이은 선이에요. 1/25,000 지형도는 10m마다 가는 주곡선, 50m마다 굵은 계곡선을 그려요. 1/50,000 지도는 주곡선 20m예요.\n용어 풀이:\n· 주곡선: 기본 간격으로 그린 등고선\n· 계곡선: 주곡선 5개마다 굵게 그린 선\n· 지형도: 땅 모양을 나타낸 지도", "ref": "측량학"}, {"id": "산림토목-44", "subject": "산림토목", "num": 44, "part": 3, "stem": "토량환산계수 L의 뜻은?", "options": ["흐트러진 상태의 체적 ÷ 자연상태의 체적", "다져진 상태의 체적 ÷ 자연상태의 체적", "자연상태의 체적 ÷ 흐트러진 상태의 체적", "흙의 무게 ÷ 체적"], "answer": 0, "explain": "L = 흐트러진 체적 ÷ 자연 체적(1보다 큼), C = 다져진 체적 ÷ 자연 체적\n쉬운 풀이: 흙은 파내면 부풀어서 부피가 커져요. 토량환산계수 L은 '파낸(흐트러진) 흙 부피 ÷ 원래(자연) 부피'라 1보다 커요. 반대로 다지면 줄어서 C(다진 부피 ÷ 자연 부피)는 1보다 작아요.\n용어 풀이:\n· 토량환산계수: 흙 상태에 따른 부피 변화 비율\n· 흐트러진 상태: 파낸 상태\n· 다져진 상태: 눌러 다진 상태", "ref": "토질·토공"}, {"id": "산림토목-45", "subject": "산림토목", "num": 45, "part": 3, "stem": "비탈면 기울기를 '1 : 1.5'로 표시했을 때의 뜻은?", "options": ["수평 1에 수직 1.5", "수직 1에 수평 1.5", "경사각 1.5°", "경사 150%"], "answer": 1, "explain": "수직 1 : 수평 1.5 (모듈의 성토 1:1.2~2.0, 사방댐 1:0.3 등도 같은 표기)\n쉬운 풀이: 비탈 기울기 '1 : 1.5'는 높이 1을 올라가는 동안 옆으로 1.5만큼 나아간다는 뜻이에요. 앞 숫자가 수직, 뒤 숫자가 수평이에요. 뒤 숫자가 클수록 완만한 비탈이에요.\n용어 풀이:\n· 비탈면 기울기: 수직 : 수평 비율로 표시\n· 수직: 위아래 방향\n· 수평: 옆 방향", "ref": "산림공학"}, {"id": "산림토목-46", "subject": "산림토목", "num": 46, "part": 3, "stem": "콘크리트에서 물시멘트비를 높이면 일반적으로 어떻게 되는가?", "options": ["강도가 커진다", "강도와 무관하다", "강도가 작아진다", "경화 시간이 짧아진다"], "answer": 2, "explain": "물시멘트비가 클수록 강도·내구성 저하\n쉬운 풀이: 콘크리트에 물을 많이 넣으면(물시멘트비↑) 반죽은 쉽지만, 굳은 뒤 물이 빠진 자리에 구멍이 생겨 약해져요. 그래서 강도와 내구성이 떨어져요. 라면 물을 너무 많이 넣으면 싱거워지는 것처럼요.\n용어 풀이:\n· 물시멘트비: 물 무게 ÷ 시멘트 무게\n· 강도: 견디는 힘\n· 내구성: 오래 견디는 성질", "ref": "재료학"}, {"id": "산림토목-47", "subject": "산림토목", "num": 47, "part": 3, "stem": "기슭막이의 주된 목적은?", "options": ["계상의 종침식 방지", "계안(계곡 양쪽 기슭)의 횡침식 방지", "토사 저류", "유량 측정"], "answer": 1, "explain": "기슭막이 = 계안 보호(횡침식 방지)\n쉬운 풀이: 기슭막이는 계곡 양쪽 언덕(계안)이 물살에 옆으로 깎이는 것(횡침식)을 막으려고 물길과 나란히 쌓는 구조물이에요. 바닥이 깊게 파이는 걸(종침식) 막는 건 바닥막이예요.\n용어 풀이:\n· 기슭막이: 계안 보호 공작물\n· 계안: 계곡 양쪽 기슭\n· 횡침식: 옆으로 깎이는 침식", "ref": "사방공학"}, {"id": "산림토목-48", "subject": "산림토목", "num": 48, "part": 3, "stem": "바닥막이(골막이와 구분되는 계류 횡단공작물)의 주된 목적은?", "options": ["계상의 종침식을 막고 계상을 안정시킨다", "비탈면에 식생을 도입한다", "해안 모래 이동을 막는다", "노면 배수를 한다"], "answer": 0, "explain": "바닥막이 = 계상 고정·종침식 방지\n쉬운 풀이: 바닥막이는 계곡을 가로질러 낮게 설치해 계곡 바닥(계상)이 아래로 깊게 파이는 것(종침식)을 막고 바닥을 안정시켜요. '바닥막이=바닥, 기슭막이=옆'.\n용어 풀이:\n· 바닥막이: 계상 안정 공작물\n· 계상: 계곡 바닥\n· 종침식: 아래로 깎이는 침식", "ref": "사방공학"}, {"id": "산림토목-49", "subject": "산림토목", "num": 49, "part": 3, "stem": "계류에서 수제(水制)를 설치하는 목적은?", "options": ["비탈면 녹화", "산사태 감지", "토석류 포착", "유수 방향을 조절하고 유속을 줄여 계안을 보호"], "answer": 3, "explain": "수제 = 유수 방향 조절·유속 감소 → 계안 보호\n쉬운 풀이: 수제는 계곡 기슭에서 물 쪽으로 튀어나오게 만든 구조물이에요. 물길 방향을 바꾸고 물살을 느리게 해서 기슭이 깎이지 않게 보호해요.\n용어 풀이:\n· 수제: 물살 방향을 조절하는 돌출 구조물\n· 유수: 흐르는 물\n· 유속: 물 흐르는 속도", "ref": "사방공학"}, {"id": "산림토목-50", "subject": "산림토목", "num": 50, "part": 3, "stem": "해안사방에서 퇴사울(퇴사울타리)을 세우는 주된 목적은?", "options": ["해수 담수화", "방풍림을 벌채하기 위해", "날리는 모래를 퇴적시켜 사구(전사구)를 조성", "해안도로 배수"], "answer": 2, "explain": "퇴사울세우기로 모래를 쌓아 전사구 조성 → 이후 사초 심기·정사울 등\n쉬운 풀이: 바닷가에선 바람에 모래가 날려 내륙으로 들어와요. 퇴사울을 세우면 날리던 모래가 울타리 앞에 쌓여 모래언덕(전사구)이 만들어져요. 그 위에 모래풀(사초)을 심어 고정해요.\n용어 풀이:\n· 퇴사울: 모래를 쌓이게 하는 울타리\n· 사구: 바람에 쌓인 모래 언덕\n· 사초: 모래땅에 심는 풀", "ref": "사방공학"}, {"id": "산림토목-51", "subject": "산림토목", "num": 51, "part": 4, "stem": "산악지형에서 임도망을 배치할 때 능선을 따라 개설하는 능선임도(Ridge road)의 장점으로 옳은 것은?", "options": ["배수 처리가 용이하고 교량이나 암거 등 구조물 공사비가 적게 든다", "산 아래 골짜기의 집재 거리가 매우 짧아진다", "노폭을 넓히기 쉽고 곡선반경 확보가 항상 유리하다", "토공량이 사면임도에 비해 월등히 많이 든다"], "answer": 0, "explain": "능선임도는 계곡임도에 비해 집수면적이 작아 배수가 쉽고 암거·교량 등 배수구조물 공사비 절감\n쉬운 풀이: 능선임도는 산등성이를 따라 내는 길이라 빗물이 모이는 면적이 작아 배수가 쉽고, 계곡을 건너는 다리·배수관이 적게 들어 공사비가 줄어요. 대신 계곡 아래 나무를 끌어오는 거리는 길어져요.\n용어 풀이:\n· 능선임도: 능선을 따라 낸 임도\n· 집수면적: 빗물이 모이는 면적\n· 암거: 땅속 배수로", "ref": "임도공학"}, {"id": "산림토목-52", "subject": "산림토목", "num": 52, "part": 4, "stem": "임도 설계 시 자동차가 직선부에서 원곡선부로 진입할 때 원심력의 급격한 변화를 완화시켜 안전성을 높이기 위해 설치하는 완화곡선의 대표적인 곡선은?", "options": ["포물선", "클로소이드(Clothoid) 곡선", "쌍곡선", "타원곡선"], "answer": 1, "explain": "직선과 원곡선 사이에 완화구간으로 반경이 연속적으로 변하는 클로소이드(Clothoid) 곡선 적용\n쉬운 풀이: 직선에서 곡선으로 갑자기 바뀌면 원심력이 확 생겨 위험해요. 그래서 곡선 반지름이 점점 작아지는 클로소이드 곡선을 사이에 넣어 핸들을 천천히 돌리듯 부드럽게 이어요. 고속도로 나들목에도 쓰여요.\n용어 풀이:\n· 클로소이드: 반지름이 연속적으로 변하는 완화곡선\n· 원심력: 회전할 때 바깥으로 쏠리는 힘", "ref": "임도설계학"}, {"id": "산림토목-53", "subject": "산림토목", "num": 53, "part": 4, "stem": "임도 노면 아래에 매설하는 횡단배수관의 파손을 방지하기 위한 최소 토피(흙덮기 두께) 기준은?", "options": ["20cm 이상", "30cm 이상", "50cm 이상", "100cm 이상"], "answer": 2, "explain": "횡단배수관은 트럭 바퀴 하중에 의한 파손 방지를 위해 최소 토피 50cm 이상 확보 필수\n쉬운 풀이: 임도 밑에 묻은 배수관은 위로 트럭이 지나가면 눌려 깨질 수 있어요. 그래서 관 위에 흙을 최소 50cm 이상 덮어 무게를 분산시켜요.\n용어 풀이:\n· 토피: 매설물 위에 덮는 흙의 두께\n· 횡단배수관: 길 아래를 가로지르는 배수관", "ref": "임도시공규정"}, {"id": "산림토목-54", "subject": "산림토목", "num": 54, "part": 4, "stem": "임도의 종단기울기가 급변하는 변곡점에 주행 충격을 완화하기 위해 설치하는 종단곡선(Vertical curve)에 주로 적용되는 곡선은?", "options": ["단심원곡선", "2차 포물선", "클로소이드", "반향곡선"], "answer": 1, "explain": "종단곡선은 경사 변화에 따른 충격을 완화하기 위해 2차 포물선(Parabola) 적용\n쉬운 풀이: 길의 오르막·내리막이 바뀌는 지점(변곡점)에서 차가 덜컹거리지 않도록 세로 방향으로 부드럽게 이어 주는 게 종단곡선이에요. 보통 2차 포물선을 써요.\n용어 풀이:\n· 종단곡선: 경사가 바뀌는 곳을 잇는 세로 방향 곡선\n· 포물선: 공을 던졌을 때 그리는 곡선 모양", "ref": "도로공학"}, {"id": "산림토목-55", "subject": "산림토목", "num": 55, "part": 4, "stem": "흙깎기(절토) 비탈면에서 지하수 침투로 인해 원호 모양의 미끄럼면을 따라 사면 전체가 대규모로 쓸려 내려가는 붕괴 형태는?", "options": ["표주 붕괴", "원호 슬라이딩(Rotational slide)", "쐐기 파괴", "낙석"], "answer": 1, "explain": "점착력이 있는 점토질 비탈면이 지하수로 포화되어 원호면을 따라 미끄러지는 현상은 원호 슬라이딩\n쉬운 풀이: 점토질 비탈에 지하수가 스며들면 흙이 무거워지고 약해져서, 숟가락으로 떠낸 것처럼 둥근(원호) 미끄럼면을 따라 통째로 미끄러져 내려가요. 이걸 원호 슬라이딩이라고 해요.\n용어 풀이:\n· 원호 슬라이딩: 원호 모양 면을 따라 미끄러지는 붕괴\n· 절토 비탈면: 깎아 낸 비탈\n· 포화: 물로 가득 참", "ref": "사면안정학"}, {"id": "산림토목-56", "subject": "산림토목", "num": 56, "part": 4, "stem": "성토 구간에서 점성토(진흙질 흙)의 다짐에 가장 효과적인 토공 다짐 장비는?", "options": ["마카담 롤러", "탠덤 롤러", "탬핑 롤러(Sheepsfoot roller)", "진동 콤팩터"], "answer": 2, "explain": "탬핑 롤러(Sheepsfoot roller)는 돌기형 바퀴로 점성토의 깊은 층까지 전압하는 데 최적\n쉬운 풀이: 진흙(점성토)은 끈적하고 뭉쳐서 평평한 롤러로는 깊이 다져지지 않아요. 바퀴에 양 발굽 같은 돌기가 달린 탬핑 롤러(쉽스풋 롤러)가 흙에 박히며 깊은 곳까지 다져요.\n용어 풀이:\n· 탬핑 롤러: 돌기 달린 다짐 롤러\n· 점성토: 끈기 있는 진흙질 흙\n· 다짐: 흙을 눌러 단단하게 함", "ref": "토공기계학"}, {"id": "산림토목-57", "subject": "산림토목", "num": 57, "part": 4, "stem": "가선집재 장치 중 작업선(스카이라인)에 통나무를 매달고 양방향으로 윈치를 당겨 평지 및 완경사지에서 목재를 끌어모으는 연속식 집재 방식은?", "options": ["중력식 가선집재", "타일러(Tyler) 방식", "엔드리스 타일러(Endless Tyler) 방식", "러닝 스카이라인"], "answer": 2, "explain": "엔드리스 타일러는 순환 와이어로프를 이용해 평지나 완경사지에서 전후 양방향 견인이 가능한 방식\n쉬운 풀이: 엔드리스 타일러는 끝없이 도는 고리 모양 와이어로 통나무를 앞뒤 양방향으로 끌 수 있는 가선집재 방식이에요. 경사가 없는 평지·완경사지에서 쓰기 좋아요.\n용어 풀이:\n· 가선집재: 공중 케이블로 목재를 모으는 방법\n· 엔드리스: 끝없이 이어진(순환하는)\n· 스카이라인: 공중에 거는 주 케이블", "ref": "가선집재학"}, {"id": "산림토목-58", "subject": "산림토목", "num": 58, "part": 4, "stem": "동력사슬톱(체인소) 작업 시 킥백(Kick-back: 톱날 끝이 튀어 오르는 현상) 발생 시 작업자의 왼손 손등이 밀치면서 체인을 0.1초 내로 멈추게 하는 안전장치는?", "options": ["체인 캐처", "체인 브레이크(핸드가드 연동)", "스로틀 인터록", "방진 스프링"], "answer": 1, "explain": "킥백 시 왼손 손등이 전방 가드를 밀치면서 밴드 브레이크가 작동해 체인이 즉각 정지됨\n쉬운 풀이: 킥백은 톱날 끝이 나무에 걸려 톱이 작업자 얼굴 쪽으로 확 튀어 오르는 위험한 현상이에요. 이때 왼손 손등이 앞 손잡이 보호대를 밀면 체인 브레이크가 걸려 0.1초 안에 체인이 멈춰요.\n용어 풀이:\n· 킥백: 톱날이 튀어 오르는 반동\n· 체인 브레이크: 체인을 즉시 멈추는 장치\n· 핸드가드: 손 보호대", "ref": "임업기계안전"}, {"id": "산림토목-59", "subject": "산림토목", "num": 59, "part": 4, "stem": "사방댐이 계곡 상류에서 밀려 내려온 토사를 가두어 저사(貯砂) 기능을 수행한 후 최종적으로 안정화되는 계곡 바닥의 기울기를 무엇이라 하는가?", "options": ["원지반 기울기", "평형하상 기울기(퇴사 기울기)", "임계 경사", "수로 구배"], "answer": 1, "explain": "사방댐에 토사가 채워져 침식과 퇴적이 평형을 이루는 바닥 경사를 평형하상 기울기(퇴사기울기)라 함\n쉬운 풀이: 사방댐 뒤에 흙이 다 차면, 그 바닥은 더 깎이지도 쌓이지도 않는 안정된 경사가 돼요. 이걸 평형하상 기울기(퇴사 기울기)라고 해요. 원래 계곡보다 완만해져서 물살이 약해져요.\n용어 풀이:\n· 평형하상 기울기: 침식과 퇴적이 균형을 이룬 바닥 경사\n· 저사: 흙·모래를 가둠\n· 하상: 하천 바닥", "ref": "사방공학"}, {"id": "산림토목-60", "subject": "산림토목", "num": 60, "part": 4, "stem": "사방댐의 안정 조건을 계산할 때 댐체를 하류 쪽으로 밀어내거나 넘어뜨리려 하는 주된 외력(작용력)의 조합은?", "options": ["댐 자체 중량 + 기초 마찰력", "정수압 + 동수압(토사 충격력) + 토압", "지반 지지력 + 양압력", "저수량 + 침하력"], "answer": 1, "explain": "사방댐을 전도·활동시키는 외력은 상류의 정수압, 쇄도하는 토석류의 동수압, 퇴사 토압\n쉬운 풀이: 사방댐을 하류로 밀거나 넘어뜨리려는 힘은 위쪽 물이 누르는 정수압, 흙·돌이 밀려오며 부딪치는 동수압(충격력), 쌓인 흙이 미는 토압이에요. 댐 자체 무게와 바닥 마찰은 버티는 힘이에요.\n용어 풀이:\n· 정수압: 고인 물이 누르는 압력\n· 동수압: 흐르는 물·토사가 부딪치는 힘\n· 토압: 흙이 미는 압력", "ref": "사방구조역학"}, {"id": "산림토목-61", "subject": "산림토목", "num": 61, "part": 4, "stem": "황폐한 계곡 상류의 붕괴지나 계류 지류의 바닥 깎임을 막기 위해 설치하는 공작물로, 사방댐보다 규모가 작고 물받이 공작물을 생략할 수 있는 소규모 횡단 구조물은?", "options": ["골막이", "기슭막이", "수제", "바닥막이"], "answer": 0, "explain": "골막이는 사방댐보다 작은 규모로 계곡 상류 지류에 시공하며 물받이를 생략하는 경우가 많음\n쉬운 풀이: 골막이는 계곡 상류의 작은 지류에 만드는 사방댐의 '작은 버전'이에요. 규모가 작아 물받이를 생략하는 경우가 많아요. 큰 계곡엔 사방댐, 작은 골짜기엔 골막이.\n용어 풀이:\n· 골막이: 소규모 계곡 횡단 공작물\n· 물받이: 떨어지는 물에 바닥이 파이지 않게 하는 시설\n· 지류: 본류로 흘러드는 작은 물줄기", "ref": "사방공학"}, {"id": "산림토목-62", "subject": "산림토목", "num": 62, "part": 4, "stem": "계곡의 유속이 빠르고 거센 급류 구역에서 계안(계곡 양 언덕)의 기슭이 침식되어 무너지는 것을 방지하기 위해 계류 흐름과 평행하게 축조하는 공작물은?", "options": ["사방댐", "기슭막이(Revetment)", "골막이", "암거배수로"], "answer": 1, "explain": "기슭막이는 계곡 옆 언덕(계안)의 침식을 방지하기 위해 물길 방향과 나란히 축조하는 공작물\n쉬운 풀이: 기슭막이는 물살이 센 계곡에서 양쪽 언덕이 무너지지 않게 물길과 나란히 쌓는 구조물이에요. 강가 제방과 비슷한 역할이에요.\n용어 풀이:\n· 기슭막이(Revetment): 계안 보호 공작물\n· 급류: 빠르고 거센 물살\n· 축조: 쌓아 만듦", "ref": "계간사방공학"}, {"id": "산림토목-63", "subject": "산림토목", "num": 63, "part": 4, "stem": "산복사방에서 급경사 비탈면을 깎아내어 사면을 완만하게 만든 후 일정한 높이 간격으로 계단 모양의 참을 설치하는 공정은?", "options": ["단끊기(Bench terrace)", "떼심기", "편책공", "비탈다듬기"], "answer": 0, "explain": "비탈다듬기 후 계단 모양의 턱을 만드는 공정을 단끊기(Bench terrace)라 함\n쉬운 풀이: 산비탈을 복구할 때 먼저 비탈을 깎아 고르고(비탈다듬기), 일정 높이마다 계단 같은 턱(단)을 만들어요. 이 계단 만들기를 단끊기라고 해요. 계단 위에 나무·풀을 심어 녹화해요.\n용어 풀이:\n· 단끊기: 비탈에 계단 모양 턱을 만드는 공정\n· 산복사방: 산비탈의 사방사업\n· 참: 계단의 평평한 부분", "ref": "산복사방공학"}, {"id": "산림토목-64", "subject": "산림토목", "num": 64, "part": 4, "stem": "돌쌓기 공법 중 돌과 돌 사이에 시멘트 모르타르를 채워 넣어 수밀성과 일체 강도를 극대화하는 돌쌓기 방식은?", "options": ["메쌓기(Dry masonry)", "찰쌓기(Wet masonry)", "잡석쌓기", "야면석쌓기"], "answer": 1, "explain": "모르타르를 사용하여 일체화하는 것은 찰쌓기(Wet masonry), 물빠짐을 고려해 돌만 쌓는 것은 메쌓기\n쉬운 풀이: 돌만 쌓으면 메쌓기, 돌 사이에 시멘트 모르타르를 채워 붙이면 찰쌓기예요. 찰쌓기는 물이 새지 않고 튼튼하지만, 뒤에 물이 차면 압력이 생기니 물빠짐 구멍이 필요해요. '찰=찰지게 붙인다'.\n용어 풀이:\n· 찰쌓기: 모르타르로 붙여 쌓기\n· 메쌓기: 모르타르 없이 쌓기\n· 모르타르: 시멘트·모래·물 반죽", "ref": "토목시공학"}, {"id": "산림토목-65", "subject": "산림토목", "num": 65, "part": 4, "stem": "비탈면 녹화 공법 중 흙이 척박하거나 급경사인 비탈면에 흙, 부엽토, 풀씨, 비료를 넣은 자루를 계단 모양으로 쌓아 비탈 안정을 도모하는 공법은?", "options": ["떼붙임공법", "식생자루(새주머니) 공법", "종자뿜어붙이기", "짚덮기"], "answer": 1, "explain": "새주머니(식생자루) 공법은 흙자루에 종자를 넣어 급경사지에 계단식으로 축조하는 녹화공법\n쉬운 풀이: 흙이 거의 없거나 너무 가파른 비탈엔 씨앗을 뿌려도 쓸려가요. 그래서 흙·부엽토·풀씨·비료를 넣은 자루(식생자루, 새주머니)를 계단처럼 쌓아 그 자리에서 풀이 자라게 해요.\n용어 풀이:\n· 식생자루(새주머니): 흙과 씨앗을 넣은 자루\n· 부엽토: 낙엽이 썩어 된 흙\n· 녹화: 식물을 자라게 해 푸르게 함", "ref": "사면녹화학"}, {"id": "산림토목-66", "subject": "산림토목", "num": 66, "part": 4, "stem": "해안사방에서 해변 모래밭의 모래가 강풍에 날려 내륙으로 이동하는 것을 막고 모래언덕(사구)의 높이를 높여 고정하기 위해 설치하는 격자형 모래방패 울타리는?", "options": ["퇴사울타리(정사울타리)", "방조제", "방파제", "침사지"], "answer": 0, "explain": "해안사구의 모래 이동을 막고 퇴적을 유도하는 시설은 퇴사울타리(정사울타리)\n쉬운 풀이: 바닷가 모래가 바람에 날려 내륙으로 들어오지 못하게, 모래밭에 울타리를 세워 모래가 쌓이게 하고 모래언덕을 높여 고정해요. 이게 퇴사울타리(정사울타리)예요.\n용어 풀이:\n· 정사울타리: 사구 위 모래를 고정하는 울타리\n· 사구: 모래 언덕\n· 해안사방: 해안 모래 피해를 막는 사방", "ref": "해안사방학"}, {"id": "산림토목-67", "subject": "산림토목", "num": 67, "part": 4, "stem": "집중호우 시 상류 붕괴지에서 쏟아진 흙, 거대한 바위, 부러진 통나무가 빗물과 한 덩어리가 되어 맹렬한 속도로 계곡을 따라 쓸고 내려오는 자연재해 현상은?", "options": ["토석류(Debris flow)", "땅밀림", "지반침하", "동결융해"], "answer": 0, "explain": "물과 토사, 암석, 유목이 일체화되어 계곡을 고속으로 질주하는 현상은 토석류(Debris flow)\n쉬운 풀이: 토석류는 큰비에 무너진 흙·바위·쓰러진 나무가 물과 섞여 한 덩어리로 아주 빠르게 계곡을 쓸고 내려오는 재해예요. 파괴력이 커서 사방댐으로 막아요.\n용어 풀이:\n· 토석류(Debris flow): 흙·돌·물이 섞여 빠르게 흐르는 현상\n· 유목: 떠내려가는 나무\n· 땅밀림: 땅이 천천히 미끄러지는 현상", "ref": "산사태방재학"}, {"id": "산림토목-68", "subject": "산림토목", "num": 68, "part": 4, "stem": "사방댐 본체 중앙에 강재 격자형 빔(Slit)을 설치하여 평상시에는 물과 잔모래를 자연 방류하고, 산사태 발생 시에만 거목과 큰 암석을 선별 차단하는 친환경 사방댐은?", "options": ["콘크리트 중력식 사방댐", "슬릿(Slit) 사방댐(투과형 사방댐)", "석재 사방댐", "흙사방댐"], "answer": 1, "explain": "투과형 슬릿(Slit) 사방댐은 평상시 생태계 단절을 막고 토석류 발생 시 거목과 암석을 차단\n쉬운 풀이: 슬릿 사방댐은 가운데가 쇠기둥 격자로 뚫려 있어요. 평소엔 물과 작은 모래, 물고기가 자유롭게 지나가고, 토석류가 오면 큰 바위와 나무만 걸러서 막아요. 생태계를 덜 끊는 친환경 댐이에요.\n용어 풀이:\n· 슬릿 사방댐(투과형): 틈이 있어 물·잔모래가 통과하는 사방댐\n· 강재: 강철 재료\n· 선별 차단: 골라서 막음", "ref": "사방공학"}, {"id": "산림토목-69", "subject": "산림토목", "num": 69, "part": 4, "stem": "임도의 횡단면도 작성 시 표준적인 축척은?", "options": ["1:100", "1:500", "1:1,000", "1:5,000"], "answer": 0, "explain": "임도 횡단면도는 상세한 단면 확인을 위해 1:100 축척으로 제도\n쉬운 풀이: 횡단면도는 길을 가로로 잘라 본 단면 그림이에요. 깎고 쌓는 흙의 양을 정확히 계산해야 해서 1:100처럼 아주 자세한 축척으로 그려요.\n용어 풀이:\n· 횡단면도: 길을 가로로 자른 단면도\n· 축척: 실제 크기를 줄인 비율", "ref": "임도측량학"}, {"id": "산림토목-70", "subject": "산림토목", "num": 70, "part": 4, "stem": "산사태취약지역에 대한 실태조사를 실시해야 하는 주기는?", "options": ["6개월마다", "매년 1회 이상", "3년마다", "5년마다"], "answer": 3, "explain": "· 학습모듈(사방 p.21~22): 산림청장이 5년마다 산사태 발생우려지역 기초조사 → 지역산사태예방기관의 장이 그 결과에 따라 5년마다 실태조사\n· 2026.2.1부터 근거는 「산림재난방지법」 제21조(기초조사 5년마다, 필요 지역 실태조사)\n· 지정된 취약지역·대피소 현지점검은 연 2회 이상(제25조)\n· (2026.11 정정: 기존 정답 '매년 1회 이상'은 모듈·법령 근거가 없어 ④로 바로잡음)\n쉬운 풀이: 산림청장이 5년마다 산사태 우려 지역 기초조사를 하고, 그 결과에 따라 지역 기관이 5년마다 실태조사를 해요. 이미 지정된 취약지역·대피소 현장 점검은 1년에 2번 이상이에요. 기존 정답(매년 1회)은 근거가 없어 ④(5년)로 바로잡았어요.\n용어 풀이:\n· 산사태취약지역: 산사태 위험이 높아 지정한 지역\n· 실태조사: 실제 상태를 조사\n· 현지점검: 현장 확인", "ref": "사방 모듈 3-5-3, 산림재난방지법 제21·25조"}, {"id": "산림토목-71", "subject": "산림토목", "num": 71, "part": 4, "stem": "임도 노면 배수를 위한 횡단배수관의 유입구와 유출구에서 빗물에 의한 비탈면 세굴을 막고 물길을 모아주기 위해 배수관 양옆에 설치하는 콘크리트 구조물은?", "options": ["날개벽(Wing wall)", "소단", "길어깨", "방호책"], "answer": 0, "explain": "배수관 양옆에 'V'자나 사다리꼴로 날개벽을 달아주어야 빗물이 배수관 바깥으로 새어 비탈면을 깎아먹지 않습니다.\n쉬운 풀이: 배수관 입구·출구 양옆에 콘크리트 날개벽을 붙이면, 물이 관 옆으로 새지 않고 관 안으로 모여 들어가요. 그래야 관 주변 흙이 파이지 않아요.\n용어 풀이:\n· 날개벽(Wing wall): 배수관 양옆의 날개 모양 벽\n· 세굴: 물에 흙이 파임\n· 유입구·유출구: 물이 들어가고 나오는 구멍", "ref": "임도시공학"}, {"id": "산림토목-72", "subject": "산림토목", "num": 72, "part": 4, "stem": "사방댐 여수토(방수로)에서 홍수 시 통과하는 최대 유출량(Q)을 수리학적으로 계산할 때 사용하는 표준적인 사다리꼴 위어(Weir) 공식 형태는?", "options": ["Q = C · B · H^(3/2)", "Q = A · V^2", "Q = C · I · A", "Q = 2gH"], "answer": 0, "explain": "위어(Weir) 공식: 유출량(Q)은 수로 폭(B)과 수심의 1.5승(H^(3/2))에 유량계수(C)를 곱하여 산출합니다 (Q = C · B · H^(3/2)).\n쉬운 풀이: 물이 둑 위로 넘쳐흐를 때의 양은 위어 공식 Q = C × B × H^(3/2)로 구해요. 폭(B)이 넓을수록, 넘치는 물 높이(H)가 높을수록 많이 흘러요. H에 1.5제곱이 붙어 높이에 특히 민감해요.\n용어 풀이:\n· 위어(Weir): 물이 넘쳐흐르게 만든 둑\n· 유량계수(C): 실제 흐름을 보정하는 계수\n· 여수토: 넘치는 물을 흘려보내는 통로", "ref": "수리학 및 사방공학"}, {"id": "산림토목-73", "subject": "산림토목", "num": 73, "part": 4, "stem": "절토 비탈면의 암반에 균열이 심하여 대규모 암반 붕괴가 우려될 때 사면 깊숙이 강철 인장재를 천공 삽입하고 시멘트 밀크로 그라우팅하여 인장력을 가하는 공법은?", "options": ["그라운드 앵커(Ground anchor) 공법", "떼심기공법", "비탈덮기공법", "파종공"], "answer": 0, "explain": "영구 그라운드 앵커는 깊은 암반까지 쇠줄을 박아 프리스트레스를 주어 사면을 강하게 압착 고정합니다.\n쉬운 풀이: 금이 많은 암반 비탈은 크게 무너질 수 있어요. 그라운드 앵커는 비탈 깊숙이 구멍을 뚫고 강철선을 넣어 시멘트로 고정한 뒤 잡아당겨, 바위를 안쪽으로 꽉 눌러 묶어 두는 공법이에요.\n용어 풀이:\n· 그라운드 앵커: 땅속 깊이 고정한 인장재로 비탈을 잡아 주는 공법\n· 그라우팅: 시멘트 반죽을 주입\n· 인장력: 잡아당기는 힘", "ref": "사면안정공학"}, {"id": "산림토목-74", "subject": "산림토목", "num": 74, "part": 4, "stem": "가선집재 시 무거운 통나무를 공중에 지탱하는 주 와이어로프(주삭, Skyline)의 안전율(파단하중 ÷ 최대장력) 기준으로 옳은 것은?", "options": ["1.0 이상", "1.5 이상", "2.7 이상", "10 이상"], "answer": 2, "explain": "집재기계 안전기준상 주삭(스카이라인)은 안전율 2.7 이상, 예인삭 및 작업선은 안전율 4 이상을 확보해야 합니다.\n쉬운 풀이: 가선집재에서 통나무를 공중에 매다는 주 케이블(주삭)은 끊어지면 대형 사고라서, 끊어지는 힘이 실제 걸리는 힘의 2.7배 이상이어야 해요. 끄는 줄(예인삭)은 4배 이상이에요.\n용어 풀이:\n· 안전율: 파단하중 ÷ 최대장력\n· 주삭(Skyline): 공중에 거는 주 케이블\n· 파단하중: 끊어지는 무게", "ref": "임업기계학"}, {"id": "산림토목-75", "subject": "산림토목", "num": 75, "part": 4, "stem": "지하수위가 높아 붕괴 위험이 있는 절토 비탈면 내부에 구멍을 뚫고 타공 PVC 유공관을 수평으로 삽입하여 물을 빼내는 배수 시설은?", "options": ["수평배수공(Subsurface horizontal drain)", "산마루측구", "종단측구", "집수정"], "answer": 0, "explain": "사면 속의 물을 직접 빼내어 간극수압을 낮추는 시설을 수평배수공(수평 유공관)이라 합니다.\n쉬운 풀이: 비탈 속에 물이 차면 흙 알갱이 사이 압력(간극수압)이 높아져 무너지기 쉬워요. 그래서 비탈에 수평으로 구멍을 뚫고 구멍 뚫린 PVC관을 꽂아 속의 물을 빼내요. 이게 수평배수공이에요.\n용어 풀이:\n· 수평배수공: 비탈 속 물을 빼는 수평 배수관\n· 유공관: 구멍이 뚫린 관\n· 간극수압: 흙 알갱이 사이 물의 압력", "ref": "사면배수공학"}, {"id": "산림토목-76", "subject": "산림토목", "num": 76, "part": 4, "stem": "임도 노선 측량 시 능선이나 계곡을 따라 주어진 종단경사(예: 8%)를 유지하면서 지표면과 만나는 점들을 연결한 계획 가상선은?", "options": ["영선(Zero line)", "중심선", "지적선", "등고선"], "answer": 0, "explain": "절토나 성토가 전혀 발생하지 않는 계획 경사의 지표면 교차선을 '영선(Zero line)'이라 하며 노선 배치의 기준이 됩니다.\n쉬운 풀이: 임도 노선을 잡을 때 '8% 경사로 계속 가면 땅과 어디서 만나나'를 이은 가상의 선이 영선이에요. 이 선을 따라가면 흙을 깎지도 쌓지도 않아도 돼서, 노선 배치의 기준이 돼요.\n용어 풀이:\n· 영선(Zero line): 절토·성토가 없는 계획 경사선\n· 노선 측량: 길의 위치를 정하는 측량", "ref": "임도측량학"}, {"id": "산림토목-77", "subject": "산림토목", "num": 77, "part": 4, "stem": "유역면적 A(km²), 유출계수 C, 강우강도 I(mm/hr)일 때 사방댐 설계를 위한 최대홍수유출량 Q(m³/s)를 구하는 합리식(Rational formula)은?", "options": ["Q = 0.2778 · C · I · A", "Q = C · I / A", "Q = A · I^2", "Q = 100 · C · I"], "answer": 0, "explain": "수문학에서 소유역 홍수량 산정에 가장 널리 쓰이는 합리식 공식은 Q = 0.2778 · C · I · A (또는 Q = 1/3.6 · C · I · A, 단위: m³/s)입니다.\n쉬운 풀이: 합리식은 단위에 따라 모양이 달라요. 면적을 km²로 쓰면 Q = 0.2778 × C × I × A(= C·I·A ÷ 3.6), ha로 쓰면 Q = C·I·A ÷ 360이에요. 둘 다 같은 공식이고 단위만 다른 거예요.\n용어 풀이:\n· 합리식: 최대홍수량 공식\n· km²: 제곱킬로미터(=100ha) / mm\n· hr: 시간당 강우량", "ref": "수문학 사방공학"}, {"id": "산림토목-78", "subject": "산림토목", "num": 78, "part": 4, "stem": "사방댐 콘크리트 타설 시 하루에 전부 치지 못하고 이어칠 때 발생하는 시공이음(Construction joint) 사이로 물이 새는 것을 방지하기 위해 이음부에 매설하는 자재는?", "options": ["수밀 지수판(Water stop)", "철조망", "비닐 테이프", "자갈"], "answer": 0, "explain": "콘크리트 타설 이음면에는 고무나 구리 재질의 '지수판(Water stop)'을 끼워 넣어 누수를 완벽 차단합니다.\n쉬운 풀이: 콘크리트를 하루에 다 못 부으면 이어 붓는 경계(시공이음)가 생기고, 그 틈으로 물이 샐 수 있어요. 그래서 고무나 구리로 된 지수판(Water stop)을 이음면에 끼워 물길을 막아요.\n용어 풀이:\n· 지수판(Water stop): 이음부 누수를 막는 판\n· 시공이음: 나눠 시공할 때 생기는 이음\n· 타설: 콘크리트를 부어 넣음", "ref": "토목시공학"}, {"id": "산림토목-79", "subject": "산림토목", "num": 79, "part": 4, "stem": "높이가 높은 절토 비탈면에서 사면의 안정을 유지하고 점검 통로를 확보하기 위해 비탈면 높이 5m마다 설치하는 수평 계단 턱의 명칭은?", "options": ["소단(Berm)", "노견", "암거", "측구"], "answer": 0, "explain": "가파른 절개지 사면 높이 5m(또는 10m)마다 폭 1~1.5m의 수평 턱(소단, Berm)을 두어 비탈 안정과 배수를 돕습니다.\n쉬운 풀이: 높은 절개 비탈은 5m 정도마다 폭 1~1.5m의 수평 턱(소단)을 만들어요. 비탈을 안정시키고, 물을 모아 빼고, 점검하는 사람이 다닐 통로도 돼요.\n용어 풀이:\n· 소단(Berm): 비탈 중간의 수평 턱\n· 절토: 땅을 깎음\n· 노견: 길어깨", "ref": "토목설계기준"}, {"id": "산림토목-80", "subject": "산림토목", "num": 80, "part": 4, "stem": "산림경관을 해치지 않고 중차량의 통행 하중을 지탱하기 위해 깬 자갈(쇄석)을 맞물려 다진 후 석분을 채워 전압하는 전통적 임도 노면 공법은?", "options": ["쇄석 머캐덤(Macadam) 공법", "아스팔트 콘크리트 포장", "고무 매트 포장", "잔디 포장"], "answer": 0, "explain": "머캐덤(Macadam) 공법은 쇄석의 물림과 다짐을 이용한 친환경 비포장 임도 쇄석부설 공법입니다.\n쉬운 풀이: 머캐덤 공법은 깬 자갈(쇄석)을 깔고 서로 맞물리게 다진 뒤 돌가루로 틈을 채워 단단하게 만드는 전통 도로 공법이에요. 아스팔트 없이도 무거운 차를 견디고 경관을 덜 해쳐요.\n용어 풀이:\n· 쇄석: 깨뜨린 자갈\n· 머캐덤(Macadam): 쇄석을 다져 만드는 노면 공법\n· 전압: 롤러로 눌러 다짐", "ref": "임도공학"}, {"id": "산림토목-81", "subject": "산림토목", "num": 81, "part": 4, "stem": "임도 노선 측량 시 기준점 간의 각도와 거리를 순차적으로 측정하여 노선의 뼈대를 형성하는 골격 측량법은?", "options": ["트래버스 측량(다각 측량)", "수준 측량", "평판 측량", "항공 측량"], "answer": 0, "explain": "임도 설계의 골격은 다각 측량(Traverse survey)을 통해 각 측점의 평면 좌표(X, Y)와 방위각을 결정하는 중심선 측량으로 이루어집니다.\n쉬운 풀이: 트래버스(다각) 측량은 기준점에서 다음 점까지 각도와 거리를 차례로 재며 꺾은선처럼 이어 가는 측량이에요. 이걸로 임도 노선의 뼈대(중심선 좌표)를 잡아요. 높이를 재는 건 수준측량이에요.\n용어 풀이:\n· 트래버스(다각) 측량: 각도·거리를 연속 측정해 골격을 잡는 측량\n· 수준측량: 높낮이를 재는 측량\n· 방위각: 북쪽 기준 방향 각도", "ref": "임도측량학"}, {"id": "산림토목-82", "subject": "산림토목", "num": 82, "part": 4, "stem": "산림청 「임도설치 및 관리 등에 관한 규정」상 간선임도의 설계속도 기준 범위는?", "options": ["시속 40~20km", "시속 80~60km", "시속 100km 이상", "시속 10km 이하"], "answer": 0, "explain": "설계속도는 간선임도 시속 40~20km, 지선임도 시속 30~20km, 작업임도 시속 20km 이하로 규정되어 있습니다.\n쉬운 풀이: 임도 설계속도는 간선임도 시속 40~20km, 지선임도 30~20km, 작업임도 20km 이하예요. 산길이라 일반 도로보다 훨씬 느려요.\n용어 풀이:\n· 설계속도: 설계 기준 차량 속도\n· 지선임도: 간선에서 갈라진 임도", "ref": "임도시설규정 별표"}, {"id": "산림토목-83", "subject": "산림토목", "num": 83, "part": 4, "stem": "임도의 종단기울기가 변하는 변곡점에서 차량 주행 시 운전자의 시거(Sight distance)를 확보하고 충격을 완화하기 위해 설치하는 종단곡선(Vertical curve)의 형태는?", "options": ["포물선(Parabola)", "원호", "사이클로이드", "하이퍼볼라"], "answer": 0, "explain": "종단곡선은 종단경사의 변화율을 일정하게 유지하기 위해 2차 포물선(Parabola) 곡선으로 설계 및 시공합니다.\n쉬운 풀이: 오르막에서 내리막으로 바뀌는 고개 꼭대기에선 앞이 안 보이고 차가 덜컹거려요. 종단곡선을 포물선 모양으로 부드럽게 이어 주면 시야(시거)도 확보되고 충격도 줄어요.\n용어 풀이:\n· 시거: 운전자가 앞을 볼 수 있는 거리\n· 종단곡선: 세로 방향 경사 변화를 잇는 곡선\n· 포물선: 2차 곡선", "ref": "도로공학 및 임도설계"}, {"id": "산림토목-84", "subject": "산림토목", "num": 84, "part": 4, "stem": "노상 흙의 지지력을 현장에서 직접 평가하기 위해 표준 원형 하중판(지름 30cm)에 하중을 가하여 침하량을 측정하는 지반 시험법은?", "options": ["평판재하시험(PBT, Plate bearing test)", "다짐 시험", "소성한계 시험", "비중계 시험"], "answer": 0, "explain": "평판재하시험(PBT)은 노상 지지력계수(K값)를 측정하는 시험이며, 도로 포장 설계 시 CBR 시험과 함께 가장 기본이 되는 현장 시험입니다.\n쉬운 풀이: 평판재하시험은 지름 30cm 둥근 철판을 땅에 놓고 무게를 올려 얼마나 가라앉는지 재는 현장 시험이에요. 덜 가라앉을수록 땅이 튼튼해 길을 받칠 수 있어요.\n용어 풀이:\n· 평판재하시험(PBT): 하중판으로 지지력을 재는 시험\n· 침하량: 가라앉은 양\n· 지지력: 땅이 무게를 견디는 힘", "ref": "토질역학 및 도로공학"}, {"id": "산림토목-85", "subject": "산림토목", "num": 85, "part": 4, "stem": "토공사에서 절토량과 성토량의 균형을 계획하고 토사의 합리적인 운반 거리와 방향을 결정하기 위해 작성하는 토량 곡선은?", "options": ["유토곡선(토적곡선, Mass curve)", "S-곡선", "하이드로그래프", "입도분포곡선"], "answer": 0, "explain": "유토곡선(Mass curve)은 측점별 절·성토 토량을 누적하여 도식화한 곡선으로, 절토와 성토의 균형점, 토취장 및 사토장의 위치, 덤프트럭의 평균 운반거리를 산출하는 데 활용됩니다.\n쉬운 풀이: 유토곡선은 길을 따라 깎은 흙과 쌓을 흙의 양을 차례로 더해 그린 그래프예요. 어디서 흙을 깎아 어디로 옮길지, 얼마나 멀리 운반할지 계획할 때 써요.\n용어 풀이:\n· 유토곡선(Mass curve): 누적 토량 곡선\n· 토취장: 흙을 가져오는 곳\n· 사토장: 남는 흙을 버리는 곳", "ref": "토목시공학 토공론"}, {"id": "산림토목-86", "subject": "산림토목", "num": 86, "part": 4, "stem": "절토 비탈면의 붕괴를 방지하기 위해 콘크리트 격자틀을 사면에 설치하고 격자 내부에 흙을 채운 뒤 식생을 도입하는 사면 보호공법은?", "options": ["격자블록공(콘크리트 격자틀공)", "떼붙이기공", "편책공", "돌망태공"], "answer": 0, "explain": "콘크리트 격자블록공은 사면의 표층 붕괴를 격자틀의 자중과 앵커로 억제하고, 내부 공간에 녹화를 유도하는 구조적+식생적 복합 사면안정 공법입니다.\n쉬운 풀이: 격자블록공은 비탈에 콘크리트 격자(바둑판) 틀을 깔고 칸마다 흙을 채워 풀·나무를 심는 공법이에요. 틀이 흙을 붙잡아 주고, 식물이 자라면 더 단단해져요.\n용어 풀이:\n· 격자블록공: 콘크리트 격자틀 사면 보호공\n· 표층 붕괴: 겉흙이 무너지는 것\n· 녹화: 식물을 자라게 함", "ref": "사면안정공학"}, {"id": "산림토목-87", "subject": "산림토목", "num": 87, "part": 4, "stem": "계곡의 종침식(바닥 깎임)을 방지하고 계상(계곡 바닥)의 종단 물매를 완만하게 안정시키기 위해 계류를 횡단하여 설치하는 높이 2m 이하의 소규모 공작물은?", "options": ["바닥막이(Bed sill)", "사방댐", "도수구", "소단"], "answer": 0, "explain": "바닥막이는 사방댐에 비해 규모가 작고(보통 높이 1.5~2.0m 내외) 저사 기능보다는 계상 바닥의 파임(세굴)을 막아 물길 경사를 안정시키는 것이 주된 목적입니다.\n쉬운 풀이: 바닥막이는 높이 2m 이하의 낮은 구조물로 계곡을 가로질러 설치해요. 흙을 가두는 것보다 계곡 바닥이 깊게 파이지 않게 경사를 안정시키는 게 목적이에요.\n용어 풀이:\n· 바닥막이(Bed sill): 계상 안정용 소규모 횡단 공작물\n· 물매: 경사\n· 세굴: 물에 파임", "ref": "계간사방공학"}, {"id": "산림토목-88", "subject": "산림토목", "num": 88, "part": 4, "stem": "사방댐 상류에 유출된 토사 중 물과 잔모래는 하류로 자연 유하시키고, 위험한 거목(유목)과 대형 암석(전석)만을 선별 포착하여 하류의 피해를 막는 사방댐 형식은?", "options": ["강재 슬릿(Slit) 사방댐(투과형 사방댐)", "중력식 콘크리트 사방댐", "흙사방댐", "석재 사방댐"], "answer": 0, "explain": "투과형 사방댐(슬릿댐, 버트리스댐)은 본체에 틈(Slit)이 있어 평상시 계류 생태계의 연속성을 보장하고, 토석류 발생 시 유목과 큰 돌만을 걸러내는 친환경 사방 구조물입니다.\n쉬운 풀이: 투과형(슬릿) 사방댐은 쇠기둥 사이 틈으로 물과 잔모래는 흘려보내고, 큰 나무(유목)와 바위(전석)만 걸러 막아요. 평소 물고기 이동도 막지 않는 친환경 댐이에요.\n용어 풀이:\n· 투과형 사방댐: 틈이 있어 물이 통과하는 댐\n· 유목: 떠내려오는 나무\n· 전석: 큰 돌", "ref": "사방공학"}, {"id": "산림토목-89", "subject": "산림토목", "num": 89, "part": 4, "stem": "산사태(Landslide)와 토석류(Debris flow)의 역학적 특성 차이로 옳은 것은?", "options": ["산사태는 수분을 전혀 포함하지 않는다.", "토석류는 물과 흙, 자갈, 거목이 반유체 상태로 뒤섞여 계곡을 따라 빠른 속도로 유하하는 현상이다.", "산사태가 토석류보다 이동 속도가 훨씬 빠르다.", "토석류는 반드시 평지에서만 발생한다."], "answer": 1, "explain": "산사태는 사면의 흙덩어리가 미끄럼면을 따라 블록 형태로 활동하는 것이며, 토석류는 산사태 물질이 계곡의 급류와 섞여 진흙-암석 혼합 유체로 시속 20~40km 이상의 맹렬한 속도로 쏟아져 내리는 현상입니다.\n쉬운 풀이: 산사태는 비탈의 흙덩어리가 미끄럼면을 따라 통째로 미끄러지는 것이고, 토석류는 그 흙이 계곡물과 섞여 죽처럼 된 상태로 시속 20~40km 이상 빠르게 흘러내리는 거예요.\n용어 풀이:\n· 산사태: 비탈 흙이 미끄러져 무너짐\n· 토석류: 흙·돌·물이 섞여 흐름\n· 반유체: 액체와 고체 중간 상태", "ref": "산사태방재공학"}, {"id": "산림토목-90", "subject": "산림토목", "num": 90, "part": 4, "stem": "비탈면의 흙이 흘러내리는 것을 막기 위해 비탈을 계단 모양으로 깎고 말뚝을 박은 후 싸리나무나 잡목 가지를 엮어 흙을 받쳐주는 전통적 산비탈 공종은?", "options": ["산비탈 바자얽기(편책공, Hurdle work)", "사방댐", "콘크리트 옹벽", "낙석방지망"], "answer": 0, "explain": "바자얽기(편책공)는 말뚝 사이에 나뭇가지나 바자(편책)를 엮어 계단 턱을 지탱하고 토사를 억류하여 식생 활착을 돕는 친환경 전통 사방공종입니다.\n쉬운 풀이: 바자얽기(편책공)는 비탈에 말뚝을 박고 싸리나 잡목 가지를 바구니 짜듯 엮어 흙을 받쳐 주는 전통 사방 방법이에요. 흙이 멈추면 그 자리에 식물이 자리 잡아요.\n용어 풀이:\n· 바자얽기(편책공): 말뚝과 가지로 엮어 흙을 막는 공법\n· 바자: 싸리·갈대로 엮은 울타리", "ref": "산복사방공학"}, {"id": "산림토목-91", "subject": "산림토목", "num": 91, "part": 4, "stem": "암반 절토 비탈면이나 척박한 토사 비탈면에 종자, 비료, 양생제, 침식방지제, 유기물 피복재를 물과 섞어 압축공기로 사면에 고압 살포하는 녹화 공법은?", "options": ["하이드로시딩(취부공, Hydro-seeding)", "묘목 줄심기", "잔디 뗏장 붙이기", "객토공"], "answer": 0, "explain": "종비토 취부공(하이드로시딩)은 사람의 손이 닿기 힘든 급경사 비탈면에 기계를 이용해 녹화 재료를 일시에 살포 부착시키는 현대 사면녹화의 대표 공법입니다.\n쉬운 풀이: 하이드로시딩은 씨앗·비료·접착제·섬유질을 물에 섞어 기계로 비탈에 뿜어 붙이는 공법이에요. 사람이 올라가기 힘든 가파른 바위 비탈도 한 번에 녹화할 수 있어요.\n용어 풀이:\n· 하이드로시딩(종비토 취부공): 종자 혼합물을 뿜어 붙이는 녹화공법\n· 취부: 뿜어서 붙임\n· 양생제: 굳는 동안 보호하는 재료", "ref": "비탈면녹화공학"}, {"id": "산림토목-92", "subject": "산림토목", "num": 92, "part": 4, "stem": "임도 배수시설 중 노면의 종단경사가 급할수록 횡단배수관의 설치 간격을 어떻게 조정해야 하는가?", "options": ["경사가 급할수록 배수관 간격을 좁혀 자주 설치한다.", "경사가 급할수록 배수관 간격을 넓힌다.", "경사와 무관하게 1km마다 설치한다.", "배수관을 아예 설치하지 않는다."], "answer": 0, "explain": "종단기울기가 급할수록 유속이 빨라져 노면 세굴이 심해지므로, 빗물이 노면에 오래 머물지 않도록 횡단배수관의 설치 간격을 더 좁게(자주) 배치해야 합니다.\n쉬운 풀이: 길이 가파를수록 빗물이 빨리 흘러 길을 더 많이 깎아요. 그래서 물이 길게 흐르지 않도록 횡단배수관을 더 촘촘히(간격을 좁게) 설치해야 해요.\n용어 풀이:\n· 횡단배수관: 길을 가로질러 물을 빼는 관\n· 노면 세굴: 길 표면이 물에 깎임", "ref": "임도시공학"}, {"id": "산림토목-93", "subject": "산림토목", "num": 93, "part": 4, "stem": "사방댐 여수토를 넘어 쏟아져 내리는 월류 낙하수의 강한 충격 에너지로 인해 댐 하류 밑바닥이 파이는 현상을 방지하기 위해 댐 하류 바닥에 설치하는 콘크리트 슬래브 구조물은?", "options": ["물받이(Apron)", "측벽", "방파제", "날개벽"], "answer": 0, "explain": "물받이(Apron)는 낙하수의 낙차 에너지를 감세(완충)시켜 댐 기초와 하류 하상의 국부 세굴을 방지하기 위해 댐 직하류에 까는 두꺼운 바닥 콘크리트 구조물입니다.\n쉬운 풀이: 사방댐 위로 넘친 물이 떨어지면 폭포처럼 바닥을 세게 때려 파내요. 그래서 댐 바로 아래 바닥에 두꺼운 콘크리트 판(물받이)을 깔아 충격을 받아 내요.\n용어 풀이:\n· 물받이(Apron): 댐 하류 바닥 보호 콘크리트\n· 월류: 넘쳐흐름\n· 감세: 세기를 줄임", "ref": "사방공학 댐설계"}, {"id": "산림토목-94", "subject": "산림토목", "num": 94, "part": 4, "stem": "콘크리트 사방댐 시공 시 시멘트의 수화열로 인한 내부 온도 상승과 수축 균열을 방지하기 위한 시공 대책으로 가장 옳은 것은?", "options": ["조강 포틀랜드 시멘트를 사용한다.", "중용열 또는 저열 포틀랜드 시멘트를 사용하고 타설 블록의 높이를 적절히 분할한다.", "물시멘트비를 80% 이상으로 대폭 높인다.", "한여름 대낮에 일시에 연속 타설한다."], "answer": 1, "explain": "매스 콘크리트 구조물인 사방댐은 수화열 균열을 막기 위해 발열량이 적은 중용열·저열 시멘트나 플라이애시를 사용하고, 리프트(층고)를 나누어 타설합니다.\n쉬운 풀이: 시멘트는 굳으면서 열(수화열)을 내요. 사방댐처럼 큰 콘크리트 덩어리는 속이 뜨거워졌다 식으며 금이 가요. 그래서 열이 적게 나는 중용열·저열 시멘트를 쓰고, 한 번에 다 붓지 않고 층을 나눠 부어요.\n용어 풀이:\n· 수화열: 시멘트가 물과 반응할 때 나는 열\n· 매스 콘크리트: 크고 두꺼운 콘크리트\n· 중용열 시멘트: 열이 적게 나는 시멘트", "ref": "토목재료학 및 콘크리트공학"}, {"id": "산림토목-95", "subject": "산림토목", "num": 95, "part": 4, "stem": "중력식 사방댐의 안정 계산 시 댐 저면(바닥)을 통해 침투하는 물이 댐체를 위로 떠받치려 작용하여 전도 및 활동에 불리하게 작용하는 외력은?", "options": ["양압력(부력, Uplift pressure)", "정수압", "동수압", "토압"], "answer": 0, "explain": "양압력(Uplift pressure)은 댐체 밑바닥을 통해 상류에서 하류로 침투하는 물의 간극수압으로 인해 댐체를 위로 밀어올리는 힘이며, 댐의 유효 자중을 감소시켜 전도 및 활동 안전율을 떨어뜨립니다.\n쉬운 풀이: 댐 바닥 밑으로 스며든 물이 댐을 위로 밀어 올리는 힘이 양압력이에요. 댐이 가벼워지는 효과가 생겨 넘어지거나 미끄러지기 쉬워지니 안정 계산에 꼭 넣어요.\n용어 풀이:\n· 양압력(Uplift): 바닥 아래 물이 위로 미는 힘\n· 부력: 물에 뜨게 하는 힘\n· 유효 자중: 실제 작용하는 자기 무게", "ref": "수리학 및 사방공학"}, {"id": "산림토목-96", "subject": "산림토목", "num": 96, "part": 4, "stem": "임도 절토 비탈면 내부의 높은 지하수위를 낮추어 사면 붕괴를 예방하기 위해 도랑을 파고 자갈과 유공관을 묻어 물을 배출시키는 지하 배수구는?", "options": ["맹암거(French drain, 암거 배수구)", "산마루측구", "횡단측구", "집수정"], "answer": 0, "explain": "맹암거는 지하수나 침투수가 많은 지반 내부에 부직포, 유공관, 자갈을 매설하여 겉으로 드러나지 않게 지하수를 모아 집수정으로 안전하게 배제하는 시설입니다.\n쉬운 풀이: 맹암거는 땅을 파고 자갈·구멍 뚫린 관을 묻어, 겉으로 안 보이게 땅속 물을 모아 빼는 배수로예요. 비탈 속 지하수위를 낮춰 붕괴를 막아요.\n용어 풀이:\n· 맹암거: 자갈과 유공관을 묻은 지하 배수구\n· 지하수위: 땅속 물의 높이\n· 부직포: 흙이 막지 않게 거르는 천", "ref": "도로배수공학"}, {"id": "산림토목-97", "subject": "산림토목", "num": 97, "part": 4, "stem": "산불 진화 차량의 원활한 통행과 진화 작용을 위해 개설되는 산불진화임도의 유효 노폭 기준은?", "options": ["2.0m 이상", "3.5m 이상", "6.0m 이상", "10m 이상"], "answer": 1, "explain": "산불진화임도는 대형 산불 진화차량 및 소방차의 진입과 상호 교행을 위해 기본 노폭을 3.5m 이상으로 확보하도록 규정되어 있습니다.\n쉬운 풀이: 산불진화임도는 소방차가 들어가고 서로 비켜 갈 수 있게 노폭을 3.5m 이상으로 해요. 일반 간선임도(3m)보다 넓어요.\n용어 풀이:\n· 노폭: 길의 폭\n· 교행: 서로 비켜 지나감", "ref": "산림자원법 임도설계기준"}, {"id": "산림토목-98", "subject": "산림토목", "num": 98, "part": 4, "stem": "산지전용 후 절토 비탈면의 수직 높이가 얼마 이상일 때마다 폭 1m 이상의 소단(Berm)을 설치하여야 하는가?", "options": ["매 2m마다", "매 5m마다", "매 15m마다", "매 30m마다"], "answer": 1, "explain": "산지관리법 시행규칙 [별표 6] 산지전용허가 기준상 절토 비탈면의 수직높이가 5m 이상인 경우에는 5m마다 폭 1m 이상의 소단(Berm)을 설치해야 합니다.\n쉬운 풀이: 산을 깎아 개발하면 높은 절개 비탈이 생겨요. 산지관리법은 비탈 높이가 5m 이상이면 5m마다 폭 1m 이상의 소단(수평 턱)을 만들어 무너지지 않게 하라고 정해요.\n용어 풀이:\n· 소단(Berm): 비탈 중간의 수평 턱\n· 산지전용: 산지를 다른 용도로 바꿈\n· 절토 비탈면: 깎은 비탈", "ref": "산지관리법 시행규칙"}, {"id": "산림토목-99", "subject": "산림토목", "num": 99, "part": 4, "stem": "토공사에서 굴착기와 덤프트럭의 조합 작업 시 토사 운반거리가 약 50m 이하의 초단거리일 때 가장 경제성이 높은 장비는?", "options": ["불도저(Bulldozer)", "덤프트럭", "타워크레인", "지게차"], "answer": 0, "explain": "불도저는 블레이드로 흙을 밀어서 운반하므로 경제적인 굴토·운반거리가 통상 50m(최대 70m) 이내이며, 그 이상의 중장거리 운반은 굴착기-덤프트럭 조합이 유리합니다.\n쉬운 풀이: 불도저는 앞날(블레이드)로 흙을 밀어 옮기는 장비라 50m 이내의 짧은 거리에서 가장 경제적이에요. 더 멀리 옮길 땐 굴착기로 퍼서 덤프트럭으로 나르는 게 나아요.\n용어 풀이:\n· 불도저: 블레이드로 흙을 밀어내는 장비\n· 블레이드: 앞쪽의 넓은 철판 날\n· 운반거리: 흙을 옮기는 거리", "ref": "건설기계학 및 토공시공학"}, {"id": "산림토목-100", "subject": "산림토목", "num": 100, "part": 4, "stem": "해안 모래언덕(사구) 배후에 조성하는 해안방풍림의 대표적인 조림 수종으로 염분과 강풍에 견디는 힘이 가장 우수한 수종은?", "options": ["곰솔(해송)", "삼나무", "자작나무", "버드나무"], "answer": 0, "explain": "곰솔(해송, Pinus thunbergii)은 바닷바람의 염분(조풍)과 건조한 모래땅에 대한 내성이 극히 강하여 우리나라 해안 방풍·방사림의 가장 대표적인 조림 수종입니다.\n쉬운 풀이: 바닷가 방풍림에는 곰솔(해송)을 가장 많이 심어요. 짠 바닷바람(조풍)과 건조한 모래땅에 아주 강해서 바닷가 소나무 숲의 대부분이 곰솔이에요.\n용어 풀이:\n· 곰솔(해송): 바닷가에 강한 소나무류\n· 방풍림: 바람을 막는 숲\n· 조풍: 소금기 있는 바닷바람", "ref": "해안사방공학"}, {"id": "산림토목-101", "subject": "산림토목", "num": 101, "part": 5, "stem": "산림자원법 시행규칙 [별표 2]상 **산불진화임도**의 대피소 설치기준으로 옳은 것은?", "options": ["간격 300m 내외, 너비 5m 이상, 유효길이 15m 이상", "간격 200m 내외, 너비 6m 이상, 유효길이 15m 이상", "간격 500m 내외, 너비 7m 이상, 유효길이 20m 이상", "간격 100m 내외, 너비 4m 이상, 유효길이 10m 이상"], "answer": 1, "explain": "· 산불진화임도: 200m · 6m · 15m\n· 간선임도: 300m · 5m · 15m\n· 산불진화임도의 정차·작업장(500m 내외, 너비 7m)은 대피소를 대신할 수 있음\n쉬운 풀이: 산불진화임도는 소방차가 자주 비켜 서야 하니 대피소를 더 자주(200m), 더 넓게(6m) 만들어요. 일반 간선임도는 300m·5m예요. 유효길이는 둘 다 15m예요.\n용어 풀이:\n· 대피소: 차가 비켜 서는 공간\n· 유효길이: 실제 쓸 수 있는 길이", "ref": "산림자원법 시행규칙 [별표 2] 3호"}, {"id": "산림토목-102", "subject": "산림토목", "num": 102, "part": 5, "stem": "산불진화임도에 설치하는 **정차·작업장**의 기준은?", "options": ["간격 200m 내외, 너비 5m 이상", "간격 300m 내외, 너비 6m 이상", "간격 500m 내외, 너비 7m 이상", "간격 1km 내외, 너비 10m 이상"], "answer": 2, "explain": "· [별표 2] 3호 차목: 정차·작업장 500m 내외\n· 7m 이상\n· 차돌림곳 너비 10m 이상\n· 취수장·내화수림대 조성\n쉬운 풀이: 산불진화임도에는 진화 장비를 세우고 작업할 넓은 공간(정차·작업장)을 500m 내외마다 너비 7m 이상으로 만들어요. 차를 돌릴 곳은 너비 10m 이상이에요.\n용어 풀이:\n· 정차·작업장: 차량을 세우고 작업하는 공간\n· 차돌림곳: 차를 돌리는 공간\n· 취수장: 물을 뜨는 곳", "ref": "산림자원법 시행규칙 [별표 2] 3호"}, {"id": "산림토목-103", "subject": "산림토목", "num": 103, "part": 5, "stem": "작업임도의 시설기준으로 옳지 **않은** 것은?", "options": ["속도기준은 20km/h 이하", "유효너비는 2.5~3m 기준, 배향곡선지는 6m 이상", "종단기울기는 최대 20% 범위에서 조정", "합성기울기는 최대 12% 이하"], "answer": 3, "explain": "· [별표 2] 4호: 작업임도 합성기울기 최대 20% 이하\n· 길어깨 50cm 내외\n· 횡단기울기 외향 3~5%\n· 간선임도 합성기울기 12%(불가피 15%, 포장 18%)와 구분\n쉬운 풀이: 작업임도는 저규격 길이라 기준이 느슨해요. 속도 20km/h 이하, 너비 2.5~3m, 종단기울기 최대 20%, 그리고 종단·횡단을 합친 합성기울기도 최대 20%예요. 12%는 간선임도 기준이라 틀렸어요.\n용어 풀이:\n· 합성기울기: 종단·횡단 기울기를 합친 실제 경사\n· 작업임도: 산림작업용 저규격 임도", "ref": "산림자원법 시행규칙 [별표 2] 4호"}, {"id": "산림토목-104", "subject": "산림토목", "num": 104, "part": 5, "stem": "임도 배수구(횡단배수관)의 지름 기준은? (현지여건상 필요한 경우 제외)", "options": ["600mm 이상", "800mm 이상", "1,000mm 이상", "1,200mm 이상"], "answer": 2, "explain": "· [별표 2]: 1,000mm 이상, 필요 시 800mm 이상\n· 통수단면은 최대홍수유출량의 2배 이상\n· 홍수량: 최근 100년 빈도 확률강우량 또는 최근 5년 극한호우 강우강도로 합리식 계산\n쉬운 풀이: 임도 횡단배수관은 지름 1,000mm 이상이 원칙(필요하면 800mm)이에요. 물이 지나는 단면은 최대 홍수량의 2배 이상이어야 하고, 홍수량은 100년 빈도 강우 등을 합리식으로 계산해요.\n용어 풀이:\n· 통수단면: 물이 지나는 단면적\n· 100년 빈도: 100년에 한 번 올 정도의 큰비", "ref": "산림자원법 시행규칙 [별표 2]"}, {"id": "산림토목-105", "subject": "산림토목", "num": 105, "part": 5, "stem": "사방사업 설계·시공 기준상 설계홍수량은 계산된 최대홍수유출량의 몇 배 이상으로 하는가?", "options": ["1.0배", "1.2배", "1.5배", "2.0배"], "answer": 1, "explain": "· 설계홍수량 1.2배 이상\n· 사방댐 등 횡공작물의 방수로는 2.0~5.0배(급류지역 그 이상)\n쉬운 풀이: 사방사업 설계 때는 계산한 최대 홍수량에 여유를 둬서 1.2배 이상으로 잡아요. 사방댐 방수로는 더 넉넉하게 2.0~5.0배로 해요.\n용어 풀이:\n· 설계홍수량: 설계에 쓰는 홍수량\n· 횡공작물: 계곡을 가로지르는 구조물", "ref": "사방사업법 시행규칙 [별표] 사방사업의 설계·시공 기준 1호 다목"}, {"id": "산림토목-106", "subject": "산림토목", "num": 106, "part": 5, "stem": "사방사업 설계 시 평면도의 축척은?", "options": ["1/500", "1/1,200", "1/5,000", "1/25,000"], "answer": 1, "explain": "· 평면도 1/1,200\n· 종단면도 고저 1/100·거리 1/500\n· 횡단면도 1/100\n· 공작물도 1/100 원칙\n쉬운 풀이: 사방사업 설계도 축척: 평면도 1/1,200, 종단면도 높이 1/100·거리 1/500, 횡단면도·공작물도 1/100이에요. 평면도는 넓은 범위를 보니 축척이 작아요.\n용어 풀이:\n· 평면도: 위에서 내려다본 도면\n· 종단면도: 길이 방향 단면도\n· 공작물도: 구조물 상세도", "ref": "사방사업법 시행규칙 [별표] 사방사업의 설계·시공 기준 1호 다목"}, {"id": "산림토목-107", "subject": "산림토목", "num": 107, "part": 5, "stem": "사방사업의 실제 면적을 산출하는 기준은?", "options": ["수평거리와 평면적", "사거리와 사면적", "도상거리와 투영면적", "등고선 간격과 경사도"], "answer": 1, "explain": "· 도상면적 = 수평거리·평면적\n· 실제면적 = 사거리·사면적\n쉬운 풀이: 지도 위 면적(도상면적)은 수평으로 잰 것이라 실제 비탈의 넓이보다 작아요. 실제 공사 면적은 비탈을 따라 잰 사거리·사면적으로 계산해요.\n용어 풀이:\n· 사거리: 비탈을 따라 잰 거리\n· 사면적: 비탈면 자체의 넓이\n· 도상면적: 지도 위 면적", "ref": "사방사업법 시행규칙 [별표] 사방사업의 설계·시공 기준 1호 나목"}, {"id": "산림토목-108", "subject": "산림토목", "num": 108, "part": 5, "stem": "상시 물이 흐르고 어류 등이 서식하는 계류에서 사방사업을 할 때 설치해야 하는 것은?", "options": ["물넘이포장", "생태통로(어류 이동통로)", "속도랑", "돌수로"], "answer": 1, "explain": "시공기준 2호 라목: 어류 등의 이동이 가능하도록 생태통로 설치\n쉬운 풀이: 물고기가 사는 계곡에 사방댐을 막아 버리면 물고기가 오르내리지 못해요. 그래서 상시 물이 흐르고 어류가 사는 계류엔 생태통로(어도)를 만들어야 해요.\n용어 풀이:\n· 생태통로(어도): 물고기 등이 이동할 수 있는 길\n· 계류: 계곡에 흐르는 물", "ref": "사방사업법 시행규칙 [별표] 사방사업의 설계·시공 기준 2호"}, {"id": "산림토목-109", "subject": "산림토목", "num": 109, "part": 5, "stem": "임도설치 및 관리 등에 관한 규정상 시장·군수·구청장이 임도 노선별 노면·절성토면·시설물 상태를 점검하는 횟수는?", "options": ["매년 1회 이상", "매년 2회 이상", "분기 1회 이상", "2년마다 1회"], "answer": 1, "explain": "· 제26조①: 매년 2회 이상 점검 후 보수\n· 산림청장·시도지사·지방산림청장은 매년 점검·평가(제18조)\n쉬운 풀이: 임도는 비·눈으로 쉽게 상하니까, 시장·군수·구청장이 노선별로 노면·비탈·시설물 상태를 매년 2회 이상 점검하고 보수해요.\n용어 풀이:\n· 점검: 상태를 살펴봄\n· 보수: 고쳐서 손봄\n· 절성토면: 깎거나 쌓은 비탈면", "ref": "임도설치 및 관리 등에 관한 규정(산림청훈령 제1737호) 제26조"}, {"id": "산림토목-110", "subject": "산림토목", "num": 110, "part": 5, "stem": "임도에 국가지점번호판을 설치하는 간격 기준은?", "options": ["100m마다", "300m마다", "500m마다", "1km마다"], "answer": 2, "explain": "제26조⑤: 갈림길 이정표 + 국가지점번호판 500m마다(필요 시 조정)\n쉬운 풀이: 산에서 사고가 나면 위치를 알리기 어려워요. 그래서 임도에 500m마다 국가지점번호판을 붙여, 그 번호로 구조대에 정확한 위치를 알릴 수 있게 해요.\n용어 풀이:\n· 국가지점번호: 전 국토를 격자로 나눈 위치 번호\n· 이정표: 길 안내 표지", "ref": "임도설치 및 관리 등에 관한 규정(산림청훈령 제1737호) 제26조"}, {"id": "산림토목-111", "subject": "산림토목", "num": 111, "part": 5, "stem": "임도 타당성평가 평가위원(교수·기술특급·고급·환경단체) 위촉 기준으로 옳은 것은?", "options": ["2명 이상, 위촉기간 1년 이내", "4명 이상, 위촉기간 2년 이내", "5명 이상, 위촉기간 3년 이내", "7명 이상, 위촉기간 4년 이내"], "answer": 1, "explain": "· 제7조③: 4명 이상, 2년 이내\n· 지역주민대표는 지역별 1명 이상 일시 위촉\n쉬운 풀이: 임도를 낼지 심사하는 타당성평가위원은 교수·기술 전문가·환경단체 등에서 4명 이상 위촉하고, 위촉 기간은 2년 이내예요. 지역주민 대표도 지역별로 1명 이상 넣어요.\n용어 풀이:\n· 위촉: 일을 맡김\n· 평가위원: 평가하는 위원", "ref": "임도설치 및 관리 등에 관한 규정(산림청훈령 제1737호) 제7조"}, {"id": "산림토목-112", "subject": "산림토목", "num": 112, "part": 5, "stem": "임도노선이 계곡을 지나는 경우의 설계 기준은?", "options": ["최대 홍수위와 같은 높이", "최대 홍수위보다 1.2배 높은 위치", "최대 홍수위보다 2배 이상 높은 위치", "계곡 바닥에 세월교만 설치"], "answer": 2, "explain": "· 임도 규정: 계곡 단면·유역 유수량을 고려해 최대 홍수위보다 2배 이상 높은 위치에 시설\n· 설치계획은 5년 단위, 총 길이 2km 미만 단거리 계획은 지양\n쉬운 풀이: 계곡을 지나는 임도는 큰물이 나도 잠기지 않도록 최대 홍수위보다 2배 이상 높은 위치에 만들어요. 그리고 2km도 안 되는 짧은 임도 계획은 지양해요.\n용어 풀이:\n· 최대 홍수위: 가장 큰 홍수 때 물 높이\n· 지양: 피함", "ref": "임도설치 및 관리 등에 관한 규정(산림청훈령 제1737호)"}]}, {"code": "06", "name": "임산가공", "kind": "선택", "questions": [{"id": "임산가공-1", "subject": "임산가공", "num": 1, "part": 1, "stem": "원목 규격 고시상 소나무류 특용재급의 지름 기준은?", "options": ["270mm 이상", "300mm 이상", "360mm 이상", "420mm 이상"], "answer": 3, "explain": "소나무류 특용재급 420mm 이상, 재장 2.1m 이상\n쉬운 풀이: 원목은 굵기와 길이로 등급을 매겨요. 소나무류 중 가장 좋은 특용재급은 지름 420mm(42cm) 이상, 길이(재장) 2.1m 이상이에요. 특용재는 한옥 기둥처럼 특별한 용도로 쓰는 굵은 나무예요.\n용어 풀이:\n· 특용재급: 가장 굵고 좋은 원목 등급\n· 재장: 원목의 길이\n· mm: 밀리미터(10mm = 1cm)", "ref": "모듈 p.9"}, {"id": "임산가공-2", "subject": "임산가공", "num": 2, "part": 1, "stem": "낙엽송류 1등급 원목의 기준은?", "options": ["지름 210mm 이상, 재장 2.1m 이상", "지름 240mm 이상, 재장 3.6m 이상", "지름 270mm 이상, 재장 3.6m 이상", "지름 360mm 이상, 재장 2.1m 이상"], "answer": 1, "explain": "낙엽송류 1등급 240mm·3.6m (특용재급 360mm·2.1m)\n쉬운 풀이: 낙엽송류 1등급은 지름 240mm 이상, 길이 3.6m 이상이에요. 특용재급은 360mm·2.1m예요. 수종마다 기준 지름이 다르니 표로 정리해서 외우세요.\n용어 풀이:\n· 1등급: 원목 품질 등급 중 하나\n· 낙엽송류: 일본잎갈나무 등", "ref": "p.9"}, {"id": "임산가공-3", "subject": "임산가공", "num": 3, "part": 1, "stem": "원목 결점 측정에서 죽은옹이의 지름은?", "options": ["실측 긴지름", "실측 긴지름의 1.5배", "실측 긴지름의 2배", "실측 짧은지름의 2배"], "answer": 2, "explain": "죽은옹이·썩은옹이는 실측 긴지름의 2배\n쉬운 풀이: 죽은옹이와 썩은옹이는 목재 질을 크게 떨어뜨리니, 실제 잰 긴지름의 2배로 계산해 더 엄하게 평가해요. 살아 있는 옹이(산옹이)보다 나쁜 결점이라는 뜻이에요.\n용어 풀이:\n· 죽은옹이: 죽은 가지가 박혀 생긴 옹이(잘 빠짐)\n· 산옹이: 살아 있던 가지의 옹이(단단히 붙음)\n· 결점: 목재 품질을 떨어뜨리는 부분", "ref": "p.10"}, {"id": "임산가공-4", "subject": "임산가공", "num": 4, "part": 1, "stem": "산옹이·죽은옹이·썩은옹이 없이 숨은옹이만 있는 경우 숨은옹이의 크기는? (돌출·함몰부 긴지름이 그보다 작을 때)", "options": ["100mm", "150mm", "200mm", "실측 긴지름의 1.5배"], "answer": 0, "explain": "숨은옹이만 있으면 100mm\n쉬운 풀이: 숨은옹이는 겉으로는 안 보이지만 껍질 아래 볼록하거나 오목한 흔적으로 알 수 있는 옹이예요. 다른 옹이 없이 숨은옹이만 있으면 그 크기를 100mm로 정해서 평가해요.\n용어 풀이:\n· 숨은옹이: 표면에 드러나지 않은 옹이\n· 돌출·함몰부: 튀어나오거나 들어간 부분", "ref": "p.10"}, {"id": "임산가공-5", "subject": "임산가공", "num": 5, "part": 1, "stem": "원목이 두 번 이상 굽은 경우 굽음 높이는?", "options": ["가장 큰 굽음 높이", "각 굽음 높이 합계의 1.5배", "각 굽음 높이 합계의 2배", "각 굽음 높이의 평균"], "answer": 1, "explain": "각 굽음 높이를 합해 1.5배\n쉬운 풀이: 원목이 한 번만 굽으면 그 높이를 재지만, 두 번 이상 굽으면 사용하기 더 나쁘니 각 굽음 높이를 다 더한 뒤 1.5배로 계산해요.\n용어 풀이:\n· 굽음: 원목이 휘어진 결점\n· 굽음 높이: 휜 정도를 높이로 잰 값", "ref": "p.10"}, {"id": "임산가공-6", "subject": "임산가공", "num": 6, "part": 1, "stem": "제재목 중 판재의 정의는?", "options": ["두께 75mm 이상, 너비가 두께의 2배 이상", "두께와 너비가 모두 75mm 이상", "두께 50mm 미만, 너비가 두께의 3배 이상", "두께 75mm 미만, 너비가 두께의 4배 이상"], "answer": 3, "explain": "판재 = 두께 75mm 미만 + 너비 ≥ 두께 × 4\n쉬운 풀이: 판재는 얇고 넓은 판이에요. 두께 75mm 미만이면서 너비가 두께의 4배 이상이어야 해요. 두께와 너비가 비슷하면 각재예요.\n용어 풀이:\n· 제재목: 원목을 켜서 만든 목재\n· 판재: 얇고 넓은 목재\n· 각재: 두께와 너비가 비슷한 목재", "ref": "p.12"}, {"id": "임산가공-7", "subject": "임산가공", "num": 7, "part": 1, "stem": "규격 구조재의 두께 기준은?", "options": ["38mm 이상 114mm 미만", "24mm 이상 75mm 미만", "50mm 이상 150mm 미만", "114mm 이상"], "answer": 0, "explain": "규격 구조재 두께 38~114mm 미만, 너비 52mm 이상\n쉬운 풀이: 규격 구조재는 집을 짓는 데 쓰는 정해진 크기의 목재로, 두께 38mm 이상 114mm 미만, 너비 52mm 이상이에요. 목조주택의 2×4 같은 목재가 여기 해당해요.\n용어 풀이:\n· 규격 구조재: 건축 구조용 표준 규격 목재\n· 구조재: 건물을 지탱하는 목재", "ref": "p.12–13"}, {"id": "임산가공-8", "subject": "임산가공", "num": 8, "part": 1, "stem": "제재수율에 대한 설명으로 옳은 것은?", "options": ["원목 지름이 클수록 낮고 길이가 길수록 높다", "원목 지름과 길이에 관계없이 일정하다", "원목 지름이 클수록 높고 길이가 길수록 낮다", "원목 지름이 작을수록 높고 길이가 짧을수록 낮다"], "answer": 2, "explain": "지름 클수록 높고 길이 길수록 낮다\n쉬운 풀이: 제재수율은 원목에서 실제로 얻는 제재목 비율이에요. 원목이 굵을수록 버리는 부분(껍질·둥근 가장자리) 비율이 줄어 수율이 높고, 길수록 끝이 가늘어지는 영향(초살)이 커서 수율이 낮아요.\n용어 풀이:\n· 제재수율: 원목 대비 얻은 제재목 비율\n· 초살: 원목이 끝으로 갈수록 가늘어짐", "ref": "p.12–30"}, {"id": "임산가공-9", "subject": "임산가공", "num": 9, "part": 1, "stem": "정목(곧은결)제재의 특징은?", "options": ["수율이 높고 값이 싸다", "품질이 좋지만 수율이 낮다", "건조 중 뒤틀리기 쉽다", "작업 능률이 가장 높다"], "answer": 1, "explain": "· 정목제재는 품질 좋고 수율 낮음\n· ①③④는 판목(널결)제재 특징\n쉬운 풀이: 정목(곧은결) 제재는 나이테와 직각 방향으로 켜서 줄무늬가 곧게 나와요. 뒤틀림이 적고 품질이 좋지만, 켜는 방법이 까다로워 버려지는 부분이 많아 수율이 낮아요. 널결(판목)은 그 반대예요.\n용어 풀이:\n· 정목(곧은결): 나이테에 수직으로 켠 결\n· 판목(널결): 나이테에 접선 방향으로 켠 결\n· 수율: 얻는 비율", "ref": "p.12–30"}, {"id": "임산가공-10", "subject": "임산가공", "num": 10, "part": 1, "stem": "구조용재의 함수율 표시 KD15의 뜻은?", "options": ["함수율 15% 이상 생재", "15일 동안 천연건조한 목재", "건조 후 15% 수축한 목재", "함수율 15% 이하 건조재"], "answer": 3, "explain": "KD12·KD15·KD19 = 각각 함수율 12·15·19% 이하\n쉬운 풀이: KD는 Kiln Dried(인공건조)의 약자이고 뒤 숫자는 최대 함수율이에요. KD15는 함수율 15% 이하로 말린 목재라는 뜻이에요. KD12면 12% 이하로 더 바짝 말린 거예요.\n용어 풀이:\n· KD(Kiln Dried): 건조실에서 인공 건조한 목재\n· 함수율: 목재 속 물 무게 ÷ 마른 목재 무게", "ref": "부속서1"}, {"id": "임산가공-11", "subject": "임산가공", "num": 11, "part": 1, "stem": "수종과 초기함수율은 같고 두께가 서로 다른 재목을 함께 건조할 때 적용할 건조스케줄은?", "options": ["가장 두꺼운 재목의 스케줄", "가장 얇은 재목의 스케줄", "평균 두께 재목의 스케줄", "가장 강한 스케줄"], "answer": 0, "explain": "두께가 다르면 가장 두꺼운 재목\n쉬운 풀이: 두께가 다른 목재를 함께 말릴 때는 가장 두꺼운 것에 맞춰야 해요. 두꺼운 건 속까지 마르는 데 오래 걸리고, 얇은 것 기준으로 세게 말리면 두꺼운 건 갈라지기 때문이에요.\n용어 풀이:\n· 건조스케줄: 건조 단계별 온도·습도 계획\n· 초기함수율: 건조 시작 때 함수율", "ref": "p.67"}, {"id": "임산가공-12", "subject": "임산가공", "num": 12, "part": 1, "stem": "두께는 같고 수종과 초기함수율이 다른 재목을 함께 건조할 때 적용할 스케줄은?", "options": ["가장 강한 스케줄", "가장 함수율이 낮은 재목의 스케줄", "해당 스케줄 중 가장 건조조건이 약한 스케줄", "가장 많은 수종의 스케줄"], "answer": 2, "explain": "수종·초기함수율이 다르면 가장 약한 스케줄\n쉬운 풀이: 수종이나 처음 물 함량이 다른 목재를 함께 말릴 때는 그중 가장 '약한'(순한) 조건의 스케줄을 써요. 가장 약한 목재가 갈라지지 않게 맞춰야 전체가 안전해요.\n용어 풀이:\n· 건조조건: 온도·습도 등 건조 환경\n· 약한 스케줄: 천천히 순하게 말리는 계획", "ref": "p.67"}, {"id": "임산가공-13", "subject": "임산가공", "num": 13, "part": 1, "stem": "건조실 1기에 50㎥ 이하 건조재를 넣을 때 배치하는 시험재 수는 보통 몇 개인가?", "options": ["2개", "4개", "6개", "10~12개"], "answer": 1, "explain": "50㎥ 이하 4개, 250㎥ 10~12개\n쉬운 풀이: 건조 중에 얼마나 말랐는지 확인하려고 시험재(샘플)를 넣어요. 건조실에 50㎥ 이하를 넣으면 4개, 250㎥ 정도면 10~12개를 배치해요.\n용어 풀이:\n· 시험재: 건조 상태를 확인하는 샘플 목재\n· 건조실: 목재를 말리는 시설", "ref": "p.66"}, {"id": "임산가공-14", "subject": "임산가공", "num": 14, "part": 1, "stem": "건조시간을 줄이려고 기존 건조스케줄을 조정할 때 가장 먼저 하는 것은?", "options": ["건구온도 단계를 한 단계 높인다", "건습구온도차 단계를 한 단계 높인다", "재간풍속을 낮춘다", "습도스케줄의 함수율 등급을 한 단계 높인다"], "answer": 3, "explain": "함수율 등급(D4→E4) → 건습구온도차(E4→E5) → 건구온도(T4→T5) 순\n쉬운 풀이: 건조 시간을 줄이려면 조건을 조금씩 강하게 해요. 순서는 ① 습도스케줄의 함수율 등급 올리기(D4→E4) → ② 건습구온도차 올리기(E4→E5) → ③ 건구온도 올리기(T4→T5)예요. 온도는 마지막에 올려요.\n용어 풀이:\n· 건구온도: 일반 온도계 온도\n· 건습구온도차: 마른·젖은 온도계 차이(습도 지표)\n· 습도스케줄: 습도 조건 단계표", "ref": "p.67–68"}, {"id": "임산가공-15", "subject": "임산가공", "num": 15, "part": 1, "stem": "활엽수 건조재의 재색과 가공성을 지키려면 건구온도를 몇 ℃ 넘게 적용하지 않는가?", "options": ["70℃", "80℃", "90℃", "100℃"], "answer": 0, "explain": "· 70℃ 초과 금지\n· 65℃ 이상 장기 노출 시 강도 저하\n쉬운 풀이: 활엽수 목재는 너무 뜨겁게 말리면 색이 어둡게 변하고 가공이 어려워져요. 그래서 건구온도를 70℃ 넘게 하지 않고, 65℃ 이상에 오래 두면 강도도 떨어져요.\n용어 풀이:\n· 재색: 목재의 색\n· 가공성: 깎고 다듬기 쉬운 정도\n· 활엽수: 넓은 잎 나무(참나무 등)", "ref": "p.68"}, {"id": "임산가공-16", "subject": "임산가공", "num": 16, "part": 1, "stem": "목재의 평형함수율에 가장 큰 영향을 주는 인자는?", "options": ["온도", "풍속", "상대습도", "기압"], "answer": 2, "explain": "상대습도가 온도보다 평형함수율에 훨씬 큰 영향\n쉬운 풀이: 평형함수율은 목재가 주변 공기와 물을 주고받다 더 이상 변하지 않는 함수율이에요. 공기가 습하면 목재도 물을 먹어 높아지고, 건조하면 낮아져요. 온도보다 상대습도의 영향이 훨씬 커요.\n용어 풀이:\n· 평형함수율: 주변 환경과 균형을 이룬 함수율\n· 상대습도: 공기 중 수증기 비율", "ref": "p.69"}, {"id": "임산가공-17", "subject": "임산가공", "num": 17, "part": 1, "stem": "목재를 180~230℃로 열처리할 때 가장 먼저 열분해되는 성분은?", "options": ["셀룰로오스", "헤미셀룰로오스", "리그닌", "추출성분"], "answer": 1, "explain": "헤미셀룰로오스가 가장 먼저 분해 → 흡습성 감소\n쉬운 풀이: 목재는 셀룰로오스·헤미셀룰로오스·리그닌으로 이뤄져요. 180~230℃로 열처리하면 열에 가장 약한 헤미셀룰로오스가 먼저 분해돼요. 헤미셀룰로오스는 물을 잘 빨아들이는 성분이라, 줄어들면 목재가 물을 덜 먹어 썩기 어려워져요.\n용어 풀이:\n· 헤미셀룰로오스: 세포벽의 탄수화물 성분(흡습성 큼)\n· 셀룰로오스: 세포벽의 주성분 섬유\n· 리그닌: 세포를 붙여 단단하게 하는 성분", "ref": "p.76"}, {"id": "임산가공-18", "subject": "임산가공", "num": 18, "part": 1, "stem": "국내 방부목재 품질기준의 수용성 목재보존제가 **아닌** 것은?", "options": ["ACQ", "CUAZ", "CCB", "크레오소트"], "answer": 3, "explain": "크레오소트는 유성 보존제\n쉬운 풀이: 방부제는 물에 녹여 쓰는 수용성(ACQ·CUAZ·CCB 등)과 기름 성분인 유성으로 나뉘어요. 크레오소트는 철도 침목에 쓰는 검은 기름 같은 유성 방부제예요.\n용어 풀이:\n· 목재보존제(방부제): 목재가 썩지 않게 하는 약제\n· 수용성: 물에 녹는\n· 유성: 기름 성분의", "ref": "p.88"}, {"id": "임산가공-19", "subject": "임산가공", "num": 19, "part": 1, "stem": "토양과 접하지 않지만 강우에 계속 노출되는 실외 비접지 환경의 사용환경범주는?", "options": ["H1", "H2", "H3", "H4"], "answer": 2, "explain": "H3 = 실외 비접지 (H3A·H3B)\n쉬운 풀이: 방부목재는 쓰는 환경에 따라 H1~H5로 나눠요. 흙에 닿지 않지만 비를 계속 맞는 실외(데크 난간 등)는 H3예요. 흙에 닿으면 H4, 바닷물에 닿으면 H5예요. 숫자가 클수록 가혹한 환경이에요.\n용어 풀이:\n· 사용환경범주: 방부목재 사용 환경 등급\n· 비접지: 땅에 닿지 않음\n· 강우: 비", "ref": "부속서2 p.146"}, {"id": "임산가공-20", "subject": "임산가공", "num": 20, "part": 1, "stem": "사용환경범주 H5에서만 가해생물로 추가되는 것은?", "options": ["해양천공충", "연부후균", "흰개미", "변색균"], "answer": 0, "explain": "H5 = 해수 접촉, 해양천공충 추가\n쉬운 풀이: H5는 바닷물에 닿는 환경이라, 부후균·흰개미 외에 바닷속에서 나무를 뚫는 해양천공충(배좀벌레조개 등)까지 막아야 해요. 그래서 H5에만 해양천공충이 추가돼요.\n용어 풀이:\n· 해양천공충: 바닷물 속 목재에 구멍을 뚫는 생물\n· 가해생물: 해를 끼치는 생물\n· H5: 해수 접촉 환경", "ref": "부속서2 p.146"}, {"id": "임산가공-21", "subject": "임산가공", "num": 21, "part": 2, "stem": "원목 규격 고시상 '원목의 지름'이란?", "options": ["원구지름", "말구지름 — 수피를 제외한 최소지름", "원구와 말구 지름의 평균", "흉고직경"], "answer": 1, "explain": "원목의 지름 = 말구지름 = 수피 제외 최소지름\n쉬운 풀이: 원목 지름은 가는 쪽 끝(말구)에서 껍질을 빼고 잰 가장 짧은 지름이에요. 굵은 쪽(원구)으로 재면 실제 쓸 수 있는 목재보다 크게 나오기 때문에 보수적으로 가는 쪽을 기준으로 해요.\n용어 풀이:\n· 말구: 원목의 가는 쪽 끝\n· 원구: 원목의 굵은 쪽 끝\n· 수피: 나무껍질", "ref": "모듈 p.133"}, {"id": "임산가공-22", "subject": "임산가공", "num": 22, "part": 2, "stem": "말구의 최소지름이 350mm, 그 직각지름이 410mm일 때 말구지름은?", "options": ["350mm", "360mm", "370mm", "380mm"], "answer": 2, "explain": "300mm 초과(400mm 미만)는 직각지름과 차이 30mm마다 10mm 가산 → 차 60mm → +20mm = 370mm\n쉬운 풀이: 말구 단면이 타원이면 최소지름에 보정을 해요. 지름이 300mm 초과~400mm 미만이면 직각 방향 지름과의 차이 30mm마다 10mm를 더해요. 차이 410−350 = 60mm → 30mm가 2번 → 20mm 추가 → 350 + 20 = 370mm.\n용어 풀이:\n· 최소지름: 단면에서 가장 짧은 지름\n· 직각지름: 최소지름과 직각 방향의 지름\n· 가산: 더함", "ref": "p.133"}, {"id": "임산가공-23", "subject": "임산가공", "num": 23, "part": 2, "stem": "원목 길이를 정할 때 길이에서 제외하는 것은?", "options": ["0.1m 미만의 여척과 지름 60mm 미만인 끝단부", "1m 미만의 끝수", "수피 부분", "옹이가 있는 부분"], "answer": 0, "explain": "0.1m 미만 여척, 지름 60mm 미만 끝단부 제외\n쉬운 풀이: 원목 길이를 셀 때 0.1m가 안 되는 남는 길이(여척)와 지름 60mm 미만으로 너무 가는 끝부분은 빼요. 쓸모 있는 부분만 길이로 인정하는 거예요.\n용어 풀이:\n· 여척: 기준 길이를 넘는 남는 부분\n· 끝단부: 끝부분", "ref": "p.133"}, {"id": "임산가공-24", "subject": "임산가공", "num": 24, "part": 2, "stem": "원목 규격 고시에서 '재면'의 뜻은?", "options": ["원목의 횡단면", "원목의 수피 바로 아래 형성층", "원목을 판재로 켠 면", "원목의 표면을 종선으로 4등분한 면"], "answer": 3, "explain": "재면 = 표면을 종선으로 4등분한 면\n쉬운 풀이: 재면은 원목 겉면을 길이 방향 선으로 4등분한 각 면이에요. 결점이 어느 면에 몇 개 있는지 따질 때 써요.\n용어 풀이:\n· 재면: 원목 표면을 4등분한 면\n· 종선: 세로(길이 방향) 선", "ref": "p.132"}, {"id": "임산가공-25", "subject": "임산가공", "num": 25, "part": 2, "stem": "'전간재'의 정의는?", "options": ["가지와 초두부를 그대로 둔 원목", "1본의 임목을 벌채해 초두부만 잘라낸 전 길이의 원목", "일정 길이로 자른 단목", "껍질을 벗긴 원목"], "answer": 1, "explain": "· 전간재 = 초두부만 잘라낸 전 길이 원목\n· 전목재 = 초두부·가지를 조재하지 않음\n쉬운 풀이: 전간재는 나무를 베어 꼭대기 가는 부분(초두부)만 자른 전체 길이의 원목이에요. 꼭대기와 가지까지 그대로 둔 건 전목재예요.\n용어 풀이:\n· 전간재: 초두부만 자른 전체 길이 원목\n· 전목재: 가지·초두부를 그대로 둔 나무\n· 초두부: 나무 꼭대기 부분", "ref": "p.11, 132"}, {"id": "임산가공-26", "subject": "임산가공", "num": 26, "part": 2, "stem": "국내 원목 재적 계산식이 길이에 따라 달라지는 기준 길이는?", "options": ["2.1m", "3.6m", "6m", "7.2m"], "answer": 2, "explain": "6m 미만·6m 이상에 따라 식이 다름 (소나무·낙엽송 3.6m 이상·600mm 이하는 별도식)\n쉬운 풀이: 원목 부피 계산식은 길이 6m를 기준으로 달라져요. 길수록 끝이 가늘어지는 효과가 커서 6m 이상은 보정식을 써요. 소나무·낙엽송 3.6m 이상·600mm 이하는 따로 정한 식을 써요.\n용어 풀이:\n· 재적: 원목의 부피\n· 기준 길이: 계산식이 바뀌는 경계 길이", "ref": "p.8"}, {"id": "임산가공-27", "subject": "임산가공", "num": 27, "part": 2, "stem": "편백·삼나무류 1등급 원목의 지름 기준은?", "options": ["210mm 이상", "240mm 이상", "270mm 이상", "360mm 이상"], "answer": 0, "explain": "편백·삼나무류 1등급 210mm·3.6m\n쉬운 풀이: 편백·삼나무류 1등급 원목은 지름 210mm 이상, 길이 3.6m 이상이에요. 수종별 1등급 지름: 편백·삼나무 210 < 낙엽송 240 < 소나무·활엽수 270 순이에요.\n용어 풀이:\n· 편백·삼나무: 남부 지방에 많이 심는 침엽수\n· 1등급: 원목 품질 등급", "ref": "p.9"}, {"id": "임산가공-28", "subject": "임산가공", "num": 28, "part": 2, "stem": "활엽수류 1등급 원목의 기준은?", "options": ["지름 210mm 이상, 재장 3.6m 이상", "지름 240mm 이상, 재장 3.6m 이상", "지름 360mm 이상, 재장 2.1m 이상", "지름 270mm 이상, 재장 2.1m 이상"], "answer": 3, "explain": "활엽수류 1등급 270mm·2.1m\n쉬운 풀이: 활엽수류 1등급 원목은 지름 270mm 이상, 길이 2.1m 이상이에요. 활엽수는 길게 곧은 줄기를 얻기 어려워 길이 기준이 짧아요.\n용어 풀이:\n· 활엽수류: 참나무 등 넓은 잎 나무\n· 재장: 원목 길이", "ref": "p.9"}, {"id": "임산가공-29", "subject": "임산가공", "num": 29, "part": 2, "stem": "원목 결점 중 '썩음 등'에 포함되는 것은?", "options": ["산옹이", "썩음·속빔·벌레먹음", "할렬", "굽음"], "answer": 1, "explain": "썩음 등 = 썩음·속빔·벌레먹음, 평균지름 = (최소 + 직각)/2\n쉬운 풀이: 원목 결점 중 '썩음 등'은 썩음, 속이 빈 것(속빔), 벌레 먹은 것을 말해요. 크기는 최소지름과 그 직각지름의 평균으로 재요.\n용어 풀이:\n· 속빔: 원목 가운데가 비어 있음\n· 벌레먹음: 곤충이 파먹은 흔적\n· 할렬: 갈라짐", "ref": "p.10"}, {"id": "임산가공-30", "subject": "임산가공", "num": 30, "part": 2, "stem": "열기건조 중 참나무처럼 비중이 높은 수종에 거는 상부하중 기준은?", "options": ["1.2kPa 이상", "2.4kPa 이상", "7.2kPa 이상", "15kPa 이상"], "answer": 2, "explain": "사시나무 등 저비중 2.4kPa, 참나무 등 고비중 7.2kPa 이상\n쉬운 풀이: 목재를 말리면 휘거나 뒤틀려요. 위에서 무게(상부하중)를 눌러 주면 덜 휘어요. 단단하고 무거운 참나무는 7.2kPa 이상, 가벼운 사시나무류는 2.4kPa 이상으로 눌러요.\n용어 풀이:\n· 상부하중: 위에서 누르는 무게\n· kPa: 킬로파스칼(압력 단위)\n· 비중: 같은 부피의 물 대비 무게", "ref": "p.65"}, {"id": "임산가공-31", "subject": "임산가공", "num": 31, "part": 2, "stem": "건조용 잔목(桟木) 두께에 대한 설명으로 옳은 것은?", "options": ["대개 19mm 정도를 쓰며, 3mm 두꺼워질 때마다 적재효율이 약 7% 줄어든다", "대개 50mm를 쓴다", "두꺼울수록 적재효율이 높다", "잔목 두께는 건조에 영향이 없다"], "answer": 0, "explain": "· 14~22mm, 대개 19mm\n· 3mm 증가마다 적재효율 약 7% 감소\n쉬운 풀이: 목재를 쌓아 말릴 때 층 사이에 끼우는 얇은 각목이 잔목이에요. 공기가 통하게 하려고 넣는데, 보통 19mm를 써요. 3mm 두꺼워질 때마다 쌓을 수 있는 양이 약 7% 줄어요.\n용어 풀이:\n· 잔목(桟木): 적재 층 사이에 끼우는 받침목\n· 적재효율: 공간에 쌓을 수 있는 양의 비율", "ref": "p.64"}, {"id": "임산가공-32", "subject": "임산가공", "num": 32, "part": 2, "stem": "두께 50mm 참나무 판재는 두께 25mm 판재보다 건조시간이 얼마나 더 걸리는가?", "options": ["같다", "1.5배", "3배", "4배"], "answer": 1, "explain": "50mm 참나무는 25mm보다 1.5배\n쉬운 풀이: 두꺼운 목재는 속의 물이 겉까지 나오는 거리가 멀어 오래 걸려요. 참나무 50mm 판재는 25mm 판재보다 1.5배 더 걸려요. 두께가 2배라고 시간이 꼭 2배는 아니에요.\n용어 풀이:\n· 건조시간: 목표 함수율까지 마르는 시간\n· 판재: 얇고 넓은 목재", "ref": "p.62"}, {"id": "임산가공-33", "subject": "임산가공", "num": 33, "part": 2, "stem": "목재 칩핑에 가장 알맞은 함수율 수준은?", "options": ["5% 이하", "10~15%", "60% 이상", "35% 이하"], "answer": 3, "explain": "칩핑 적정 함수율 35% 이하\n쉬운 풀이: 칩핑은 목재를 잘게 부숴 칩으로 만드는 거예요. 너무 젖어 있으면 칩이 뭉개지고 너무 마르면 부서지니, 함수율 35% 이하가 적당해요.\n용어 풀이:\n· 칩핑: 목재를 작은 조각(칩)으로 만들기\n· 목재칩: 잘게 부순 나무 조각", "ref": "p.53"}, {"id": "임산가공-34", "subject": "임산가공", "num": 34, "part": 2, "stem": "전건비중 0.5인 두께 25mm 미지 수종의 건구온도 색인번호는? (건구온도 색인 = 13.9 − 13.6S)", "options": ["T5", "T6", "T7", "T8"], "answer": 2, "explain": "13.9 − 6.8 = 7.1 → 반올림 7 → T7\n쉬운 풀이: 잘 모르는 수종은 비중으로 건조 온도를 정해요. 건구온도 색인 = 13.9 − 13.6 × 비중 = 13.9 − 13.6 × 0.5 = 13.9 − 6.8 = 7.1 → 반올림해서 T7이에요.\n용어 풀이:\n· 전건비중: 완전히 말렸을 때의 비중\n· 색인번호: 건조스케줄 단계 번호\n· 반올림: 0.5 이상 올림", "ref": "p.67"}, {"id": "임산가공-35", "subject": "임산가공", "num": 35, "part": 2, "stem": "건조 중 시험재의 함수율을 직접 구하는 표준 방법은?", "options": ["촉감법", "전건법", "비중법", "음향법"], "answer": 1, "explain": "시험재 함수율 시편은 전건법(oven drying)\n쉬운 풀이: 함수율을 가장 정확히 재는 표준 방법은 전건법이에요. 시편 무게를 잰 뒤 오븐(103℃)에서 완전히 말려 다시 무게를 재고, (처음 무게 − 마른 무게) ÷ 마른 무게 × 100으로 계산해요.\n용어 풀이:\n· 전건법: 완전 건조 전후 무게로 함수율을 구하는 방법\n· 시편: 시험용 작은 조각\n· 전건: 물이 하나도 없는 상태", "ref": "p.65"}, {"id": "임산가공-36", "subject": "임산가공", "num": 36, "part": 2, "stem": "실외 공기가 10℃·상대습도 80%(평형함수율 16.5%)일 때 창고 안 평형함수율을 6%로 유지하려면 창고 공기를 몇 ℃ 정도까지 올려야 하는가?", "options": ["약 17℃", "약 22℃", "약 27℃", "약 32℃"], "answer": 2, "explain": "창고 공기를 약 27℃로 가열하면 평형함수율 6% 유지\n쉬운 풀이: 공기를 데우면 같은 수증기 양이라도 상대습도가 낮아져요. 상대습도가 낮아지면 목재의 평형함수율도 낮아지죠. 그래서 10℃·80% 공기를 약 27℃로 데우면 평형함수율을 6%로 유지할 수 있어요.\n용어 풀이:\n· 평형함수율: 주변 공기와 균형인 함수율\n· 상대습도: 공기가 머금을 수 있는 최대량 대비 수증기 비율", "ref": "p.71"}, {"id": "임산가공-37", "subject": "임산가공", "num": 37, "part": 2, "stem": "열처리 공정 OHT에서 쓰는 열매체는?", "options": ["질소", "수증기", "진공", "오일"], "answer": 3, "explain": "OHT = Oil Heat Treatment (180~220℃)\n쉬운 풀이: 열처리 방법 중 OHT(Oil Heat Treatment)는 뜨거운 기름(오일, 180~220℃) 속에서 목재를 처리하는 방법이에요. 이름의 O가 Oil이에요.\n용어 풀이:\n· OHT: 오일 열처리\n· 열매체: 열을 전달하는 물질\n· 열처리 목재: 고온 처리로 내구성을 높인 목재", "ref": "p.76–79"}, {"id": "임산가공-38", "subject": "임산가공", "num": 38, "part": 2, "stem": "열처리 공정 Retification에서 쓰는 분위기 기체는?", "options": ["질소", "산소", "이산화탄소", "공기"], "answer": 0, "explain": "Retification = 질소 분위기 180~250℃\n쉬운 풀이: Retification은 산소 없이 질소 가스를 채운 상태(180~250℃)에서 목재를 구워요. 산소가 없으니 불이 붙지 않고 고르게 처리돼요.\n용어 풀이:\n· Retification: 질소 분위기 열처리 공법\n· 분위기 기체: 처리 공간을 채우는 가스", "ref": "p.79"}, {"id": "임산가공-39", "subject": "임산가공", "num": 39, "part": 2, "stem": "도장할 피도재(목재)의 적정 함수율은?", "options": ["3~5%", "8~12%", "15~20%", "25% 이상"], "answer": 1, "explain": "· 피도재 적정 함수율 8~12%\n· 15% 이상이면 도막 부착성 저하\n쉬운 풀이: 페인트를 칠할 목재는 함수율 8~12%가 좋아요. 15% 이상으로 젖어 있으면 나중에 물이 빠지면서 도막(페인트 막)이 들뜨거나 갈라져요.\n용어 풀이:\n· 피도재: 칠을 할 재료\n· 도막: 페인트가 굳어 생긴 막\n· 부착성: 달라붙는 정도", "ref": "p.120"}, {"id": "임산가공-40", "subject": "임산가공", "num": 40, "part": 2, "stem": "연마지에서 지립 면적이 약 50%로 눈메움이 적어 목재 초벌연마에 알맞은 것은?", "options": ["클로우즈 코트", "미디엄 코트", "오픈 코트", "풀 코트"], "answer": 2, "explain": "· 오픈 코트 50%(초벌)\n· 미디엄 코트 70%\n· 클로우즈 코트 약 100%\n쉬운 풀이: 사포(연마지)는 연마 알갱이(지립)가 덮인 비율로 나눠요. 오픈 코트는 약 50%만 덮여 틈이 많아 나무 가루가 덜 막혀서(눈메움 적음) 처음 거칠게 갈 때(초벌) 좋아요. 클로우즈 코트는 100% 덮여 마무리용이에요.\n용어 풀이:\n· 연마지: 사포\n· 지립: 연마용 알갱이\n· 눈메움: 연마 가루가 사포 틈을 막는 현상\n· 초벌연마: 처음 거칠게 가는 단계", "ref": "p.104"}, {"id": "임산가공-41", "subject": "임산가공", "num": 41, "part": 3, "stem": "목재의 섬유포화점 함수율은 대략 얼마인가?", "options": ["약 10%", "약 15%", "약 30%", "약 60%"], "answer": 2, "explain": "· 섬유포화점 약 25~30%\n· 이 아래에서 수축·강도 변화 시작\n쉬운 풀이: 목재 속 물은 세포 안 빈 공간의 '자유수'와 세포벽에 붙은 '결합수'가 있어요. 자유수가 다 빠지고 결합수만 꽉 찬 상태가 섬유포화점으로, 함수율 약 25~30%예요. 이보다 더 마르면 그때부터 목재가 줄어들고 단단해져요.\n용어 풀이:\n· 섬유포화점(FSP): 자유수 0, 결합수 포화 상태\n· 자유수: 세포 빈 공간의 물\n· 결합수: 세포벽에 붙은 물", "ref": "목재이학"}, {"id": "임산가공-42", "subject": "임산가공", "num": 42, "part": 3, "stem": "목재의 수축률 크기 순서로 옳은 것은?", "options": ["접선방향 > 방사방향 > 섬유방향", "섬유방향 > 접선방향 > 방사방향", "방사방향 > 섬유방향 > 접선방향", "세 방향 모두 같다"], "answer": 0, "explain": "접선 : 방사 : 섬유 ≈ 10 : 5 : 0.1 정도\n쉬운 풀이: 목재는 마를 때 방향마다 줄어드는 정도가 달라요. 나이테를 따라 도는 접선방향이 가장 많이(약 10), 중심에서 바깥으로 가는 방사방향이 그 절반(약 5), 길이(섬유) 방향은 거의 안 줄어요(약 0.1). 그래서 판재가 휘어요.\n용어 풀이:\n· 접선방향: 나이테에 접하는 방향\n· 방사방향: 중심에서 바깥으로 향하는 방향\n· 섬유방향: 줄기 길이 방향", "ref": "목재이학"}, {"id": "임산가공-43", "subject": "임산가공", "num": 43, "part": 3, "stem": "생재 무게 120g, 전건 무게 80g인 시편의 함수율은?", "options": ["33%", "50%", "40%", "150%"], "answer": 1, "explain": "(120 − 80) ÷ 80 × 100 = 50% (전건중량 기준)\n쉬운 풀이: 목재 함수율은 '마른 나무 무게'를 기준으로 계산해요. (젖은 무게 − 마른 무게) ÷ 마른 무게 × 100 = (120 − 80) ÷ 80 × 100 = 50%. 전체 무게(120)로 나누면 안 돼요.\n용어 풀이:\n· 함수율: 물 무게 ÷ 전건 무게 × 100\n· 생재: 갓 벤 젖은 목재\n· 전건: 완전히 말린 상태", "ref": "목재이학"}, {"id": "임산가공-44", "subject": "임산가공", "num": 44, "part": 3, "stem": "목재 세포벽의 주성분 중 가장 많은 것은?", "options": ["리그닌", "헤미셀룰로오스", "추출성분", "셀룰로오스"], "answer": 3, "explain": "셀룰로오스 약 40~50% > 헤미셀룰로오스·리그닌\n쉬운 풀이: 목재 세포벽은 셀룰로오스(40~50%)가 가장 많고, 헤미셀룰로오스와 리그닌이 각각 20~30%예요. 셀룰로오스는 종이와 솜의 주성분이기도 해요.\n용어 풀이:\n· 셀룰로오스: 세포벽 주성분 섬유\n· 리그닌: 세포를 단단히 붙이는 성분\n· 추출성분: 송진·탄닌 등 녹여 낼 수 있는 성분", "ref": "목재화학"}, {"id": "임산가공-45", "subject": "임산가공", "num": 45, "part": 3, "stem": "침엽수재 체적의 대부분(약 90% 이상)을 차지하는 세포는?", "options": ["가도관(헛물관)", "도관(물관)", "목섬유", "방사유세포"], "answer": 0, "explain": "침엽수는 가도관이 통도·지지를 모두 담당\n쉬운 풀이: 침엽수 목재의 90% 이상은 가도관(헛물관)이라는 길쭉한 세포예요. 물을 나르는 일과 나무를 지탱하는 일을 둘 다 해요. 활엽수는 물관(도관)과 섬유가 일을 나눠 해요.\n용어 풀이:\n· 가도관(헛물관): 침엽수의 물 운반·지지 세포\n· 통도: 물이 통함\n· 지지: 받쳐 줌", "ref": "목재해부"}, {"id": "임산가공-46", "subject": "임산가공", "num": 46, "part": 3, "stem": "활엽수재에만 있고 침엽수재에는 없는 세포는?", "options": ["가도관", "방사조직", "도관(물관)", "수지구"], "answer": 2, "explain": "도관은 활엽수의 특징 (일부 예외 제외)\n쉬운 풀이: 도관(물관)은 활엽수에만 있는 굵은 물 통로예요. 활엽수 단면에 보이는 작은 구멍(관공)이 바로 도관이에요. 침엽수는 도관 없이 가도관으로 물을 날라요.\n용어 풀이:\n· 도관(물관): 활엽수의 굵은 물 운반 세포\n· 수지구: 송진이 흐르는 통로\n· 방사조직: 중심에서 바깥으로 뻗은 조직", "ref": "목재해부"}, {"id": "임산가공-47", "subject": "임산가공", "num": 47, "part": 3, "stem": "심재에 대한 설명으로 옳은 것은?", "options": ["수분 통도 기능을 활발히 한다", "생리적 기능은 없고 추출성분이 많아 일반적으로 내구성이 높다", "변재보다 함수율이 항상 높다", "수피 바로 안쪽에 있다"], "answer": 1, "explain": "· 심재: 생리 기능 없음, 추출물 축적, 내구성↑\n· 변재: 수피 쪽, 통도 기능\n쉬운 풀이: 나무 중심부의 짙은 색 부분이 심재예요. 이미 죽은 세포라 물을 나르지 않고, 추출성분(타닌·수지 등)이 쌓여 벌레·균에 강해 내구성이 높아요. 바깥쪽 연한 부분인 변재가 물을 날라요.\n용어 풀이:\n· 심재: 줄기 중심부의 짙은 목재\n· 변재: 바깥쪽의 연한 목재\n· 내구성: 썩지 않고 오래가는 성질", "ref": "목재해부"}, {"id": "임산가공-48", "subject": "임산가공", "num": 48, "part": 3, "stem": "「목재의 지속가능한 이용에 관한 법률」에 따라 목재제품의 규격과 품질기준을 정해 고시하는 자는?", "options": ["국토교통부장관", "산림조합중앙회장", "한국임업진흥원장", "산림청장"], "answer": 3, "explain": "목재법상 산림청장이 규격·품질기준 고시 (모듈 붙임2 '목재제품의 규격과 품질기준')\n쉬운 풀이: 목재제품(제재목·합판·펠릿 등)의 규격과 품질기준은 「목재의 지속가능한 이용에 관한 법률」에 따라 산림청장이 정해 고시해요. 실제 고시는 국립산림과학원 이름으로 나와요.\n용어 풀이:\n· 규격·품질기준: 크기와 품질의 기준\n· 고시: 공식 발표\n· 목재법: 목재의 지속가능한 이용에 관한 법률", "ref": "목재법"}, {"id": "임산가공-49", "subject": "임산가공", "num": 49, "part": 3, "stem": "합판의 구성 원칙으로 옳은 것은?", "options": ["단판의 섬유방향을 서로 직교시키고 보통 홀수 겹으로 쌓는다", "단판의 섬유방향을 모두 평행하게 짝수 겹으로 쌓는다", "칩을 접착제로 압착한다", "섬유를 해섬해 판으로 만든다"], "answer": 0, "explain": "직교 적층·홀수 겹으로 치수안정성 확보\n쉬운 풀이: 합판은 얇은 판(단판)을 결 방향이 서로 직각이 되게 엇갈려 쌓고 붙여요. 이렇게 하면 한 방향으로 휘거나 줄어드는 걸 서로 막아 줘요. 가운데를 기준으로 대칭이 되도록 3·5·7겹처럼 홀수로 쌓아요.\n용어 풀이:\n· 합판: 단판을 직교로 쌓아 붙인 판\n· 단판(베니어): 얇게 깎은 판\n· 직교: 서로 직각으로 교차", "ref": "임산제조"}, {"id": "임산가공-50", "subject": "임산가공", "num": 50, "part": 3, "stem": "집성재에 대한 설명으로 옳은 것은?", "options": ["단판을 직교로 쌓은 판재", "제재목(층재)을 섬유방향이 평행하게 길이·너비·두께 방향으로 접착한 재료", "목재 칩을 압축한 보드", "목분과 플라스틱을 섞은 복합재"], "answer": 1, "explain": "· 집성재 = 평행 적층\n· 🆕 2026 개정 부속서5가 집성재 품질기준\n쉬운 풀이: 집성재는 제재한 판(층재)을 결 방향을 '평행'하게 맞춰 길이·너비·두께로 이어 붙인 재료예요. 큰 기둥·보를 만들 수 있어요. 직교로 쌓는 합판·CLT와 구분하세요. 2026 개정 부속서5가 집성재 기준이에요.\n용어 풀이:\n· 집성재: 층재를 평행하게 접착한 목재\n· 층재: 집성재를 이루는 각 판\n· 적층: 층층이 쌓음", "ref": "임산제조 · 모듈 부속서5"}, {"id": "임산가공-51", "subject": "임산가공", "num": 51, "part": 4, "stem": "목재의 세포벽 내부에는 결합수로 포화되어 있고, 세포 내강(빈 공간)의 자유수는 완전히 제거된 상태의 함수율 상태를 무엇이라 하는가?", "options": ["기건상태", "전건상태", "섬유포화점(FSP)", "생재상태"], "answer": 2, "explain": "섬유포화점(FSP)은 자유수=0%, 결합수 포화 상태(함수율 약 28~30%)를 가리킴\n쉬운 풀이: 섬유포화점은 세포 빈 공간의 자유수는 0%가 되고, 세포벽의 결합수는 아직 꽉 찬 상태예요. 함수율 약 28~30%로, 목재 성질이 변하기 시작하는 기준점이에요.\n용어 풀이:\n· 섬유포화점(FSP): 목재 성질 변화의 기준 함수율\n· 기건상태: 공기 중에서 자연히 마른 상태\n· 내강: 세포 안 빈 공간", "ref": "목재물리학"}, {"id": "임산가공-52", "subject": "임산가공", "num": 52, "part": 4, "stem": "섬유포화점(약 28~30%) 이하로 목재가 건조될 때 일어나는 수축률의 크기 순서로 옳은 것은?", "options": ["접선방향 > 방사방향 > 섬유방향(축방향)", "섬유방향 > 방사방향 > 접선방향", "방사방향 > 접선방향 > 섬유방향", "접선방향 > 섬유방향 > 방사방향"], "answer": 0, "explain": "목재의 건조 수축률은 접선(연륜 접선)방향 > 방사(나이테 직각)방향 > 섬유(축)방향 (대략 10:5:1)\n쉬운 풀이: 섬유포화점 아래로 마르면 수축이 시작되는데, 접선방향 > 방사방향 > 섬유방향 순으로 많이 줄어요(약 10 : 5 : 1). 42번과 같은 내용이니 함께 외우세요.\n용어 풀이:\n· 수축률: 줄어든 비율\n· 축방향: 줄기 길이 방향", "ref": "목재물리학"}, {"id": "임산가공-53", "subject": "임산가공", "num": 53, "part": 4, "stem": "목재를 인공건조할 때 건조 초기 표면이 급격히 말라 늘어난 상태로 굳어지고, 내부가 뒤늦게 건조되면서 내부 인장 응력에 의해 발생하는 결함은?", "options": ["찌그러짐(Collapse)", "표면경화(Case hardening)", "청변", "틀어짐"], "answer": 1, "explain": "표면이 먼저 마르고 내부가 뒤늦게 마르면서 잔류 응력이 생겨 굳어지는 결함을 표면경화라 함\n쉬운 풀이: 건조 초기에 겉이 너무 빨리 마르면 겉은 늘어난 상태로 굳어 버려요. 나중에 속이 마르며 줄어들 때 겉이 못 따라 줄어서 속에 당기는 힘이 남아요. 이걸 표면경화라고 하고, 나중에 켜면 휘어요.\n용어 풀이:\n· 표면경화(Case hardening): 겉이 늘어난 채 굳는 건조 결함\n· 잔류 응력: 남아 있는 내부 힘\n· 인장 응력: 당기는 힘", "ref": "목재건조학"}, {"id": "임산가공-54", "subject": "임산가공", "num": 54, "part": 4, "stem": "목재 방부제 중 과거 널리 사용되던 비소·크롬계(CCA)의 유해성을 개선하여 현대에 널리 쓰이는 구리·알킬암모늄계 친환경 방부제는?", "options": ["크레오소트유", "ACQ(구리·알킬암모늄 화합물)", "PCP", "볼덴염"], "answer": 1, "explain": "ACQ(Alkaline Copper Quaternary)는 인체 유해 중금속(비소, 크롬)을 배제한 대표 방부제\n쉬운 풀이: 예전에 많이 쓰던 CCA 방부제는 비소·크롬 같은 해로운 중금속이 들어 있어요. 그래서 요즘은 구리와 알킬암모늄 화합물로 만든 ACQ를 많이 써요. 놀이터·데크용 방부목에 쓰여요.\n용어 풀이:\n· ACQ: 구리·알킬암모늄 방부제\n· CCA: 크롬·구리·비소 방부제\n· 중금속: 몸에 쌓이면 해로운 금속", "ref": "목재보존학"}, {"id": "임산가공-55", "subject": "임산가공", "num": 55, "part": 4, "stem": "원목을 얇은 단판(Veneer)으로 회전 절삭한 후, 인접한 단판의 섬유 방향이 서로 직교하도록 홀수 겹으로 겹쳐 접착한 목질 판상 재료는?", "options": ["파티클보드(PB)", "합판(Plywood)", "중밀도섬유판(MDF)", "지향성스트랜드보드(OSB)"], "answer": 1, "explain": "베니어를 홀수 매로 직교 적층하여 접착한 목질 판상 제품은 합판(Plywood)\n쉬운 풀이: 합판은 통나무를 돌리며 얇게 깎은 단판을 결이 직각으로 엇갈리게 홀수 겹 쌓아 붙인 판이에요. 파티클보드는 나무 조각, MDF는 나무 섬유, OSB는 길쭉한 나무 조각을 붙인 판이에요.\n용어 풀이:\n· 합판(Plywood): 단판 직교 적층판\n· 파티클보드: 나무 조각 판\n· MDF: 중밀도 섬유판\n· OSB: 배향성 스트랜드보드", "ref": "목재가공학"}, {"id": "임산가공-56", "subject": "임산가공", "num": 56, "part": 4, "stem": "목질 접착제 중 내수성과 내열성이 가장 우수하여 실외용 방수 합판이나 구조용 집성재 제조에 필수적으로 사용되는 접착제는?", "options": ["요소수지 접착제", "페놀수지 접착제", "초산비닐수지 접착제", "녹말풀"], "answer": 1, "explain": "페놀수지(PF) 및 레조르시놀수지 접착제는 내수·내후성이 탁월하여 외장구조용으로 사용\n쉬운 풀이: 페놀수지 접착제는 물과 열에 아주 강해서 비 맞는 실외용 합판이나 구조용 집성재에 써요. 요소수지는 싸지만 물에 약해 실내용이에요.\n용어 풀이:\n· 페놀수지(PF): 내수성이 뛰어난 접착제\n· 요소수지: 실내용 저가 접착제\n· 내수성: 물에 견디는 성질", "ref": "목재접착학"}, {"id": "임산가공-57", "subject": "임산가공", "num": 57, "part": 4, "stem": "제지용 펄프 제조법 중 목재 칩을 수산화나트륨(NaOH)과 황화나트륨(Na₂S) 용액으로 증해하여 강도가 매우 강한 포장용 크라프트지를 생산하는 화학펄프는?", "options": ["쇄목펄프(GP)", "크라프트펄프(KP, 황산염펄프)", "아황산펄프(SP)", "반화학펄프(SCP)"], "answer": 1, "explain": "크라프트펄프(KP)는 황화소다 증해로 리그닌을 제거하며 섬유 손상이 적어 강도가 최고\n쉬운 풀이: 크라프트펄프는 목재 칩을 수산화나트륨+황화나트륨 용액에 넣고 끓여 리그닌을 녹여 만든 펄프예요. 섬유가 덜 상해 아주 질겨서 택배 상자 같은 포장지(크라프트지)에 써요. 'Kraft'는 독일어로 '힘'이에요.\n용어 풀이:\n· 크라프트펄프(KP): 황산염법 화학펄프\n· 증해: 약품으로 끓여 성분을 녹임\n· 펄프: 종이 원료 섬유", "ref": "펄프제지학"}, {"id": "임산가공-58", "subject": "임산가공", "num": 58, "part": 4, "stem": "숯(목탄) 제조 시 가마 안에서 탄화가 완료된 후 가마 입구를 활짝 열어 공기를 통하게 하여 1,000℃ 이상으로 달군 뒤 재와 흙을 덮어 급랭시켜 껍질이 희고 단단한 숯은?", "options": ["검탄(흑탄)", "백탄", "활성탄", "성형탄"], "answer": 1, "explain": "백탄은 고온 탄화 후 소화토로 급랭하여 재가 묻어 희고 단단함 (검탄은 가마를 밀폐해 서랭)\n쉬운 풀이: 백탄은 숯을 다 구운 뒤 가마 입구를 열어 1,000℃ 이상으로 확 달군 다음, 꺼내서 재와 흙을 덮어 빨리 식힌 숯이에요. 겉에 재가 묻어 희고 아주 단단해요(참숯). 가마를 막고 천천히 식히면 검탄이에요.\n용어 풀이:\n· 백탄: 고온 정련 후 급랭한 흰 숯\n· 검탄(흑탄): 가마 안에서 천천히 식힌 검은 숯\n· 탄화: 나무가 숯이 되는 과정", "ref": "임산화학"}, {"id": "임산가공-59", "subject": "임산가공", "num": 59, "part": 4, "stem": "숯을 구울 때 발생하는 연기를 냉각 채취하여 얻은 액체(조목초액)를 6개월 이상 정치 숙성시켜 타르를 분리 정제한 친환경 농임업 자재는?", "options": ["목타르", "목초액", "테르펜유", "피톤치드"], "answer": 1, "explain": "숯 굽는 연기를 냉각 액화하여 숙성·정제한 산성 액체는 목초액(Wood vinegar)\n쉬운 풀이: 숯을 구울 때 나오는 연기를 식혀 받은 액체를 6개월 이상 가만히 두면 타르가 가라앉아요. 위의 맑은 액체를 정제한 게 목초액이에요. 농업용 자재로 써요.\n용어 풀이:\n· 목초액: 숯 연기를 액화·정제한 액체\n· 타르: 끈적한 검은 물질\n· 숙성: 시간을 두어 안정시킴", "ref": "임산화학"}, {"id": "임산가공-60", "subject": "임산가공", "num": 60, "part": 4, "stem": "표고버섯 원목재배용 골목으로 가장 널리 사용되는 최적의 원목 수종 군은?", "options": ["소나무류", "참나무류(상수리나무, 신갈나무 등)", "오리나무류", "포플러류"], "answer": 1, "explain": "표고버섯은 리그닌과 셀룰로오스가 풍부한 참나무류(상수리, 신갈 등) 원목이 가장 우수함\n쉬운 풀이: 표고버섯은 참나무류(상수리·신갈나무 등) 원목에 균을 심어 키워요. 참나무는 버섯이 먹을 셀룰로오스·리그닌이 풍부하고 껍질이 적당해서 가장 좋아요. 그래서 참나무 기준벌기령이 짧아요.\n용어 풀이:\n· 골목: 버섯 균을 심은 원목\n· 원목재배: 통나무에 버섯을 키우는 방법", "ref": "버섯재배학"}, {"id": "임산가공-61", "subject": "임산가공", "num": 61, "part": 4, "stem": "목재의 역학적 강도 중 섬유 방향(결 방향)으로 작용할 때 강도가 가장 큰 외력은?", "options": ["섬유평행 인장강도", "섬유직각 인장강도", "전단강도", "지압강도"], "answer": 0, "explain": "목재는 섬유 평행 방향으로 당기는 인장강도가 모든 역학적 강도 중 가장 큼\n쉬운 풀이: 목재는 결(섬유) 방향으로 잡아당길 때 가장 강해요. 섬유가 긴 실처럼 이어져 있어서 끊기 어렵기 때문이에요. 결과 직각으로 당기면 아주 약해요.\n용어 풀이:\n· 인장강도: 잡아당길 때 견디는 힘\n· 섬유평행: 결과 같은 방향\n· 전단강도: 미끄러지듯 어긋나는 힘에 견디는 힘", "ref": "목재역학"}, {"id": "임산가공-62", "subject": "임산가공", "num": 62, "part": 4, "stem": "얇은 제재판을 섬유 방향이 서로 평행하도록 길이 및 두께 방향으로 접착하여 대형 단면과 긴 스팬을 구현할 수 있는 공학목재는?", "options": ["집성재(Glulam)", "파티클보드", "코어합판", "하드보드"], "answer": 0, "explain": "제재판을 섬유 방향이 서로 평행하게 적층 접착하여 대형 보나 기둥을 만드는 재료는 집성재\n쉬운 풀이: 집성재(Glulam)는 얇은 판을 결 방향을 평행하게 맞춰 여러 겹 붙인 공학목재로, 크고 긴 기둥·보를 만들 수 있어요. 체육관 지붕의 긴 목재 보가 집성재예요.\n용어 풀이:\n· 공학목재: 목재를 가공·접착해 성능을 높인 재료\n· 스팬: 기둥 사이 거리", "ref": "공학목재"}, {"id": "임산가공-63", "subject": "임산가공", "num": 63, "part": 4, "stem": "톱밥이나 목재 분쇄물을 고압으로 압축 성형하여 지름 6~8mm, 길이 30mm 내외의 원통형 펠릿으로 만든 친환경 청정 바이오매스 연료는?", "options": ["목재 칩", "목재 펠릿(Wood pellet)", "바이오 에탄올", "성형목탄"], "answer": 1, "explain": "톱밥을 무바인더 또는 고압 압축 성형한 직경 6~8mm 고체 바이오연료는 목재 펠릿\n쉬운 풀이: 목재 펠릿은 톱밥을 강하게 눌러 지름 6~8mm, 길이 30mm 정도의 작은 원통으로 만든 연료예요. 크기가 고르고 물이 적어 보일러에서 깨끗하게 잘 타요.\n용어 풀이:\n· 목재 펠릿: 톱밥 압축 원통형 연료\n· 바이오매스: 생물에서 얻는 에너지 자원\n· 압축 성형: 눌러서 모양을 만듦", "ref": "바이오에너지"}, {"id": "임산가공-64", "subject": "임산가공", "num": 64, "part": 4, "stem": "침엽수 목재 조직의 약 90~95%를 차지하며, 수분 통도 기능과 지지 기능을 동시에 담당하는 가늘고 긴 세포는?", "options": ["도관(Vessel)", "가도관(Tracheid, 헛물관)", "목섬유", "방사유세포"], "answer": 1, "explain": "침엽수재는 도관이 없으며 가도관(Tracheid)이 통도와 지지 기능을 겸함\n쉬운 풀이: 침엽수 목재의 90~95%를 차지하는 가도관(헛물관)은 가늘고 긴 세포로, 물 운반과 나무 지탱을 함께 해요. 45번과 같은 내용이에요.\n용어 풀이:\n· 가도관(Tracheid): 침엽수 주요 세포\n· 목섬유: 활엽수의 지지 세포\n· 방사유세포: 방사조직의 살아 있는 세포", "ref": "목재해부학"}, {"id": "임산가공-65", "subject": "임산가공", "num": 65, "part": 4, "stem": "활엽수 목재 단면에서 봄철에 형성된 조재(춘재)부에 직경이 거대한 도관이 띠 모양으로 배열되고, 만재부에는 작은 도관이 분포하는 수종의 목재 분류는?", "options": ["환공재(Ring-porous wood, 참나무·물푸레 등)", "산공재(Diffuse-porous wood, 자작나무·단풍나무 등)", "무도관재", "무공재"], "answer": 0, "explain": "봄철에 큰 도관이 연륜을 따라 고리 모양으로 배열되는 수종은 환공재(Ring-porous)\n쉬운 풀이: 참나무·물푸레처럼 봄에 만든 부분에 큰 물관이 고리(환) 모양으로 줄지어 있는 목재를 환공재라고 해요. 자작나무·단풍나무처럼 작은 물관이 고르게 흩어져 있으면 산공재예요.\n용어 풀이:\n· 환공재: 춘재에 큰 도관이 고리 모양으로 배열\n· 산공재: 도관이 고르게 흩어진 목재\n· 연륜: 나이테", "ref": "목재조직학"}, {"id": "임산가공-66", "subject": "임산가공", "num": 66, "part": 4, "stem": "활엽수 심재화 과정에서 인접한 유세포의 내용물이 도관 내벽의 벽공을 통해 도관 속으로 풍선처럼 부풀어 들어가 도관을 꽉 틀어막는 물질은?", "options": ["수지(Resin)", "타일로시스(Tylosis)", "리그닌", "펙틴"], "answer": 1, "explain": "유세포막이 도관 내로 침입하여 도관을 폐쇄하는 조직은 타일로시스(Tylosis)\n쉬운 풀이: 활엽수가 심재로 바뀔 때, 물관 옆 살아 있는 세포가 물관 벽 구멍으로 풍선처럼 부풀어 들어가 물관을 막아요. 이걸 타일로시스라고 해요. 물관이 막혀 액체가 잘 안 스며들어서 참나무가 위스키 통으로 쓰여요.\n용어 풀이:\n· 타일로시스(Tylosis): 도관을 막는 풍선 모양 조직\n· 벽공: 세포벽의 작은 구멍\n· 심재화: 변재가 심재로 바뀌는 과정", "ref": "목재해부학"}, {"id": "임산가공-67", "subject": "임산가공", "num": 67, "part": 4, "stem": "목재에 난연(방염) 성능을 부여하기 위해 목재 내부에 주입하는 주된 난연 약제 성분은?", "options": ["인산암모늄, 붕산 및 붕사 화합물", "염화나트륨 및 황산구리", "수산화칼륨 및 알코올", "메탄올 및 아세톤"], "answer": 0, "explain": "인산염 및 붕소 화합물은 가열 시 불연성 가스를 방출하고 탄화층을 형성하여 방염 작용\n쉬운 풀이: 목재를 불에 잘 안 타게(난연) 하려면 인산암모늄이나 붕산·붕사 같은 약을 넣어요. 불이 붙으면 이 약이 불에 안 타는 가스를 내고 겉에 숯층을 만들어 불길을 막아요.\n용어 풀이:\n· 난연: 불에 잘 타지 않음\n· 방염: 불꽃이 번지지 않게 함\n· 탄화층: 표면에 생긴 숯층", "ref": "목재보존학"}, {"id": "임산가공-68", "subject": "임산가공", "num": 68, "part": 4, "stem": "목재 건조 시 목재 표면에서 수분이 증발하는 속도가 내부에서 표면으로 수분이 이동하는 속도보다 훨씬 빠를 때 목재 마구리(단면)나 표면에 생기는 갈라짐 결함은?", "options": ["할렬(Check)", "변색", "옹이", "절삭 결함"], "answer": 0, "explain": "수분 증발 불균형으로 표면이나 끝단이 갈라져 터지는 결함을 할렬(Check)이라 함\n쉬운 풀이: 겉의 물이 날아가는 속도가 속의 물이 겉으로 나오는 속도보다 훨씬 빠르면, 겉만 먼저 줄어들어 갈라져요. 이 갈라짐이 할렬이고, 특히 끝단(마구리)에서 잘 생겨요.\n용어 풀이:\n· 할렬(Check): 건조 중 생기는 갈라짐\n· 마구리: 목재의 잘린 끝면\n· 결함: 품질을 떨어뜨리는 흠", "ref": "목재건조학"}, {"id": "임산가공-69", "subject": "임산가공", "num": 69, "part": 4, "stem": "국산 침엽수 제재목의 품등 구분 시 품질을 저하시키는 가장 대표적인 목재 내부 결함은?", "options": ["옹이(죽은 옹이, 썩은 옹이) 및 부후", "나이테의 균일성", "심재의 짙은 색상", "가도관의 길이"], "answer": 0, "explain": "제재목 품등 판정 시 옹이의 직경비율, 부후(썩음), 꺾임 등 결점이 등급을 좌우함\n쉬운 풀이: 국산 침엽수 제재목은 옹이가 많아요. 특히 죽은옹이·썩은옹이와 부후(썩음)가 강도를 크게 떨어뜨려 등급을 정하는 가장 중요한 결점이에요.\n용어 풀이:\n· 품등: 품질 등급\n· 부후: 썩음\n· 옹이 직경비율: 목재 폭 대비 옹이 크기 비율", "ref": "원목규격고시"}, {"id": "임산가공-70", "subject": "임산가공", "num": 70, "part": 4, "stem": "목재의 3대 주성분(세포벽 구성 물질)과 그 구성 비율로 옳은 것은?", "options": ["셀룰로오스(약 40~50%), 헤미셀룰로오스(약 20~30%), 리그닌(약 20~30%)", "셀룰로오스(80%), 전분(10%), 펙틴(10%)", "단백질(50%), 지질(30%), 무기질(20%)", "헤미셀룰로오스(70%), 회분(20%), 수지(10%)"], "answer": 0, "explain": "목재 주성분은 셀룰로오스(40~50%), 헤미셀룰로오스(20~30%), 리그닌(20~30%)\n쉬운 풀이: 목재 3대 성분 비율은 셀룰로오스 40~50%, 헤미셀룰로오스 20~30%, 리그닌 20~30%예요. 셀룰로오스가 철근이라면 리그닌은 시멘트처럼 섬유를 붙잡아 주는 역할이에요.\n용어 풀이:\n· 셀룰로오스: 섬유 성분\n· 헤미셀룰로오스: 셀룰로오스와 함께 있는 탄수화물\n· 리그닌: 접착 성분", "ref": "목재화학"}, {"id": "임산가공-71", "subject": "임산가공", "num": 71, "part": 4, "stem": "목재의 내부 결함(내부 썩음, 옹이, 공동)을 원목을 자르지 않고 외부에서 초음파나 충격 탄성파의 전파 속도로 진단하는 검사법은?", "options": ["비파괴 검사법(Non-destructive testing)", "화학 침출법", "인열 검사", "소각 분석"], "answer": 0, "explain": "음파나 초음파는 건강하고 단단한 목재일수록 속도가 빠르고, 썩은 부위를 만나면 속도가 급격히 느려지는 원리를 이용한 비파괴 검사입니다.\n쉬운 풀이: 소리(음파·초음파)는 단단한 나무 속에선 빠르고, 썩거나 빈 곳을 만나면 느려져요. 이 원리로 나무를 자르지 않고 속의 썩음·빈 곳을 찾아내는 게 비파괴 검사예요.\n용어 풀이:\n· 비파괴 검사: 재료를 부수지 않고 하는 검사\n· 탄성파: 물체를 통해 전달되는 진동파\n· 공동: 속이 빈 곳", "ref": "목재물리학"}, {"id": "임산가공-72", "subject": "임산가공", "num": 72, "part": 4, "stem": "제재목을 나뭇결 방향이 서로 직교(90도)하도록 층층이 쌓아 접착하여 두껍고 거대한 구조용 목재 판을 만들어 10층 이상의 고층 목조건축에 사용되는 최첨단 공학목재는?", "options": ["CLT (Cross-Laminated Timber, 구조용 직교 집성판)", "합판", "파티클보드", "MDF"], "answer": 0, "explain": "CLT는 제재목을 직교 적층하여 콘크리트 판처럼 높은 강도를 내며 고층 목조건축의 혁신 재료로 각광받고 있습니다.\n쉬운 풀이: CLT는 제재목을 결이 직각으로 엇갈리게 층층이 쌓아 붙인 두꺼운 구조용 판이에요. 콘크리트 판처럼 튼튼해서 10층 넘는 목조 건물에도 써요. '직교 적층 = CLT, 평행 적층 = 집성재'.\n용어 풀이:\n· CLT(구조용 직교 집성판): 직교 적층한 대형 목재 판\n· 고층 목조건축: 나무로 지은 높은 건물", "ref": "목조건축공학"}, {"id": "임산가공-73", "subject": "임산가공", "num": 73, "part": 4, "stem": "목재 펠릿(Wood pellet) 제조 시 톱밥 자체에 함유되어 있어 별도의 인공 화학 접착제를 넣지 않아도 고온·고압 압출 시 천연 바인더 역할을 하는 목재 성분은?", "options": ["리그닌(Lignin)", "셀룰로오스", "헤미셀룰로오스", "수지"], "answer": 0, "explain": "리그닌은 약 80~100℃의 열과 압력을 받으면 연화되어 끈적끈적해져 톱밥을 단단히 결합시키는 천연 접착제 역할을 합니다.\n쉬운 풀이: 목재 펠릿은 접착제를 따로 안 넣어도 단단히 뭉쳐요. 고온·고압에서 톱밥 속 리그닌이 녹아 끈끈해지며 천연 접착제 역할을 하기 때문이에요.\n용어 풀이:\n· 리그닌: 열을 받으면 연해지는 목재 성분\n· 바인더: 접착제 역할 물질\n· 압출: 눌러서 밀어냄", "ref": "바이오에너지학"}, {"id": "임산가공-74", "subject": "임산가공", "num": 74, "part": 4, "stem": "펄프 제조 공정에서 화학펄프 속에 남아있는 잔류 리그닌의 함량을 측정하여 표백에 필요한 화학 약품의 양을 결정하는 척도는?", "options": ["카파값(Kappa number)", "산가", "요오드가", "비누화값"], "answer": 0, "explain": "카파값(Kappa number)은 펄프 속 리그닌 잔여량을 나타내며, 수치가 낮을수록 리그닌이 잘 제거된 고급 펄프입니다.\n쉬운 풀이: 화학펄프에도 리그닌이 조금 남아 있어 누런색을 띠어요. 카파값은 이 남은 리그닌 양을 나타내는 숫자로, 표백약을 얼마나 쓸지 정할 때 써요. 낮을수록 리그닌이 잘 빠진 좋은 펄프예요.\n용어 풀이:\n· 카파값(Kappa number): 펄프 잔류 리그닌 지표\n· 표백: 하얗게 만듦\n· 잔류: 남아 있음", "ref": "펄프제지공학"}, {"id": "임산가공-75", "subject": "임산가공", "num": 75, "part": 4, "stem": "산림바이오매스 에너지 이용 시 목재 칩이나 펠릿의 품질 등급을 결정하는 가장 중요한 물리적 인자는?", "options": ["함수율 및 회분(재) 함량", "원목의 색상", "껍질의 광택", "단판의 무늬"], "answer": 0, "explain": "함수율(수분)이 낮아야 발열량이 높고, 연소 후 남는 찌꺼기인 회분(재)이 적어야 보일러를 망가뜨리지 않습니다.\n쉬운 풀이: 연료용 칩·펠릿의 품질은 함수율과 회분(재)이 핵심이에요. 물이 적어야 잘 타고 열을 많이 내며, 재가 적어야 보일러가 막히거나 고장 나지 않아요.\n용어 풀이:\n· 회분: 타고 남은 재\n· 발열량: 탈 때 나오는 열량\n· 칩: 잘게 부순 목재", "ref": "목재펠릿품질규격고시"}, {"id": "임산가공-76", "subject": "임산가공", "num": 76, "part": 4, "stem": "목재 방부 처리 시 밀폐 가압탱크 내에서 목재에 초기 진공을 걸지 않고 곧바로 방부액을 고압 주입한 후 나중에 진공을 걸어 여분의 약액을 회수하는 공정은?", "options": ["루핑법 (Empty-cell process)", "베델법 (Full-cell process)", "침지법", "온냉욕법"], "answer": 0, "explain": "루핑법(Empty-cell)은 세포벽에만 방부제를 묻히고 세포 내강의 약제는 회수하여 방부제 소모를 아끼는 경제적 방법입니다.\n쉬운 풀이: 루핑법은 방부액을 압력으로 넣은 뒤 진공으로 남는 약을 다시 빨아내서, 세포벽에만 약을 묻히고 빈 공간의 약은 회수해요(Empty-cell). 약을 아끼는 경제적인 방법이에요. 베델법은 처음에 진공을 걸어 세포 안까지 약을 꽉 채워요(Full-cell).\n용어 풀이:\n· 루핑법(Empty-cell): 세포벽에만 방부제를 남기는 가압법\n· 베델법(Full-cell): 세포 안까지 채우는 가압법\n· 가압: 압력을 가함", "ref": "목재보존학"}, {"id": "임산가공-77", "subject": "임산가공", "num": 77, "part": 4, "stem": "합판을 만들기 위해 거대한 통나무를 고속 회전시키며 얇은 단판(베니어)을 깎아낼 때 사용하는 대형 기계는?", "options": ["로터리 레이스 (Rotary lathe)", "체인소", "밴드쏘", "갱쏘"], "answer": 0, "explain": "통나무를 두루마리 휴지 풀듯 얇게 깎아내는 합판용 핵심 장비는 로터리 레이스(Rotary lathe)입니다.\n쉬운 풀이: 로터리 레이스는 통나무를 축에 끼워 빠르게 돌리면서 칼날로 두루마리 휴지 풀듯 얇은 단판을 길게 깎아 내는 기계예요. 합판 만들기의 첫 단계예요.\n용어 풀이:\n· 로터리 레이스(Rotary lathe): 원목 회전 절삭기\n· 단판(베니어): 얇게 깎은 나무판\n· 절삭: 깎아 냄", "ref": "합판제조학"}, {"id": "임산가공-78", "subject": "임산가공", "num": 78, "part": 4, "stem": "침엽수 목재의 횡단면(단면) 관찰 시 수직방향으로 송진(레진)이 흐르는 수지구가 존재하는 대표적인 수종 군은?", "options": ["소나무속, 낙엽송속, 가문비나무속", "주목, 편백, 삼나무", "참나무, 밤나무", "자작나무, 단풍나무"], "answer": 0, "explain": "· 소나무, 잣나무, 낙엽송, 가문비나무는 수지구(Resin canal)가 정상적으로 발달해 송진을 분비합니다.\n· (주목, 전나무, 편백은 정상 수지구가 없음)\n쉬운 풀이: 소나무·잣나무·낙엽송·가문비나무는 송진이 흐르는 통로(수지구)가 있어요. 그래서 이 나무들을 자르면 송진이 나와요. 주목·전나무·편백은 정상적인 수지구가 없어요.\n용어 풀이:\n· 수지구(Resin canal): 송진이 흐르는 통로\n· 송진(레진): 침엽수의 끈적한 수지", "ref": "목재해부학"}, {"id": "임산가공-79", "subject": "임산가공", "num": 79, "part": 4, "stem": "목조건축에서 대형 화재 발생 시 두꺼운 기둥이나 보의 표면이 불에 타면서 탄화층(숯)을 형성하여 내부로 산소와 열이 전달되는 것을 차단하는 현상은?", "options": ["탄화 단열 효과 (Charring effect)", "융해 현상", "증발 잠열", "산화 폭발"], "answer": 0, "explain": "두꺼운 목재는 표면이 타면서 생긴 숯(탄화층)이 뛰어난 단열재 역할을 하여 내부 목재의 강도를 오랫동안 유지합니다.\n쉬운 풀이: 두꺼운 목재 기둥은 불이 나면 겉이 타며 숯층이 생기는데, 이 숯층이 단열재처럼 열과 산소를 막아 속은 오래 멀쩡해요. 그래서 굵은 목구조는 생각보다 불에 오래 버텨요. 철은 열에 휘지만 굵은 목재는 겉만 타요.\n용어 풀이:\n· 탄화층: 타서 생긴 숯층\n· 단열: 열을 막음\n· 목조건축: 나무로 지은 건물", "ref": "목조건축안전"}, {"id": "임산가공-80", "subject": "임산가공", "num": 80, "part": 4, "stem": "목재 섬유(Cellulose)를 나노 단위(10억분의 1m)로 잘게 쪼개어 강철보다 5배 강하고 무게는 1/5에 불과한 미래형 바이오 신소재는?", "options": ["CNF (Cellulose Nano Fiber, 나노셀룰로오스)", "리그닌 수지", "파티클보드", "목초액"], "answer": 0, "explain": "친환경 나노셀룰로오스(CNF)는 자동차 경량화 부품, 전자 디스플레이, 배터리 분리막 등에 쓰이는 미래 친환경 소재입니다.\n쉬운 풀이: 나노셀룰로오스(CNF)는 목재 섬유를 10억분의 1m 단위까지 잘게 쪼갠 신소재예요. 아주 가볍고 강해서 자동차 부품, 디스플레이, 배터리 분리막 등에 쓰일 미래 소재예요.\n용어 풀이:\n· CNF(셀룰로오스 나노섬유): 나노 크기로 쪼갠 셀룰로오스\n· 나노: 10억분의 1\n· 신소재: 새로 개발된 재료", "ref": "첨단임산화학"}, {"id": "임산가공-81", "subject": "임산가공", "num": 81, "part": 4, "stem": "침엽수재와 활엽수재의 해부학적 구조 차이에 대한 설명으로 옳은 것은?", "options": ["침엽수는 도관(Vessel)이 발달하여 수액을 이동시킨다.", "침엽수재의 부피 90~95%는 가도관(Tracheid)으로 구성되어 통도와 지지 기능을 겸한다.", "활엽수재는 가도관이 주된 세포이다.", "침엽수재가 활엽수재보다 세포의 구성 종류가 훨씬 복잡하다."], "answer": 1, "explain": "침엽수는 구조가 단순하여 부피의 90% 이상이 '가도관(헛물관)'으로 이루어져 통도와 지지를 모두 담당하며, 활엽수는 수액 통도를 전담하는 '도관'과 지지를 전담하는 '목섬유'로 분화되어 구조가 복잡합니다.\n쉬운 풀이: 침엽수는 구조가 단순해서 부피의 90% 이상이 가도관 하나로 이뤄지고, 이 세포가 물 운반과 지탱을 다 해요. 활엽수는 물 운반은 도관, 지탱은 목섬유로 역할을 나눠서 구조가 더 복잡해요.\n용어 풀이:\n· 가도관: 침엽수 주요 세포\n· 도관: 활엽수 물 운반 세포\n· 목섬유: 활엽수 지지 세포", "ref": "목재해부학"}, {"id": "임산가공-82", "subject": "임산가공", "num": 82, "part": 4, "stem": "수목의 줄기 단면에서 중심부에 위치하며 짙은 색을 띠고 추출물이 축적되어 내구성이 높은 부위는?", "options": ["변재(Sapwood)", "심재(Heartwood)", "형성층", "수피"], "answer": 1, "explain": "심재(Heartwood)는 죽은 유조직 세포에 페놀, 탄닌, 수지 등 추출물이 침착되고 도관 내에 타일로시스(Tylosis)가 형성되어 방부성, 내충성이 강하고 짙은 색을 띱니다.\n쉬운 풀이: 줄기 중심의 짙은 부분이 심재예요. 죽은 세포에 페놀·탄닌·수지 같은 성분이 쌓이고 물관이 타일로시스로 막혀서 잘 썩지 않고 벌레도 덜 먹어요.\n용어 풀이:\n· 심재: 중심부의 짙고 단단한 목재\n· 변재: 바깥쪽 살아 있는 연한 목재\n· 타일로시스: 도관을 막는 조직", "ref": "목재물리학"}, {"id": "임산가공-83", "subject": "임산가공", "num": 83, "part": 4, "stem": "목재 2차 세포벽(Secondary wall)의 세 층(S1, S2, S3) 중 두께가 가장 두껍고 미세섬유 경사각이 축 방향과 거의 나란하여 목재의 세로 인장강도와 역학적 특성을 지배하는 층은?", "options": ["S1층 (외층)", "S2층 (중층)", "S3층 (내층)", "복합세포간층"], "answer": 1, "explain": "2차벽의 중층인 S2층은 2차벽 두께의 약 80%를 차지하며 셀룰로오스 미세섬유가 세포 장축과 10~30도의 작은 각도로 평행하게 배열되어 있어 목재의 강도와 물리적 성질을 결정합니다.\n쉬운 풀이: 세포벽 2차벽은 S1·S2·S3 세 층인데, 가운데 S2층이 두께의 약 80%로 가장 두꺼워요. 섬유가 세포 길이 방향과 거의 나란히 놓여 있어 목재의 강도를 좌우해요.\n용어 풀이:\n· 2차벽: 세포가 다 자란 뒤 안쪽에 생기는 두꺼운 벽\n· 미세섬유: 셀룰로오스 가는 섬유\n· 경사각: 섬유가 기울어진 각도", "ref": "목재이학"}, {"id": "임산가공-84", "subject": "임산가공", "num": 84, "part": 4, "stem": "목재가 특정 온습도 조건의 공기 중에 장시간 노출되었을 때 목재 내부의 수분과 대기 중의 습도가 평형을 이루어 더 이상 수분의 출입이 없는 상태의 함수율은?", "options": ["섬유포화점(FSP)", "평형함수율(EMC, Equilibrium moisture content)", "전건함수율", "포화함수율"], "answer": 1, "explain": "· 목재는 흡습성 재료이므로 주위 공기의 상대습도와 온도에 따라 수분을 흡수하거나 방출하며, 대기와 평형에 도달한 함수율을 평형함수율(EMC)이라 합니다.\n· (우리나라 대기 EMC는 평균 12~14%)\n쉬운 풀이: 목재는 주변 공기가 습하면 물을 먹고, 건조하면 물을 내보내요. 결국 공기와 균형을 이뤄 더 이상 변하지 않는 함수율이 평형함수율(EMC)이에요. 우리나라 공기 중에선 평균 12~14%예요.\n용어 풀이:\n· 평형함수율(EMC): 주변과 균형을 이룬 함수율\n· 흡습성: 물을 빨아들이는 성질", "ref": "목재건조학"}, {"id": "임산가공-85", "subject": "임산가공", "num": 85, "part": 4, "stem": "목재 건조 시 수축률의 이방성(접선방향 : 방사방향 : 섬유방향 = 약 10 : 5 : 1)으로 인해 발생하는 대표적인 건조 결함이 **아닌** 것은?", "options": ["넙죽임(다이아몬딩)", "배굽음(보잉)", "찌그러짐(붕괴, Collapse)", "변재의 청변(청변균 감염)"], "answer": 3, "explain": "청변(Blue stain)은 곰팡이류의 균사가 변재 유조직에 침입하여 착색을 일으키는 생물학적 결함이며, 수축률 차이에 의한 물리적 건조 결함이 아닙니다.\n쉬운 풀이: 방향마다 줄어드는 정도가 달라서 생기는 결함은 넙죽임(다이아몬드 모양 변형), 배굽음(활처럼 휨), 찌그러짐 등이에요. 청변은 곰팡이가 목재를 파랗게 물들이는 '생물'에 의한 결함이라 해당하지 않아요.\n용어 풀이:\n· 이방성: 방향에 따라 성질이 다름\n· 청변: 곰팡이로 목재가 푸르게 변색\n· 배굽음(보잉): 길이 방향으로 활처럼 휨", "ref": "목재건조학"}, {"id": "임산가공-86", "subject": "임산가공", "num": 86, "part": 4, "stem": "건조실 내부의 온도와 습도를 인위적으로 정밀하게 조절하여 목재 내부의 건조응력을 완화시키면서 신속하게 건조하는 현대 인공건조법의 표준 방식은?", "options": ["증기 가열식 제어 건조(증기건조)", "노지 천연건조", "수침건조", "퇴비건조"], "answer": 0, "explain": "증기식 인공건조실은 보일러 증기와 송풍팬, 분무노즐을 이용하여 건조 스케줄표(온·습도 단계)에 따라 목재 손상(할렬)을 최소화하며 단기간에 건조하는 가장 널리 쓰이는 방식입니다.\n쉬운 풀이: 증기식 인공건조실은 보일러 증기·송풍기·물 분무 장치로 온도와 습도를 정밀하게 조절해요. 건조 스케줄에 따라 단계별로 조건을 바꿔 갈라짐 없이 빠르게 말릴 수 있어 가장 널리 써요.\n용어 풀이:\n· 인공건조: 기계로 온습도를 조절해 말리는 방법\n· 천연건조: 자연 공기로 말리는 방법\n· 건조응력: 건조 중 생기는 내부 힘", "ref": "목재가공건조학"}, {"id": "임산가공-87", "subject": "임산가공", "num": 87, "part": 4, "stem": "목재의 기본 외력 방향에 따른 역학적 강도 크기 순서로 옳은 것은?", "options": ["인장강도 > 휨강도 > 압축강도 > 전단강도", "전단강도 > 압축강도 > 휨강도 > 인장강도", "압축강도 > 인장강도 > 전단강도 > 휨강도", "휨강도 > 전단강도 > 인장강도 > 압축강도"], "answer": 0, "explain": "목재는 섬유 주향 방향의 세로 '인장강도'가 가장 크고, 그다음이 보(Beam)로 쓰일 때의 '휨강도', 기둥으로 쓰일 때의 '압축강도' 순이며, 섬유를 따라 미끄러지는 '전단강도'가 가장 약합니다.\n쉬운 풀이: 목재는 결 방향으로 당기는 인장강도가 가장 세고, 그다음 휘는 힘에 견디는 휨강도, 누르는 압축강도 순이에요. 결을 따라 미끄러지는 전단강도가 가장 약해요. 그래서 도끼로 결을 따라 쪼개면 쉽게 갈라져요.\n용어 풀이:\n· 인장강도: 당기는 힘에 견딤\n· 휨강도: 굽히는 힘에 견딤\n· 압축강도: 누르는 힘에 견딤\n· 전단강도: 어긋나는 힘에 견딤", "ref": "목재역학"}, {"id": "임산가공-88", "subject": "임산가공", "num": 88, "part": 4, "stem": "목재를 밀폐된 탄화로에서 공기 공급을 제한하고 가열할 때 발생하는 부산물 중 연기를 냉각하여 액화·정제한 산성 액체는?", "options": ["목초액(Wood vinegar)", "테레빈유", "리그닌", "펄프"], "answer": 0, "explain": "숯(목탄)을 구울 때 연기 중의 타르와 수증기를 포집·냉각하여 숙성 분리한 액체를 '목초액'이라 하며, 초산 성분이 풍부하여 항균 및 토양개량제로 쓰입니다.\n쉬운 풀이: 숯을 구울 때 나오는 연기를 차갑게 식히면 액체가 돼요. 이걸 숙성·정제한 게 목초액이에요. 초산(식초 성분)이 많아 산성이고, 항균·토양개량제로 써요.\n용어 풀이:\n· 목초액: 숯 연기를 액화한 산성 액체\n· 초산: 식초의 주성분\n· 탄화로: 숯을 만드는 가마", "ref": "임산화학"}, {"id": "임산가공-89", "subject": "임산가공", "num": 89, "part": 4, "stem": "합판(Plywood) 제조 시 원목을 회전축에 물리고 칼날을 밀어붙여 두루마리 휴지처럼 넓고 긴 단판(Veneer)을 깎아내는 대표적인 박판 절삭기계는?", "options": ["로터리 레이스(Rotary lathe)", "슬라이서(Slicer)", "갱소(Gang saw)", "밴드소(띠톱)"], "answer": 0, "explain": "· 합판용 단판(베니어)의 90% 이상은 통나무를 회전시키며 연속 절삭하는 로터리 레이스(Rotary lathe)로 생산됩니다.\n· 슬라이서는 무늬목 단판 절삭에 쓰입니다.\n쉬운 풀이: 로터리 레이스는 통나무를 돌리며 칼날을 대어 두루마리처럼 넓고 긴 단판을 깎아내요. 합판 단판의 90% 이상을 이 방법으로 만들어요. 무늬목은 통나무를 앞뒤로 얇게 저미는 슬라이서로 만들어요.\n용어 풀이:\n· 로터리 레이스: 회전 절삭기\n· 슬라이서: 평평하게 저미는 절삭기\n· 무늬목: 무늬가 고운 얇은 장식용 판", "ref": "목질복합재료학"}, {"id": "임산가공-90", "subject": "임산가공", "num": 90, "part": 4, "stem": "목재 잔재나 삭편(Chip)을 고온고압에서 해섬하여 미세한 단섬유로 분리한 후 합성수지 접착제와 혼합하여 성형·열압한 보드는?", "options": ["중밀도섬유판(MDF, Medium density fiberboard)", "파티클보드(PB)", "합판", "집성재"], "answer": 0, "explain": "삭편(부스러기)을 접착한 것은 파티클보드(PB)이며, 고온 해섬기(Defibrator)로 목재 섬유(Fiber) 단위까지 해섬하여 제조한 균질한 판재는 섬유판(MDF)입니다.\n쉬운 풀이: 나무 조각(삭편)을 붙이면 파티클보드, 나무를 고온·고압으로 풀어 실 같은 섬유로 만든 뒤 붙이면 MDF(중밀도섬유판)예요. MDF는 표면이 매끈하고 고르게 가공돼 가구에 많이 써요.\n용어 풀이:\n· MDF: 중밀도 섬유판\n· 해섬: 목재를 섬유 단위로 풀어 냄\n· 열압: 열과 압력으로 누름", "ref": "목질판상재료학"}, {"id": "임산가공-91", "subject": "임산가공", "num": 91, "part": 4, "stem": "야외 데크재나 침목 등 고도의 내구성이 요구되는 목재에 방부제를 주입할 때, 주입관 내부를 진공으로 만들어 목재 세포 내 공기를 배출한 후 방부액을 채우고 높은 압력을 가하는 가압주입법은?", "options": ["전세포법(Bethell 공정)", "침지법", "도포법", "훈증법"], "answer": 0, "explain": "베델(Bethell)법은 초기 진공으로 세포 내강의 공기를 완전히 뽑아낸 후 가압하여 세포 내강까지 방부제를 100% 충전하는 대표적인 전세포 가압주입 공정입니다.\n쉬운 풀이: 베델법은 먼저 진공으로 목재 세포 속 공기를 빼낸 뒤 방부액을 넣고 강하게 압력을 가해, 세포 빈 공간까지 약을 꽉 채우는 방법(전세포법)이에요. 철도 침목·데크처럼 아주 오래 버텨야 하는 곳에 써요.\n용어 풀이:\n· 베델법(Full-cell): 진공 후 가압해 세포를 약으로 채우는 방법\n· 가압주입: 압력으로 약을 넣음\n· 침목: 철로 아래 받침목", "ref": "목재보존학"}, {"id": "임산가공-92", "subject": "임산가공", "num": 92, "part": 4, "stem": "목재를 산소가 차단된 환경에서 180~220℃의 고온으로 열처리하여 친환경적으로 치수안정성과 내후성을 획기적으로 향상시킨 목재는?", "options": ["열처리 목재(Thermally modified wood)", "가압 방부목", "표백 목재", "압축 목재"], "answer": 0, "explain": "고온 열처리를 거치면 목재 내의 흡습성분인 헤미셀룰로오스가 분해되어 평형함수율이 절반으로 떨어지고 치수안정성과 목재부후균에 대한 저항성이 크게 향상됩니다.\n쉬운 풀이: 산소를 막고 180~220℃로 목재를 구우면, 물을 잘 빨아들이는 헤미셀룰로오스가 분해돼요. 그래서 물을 덜 먹어 덜 틀어지고(치수안정성) 썩는 균에도 강해져요. 약품 없이 열만 써서 친환경이에요.\n용어 풀이:\n· 열처리 목재: 고온 처리로 성질을 바꾼 목재\n· 치수안정성: 크기가 변하지 않는 성질\n· 내후성: 비·햇빛에 견디는 성질", "ref": "목재물리화학"}, {"id": "임산가공-93", "subject": "임산가공", "num": 93, "part": 4, "stem": "목재 칩을 화학약품 용액(수산화나트륨 및 황화나트륨)과 함께 고온고압으로 증해하여 리그닌을 녹여내고 강도가 우수한 종이 원료를 생산하는 대표적인 화학펄프 공정은?", "options": ["크라프트 펄프(KP, Kraft pulp) 공정", "쇄목 펄프(GP) 공정", "기계 펄프 공정", "아황산 펄프 공정"], "answer": 0, "explain": "황산염 펄프라고도 불리는 크라프트(Kraft) 펄프 공정은 수산화나트륨(NaOH)과 황화나트륨(Na2S) 혼합액을 사용하여 섬유 손상이 적고 강도가 매우 우수한 펄프를 생산합니다.\n쉬운 풀이: 크라프트 펄프는 수산화나트륨+황화나트륨으로 목재 칩을 끓여 리그닌을 녹이는 방법이에요. 섬유가 덜 상해 아주 질긴 종이를 만들어요. 57번과 같은 내용이에요.\n용어 풀이:\n· 크라프트 펄프(황산염 펄프): 대표적 화학펄프\n· 증해: 약품과 함께 끓임\n· 쇄목펄프: 목재를 갈아 만든 기계펄프", "ref": "펄프종이공학"}, {"id": "임산가공-94", "subject": "임산가공", "num": 94, "part": 4, "stem": "산림바이오매스 에너지원으로 활용되는 목재펠릿(Wood pellet)의 표준 제조 공정에서 압축 성형 시 별도의 화학 접착제를 첨가하지 않아도 자체 접착력을 발휘하는 목재 성분은?", "options": ["리그닌(Lignin)", "셀룰로오스", "수분", "회분"], "answer": 0, "explain": "톱밥을 고온·고압으로 압축할 때 목재 세포 간 물질인 리그닌(Lignin)이 열에 의해 연화·용융되면서 천연 바인더(접착제) 역할을 하여 펠릿 형태로 단단히 성형됩니다.\n쉬운 풀이: 펠릿을 만들 때 별도 접착제가 필요 없는 이유는 리그닌 때문이에요. 고온·고압에서 리그닌이 녹아 끈끈해지며 톱밥 알갱이를 서로 붙여 줘요. 73번과 같은 원리예요.\n용어 풀이:\n· 리그닌: 열에 연화되는 접착 성분\n· 바인더: 결합제\n· 성형: 모양을 만듦", "ref": "바이오매스에너지학"}, {"id": "임산가공-95", "subject": "임산가공", "num": 95, "part": 4, "stem": "목재의 3대 주성분(셀룰로오스, 헤미셀룰로오스, 리그닌) 중 전체 건조 중량의 약 40~50%를 차지하며 포도당(Glucose)이 β-1,4 결합으로 길게 연결된 결정성 고분자 물질은?", "options": ["셀룰로오스(Cellulose)", "리그닌", "펙틴", "수지"], "answer": 0, "explain": "셀룰로오스는 목재 세포벽 골격을 이루는 주성분으로 목재 건중량의 40~50%를 차지하며, 헤미셀룰로오스는 약 20~30%, 방향족 고분자인 리그닌은 20~30%를 차지합니다.\n쉬운 풀이: 셀룰로오스는 포도당이 사슬처럼 길게 이어진 물질로, 목재 무게의 40~50%를 차지하는 세포벽 뼈대예요. 종이와 면직물의 주성분이기도 해요.\n용어 풀이:\n· 셀룰로오스: 포도당 고분자\n· 포도당(Glucose): 기본 당\n· 결정성: 분자가 규칙적으로 배열된 성질", "ref": "목재화학"}, {"id": "임산가공-96", "subject": "임산가공", "num": 96, "part": 4, "stem": "목재 인공건조의 마무리 단계에서 건조 중 형성된 목재 표면과 내부 간의 응력 차이(응력 역전 현상)를 해소하고 할렬을 방지하기 위해 고온다습한 증기를 쐬어주는 공정은?", "options": ["이퀄라이징 및 컨디셔닝(Conditioning)", "예열", "급속 냉각", "박피"], "answer": 0, "explain": "건조 말기에 표면은 압축, 내부는 인장 응력을 받는 잔류 건조응력(Casehardening)을 제거하기 위해 증기를 분사하여 표면을 일시적으로 부드럽게 완화시키는 공정을 '컨디셔닝(조습처리)'이라 합니다.\n쉬운 풀이: 건조가 끝날 무렵엔 겉은 눌리고 속은 당겨지는 힘이 남아 있어요(표면경화). 이때 뜨겁고 습한 증기를 쐬어 겉을 살짝 부드럽게 해 주면 그 힘이 풀려요. 이 마무리 공정이 컨디셔닝(조습처리)이에요.\n용어 풀이:\n· 컨디셔닝(조습처리): 건조 말기 증기로 응력을 푸는 공정\n· 이퀄라이징: 목재별 함수율을 고르게 맞추는 공정\n· 응력: 내부의 힘", "ref": "목재건조학"}, {"id": "임산가공-97", "subject": "임산가공", "num": 97, "part": 4, "stem": "두꺼운 목재 판재를 나뭇결 방향이 서로 직교(90도 교차)하도록 층층이 접착하여 대형 건축물의 벽체 및 슬래브용 구조재로 사용하는 혁신적인 공학목재는?", "opt
