<style>
:root {
  --bg: #f6f7f4; --surface: #ffffff; --surface-2: #eef1ec; --text: #1d2420; --muted: #5d6a62;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --surface: #1c221f; --surface-2: #232b27; --text: #e6ebe7; --muted: #9aa69f;

  }

:root[data-theme="dark"] {
  --bg: #141816; --surface: #1c221f; --surface-2: #232b27; --text: #e6ebe7; --muted: #9aa69f;
  --line: #333d38; --accent: #7cc49a; --accent-soft: #233a2d; --good: #7cc49a; --good-soft: #1f3528;

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
.wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.15rem; margin: 0 0 12px; }
.sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
label.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line);

label.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
label.chip input { accent-color: var(--accent); margin: 0; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); padding: 8px 16px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
button:disabled { opacity: .45; cursor: not-allowed; }
.muted { color: var(--muted); font-size: .9rem; }
.topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);

.topbar .inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; }
.timer.low { color: var(--bad); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button { padding: 6px 12px; font-size: .9rem; }
.tabs button.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.q { padding: 16px 0; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; }

.q .tag { font-size: .78rem; color: var(--muted); margin-left: 6px; font-weight: 400; }
.opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; border-radius: 8px;

.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.explain { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: .93rem; white-space: pre-line; }
.omr { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 8px; }
.omr button { padding: 4px 0; font-size: .78rem; }
.omr button.done { background: var(--accent-soft); border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: .85rem; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.no { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.big { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.hidden { display: none !important; }
select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); }
@media (max-width: 560px) { .omr { grid-template-columns: repeat(5, 1fr); } .big { font-size: 1.8rem; } }
</style>

<script>
const DATA = [{"code": "01", "name": "조림", "kind": "필수", "questions": [{"id": "조림-1", "subject": "조림", "num": 1, "part": 1, "stem": "「지속가능한 산림자원 관리지침」상 ha당 식재본수 기준이 나머지와 다른 수종은?", "options": ["소나무", "편백", "낙엽송", "상수리나무"], "answer": 2, "explain": "낙엽송·잣나무는 ha당 3,000본, 나머지는 5,000본", "ref": "모듈 p.29–30"}, {"id": "조림-2", "subject": "조림", "num": 2, "part": 1, "stem": "조림지 활착률 조사 결과가 65%로 나왔다. 알맞은 조치는?", "options": ["조치 불필요", "보식", "재조림", "풀베기 생략"], "answer": 1, "explain": "80% 미만 보식, 50% 미만 재조림 → 65%는 보식", "ref": "p.33"}, {"id": "조림-3", "subject": "조림", "num": 3, "part": 1, "stem": "사업지 면적 1ha 이상인 조림지의 활착률 조사 표준지 크기로 옳은 것은?", "options": ["100㎡ (반지름 5.67m 원)", "200㎡ (반지름 8.0m 원)", "400㎡ (20m × 20m)", "50㎡ (반지름 4.0m 원)"], "answer": 1, "explain": "200㎡(반지름 8.0m). 1ha 미만이면 100㎡(5.67m) 가능", "ref": "p.149 붙임2"}, {"id": "조림-4", "subject": "조림", "num": 4, "part": 1, "stem": "온대중부 지역의 봄철 식재 적기는?", "options": ["2월 하순 ~ 3월 하순", "3월 상순 ~ 4월 상순", "3월 중순 ~ 4월 중순", "3월 하순 ~ 4월 하순"], "answer": 2, "explain": "난대 2하~3하, 온대남부 3상~4상, 온대중부 3중~4중, 온대북부 3하~4하", "ref": "p.29"}, {"id": "조림-5", "subject": "조림", "num": 5, "part": 1, "stem": "같은 지역에서 표고가 300m 높은 조림지의 침엽수 봄 식재 적기는 어떻게 되는가?", "options": ["약 5일 빨라진다", "약 5일 늦어진다", "약 15일 늦어진다", "약 15일 빨라진다"], "answer": 2, "explain": "표고 100m마다 약 5일 늦어짐 → 300m면 약 15일", "ref": "p.30"}, {"id": "조림-6", "subject": "조림", "num": 6, "part": 1, "stem": "산벌작업의 벌채 순서로 옳은 것은?", "options": ["예비벌 → 하종벌 → 후벌", "하종벌 → 예비벌 → 후벌", "후벌 → 하종벌 → 예비벌", "예비벌 → 후벌 → 하종벌"], "answer": 0, "explain": "산벌 = 예비벌 → 하종벌 → 후벌 (전갱작업)", "ref": "p.34–36"}, {"id": "조림-7", "subject": "조림", "num": 7, "part": 1, "stem": "참나무류 움싹갱신지에서 벌채 후 3년 안에 움싹이 ha당 몇 본 미만이면 조림하는가?", "options": ["900본", "1,600본", "3,000본", "5,000본"], "answer": 2, "explain": "3년 안에 움싹 ha당 3,000본 미만이면 조림", "ref": "p.38–40"}, {"id": "조림-8", "subject": "조림", "num": 8, "part": 1, "stem": "산림자원법상 벌채 후 조림하지 않아도 되는 경우가 **아닌** 것은?", "options": ["어린나무가 ha당 2만본 이상 고르게 자라는 경우", "참나무류 어린나무가 ha당 5천본 이상인 경우", "움싹이 왕성한 참나무류 그루터기가 ha당 90 8"}, {"id": "조림-16", "subject": "조림", "num": 16, "part": 1, "stem": "공·사유림 기준벌기령으로 짝지은 것 중 옳지 **않은** 것은?", "options": ["소나무 – 40년", "잣나무 – 50년", "낙엽송 – 30년", "참나무류 – 40년"], "answer": 3, "explain": "참나무류는 공·사유림 25년(기업경영림 20년)", "ref": "p.151 붙임4"}, {"id": "조림-17", "subject": "조림", "num": 17, "part": 1, "stem": "「산림자원법 시행규칙」 [별표 3](모듈 붙임4)상 모두베기 1개 벌채구역의 최대 면적은?", "options": ["5만㎡", "10만㎡", "30만㎡", "50만㎡"], "answer": 2, "explain": "별표3 기준 최대 30만㎡, 5만㎡ 이상이면 20% 이상 존치. (지침 본문 p.90은 \"모두베기 대상지 최대 50ha 이내\"로 표현이 다르니 지문의 근거를 확인할 것)", "ref": "p.152"}, {"id": "조림-18", "subject": "조림", "num": 18, "part": 1, "stem": "골라베기(택벌)의 벌채 재적 한도는? (표고용 제외)", "options": ["20% 이내", "30% 이내", "40% 이내", "50% 이내"], "answer": 1, "explain": "30% 이내, 표고용은 50%", "ref": "p.152"}, {"id": "조림-19", "subject": "조림", "num": 19, "part": 1, "stem": "[전공서적 범위] 순량률 90%, 발아율 80%인 종자의 효율은?", "options": ["72%", "80%", "85%", "90%"], "answer": 0, "explain": "효율 = 순량률 × 발아율 = 0.9 × 0.8 = 72%", "ref": "산림기사 조림학"}, {"id": "조림-20", "subject": "조림", "num": 20, "part": 1, "stem": "목재생산림의 목표생산재 중 대경재의 가슴높이지름 기준은?", "options": ["20cm 이상", "30cm 이상", "36cm 이상", "40cm 이상"], "answer": 3, "explain": "대경재 40cm 이상, 중경재 20~40cm, 소경재 20cm 미만", "ref": "p.8–9"}, {"id": "조림-21", "subject": "조림", "num": 21, "part": 2, "stem": "수원함양림에서 솎아베기를 할 때 유지하는 수관울폐도의 원칙은?", "options": ["30~50%", "50~80%", "80~90%", "90% 이상"], "answer": 1, "explain": "수원함양림 솎아베기는 수관울폐도 50~80% 유지가 원칙", "ref": "모듈 p.12"}, {"id": "조림-22", "subject": "조림", "num": 22, "part": 2, "stem": "수원함양림의 덩굴제거에서 약제를 쓰지 않고 인력으로만 제거해야 하는 범위는? (하천·계곡 홍수위, 호소 만수위 등 수계 기준)", "options": ["30m 이내", "50m 이내", "100m 이내", "200m 이내"], "answer": 2, "explain": "수계로부터 100m 이내 또는 집수유역 안은 인력 제거", "ref": "p.11"}, {"id": "조림-23", "subject": "조림", "num": 23, "part": 2, "stem": "산지재해방지림 중 사방지 조림수종으로 권장되는 질소고정 수종이 **아닌** 것은?", "options": ["오리나무", "아까시나무", "싸리나무", "잣나무"], "answer": 3, "explain": "사방지는 오리나무·아까시나무·싸리나무 등 질소고정 수종 + 속성수 혼합", "ref": "p.13"}, {"id": "조림-24", "subject": "조림", "num": 2 도", "광합성량이 최대가 되는 광도", "잎이 타기 시작하는 광도", "음수가 양수보다 광보상점이 높다"], "answer": 0, "explain": "· 광합성 = 호흡인 광도\n· 음수가 양수보다 낮다", "ref": "수목생리학"}, {"id": "조림-47", "subject": "조림", "num": 47, "part": 3, "stem": "묘목의 T/R률에 대한 설명으로 옳은 것은?", "options": ["묘목의 수고를 근원경으로 나눈 값으로, 클수록 좋다", "지하부 무게를 지상부 무게로 나눈 값이다", "지상부 무게를 지하부 무게로 나눈 값으로, 값이 작을수록 뿌리가 발달한 건전한 묘목이다", "질소 비료를 많이 주면 작아진다"], "answer": 2, "explain": "· T/R률 = 지상부 ÷ 지하부, 작을수록 건전\n· 질소 과다 시 커짐", "ref": "묘포학"}, {"id": "조림-48", "subject": "조림", "num": 48, "part": 3, "stem": "묘목 표시 '1-1묘'의 뜻은?", "options": ["파종상 1년, 묘령 1년", "파종상 1년 + 이식상 1년, 2년생 묘목", "접목 후 1년, 이식 후 1년, 3년생 묘목", "삽목 1년생"], "answer": 1, "explain": "앞 숫자 파종상 연수, 뒤 숫자 이식상 연수 → 2년생", "ref": "묘포학"}, {"id": "조림-49", "subject": "조림", "num": 49, "part": 3, "stem": "개벌작업의 단점으로 옳은 것은?", "options": ["작업이 복잡하고 비용이 많이 든다", "음수 수종 갱신에만 쓸 수 있다", "임지가 노출되어 토양 침식과 지력 저하가 생기기 쉽다", "벌채 목재 품질이 고르지 않다"], "answer": 2, "explain": "개벌은 작업이 간편하고 양수 갱신에 유리하지만, 임지 노출로 침식·지력 저하", "ref": "조림학"}, {"id": "조림-50", "subject": "조림", "num": 50, "part": 3, "stem": "일반적인 인공림 숲가꾸기의 작업 순서로 옳은 것은?", "options": ["풀베기 → 덩굴제거 → 어린나무가꾸기 → 솎아베기", "솎아베기 → 어린나무가꾸기 → 풀베기 → 덩굴제거", "어린나무가꾸기 → 풀베기 → 솎아베기 → 덩굴제거", "덩굴제거 → 솎아베기 → 풀베기 → 어린나무가꾸기"], "answer": 0, "explain": "숲가꾸기 표준교재 순서: 풀베기 → 덩굴제거 → 어린나무가꾸기 → (가지치기) → 솎아베기", "ref": "숲가꾸기 표준교재"}, {"id": "조림-51", "subject": "조림", "num": 51, "part": 4, "stem": "수목 잎의 엽록소 구성 성분이며 결핍 시 오래된 잎부터 황화현상(Chlorosis)이 일어나는 무기양분은?", "options": ["질소(N)", "마그네슘(Mg)", "철(Fe)", "칼슘(Ca)"], "answer": 1, "explain": "엽록소 중심 원소는 마그네슘(Mg)이며, 이동성이 좋아 결핍 시 늙은 잎부터 황화현상 발생 (질소도 황화현상이 있으나 엽록소의 중심핵은 마그네슘)", "ref": "수목생리학"}, {"id": "조림-52", "subject": "조림", "num": 52, "part": 4, "stem": "수목의 직경 생장 시 봄철에 형성되는 춘재(조재)와 여름·가을에 형성되는 만재(만재)에 대한 설명으로 옳은 것은?", "options": ["춘재는 세포벽이 두껍고 내강이 좁아 색이 짙다", "만재는 가도관의 직경이 크고 유조직이 풍부하다", "춘재는 세포분열이 왕성하여 세포벽이 얇고 색이 연하다", "만재의 비율이 높을수록 목재의 비중과 강도가 낮아진다"], "answer": 2, "explain": "· 춘재는 생장이 왕성하여 가도관 직경이 크고 벽이 얇으며 색이 연함\n· 만재는 세포벽이 두껍고 치밀하여 색이 짙음", "ref": "목재이학"}, {"id": "조림-53", "subject": "조림", "num": 53, "part": 4, "stem": "채종원(Seed orchard) 조성 시 외부 불량 화분의 유입을 막기 위한 최소 격리대(차단대) 폭 기준은? (소나무류 기준)", "options": ["50m", "100m", "300m", "500m"], "answer": 3, "explain": "채종원의 격리대 폭은 외부 불량 화분 차단을 위해 소나무류 500m 이상, 낙엽송 300m 이상", "ref": "종자생산학"}, {"id": "조림-54", "subject": "조림", "num": 54, "part": 4, "stem": "묘목 생산을 위한 삽목(꺾꽂이) 시 부정근 발근을 촉진하기 위해 처리하는 대표적인 식물호르몬은?", "options": ["지베렐린(GA)", "옥신(IBA, NAA)", "시토키닌", "아브시스산(ABA)"], "answer": 1, "explain": "· 옥신류(IBA, NAA)는 부정근 형성 촉진\n· 지베렐린은 신장 생장\n· 시토키닌은 세포분열 촉진", "ref": "식물생리학"}, {"id": "조림-55", "subject": "조림", "num": 55, "part": 4, "stem": "종자의 발아력 검사법 중 살아있는 배(Embryo)의 호흡 효소 작용으로 무색의 시약이 붉은색(포르마잔)으로 염색되는 원리를 이용한 생화학적 검정법은?", "options": ["환원테트라졸륨법(TTC 검정)", "절단법", "X선 검사법", "전기전도도법"], "answer": 0, "explain": "환원 테트라졸륨(TTC)이 배의 탈수소효소와 반응하여 적색의 포르마잔으로 환원됨", "ref": "종자검사학"}, {"id": "조림-56", "subject": "조림", "num": 56, "part": 4, "stem": "다음 중 뿌리에 외생균근(Ectomycorrhiza)을 형성하여 영양분 흡수를 돕는 대표적인 임목 과(Family)는?", "options": ["단풍나무과", "물푸레나무과", "소나무과", "콩과"], "answer": 2, "explain": "소나무과, 참나무과, 자작나무과는 대표적인 외생균근 형성 수종", "ref": "산림미생물학"}, {"id": "조림-57", "subject": "조림", "num": 57, "part": 4, "stem": "크래프트(Kraft) 수관급 분류에서 수관이 임관의 상층을 차지하고 이웃 나무의 압박을 받지 않는 가장 우수한 나무의 수관급은?", "options": ["제1급 우세목", "제2급 준우세목", "제3급 중간목", "제4급 피압목"], "answer": 0, "explain": "제1급 우세목(Dominant tree)은 임관 최상층을 형성하며 생육이 가장 왕성한 목", "ref": "조림학본론"}, {"id": "조림-58", "subject": "조림", "num": 58, "part": 4, "stem": "침엽수 중 특이하게 줄기 밑동이나 줄기에서 맹아(부정아)가 왕성하게 돋아나 맹아갱신이 가능한 수종은?", "options": ["잣나무", "전나무", "낙엽송", "리기다소나무"], "answer": 3, "explain": "리기다소나무는 맹아력이 강해 원줄기나 그루터기에서 맹아가 돋아남 (방화선, 척박지 조림)", "ref": "조림수종학"}, {"id": "조림-59", "subject": "조림", "num": 59, "part": 4, "stem": "종자 결실을 촉진하기 위해 줄기 수피의 체관부를 띠 모양으로 벗겨 탄수화물이 뿌리로 내려가는 것을 일시 차단하는 방법은?", "options": ["단근작업", "환상박피", "적심", "맹아제거"], "answer": 1, "explain": "환상박피(Girdling)는 체관부를 고리 모양으로 박피하여 광합성 산물의 하향 이동을 막아 결실 유도", "ref": "수목생리학"}, {"id": "조림-60", "subject": "조림", "num": 60, "part": 4, "stem": "택벌작업에서 1회 벌채 시 벌채량(택벌률)과 다음 벌채까지 걸리는 기간(택벌회기)에 대한 설명으로 옳은 것은?", "options": ["택벌회기가 길수록 1회 택벌률을 낮추어야 한다", "택벌회기가 짧을수록 1회 택벌률을 높여야 한다", "택벌회기가 길수록 1회 택벌률을 높일 수 있다", "택벌률은 법정축적과 무관하게 항상 80% 이상 적용한다"], "answer": 2, "explain": "택벌회기(간격)가 길면 그동안 자란 양이 많으므로 1회 벌채량(택벌률)을 높일 수 있음", "ref": "산림경영학"}, {"id": "조림-61", "subject": "조림", "num": 61, "part": 4, "stem": "파종상에서 묘목의 웃자람을 방지하고 잔뿌리 발달을 유도하기 위해 삽이나 전용 칼로 묘목의 주근(원뿌리)을 잘라주는 작업은?", "options": ["단근(Root pruning)", "상체", "가식", "경화"], "answer": 0, "explain": "단근(Root pruning)은 곧은뿌리를 잘라 잔뿌리 발달을 돕고 T/R율을 낮춤", "ref": "묘목육성학"}, {"id": "조림-62", "subject": "조림", "num": 62, "part": 4, "stem": "모수작업(Seed-tree method)에서 단위면적(1ha)당 잔존시켜야 할 모수(어미나무)의 표준 본수로 적절한 것은?", "options": ["1~2본", "15~30본", "100~200본", "500본 이상"], "answer": 1, "explain": "모수작업의 모수 본수는 통상 ha당 15~30본(전체 재적의 10% 내외)", "ref": "조림학본론"}, {"id": "조림-63", "subject": "조림", "num": 63, "part": 4, "stem": "온대 활엽수의 맹아갱신(왜림작업) 시 그루터기 벌채 높이로 가장 바람직한 것은?", "options": ["지상 50cm 이상", "지상 10~15cm 이하로 낮게", "지표면 아래 10cm", "높이는 무관함"], "answer": 1, "explain": "왜림 벌채 시 그루터기가 높으면 썩기 쉽고 싹이 부실하므로 10~15cm 이하로 낮게 비스듬히 자름", "ref": "육림학"}, {"id": "조림-64", "subject": "조림", "num": 64, "part": 4, "stem": "종자의 휴면 원인 중 배(Embryo) 자체가 미숙하여 후숙(After-ripening) 기간이 필요한 수종은?", "options": ["은행나무", "밤나무", "자작나무", "버드나무"], "answer": 0, "explain": "은행나무, 주목, 인삼 등은 낙과 시 배가 미숙 상태로 후숙 과정이 필요", "ref": "종자생리학"}, {"id": "조림-65", "subject": "조림", "num": 65, "part": 4, "stem": "침엽수 묘포장의 토양 조건으로 가장 알맞은 산도(pH) 범위는?", "options": ["pH 4.0 이하", "pH 5.0 ~ 6.0", "pH 7.0 ~ 7.5", "pH 8.0 이상"], "answer": 1, "explain": "침엽수는 약산성(pH 5.0~6.0), 활엽수는 약산성~중성(pH 5.5~6.5)이 최적", "ref": "산림토양학"}, {"id": "조림-66", "subject": "조림", "num": 66, "part": 4, "stem": "종자의 발아시험 시 발아율(Germination percentage)을 구하는 공식으로 옳은 것은?", "options": ["(발아한 종자수 ÷ 전체 치상 종자수) × 100", "(순정종자 무게 ÷ 전체 시료 무게) × 100", "(발아한 종자수 ÷ 순정종자 무게) × 100", "발아세 × 순량률 ÷ 100"], "answer": 0, "explain": "· 발아율 = (발아립수 ÷ 치상립수) × 100\n· ②는 순량률", "ref": "종자검사규정"}, {"id": "조림-67", "subject": "조림", "num": 67, "part": 4, "stem": "수목의 광합성 속도에서 온도가 상승할 때 광합성량보다 호흡량이 급증하여 순광합성량이 0 이하로 떨어지는 주원인은?", "options": ["기공 폐쇄 및 효소 변성", "엽록소 급증", "수분 흡수 과다", "책상조직 팽창"], "answer": 0, "explain": "고온 시 기공이 닫혀 CO₂ 흡수가 저해되고 효소가 변성되어 호흡량이 광합성량을 초과함", "ref": "수목생리학"}, {"id": "조림-68", "subject": "조림", "num": 68, "part": 4, "stem": "숲가꾸기 작업 중 형질이 불량하거나 병든 나무를 우선적으로 베어내어 임분 내 공간을 개방하는 하층간벌(저벌)의 제1종(A종) 간벌 대상목은?", "options": ["피압된 고사목 및 피압목", "우세목", "미래목", "준우세목"], "answer": 0, "explain": "A종 간벌(경벌)은 피압 고사목과 피압 소경목만 제거하는 가장 소극적인 간벌", "ref": "간벌지침"}, {"id": "조림-69", "subject": "조림", "num": 69, "part": 4, "stem": "종자 수집 시 구과(솔방울 등)를 채취하여 건조실이나 햇볕에서 건조시켜 종자를 털어내는 건조탈립법을 적용하는 수종은?", "options": ["소나무, 잣나무", "밤나무, 도토리", "버드나무, 사시나무", "은행나무, 주목"], "answer": 0, "explain": "구과류(소나무, 잣나무, 낙엽송)는 햇볕 건조나 양건실에서 인공 건조하여 탈립", "ref": "채종학"}, {"id": "조림-70", "subject": "조림", "num": 70, "part": 4, "stem": "산림자원법상 조림용 종·묘 생산업자의 등록 관청은?", "options": ["산림청장", "특별시장·광역시장·특별자치시장·도지사 또는 특별자치도지사", "시장·군수·구청장", "산림조합장"], "answer": 1, "explain": "산림자원법상 종·묘생산업의 등록은 시·도지사 관할", "ref": "산림자원법"}, {"id": "조림-71", "subject": "조림", "num": 71, "part": 4, "stem": "종자의 정선법 중 종자 간의 비중(무게) 차이를 이용하여 물이나 소금물에 띄워 가라앉은 충실한 종자만을 가려내는 수선법(Water separation)에 가장 적합한 종자는?", "options": ["소나무, 잣나무", "밤나무, 참나무류(도토리)", "자작나무, 오리나무", "포플러, 버드나무"], "answer": 1, "explain": "밤나무, 상수리나무 등 대형 종자는 껍질이 두껍고 속이 꽉 찬 종자가 물에 가라앉으므로 물에 띄워 쭉정이와 벌레 먹은 종자를 가려내는 수선법이 가장 효과적입니다.", "ref": "조림학 종자정선"}, {"id": "조림-72", "subject": "조림", "num": 72, "part": 4, "stem": "시설 양묘에서 플라스틱이나 친환경 튜브 용기(포트)에 인공 상토를 넣어 육묘하는 용기묘(Container seedling)의 장점으로 옳지 **않은** 것은?", "options": ["뿌리의 손상이 거의 없어 늦봄이나 가을 등 식재 가능 기간이 길다.", "묘목의 활착률이 일반 노지 묘목보다 높다.", "노지 양묘에 비해 묘포장 시설비와 초기 투자비가 전혀 들지 않는다.", "좁은 면적에서 규격화된 우량 묘목을 집약적으로 대량 생산할 수 있다."], "answer": 2, "explain": "용기묘는 온실, 자동 관수, 인공상토 등 시설 투자가 필수적이므로 노지 묘목보다 초기 시설비가 많이 듭니다.", "ref": "NCS 학습모듈 조림"}, {"id": "조림-73", "subject": "조림", "num": 73, "part": 4, "stem": "우수한 형질을 가진 나무의 가지나 눈을 떼어내어 무성번식시키는 클론(Clone) 증식의 가장 큰 이점은?", "options": ["유전적 다양성이 극대화된다.", "모수(어미나무)가 가진 우수한 유전 형질을 변형 없이 그대로 후대에 보존할 수 있다.", "씨앗으로 번식할 때보다 돌연변이가 많이 발생한다.", "어떤 토양 환경에서도 병해충 피해가 전혀 발생하지 않는다."], "answer": 1, "explain": "무성증식(접목, 삽목, 조직배양)은 어미나무의 유전자를 100% 그대로 복제하므로 우수 형질을 안정적으로 유지합니다.", "ref": "임목육종학"}, {"id": "조림-74", "subject": "조림", "num": 74, "part": 4, "stem": "임분의 밀도 조절 시 평균 흉고직경 25cm를 기준으로 하여 단위면적당 본수의 상관관계를 나타낸 라이네케(Reineke)의 척도는?", "options": ["지위지수", "임분밀도지수(SDI)", "형수", "형상비"], "answer": 1, "explain": "Reineke의 임분밀도지수(Stand Density Index, SDI)는 기준 직경 25cm(10인치)에서 ha당 입목 본수를 나타내는 표준 척도입니다.", "ref": "산림경영학"}, {"id": "조림-75", "subject": "조림", "num": 75, "part": 4, "stem": "높은 키를 가진 나무(수고 30~50m) 꼭대기까지 물이 끊어지지 않고 올라가는 원리를 설명하는 가장 정설인 물리생리학적 학설은?", "options": ["근압설", "모세관현상설", "응집력-증산-장력설", "대기압설"], "answer": 2, "explain": "잎에서의 증산작용으로 생기는 끌어당기는 힘(장력)과 물 분자 간의 강력한 결합력(응집력)에 의해 수분 기둥이 끊어지지 않고 꼭대기까지 끌어올려집니다.", "ref": "수목생리학"}, {"id": "조림-76", "subject": "조림", "num": 76, "part": 4, "stem": "우량 종자를 대량 생산하기 위해 우수 가계의 접목묘를 일정한 간격으로 배치하여 격리 조성한 집약적 종자 생산 포지는?", "options": ["모수림", "채종원(Seed orchard)", "천연보호림", "유전자원림"], "answer": 1, "explain": "유전적으로 검증된 우수 클론을 인위적으로 정원처럼 심어 우량 종자만 전문 생산하는 곳을 채종원(Seed orchard)이라 합니다.", "ref": "산림자원법"}, {"id": "조림-77", "subject": "조림", "num": 77, "part": 4, "stem": "수목의 가지치기 시 생가지(살아있는 가지)를 잘랐을 때 상처 부위에서 수액이 다량 흘러나오거나 상처 유합이 늦어 생가지치기를 피해야 하는 수종은?", "options": ["소나무", "삼나무", "자작나무, 단풍나무류", "편백"], "answer": 2, "explain": "단풍나무, 자작나무 등은 봄철 생가지를 자르면 수액 누출이 극심하고 부후균이 침투하기 쉬워 휴면기에만 가지치기합니다.", "ref": "조림학 가지치기"}, {"id": "조림-78", "subject": "조림", "num": 78, "part": 4, "stem": "조림 예정지의 척박한 토양을 개량하기 위해 클로버나 자운영 등 콩과 식물을 심어 갈아엎는 녹비(Green manure) 작물의 주된 효과는?", "options": ["토양 내 염분 농도 증가", "공기 중 질소 고정을 통한 토양 비옥도 및 유기물 증대", "토양 알칼리화 촉진", "토양 수분 완전 건조"], "answer": 1, "explain": "콩과 녹비작물은 뿌리혹박테리아와 공생하여 질소를 고정하고 땅을 비옥하게 만듭니다.", "ref": "산림토양학"}, {"id": "조림-79", "subject": "조림", "num": 79, "part": 4, "stem": "가을철 노지 묘포장에서 기온이 급강하할 때 흙 속의 수분이 얼어붙어 묘목을 땅 위로 솟구쳐 올리며 뿌리를 끊어놓는 서리발 피해(서릿발)의 방지 대책은?", "options": ["묘포 바닥에 모래와 짚을 덮거나 배토(흙덮기)를 실시하고 롤러로 눌러줌", "질소질 비료를 과다 시비함", "묘포장 물을 가두어 얼림", "가지치기를 강하게 실시함"], "answer": 0, "explain": "서리발(동상) 피해를 막으려면 배수를 양호하게 하고 짚이나 왕겨를 덮어 지온 저하를 완화해야 합니다.", "ref": "묘포관리학"}, {"id": "조림-80", "subject": "조림", "num": 80, "part": 4, "stem": "산림사업 안전관리 지침상 예초기(풀베기 기계) 작업 시 작업자 간에 유지해야 할 최소 안전 반경은?", "options": ["2m 이상", "5m 이상", "15m 이상", "50m 이상"], "answer": 2, "explain": "예초기 날에 돌이나 나뭇가지가 튕겨 나갈 위험이 있으므로 작업자 간 15m 이상의 안전거리를 의무 확보해야 합니다.", "ref": "산림사업 안전사고 예방기준"}, {"id": "조림-81", "subject": "조림", "num": 81, "part": 4, "stem": "광합성 기작 중 고온·건조 기후에 적응하여 수분 손실을 최소화하고 광호흡을 억제하는 C4 식물의 해부학적 특징은?", "options": ["잎살세포(엽육세포)에만 엽록체가 발달해 있다.", "유관속초세포(관다발초세포)가 발달하고 내부에 엽록체가 풍부한 크란츠(Kranz) 구조를 갖는다.", "잎의 책상조직이 완전히 퇴화되어 없다.", "기공이 밤에만 열리고 낮에는 완전히 닫힌다."], "answer": 1, "explain": "C4 식물은 유관속초세포가 크고 엽록체가 풍부한 크란츠(Kranz) 구조를 가지며, 엽육세포에서 고정한 옥살아세트산을 말산으로 변환해 유관속초세포로 전달하여 루비스코(Rubisco) 주변의 CO2 농도를 높여 광호흡을 억제합니다.", "ref": "수목생리학"}, {"id": "조림-82", "subject": "조림", "num": 82, "part": 4, "stem": "수목 체내 수분 흡수 및 이동을 지배하는 수분포텐셜(Water potential, Ψw)의 구성 요소로 옳지 **않은** 것은?", "options": ["삼투포텐셜(Ψs)은 용질 농도가 높을수록 음(-)의 값이 커져 수분을 끌어당긴다.", "압력포텐셜(Ψp)은 세포벽이 팽압을 받을 때 양(+)의 값을 갖는다.", "매트릭포텐셜(Ψm)은 토양 입자나 세포벽 표면에 물이 흡착되는 힘이다.", "중력포텐셜은 수고 10m당 약 1.0 MPa씩 수분포텐셜을 상승시킨다."], "answer": 3, "explain": "중력포텐셜은 수고 10m 상승할 때마다 수두압에 의해 수분포텐셜을 약 0.1 MPa (1 bar)씩 감소(저하)시킵니다.", "ref": "수목생리학"}, {"id": "조림-83", "subject": "조림", "num": 83, "part": 4, "stem": "우리나라 주요 조림 수종 중 종자 결실 주기가 1년(매년 풍채)으로 가장 짧고 안정적인 수종은?", "options": ["소나무", "일본잎갈나무(낙엽송)", "잣나무", "삼나무"], "answer": 3, "explain": "삼나무, 편백, 오리나무 등은 매년 결실하는 편이며, 소나무는 1~2년, 잣나무는 2~3년, 낙엽송은 5~7년 주기로 풍흉(해거리)이 심합니다.", "ref": "조림학 종자생산학"}, {"id": "조림-84", "subject": "조림", "num": 84, "part": 4, "stem": "종자의 장기 저장을 위해 함수율을 5~10% 수준으로 건조시킨 후 밀봉하여 저온(0~4℃)에 보관해야 하는 종자(정통종자, Orthodox seed)로만 묶인 것은?", "options": ["밤나무, 상수리나무", "소나무, 일본잎갈나무", "은행나무, 호두나무", "회송, 들메나무"], "answer": 1, "explain": "· 소나무, 낙엽송, 가문비나무 등 대부분의 침엽수 종자는 함수율을 5~10%로 낮추어 저온 밀봉저장하는 정통종자(Orthodox seed)입니다.\n· 반면 밤, 참나무류, 은행나무 등은 건조하면 활력을 잃는 난저장성(Recalcitrant) 종자입니다.", "ref": "산림종자학"}, {"id": "조림-85", "subject": "조림", "num": 85, "part": 4, "stem": "양묘장에서 봄철 식재 전까지 묘목의 뿌리가 마르지 않도록 임시로 묻어두는 가식(假植) 요령으로 옳지 **않은** 것은?", "options": ["바람이 적고 배수가 잘되는 그늘진 곳을 선정한다.", "묘목의 줄기 끝이 북쪽을 향하도록 비스듬히 눕혀 묻는다.", "뿌리 사이에 흙이 골고루 들어가도록 흙을 채우고 밟아준다.", "가식 기간 중 건조하지 않도록 충분히 관수한다."], "answer": 1, "explain": "· 가식할 때는 묘목의 끝(수간)이 남쪽을 향하게 기울여 묻거나, 직사광선을 피해 북사면의 차광된 곳에 두어 눈(동아)의 조기 발아를 방지해야 합니다.\n· (줄기를 북쪽으로 하면 이른 봄 햇볕에 줄기가 직접 노출되어 건조·동해를 받기 쉽습니다.)", "ref": "양묘학"}, {"id": "조림-86", "subject": "조림", "num": 86, "part": 4, "stem": "건전한 묘목 생육을 위한 이상적인 묘포 토양의 삼상(Three phases) 용적 조성 비율로 옳은 것은?", "options": ["고상 50%, 액상 25%, 기상 25%", "고상 70%, 액상 15%, 기상 15%", "고상 30%, 액상 40%, 기상 30%", "고상 40%, 액상 40%, 기상 20%"], "answer": 0, "explain": "토양 물리학적으로 가장 이상적인 묘포 토양 삼상 비율은 고상(무기물+유기물) 약 50%, 액상(토양수분) 25%, 기상(토양공기) 25%입니다.", "ref": "산림토양학"}, {"id": "조림-87", "subject": "조림", "num": 87, "part": 4, "stem": "산벌작업(Shelterwood system)에서 모수로부터 떨어진 종자가 발아하여 어린 묘목이 안전하게 발생할 수 있도록 상층 임관을 성기게 열어주는 벌채 단계는?", "options": ["예비벌(Preparatory cutting)", "하종벌(Seed cutting)", "후벌(Removal cutting)", "수벌(Final cutting)"], "answer": 1, "explain": "산벌작업은 예비벌(결실 촉진) → 하종벌(치수 발생을 위한 하종 및 광선 유입) → 후벌(치수가 자란 후 상층목 수확벌채) 순으로 진행됩니다.", "ref": "조림학 갱신론"}, {"id": "조림-88", "subject": "조림", "num": 88, "part": 4, "stem": "다음 중 맹아력(그루터기에서 새싹이 돋아나는 힘)이 가장 약하여 왜림작업에 의한 갱신이 불가능한 수종은?", "options": ["신갈나무", "아까시나무", "잣나무", "상수리나무"], "answer": 2, "explain": "· 잣나무, 소나무, 전나무, 가문비나무 등 대부분의 침엽수는 맹아력이 거의 없어 왜림작업이 불가능합니다.\n· (리기다소나무, 주목 등은 예외적으로 맹아력이 있음)", "ref": "조림학 왜림론"}, {"id": "조림-89", "subject": "조림", "num": 89, "part": 4, "stem": "천연하종갱신 대상지에서 수간의 낙엽과 유기물층이 너무 두꺼워 종자가 광물질 토양에 닿지 못할 때 취하는 가장 효과적인 임상 정리 방법은?", "options": ["지면긁기(Scarification)", "객토", "짚 피복", "복토"], "answer": 0, "explain": "두꺼운 유기물(낙엽·부식토) 층은 종자의 수분 흡수를 방해하고 뿌리가 광물질 토양에 정착하지 못하게 하므로, 종자 낙하 직전에 긁어주어 광물질 토양을 노출시키는 '지면긁기'를 실시합니다.", "ref": "조림학 천연갱신론"}, {"id": "조림-90", "subject": "조림", "num": 90, "part": 4, "stem": "식물 호르몬 중 가뭄 등 환경 스트레스에 처했을 때 기공을 닫아 수분 증산을 차단하고, 종자의 휴면을 유지시키는 역할을 하는 호르몬은?", "options": ["옥신(Auxin)", "지베렐린(Gibberellin)", "앱시스산(Abscisic acid, ABA)", "시토키닌(Cytokinin)"], "answer": 2, "explain": "앱시스산(ABA)은 식물의 대표적인 스트레스 호르몬으로, 수분 부족 시 공변세포의 칼륨(K+) 이온 유출을 유도하여 기공을 신속히 닫고 종자 휴면을 유지시킵니다.", "ref": "수목생리학"}, {"id": "조림-91", "subject": "조림", "num": 91, "part": 4, "stem": "다층혼효림 및 복층림 조성을 위해 상층목 아래에 그늘을 견디며 자랄 수 있도록 식재하는 하층 수종(수하식재 수종)으로 가장 적합한 것은?", "options": ["편백, 주목", "자작나무, 은사시나무", "낙엽송, 이태리포플러", "소나무, 상수리나무"], "answer": 0, "explain": "복층림의 하층 식재 수종은 상층목의 피압 그늘을 견뎌야 하므로 내음성이 강한 음수(주목, 전나무, 편백 등)를 선정해야 합니다.", "ref": "조림학 숲가꾸기 지침"}, {"id": "조림-92", "subject": "조림", "num": 92, "part": 4, "stem": "조림지 풀베기(모두베기, 줄베기, 둘레베기) 작업 중 경사지에서 토양 유실과 풍해를 방지하면서 묘목 주변의 잡초만 효율적으로 제거하는 방식은?", "options": ["모두베기(전면베기)", "줄베기(대상베기)", "방치", "화입"], "answer": 1, "explain": "줄베기는 묘목이 심겨진 식재 열을 따라 폭 90~100cm 정도로 띠 모양으로 베어주는 방식으로, 전면베기에 비해 토양 침식을 방지하고 노력을 절감할 수 있어 경사지 조림지에 적합합니다.", "ref": "조림학 숲가꾸기"}, {"id": "조림-93", "subject": "조림", "num": 93, "part": 4, "stem": "수목의 가지치기 절단면에서 병원균의 침입을 막고 상처를 스스로 구획화하여 치유하는 원리를 설명한 Shigo의 수목 방어 메커니즘 모델은?", "options": ["CODIT 모델 (Compartmentalization of Decay in Trees)", "ABCDE 모델", "압류설(Pressure-flow hypothesis)", "생장조절설"], "answer": 0, "explain": "Alex Shigo의 CODIT 모델은 나무가 상처를 입었을 때 도관 차단, 만재 방어벽, 방사유조직 방어벽, 상처 후 형성층의 신생벽(Barrier zone) 등 4대 벽을 형성하여 부후의 확산을 공간적으로 가두어 격리한다는 구획화 모델입니다.", "ref": "수목생리학 및 수목관리학"}, {"id": "조림-94", "subject": "조림", "num": 94, "part": 4, "stem": "산림 숲가꾸기 간벌 방식 중 상층의 불량 대경목과 병해충 피해목을 제거하고 중·하층의 건전목을 존치하여 지속적인 복층 수확을 유도하는 방식은?", "options": ["정량간벌", "하층간벌(독일식)", "택벌간벌(Selection thinning)", "열식간벌"], "answer": 2, "explain": "택벌간벌은 임관 상층의 성숙목이나 불량목을 골라 베어 하층의 유령목 생장을 촉진하는 방법으로, 이령림이나 복층림 경영에 적합합니다.", "ref": "조림학 간벌론"}, {"id": "조림-95", "subject": "조림", "num": 95, "part": 4, "stem": "수목 체내에서 재이동성(Mobility)이 낮아 결핍 증상이 성숙한 늙은 잎이 아닌 최상부 어린잎이나 신초부터 먼저 나타나는 무기영양소는?", "options": ["질소(N)", "칼슘(Ca)", "칼륨(K)", "마그네슘(Mg)"], "answer": 1, "explain": "칼슘(Ca), 철(Fe), 붕소(B) 등은 체관 내 이동성이 극히 불량하여 체내 결핍 시 늙은 잎에서 어린잎으로 이동하지 못하므로, 생장점과 어린잎에서 기형, 황화, 마름 등의 결핍 증상이 가장 먼저 발생합니다.", "ref": "수목생리학"}, {"id": "조림-96", "subject": "조림", "num": 96, "part": 4, "stem": "묘목의 건전도를 평가하는 지표 중 지상부 묘고(cm)를 뿌리목 근원경(mm)으로 나눈 값으로, 묘목의 가늘고 긴 웃자람 상태를 평가하는 지수는?", "options": ["묘목 형질비(간주형태 지수, Sturdiness quotient)", "T/R률", "근계분기도", "발아세"], "answer": 0, "explain": "형질비(SQ, 간주형태) = 묘고(cm) / 근원경(mm)이며, 이 값이 지나치게 크면 묘목이 연약하게 웃자라 바람이나 건조에 약하다는 뜻입니다.", "ref": "양묘학"}, {"id": "조림-97", "subject": "조림", "num": 97, "part": 4, "stem": "산림자원법령상 우량 종자 채취를 위해 지정된 채종림의 지정 및 관리에 관한 설명으로 옳지 **않은** 것은?", "options": ["산림청장 또는 시·도지사가 형질이 우수한 림분을 채종림으로 지정할 수 있다.", "채종림에서는 임목의 결실을 방해하는 덩굴류와 형질 불량목을 제거한다.", "수관 발달과 채광을 촉진하기 위해 강도의 솎아베기(간벌)를 실시한다.", "채종림 내에서는 종자 채취 목적이라 하더라도 일체의 임목 벌채가 엄격히 금지된다."], "answer": 3, "explain": "채종림의 우량한 수관 형성과 개화·결실을 돕기 위해 불량목 제거 및 강도 간벌, 종자 채취를 위한 가지치기 등은 적극적으로 허용 및 권장됩니다.", "ref": "산림자원법 시행규칙"}, {"id": "조림-98", "subject": "조림", "num": 98, "part": 4, "stem": "종자의 발아 촉진을 위해 일정 기간 습윤한 상태에서 저온(0~5℃)에 보관하여 휴면을 깨뜨리는 인공 처리는?", "options": ["춘화처리(Vernalization)", "습적처리(저온층적법, Stratification)", "열탕처리", "황산침지"], "answer": 1, "explain": "종자의 내적 휴면(배 휴면)을 타파하기 위해 젖은 모래나 피트모스와 섞어 1~3개월간 저온(0~5℃)에 보관하는 처리를 습적처리(층적법, Stratification) 또는 노천매장이라 합니다.", "ref": "산림종자학"}, {"id": "조림-99", "subject": "조림", "num": 99, "part": 4, "stem": "산림의 1차 건생천이(Xerarch succession) 과정에서 맨 처음 나지(암반)에 정착하여 유기물을 형성하는 선구 식생은?", "options": ["선태류 및 지의류", "일년생 초본", "다년생 관목", "양수 교목"], "answer": 0, "explain": "척박한 건조 암반 나지에서 시작하는 1차 건생천이의 개척자(Pioneer)는 지의류와 이끼류(선태류)이며, 이들이 암석을 풍화시키고 유기물을 축적한 뒤 초본 → 관목 → 양수림 → 음수림(극상)으로 천이가 진행됩니다.", "ref": "산림생태학"}, {"id": "조림-100", "subject": "조림", "num": 100, "part": 4, "stem": "훼손된 산림 복원 시 생태계의 건강성과 자생력을 회복하기 위해 권장되는 식재 식생 선정 원칙으로 가장 옳은 것은?", "options": ["속성 외래종을 밀식하여 조기에 녹화를 달성한다.", "대상지의 자생 수종 및 주변 천연림의 잠재자연식생에 부합하는 수종을 도입한다.", "경제적 가치가 높은 수종 단일종으로 단순림을 조성한다.", "지피 식물 도입을 배제하고 교목류만 전면 식재한다."], "answer": 1, "explain": "생태적 산림복원은 해당 입지의 기후·토양 환경에 적응된 자생 수종과 다층 구조의 잠재자연식생을 바탕으로 생물다양성을 확보하는 것이 기본 원칙입니다.", "ref": "산림생태복원공학"}, {"id": "조림-101", "subject": "조림", "num": 101, "part": 5, "stem": "「산림사업 표준안전 작업지침」(산림청 고시)상 임업용 동력기계톱 벌목 시 **방향베기의 깊이** 기준은?", "options": ["벌근직경의 1/2 ~ 1/3", "벌근직경의 1/3 ~ 1/4", "벌근직경의 1/6 ~ 1/8", "벌근직경의 1/10"], "answer": 1, "explain": "· 고시 제48조제1호: 방향베기 깊이는 벌근직경의 1/3~1/4, 바닥절단부와 상부(하부)절단부가 이루는 각은 30° 이상\n· ⚠️ 학습모듈(조림 p.105~ 안전사고 예방)은 '입목지름의 1/5~1/3'로 적혀 있음 → 지문이 '고시'를 말하면 1/3~1/4", "ref": "산림사업 표준안전 작업지침 제48조"}, {"id": "조림-102", "subject": "조림", "num": 102, "part": 5, "stem": "「산림사업 표준안전 작업지침」상 **따라베기의 위치**로 옳은 것은?", "options": ["방향베기 바닥절단부와 같은 높이", "방향베기 바닥절단부보다 직경의 1/10 이상 높게", "방향베기 바닥절단부보다 직경의 1/3 이상 높게", "방향베기 바닥절단부보다 낮게"], "answer": 1, "explain": "· 고시 제48조제3·4호: 따라베기는 바닥절단부보다 직경의 1/10 이상 높이, 깊이는 벌도맥 폭이 벌근직경의 1/10 정도 남도록\n· ⚠️ 학습모듈은 '방향베기 밑면보다 2~3cm 높게'로 설명 → 출처별로 구분", "ref": "산림사업 표준안전 작업지침 제48조"}, {"id": "조림-103", "subject": "조림", "num": 103, "part": 5, "stem": "표준안전 작업지침상 수구각(방향베기) 따기와 따라베기 기술, 벌목 안전보조장치를 반드시 적용해야 하는 입목 기준과 수구각으로 옳은 것은?", "options": ["가슴높이지름 10cm 이상 — 15° 이상", "가슴높이지름 20cm 이상 — 30° 이상", "가슴높이지름 30cm 이상 — 45° 이상", "가슴높이지름 40cm 이상 — 60° 이상"], "answer": 1, "explain": "· 고시 제38조제10호: 가슴높이 지름 20cm 이상 나무는 수구각 30° 이상 따기 + 따라베기로 벌도맥을 남기고 안전보조장치로 목적 방향 벌목\n· 걸림목도 흉고직경 20cm 기준: 미만은 돌림대·밧줄, 이상은 견인기구·안전보조장치(제43조)", "ref": "산림사업 표준안전 작업지침 제38조·제43조"}, {"id": "조림-104", "subject": "조림", "num": 104, "part": 5, "stem": "표준안전 작업지침상 벌목·조재·집재·적재 등 **고위험 산림작업** 시 산림사업장에 같이 있어야 하는 최소 작업자 수는?", "options": ["1명", "2명", "3명", "5명"], "answer": 1, "explain": "고시 제19조(단독작업의 금지): 고위험 작업은 최소 2명 이상, 시각·청각으로 확인할 수 없는 장소와 추락·전복·깔림 위험 작업에는 단독 배치 금지", "ref": "산림사업 표준안전 작업지침 제19조"}, {"id": "조림-105", "subject": "조림", "num": 105, "part": 5, "stem": "작업 대상 수목의 수고 몇 배 이내에 송전선이 있으면 송전선 관리주체·산림사업 주체와 협의하여 안전한 작업환경을 확보한 뒤 작업해야 하는가?", "options": ["1배", "1.5배", "2배", "3배"], "answer": 2, "explain": "고시 제14조: 수고 2배 이내 송전선 → 협의 후 작업. 벌목 시 작업자 배치도 벌도목 날개 없음), 수컷은 유시\n· 겨울~봄철 후식 피해 극심", "ref": "산림곤충학"}, {"id": "산림보호-59", "subject": "산림보호", "num": 59, "part": 4, "stem": "미국흰불나방의 생태적 특성으로 옳지 **않은** 것은?", "options": ["1년에 보통 2~3회 발생한다", "어린 유충 시기에는 거미줄을 치고 군서 생활을 한다", "번데기 상태로 수피 틈이나 낙엽 밑에서 월동한다", "침엽수 수종만 선택적으로 가해하는 식엽성 해충이다"], "answer": 3, "explain": "미국흰불나방은 광식성(활엽수 수백 종 가해) 식엽성 해충 (침엽수 전용 아님)", "ref": "산림곤충학"}, {"id": "산림보호-60", "subject": "산림보호", "num": 60, "part": 4, "stem": "버즘나무(플라타너스) 잎 뒷면에 기생하여 즙액을 빨아먹고 검은 배설물을 남겨 잎을 황백색으로 탈색시키는 해충은?", "options": ["버즘나무방패벌레", "매미나방", "오리나무잎벌레", "솔수염하늘소"], "answer": 0, "explain": "버즘나무방패벌레는 성충과 약충이 잎 뒷면에서 흡즙하여 백화 현상 유발", "ref": "산림해충학"}, {"id": "산림보호-61", "subject": "산림보호", "num": 61, "part": 4, "stem": "농약의 독성을 나타낼 때 시험동물의 50%를 치사시키는 데 필요한 체중 1kg당 약량(mg/kg)을 뜻하는 기호는?", "options": ["TLm", "LC50", "LD50", "EC50"], "answer": 2, "explain": "반수치사량은 LD50 (Lethal Dose 50%), 수치가 작을수록 독성이 강함", "ref": "농약학"}, {"id": "산림보호-62", "subject": "산림보호", "num": 62, "part": 4, "stem": "유기인계 살충제가 곤충의 신경계를 마비시켜 살충 작용을 나타내는 생화학적 기작은?", "options": ["아세틸콜린에스테라제(AChE) 활성 저해", "큐티클층 키틴 합성 억제", "미토콘드리아 전자전달계 차단", "세포벽 합성 효소 분해"], "answer": 0, "explain": "유기인계 및 카바메이트계는 신경전달물질 분해효소인 AChE를 저해하여 신경 마비 초래", "ref": "농약학"}, {"id": "산림보호-63", "subject": "산림보호", "num": 63, "part": 4, "stem": "월동기 수목의 응애류 및 병원균 방제를 위해 황분말과 생석회를 끓여 제조하는 알칼리성 살균·살충제는?", "options": ["석회보르도액", "석회황합제(석회유황합제)", "포르말린", "다이센 M-45"], "answer": 1, "explain": "석회황합제는 생석회+황분말을 1:2 비율로 끓여 조제하며 월동기 월동 병해충 방제에 탁월", "ref": "농약학"}, {"id": "산림보호-64", "subject": "산림보호", "num": 64, "part": 4, "stem": "산불 위험 예보 시 산림 내 마른 낙엽의 건조 상태를 나타내는 실효습도(Effective humidity)의 기준 중 산불 경보 발령 기준(매우 위험)에 해당하는 것은?", "options": ["실효습도 60% 이상", "실효습도 50%", "실효습도 40%", "실효습도 25% 이하"], "answer": 3, "explain": "실효습도 35% 이하 시 주의보, 25% 이하가 2일 이상 지속 시 산불경보 발령", "ref": "산불통계규정"}, {"id": "산림보호-65", "subject": "산림보호", "num": 65, "part": 4, "stem": "강풍을 동반한 대형 산불 시 솔방울이나 나뭇가지 등 불씨가 공중으로 치솟아 주 산불 전방 수백 미터 이상 날아가 새로운 불을 지르는 현상은?", "options": ["비화(Spotting fire)", "수관화", "지중화", "대류열 복사"], "answer": 0, "explain": "강풍에 의해 불씨가 원거리로 날아가는 현상을 비화(Spotting)라 하며 대형화의 주원인", "ref": "산불진화학"}, {"id": "산림보호-66", "subject": "산림보호", "num": 66, "part": 4, "stem": "겨울철 또는 초봄 낮 동안 햇볕을 받아 따뜻해진 줄기 남서쪽 수피가 밤에 급격히 냉각되면서 수축 팽창 차이로 줄기가 세로로 터져 갈라지는 현상은?", "options": ["동사", "만상", "상렬(Frost crack)", "한해"], "answer": 2, "explain": "상렬(Frost crack)은 낮과 밤의 급격한 온도차로 줄기 바깥쪽과 안쪽 수축 차에 의해 터짐", "ref": "수목생리학"}, {"id": "산림보호-67", "subject": "산림보호", "num": 67, "part": 4, "stem": "대기오염 물질인 아황산가스(SO₂)에 대한 수목의 내성 비교로 옳은 것은?", "options": ["은행나무는 침엽수보다 아황산가스에 매우 취약하다", "소나무, 잣나무 등 침엽수는 활엽수에 비해 일반적으로 감수성(피해)이 크다", "플라타너스는 공해에 가장 약한 대표 수종이다", "활엽수의 잎이 침엽수의 잎보다 기공 저항이 항상 낮다"], "answer": 1, "explain": "침엽수는 상록성으로 잎의 수명이 길어 만성적인 아황산가스 축적 피해에 훨씬 취약함", "ref": "환경수목학"}, {"id": "산림보호-68", "subject": "산림보호", "num": 68, "part": 4, "stem": "소나무재선충병 감염목의 훈증 방제 작업 시 밀폐용 타포린 비닐 피복재의 두께 기준으로 알맞은 것은?", "options": ["0.01mm 이상", "0.05mm 이상", "0.10mm 이상", "0.50mm 이상"], "answer": 2, "explain": "훈증용 타포린 비닐은 약제 가스 누출 방지를 위해 두께 0.1mm 이상 기준", "ref": "소나무재선충방제지침"}, {"id": "산림보호-69", "subject": "산림보호", "num": 69, "part": 4, "stem": "암컷 곤충이 수컷을 유인할 때 분비하는 성 페로몬(Sex pheromone)을 트랩에 넣어 해충을 유인 포살하는 방제법의 분류는?", "options": ["화학적 방제", "생물학적 방제(생물학적 제제 활용)", "기계적 방제", "임업적 방제"], "answer": 1, "explain": "페로몬 트랩은 곤충 고유의 화학물질을 모방한 생물적 방제 수단으로 분류", "ref": "해충방제학"}, {"id": "산림보호-70", "subject": "산림보호", "num": 70, "part": 4, "stem": "산림보호법상 산불예방을 위해 입산통제구역으로 지정·고시할 수 있는 권한권자는?", "options": ["관할 지방산림청장 또는 지방자치단체의 장", "소방청장", "국방부장관", "산림조합중앙회장"], "answer": 0, "explain": "산림보호법상 입산통제구역 지정 권한은 관할 지방산림청장 또는 지자체장(시장·군수·구청장)", "ref": "산림보호법"}, {"id": "산림보호-71", "subject": "산림보호", "num": 71, "part": 4, "stem": "최근 온난화로 인해 대발생하여 과수 및 산림 활엽수의 줄기에 집단으로 달라붙어 수액을 빨아먹고 그을음병을 유발하는 외래 돌발해충은?", "options": ["미국선녀벌레, 꽃매미", "솔잎혹파리", "밤나무혹벌", "솔껍질깍지벌레"], "answer": 0, "explain": "꽃매미와 미국선녀벌레는 2000년대 이후 정착한 대표 외래 흡즙성 돌발해충입니다.", "ref": "산림보호학 돌발해충"}, {"id": "산림보호-72", "subject": "산림보호", "num": 72, "part": 4, "stem": "소나무 줄기나 가지에 큰 혹(Gall)을 형성하며 봄철에 오렌지색 포자퇴를 터뜨리는 소나무 혹병(Cronartium quercuum)의 중간기주는?", "options": ["참나무류(신갈, 갈참 등)", "배나무", "향나무", "송이풀"], "answer": 0, "explain": "소나무 혹병균은 소나무 ↔ 참나무류 잎을 번갈아 가며 기주교대합니다.", "ref": "수목병리학"}, {"id": "산림보호-73", "subject": "산림보호", "num": 73, "part": 4, "stem": "잣나무 잎을 갉아먹는 해충으로, 유충이 실을 토해 여러 개의 잣나무 잎을 원통형으로 엮어 집을 짓고 그 속에서 가해하는 해충은?", "options": ["잣나무넓적잎벌", "솔나방", "솔알락명나방", "매미나방"], "answer": 0, "explain": "잣나무넓적잎벌 유충은 잎을 엮어 만든 방 속에 숨어 살며 잣나무 잎을 집단 식해합니다.", "ref": "산림해충학"}, {"id": "산림보호-74", "subject": "산림보호", "num": 74, "part": 4, "stem": "수목의 바이러스(Virus) 병해의 진단 및 전염 특성으로 옳지 **않은** 것은?", "options": ["즙액 접종, 접목, 진딧물이나 선충 매개에 의해 전염된다.", "일반 광학현미경으로 병원체를 쉽게 직접 관찰할 수 있다.", "잎에 모자이크 무늬, 얼룩 반점, 왜화(난쟁이화) 증상이 나타난다.", "살균제를 뿌려도 바이러스 자체를 직접 치료하기 어렵다."], "answer": 1, "explain": "바이러스는 크기가 수십~수백 nm로 매우 작아 전자현미경으로만 관찰 가능합니다.", "ref": "수목병리학"}, {"id": "산림보호-75", "subject": "산림보호", "num": 75, "part": 4, "stem": "산불 진화 전술에서 지표화가 수관화로 번지는 것을 막기 위해 수목을 벌채하고 낙엽을 긁어내어 불길을 차단하는 방화선(Fireline)의 표준 너비는?", "options": ["10cm 내외", "수관 높이의 1.5~2배 내외", "500m 이상", "폭은 관계없음"], "answer": 1, "explain": "방화선의 폭은 나무의 키(수고)에 비례하여 불길이 복사열이나 화염으로 건너뛰지 못하도록 수고의 1.5~2배 이상 확보합니다.", "ref": "산불방제학"}, {"id": "산림보호-76", "subject": "산림보호", "num": 76, "part": 4, "stem": "국내 농산물 및 임산물에 잔류허용기준이 설정되지 않은 농약이 검출되었을 때 일괄적으로 적용하는 불검출 기준(PLS 제도) 수치는?", "options": ["0.01 mg/kg(ppm) 이하", "0.1 mg/kg", "1.0 mg/kg", "5.0 mg/kg"], "answer": 0, "explain": "농약 허용기준 강화제도(PLS)상 등록되지 않은 농약은 0.01ppm 이하(사실상 불검출) 기준이 적용됩니다.", "ref": "농약안전사용기준"}, {"id": "산림보호-77", "subject": "산림보호", "num": 77, "part": 4, "stem": "소나무재선충병 예방을 위해 겨울철(1~2월)에 건전한 소나무의 줄기 기부에 구멍을 뚫고 주입하는 약제로 2년간 예방 효과가 지속되는 수간주사제는?", "options": ["아바멕틴(또는 에마멕틴벤조에이트) 유제", "석회황합제", "메탐소듐", "만코제브"], "answer": 0, "explain": "아바멕틴계 살충제는 나무 수액을 타고 전신에 퍼져 재선충이 침입해도 번식하지 못하게 막습니다.", "ref": "소나무재선충방제지침"}, {"id": "산림보호-78", "subject": "산림보호", "num": 78, "part": 4, "stem": "한겨울 수목이 영하의 저온에 노출될 때 일어나는 '세포 외 동결(Extracellular freezing)'에 대한 설명으로 옳은 것은?", "options": ["세포벽 바깥(세포간극)의 물이 먼저 얼면서 세포 내부의 수분을 끌어당겨 세포가 탈수된다.", "세포 내부의 원형질이 먼저 얼어 세포벽을 파괴한다.", "수목의 당분 함량이 낮을수록 동결을 잘 견딘다.", "세포 외 동결이 일어나면 수목은 100% 즉시 고사한다."], "answer": 0, "explain": "내한성이 강한 수목은 세포 밖에서 먼저 얼음이 얼게 유도하여 세포 내 수분을 밖으로 빼냄으로써 세포 원형질의 파괴를 방어합니다.", "ref": "수목생리학"}, {"id": "산림보호-79", "subject": "산림보호", "num": 79, "part": 4, "stem": "아까시나무 잎에 벌레혹을 만들어 잎을 누렇게 말라 떨어뜨리는 아까시잎혹파리의 월동 형태와 장소는?", "options": ["알 상태로 나뭇가지 끝", "유충 또는 번데기 상태로 땅속(토양)", "성충으로 수피 틈", "거미줄 속"], "answer": 1, "explain": "아까시잎혹파리는 가을에 땅으로 떨어져 흙 속에서 유충 또는 번데기로 겨울을 납니다.", "ref": "산림곤충학"}, {"id": "산림보호-80", "subject": "산림보호", "num": 80, "part": 4, "stem": "산림보호법상 산불을 발생하게 한 자가 부담해야 하는 법적 책임의 범위로 옳은 것은?", "options": ["형사처벌(징역·벌금)과 별도로 산림 피해에 대한 민사상 손해배상 책임도 함께 진다.", "형사처벌을 받으면 민사상 책임은 전액 면제된다.", "고의가 아닌 과실인 경우에는 아무런 법적 처벌을 받지 않는다.", "국유림 산불에 대해서는 국가가 전액 부담하므로 가해자 책임이 없다."], "answer": 0, "explain": "산불 실화자는 형사처벌(3년 이하 징역/3천만원 벌금)과 함께 진화 비용 및 입목 피해액에 대한 민사 배상 책임을 모두 집니다.", "ref": "산림보호법"}, {"id": "산림보호-81", "subject": "산림보호", "num": 81, "part": 4, "stem": "수목의 세균(Bacteria) 및 진균(Fungi) 병원체가 기주의 온전한 큐티클층(각피)을 직접 뚫지 못하고 기공, 피목, 수공 등 식물체의 자연 개구부를 통해 주로 침입하는 감염 경로는?", "options": ["직접 침입", "자연 개구부 침입", "매개충 매개 침입", "접목 침입"], "answer": 1, "explain": "· 세균은 효소나 기계적 힘으로 각피를 뚫지 못하므로 기공, 피목, 수공 같은 자연 개구부나 상처를 통해서만 침입합니다.\n· 진균 중에서도 일부 불완전균은 자연 개구부로 주로 침입합니다.", "ref": "산림수병학"}, {"id": "산림보호-82", "subject": "산림보호", "num": 82, "part": 4, "stem": "잣나무 털녹병균(*Cronartium ribicola*)의 생활사에서 중간기주인 송이풀이나 까치밥나무 잎 뒷면에 가을철에 형성되어 잣나무로 날아가 감염을 일으키는 포자는?", "options": ["녹포자(Aeciospore)", "여름포자(Urediniospore)", "담자포자(소생자, Basidiospore)", "동포자(Teliospore)"], "answer": 2, "explain": "잣나무 털녹병의 병환환: 잣나무(녹병포자퇴·녹포자퇴) → 녹포자가 송이풀로 이동 → 송이풀에서 여름포자(반복전염) → 가을에 동포자퇴 형성 → 동포자가 발아하여 담자포자(소생자) 형성 → 담자포자가 잣나무 잎의 기공으로 침입.", "ref": "산림수병학"}, {"id": "산림보호-83", "subject": "산림보호", "num": 83, "part": 4, "stem": "소나무 줄기나 가지에 방추형 또는 구형의 큰 혹을 형성하며, 참나무류 잎을 중간기주로 교대하는 녹병균은?", "options": ["소나무혹병균(*Cronartium quercuum*)", "잣나무털녹병균", "향나무녹병균", "포플러녹병균"], "answer": 0, "explain": "소나무혹병(Gall rust)은 기주가 소나무·곰솔이며 중간기주는 신갈나무, 상수리나무 등 참나무류입니다.", "ref": "산림수병학"}, {"id": "산림보호-84", "subject": "산림보호", "num": 84, "part": 4, "stem": "겨울철 수간의 남서쪽 수피가 한낮의 햇볕으로 온도가 올라갔다가 일몰 후 급격히 냉각되면서 수액 동결과 수피 수축으로 세로로 길게 갈라지는 피해는?", "options": ["열해", "상렬(Frost crack)", "피소(Sunscald)", "조상"], "answer": 1, "explain": "· 한겨울 수간 목질부와 수피의 급격한 온도 변화와 수분 동결 팽창 차이로 줄기가 세로로 쪼개지는 현상을 상렬(Frost crack)이라 합니다.\n· (피소는 여름철 수피 고사)", "ref": "산림기상재해학"}, {"id": "산림보호-85", "subject": "산림보호", "num": 85, "part": 4, "stem": "대기오염물질 중 불화수소(HF) 가스에 극히 민감하여 잎 끝이나 가장자리가 적갈색으로 괴사하여 오염 감시 지표식물로 활용되는 수종은?", "options": ["은행나무", "소나무, 글라디올러스", "회양목", "가시나무"], "answer": 1, "explain": "불화수소(HF)는 식물에 극미량(0.1 ppb)으로도 큰 피해를 주며, 글라디올러스와 소나무, 잣나무류가 극히 민감한 지표식물입니다.", "ref": "환경수목보호학"}, {"id": "산림보호-86", "subject": "산림보호", "num": 86, "part": 4, "stem": "솔잎혹파리(Thecodiplosis japonensis)의 피해 증상 및 월동 생태에 대한 설명으로 옳은 것은?", "options": ["잎의 선단부에 충영을 만들고 성충으로 월동한다.", "당년생 신엽 기부에 2장의 잎이 붙어 혹(충영)을 형성하며, 11월경 지표로 낙하하여 땅속에서 유충으로 월동한다.", "줄기 목질부에 구멍을 뚫고 갱도 속에서 번데기로 월동한다.", "연 2~3회 발생하며 알로 수피 틈에서 월동한다."], "answer": 1, "explain": "솔잎혹파리는 연 1회 발생하며, 유충이 솔잎 기부에 충영을 만들어 즙액을 빨아먹다가 10~11월 비가 올 때 땅으로 떨어져 모래흙 속에서 유충 상태로 월동합니다.", "ref": "산림곤충학"}, {"id": "산림보호-87", "subject": "산림보호", "num": 87, "part": 4, "stem": "소나무좀(Tomicus piniperda)의 가해 습성 중 성충이 봄철 벌채목이나 쇠약목의 수피 밑에 알을 낳고 우화한 신성충이 건전목의 새 가지(신초) 속을 갉아먹어 가지가 부러지게 하는 피해는?", "options": ["산란 피해", "후식(유령기 섭식, Maturation feeding) 피해", "월동 피해", "충영 피해"], "answer": 1, "explain": "소나무좀의 신성충은 성숙을 위해 건전한 소나무의 당년생 신초 속으로 파고 들어가 가해하는 '후식(後食)'을 행하며, 이로 인해 신초가 부러져 수관이 우산 모양으로 변합니다.", "ref": "산림곤충학"}, {"id": "산림보호-88", "subject": "산림보호", "num": 88, "part": 4, "stem": "참나무시들음병을 매개하는 광릉긴나무좀(Platypus koryoensis) 암컷 성충이 목질부에 천공할 때 병원균을 운반하기 위해 체내에 지니고 있는 특수한 주머니 기관은?", "options": ["자낭각", "균낭(Mycangia)", "저정낭", "기문"], "answer": 1, "explain": "광릉긴나무좀 등 암브로시아 비틀(Ambrosia beetle)류는 등판에 '균낭(Mycangia)'이라는 특수 기관을 가지고 있어 병원성 진균(*Raffaelea*)을 보관·운반하여 서식 목질부에 접종합니다.", "ref": "산림수병학 및 곤충학"}, {"id": "산림보호-89", "subject": "산림보호", "num": 89, "part": 4, "stem": "곤충이 계절의 변화(일장 및 온도)를 감지하여 불리한 환경(겨울의 혹한 등)을 이겨내기 위해 발육을 일시적으로 정지하는 생리적 현상은?", "options": ["탈피", "변태", "휴면(Diapause)", "다형현상"], "answer": 2, "explain": "곤충의 휴면(Diapause)은 단순한 환경 저온에 의한 활동 둔화(마비)와 달리, 일장(광주기) 등의 신호에 의해 호르몬계가 제어되어 유전적으로 발육을 정지하고 내한성을 극대화하는 생리적 기작입니다.", "ref": "산림곤충학"}, {"id": "산림보호-90", "subject": "산림보호", "num": 90, "part": 4, "stem": "농약의 제형 중 물에 녹지 않는 미세한 원제 분말을 계면활성제 및 증량제와 혼합하여 물에 타면 균일하게 분산되어 우윳빛 현탁액(Suspension)을 형성하는 제형은?", "options": ["유제(EC)", "수화제(WP)", "입제(GR)", "분제(DP)"], "answer": 1, "explain": "수화제(Wettable powder)는 물에 녹지 않는 농약 원제를 친수성 미분말 형태로 가공한 것으로 물에 타면 침전되지 않고 현탁액을 이룹니다.", "ref": "산림농약학"}, {"id": "산림보호-91", "subject": "산림보호", "num": 91, "part": 4, "stem": "알칼리성 농약인 석회보르도액이나 석회유황합제를 유기인계 살충제와 혼용 살포할 때 발생하는 주된 부작용은?", "options": ["살충 효과가 수십 배 증가한다.", "유효성분이 알칼리에 의해 신속히 분해되어 약효가 상실되고 약해(Phytotoxicity)가 발생한다.", "아무런 화학 반응이 일어나지 않는다.", "물에 더 잘 녹아 전착성이 좋아진다."], "answer": 1, "explain": "대부분의 유기인계, 카바메이트계 살충제는 알칼리성 물질과 섞이면 가수분해되어 유효성분이 급격히 파괴되며, 수목 잎에 심각한 약해(잎마름, 반점)를 유발합니다.", "ref": "산림농약학"}, {"id": "산림보호-92", "subject": "산림보호", "num": 92, "part": 4, "stem": "산불 진화 시 강풍으로 인해 불길이 급속히 번져 직접 진화가 불가능할 때, 주 산불 전방의 방화선 위치에서 주 산불 방향을 향해 불을 놓아 연료를 미리 태워 없애는 소화 전술은?", "options": ["직화법", "맞불(Backfire) 놓기", "냉각법", "질식법"], "answer": 1, "explain": "맞불(Backfire)은 대형 산불의 중심 상승기류가 주변 공기를 빨아들이는 흡인력을 이용하여, 방화선에서 주 산불 방향으로 마주 불을 놓아 중간의 연료를 소진시켜 산불을 진화하는 고도의 간접소화 기술입니다.", "ref": "산불방제학"}, {"id": "산림보호-93", "subject": "산림보호", "num": 93, "part": 4, "stem": "산불 피해지에서 발생하기 쉬운 2차 재해(토사 유출, 산사태 등)를 방지하기 위해 벌채 후 응급으로 시행하는 사방 공법으로 가장 적합한 것은?", "options": ["바닥막이 및 골막이, 사면 떼붙이기", "아스팔트 포장", "제초제 살포", "전면 굴착"], "answer": 0, "explain": "산불로 지피식생과 유기물이 소실된 급경사지는 폭우 시 표토 침식과 산사태 위험이 매우 크므로 골막이, 기슭막이, 사면 녹화망 및 떼붙이기 등 긴급 응급복구 사방공사를 시행합니다.", "ref": "산림공학 및 방재학"}, {"id": "산림보호-94", "subject": "산림보호", "num": 94, "part": 4, "stem": "수목의 가지나 줄기에 기생하여 엽록소가 전혀 없이 기주 수목의 체관부와 물관부에 기생근(흡기, Haustorium)을 박아 양분과 수분을 모두 탈취하는 순수 전합생 기생식물은?", "options": ["겨우살이", "새삼(Cuscuta)", "참나무", "소나무"], "answer": 1, "explain": "· 새삼(Cuscuta)은 잎과 뿌리가 퇴화하고 엽록소가 전혀 없어 기주에 100% 의존하는 전합생(완전기생) 식물입니다.\n· (겨우살이는 스스로 광합성을 하는 반기생 식물)", "ref": "산림수병학"}, {"id": "산림보호-95", "subject": "산림보호", "num": 95, "part": 4, "stem": "오리나무 잎을 갉아먹는 대표적인 식엽성 해충인 오리나무잎벌레(Agelastica coerulea)의 생활경과 및 월동태로 옳은 것은?", "options": ["연 1회 발생, 성충으로 지표의 낙엽 밑이나 흙 속에서 월동", "연 3회 발생, 알로 수피 틈에서 월동", "2년에 1회 발생, 유충으로 목질부 내에서 월동", "연 1회 발생, 번데기로 가지에 붙어 월동"], "answer": 0, "explain": "오리나무잎벌레는 연 1회 발생하며, 늦여름부터 낙엽 밑이나 얕은 흙 속으로 들어가 '성충'으로 월동한 뒤 이듬해 봄 잎이 필 때 나와 잎을 식해하고 산란합니다.", "ref": "산림곤충학"}, {"id": "산림보호-96", "subject": "산림보호", "num": 96, "part": 4, "stem": "밤나무 열매에 구멍을 뚫고 들어가 밤 과육을 갉아먹는 밤바구미(Curculio sikkimensis)의 친환경 물리적 방제법으로 널리 쓰이는 온탕 침법의 조건은?", "options": ["30℃ 물에 10분", "50℃ 온수에 약 30분간 침지", "100℃ 끓는 물에 5분", "10℃ 찬물에 1일"], "answer": 1, "explain": "수확한 생밤의 밤바구미 유충 방제를 위해 밤을 50℃의 따뜻한 물에 30분간 담갔다가 건져 냉각 건조하는 온탕 침법을 실시하면 밤의 품질 저하 없이 충란과 유충을 사멸시킬 수 있습니다.", "ref": "산림곤충학"}, {"id": "산림보호-97", "subject": "산림보호", "num": 97, "part": 4, "stem": "매미나방(Lymantria dispar)의 유충 대발생 시 환경오염을 방지하면서 알 덩어리(난괴)를 효과적으로 제거하는 물리적 방제 요령은?", "options": ["겨울철 또는 이른 봄에 나무 줄기나 바위에 붙은 난괴를 쇠솔(와이어 브러시)이나 끌로 긁어내어 소각 또는 매몰한다.", "고농도 제초제를 전면에 살포한다.", "줄기를 환상박피한다.", "피해목을 모두 베어낸다."], "answer": 0, "explain": "매미나방은 여름철 수간이나 바위 틈에 털로 덮인 스펀지 모양의 알 덩어리로 월동하므로, 부화 전(이듬해 4월 이전)에 긁어모아 물리적으로 파쇄하거나 소각하는 것이 가장 친환경적이고 효과적입니다.", "ref": "산림보호학 실무"}, {"id": "산림보호-98", "subject": "산림보호", "num": 98, "part": 4, "stem": "산림보호법령상 산림보호구역의 구분에 해당하지 **않는** 것은?", "options": ["생활환경보호구역", "수원함양보호구역", "산림유전자원보호구역", "임업소득증진구역"], "answer": 3, "explain": "산림보호구역 5개 구분: 생활환경보호구역, 수원함양보호구역, 재해방지보호구역, 산림유전자원보호구역, 특별산림보호구역. (임업소득증진구역은 법정 산림보호구역이 아님)", "ref": "산림보호법 제7조"}, {"id": "산림보호-99", "subject": "산림보호", "num": 99, "part": 4, "stem": "「소나무재선충병 방제특별법」상 소나무류 반출금지구역에서 소나무류를 이동시킬 수 있는 예외 사유로 옳은 것은?", "options": ["개인이 정원수로 쓰기 위해 굴취하는 경우", "관할 지자체장 또는 산림청장의 방제명령을 받아 방제 처리를 거친 후 이동 확인증을 발급받은 경우", "밤에 화물차로 운반하는 경우", "묘목의 직경이 5cm 이하인 경우"], "answer": 1, "explain": "반출금지구역 내의 소나무류는 원칙적으로 이동이 금지되나, 파쇄·열처리·훈증 등 완전 방제 처리를 거치고 방제공무원의 검인을 받거나 이동확인증을 발급받은 경우에만 제한적으로 이동할 수 있습니다.", "ref": "소나무재선충병 방제특별법"}, {"id": "산림보호-100", "subject": "산림보호", "num": 100, "part": 4, "stem": "산림청 산림병해충 예찰방제단의 주된 임무로 옳지 **않은** 것은?", "options": ["주요 산림병해충의 발생 실태 조사 및 조기 발견 예찰", "소나무재선충병 감염 의심목 시료 채취 및 GPS 위치 좌표 기록", "피해목 제거, 훈증, 나무주사 등 현장 방제 작업 수행", "민간 농약 판매상의 유통 가격 통제 및 영업 정지 행정처분"], "answer": 3, "explain": "산림병해충 예찰방제단은 현장 예찰, 시료 채취, 의심목 마킹, 방제 작업(수간주사, 훈증, 파쇄 등)을 수행하는 실무 현장 조직이며, 민간 농약상의 영업정지 등 행정처분 권한은 없습니다.", "ref": "산림병해충 예찰방제 지침"}, {"id": "산림보호-101", "subject": "산림보호", "num": 101, "part": 5, "stem": "「산림재난방지법」상 '산림재난'에 해당하지 **않는** 것은?", "options": ["산불", "산사태·토석류", "산림병해충", "대기오염 피해"], "answer": 3, "explain": "· 제2조: 산림재난 = 산불\n· 산사태\n· 토석류\n· 산림병해충\n· 2026.2.1 시행, 종전 「산림보호법」의 산불·산사태·병해충 규정을 옮겨 옴", "ref": "산림재난방지법 제2조"}, {"id": "산림보호-102", "subject": "산림보호", "num": 102, "part": 5, "stem": "「산림재난방지법」상 산불 규정이 적용되는 '산림인접지역'의 범위는?", "options": ["산림으로부터 50m 이내 토지", "산림으로부터 100m 이내 토지", "산림으로부터 200m 이내 토지", "산림으로부터 500m 이내 토지"], "answer": 1, "explain": "제4조제1호: 산림으로부터 100m 이내 토지(건물의 부속 토지 제외)", "ref": "산림재난방지법 제4조"}, {"id": "산림보호-103", "subject": "산림보호", "num": 103, "part": 5, "stem": "타인 소유의 산림에 불을 지른 사람에 대한 벌칙은?", "options": ["1년 이상 10년 이하의 징역", "3년 이상 10년 이하의 징역", "5년 이상 15년 이하의 징역", "3년 이하의 징역 또는 3천만원 이하의 벌금"], "answer": 2, "explain": "· 제76조: 타인 산림 5~15년\n· 자기 산림 1~10년\n· 자기 산림 불이 타인 산림으로 번지면 3~10년\n· 실화 3년 이하 또는 3천만원 이하\n· 미수범 처벌", "ref": "산림재난방지법 제76조"}, {"id": "산림보호-104", "subject": "산림보호", "num": 104, "part": 5, "stem": "「산림재난방지법」상 산림재난방지 기본계획의 수립 주체와 주기로 옳은 것은?", "options": ["산림청장, 5년마다", "산림청장, 10년마다", "시·도지사, 3년마다", "국립산림과학원장, 매년"], "answer": 0, "explain": "· 제7조: 기본계획 = 산림청장 5년마다(국회 소관 상임위 제출) / 지역계획 = 시·도지사·지방산림청장 5년마다\n· 산사태 발생우려지역 기초조사도 산림청장 5년마다(제21조)", "ref": "산림재난방지법 제7조"}, {"id": "산림보호-105", "subject": "산림보호", "num": 105, "part": 5, "stem": "공·사유림에서 산사태취약지역을 지정하는 자는?", "options": ["산림청장", "시·도지사", "특별자치시 : 10, "part": 1, "stem": "매년 말 30만원의 순수익이 영구히 발생하는 산림의 전가는? (이율 6%)", "options": ["180만원", "300만원", "450만원", "500만원"], "answer": 3, "explain": "무한연년이자 전가 = r/P = 30/0.06 = 500만원", "ref": "p.17–18"}, {"id": "산림경영-11", "subject": "산림경영", "num": 11, "part": 1, "stem": "시장가역산법으로 원목 1㎥당 임목가를 구하면? (이용률 80%, 원목 시장가 150,000원/㎥, 벌채·운반 등 생산비 30,000원/㎥, 월이율 2%, 자본회수기간 5개월, 기업이익률은 고려하지 않음)", "options": ["약 72,000원", "약 85,090원", "약 96,000원", "120,000원"], "answer": 1, "explain": "x = 0.8 × [150,000/(1 + 5 × 0.02) − 30,000] = 0.8 × (136,364 − 30,000) ≈ 85,091원", "ref": "p.27–28"}, {"id": "산림경영-12", "subject": "산림경영", "num": 12, "part": 1, "stem": "취득원가 2,000만원, 잔존가치 200만원, 내용연수 10년인 장비의 정액법 연간 감가상각비는?", "options": ["100만원", "150만원", "180만원", "200만원"], "answer": 2, "explain": "(2,000 − 200)/10 = 180만원", "ref": "p.29–31"}, {"id": "산림경영-13", "subject": "산림경영", "num": 13, "part": 1, "stem": "내용연수 5년인 장비를 연수합계법으로 상각할 때 1년차 상각률은?", "options": ["1/5", "5/15", "4/15", "5/10"], "answer": 1, "explain": "분모 1+2+3+4+5 = 15, 1년차 5/15", "ref": "p.29–31"}, {"id": "산림경영-14", "subject": "산림경영", "num": 14, "part": 1, "stem": "제재목 판매단가 40,000원/㎥, 변동비 25,000원/㎥, 고정비 300만원일 때 손익분기 판매량은?", "options": ["120㎥", "150㎥", "200㎥", "300㎥"], "answer": 2, "explain": "300만/(40,000 − 25,000) = 200㎥", "ref": "p.34–36"}, {"id": "산림경영-15", "subject": "산림경영", "num": 15, "part": 1, "stem": "10년 전 재적 200㎥, 현재 재적 300㎥인 임분의 Pressler 생장률은?", "options": ["3%", "4%", "5%", "6%"], "answer": 1, "explain": "(300 − 200)/(300 + 200) × 200/10 = 0.2 × 20 = 4%", "ref": "p.94–96"}, {"id": "산림경영-16", "subject": "산림경영", "num": 16, "part": 1, "stem": "투자분석 판단 기준으로 옳지 **않은** 것은?", "options": ["NPV가 0보다 크면 투자한다", "B/C비가 1보다 크면 투자한다", "NPV는 절대치라서 투자규모가 다른 사업끼리 비교하기 어렵다", "IRR이 시장이자율보다 작으면 투자한다"], "answer": 3, "explain": "IRR이 시장이자율보다 커야 투자", "ref": "p.36–39"}, {"id": "산림경영-17", "subject": "산림경영", "num": 17, "part": 1, "stem": "산림기본계획의 수립 주기는? (2017년 이후)", "options": ["5년", "10년", "15년", "20년"], "answer": 3, "explain": "산림기본계획·지역산림계획 20년" ions": ["현실축적이 법정축적보다 많으면 짧게, 적으면 길게 한다", "현실축적이 법정축적보다 많으면 길게, 적으면 짧게 한다", "항상 윤벌기와 같게 한다", "표준연벌채량이 생장량의 2배를 넘도록 정한다"], "answer": 0, "explain": "· Vw > Vn이면 짧게, Vw < Vn이면 길게\n· 표준연벌채량이 생장량의 1/2보다 적지 않게", "ref": "p.11"}, {"id": "산림경영-25", "subject": "산림경영", "num": 25, "part": 2, "stem": "벌구식 작업에만 적용되어 동령 단순림에 가장 적합한 수확조절 방법은?", "options": ["조사법", "Hundeshagen법", "생장률법", "평분법"], "answer": 3, "explain": "· 평분법은 벌구식 작업에만 적용 → 동령 단순림\n· 조사법은 택벌작업", "ref": "p.10, 12"}, {"id": "산림경영-26", "subject": "산림경영", "num": 26, "part": 2, "stem": "임목비용가법에 대한 설명으로 옳지 **않은** 것은?", "options": ["비용의 후가합계에서 수입의 후가합계를 뺀다", "우량임지의 임목가가 불량임지보다 높게 평가되는 경향이 있다", "임목가의 최저 하한가를 제공한다", "유령림에서만 적용할 수 있다"], "answer": 1, "explain": "불량임지보다 우량임지의 임목가가 더 적게 평가되는 경향", "ref": "p.25"}, {"id": "산림경영-27", "subject": "산림경영", "num": 27, "part": 2, "stem": "Glaser식으로 20년생 임목가를 구하면? (적정 벌기령 40년의 주벌수익 1,000만원, 초년도 조림비 100만원)", "options": ["250만원", "300만원", "325만원", "400만원"], "answer": 2, "explain": "Am = (m²/n²)(An − C₀) + C₀ = (400/1,600) × 900 + 100 = 325만원", "ref": "p.26"}, {"id": "산림경영-28", "subject": "산림경영", "num": 28, "part": 2, "stem": "임목 소유자가 직영으로 생산할 때 임목평가액은? (원목 시장가격 5,000만원, 총사업비 1,000만원, 자본회수기간 3개월, 월이율 2%, X = A − B(1 + lp))", "options": ["3,940만원", "4,000만원", "4,060만원", "4,900만원"], "answer": 0, "explain": "5,000 − 1,000 × (1 + 3 × 0.02) = 5,000 − 1,060 = 3,940만원", "ref": "p.28"}, {"id": "산림경영-29", "subject": "산림경영", "num": 29, "part": 2, "stem": "임지기망가 적용의 전제조건이 **아닌** 것은?", "options": ["임지는 잔존 임목이 없는 상태에서 시작한다", "임지는 영속적으로 숲으로만 유지된다", "매 벌기마다 현금흐름이 같다", "이율은 벌기마다 달라진다"], "answer": 3, "explain": "· 전제: 잔존임목 없음\n· 영속적 숲 유지\n· 벌기마다 현금흐름 동일", "ref": "p.21"}, {"id": "산림경영-30", "subject": "산림경영", "num": 30, "part": 2, "stem": "3년 전 2,000만원에 산 임지의 비용가는? (연이율 5%, 1.05³ = 1.157625, 다른 비용 없음)", "options": ["약 2,100만원", "약 2,315만원", "약 2,431만원", "2,500만원"], "answer": 1, "explain": "2,000 × 1.157625 ≈ 2,315만원 (비용가 = 취득원가의 복리합계)", "ref": "p.19–21"}, {"id": "산림경영-31", "subject": "산림경영", "num": 31, "part": subject": "산림경영", "num": 47, "part": 3, "stem": "윤척으로 흉고직경을 잴 때의 올바른 방법은?", "options": ["지상 0.5m에서 한 방향만 잰다", "지상 1.2m에서 서로 직각인 두 방향을 재어 평균한다", "지상 2m에서 최대 직경만 잰다", "수피를 벗기고 잰다"], "answer": 1, "explain": "흉고 지상 1.2m(모듈 산림조사 기준), 직교 두 방향 평균", "ref": "모듈 p.52~ · 산림측정학"}, {"id": "산림경영-48", "subject": "산림경영", "num": 48, "part": 3, "stem": "통나무 재적식 중 중앙단면적과 길이를 곱하는 식은?", "options": ["Smalian식", "Huber식", "Newton식", "Pressler식"], "answer": 1, "explain": "· Huber = 중앙단면적 × 길이\n· Smalian = 양단면적 평균 × 길이", "ref": "산림측정학"}, {"id": "산림경영-49", "subject": "산림경영", "num": 49, "part": 3, "stem": "생장추(increment borer)의 주된 용도는?", "options": ["수고 측정", "수관폭 측정", "목편을 뽑아 연륜(나이테) 측정", "토양 경도 측정"], "answer": 2, "explain": "· 목편 채취 → 연륜폭·연령 측정\n· Schneider 생장률(수피 안쪽 1cm 연륜수)에 쓰임", "ref": "모듈 p.96 · 산림측정학"}, {"id": "산림경영-50", "subject": "산림경영", "num": 50, "part": 3, "stem": "지위지수(site index)의 정의는?", "options": ["임분의 ha당 본수", "임분의 평균 흉고직경", "토양의 pH", "기준임령에서 우세목의 평균 수고"], "answer": 3, "explain": "· 지위지수 = 기준임령(예: 30년)에서 우세목 평균수고\n· 모듈은 우세목 3~5본으로 지위 판정", "ref": "산림경영학"}, {"id": "산림경영-51", "subject": "산림경영", "num": 51, "part": 4, "stem": "서 있는 나무(입목)의 재적을 구할 때 수고의 기준을 흉고(1.2m)로 잡고 그 단면적과 원기둥의 비율로 계산하는 가장 실용적인 형수는?", "options": ["흉고형수", "절대형수", "정형수", "진정형수"], "answer": 0, "explain": "흉고형수(Breast-height form factor)는 지상 1.2m 단면적을 기준으로 하여 실무에서 가장 널리 쓰임", "ref": "산림측정학"}, {"id": "산림경영-52", "subject": "산림경영", "num": 52, "part": 4, "stem": "벌채한 원목 줄기를 일정 구간(보통 1~2m)으로 잘라 각 단면의 연륜을 측정하여 나무의 일생 동안의 생장 과정을 정밀하게 복원하는 조사법은?", "options": ["수간석해(Stem analysis)", "표준목법", "매목조사", "지위지수법"], "answer": 0, "explain": "수간석해(Stem analysis)는 벌채목의 원판을 채취하여 과거 5년, 10년 단위의 생장 궤적을 복원", "ref": "산림측정학"}, {"id": "산림경영-53", "subject": "산림경영", "num": 53, "part": 4, "stem": "흉고직경(D)과 최근 반경생장량(나이테 폭 n)을 측정하여 수목의 생장률(P)을 간편하게 추정하는 슈나이더(Schneider) 공식의 형태는?", "options": ["P = K / (n · D)", "P = (D / n) × 100", "P = (V - v) / (V + v)", "P = K · n · D"], "answer": 0, "explain": "· 슈나이더 생장률 공식은 P = K / (n\n· D) (여기서 K는 상수, n은 수피 안쪽 1cm당 나이테 수, D는 흉고직경)", "ref": "산림측정학"}, {"id": "산림경영-54", "subject": "산림경영", "num": 54, "part": 4, "stem": "훈데스하겐(Hundeshagen) 법정벌채량(Y) 산정 공식의 기본 가정으로 옳은 것은?", "options": ["현실임분의 생장량은 항상 법정생장량보다 크다", "현실축적에 대한 법정벌채량의 비율은 법정축적에 대한 법정생장량의 비율과 같다", "벌채량은 림목의 수고생장량에만 비례한다", "영급배치가 불균등할 때는 면적만을 기준으로 벌채한다"], "answer": 1, "explain": "· 훈데스하겐 공식은 현실축적(V)과 법정축적(V_n)의 비가 현실벌채량(Y)과 법정벌채량(E)의 비와 같다는 가정 (Y = E\n· V\n· V_n)", "ref": "산림경영학"}, {"id": "산림경영-55", "subject": "산림경영", "num": 55, "part": 4, "stem": "산림의 토지(산지)에서 영구히 얻을 수 있는 순수익의 현재가치 합계를 계산하여 토지의 가치를 평가하는 파우스트만(Faustmann) 식의 명칭은?", "options": ["토지비용가", "토지기대가치", "임목기망가", "토지매매가"], "answer": 1, "explain": "Faustmann의 토지기대가치(Bu)는 영구 순수익의 현재가치 합계를 산출하는 고전적 산림평가 공식", "ref": "산림평가학"}, {"id": "산림경영-56", "subject": "산림경영", "num": 56, "part": 4, "stem": "다 자란 성숙림(벌기에 도달한 임목)의 경제적 가치를 평가할 때, 시장의 원목 판매가격에서 벌채비·집재비·운재비 및 기업자의 정상이윤을 공제하여 산정하는 평가법은?", "options": ["글라저(Gläser) 공식", "비용가법", "시장가역산법(원목매매가법)", "복리이자법"], "answer": 2, "explain": "시장가역산법(원목매매가법)은 시장 원목가격에서 투입 비용과 적정 이윤을 역산하여 입목가격을 산정", "ref": "산림평가학"}, {"id": "산림경영-57", "subject": "산림경영", "num": 57, "part": 4, "stem": "임업기계(포워더, 굴착기 등)의 감가상각 시 실제 작업시간이나 가동 거리에 비례하여 상각비를 계상하는 방식은?", "options": ["정액법", "정률법", "비례법(작업시간비례법)", "연수합계법"], "answer": 2, "explain": "비례법(작업시간비례법)은 장비의 실제 가동량이나 작업시간에 비례하여 감가상각비를 균등 배분", "ref": "임업기계학"}, {"id": "산림경영-58", "subject": "산림경영", "num": 58, "part": 4, "stem": "임업 경영에서 적용되는 임업이율의 일반적인 경제적 특성으로 옳은 것은?", "options": ["일반 상업은행의 상업이율보다 대체로 낮다", "단기 이율로서 변동성이 매우 크다", "인플레이션이 심할수록 실질이율이 급상승한다", "화폐이율보다 명목이율이 항상 낮다"], "answer": 0, "explain": "임업이율은 장기성, 안전성, 현물생장 등의 특성으로 인해 일반 상업이율(3~5%)보다 낮은 2~3% 수준", "ref": "산림경제학"}, {"id": "산림경영-59", "subject": "산림경영", "num": 59, "part": 4, "stem": "우리나라 산림경영계획에서 수목의 수령을 10년 단위로 묶어 표기하는 영급(Age class) 중 'IV영급'에 해당하는 임령 범위는?", "options": ["11~20년생", "21~30년생", "31~40년생", "41~50년생"], "answer": 2, "explain": "영급은 10년 단위: I(1~10), II(11~20), III(21~30), IV(31~40), V(41~50)", "ref": "산림자원조사지침"}, {"id": "산림경영-60", "subject": "산림경영", "num": 60, "part": 4, "stem": "산림경영계획을 수립하기 위해 산림을 구획할 때, 영구적인 경계(능선, 하천, 도로 등)를 기준으로 나누는 가장 큰 산림 구획 단위는?", "options": ["소반", "임반(Compartment)", "시업지", "표준지"], "answer": 1, "explain": "산림 구획에서 가장 큰 단위는 임반(Compartment), 그 하부 세분화 단위는 소반(Sub-compartment)", "ref": "산림경영계획"}, {"id": "산림경영-61", "subject": "산림경영", "num": 61, "part": 4, "stem": "특정 수종의 지위(산림의 입지 생산력)를 판정하기 위해 기준 연령(보통 30년생)에서 우세목의 평균 수고를 나타낸 지표는?", "options": ["수확표", "지위지수(Site index)", "형수", "임목축적도"], "answer": 1, "explain": "지위지수(Site index)는 기준임령(보통 30년생)에서 우세목의 수고로 해당 산지의 생산 잠재력을 판정", "ref": "산림측정학"}, {"id": "산림경영-62", "subject": "산림경영", "num": 62, "part": 4, "stem": "매목조사 시 직경 측정기구인 윤척(Caliper)의 사용 요령으로 옳지 **않은** 것은?", "options": ["윤척의 고정각과 유동각은 항상 자의 눈금대와 직각을 유지해야 한다", "타원형 나무는 최대 직경과 최소 직경을 각각 측정하여 평균한다", "경사지에서는 반드시 경사면 아래쪽에 서서 가슴높이를 잰다", "가슴높이 부위에 혹이나 가지가 있으면 그 바로 위나 아래를 잰다"], "answer": 2, "explain": "경사지에서 흉고직경을 측정할 때는 반드시 경사 위쪽(Higher side)에 서서 1.2m 위치를 측정", "ref": "산림조사요령"}, {"id": "산림경영-63", "subject": "산림경영", "num": 63, "part": 4, "stem": "산림경영의 지속성(보속성)을 검토하기 위해 일정 기간 동안의 벌채량과 임분의 생장량을 비교하는 수확조정 기법 중, 전 임분의 면적을 벌기령 연수만큼 똑같이 나누어 매년 균등한 면적을 벌채하도록 계획하는 방법은?", "options": ["면적평분법", "재적평분법", "이용률법", "생장량법"], "answer": 0, "explain": "면적평분법은 임분 면적을 윤벌기 연수로 나누어 매년 일정 면적을 윤번 벌채하는 가장 단순한 보속법", "ref": "산림경영계획"}, {"id": "산림경영-64", "subject": "산림경영", "num": 64, "part": 4, "stem": "산림탄소상쇄제도에서 산주나 사업자가 흡수한 온실가스 감축량을 인증받아 배출권 거래시장에서 거래할 수 있는 사업 유형은?", "options": ["거래형 산림탄소상쇄사업", "비거래형 산림탄소상쇄사업", "사회공헌형 사업", "단순녹색사업"], "answer": 0, "explain": "탄소배출권 시장에서 현금 거래가 가능한 사업 유형은 거래형 산림탄소상쇄사업", "ref": "산림탄소상쇄제도"}, {"id": "산림경영-65", "subject": "산림경영", "num": 65, "part": 4, "stem": "임목수확 시 목재의 이용 목적 중 전신주, 비계목, 통나무집 건축용 등 특정 규격의 굵기와 형태에 도달했을 때 벌채하는 벌기령은?", "options": ["재적벌기령", "공예적 벌기령", "화폐수익최대 벌기령", "토지순수익최대 벌기령"], "answer": 1, "explain": "특정한 공예적 목적(가공 규격)에 도달하는 시기를 기준으로 정한 벌기를 공예적 벌기령이라 함", "ref": "산림경영학"}, {"id": "산림경영-66", "subject": "산림경영", "num": 66, "part": 4, "stem": "광학적 원리를 이용하여 서 있는 나무의 높은 위 s": ["단순임의추출법", "계통적 추출법", "층화임의추출법(Stratified sampling)", "군집추출법"], "answer": 2, "explain": "층화임의추출법은 산림을 동질적인 층으로 나누어 표본을 뽑으므로 표본오차가 가장 적고 정밀도가 높습니다.", "ref": "산림통계학"}, {"id": "산림경영-73", "subject": "산림경영", "num": 73, "part": 4, "stem": "산림 투자 사업의 경제성 분석 시 적용하는 할인율(Discount rate)이 상승할 때 나타나는 현상으로 옳은 것은?", "options": ["순현재가치(NPV)가 감소하여 투자 타당성이 낮아진다.", "순현재가치가 급격히 증가한다.", "내부수익률(IRR)이 0이 된다.", "임업 투자가 상업 금융보다 훨씬 유리해진다."], "answer": 0, "explain": "할인율(이자율)이 높아지면 미래에 수확할 목재 수익의 현재가치가 크게 깎이므로 NPV가 감소합니다.", "ref": "산림경제학"}, {"id": "산림경영-74", "subject": "산림경영", "num": 74, "part": 4, "stem": "림분의 총축적(V)과 윤벌기(u)를 알 때, 매년 수확할 수 있는 표준 연간 벌채량(E)을 구하는 맨텔(Mantel) 공식은?", "options": ["E = 2V / u", "E = V · u", "E = V / (2u)", "E = u / V"], "answer": 0, "explain": "· 맨텔(Mantel) 공식: 법정축적 V = (E\n· u)/2 이므로 연간 벌채량은 E = 2V\n· u 가 됩니다.", "ref": "산림경영학 보속수확론"}, {"id": "산림경영-75", "subject": "산림경영", "num": 75, "part": 4, "stem": "온실가스 배출권 거래제 및 산림탄소상쇄사업에서 사업 구역 내의 활동으로 인해 구역 외부에서 온실가스 배출이 오히려 증가하는 현상을 뜻하는 용어는?", "options": ["기준선(Baseline)", "누출(Leakage)", "추가성(Additionality)", "영구성"], "answer": 1, "explain": "산림을 보존하여 벌채를 억제했더니 다른 산림에서 벌채가 늘어나 탄소가 배출되는 역효과를 '누출(Leakage)'이라 합니다.", "ref": "탄소흡수원제도"}, {"id": "산림경영-76", "subject": "산림경영", "num": 76, "part": 4, "stem": "인가받은 산림경영계획을 의무적으로 변경 인가받아야 하는 중대한 사유에 해당하는 것은?", "options": ["산림의 소유자가 변경되거나 시업 대상지 면적이 20% 이상 증감된 경우", "단순 관리자 이름 오기 정정", "산림 내 야생화 군락지 발견", "날씨 변화로 작업 일정이 1주일 순연된 경우"], "answer": 0, "explain": "산주 변경이나 경영 대상 면적이 20% 이상 대폭 변동될 때는 반드시 관할 지자체장의 변경 인가를 받아야 합니다.", "ref": "산림자원법"}, {"id": "산림경영-77", "subject": "산림경영", "num": 77, "part": 4, "stem": "수확한 목재를 가구, 건축물 등으로 장기 이용할 때 대기 중으로 탄소가 방출되지 않고 목재 내에 그대로 저장되는 효과를 뜻하는 국제 공식 용어는?", "options": ["HWP (Harvested Wood Products, 수확목제품) 탄소저장 효과", "CDM 사업", "REDD+ 사업", "그린워싱"], "answer": 0, "explain": "벌채된 나무를 버리지 않고 목조건축·가구로 오래 쓰면 탄소를 붙잡아두는 HWP 탄소고정 효과가 인정됩니다.", "ref": "기후변화협약 산림탄소"}, {"id": "산림경영-78", "subject": "산림경영", "num": 78, "part": 4, "stem": "산림 자산의 감정평가 기법 중 토지와 입목을 일괄하여 현금흐름할인법(DCF)으로 미래 기대 순수익을 현재가치로 환원하는 수익환원법의 한계점으로 옳은 것은?", "options": ["과거 지출 비용을 정밀하게 반영하기 어렵고 미래 벌채 시점의 목재 가격 및 이자율 예측에 주관성이 개입된다.", "수학적 계산이 전혀 불가능하다.", "다 자란 성숙림에만 쓸 수 있다.", "토지의 가치를 항상 0으로 계산한다."], "answer": 0, "explain": "수익환원법은 수십 년 뒤의 미래 목재 시장가격과 장기 이자율을 예측해야 하므로 주관적 가정이 개입될 위험이 있습니다.", "ref": "산림평가학"}, {"id": "산림경영-79", "subject": "산림경영", "num": 79, "part": 4, "stem": "산림조합이 산주와 계약을 체결하여 산림경영계획 작성부터 조림, 숲가꾸기, 벌채 및 목재 판매까지 전 과정을 도맡아 대행해 주는 임업 협동경영 제도는?", "options": ["산림 대리경영 제도", "공유림 위탁 매수제", "국유림 분수림 제도", "환지처분제도"], "answer": 0, "explain": "산림조합의 핵심 사업 중 하나로 부재산주나 고령 산주를 대신해 산림을 전문 관리해 주는 것이 대리경영 제도입니다.", "ref": "산림조합법"}, {"id": "산림경영-80", "subject": "산림경영", "num": 80, "part": 4, "stem": "산림경영계획서 작성 시 지황(Land condition) 조사 항목에 포함되지 않는 것은?", "options": ["지종 (산림의 지목)", "방위, 경사도, 표고", "토성 및 토심", "입목의 흉고직경 및 수고"], "answer": 3, "explain": "지황(地況)은 땅과 입지 환경(지형, 방위, 토양 등)을 뜻하며, 나무의 지름과 키는 '임황(林況)' 조사 항목입니다.", "ref": "산림자원조사지침"}, {"id": "산림경영-81", "subject": "산림경영", "num": 81, "part": 4, "stem": "산림조사 시 임분의 밀도를 나타내는 지표 중 입목본수도(Stocking percent)와 수관울폐도(Crown closure)에 대한 설명으로 옳은 것은?", "options": ["입목본수도는 단위면적당 입목재적만을 나타낸다.", "수관울폐도는 하늘에서 내려다보았을 때 수관이 임지 지표면을 차폐하고 있는 면적 비율(%)이다.", "입목본수도와 수관울폐도는 항상 수치가 일치한다.", "수관울폐도가 100%이면 무조건 대경목 숲이다."], "answer": 1, "explain": "수관울폐도는 수관 투영면적이 임지 면적을 덮고 있는 비율(0~100%)이며, 입목본수도는 표준 수확표의 기준 본수 대비 현실 본수의 비율을 뜻합니다.", "ref": "산림측정학"}, {"id": "산림경영-82", "subject": "산림경영", "num": 82, "part": 4, "stem": "산림경영계획 수립을 위한 산림조사 중 토지의 자연적 입지 조건을 조사하는 지황(地況) 조사의 6대 기본 항목이 **아닌** 것은?", "options": ["방위", "경사도", "토성 및 토심", "흉고직경 및 수고"], "answer": 3, "explain": "지황(地況) 조사는 산지 토지 자체의 조건(방위, 경사도, 해발고, 토성, 토심, 건습도 등)을 조사하는 것이며, 흉고직경, 수고, 임령 등은 임황(林況) 조사 항목입니다.", "ref": "산림자원의 조성 및 관리에 관한 법률 시행규칙"}, {"id": "산림경영-83", "subject": "산림경영", "num": 83, "part": 4, "stem": "임목의 생장 단계에서 연년생장량(CAI, Current annual increment)과 총평균생장량(MAI, Mean annual increment)의 관계에 대한 설명으로 옳은 것은?", "options": ["CAI가 최대가 되는 시점에서 MAI 곡선과 교차한다.", "CAI가 MAI보다 큰 기간에는 MAI 곡선이 상승한다.", "CAI 곡선은 수목이 고사할 때까지 계속 상승한다.", "MAI가 최대가 되는 시점 이전에 벌채해야 총생산재적이 최대가 된다."], "answer": 1, "explain": "한 해의 생장량(CAI)이 지금까지의 평균생장량(MAI)보다 크면 평균치는 계속 올라가며, CAI가 감소하여 MAI와 교차하는 지점에서 총평균생장량(MAI)이 최대치(재적수확 최대 벌기)에 도달합니다.", "ref": "산림경영학 생장론"}, {"id": "산림경영-84", "subject": "산림경영", "num": 84, "part": 4, "stem": "벌채목의 수간석해(Stem analysis) 과정에서 채취한 각 원판의 연륜을 분석할 때 측정하지 **않는** 것은?", "options": ["각 영급(5년 또는 10년)별 반경 생장량", "변재와 심재의 비율", "수고 성장 경과", "수관의 엽면적 지수"], "answer": 3, "explain": "수간석해는 원판의 나이테를 통해 과거 직경, 수고, 재적의 경년 생장 궤적을 복원하는 측정법이며, 이미 벌채된 통나무 원판에서 엽면적 지수를 측정할 수는 없습니다.", "ref": "산림측정학"}, {"id": "산림경영-85", "subject": "산림경영", "num": 85, "part": 4, "stem": "Reineke의 임분밀도지수(Stand Density Index, SDI) 공식에서 기준으로 삼는 평균 흉고직경(DBH) 기준 수치는?", "options": ["10cm", "20cm", "25cm (또는 10인치)", "50cm"], "answer": 2, "explain": "Reineke의 임분밀도지수(SDI)는 평균 흉고직경 25cm(미국 기준 10인치)일 때 단위면적(1ha)당 존재하는 입목 본수로 임분의 과밀도를 정량화한 지수입니다.", "ref": "산림경영학"}, {"id": "산림경영-86", "subject": "산림경영", "num": 86, "part": 4, "stem": "임업 기계장비(트랙터, 집재기 등)의 감가상각 시 내용연수가 만료된 시점에서의 폐기 매각 추정가치를 뜻하는 용어는?", "options": ["잔존가치(Salvage value)", "취득원가", "장부가액", "기회비용"], "answer": 0, "explain": "잔존가치(Salvage value)는 내용연수가 다한 기계장비를 고철 등으로 매각하거나 처분할 때 회수할 수 있는 예상 잔여 가치로, 보통 취득원가의 5~10%로 설정합니다.", "ref": "임업경제학 감가상각론"}, {"id": "산림경영-87", "subject": "산림경영", "num": 87, "part": 4, "stem": "국립산림과학원 원목 규격 고시상 원목의 품등(1등급, 2등급, 3등급, 등외)을 결정하는 주된 외관 결점 요소가 **아닌** 것은?", "options": ["옹이(생옹이 및 사옹이 크기)", "굽음(곡률)", "썩음(부후)", "목재의 함수율"], "answer": 3, "explain": "원목의 등급 판정은 외관상 결점인 옹이 지름, 굽음(곡률도), 갈라짐(할렬), 썩음, 벌레구멍 등을 기준으로 판정하며, 함수율은 원목의 품등 판정 요소가 아닙니다.", "ref": "목재의 지속가능한 이용에 관한 법률"}, {"id": "산림경영-88", "subject": "산림경영", "num": 88, "part": 4, "stem": "산림 자산의 평가 방법 중 토지와 입목을 일괄하여 매년 발생하는 영구 순수익을 적정 할인율(자본환원율 r)로 나누어 현재가치를 구하는 부동산 평가 방식은?", "options": ["원가법", "수익환원법(Direct capitalization)", "시장비교법", "잔여법"], "answer": 1, "explain": "· 수익환원법은 장래 기대되는 순수익(Net income, a)을 자본환원율(r)로 자본환원하여 산림 가치(P = a\n· r)를 산출하는 방법입니다.", "ref": "산림평가학"}, {"id": "산림경영-89", "subject": "산림경영", "num": 89, "part": 4, "stem": "산림경영계획 수립 시 기본 구획 단위인 소반(Sub-compartment)을 구획하는 최소 면적 기준은?", "options": ["0.01ha", "0.1ha 이상", "1.0ha 이상", "5.0ha 이상"], "answer": 1, "explain": "산림경영계획 작성 요령상 소반의 면적은 원칙적으로 0.1ha 이상으로 구획합니다.", "ref": "지속가능한 산림경영계획 수립 및 실행 규정"}, {"id": "산림경영-90", "subject": "산림경영", "num": 90, "part": 4, "stem": "이상적인 보속생산 숲인 법정림(Normal forest)의 4대 조건 중 풍해를 예방하고 벌채·운재를 원활하게 하기 위해 나이순으로 숲을 질서정연하게 배치하는 원칙은?", "options": ["법정영급분배", "법정임분배치", "법정생장량", "법정축적"], "answer": 1, "explain": "법정임분배치는 벌채 시 인접한 유령림이 바람 피해(풍도)를 받지 않도록 주풍의 반대 방향에서 주풍 방향으로 노령림부터 유령림 순으로 질서 있게 배치하는 원칙입니다.", "ref": "산림경영학 법정림론"}, {"id": "산림경영-91", "subject": "산림경영", "num": 91, "part": 4, "stem": "산림경영계획서에 첨부되는 산림경영계획도의 표준 제작 축척은?", "options": ["1:1,000", "1:5,000 또는 1:25,000", "1:100,000", "1:500,000"], "answer": 1, "explain": "산림경영계획도는 정밀 임소반 파악을 위해 1:5,000 축적의 임상도(또는 수치지형도)를 기본으로 하며, 광역 파악을 위해 1:25,000 축적이 병행 사용됩니다.", "ref": "산림경영계획 수립 기준"}, {"id": "산림경영-92", "subject": "산림경영", "num": 92, "part": 4, "stem": "현실임분의 벌채량을 결정하는 생장량법 공식 중 현실축적이 법정축적보다 부족할 때 벌채량을 생장량보다 적게 책정하여 축적을 축적시키는 수확조절 원리는?", "options": ["보속수확론", "카를(Karl) 식", "보겔(Baur) 식", "평형수확론"], "answer": 0, "explain": "보속수확 원칙하에서 현실축적이 목표 법정축적에 미달할 때는 연간 벌채량을 연간 생장량 이하로 제한하여 부족한 축적을 연차적으로 증대시킵니다.", "ref": "산림경영학 수확조절론"}, {"id": "산림경영-93", "subject": "산림경영", "num": 93, "part": 4, "stem": "온실가스 인벤토리 보고서에서 산림의 입목 바이오매스 탄소저장량을 산정할 때 목재 재적(m³)을 건중량(ton)으로 변환하는 기본 계수는?", "options": ["목재기본밀도(Wood basic density)", "함수율", "조도계수", "형수"], "answer": 0, "explain": "탄소 산정 공식: 입목재적(m³) × 목재기본밀도(ton/m³) × 바이오매스확장계수(BEF) × (1 + 뿌리함량비) × 탄소전환계수(0.5)로 계산됩니다.", "ref": "기후변화협약 산림탄소통계"}, {"id": "산림경영-94", "subject": "산림경영", "num": 94, "part": 4, "stem": "임가경제조사에서 임가의 연간 총소득 중 순수하게 영림 및 임산물 생산·채취 활동을 통해 얻은 소득을 가리키는 것은?", "options": ["임업소득(Forestry income)", "임업외소득", "이전소득", "비경상소득"], "answer": 0, "explain": "임가소득 = 임업소득 + 임업외소득 + 이전소득 + 비경상소득으로 구성되며, 순수 임업 활동에서 벌어들인 총수입에서 임업경영비를 뺀 순액이 '임업소득'입니다.", "ref": "임업경제학"}, {"id": "산림경영-95", "subject": "산림경영", "num": 95, "part": 4, "stem": "산림경영지도원 제도의 운영 목적 및 법적 근거에 대한 설명으로 옳은 것은?", "options": ["산림자원법 제31조에 근거하여 사유림 산주의 자율경영을 지도·지원하기 위해 배치된다.", "국유림만을 전담하여 벌채를 감독하는 특수사법경찰관이다.", "산림청에만 배치되는 국가 일반직 공무원이다.", "목재 가공 공장의 품질만을 검사하는 기술직원이다."], "answer": 0, "explain": "산림경영지도원은 「산림자원의 조성 및 관리에 관한 법률」(산림자원법) 제31조에 따라 산림조합중앙회장의 요청으로 산림청장이 산림조합 및 산림조합중앙회에 배치하며, 영세한 사유림 산주들을 대상으로 산림경영계획 작성, 임업기술 지도, 조림·숲가꾸기 대리경영 등을 수행하는 공인 전문인력입니다.", "ref": "산림자원법 제31조 (2026.11 정정: 기존 '산림조합법 제31조'는 오기)"}, {"id": "산림경영-96", "subject": "산림경영", "num": 96, "part": 4, "stem": "상호 배타적인 두 개 이상의 산림 투자 사업 대안을 비교 평가할 때, 사업 규모의 차이로 인해 왜곡이 발생할 수 있는 내부수익률법(IRR)보다 이론적으로 가장 우수한 평가 기준은?", "options": ["순현재가치법(NPV)", "단순회수기간법", "투자이익률법", "매출액영업이익률"], "answer": 0, "explain": "내부수익률법(IRR)은 재투자 수익률 가정이 비현실적이거나 복수의 할인율이 존재할 수 있는 반면, 순현재가치법(NPV)은 기업의 부(가치) 극대화 기준에 항상 일치하므로 가장 신뢰받는 의사결정 기준입니다.", "ref": "산림투자경제학"}, {"id": "산림경영-97", "subject": "산림경영", "num": 97, "part": 4, "stem": "산림이 제공하는 맑은 물 공급, 탄소 흡수, 산사태 방지 등 비시장 공익 기능을 유지·증진하기 위해 산주나 산림관리자에게 경제적 보상을 지급하는 제도는?", "options": ["산림생태계서비스 지불제(PES, Payments for Ecosystem Services)", "농어촌특별세", "탄소세", "산지전용부담금"], "answer": 0, "explain": "PES(생태계서비스 지불제)는 공익적 혜택을 생산하는 산주에게 사회가 직접 인센티브를 제공하여 산림 보존과 지속가능한 경영을 유도하는 현대 환경경제 정책 수단입니다.", "ref": "산림정책학"}, {"id": "산림경영-98", "subject": "산림경영", "num": 98, "part": 4, "stem": "동일한 토지에서 임목 생산과 농작물 재배, 또는 가축 방목을 복합적으로 결합하여 토지 생산성을 극대화하고 생태적 안정성을 높이는 토지이용 형태는?", "options": ["혼농임업(Agroforestry)", "단벌기 에너지림", "순환벌채림", "상업적 단일림"], "answer": 0, "explain": "혼농임업(Agroforestry, 임농복합경영)은 수목과 농작물 또는 가축을 입체적으로 복합 경영하여 조기 소득을 창출하고 생물다양성을 보전하는 경영 방식입니다.", "ref": "임업경영학"}, {"id": "산림경영-99", "subject": "산림경영", "num": 99, "part": 4, "stem": "산림이 환경적·사회적·경제적 기준에 맞추어 지속가능하게 경영되고 있음을 제3자 독립 인증기관이 심사하여 부여하는 국제 산림인증의 양대 기구는?", "options": ["FSC 및 PEFC", "WTO 및 OECD", "FAO 및 UNEP", "ISO 및 KS"], "answer": 0, "explain": "국제 산림인증의 대표적 기구는 산림관리협의회(FSC, Forest Stewardship Council)와 범유럽산림인증(PEFC, Programme for the Endorsement of Forest Certification)입니다.", "re t": 4, "stem": "「백두대간 보호에 관한 법률」상 백두대간 보호지역 중 핵심구역에서 원칙적으로 금지되는 행위는?", "options": ["군사시설의 설치", "국가안전보장 시설", "대규모 광산 개발 및 골프장 설치", "문화재 복원"], "answer": 2, "explain": "백두대간 핵심구역 내에서는 광산 개발, 골프장 조성 등 대규모 개발행위 절대 불가", "ref": "백두대간법"}, {"id": "산림관계법규-63", "subject": "산림관계법규", "num": 63, "part": 4, "stem": "「산지관리법」상 산지전용허가를 받은 자가 목적 사업을 완료한 후 토사 유출을 방지하기 위해 반드시 받아야 하는 행정 절차는?", "options": ["토석채취허가", "복구준공검사", "산림조사보고서 제출", "임도노선변경인가"], "answer": 1, "explain": "산지전용 목적 사업을 마친 자는 토사 유출 및 산사태 방지를 위해 복구준공검사를 필해야 함", "ref": "산지관리법"}, {"id": "산림관계법규-64", "subject": "산림관계법규", "num": 64, "part": 4, "stem": "「목재의 지속가능한 이용에 관한 법률」상 소비자를 보호하고 목재 유통 질서를 확립하기 위해 지정된 목재제품에 대해 의무화된 제도는?", "options": ["목재제품 규격·품질검사 및 표시 제도", "원목 전수 경매 제도", "목재 수출 쿼터제", "목조건축 탄소세 부과제"], "answer": 0, "explain": "제재목, 합판, 목재펠릿 등 주요 목재제품은 규격·품질검사를 거쳐 품질표시를 부착해야 함", "ref": "목재이용법"}, {"id": "산림관계법규-65", "subject": "산림관계법규", "num": 65, "part": 4, "stem": "「산림조합법」상 지역산림조합의 최고의사결정기구인 총회의 소집 권한을 가진 자는?", "options": ["산림청장", "조합장", "시·도지사", "상임이사"], "answer": 1, "explain": "지역산림조합의 총회는 조합장이 소집함", "ref": "산림조합법"}, {"id": "산림관계법규-66", "subject": "산림관계법규", "num": 66, "part": 4, "stem": "「임업·산촌 공익기능 증진을 위한 직접지불제도 운영에 관한 법률(임업직불제법)」상 임산물생산업 직접지불금의 지급 대상 산지에 해당하는 것은?", "options": ["산지관리법에 따른 보전산지 및 준보전산지로서 실제 임업에 이용되는 산지", "국유림 유상 대부지", "도시지역 내 상업지역 산지", "골프장 및 리조트 부지 내 산림"], "answer": 0, "explain": "임업직불제는 보전산지 및 준보전산지에서 실제 임업에 종사하는 임업인에게 지급", "ref": "임업직불제법"}, {"id": "산림관계법규-67", "subject": "산림관계법규", "num": 67, "part": 4, "stem": "「산림보호법」상 산림병해충의 번식을 막기 위해 병든 나무의 소각·파쇄·훈증 등 방제명령을 내릴 수 있는 권한권자는?", "options": ["시장·군수·구청장 또는 지방산림청장", "소방서장", "농림축산식품부장관", "산림조합 지도과장"], "answer": 0, "explain": "산림병해충 방제명령 권한은 시장·군수·구청장 또는 국유림 관리 지방산림청장에게 있음", "ref": "산림보호법"}, {"id": "산림관계법규-68", "subject": "산림관계법규", "num": 68, "part": 4, "stem": "「산림자원의 조성 및 관리에 관한 법률」상 도시숲·생활숲·가로수를 체계적으로 조성·관리하기 위해 산림청장이 수립하는 기본계획의 주기는?", "options": ["5년마다", "10년마다", "15년마다", "20년마다"], "answer": 1, "explain": "도시숲·생활숲 조성·관리 기본계획은 산림청장이 10년마다 수립", "ref": "도시숲법"}, {"id": "산림관계법규-69", "subject": "산림관계법규", "num": 69, "part": 4, "stem": "「탄소흡수원 유지 및 증진에 관한 법률」상 산림의 온실가스 감축 효과를 인증받는 산림탄소흡수량의 거래 단위는?", "options": ["1kg CO₂eq", "1t CO₂eq", "10t CO₂eq", "100t CO₂eq"], "answer": 1, "explain": "산림탄소흡수량의 기본 인증 단위는 1t CO₂eq (이산화탄소 상당량 톤)", "ref": "탄소흡수원법"}, {"id": "산림관계법규-70", "subject": "산림관계법규", "num": 70, "part": 4, "stem": "「산림자원의 조성 및 관리에 관한 법률」상 채종림 또는 채종원으로 지정·고시된 산림 구역에서의 제한 행위로 옳은 것은?", "options": ["산림청장의 허가 없이 임목을 벌채하거나 종자를 채취하는 행위 금지", "공인된 학술 연구 목적의 진입도 절대 금지", "가축의 방목은 연중 언제나 자유롭게 허용", "잡초 제거 및 풀베기 작업 전면 금지"], "answer": 0, "explain": "채종림·채종원에서는 우량 종자 보존을 위해 무단 입목 벌채 및 임의 종자 채취가 엄격히 금지됨", "ref": "산림자원법"}, {"id": "산림관계법규-71", "subject": "산림관계법규", "num": 71, "part": 4, "stem": "「산지관리법」상 산지전용허가를 받지 않고 일정 기간 동안 임시로 산지를 사용한 후 원상복구하는 산지일시사용신고의 대상 행위는?", "options": ["아파트 단지 신축", "산림경영관리사(연면적 50㎡ 이하) 설치 및 임도·작업로 개설", "대규모 골프장 건설", "산업단지 공장 설립"], "answer": 1, "explain": "산림경영을 위한 50㎡ 이하의 관리사, 임도, 작업로, 임산물 건조장 등은 산지일시사용신고 대상으로 허가보다 절차가 간소합니다.", "ref": "산지관리법"}, {"id": "산림관계법규-72", "subject": "산림관계법규", "num": 72, "part": 4, "stem": "「임업 및 산촌 진흥 촉진에 관한 법률」상 임업의 생산성을 높이고 임업을 집약적으로 경영하기 위해 산림을 지정·고시하는 구역은?", "options": ["임업진흥권역", "자연휴양림구역", "산지전용제한지역", "도시계획구역"], "answer": 0, "explain": "관할 시·도지사는 임업의 집약적 육성을 위해 보전산지 등을 대상으로 임업진흥권역을 지정합니다.", "ref": "임업진흥법"}, {"id": "산림관계법규-73", "subject": "산림관계법규", "num": 73, "part": 4, "stem": "「산림복지 진흥에 관한 법률」상 경제적·사회적 여건 등으로 산림복지 혜택을 받기 어려운 소외계층에게 자연휴양림이나 치유의 숲을 이용할 수 있도록 제공하는 바우처의 공식 명칭은?", "options": ["산림복지서비스이용권", "국민행복카드", "녹색성장카드", "산림치유바우처"], "answer": 0, "explain": "산림복지이용권(바우처)은 취약계층의 산림휴양·치유 시설 이용을 국가가 지원하는 복지 제도입니다.", "ref": "산림복지법"}, {"id": "산림관계법규-74", "subject": "산림관계법규", "num": 74, "part": 4, "stem": "「백두대간 보호에 관한 법률」상 백두대간 보호지역의 완충구역에서 지자체장의 허가를 받아 제한적으로 설치할 수 있는 공익시설은?", "options": ["농림어업인의 주택 신축 및 부대시설", "대규모 위락시설", "카지노 및 경마장", "대형 아웃렛"], "answer": 0, "explain": "완충구역에서는 원주민의 실생활을 위한 농가주택 신축이나 소규모 농림어업 시설은 허가를 받아 설치 가능합니다.", "ref": "백두대간법"}, {"id": "산림관계법규-75", "subject": "산림관계법규", "num": 75, "part": 4, "stem": "「산림자원법」상 조림용 묘목이나 산림 종자를 판매하려는 종·묘 생산업자가 소비자에게 교부해야 하는 서류는?", "options": ["종·묘 품질보증서", "사업자등록증 사본", "산림조사서", "산지전용허가증"], "answer": 0, "explain": "불량 묘목 유통을 막기 위해 생산업자는 수종, 원산지, 품질 규격 등이 적힌 품질보증서를 의무 발급해야 합니다.", "ref": "산림자원법"}, {"id": "산림관계법규-76", "subject": "산림관계법규", "num": 76, "part": 4, "stem": "「산지관리법」상 대규모 산지 개발로 인한 재해를 예방하기 위해 사업계획 면적이 얼마 이상일 때 산지전용 타당성조사를 의무화하고 있는가?", "options": ["1만㎡ 이상", "66만㎡(약 20만평) 이상", "10만㎡ 이상", "30만㎡ 이상"], "answer": 1, "explain": "66만㎡ 이상의 대규모 산지 개발은 전문기관의 산지전용타당성조사를 거쳐야 합니다.", "ref": "산지관리법"}, {"id": "산림관계법규-77", "subject": "산림관계법규", "num": 77, "part": 4, "stem": "「산림조합법」상 조합원의 출자금에 대한 배당 이익과 비과세 예탁금에 대한 조세특례의 목적은?", "options": ["임업인의 자산 형성 지원 및 산림자원 육성 자금 조달", "국가 세수 증대", "대기업 자본 유치", "주식 시장 활성화"], "answer": 0, "explain": "산림조합 비과세 예탁금(1인당 3천만원 등)은 농어촌·임업인의 경제적 자립을 지원하기 위한 조세특례입니다.", "ref": "산림조합법"}, {"id": "산림관계법규-78", "subject": "산림관계법규", "num": 78, "part": 4, "stem": "「국유림의 경영 및 관리에 관한 법률」상 공익적 목적이 사라져 국가가 계속 보존할 필요가 없다고 인정되어 처분이나 매각이 가능한 국유림은?", "options": ["불요존국유림", "요존국유림", "보안림", "채종림"], "answer": 0, "explain": "보존이 꼭 필요한 요존국유림과 달리, 불요존국유림은 매각, 교환, 대부 등이 가능합니다.", "ref": "국유림법"}, {"id": "산림관계법규-79", "subject": "산림관계법규", "num": 79, "part": 4, "stem": "「임업 및 산촌 진흥 촉진에 관한 법률」상 산림청장이 산촌의 정주 여건 개선과 소득 증대를 위해 수립하는 산촌진흥기본계획의 수립 주기는?", "options": ["5년마다", "10년마다", "15년마다", "20년마다"], "answer": 0, "explain": "· 산촌진흥기본계획은 5년마다 수립·시행됩니다.\n· (산림기본계획은 10년, 산촌진흥계획은 5년!)", "ref": "임업진흥법"}, {"id": "산림관계법규-80", "subject": "산림관계법규", "num": 80, "part": 4, "stem": "「산림보호법」상 산불 발생 위험이 가장 높은 봄철과 가을철에 산림청장이 지정하여 전면 비상근무 체제에 돌입하는 기간은?", "options": ["산불특별대책기간", "산림휴식년제 기간", "수렵금지기간", "산지정화기간"], "answer": 0, "explain": "봄철(통상 3.15~4.15 전후) 대형산불 위험기에는 산불특별대책기간이 선포되어 집중 감시가 이뤄집니다.", "ref": "산림보호법"}, {"id": "산림관계법규-81", "subject": "산림관계법규", "num": 81, "part": 4, "stem": "「산림기본법」상 산림정책의 기본방향과 장기 전망을 제시하기 위해 산림청장이 수립하는 산림기본계획의 수립 주기는?", "options": ["5년", "10년", "20년", "30년"], "answer": 2, "explain": "· 「산림기본법」 제11조에 따른 '산림기본계획'은 20년마다 전국 산림을 대상으로 수립·시행합니다.\n· (※ 산림자원법의 지역산림계획 및 산림경영계획은 10년 단위임에 유의!)", "ref": "산림기본법 제11조"}, {"id": "산림관계법규-82", "subject": "산림관계법규", "num": 82, "part": 4, "stem": "「산림자원의 조성 및 관리에 관한 법률」상 산림청장 또는 시·도지사가 우량한 조림용 종자의 생산을 위해 지정하는 구역에 해당하지 **않는** 것은?", "options": ["채종림", "채종원", "수형목", "산림욕장"], "answer": 3, "explain": "· 산림자원법상 종·묘 채취 및 생산을 위해 지정하는 대상은 채종원, 채종림, 채수포, 수형목입니다.\n· 산림욕장은 휴양법령에 따른 시설입니다.", "ref": "산림자원법 제19조"}, {"id": "산림관계법규-83", "subject": "산림관계법규", "num": 83, "part": 4, "stem": "「도시숲 등의 조성 및 관리에 관한 법률(도시숲법)」상 지방자치단체의 장이 관할 구역의 도시숲 등을 체계적으로 관리하기 위해 수립해야 하는 도시숲등 조성·관리계획의 주기는?", "options": ["3년", "5년", "10년", "20년"], "answer": 2, "explain": "지방자치단체의 장은 관할 구역의 도시숲·생활숲·가로수를 체계적으로 조성·관리하기 위하여 10년마다 도시숲등 조성·관리계획을 수립·시행하여야 합니다.", "ref": "도시숲 등의 조성 및 관리에 관한 법률 제6조"}, {"id": "산림관계법규-84", "subject": "산림관계법규", "num": 84, "part": 4, "stem": "「산림기술 진흥 및 관리에 관한 법률」상 산림기술용역업을 등록할 수 있는 사업 분야로 옳지 **않은** 것은?", "options": ["산림경영", "산림공학", "녹지조경", "원자력 발전설비 구축"], "answer": 3, "explain": "산림기술용역업의 전문분야: 산림경영, 산림공학(임도·사방), 산림휴양, 녹지조경, 도시림 등입니다.", "ref": "산림기술법 시행령"}, {"id": "산림관계법규-85", "subject": "산림관계법규", "num": 85, "part": 4, "stem": "「산림기술 진흥 및 관리에 관한 법률」상 산림기술자가 거짓이나 부정한 방법으로 자격증을 발급받은 경우 행정처분 기준은?", "options": ["시정명령", "업무정지 6개월", "자격취소", "과태료 50만원"], "answer": 2, "explain": "· 거짓이나 그 밖의 부정한 방법으로 산림기술자 자격증을 취득한 때에는 반드시 '자격을 취소'하여야 합니다.\n· (필요적 취소 사유)", "ref": "산림기술법 제12조"}, {"id": "산림관계법규-86", "subject": "산림관계법규", "num": 86, "part": 4, "stem": "「산지관리법」상 산지전용허가를 받은 자가 목적 사업을 착수하지 않거나 거짓으로 허가를 받은 경우 행정청이 취할 수 있는 조치로 가장 강력한 것은?", "options": ["산지전용허가의 취소", "주의 처분", "과태료 10만원 부과", "벌채 허용"], "answer": 0, "explain": "거짓이나 부정한 방법으로 허가를 받았거나, 허가 목적 사업을 정당한 사유 없이 2년 이상 착수하지 않는 등의 경우 산림청장 등은 산지전용허가를 취소할 수 있습니다.", "ref": "산지관리법 제20조"}, {"id": "산림관계법규-87", "subject": "산림관계법규", "num": 87, "part": 4, "stem": "「산지관리법」상 산지를 임도 개설, 산림경영관리사 설치, 임산물 재배 등의 용도로 일시적으로 사용하고자 할 때 거쳐야 하는 행정 절차는?", "options": ["산지전용허가", "산지일시사용신고", "토지수용", "토석채취허가"], "answer": 1, "explain": "영구적인 형질변경이 아닌 임도, 작업로, 간이 산림경영관리사(부지면적 200㎡ 미만), 임산물 재배 등은 산지전용이 아니라 '산지일시사용신고' 대상입니다.", "ref": "산지관리법 제15조의2"}, {"id": "산림관계법규-88", "subject": "산림관계법규", "num": 88, "part": 4, "stem": "「산지관리법」상 허가나 신고 없이 불법으로 산지를 전용하거나 형질변경한 자에 대해 산림청장이나 지자체장이 명할 수 있는 의무는?", "options": ["산지복구명령", "세금 감면", "임업후계자 지정", "지목 자동변경"], "answer": 0, "explain": "불법 산지전용 행위자에 대해서는 형사처벌과 병행하여 원래의 산지 형태로 되돌리도록 '산지복구명령'을 내리며, 불이행 시 대집행으로 복구하고 비용을 징수합니다.", "ref": "산지관리법 제44조"}, {"id": "산림관계법규-89", "subject": "산림관계법규", "num": 89, "part": 4, "stem": "「산림보호법」상 산불재난 국가위기경보 발령 기준 중 '산불위험지수가 80 이상이거나 대형 산불이 동시다발적으로 발생할 우려가 극히 높을 때' 발령하는 최고 단계 경보는?", "options": ["관심", "주의", "경계", "심각"], "answer": 3, "explain": "산불재난 위기경보는 관심 → 주의 → 경계 → 심각 4단계로 발령되며, 기상 건조특보와 산불위험지수가 최고조에 달할 때 '심각' 단계가 발령됩니다.", "ref": "산림보호법 시행령 및 산불재난 위기대응 실무매뉴얼"}, {"id": "산림관계법규-90", "subject": "산림관계법규", "num": 90, "part": 4, "stem": "「산림재난방지법」상 산림에서 담배를 피우거나 담배꽁초를 버린 사람에게 부과되는 과태료 기준은? (2026.2.1 이후)", "options": ["20만원 이하", "30만원 이하", "70만원 이하", "200만원 이하"], "answer": 2, "explain": "· 산림재난방지법 제79조③: 70만원 이하\n· 불 피우기·불 가지고 입산 200만원 이하\n· 화기 소지 금지명령 위반 30만원 이하\n· 2026.2.1부터 산불 관련 과태료는 산림보호법에서 산림재난방지법으로 옮겨짐 (2026.11 정정: 기존 문항은 종전 산림보호법 제57조의 '20만원 이하' 기준)", "ref": "산림재난방지법 제79조"}, {"id": "산림관계법규-91", "subject": "산림관계법규", "num": 91, "part": 4, "stem": "「사방사업법」상 사방사업의 타당성평가를 반드시 실시하여야 하는 구역에 해당하는 것은?", "options": ["산사태취약지역으로 지정된 지역 또는 대규모 황폐지", "도시지역의 상업용지", "농경지 평야구역", "하천 정비구역"], "answer": 0, "explain": "사방사업법 제7조의3에 따라 사방사업을 시행하려는 경우, 산사태취약지역 등 사방사업이 시급한 구역에 대해 타당성평가를 먼저 실시하여 환경성과 경제성을 검토해야 합니다.", "ref": "사방사업법 제7조의3"}, {"id": "산림관계법규-92", "subject": "산림관계법규", "num": 92, "part": 4, "stem": "「사방사업법」상 사방지로 지정된 토지의 지정을 전부 또는 일부 해제할 수 있는 사유로 옳지 **않은** 것은?", "options": ["사방사업 시행 후 5년 이상 경과하고 사방시설이 안정되어 지정 목적이 달성된 경우", "공익상 또는 국가 시책상 불가피하게 다른 용도로 사용되는 경우", "토지 소유자가 개인 주택을 신축하기 위해 단순 변심으로 해제를 요청하는 경우", "군사 목적상 불가피한 경우"], "answer": 2, "explain": "사방지는 국가 예산으로 토사를 안정시킨 공익 토지이므로 목적 달성(5년 경과 및 안정 판정)이나 공익 목적이 아닌 단순 개인적 영리 목적의 해제 요청은 불허됩니다.", "ref": "사방사업법 제20조"}, {"id": "산림관계법규-93", "subject": "산림관계법규", "num": 93, "part": 4, "stem": "「임업 및 산촌 진흥 촉진에 관한 법률」상 산림청장이 특별관리임산물로 지정하여 생산신고 및 품질검사를 의무화하고 있는 대표적인 청정 임산물은?", "options": ["산양삼", "송이버섯", "밤", "대추"], "answer": 0, "explain": "산양삼(산양산삼)은 부정 불량 유통 방지와 소비자 보호를 위해 임업진흥법상 '특별관리임산물'로 지정되어 재배지 토양 검사, 생산신고, 출하 전 품질검사 합격증 부착이 의무화되어 있습니다.", "ref": "임업진흥법 제18조의2"}, {"id": "산림관계법규-94", "subject": "산림관계법규", "num": 94, "part": 4, "stem": "「임업 및 산촌 진흥 촉진에 관한 법률」상 전문임업인의 한 종류로서 미래 임업을 선도할 의욕과 능력을 갖추어 산림청장이 선발·육성하는 자는?", "options": ["임업후계자", "산불감시원", "목재유통업자", "숲해설가"], "answer": 0, "explain": "전문임업인은 '임업후계자', '독림가', '신지식임업인'으로 분류되며, 임업후계자는 일정 규모 이상의 산림경영 기반을 갖추고 선발된 청장년 전문인력입니다.", "ref": "임업진흥법 제17조"}, {"id": "산림관계법규-95", "subject": "산림관계법규", "num": 95, "part": 4, "stem": "「목재의 지속가능한 이용에 관한 법률」상 원목을 벌채하여 생산·공급하거나 목재를 가공·유통하려는 자가 등록하여야 하는 업종은?", "options": ["목재생산업(원목생산업, 제재업 등)", "산림토목업", "건설업", "농기계임대업"], "answer": 0, "explain": "목재생산업은 제1종 제재업, 제2종 제재업, 제3종 제재업, 제4종 제재업 및 원목생산업으로 구분되며 관할 시·군·구청장에게 등록해야 합니다.", "ref": "목재이용법 제24조"}, {"id": "산림관계법규-96", "subject": "산림관계법규", "num": 96, "part": 4, "stem": "「목재의 지속가능한 이용에 관한 법률」상 목재제품의 안전성과 품질 확보를 위해 지정된 품질표시 대상 품목이 **아닌** 것은?", "options": ["방부목재", "합판 및 파티클보드", "목재펠릿", "플라스틱 사출판"], "answer": 3, "explain": "제재목, 방부목재, 난연목재, 집성재, 합판, 파티클보드(PB), 섬유판(MDF), 목재펠릿, 목재칩 등 15대 목재제품이 품질표시 의무 대상 품목입니다.", "ref": "목재이용법 제20조"}, {"id": "산림관계법규-97", "subject": "산림관계법규", "num": 97, "part": 4, "stem": "「백두대간 보호에 관한 법률」상 백두대간 중 자연환경, 산림생태계 등이 특별히 우수하여 보전이 절대적으로 필요한 구역으로 지정되는 것은?", "options": ["핵심구역", "완충구역", "일반상업구역", "개발유도구역"], "answer": 0, "explain": "백두대간보호지역은 능선을 중심으로 특별한 보전이 필요한 '핵심구역'과 핵심구역의 연접부로서 완충 역할을 하는 '완충구역'으로 구분 지정됩니다.", "ref": "백두대간 보호에 관한 법률 제6조"}, {"id": "산림관계법규-98", "subject": "산림관계법규", "num": 98, "part": 4, "stem": "「탄소흡수원 유지 및 증진에 관한 법률」상 사업자가 자발적으로 온실가스를 감축한 실적을 정부가 인증해 주는 산림탄소상쇄제도의 사업 유형에 해당하지 **않는** 것은?", "options": ["신규조림 및 재조림", "산림경영", "목제품 이용", "대규모 산지 골프장 개발"], "answer": 3, "explain": "· 산림탄소상쇄사업 유형: 식생복구, 신규조림/재조림, 산림경영, 목제품 이용, 산림바이오매스 에너지 이용 등이 있습니다.\n· 골프장 개발은 산림 파괴로 탄소 배출 행위입니다.", "ref": "탄소흡수원법 제19조"}, {"id": "산림관계법규-99", "subject": "산림관계법규", "num": 99, "part": 4, "stem": "「산림조합법」상 지역산림조합 조합원의 자격 요건으로 옳지 **않은** 것은?", "options": ["조합의 구역 안에 주소 또는 산림이 있는 산주", "조합의 구역 안에 주소 또는 사업장이 있는 임업인", "산림을 소유하지 않고 임업에도 종사하지 않는 타 시·도 일반 도시민", "3ha 이상의 산림을 경영하는 자"], "answer": 2, "explain": "조합원은 구역 내에 주소나 산림을 둔 산주 또는 임업인(일정 면적 이상 임산물 재배, 연간 90일 이상 임업 종사자 등)이어야 하며, 무관한 비임업인은 준조합원(예탁금 거래 등)만 가능합니다.", "ref": "산림조합법 제18조"}, {"id": "산림관계법규-100", "subject": "산림관계법규", "num": 100, "part": 4, "stem": "「산림조합법」상 조합원이 법령, 정관 또는 총회의 의결을 위반하여 조합에 중대한 손해를 끼쳤을 때 총회의 의결을 거쳐 취할 수 있는 가장 무거운 제재는?", "options": ["제명(除名)", "구두 경고", "출자금 무상 몰수", "강제 노역"], "answer": 0, "explain": "· 조합원에 대한 최고 수위의 징계는 '제명'이며, 제명은 조합원 총회의 특별의결(출석조합원 3분의 2 이상의 찬성)을 거쳐야 합니다.\n· 출자금은 정산 환급됩니다.", "ref": "산림조합법 제29조"}, {"id": "산림관계법규-101", "subject": "산림관계법규", "num": 101, "part": 5, "stem": "2026년 신설되어 2026.10.1부터 시행된 산림자원법상 제도로, 밀원식물 중 목본식물 확충을 위해 산림을 지정·육성하는 것은?", "options": ["경제림육성단지", "밀원수 특화단지", "선도산림경영단지", "특수산림사업지구"], "answer": 1, "explain": "· 법 제37조의2(2026.3.31 신설): 산림청장·지자체장이 밀원수 특화단지 지정\n· 밀원수 = 양봉법상 밀원식물 중 목본식물(시행규칙 제48조의2)\n· 지정절차는 시행규칙 제48조의3(신청서·위치도·경영계획인가서·동의서·운영계획서·수익배분계약서)", "ref": "산림자원의 조성 및 관리에 관한 법률 제37조의2"}, {"id": "산림관계법규-102", "subject": "산림관계법규", "num": 102, "part": 5, "stem": "산림조합법상 여성조합원이 전체 조합원의 몇 % 이상인 지역조합은 이사 중 1명 이상을 여성조합원 중에서 **선출하여야** 하는가?", "options": ["10%", "20%", "30%", "50%"], "answer": 2, "explain": "제35조⑧: 그 밖의 지역조합은 노력 의무, 30% 이상이면 선출 의무", "ref": "산림조합법 제35조"}, {"id": "산림관계법규-103", "subject": "산림관계법규", "num": 103, "part": 5, "stem": "조합 총회에서 '조합원 과반수 출석 + 출석조합원 3분의 2 이상 찬성'이 필요한 사항이 **아닌** 것은?", "options": ["정관의 변경", "해산 또는 분할", "조합원의 제명", "합병"], "answer": 3, "explain": "· 제31조④: 제5항 1호(정관변경)·2호(해산·분할)·4호(제명)만 특별의결\n· 합병(3호)은 일반의결 대상", "ref": "산림조합법 제31조"}, {"id": "산림관계법규-104", "subject": "산림관계법규", "num": 104, "part": 5, "stem": "산림조합법상 조합원이 될 수 있는 산림소유자의 최소 산림면적을 정관으로 정할 수 있는 범위는?", "options": ["100~500
