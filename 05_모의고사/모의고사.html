갈수록 줄어드는 역J자형(지수감소) 곡선을 나타냅니다.\n쉬운 풀이: 나이가 섞인 천연림·택벌림은 어린나무(가는 나무)가 가장 많고, 굵은 나무로 갈수록 수가 확 줄어요. 그래프로 그리면 알파벳 J를 거꾸로 한 모양이라 '역J자형'이라고 해요. 동령림은 가운데가 볼록한 종 모양이에요.\n용어 풀이:\n· 역J자형 분포: 작은 값이 가장 많고 갈수록 급감하는 분포\n· 이령림: 나이가 다양한 숲\n· 정규분포: 가운데가 볼록한 종 모양 분포", "ref": "산림측정학"}, {"id": "산림경영-72", "subject": "산림경영", "num": 72, "part": 4, "stem": "산림조사 시 모집단의 변이(이질성)가 심할 때, 임상·임령·지위별로 산림을 몇 개의 동질적인 층(Strata)으로 나눈 후 각 층에서 표본점을 추출하는 정밀 표본조사법은?", "options": ["단순임의추출법", "계통적 추출법", "층화임의추출법(Stratified sampling)", "군집추출법"], "answer": 2, "explain": "층화임의추출법은 산림을 동질적인 층으로 나누어 표본을 뽑으므로 표본오차가 가장 적고 정밀도가 높습니다.\n쉬운 풀이: 숲 상태가 제각각이면 아무 데나 표본을 뽑으면 오차가 커요. 그래서 비슷한 곳끼리(수종·나이·지위별) 층으로 나눈 뒤 각 층에서 표본을 뽑으면 훨씬 정확해요. 이게 층화임의추출법이에요.\n용어 풀이:\n· 층화임의추출법: 집단을 비슷한 층으로 나눠 표본 추출\n· 모집단: 조사 대상 전체\n· 표본오차: 표본과 전체의 차이", "ref": "산림통계학"}, {"id": "산림경영-73", "subject": "산림경영", "num": 73, "part": 4, "stem": "산림 투자 사업의 경제성 분석 시 적용하는 할인율(Discount rate)이 상승할 때 나타나는 현상으로 옳은 것은?", "options": ["순현재가치(NPV)가 감소하여 투자 타당성이 낮아진다.", "순현재가치가 급격히 증가한다.", "내부수익률(IRR)이 0이 된다.", "임업 투자가 상업 금융보다 훨씬 유리해진다."], "answer": 0, "explain": "할인율(이자율)이 높아지면 미래에 수확할 목재 수익의 현재가치가 크게 깎이므로 NPV가 감소합니다.\n쉬운 풀이: 할인율이 높아지면 미래 돈의 현재가치가 크게 줄어들어요. 임업은 수익이 수십 년 뒤에 들어오니 그 영향을 특히 크게 받아요. 그래서 순현재가치(NPV)가 줄어 투자 매력이 떨어져요.\n용어 풀이:\n· 할인율: 미래 가치를 현재로 바꿀 때 쓰는 이율\n· 순현재가치(NPV): 편익 현재가치 − 비용 현재가치\n· 투자 타당성: 투자할 만한 가치", "ref": "산림경제학"}, {"id": "산림경영-74", "subject": "산림경영", "num": 74, "part": 4, "stem": "림분의 총축적(V)과 윤벌기(u)를 알 때, 매년 수확할 수 있는 표준 연간 벌채량(E)을 구하는 맨텔(Mantel) 공식은?", "options": ["E = 2V / u", "E = V · u", "E = V / (2u)", "E = u / V"], "answer": 0, "explain": "· 맨텔(Mantel) 공식: 법정축적 V = (E × u)/2 이므로 연간 벌채량은 E = 2V\n· u 가 됩니다.\n쉬운 풀이: Mantel 공식은 E = 2V ÷ u예요. 법정림 축적은 '매년 벌채량 × 윤벌기 ÷ 2'(평균적으로 절반 자란 나무들)이니, 거꾸로 풀면 벌채량 = 2 × 축적 ÷ 윤벌기가 돼요. 축적 24,000, 윤벌기 40이면 1,200㎥예요.\n용어 풀이:\n· Mantel 공식: E = 2V/u\n· 총축적(V): 숲 전체 재적\n· 윤벌기(u): 숲을 다 베는 주기", "ref": "산림경영학 보속수확론"}, {"id": "산림경영-75", "subject": "산림경영", "num": 75, "part": 4, "stem": "온실가스 배출권 거래제 및 산림탄소상쇄사업에서 사업 구역 내의 활동으로 인해 구역 외부에서 온실가스 배출이 오히려 증가하는 현상을 뜻하는 용어는?", "options": ["기준선(Baseline)", "누출(Leakage)", "추가성(Additionality)", "영구성"], "answer": 1, "explain": "산림을 보존하여 벌채를 억제했더니 다른 산림에서 벌채가 늘어나 탄소가 배출되는 역효과를 '누출(Leakage)'이라 합니다.\n쉬운 풀이: 한 곳에서 나무를 안 베고 보존했더니, 대신 다른 곳 숲을 더 베어서 결국 탄소가 그쪽에서 배출되는 현상을 '누출'이라고 해요. 그래서 탄소상쇄 계산에서는 순흡수량에서 누출량을 빼요.\n용어 풀이:\n· 누출(Leakage): 사업 구역 밖에서 배출이 늘어나는 현상\n· 기준선(Baseline): 사업이 없었을 때의 상태\n· 추가성: 사업 때문에 추가로 생긴 효과", "ref": "탄소흡수원제도"}, {"id": "산림경영-76", "subject": "산림경영", "num": 76, "part": 4, "stem": "인가받은 산림경영계획을 의무적으로 변경 인가받아야 하는 중대한 사유에 해당하는 것은?", "options": ["산림의 소유자가 변경되거나 시업 대상지 면적이 20% 이상 증감된 경우", "단순 관리자 이름 오기 정정", "산림 내 야생화 군락지 발견", "날씨 변화로 작업 일정이 1주일 순연된 경우"], "answer": 0, "explain": "산주 변경이나 경영 대상 면적이 20% 이상 대폭 변동될 때는 반드시 관할 지자체장의 변경 인가를 받아야 합니다.\n쉬운 풀이: 산림경영계획은 인가받은 내용대로 해야 해요. 그런데 산주가 바뀌거나 대상 면적이 20% 이상 늘거나 줄면 계획의 바탕이 바뀐 거니 반드시 변경 인가를 받아야 해요. 이름 오타·일정 며칠 미루기 같은 사소한 건 해당 없어요.\n용어 풀이:\n· 변경 인가: 바뀐 내용을 다시 승인받는 것\n· 시업 대상지: 산림사업을 하는 땅", "ref": "산림자원법"}, {"id": "산림경영-77", "subject": "산림경영", "num": 77, "part": 4, "stem": "수확한 목재를 가구, 건축물 등으로 장기 이용할 때 대기 중으로 탄소가 방출되지 않고 목재 내에 그대로 저장되는 효과를 뜻하는 국제 공식 용어는?", "options": ["HWP (Harvested Wood Products, 수확목제품) 탄소저장 효과", "CDM 사업", "REDD+ 사업", "그린워싱"], "answer": 0, "explain": "벌채된 나무를 버리지 않고 목조건축·가구로 오래 쓰면 탄소를 붙잡아두는 HWP 탄소고정 효과가 인정됩니다.\n쉬운 풀이: 나무를 베어도 가구·목조주택으로 오래 쓰면 나무 속 탄소가 공기로 나가지 않고 그대로 저장돼요. 이걸 '수확목제품(HWP) 탄소저장 효과'라고 하고, 국제적으로 탄소 흡수 실적으로 인정해요.\n용어 풀이:\n· HWP(수확목제품): 벌채한 나무로 만든 제품\n· 탄소저장: 탄소를 붙잡아 두는 것\n· REDD+: 개도국 산림 파괴를 줄이는 국제 사업", "ref": "기후변화협약 산림탄소"}, {"id": "산림경영-78", "subject": "산림경영", "num": 78, "part": 4, "stem": "산림 자산의 감정평가 기법 중 토지와 입목을 일괄하여 현금흐름할인법(DCF)으로 미래 기대 순수익을 현재가치로 환원하는 수익환원법의 한계점으로 옳은 것은?", "options": ["과거 지출 비용을 정밀하게 반영하기 어렵고 미래 벌채 시점의 목재 가격 및 이자율 예측에 주관성이 개입된다.", "수학적 계산이 전혀 불가능하다.", "다 자란 성숙림에만 쓸 수 있다.", "토지의 가치를 항상 0으로 계산한다."], "answer": 0, "explain": "수익환원법은 수십 년 뒤의 미래 목재 시장가격과 장기 이자율을 예측해야 하므로 주관적 가정이 개입될 위험이 있습니다.\n쉬운 풀이: 수익환원법은 미래에 벌어들일 돈을 현재가치로 바꿔 숲 가치를 매겨요. 문제는 수십 년 뒤 목재 가격과 이자율을 예측해야 해서, 평가하는 사람의 주관이 들어가기 쉽다는 점이에요.\n용어 풀이:\n· 현금흐름할인법(DCF): 미래 현금흐름을 할인해 현재가치를 구하는 방법\n· 수익환원법: 수익을 현재가치로 환산하는 평가법\n· 주관성: 개인 판단이 개입됨", "ref": "산림평가학"}, {"id": "산림경영-79", "subject": "산림경영", "num": 79, "part": 4, "stem": "산림조합이 산주와 계약을 체결하여 산림경영계획 작성부터 조림, 숲가꾸기, 벌채 및 목재 판매까지 전 과정을 도맡아 대행해 주는 임업 협동경영 제도는?", "options": ["산림 대리경영 제도", "공유림 위탁 매수제", "국유림 분수림 제도", "환지처분제도"], "answer": 0, "explain": "산림조합의 핵심 사업 중 하나로 부재산주나 고령 산주를 대신해 산림을 전문 관리해 주는 것이 대리경영 제도입니다.\n쉬운 풀이: 멀리 살거나 나이가 많아 산을 관리하기 어려운 산주 대신, 산림조합이 계약을 맺고 경영계획부터 조림·숲가꾸기·벌채·판매까지 다 맡아 주는 제도가 대리경영이에요. 인가 산림 15ha 이하면 대리경영을 권장해요.\n용어 풀이:\n· 대리경영: 산림조합 등이 산주 대신 산림을 경영\n· 부재산주: 산 근처에 살지 않는 산주\n· 협동경영: 여럿이 함께 경영", "ref": "산림조합법"}, {"id": "산림경영-80", "subject": "산림경영", "num": 80, "part": 4, "stem": "산림경영계획서 작성 시 지황(Land condition) 조사 항목에 포함되지 않는 것은?", "options": ["지종 (산림의 지목)", "방위, 경사도, 표고", "토성 및 토심", "입목의 흉고직경 및 수고"], "answer": 3, "explain": "지황(地況)은 땅과 입지 환경(지형, 방위, 토양 등)을 뜻하며, 나무의 지름과 키는 '임황(林況)' 조사 항목입니다.\n쉬운 풀이: 지황은 '땅'에 대한 조사(지종·방위·경사·표고·토성·토심 등)이고, 임황은 '나무'에 대한 조사(수종·나이·직경·수고·소밀도 등)예요. 흉고직경과 수고는 나무의 크기니까 임황이에요.\n용어 풀이:\n· 지황: 땅·입지 조건\n· 임황: 숲·나무 상태\n· 지종: 땅의 종류(입목지·무립목지 등)", "ref": "산림자원조사지침"}, {"id": "산림경영-81", "subject": "산림경영", "num": 81, "part": 4, "stem": "산림조사 시 임분의 밀도를 나타내는 지표 중 입목본수도(Stocking percent)와 수관울폐도(Crown closure)에 대한 설명으로 옳은 것은?", "options": ["입목본수도는 단위면적당 입목재적만을 나타낸다.", "수관울폐도는 하늘에서 내려다보았을 때 수관이 임지 지표면을 차폐하고 있는 면적 비율(%)이다.", "입목본수도와 수관울폐도는 항상 수치가 일치한다.", "수관울폐도가 100%이면 무조건 대경목 숲이다."], "answer": 1, "explain": "수관울폐도는 수관 투영면적이 임지 면적을 덮고 있는 비율(0~100%)이며, 입목본수도는 표준 수확표의 기준 본수 대비 현실 본수의 비율을 뜻합니다.\n쉬운 풀이: 숲의 밀도를 나타내는 두 지표를 구분하세요. 수관울폐도는 하늘에서 봤을 때 나무 윗부분이 땅을 가린 비율(%)이고, 입목본수도는 표준 수확표가 정한 '적정 본수' 대비 실제 본수의 비율이에요. 둘은 기준이 달라 값이 꼭 같지 않아요.\n용어 풀이:\n· 수관울폐도: 수관이 지표를 덮은 면적 비율\n· 입목본수도: 기준 본수 대비 실제 본수 비율\n· 차폐: 가림", "ref": "산림측정학"}, {"id": "산림경영-82", "subject": "산림경영", "num": 82, "part": 4, "stem": "산림경영계획 수립을 위한 산림조사 중 토지의 자연적 입지 조건을 조사하는 지황(地況) 조사의 6대 기본 항목이 **아닌** 것은?", "options": ["방위", "경사도", "토성 및 토심", "흉고직경 및 수고"], "answer": 3, "explain": "지황(地況) 조사는 산지 토지 자체의 조건(방위, 경사도, 해발고, 토성, 토심, 건습도 등)을 조사하는 것이며, 흉고직경, 수고, 임령 등은 임황(林況) 조사 항목입니다.\n쉬운 풀이: 지황 조사는 땅 자체(방위·경사도·해발고·토성·토심·건습도 등)를 보는 거예요. 흉고직경·수고·임령처럼 '나무'를 재는 건 임황 조사예요. '지(地)=땅, 임(林)=숲'으로 구분하세요.\n용어 풀이:\n· 지황: 토지의 입지 조건\n· 임황: 임분(나무)의 상태\n· 토성: 흙 알갱이 크기 구성(모래·점토 등)", "ref": "산림자원의 조성 및 관리에 관한 법률 시행규칙"}, {"id": "산림경영-83", "subject": "산림경영", "num": 83, "part": 4, "stem": "임목의 생장 단계에서 연년생장량(CAI, Current annual increment)과 총평균생장량(MAI, Mean annual increment)의 관계에 대한 설명으로 옳은 것은?", "options": ["CAI가 최대가 되는 시점에서 MAI 곡선과 교차한다.", "CAI가 MAI보다 큰 기간에는 MAI 곡선이 상승한다.", "CAI 곡선은 수목이 고사할 때까지 계속 상승한다.", "MAI가 최대가 되는 시점 이전에 벌채해야 총생산재적이 최대가 된다."], "answer": 1, "explain": "한 해의 생장량(CAI)이 지금까지의 평균생장량(MAI)보다 크면 평균치는 계속 올라가며, CAI가 감소하여 MAI와 교차하는 지점에서 총평균생장량(MAI)이 최대치(재적수확 최대 벌기)에 도달합니다.\n쉬운 풀이: 그해 자란 양(CAI)이 지금까지의 평균(MAI)보다 크면, 평균은 계속 올라가요. 시험 점수로 치면, 이번 시험 점수가 지금까지 평균보다 높으면 평균이 오르는 것과 같아요. CAI가 줄어들어 MAI와 같아지는 순간 MAI가 최고가 되고, 이때가 재적수확 최대 벌기령이에요.\n용어 풀이:\n· CAI(연년생장량): 1년 동안 자란 양\n· MAI(평균생장량): 총생장량 ÷ 나이\n· 재적수확 최대 벌기: 평균생장량이 최대인 나이", "ref": "산림경영학 생장론"}, {"id": "산림경영-84", "subject": "산림경영", "num": 84, "part": 4, "stem": "벌채목의 수간석해(Stem analysis) 과정에서 채취한 각 원판의 연륜을 분석할 때 측정하지 **않는** 것은?", "options": ["각 영급(5년 또는 10년)별 반경 생장량", "변재와 심재의 비율", "수고 성장 경과", "수관의 엽면적 지수"], "answer": 3, "explain": "수간석해는 원판의 나이테를 통해 과거 직경, 수고, 재적의 경년 생장 궤적을 복원하는 측정법이며, 이미 벌채된 통나무 원판에서 엽면적 지수를 측정할 수는 없습니다.\n쉬운 풀이: 수간석해는 벤 나무의 원판 나이테로 과거 지름·키·부피가 어떻게 자랐는지 복원하는 거예요. 반경 생장량, 변재·심재 비율, 수고 성장 경과는 원판에서 알 수 있지만, 이미 잘린 통나무에서 잎 면적(엽면적지수)은 잴 수 없어요.\n용어 풀이:\n· 수간석해: 줄기 원판 분석\n· 변재·심재: 바깥쪽 연한 부분·안쪽 짙은 부분\n· 엽면적지수: 땅 면적 대비 잎 면적 비율", "ref": "산림측정학"}, {"id": "산림경영-85", "subject": "산림경영", "num": 85, "part": 4, "stem": "Reineke의 임분밀도지수(Stand Density Index, SDI) 공식에서 기준으로 삼는 평균 흉고직경(DBH) 기준 수치는?", "options": ["10cm", "20cm", "25cm (또는 10인치)", "50cm"], "answer": 2, "explain": "Reineke의 임분밀도지수(SDI)는 평균 흉고직경 25cm(미국 기준 10인치)일 때 단위면적(1ha)당 존재하는 입목 본수로 임분의 과밀도를 정량화한 지수입니다.\n쉬운 풀이: Reineke의 임분밀도지수(SDI)는 '이 숲을 평균 지름 25cm(10인치) 숲으로 바꿔 보면 ha당 몇 그루일까'로 환산한 밀도예요. 나무 크기가 다른 숲끼리도 빽빽한 정도를 공정하게 비교할 수 있어요.\n용어 풀이:\n· SDI(임분밀도지수): 기준 직경으로 환산한 밀도\n· 과밀도: 지나치게 빽빽함\n· 인치: 약 2.54cm", "ref": "산림경영학"}, {"id": "산림경영-86", "subject": "산림경영", "num": 86, "part": 4, "stem": "임업 기계장비(트랙터, 집재기 등)의 감가상각 시 내용연수가 만료된 시점에서의 폐기 매각 추정가치를 뜻하는 용어는?", "options": ["잔존가치(Salvage value)", "취득원가", "장부가액", "기회비용"], "answer": 0, "explain": "잔존가치(Salvage value)는 내용연수가 다한 기계장비를 고철 등으로 매각하거나 처분할 때 회수할 수 있는 예상 잔여 가치로, 보통 취득원가의 5~10%로 설정합니다.\n쉬운 풀이: 잔존가치는 장비를 다 쓰고 나서 고철 등으로 팔 때 받을 수 있는 예상 금액이에요. 보통 산 가격의 5~10% 정도로 잡고, 감가상각 계산 때 취득원가에서 이 값을 빼고 나눠요.\n용어 풀이:\n· 잔존가치: 내용연수 종료 후 남는 가치\n· 취득원가: 살 때 든 비용\n· 장부가액: 장부상 남은 가치", "ref": "임업경제학 감가상각론"}, {"id": "산림경영-87", "subject": "산림경영", "num": 87, "part": 4, "stem": "국립산림과학원 원목 규격 고시상 원목의 품등(1등급, 2등급, 3등급, 등외)을 결정하는 주된 외관 결점 요소가 **아닌** 것은?", "options": ["옹이(생옹이 및 사옹이 크기)", "굽음(곡률)", "썩음(부후)", "목재의 함수율"], "answer": 3, "explain": "원목의 등급 판정은 외관상 결점인 옹이 지름, 굽음(곡률도), 갈라짐(할렬), 썩음, 벌레구멍 등을 기준으로 판정하며, 함수율은 원목의 품등 판정 요소가 아닙니다.\n쉬운 풀이: 원목 등급은 눈으로 보이는 결점(옹이 크기, 굽음, 갈라짐, 썩음, 벌레구멍)으로 정해요. 함수율(나무 속 물 비율)은 건조 정도일 뿐 원목 등급 판정 요소가 아니에요.\n용어 풀이:\n· 품등: 품질 등급\n· 옹이: 가지 자국\n· 함수율: 목재 속 수분 비율\n· 곡률: 굽은 정도", "ref": "목재의 지속가능한 이용에 관한 법률"}, {"id": "산림경영-88", "subject": "산림경영", "num": 88, "part": 4, "stem": "산림 자산의 평가 방법 중 토지와 입목을 일괄하여 매년 발생하는 영구 순수익을 적정 할인율(자본환원율 r)로 나누어 현재가치를 구하는 부동산 평가 방식은?", "options": ["원가법", "수익환원법(Direct capitalization)", "시장비교법", "잔여법"], "answer": 1, "explain": "· 수익환원법은 장래 기대되는 순수익(Net income, a)을 자본환원율(r)로 자본환원하여 산림 가치(P = a\n· r)를 산출하는 방법입니다.\n쉬운 풀이: 수익환원법은 '매년 영원히 들어올 순수익 ÷ 자본환원율'로 가치를 구해요. 매년 100만원 수익, 환원율 5%면 100 ÷ 0.05 = 2,000만원. 매년 이자로 그만큼 받으려면 원금이 얼마여야 하나를 거꾸로 계산하는 거예요.\n용어 풀이:\n· 수익환원법: 순수익을 환원율로 나눠 가치를 구함\n· 자본환원율: 수익을 자산가치로 바꾸는 비율\n· 영구 순수익: 매년 계속 들어오는 이익", "ref": "산림평가학"}, {"id": "산림경영-89", "subject": "산림경영", "num": 89, "part": 4, "stem": "산림경영계획 수립 시 기본 구획 단위인 소반(Sub-compartment)을 구획하는 최소 면적 기준은?", "options": ["0.01ha", "0.1ha 이상", "1.0ha 이상", "5.0ha 이상"], "answer": 1, "explain": "산림경영계획 작성 요령상 소반의 면적은 원칙적으로 0.1ha 이상으로 구획합니다.\n쉬운 풀이: 산림경영계획에서 소반은 같은 방식으로 관리할 숲의 최소 단위예요. 너무 잘게 나누면 관리가 어려워서 원칙적으로 0.1ha(1,000㎡) 이상으로 구획해요.\n용어 풀이:\n· 소반: 임반 안의 작은 관리 구역\n· 구획: 경계를 나눔", "ref": "지속가능한 산림경영계획 수립 및 실행 규정"}, {"id": "산림경영-90", "subject": "산림경영", "num": 90, "part": 4, "stem": "이상적인 보속생산 숲인 법정림(Normal forest)의 4대 조건 중 풍해를 예방하고 벌채·운재를 원활하게 하기 위해 나이순으로 숲을 질서정연하게 배치하는 원칙은?", "options": ["법정영급분배", "법정임분배치", "법정생장량", "법정축적"], "answer": 1, "explain": "법정임분배치는 벌채 시 인접한 유령림이 바람 피해(풍도)를 받지 않도록 주풍의 반대 방향에서 주풍 방향으로 노령림부터 유령림 순으로 질서 있게 배치하는 원칙입니다.\n쉬운 풀이: 법정임분배치는 숲을 나이 순서대로 질서 있게 배치하는 원칙이에요. 바람이 불어오는 쪽 반대편에서부터 늙은 숲 → 어린 숲 순서로 두면, 늙은 숲을 벨 때 옆의 어린 숲이 바람 피해를 받지 않고 운반도 편해요.\n용어 풀이:\n· 법정임분배치: 벌채·풍해를 고려한 숲의 질서 있는 배치\n· 풍도: 바람에 쓰러짐\n· 운재: 목재 운반", "ref": "산림경영학 법정림론"}, {"id": "산림경영-91", "subject": "산림경영", "num": 91, "part": 4, "stem": "산림경영계획서에 첨부되는 산림경영계획도의 표준 제작 축척은?", "options": ["1:1,000", "1:5,000 또는 1:25,000", "1:100,000", "1:500,000"], "answer": 1, "explain": "산림경영계획도는 정밀 임소반 파악을 위해 1:5,000 축적의 임상도(또는 수치지형도)를 기본으로 하며, 광역 파악을 위해 1:25,000 축적이 병행 사용됩니다.\n쉬운 풀이: 산림경영계획도는 임반·소반 경계를 정밀하게 그려야 해서 보통 1:5,000 축척 지도를 쓰고, 넓은 범위를 볼 땐 1:25,000을 함께 써요. 1:5,000은 지도 1cm가 실제 50m라는 뜻이에요.\n용어 풀이:\n· 축척: 실제 거리를 지도에 줄인 비율\n· 임상도: 숲의 종류·나이를 표시한 지도\n· 수치지형도: 디지털 지형도", "ref": "산림경영계획 수립 기준"}, {"id": "산림경영-92", "subject": "산림경영", "num": 92, "part": 4, "stem": "현실임분의 벌채량을 결정하는 생장량법 공식 중 현실축적이 법정축적보다 부족할 때 벌채량을 생장량보다 적게 책정하여 축적을 축적시키는 수확조절 원리는?", "options": ["보속수확론", "카를(Karl) 식", "보겔(Baur) 식", "평형수확론"], "answer": 0, "explain": "보속수확 원칙하에서 현실축적이 목표 법정축적에 미달할 때는 연간 벌채량을 연간 생장량 이하로 제한하여 부족한 축적을 연차적으로 증대시킵니다.\n쉬운 풀이: 보속수확은 '숲을 줄이지 않고 계속 수확한다'는 원칙이에요. 그래서 현실 숲이 목표(법정축적)보다 부족하면, 자라는 양보다 적게 베어서 숲의 양을 조금씩 늘려 가요. 저금이 목표보다 적으면 이자보다 덜 쓰는 것과 같아요.\n용어 풀이:\n· 보속수확: 지속적으로 같은 수확을 유지\n· 생장량: 숲이 자라 늘어난 양\n· 축적: 숲의 총 재적", "ref": "산림경영학 수확조절론"}, {"id": "산림경영-93", "subject": "산림경영", "num": 93, "part": 4, "stem": "온실가스 인벤토리 보고서에서 산림의 입목 바이오매스 탄소저장량을 산정할 때 목재 재적(m³)을 건중량(ton)으로 변환하는 기본 계수는?", "options": ["목재기본밀도(Wood basic density)", "함수율", "조도계수", "형수"], "answer": 0, "explain": "탄소 산정 공식: 입목재적(m³) × 목재기본밀도(ton/m³) × 바이오매스확장계수(BEF) × (1 + 뿌리함량비) × 탄소전환계수(0.5)로 계산됩니다.\n쉬운 풀이: 숲의 탄소량은 이렇게 계산해요: 나무 부피(㎥) × 목재기본밀도(t/㎥, 부피를 마른 무게로) × 바이오매스확장계수(가지·잎 포함) × (1 + 뿌리 비율) × 탄소전환계수(0.5). 부피를 무게로 바꾸는 첫 단계가 '목재기본밀도'예요.\n용어 풀이:\n· 목재기본밀도: 생재 부피당 전건 무게\n· 건중량: 완전히 말린 무게\n· 바이오매스확장계수: 줄기 외 가지·잎까지 늘려 주는 계수", "ref": "기후변화협약 산림탄소통계"}, {"id": "산림경영-94", "subject": "산림경영", "num": 94, "part": 4, "stem": "임가경제조사에서 임가의 연간 총소득 중 순수하게 영림 및 임산물 생산·채취 활동을 통해 얻은 소득을 가리키는 것은?", "options": ["임업소득(Forestry income)", "임업외소득", "이전소득", "비경상소득"], "answer": 0, "explain": "임가소득 = 임업소득 + 임업외소득 + 이전소득 + 비경상소득으로 구성되며, 순수 임업 활동에서 벌어들인 총수입에서 임업경영비를 뺀 순액이 '임업소득'입니다.\n쉬운 풀이: 임가 소득은 임업소득 + 임업외소득 + 이전소득 + 비경상소득으로 이뤄져요. 그중 나무·버섯·밤 같은 임산물을 생산·채취해서 번 돈에서 경영비를 뺀 순수한 임업 활동 소득이 '임업소득'이에요.\n용어 풀이:\n· 임가: 임업을 하는 가구\n· 이전소득: 보조금·연금처럼 일하지 않고 받는 소득\n· 임업경영비: 임업에 쓴 비용", "ref": "임업경제학"}, {"id": "산림경영-95", "subject": "산림경영", "num": 95, "part": 4, "stem": "산림경영지도원 제도의 운영 목적 및 법적 근거에 대한 설명으로 옳은 것은?", "options": ["산림자원법 제31조에 근거하여 사유림 산주의 자율경영을 지도·지원하기 위해 배치된다.", "국유림만을 전담하여 벌채를 감독하는 특수사법경찰관이다.", "산림청에만 배치되는 국가 일반직 공무원이다.", "목재 가공 공장의 품질만을 검사하는 기술직원이다."], "answer": 0, "explain": "산림경영지도원은 「산림자원의 조성 및 관리에 관한 법률」(산림자원법) 제31조에 따라 산림조합중앙회장의 요청으로 산림청장이 산림조합 및 산림조합중앙회에 배치하며, 영세한 사유림 산주들을 대상으로 산림경영계획 작성, 임업기술 지도, 조림·숲가꾸기 대리경영 등을 수행하는 공인 전문인력입니다.\n쉬운 풀이: 여러분이 준비하는 바로 그 자리예요! 산림경영지도원은 「산림자원법」 제31조에 따라 산림조합중앙회장이 요청하면 산림청장이 산림조합·중앙회에 배치해요. 영세한 사유림 산주에게 경영계획 작성, 기술 지도, 대리경영 등을 해 주는 전문 인력이에요.\n용어 풀이:\n· 산림자원법: 「산림자원의 조성 및 관리에 관한 법률」\n· 사유림: 개인 소유 산림\n· 배치: 인력을 정해진 곳에 둠", "ref": "산림자원법 제31조 (2026.11 정정: 기존 '산림조합법 제31조'는 오기)"}, {"id": "산림경영-96", "subject": "산림경영", "num": 96, "part": 4, "stem": "상호 배타적인 두 개 이상의 산림 투자 사업 대안을 비교 평가할 때, 사업 규모의 차이로 인해 왜곡이 발생할 수 있는 내부수익률법(IRR)보다 이론적으로 가장 우수한 평가 기준은?", "options": ["순현재가치법(NPV)", "단순회수기간법", "투자이익률법", "매출액영업이익률"], "answer": 0, "explain": "내부수익률법(IRR)은 재투자 수  벌채할 때 나무에 색 띠를 둘러 표시해요. 구역 경계는 흰색, 솎아베기·골라베기로 벨 나무는 빨간색, 남길 나무는 노란색이에요. '흰=경계, 빨=벤다, 노=남긴다'로 외우세요.\n용어 풀이:\n· 존치목: 베지 않고 남겨 두는 나무\n· 솎아베기: 간벌\n· 골라베기: 택벌", "ref": "p.9"}, {"id": "산림관계법규-5", "subject": "산림관계법규", "num": 5, "part": 1, "stem": "인가받은 산림경영계획 대상 산림이 몇 ha 이하이면 산림조합 등에 대리경영을 권장할 수 있는가?", "options": ["5ha", "10ha", "12ha", "15ha"], "answer": 3, "explain": "15ha 이하 → 대리경영 권장, 사업비 우선 지원\n쉬운 풀이: 인가받은 산림이 15ha 이하로 작으면 산주 혼자 경영하기 어려우니 산림조합 등에 대리경영을 맡기도록 권장하고 사업비도 먼저 지원해요. '15ha 이하 대리경영 권장'.\n용어 풀이:\n· 대리경영: 산림조합 등이 대신 경영함\n· 권장: 그렇게 하도록 권함\n· 인가: 공식 승인", "ref": "p.8"}, {"id": "산림관계법규-6", "subject": "산림관계법규", "num": 6, "part": 1, "stem": "허가나 신고 **없이** 할 수 있는 벌채가 **아닌** 것은?", "options": ["풀베기", "가지치기", "소유자 동의를 받은 건축물 외곽 25m 이내 산불예방 벌채", "흉고직경 20cm 이하 솎아베기"], "answer": 3, "explain": "DBH 20cm 이하 솎아베기는 신고 대상\n쉬운 풀이: 풀베기·가지치기, 그리고 산불 예방을 위해 집 주변 25m 안의 나무를 소유자 동의 하에 베는 건 허가·신고 없이 할 수 있어요. 하지만 흉고직경 20cm 이하 솎아베기는 '신고'를 해야 해서 정답은 ④예요.\n용어 풀이:\n· 허가: 미리 승인을 받아야 함\n· 신고: 미리 알려야 함\n· 건축물 외곽: 건물 바깥 테두리", "ref": "p.20–21"}, {"id": "산림관계법규-7", "subject": "산림관계법규", "num": 7, "part": 1, "stem": "산림사업법인의 등록 기관은?", "options": ["산림청장", "시·도지사", "시장·군수·구청장", "산림조합중앙회장"], "answer": 1, "explain": "· 산림사업법인 등록 = 시·도지사\n· 종묘생산업 등록 = 시장·군수·구청장\n쉬운 풀이: 등록 기관 구분이 자주 나와요. 산림사업법인(숲가꾸기 등을 하는 회사)은 시·도지사에게 등록해요. 법규 문제는 '누가'를 바꿔 내는 경우가 많으니 주체를 꼭 같이 외우세요.\n용어 풀이:\n· 산림사업법인: 산림사업을 하는 법인\n· 등록: 공식 명부에 올림\n· 시·도지사: 광역 지자체장", "ref": "p.13–16"}, {"id": "산림관계법규-8", "subject": "산림관계법규", "num": 8, "part": 1, "stem": "산림경영지도원의 배치에 대한 설명으로 옳은 것은?", "options": ["산림청장이 중앙회장의 요청을 받아 조합·중앙회에 배치한다", "시·도지사가 조합장의 요청을 받아 배치한다", "시장·군수가 직접 선발해 배치한다", "한국임업진흥원장이 배치한다"], "answer": 0, "explain": "법 제31조: 산림청장이 중앙회장의 요청으로 배치, 경비 보조\n쉬운 풀이: 산림경영지도원은 산림자원법 제31조에 따라, 산림조합중앙회장이 요청하면 산림청장이 산림조합과 중앙회에 배치하고 경비도 보조해요. 여러분이 합격하면 바로 이 제도로 일하게 돼요.\n용어 풀이:\n· 배치: 인력을 정해진 자리에 둠\n· 경비 보조: 비용 일부를 지원\n· 산림조합중앙회: 전국 산림조합의 중앙 조직", "ref": "p.17–18"}, {"id": "산림관계법규-9", "subject": "산림관계법규", "num": 9, "part": 1, "stem": "녹색자금의 재원이 **아닌** 것은?", "options": ["출연금", "복권수익금", "운용수익금", "산림조합 출자금"], "answer": 3, "explain": "재원 = 출연금·복권수익금·운용수익·기부금 등\n쉬운 풀이: 녹색자금은 산림 환경을 좋게 하는 데 쓰는 기금이에요. 돈은 출연금, 복권수익금, 운용수익, 기부금 등으로 모아요. 산림조합 출자금은 조합원이 조합에 낸 돈이라 녹색자금 재원이 아니에요.\n용어 풀이:\n· 녹색자금: 산림환경 개선을 위한 기금\n· 재원: 돈의 출처\n· 출연금: 국가·기관이 내놓은 돈", "ref": "p.27–28"}, {"id": "산림관계법규-10", "subject": "산림관계법규", "num": 10, "part": 1, "stem": "임업진흥법상 임업인의 요건으로 옳지 **않은** 것은?", "options": ["3ha 이상 산림에서 임업을 경영하는 자", "임산물 연 판매액이 120만원 이상인 자", "연 60일 이상 임업에 종사하는 자", "산림조합원으로서 임업을 경영하는 자"], "answer": 2, "explain": "연 90일 이상\n쉬운 풀이: 임업인은 3ha 이상 산림에서 임업을 하거나, 1년에 90일 이상 임업에 종사하거나, 임산물을 1년에 120만원 이상 파는 사람 등이에요. '60일'은 틀렸어요. '3ha·90일·120만원'을 세트로 외우세요.\n용어 풀이:\n· 임업인: 법에서 정한 임업 종사자\n· 임산물: 숲에서 나는 생산물(목재·버섯·밤 등)\n· 연 판매액: 1년 동안 판 금액", "ref": "p.30"}, {"id": "산림관계법규-11", "subject": "산림관계법규", "num": 11, "part": 1, "stem": "임업후계자의 연령 요건은?", "options": ["50세 미만", "55세 미만", "60세 미만", "65세 미만"], "answer": 1, "explain": "55세 미만\n쉬운 풀이: 임업후계자는 앞으로 임업을 이끌어 갈 사람으로 선발하는데, 나이가 55세 미만이어야 해요. 젊은 사람이 오래 임업을 이어가게 하려는 취지예요.\n용어 풀이:\n· 임업후계자: 임업을 이어갈 사람으로 선발된 자\n· 연령 요건: 나이 조건", "ref": "p.33"}, {"id": "산림관계법규-12", "subject": "산림관계법규", "num": 12, "part": 1, "stem": "임업진흥법상 특별관리임산물은?", "options": ["산양삼", "표고버섯", "송이", "산마늘"], "answer": 0, "explain": "산양삼 (한국임업진흥원 생산적합성조사 → 산림청장 신고)\n쉬운 풀이: 특별관리임산물은 비싸게 거래되고 가짜가 많아 특별히 관리하는 임산물로, 대표가 산양삼이에요. 한국임업진흥원의 생산 적합성 조사를 거쳐 산림청장에게 신고하고 재배해야 해요.\n용어 풀이:\n· 특별관리임산물: 법으로 특별히 관리하는 임산물\n· 산양삼: 산에서 씨를 뿌려 키운 삼\n· 생산적합성조사: 재배하기 알맞은지 조사", "ref": "p.30"}, {"id": "산림관계법규-13", "subject": "산림관계법규", "num": 13, "part": 1, "stem": "법정 임업인의 날은?", "options": ["4월 5일", "3월 21일", "10월 18일", "11월 1일"], "answer": 3, "explain": "매년 11월 1일\n쉬운 풀이: 임업인의 날은 매년 11월 1일이에요. 식목일(4월 5일)과 헷갈리지 마세요. 이번 시험(11월 7일) 직전 날짜라 기억하기 쉬워요.\n용어 풀이:\n· 임업인의 날: 임업인을 기리는 법정 기념일\n· 식목일: 나무 심는 날(4월 5일)", "ref": "p.35"}, {"id": "산림관계법규-14", "subject": "산림관계법규", "num": 14, "part": 1, "stem": "우수독림가의 기준은?", "options": ["300ha 이상 경영 또는 조림 100ha 이상", "5ha 이상 경영 또는 유실수 3ha 이상", "100ha 이상 경영 또는 조림 50ha(유실수 20ha) 이상", "50ha 이상 경영 또는 조림 30ha 이상"], "answer": 2, "explain": "① 모범독림가, ② 자영독림가\n쉬운 풀이: 독림가 등급은 경영 면적 기준이에요. 모범독림가 300ha 이상(또는 조림 100ha), 우수독림가 100ha 이상(또는 조림 50ha·유실수 20ha), 자영독림가 5ha 이상(또는 유실수 3ha). '300-100-5'로 외우세요.\n용어 풀이:\n· 독림가: 모범적으로 산림을 경영하는 사람\n· 유실수: 밤·호두처럼 열매를 얻는 나무\n· 조림: 나무 심기", "ref": "p.34"}, {"id": "산림관계법규-15", "subject": "산림관계법규", "num": 15, "part": 1, "stem": "지역산림조합 총회에서 정관변경을 의결하려면?", "options": ["조합원 과반수 출석, 출석 조합원 2/3 이상 찬성", "조합원 과반수 출석, 출석 조합원 과반수 찬성", "조합원 2/3 출석, 출석 조합원 과반수 찬성", "조합원 1/3 출석, 출석 조합원 2/3 이상 찬성"], "answer": 0, "explain": "정관변경·해산·분할·제명은 출석 2/3 이상 찬성\n쉬운 풀이: 정관변경·해산·분할·제명처럼 조합의 기본을 바꾸는 중요한 결정은 더 엄격해요. 조합원 과반수가 출석하고 출석자의 3분의 2 이상이 찬성해야 해요. 일반 안건은 출석자 과반수 찬성이면 돼요.\n용어 풀이:\n· 정관: 조합의 기본 규칙\n· 의결: 회의에서 결정함\n· 과반수: 절반을 넘는 수", "ref": "p.49"}, {"id": "산림관계법규-16", "subject": "산림관계법규", "num": 16, "part": 1, "stem": "지역산림조합 설립에 필요한 발기인 수는?", "options": ["20인 이상", "30인 이상", "50인 이상", "100인 이상"], "answer": 1, "explain": "발기인 30인 이상 → 창립총회 → 시·도지사 인가\n쉬운 풀이: 지역산림조합을 만들려면 발기인(설립을 주도하는 사람) 30인 이상이 모여 창립총회를 열고 시·도지사의 인가를 받아야 해요. 조합원 1천인 이상, 출자금 1억원 이상도 필요해요. '30인·1천인·1억'.\n용어 풀이:\n· 발기인: 설립을 주도하는 사람\n· 창립총회: 조합을 만드는 첫 총회\n· 인가: 공식 승인", "ref": "p.46"}, {"id": "산림관계법규-17", "subject": "산림관계법규", "num": 17, "part": 1, "stem": "지역산림조합 조합장의 임기와 연임 제한은?", "options": ["3년, 한 차례만 연임", "4년, 한 차례만 연임", "4년, 두 번까지 연임", "5년, 연임 제한 없음"], "answer": 2, "explain": "조합장 4년, 두 번까지 연임 (제38조)\n쉬운 풀이: 지역산림조합 조합장은 임기 4년이고 두 번까지 연임할 수 있어요(최대 12년). 중앙회장은 4년, 한 차례만 연임(최대 8년)이에요. 조합장 '두 번', 중앙회장 '한 번'을 구분하세요.\n용어 풀이:\n· 임기: 직위에 있는 기간\n· 연임: 다시 이어서 맡음\n· 조합장: 지역조합의 대표", "ref": "p.52 (제38조)"}, {"id": "산림관계법규-18", "subject": "산림관계법규", "num": 18, "part": 1, "stem": "지역산림조합 감사의 임기는?", "options": ["2년", "3년", "4년", "5년"], "answer": 1, "explain": "· 감사 3년\n· 상임이사·비조합원 이사 2년\n쉬운 풀이: 지역산림조합 임원 임기: 조합장 4년, 감사 3년, 상임이사·조합원이 아닌 이사는 2년이에요. 감사만 3년이라 자주 출제돼요.\n용어 풀이:\n· 감사: 조합 업무와 회계를 검사하는 임원\n· 상임이사: 상근하며 업무를 맡는 이사", "ref": "p.52 (제38조)"}, {"id": "산림관계법규-19", "subject": "산림관계법규", "num": 19, "part": 1, "stem": "산림조합과 산림소유자가 수익분배계약을 맺으면 산림소유자가 조합에 무엇을 설정한 것으로 보는가?", "options": ["임차권", "전세권", "저당권", "지상권"], "answer": 3, "explain": "제50조: 지상권 설정으로 봄\n쉬운 풀이: 산주가 산림조합과 '나무를 키워 수익을 나누자'는 계약을 맺으면, 조합이 그 땅에 나무를 심고 쓸 권리, 즉 지상권을 설정받은 것으로 봐요. 남의 땅 위에 나무를 소유할 수 있는 권리예요.\n용어 풀이:\n· 수익분배계약: 수익을 나눠 갖는 계약\n· 지상권: 남의 땅에 건물·나무를 소유하기 위해 쓰는 권리\n· 저당권: 빚 담보로 잡는 권리", "ref": "p.59"}, {"id": "산림관계법규-20", "subject": "산림관계법규", "num": 20, "part": 1, "stem": "산림조합중앙회장의 임기와 연임 제한은? (학습모듈 기준)", "options": ["4년, 한 차례만 연임", "4년, 두 번까지 연임", "4년, 단임", "2년, 두 번까지 연임"], "answer": 0, "explain": "중앙회장 4년, 한 차례만 연임. 직선·단임제 논의는 아직 모듈에 반영 안 됨\n쉬운 풀이: 산림조합중앙회장은 임기 4년, 한 차례만 연임할 수 있어요. 직선제·단임제 논의가 있지만 학습모듈엔 반영되지 않았으니 시험에선 '4년, 한 차례 연임'으로 답하세요.\n용어 풀이:\n· 중앙회장: 산림조합중앙회의 대표\n· 단임: 한 번만 맡음\n· 직선: 조합원이 직접 선출", "ref": "p.71"}, {"id": "산림관계법규-21", "subject": "산림관계법규", "num": 21, "part": 2, "stem": "기능구분도의 작성 축척 기준은?", "options": ["1/5,000 이상", "1/25,000 이상", "1/50,000 이상", "1/100,000 이상"], "answer": 1, "explain": "기능구분도·임상도 모두 1/25,000 이상\n쉬운 풀이: 기능구분도와 임상도는 1/25,000 이상의 축척으로 만들어요. 1/25,000은 지도 1cm가 실제 250m라는 뜻이에요. '이상'이란 더 자세한(분모가 작은) 지도라는 의미예요.\n용어 풀이:\n· 축척: 지도와 실제 거리의 비율\n· 기능구분도: 산림 기능을 나눈 지도\n· 임상도: 숲 상태 지도", "ref": "모듈 p.6"}, {"id": "산림관계법규-22", "subject": "산림관계법규", "num": 22, "part": 2, "stem": "산림자원법상 산림의 기능 구분 명칭이 **아닌** 것은?", "options": ["수원함양림", "산림재난방지림", "생활환경보전림", "산지보전림"], "answer": 3, "explain": "학습모듈(법규 p.6) 표기는 '산림재난방지림', 현행 시행규칙 제3조(2026.10.1 시행)·지속가능한 산림자원 관리지침 표기는 '산지재해방지림'(2026.1.30 개정으로 정의 문구만 '산림재난'으로 바뀜). 어느 쪽이든 '산지보전림'이라는 기능은 없음\n쉬운 풀이: 산림의 기능 구분은 목재생산림, 수원함양림, 산지재해(산림재난)방지림, 자연환경보전림, 산림휴양림, 생활환경보전림 등이에요. '산지보전림'이라는 이름은 없어요. 자료마다 산림재난방지림/산지재해방지림으로 표기가 달라도 같은 기능이에요.\n용어 풀이:\n· 산림 기능 구분: 산림을 주된 역할별로 나눈 것\n· 수원함양림: 물을 저장·공급하는 숲\n· 산지재해방지림: 산사태 등을 막는 숲", "ref": "p.6"}, {"id": "산림관계법규-23", "subject": "산림관계법규", "num": 23, "part": 2, "stem": "벌채 후 조림을 하지 않은 자 등에게 기간을 정해 조림을 명할 수 있는 자는?", "options": ["산림청장", "산림조합중앙회장", "특별자치시장·특별자치도지사·시장·군수·구청장", "한국임업진흥원장"], "answer": 2, "explain": "조림 명령 대상: 미조림자, 산불·병해충 고사림 소유자, 산림재난 우려 산림 소유자\n쉬운 풀이: 나무를 베고 다시 심지 않았거나, 산불·병해충으로 나무가 죽은 산, 재난 우려가 있는 산의 소유자에게 기간을 정해 조림하라고 명령할 수 있는 사람은 시장·군수·구청장(특별자치시장·도지사 포함)이에요. 현장 가까운 기초 지자체장이 맡아요.\n용어 풀이:\n· 조림 명령: 나무를 심도록 명령함\n· 미조림자: 벌채 후 나무를 심지 않은 사람\n· 고사림: 나무가 말라 죽은 숲", "ref": "p.7"}, {"id": "산림관계법규-24", "subject": "산림관계법규", "num": 24, "part": 2, "stem": "산림관리기반시설(임도 등)을 설치할 때의 요건으로 옳은 것은?", "options": ["산림소유자의 동의를 받아야 한다", "산림조합의 승인을 받아야 한다", "주민 3분의 2 이상의 동의가 필요하다", "별도 동의 없이 설치할 수 있다"], "answer": 0, "explain": "산림청장·시도지사·시장군수구청장이 산림소유자 동의를 받아 설치\n쉬운 풀이: 임도 같은 산림관리기반시설은 남의 산에 길을 내는 것이니, 산림청장·시도지사·시장군수구청장이 설치하더라도 산림소유자의 동의를 받아야 해요.\n용어 풀이:\n· 산림관리기반시설: 임도 등 산림 관리를 위한 시설\n· 동의: 찬성해 허락함", "ref": "p.6"}, {"id": "산림관계법규-25", "subject": "산림관계법규", "num": 25, "part": 2, "stem": "🆕 산림자원법령상 '산불진화임도'의 정의로 옳은 것은?", "options": ["도로와 도로를 연결하는 중추 임도", "산불 위험이 높은 산림 안의 산림경영·보호·산불진화를 목적으로 산불 대응에 특화된 기준을 적용해 설치하는 임도", "일정 구역의 산림사업을 위해 간선임도에서 연결하는 임도", "벌채 산물을 반출하려고 임시로 내는 운반로"], "answer": 1, "explain": "①은 간선임도, ③은 작업임도 (2025 개정 반영)\n쉬운 풀이: 산불진화임도는 산불 위험이 큰 숲에, 산불을 끄는 데 특화된 기준(넓은 노폭 등)을 적용해 만든 임도예요. 도로와 도로를 잇는 중심 임도는 간선임도, 간선에서 갈라져 작업용으로 쓰는 건 작업임도예요. 2025년 개정 내용이에요.\n용어 풀이:\n· 산불진화임도: 산불 진화 목적의 임도\n· 간선임도: 주요 도로를 잇는 중추 임도\n· 작업임도: 산림사업용 연결 임도", "ref": "p.7"}, {"id": "산림관계법규-26", "subject": "산림관계법규", "num": 26, "part": 2, "stem": "임도 설치계획의 수립 주체와 주기는?", "options": ["산림청장, 10년", "시·도지사 또는 지방산림청장, 5년", "시장·군수, 3년", "산림조합, 1년"], "answer": 1, "explain": "전국임도기본계획은 산림청장 10년, 임도 설치계획은 시·도지사·지방산림청장 5년\n쉬운 풀이: 임도 계획은 두 단계예요. 전국 큰 그림인 전국임도기본계획은 산림청장이 10년마다, 실제 설치계획은 시·도지사나 지방산림청장이 5년마다 세워요.\n용어 풀이:\n· 전국임도기본계획: 전국 임도의 장기계획\n· 임도 설치계획: 구체적 설치 계획", "ref": "p.7"}, {"id": "산림관계법규-27", "subject": "산림관계법규", "num": 27, "part": 2, "stem": "신고한 입목벌채 산림사업의 현지확인을 생략할 수 있는 경우가 **아닌** 것은?", "options": ["산림조합이 사업구역도를 작성하고 벌채구역·대상목 표시를 한 경우", "설계·감리를 하는 산림사업으로서 설계도서로 표시의 적정성을 확인할 수 있는 경우", "산림조합이 구역도를 작성하고 대상목 표시까지 마친 숲가꾸기 사업", "산림소유자가 직접 표시만 한 경우"], "answer": 3, "explain": "생략 사유는 산림조합의 구역도 작성·표시(①③), 설계도서로 확인 가능한 경우(②)\n쉬운 풀이: 신고한 벌채 사업은 원래 공무원이 현장에 가서 확인해요. 하지만 산림조합이 구역도를 만들고 대상목 표시까지 했거나, 설계도서로 확인할 수 있으면 현지확인을 생략해요. 산주가 혼자 표시만 한 건 믿기 어려우니 생략 사유가 아니에요.\n용어 풀이:\n· 현지확인: 현장에 가서 확인\n· 사업구역도: 사업 범위를 그린 지도\n· 설계도서: 설계 내용을 담은 문서", "ref": "p.22"}, {"id": "산림관계법규-28", "subject": "산림관계법규", "num": 28, "part": 2, "stem": "임산물 굴취·채취 예정구역도에 쓰는 임야도 축척은?", "options": ["1/6,000~1/1,200", "1/25,000", "1/50,000", "1/500 이하"], "answer": 0, "explain": "1/6,000~1/1,200 임야도\n쉬운 풀이: 산에서 임산물을 캐거나 채취할 예정 구역은 1/6,000~1/1,200 축척의 임야도에 표시해요. 작은 구역을 자세히 보여야 해서 큰 축척(자세한 지도)을 써요.\n용어 풀이:\n· 굴취: 캐내기\n· 채취: 따거나 모으기\n· 임야도: 산림 땅의 경계를 그린 지적도", "ref": "p.24"}, {"id": "산림관계법규-29", "subject": "산림관계법규", "num": 29, "part": 2, "stem": "입목벌채 허가 신청을 받는 기관은?", "options": ["산림청장", "시장·군수·구청장 또는 지방산림청 국유림관리소장", "시·도지사", "산림조합중앙회"], "answer": 1, "explain": "시장·군수·구청장 또는 지방산림청 국유림관리소장\n쉬운 풀이: 나무를 베기 위한 허가 신청은 현장을 관할하는 시장·군수·구청장, 국유림이면 지방산림청 국유림관리소장에게 해요.\n용어 풀이:\n· 입목벌채 허가: 나무를 베기 위한 승인\n· 국유림관리소: 국유림을 관리하는 산림청 하부 기관", "ref": "p.23"}, {"id": "산림관계법규-30", "subject": "산림관계법규", "num": 30, "part": 2, "stem": "특수산림사업지구의 지정 요건 중 산림경영가능지역 비율은?", "options": ["30% 이상", "50% 이상", "70% 이상", "90% 이상"], "answer": 2, "explain": "300ha 이상, 자원조성 대상 50% 이상, 경영가능지역 70% 이상\n쉬운 풀이: 특수산림사업지구는 큰 규모로 산림자원을 집중 조성하는 지역이에요. 300ha 이상이고, 자원조성 대상지가 50% 이상, 산림경영이 가능한 지역이 70% 이상이어야 지정돼요. '300·50·70'.\n용어 풀이:\n· 특수산림사업지구: 집중적으로 산림사업을 하도록 지정한 지구\n· 산림경영가능지역: 실제 경영할 수 있는 땅", "ref": "p.16"}, {"id": "산림관계법규-31", "subject": "산림관계법규", "num": 31, "part": 2, "stem": "묘목생산 대행자에서 제외되는 기준은?", "options": ["1년 동안 생산지정량 50% 미달", "2년 연속 생산지정량 70% 미달", "5년 동안 1회 미달", "3년 연속 생산지정량의 90% 미달"], "answer": 3, "explain": "3년 연속 90% 미달 시 제외\n쉬운 풀이: 나라가 묘목 생산을 맡긴 대행자가 3년 연속 정해진 생산량의 90%를 못 채우면 대행자에서 제외돼요. 한두 번은 봐주지만 계속 미달하면 자격을 잃는 거예요.\n용어 풀이:\n· 묘목생산 대행자: 국가 대신 묘목을 생산하도록 지정된 자\n· 생산지정량: 생산하도록 정한 양\n· 미달: 기준에 못 미침", "ref": "p.11"}, {"id": "산림관계법규-32", "subject": "산림관계법규", "num": 32, "part": 2, "stem": "숲가꾸기 대행 시 산림소유자의 주소가 불명이면 동의를 갈음하는 공고 기간은?", "options": ["30일 이상", "14일 이상", "7일 이상", "60일 이상"], "answer": 0, "explain": "30일 이상 공고\n쉬운 풀이: 숲가꾸기를 대신해 주려면 산주 동의가 필요한데, 산주 주소를 모르면 동의를 받을 수 없죠. 이럴 땐 30일 이상 공고해서 동의를 대신해요.\n용어 풀이:\n· 공고: 널리 알림\n· 갈음: 대신함\n· 대행: 대신 수행", "ref": "p.12"}, {"id": "산림관계법규-33", "subject": "산림관계법규", "num": 33, "part": 2, "stem": "임업진흥법상 영림단의 구성 인원은?", "options": ["3~10명", "6~30명", "10~50명", "30명 이상"], "answer": 1, "explain": "6~30명\n쉬운 풀이: 영림단은 숲가꾸기 같은 산림사업을 하는 작업 팀이에요. 임업진흥법상 6~30명으로 구성해요.\n용어 풀이:\n· 영림단: 산림사업을 수행하는 작업단\n· 구성 인원: 팀의 사람 수", "ref": "p.38–39"}, {"id": "산림관계법규-34", "subject": "산림관계법규", "num": 34, "part": 2, "stem": "임업진흥권역 중 시·도지사가 지정하는 면적 범위는?", "options": ["3만㎡ 미만", "100만㎡ 이상", "3만㎡ 이상 100만㎡ 미만", "면적 제한 없음"], "answer": 2, "explain": "· 산림청장: 국유림·100만㎡ 이상\n· 시·도지사: 3만~100만㎡\n· 시장·군수: 3만㎡ 미만\n쉬운 풀이: 임업진흥권역 지정권자는 면적에 따라 달라요(학습모듈 기준). 산림청장은 국유림·100만㎡ 이상, 시·도지사는 3만~100만㎡, 시장·군수는 3만㎡ 미만이에요. 큰 곳일수록 높은 기관이 지정해요.\n용어 풀이:\n· 임업진흥권역: 임업을 집중 육성하는 지역\n· 지정권자: 지정할 권한이 있는 사람\n· ㎡: 제곱미터(10,000㎡=1ha)", "ref": "p.40–41"}, {"id": "산림관계법규-35", "subject": "산림관계법규", "num": 35, "part": 2, "stem": "산촌의 요건 중 행정구역 면적 대비 산림면적 비율은?", "options": ["30% 이상", "50% 이상", "60% 이상", "70% 이상"], "answer": 3, "explain": "산림 70% 이상 + 인구밀도·경지비율 전국 읍면 평균 이하\n쉬운 풀이: 산촌은 행정구역 면적의 70% 이상이 산림이고, 인구밀도와 농경지 비율이 전국 읍·면 평균 이하인 곳이에요. 산이 많고 사람·농지가 적은 곳이라고 이해하세요.\n용어 풀이:\n· 산촌: 산림이 많은 농촌 지역\n· 인구밀도: 면적당 인구\n· 경지비율: 농경지 비율", "ref": "p.34"}, {"id": "산림관계법규-36", "subject": "산림관계법규", "num": 36, "part": 2, "stem": "전업임업의 요건은?", "options": ["50ha 이상 경영 또는 연 200일 이상 종사", "3ha 이상 경영 또는 연 90일 이상 종사", "500ha 이상 법인", "100ha 이상 경영"], "answer": 0, "explain": "· 겸업 3ha·90일\n· 전업 50ha·200일\n· 기업임업 500ha 법인·200일\n쉬운 풀이: 임업 경영 규모별 구분이에요. 겸업임업은 3ha·90일, 전업임업은 50ha 이상 경영 또는 연 200일 이상 종사, 기업임업은 500ha 이상 법인이에요. 규모가 클수록 기준이 커져요.\n용어 풀이:\n· 전업임업: 임업을 주업으로 함\n· 겸업임업: 다른 일과 함께 임업을 함\n· 기업임업: 법인이 하는 대규모 임업", "ref": "p.36–37"}, {"id": "산림관계법규-37", "subject": "산림관계법규", "num": 37, "part": 2, "stem": "지역산림조합 설립 인가기준 중 출자금은? (섬 지역 제외)", "options": ["1천만원 이상", "1억원 이상", "5억원 이상", "10억원 이상"], "answer": 1, "explain": "지역조합 1천인 + 1억원 (섬 300인·1천만원)\n쉬운 풀이: 지역산림조합 설립 인가 기준은 조합원 1천인 이상, 출자금 1억원 이상이에요. 섬 지역은 사람이 적어서 300인, 1천만원으로 낮춰 줘요.\n용어 풀이:\n· 출자금: 조합원이 조합에 낸 돈\n· 설립 인가기준: 설립 승인을 받기 위한 조건", "ref": "시행령 p.78"}, {"id": "산림관계법규-38", "subject": "산림관계법규", "num": 38, "part": 2, "stem": "조합원의 선거권이 있으려면 임원 임기만료일 전 언제까지 가입해야 하는가?", "options": ["30일", "90일", "180일", "1년"], "answer": 2, "explain": "임기만료일 전 180일까지 가입한 조합원\n쉬운 풀이: 선거 직전에 갑자기 조합원을 늘려 선거를 유리하게 만드는 걸 막으려고, 임원 임기만료일 180일 전까지 가입한 조합원에게만 선거권을 줘요.\n용어 풀이:\n· 선거권: 투표할 수 있는 권리\n· 임기만료일: 임기가 끝나는 날", "ref": "p.48"}, {"id": "산림관계법규-39", "subject": "산림관계법규", "num": 39, "part": 2, "stem": "탈퇴 조합원의 지분환급청구권은 몇 년간 행사하지 않으면 소멸하는가?", "options": ["6개월", "1년", "3년", "2년"], "answer": 3, "explain": "2년\n쉬운 풀이: 조합을 탈퇴한 사람은 낸 출자금 등 자기 몫(지분)을 돌려 달라고 할 수 있어요. 하지만 2년 동안 청구하지 않으면 그 권리가 사라져요.\n용어 풀이:\n· 지분환급청구권: 자기 몫을 돌려받을 권리\n· 소멸: 권리가 없어짐\n· 탈퇴: 조합에서 나감", "ref": "p.49"}, {"id": "산림관계법규-40", "subject": "산림관계법규", "num": 40, "part": 2, "stem": "중앙회 조합감사위원회가 회원을 감사하는 주기는?", "options": ["2년마다 1회 이상", "매년 2회", "3년마다 1회", "5년마다 1회"], "answer": 0, "explain": "2년마다 한 번 이상\n쉬운 풀이: 산림조합중앙회의 조합감사위원회는 회원 조합을 2년마다 한 번 이상 감사해요. 조합 운영이 제대로 되는지 정기적으로 검사하는 거예요.\n용어 풀이:\n· 조합감사위원회: 회원 조합을 감사하는 중앙회 기구\n· 감사: 업무·회계를 검사함\n· 회원: 중앙회에 속한 지역조합 등", "ref": "p.70"}, {"id": "산림관계법규-41", "subject": "산림관계법규", "num": 41, "part": 3, "stem": "산림조합의 법정적립금 적립 기준은?", "options": ["자기자본의 1배가 될 때까지 잉여금의 5% 이상", "자기자본의 3배가 될 때까지 잉여금의 10% 이상", "자기자본의 5배가 될 때까지 잉여금의 20% 이상", "제한 없이 잉여금의 30% 이상"], "answer": 1, "explain": "· 자기자본 3배까지 잉여금 10% 이상\n· 교육지원사업비 20% 이상 이월\n쉬운 풀이: 조합은 이익(잉여금)이 나면 일부를 꼭 모아 둬야 해요(법정적립금). 자기자본의 3배가 될 때까지 매년 잉여금의 10% 이상을 쌓아요. 망하지 않게 비상금을 의무로 모으는 거라고 생각하세요. '3배까지 10%'.\n용어 풀이:\n· 법정적립금: 법으로 의무화된 적립금\n· 잉여금: 쓰고 남은 이익\n· 자기자본: 조합 자신의 돈(빌린 돈 제외)", "ref": "모듈 p.60"}, {"id": "산림관계법규-42", "subject": "산림관계법규", "num": 42, "part": 3, "stem": "조합의 손실금을 보전할 때 가장 먼저 쓰는 것은?", "options": ["미처분이월금", "법정적립금", "자본적립금", "회전출자금"], "answer": 0, "explain": "미처분이월금 → 임의적립금 → 법정적립금 → 자본적립금 → 회전출자금\n쉬운 풀이: 손실이 나면 메우는 순서가 있어요. 가장 덜 중요한 돈부터 써요: 미처분이월금 → 임의적립금 → 법정적립금 → 자본적립금 → 회전출자금. 아직 쓰임새를 정하지 않은 돈(미처분이월금)을 가장 먼저 써요.\n용어 풀이:\n· 손실금 보전: 손해를 메움\n· 미처분이월금: 아직 처리하지 않고 넘어온 이익\n· 임의적립금: 조합이 스스로 정해 쌓은 적립금", "ref": "p.60"}, {"id": "산림관계법규-43", "subject": "산림관계법규", "num": 43, "part": 3, "stem": "잉여금 배당의 우선순위 중 첫 번째는?", "options": ["출자 배당", "준조합원 이용실적 배당", "조합원의 사업 이용실적 배당", "임원 성과급"], "answer": 2, "explain": "이용실적 → 출자 → 준조합원 이용실적\n쉬운 풀이: 협동조합은 '조합을 많이 이용한 사람'에게 먼저 이익을 돌려줘요. 그래서 배당 순서는 ① 조합원 사업 이용실적 배당 → ② 출자(돈 낸 만큼) 배당 → ③ 준조합원 이용실적 배당이에요. 주식회사(출자 우선)와 다른 점이에요.\n용어 풀이:\n· 배당: 이익을 나눠 줌\n· 이용실적: 조합 사업을 이용한 정도\n· 준조합원: 조합원은 아니지만 사업을 이용하는 사람", "ref": "p.60"}, {"id": "산림관계법규-44", "subject": "산림관계법규", "num": 44, "part": 3, "stem": "총회 의결의 취소를 청구하는 방법은?", "options": ["의결일부터 1년 안에 조합원 10% 동의로 법원에", "의결일부터 3개월 안에 조합원 과반수 동의로 산림청장에게", "의결일부터 6개월 안에 이사회 의결로 중앙회장에게", "의결일부터 1개월 안에 조합원 300인 또는 5% 이상 동의로 시·도지사에게"], "answer": 3, "explain": "1개월 안, 300인 또는 5% 이상 동의, 시·도지사\n쉬운 풀이: 총회 결정이 잘못됐다고 생각하면, 의결한 날부터 1개월 안에 조합원 300인 또는 5% 이상의 동의를 받아 시·도지사에게 취소를 청구할 수 있어요. '1개월·300인/5%·시도지사'.\n용어 풀이:\n· 의결 취소 청구: 결정을 없애 달라고 요청\n· 시·도지사: 지역조합을 감독하는 기관장", "ref": "p.49"}, {"id": "산림관계법규-45", "subject": "산림관계법규", "num": 45, "part": 3, "stem": "조합원이 총회에 임원 해임을 요구하려면 필요한 동의는?", "options": ["조합원 10분의 1 이상", "조합원 5분의 1 이상", "조합원 3분의 1 이상", "조합원 과반수"], "answer": 1, "explain": "5분의 1 이상 동의 → 총회 과반수 출석 + 3분의 2 찬성\n쉬운 풀이: 조합원은 임원을 해임하라고 요구할 수 있어요. 조합원 5분의 1 이상이 동의하면 총회에 올리고, 총회에서 과반수 출석 + 출석자 3분의 2 이상이 찬성해야 해임돼요.\n용어 풀이:\n· 해임: 직위에서 물러나게 함\n· 동의: 찬성 서명\n· 출석: 회의에 참석", "ref": "p.56"}, {"id": "산림관계법규-46", "subject": "산림관계법규", "num": 46, "part": 3, "stem": "조합장을 비상임으로 하는 조합의 자산 규모 기준은?", "options": ["500억원 이상", "1천억원 이상", "2,500억원 이상", "5천억원 이상"], "answer": 2, "explain": "자산 1천억 미만 상임 / 2,500억 이상 비상임 (시행령)\n쉬운 풀이: 조합 규모가 커지면 조합장이 모든 업무를 직접 하기 어려워 전문 경영인(상임이사)에게 맡기고 조합장은 비상임이 돼요. 자산 2,500억원 이상이면 비상임, 1천억원 미만이면 상임이에요.\n용어 풀이:\n· 상임: 늘 근무하며 업무를 맡음\n· 비상임: 상근하지 않음\n· 자산: 조합이 가진 재산 총액", "ref": "p.82"}, {"id": "산림관계법규-47", "subject": "산림관계법규", "num": 47, "part": 3, "stem": "중앙회가 회원 가입 신청을 받은 경우 승낙해야 하는 기간은?", "options": ["60일 이내", "30일 이내", "90일 이내", "14일 이내"], "answer": 0, "explain": "60일 이내 승낙\n쉬운 풀이: 조합이 중앙회에 회원으로 가입하겠다고 신청하면, 중앙회는 60일 이내에 승낙해야 해요. 정당한 이유 없이 미루거나 거절할 수 없어요.\n용어 풀이:\n· 회원 가입: 중앙회 구성원이 되는 것\n· 승낙: 받아들임", "ref": "p.67"}, {"id": "산림관계법규-48", "subject": "산림관계법규", "num": 48, "part": 3, "stem": "중앙회장이 직무를 수행할 수 없을 때 사업대표이사가 대행하는 사유는?", "options": ["회장이 7일 이상 해외 출장 중일 때", "회장이 15일 이상 휴가 중일 때", "회장 임기 만료 6개월 전부터", "회장이 30일 이상 입원 등으로 직무를 수행할 수 없을 때"], "answer": 3, "explain": "30일 이상 입원 등 → 사업대표이사 대행\n쉬운 풀이: 중앙회장이 30일 이상 입원하는 등 직무를 할 수 없으면 사업대표이사가 대신 업무를 맡아요. 짧은 출장·휴가로는 대행이 생기지 않아요.\n용어 풀이:\n· 직무대행: 직무를 대신 수행\n· 사업대표이사: 중앙회 사업 부문의 대표", "ref": "p.70–71"}, {"id": "산림관계법규-49", "subject": "산림관계법규", "num": 49, "part": 3, "stem": "산림청장 등의 조합 경영지도 기간은?", "options": ["3개월, 연장 불가", "6개월, 6개월 단위로 연장 가능", "1년, 1년 단위로 연장", "2년, 연장 불가"], "answer": 1, "explain": "· 6개월, 6개월 단위 연장\n· 만료 15일 전까지 통지\n쉬운 풀이: 경영이 어려운 조합은 산림청장 등이 경영지도를 해요. 기간은 6개월이고 필요하면 6개월씩 연장할 수 있으며, 연장할 땐 만료 15일 전까지 알려야 해요.\n용어 풀이:\n· 경영지도: 경영 개선을 위해 감독·지도함\n· 연장: 기간을 늘림\n· 통지: 알림", "ref": "p.88"}, {"id": "산림관계법규-50", "subject": "산림관계법규", "num": 50, "part": 3, "stem": "산림조합법 시행령상 임업인 범위에 포함되는 밤 재배 면적 기준은?", "options": ["300㎡ 이상", "1천㎡ 이상", "5천㎡ 이상", "1만㎡ 이상"], "answer": 2, "explain": "종묘생산업자, 포지 300㎡, 대추·호두 1천㎡, 밤 5천㎡\n쉬운 풀이: 산림조합법 시행령상 임업인에는 일정 면적 이상 특용수를 키우는 사람도 들어가요. 묘목 포지 300㎡, 대추·호두 1천㎡, 밤 5천㎡ 이상이에요. 밤이 가장 넓은 면적이 필요해요.\n용어 풀이:\n· 임업인 범위: 법에서 임업인으로 인정하는 사람\n· 포지: 묘목을 키우는 밭\n· 종묘생산업자: 씨앗·묘목 생산업자", "ref": "p.81"}, {"id": "산림관계법규-51", "subject": "산림관계법규", "num": 51, "part": 4, "stem": "「산림기본법」상 산림청장이 수립하는 산림기본계획의 수립 주기는? (2026 학습모듈 기준)", "options": ["5년마다", "10년마다", "15년마다", "20년마다"], "answer": 3, "explain": "산림기본계획은 산림청장이 20년마다 수립 (산림기본법 제11조, 2017년부터 20년). 지역산림계획도 20년 (2026.11 정정: 기존 정답 ②(10년)는 학습모듈과 맞지 않아 수정)\n쉬운 풀이: 산림기본계획은 '산림기본법'에 따라 산림청장이 세우는 나라 산림의 최상위 계획으로, 2017년부터 20년마다 수립해요(학습모듈 기준). 지역산림계획도 20년이에요. 기존 자료의 10년은 틀린 정보라 정답을 ④로 고쳤어요.\n용어 풀이:\n· 산림기본법: 산림정책의 기본 법률\n· 산림기본계획: 국가 산림 장기 계획\n· 지역산림계획: 시·도·지방산림청 단위 계획", "ref": "학습모듈 산림경영 p.41–42 · 산림기본법"}, {"id": "산림관계법규-52", "subject": "산림관계법규", "num": 52, "part": 4, "stem": "「산지관리법」상 산림자원의 조성과 임업경영의 기반 구축을 위해 지정되는 산지의 분류는?", "options": ["임업용산지", "공익용산지", "준보전산지", "한계산지"], "answer": 0, "explain": "보전산지는 산림자원 조성용 '임업용산지'와 재해방지·경관보호용 '공익용산지'로 구분\n쉬운 풀이: 보전산지는 두 가지예요. 임업 생산(나무 키우기)을 위한 '임업용산지'와 재해 방지·경관·수원 보호 같은 공익을 위한 '공익용산지'예요. 보전산지가 아닌 곳은 준보전산지예요.\n용어 풀이:\n· 보전산지: 보전하기 위해 지정한 산지\n· 임업용산지: 임업 생산용 보전산지\n· 공익용산지: 공익 기능용 보전산지", "ref": "산지관리법"}, {"id": "산림관계법규-53", "subject": "산림관계법규", "num": 53, "part": 4, "stem": "「산지관리법」상 산지를 다른 용도로 전용하려는 자가 산림을 대체 조성하기 위해 사전에 납부해야 하는 부담금의 공식 명칭은?", "options": ["산지전용부담금", "대체산림자원조성비", "생태계보전협력금", "산림복원예치금"], "answer": 1, "explain": "산지전용허가를 받아 훼손되는 산림을 대체 조성하기 위해 납부하는 비용은 대체산림자원조성비\n쉬운 풀이: 산을 깎아 공장·주택 등으로 바꾸면(산지전용) 숲이 사라지죠. 그만큼 다른 곳에 숲을 만드는 데 쓰라고 미리 내는 돈이 '대체산림자원조성비'예요.\n용어 풀이:\n· 산지전용: 산지를 다른 용도로 바꿈\n· 대체산림자원조성비: 훼손된 산림을 대신 조성하는 비용\n· 부담금: 특정 목적으로 내는 돈", "ref": "산지관리법"}, {"id": "산림관계법규-54", "subject": "산림관계법규", "num": 54, "part": 4, "stem": "「임업 및 산촌 진흥 촉진에 관한 법률」상 독림가(篤林家)의 종류에 해당하지 않는 것은?", "options": ["모범독림가", "우수독림가", "자영독림가", "마을독림가"], "answer": 3, "explain": "독림가는 모범독림가(300ha 이상)·우수독림가(100ha 이상)·자영독림가(5ha 이상) 3종류이며 마을독림가는 없음 (2026.11 정정: 기존 보기는 법령에 없는 명칭이라 학습모듈 기준으로 교체)\n쉬운 풀이: 독림가는 경영 규모에 따라 모범독림가(300ha 이상), 우수독림가(100ha 이상), 자영독림가(5ha 이상) 세 가지예요. '마을독림가'는 없어요. (기존 보기는 법에 없는 이름이라 학습모듈 기준으로 바꿨어요.)\n용어 풀이:\n· 독림가: 산림경영을 모범적으로 하는 사람\n· 모범·우수·자영: 규모에 따른 독림가 등급", "ref": "학습모듈 산림관계법규 p.34 · 임업진흥법 시행규칙"}, {"id": "산림관계법규-55", "subject": "산림관계법규", "num": 55, "part": 4, "stem": "「소나무재선충병 방제특별법」상 소나무재선충병 발생지역 및 인접지역에 대해 소나무류의 이동을 전면 금지하기 위해 시·군·구 단위로 지정하는 구역은?", "options": ["산림정화구역", "소나무류 반출금지구역", "산림유전자원보호구역", "병해충방제권역"], "answer": 1, "explain": "소나무재선충 발생지 및 인접지(반경 2km 이내 등)는 소나무류 반출금지구역으로 지정\n쉬운 풀이: 재선충병 발생지와 주변(2km 등)의 소나무를 밖으로 옮기지 못하게 지정하는 구역이 '소나무류 반출금지구역'이에요. 감염된 나무가 다른 지역으로 이동해 병이 퍼지는 걸 막아요.\n용어 풀이:\n· 반출금지구역: 소나무류 이동을 금지한 구역\n· 인접지역: 가까운 주변 지역", "ref": "재선충특별법"}, {"id": "산림관계법규-56", "subject": "산림관계법규", "num": 56, "part": 4, "stem": "「사방사업법」상 사방사업에 의해 설치된 사방시설(사방댐 등)의 관리 주체로 옳은 것은?", "options": ["해당 토지의 사유 산주", "관할 시·도지사 또는 지방산림청장", "인근 마을 이장", "국토교통부장관"], "answer": 1, "explain": "사방시설의 관리 주체는 관할 시·도지사 또는 지방산림청장\n쉬운 풀이: 사방댐 같은 사방시설은 산사태·토사를 막는 공공시설이라, 땅 주인이 아니라 시·도지사나 지방산림청장이 관리해요.\n용어 풀이:\n· 사방시설: 산사태·토사 유출을 막는 시설\n· 사방댐: 계곡에 쌓아 흙·돌을 막는 댐\n· 관리 주체: 책임지고 관리하는 기관", "ref": "사방사업법"}, {"id": "산림관계법규-57", "subject": "산림관계법규", "num": 57, "part": 4, "stem": "「산림문화·휴양에 관한 법률」상 국민의 보건휴양 및 산림치유를 위하여 산림청장이나 지자체장이 조성하는 구역에 해당하지 않는 것은?", "options": ["자연휴양림", "산림욕장", "치유의 숲", "골프연습장"], "answer": 3, "explain": "골프연습장은 체육시설이며 산림휴양·치유 시설(자연휴양림, 치유의숲 등)에 해당하지 않음\n쉬운 풀이: 산림휴양·치유 시설에는 자연휴양림, 산림욕장, 치유의 숲, 숲길 등이 있어요. 골프연습장은 체육시설이라 해당하지 않아요.\n용어 풀이:\n· 자연휴양림: 숙박·휴양 시설을 갖춘 숲\n· 산림욕장: 숲속 산책·휴식 공간\n· 치유의 숲: 산림치유 프로그램을 하는 숲", "ref": "산림휴양법"}, {"id": "산림관계법규-58", "subject": "산림관계법규", "num": 58, "part": 4, "stem": "「국유림의 경영 및 관리에 관한 법률」상 국토보존, 산림경영, 학술연구 등을 위해 국가가 계속 보존할 필요가 있는 국유림의 분류는?", "options": ["불요존국유림", "요존국유림", "공유림", "잡종국유재산"], "answer": 1, "explain": "국유림 중 국가가 계속 보존해야 할 산림은 요존국유림, 처분 가능한 산림은 불요존국유림\n쉬운 풀이: 국유림은 계속 지켜야 하는 '요존국유림'(국토보존·산림경영·학술연구용)과, 꼭 보존할 필요가 없어 팔거나 교환할 수 있는 '불요존국유림'으로 나눠요. '요존 = 요(要)하다, 꼭 필요해서 존치'.\n용어 풀이:\n· 요존국유림: 계속 보존해야 하는 국유림\n· 불요존국유림: 보존 필요가 없는 국유림\n· 처분: 팔거나 넘김", "ref": "국유림법"}, {"id": "산림관계법규-59", "subject": "산림관계법규", "num": 59, "part": 4, "stem": "「산림보호법」상 과실로 인하여 타인의 산림이나 자기의 산림을 불에 태워 공공의 위험을 발생하게 한 자(실화죄)에 대한 법정형은?", "options": ["1년 이하의 징역 또는 1천만원 이하의 벌금", "3년 이하의 징역 또는 3천만원 이하의 벌금", "5년 이하의 징역 또는 5천만원 이하의 벌금", "10년 이하의 징역"], "answer": 1, "explain": "과실로 산림을 불태운 자(실화범)는 3년 이하의 징역 또는 3천만원 이하의 벌금\n쉬운 풀이: 실수로 산불을 낸 사람(실화범)은 3년 이하 징역 또는 3천만원 이하 벌금이에요. 일부러 불을 지른 방화보다 가볍지만 처벌받아요. 지금은 산림재난방지법으로 옮겨졌지만 형량은 같아요.\n용어 풀이:\n· 실화: 실수로 불을 냄\n· 법정형: 법에 정해진 형벌 범위\n· 방화: 일부러 불을 지름", "ref": "산림보호법"}, {"id": "산림관계법규-60", "subject": "산림관계법규", "num": 60, "part": 4, "stem": "「산림자원법」상 입목의 굴취·채취 시 허가를 받지 않고 신고만으로 가능한 경미한 행위로 옳은 것은?", "options": ["재해의 예방을 위한 긴급 벌채", "50ha 이상의 대단위 모두베기", "보안림 구역 내 전면 개벌", "산지전용허가지 외의 구역에서 대경재 굴취"], "answer": 0, "explain": "병해충 예방, 풍도목 제거, 재해 긴급 벌채 등은 허가 없이 신고 또는 임의벌채 가능\n쉬운 풀이: 재해를 막으려고 급히 베거나, 병해충 예방·바람에 쓰러진 나무 정리 같은 일은 급하고 공익적이라 허가 없이 신고만 하거나 바로 할 수 있어요. 대규모 모두베기·보안림 개벌은 당연히 허가가 필요해요.\n용어 풀이:\n· 긴급 벌채: 급히 베는 것\n· 풍도목: 바람에 쓰러진 나무\n· 임의벌채: 허가·신고 없이 하는 벌채", "ref": "산림자원법"}, {"id": "산림관계법규-61", "subject": "산림관계법규", "num": 61, "part": 4, "stem": "「산림기술 진흥 및 관리에 관한 법률」상 산림사업의 설계·감리 등 산림기술용역업을 등록하려는 자의 관할 등록 관청은?", "options": ["산림청장", "시·도지사", "시장·군수·구청장", "산림조합중앙회장"], "answer": 1, "explain": "산림기술용역업의 등록은 관할 시·도지사에게 등록\n쉬운 풀이: 산림사업의 설계·감리 같은 전문 용역을 하는 산림기술용역업은 시·도지사에게 등록해요. 산림사업법인 등록도 시·도지사였죠. '업체 등록은 대부분 시·도지사'.\n용어 풀이:\n· 산림기술용역업: 산림 설계·감리 등을 하는 업종\n· 감리: 공사가 제대로 되는지 감독", "ref": "산림기술진흥법"}, {"id": "산림관계법규-62", "subject": "산림관계법규", "num": 62, "part": 4, "stem": "「백두대간 보호에 관한 법률」상 백두대간 보호지역 중 핵심구역에서 원칙적으로 금지되는 행위는?", "options": ["군사시설의 설치", "국가안전보장 시설", "대규모 광산 개발 및 골프장 설치", "문화재 복원"], "answer": 2, "explain": "백두대간 핵심구역 내에서는 광산 개발, 골프장 조성 등 대규모 개발행위 절대 불가\n쉬운 풀이: 백두대간 보호지역의 핵심구역은 가장 엄격하게 보호하는 곳이라 광산·골프장 같은 대규모 개발은 원칙적으로 금지예요. 국방·안보 시설처럼 꼭 필요한 공익시설만 예외적으로 허용돼요.\n용어 풀이:\n· 백두대간: 백두산에서 지리산까지 이어진 큰 산줄기\n· 핵심구역: 가장 엄격히 보호하는 구역\n· 완충구역: 핵심구역 주변 완충 지대", "ref": "백두대간법"}, {"id": "산림관계법규-63", "subject": "산림관계법규", "num": 63, "part": 4, "stem": "「산지관리법」상 산지전용허가를 받은 자가 목적 사업을 완료한 후 토사 유출을 방지하기 위해 반드시 받아야 하는 행정 절차는?", "options": ["토석채취허가", "복구준공검사", "산림조사보고서 제출", "임도노선변경인가"], "answer": 1, "explain": "산지전용 목적 사업을 마친 자는 토사 유출 및 산사태 방지를 위해 복구준공검사를 필해야 함\n쉬운 풀이: 산지전용을 허가받아 공사를 마치면, 흙이 쓸려 내려가거나 산사태가 나지 않도록 복구공사를 하고 '복구준공검사'를 받아야 해요. 복구를 제대로 했는지 확인받는 절차예요.\n용어 풀이:\n· 복구: 원래대로 되돌림\n· 준공검사: 공사가 끝났는지 확인하는 검사\n· 토사 유출: 흙·모래가 쓸려 나감", "ref": "산지관리법"}, {"id": "산림관계법규-64", "subject": "산림관계법규", "num": 64, "part": 4, "stem": "「목재의 지속가능한 이용에 관한 법률」상 소비자를 보호하고 목재 유통 질서를 확립하기 위해 지정된 목재제품에 대해 의무화된 제도는?", "options": ["목재제품 규격·품질검사 및 표시 제도", "원목 전수 경매 제도", "목재 수출 쿼터제", "목조건축 탄소세 부과제"], "answer": 0, "explain": "제재목, 합판, 목재펠릿 등 주요 목재제품은 규격·품질검사를 거쳐 품질표시를 부착해야 함\n쉬운 풀이: 제재목·합판·목재펠릿 같은 주요 목재제품은 소비자 보호를 위해 규격·품질검사를 받고 품질표시를 붙여야 해요. 그래야 불량 목재가 시장에 나오지 않아요.\n용어 풀이:\n· 규격·품질검사: 정해진 크기·품질을 지켰는지 검사\n· 품질표시: 제품 품질 정보를 붙이는 것\n· 목재펠릿: 톱밥을 압축한 연료", "ref": "목재이용법"}, {"id": "산림관계법규-65", "subject": "산림관계법규", "num": 65, "part": 4, "stem": "「산림조합법」상 지역산림조합의 최고의사결정기구인 총회의 소집 권한을 가진 자는?", "options": ["산림청장", "조합장", "시·도지사", "상임이사"], "answer": 1, "explain": "지역산림조합의 총회는 조합장이 소집함\n쉬운 풀이: 지역산림조합의 최고 의사결정기구인 총회는 조합장이 소집해요. 학교 학생회 회의를 회장이 소집하는 것과 같아요.\n용어 풀이:\n· 총회: 조합원 전체가 모이는 최고 의사결정 회의\n· 소집: 회의를 열기 위해 사람을 모음", "ref": "산림조합법"}, {"id": "산림관계법규-66", "subject": "산림관계법규", "num": 66, "part": 4, "stem": "「임업·산촌 공익기능 증진을 위한 직접지불제도 운영에 관한 법률(임업직불제법)」상 임산물생산업 직접지불금의 지급 대상 산지에 해당하는 것은?", "options": ["산지관리법에 따른 보전산지 및 준보전산지로서 실제 임업에 이용되는 산지", "국유림 유상 대부지", "도시지역 내 상업지역 산지", "골프장 및 리조트 부지 내 산림"], "answer": 0, "explain": "임업직불제는 보전산지 및 준보전산지에서 실제 임업에 종사하는 임업인에게 지급\n쉬운 풀이: 임업직불제는 임업의 공익기능을 위해 임업인에게 돈을 직접 주는 제도예요. 보전산지·준보전산지에서 실제로 임업을 하는 경우에 지급하고, 상업지역·골프장 부지 같은 곳은 제외예요.\n용어 풀이:\n· 직접지불제(직불제): 정부가 농·임업인에게 직접 보조금을 주는 제도\n· 준보전산지: 보전산지가 아닌 산지", "ref": "임업직불제법"}, {"id": "산림관계법규-67", "subject": "산림관계법규", "num": 67, "part": 4, "stem": "「산림보호법」상 산림병해충의 번식을 막기 위해 병든 나무의 소각·파쇄·훈증 등 방제명령을 내릴 수 있는 권한권자는?", "options": ["시장·군수·구청장 또는 지방산림청장", "소방서장", "농림축산식품부장관", "산림조합 지도과장"], "answer": 0, "explain": "산림병해충 방제명령 권한은 시장·군수·구청장 또는 국유림 관리 지방산림청장에게 있음\n쉬운 풀이: 병해충이 퍼지는 걸 막기 위해 병든 나무를 태우거나(소각) 부수거나(파쇄) 훈증하라고 명령할 수 있는 사람은 시장·군수·구청장, 국유림은 지방산림청장이에요.\n용어 풀이:\n· 방제명령: 병해충을 없애도록 하는 명령\n· 소각: 태움\n· 파쇄: 잘게 부숨", "ref": "산림보호법"}, {"id": "산림관계법규-68", "subject": "산림관계법규", "num": 68, "part": 4, "stem": "「산림자원의 조성 및 관리에 관한 법률」상 도시숲·생활숲·가로수를 체계적으로 조성·관리하기 위해 산림청장이 수립하는 기본계획의 주기는?", "options": ["5년마다", "10년마다", "15년마다", "20년마다"], "answer": 1, "explain": "도시숲·생활숲 조성·관리 기본계획은 산림청장이 10년마다 수립\n쉬운 풀이: 도시숲·생활숲·가로수를 체계적으로 만들고 관리하기 위한 기본계획은 산림청장이 10년마다 세워요. 산림기본계획(20년)과 주기가 다르니 구분하세요.\n용어 풀이:\n· 도시숲: 도시 안의 숲\n· 생활숲: 마을 주변 숲\n· 가로수: 길가에 심은 나무", "ref": "도시숲법"}, {"id": "산림관계법규-69", "subject": "산림관계법규", "num": 69, "part": 4, "stem": "「탄소흡수원 유지 및 증진에 관한 법률」상 산림의 온실가스 감축 효과를 인증받는 산림탄소흡수량의 거래 단위는?", "options": ["1kg CO₂eq", "1t CO₂eq", "10t CO₂eq", "100t CO₂eq"], "answer": 1, "explain": "산림탄소흡수량의 기본 인증 단위는 1t CO₂eq (이산화탄소 상당량 톤)\n쉬운 풀이: 숲이 흡수한 탄소는 '이산화탄소로 환산한 톤(t CO₂eq)' 단위로 인증·거래해요. 메탄 등 다른 온실가스도 이산화탄소 몇 톤과 같은지로 바꿔 계산해서 'eq(상당량)'를 붙여요.\n용어 풀이:\n· CO₂eq(이산화탄소 상당량): 온실가스를 CO₂ 기준으로 환산한 양\n· 탄소흡수량: 숲이 흡수한 탄소의 양\n· 인증: 공식 확인", "ref": "탄소흡수원법"}, {"id": "산림관계법규-70", "subject": "산림관계법규", "num": 70, "part": 4, "stem": "「산림자원의 조성 및 관리에 관한 법률」상 채종림 또는 채종원으로 지정·고시된 산림 구역에서의 제한 행위로 옳은 것은?", "options": ["산림청장의 허가 없이 임목을 벌채하거나 종자를 채취하는 행위 금지", "공인된 학술 연구 목적의 진입도 절대 금지", "가축의 방목은 연중 언제나 자유롭게 허용", "잡초 제거 및 풀베기 작업 전면 금지"], "answer": 0, "explain": "채종림·채종원에서는 우량 종자 보존을 위해 무단 입목 벌채 및 임의 종자 채취가 엄격히 금지됨\n쉬운 풀이: 채종림·채종원은 좋은 씨앗을 얻는 소중한 곳이라, 허가 없이 나무를 베거나 씨앗을 따는 걸 엄격히 금지해요. 반대로 관리를 위한 풀베기·잡초 제거는 오히려 필요해요.\n용어 풀이:\n· 채종림: 우량 종자를 얻는 숲\n· 채종원: 우량 종자 생산용 나무 농장\n· 지정·고시: 정해서 공식 발표", "ref": "산림자원법"}, {"id": "산림관계법규-71", "subject": "산림관계법규", "num": 71, "part": 4, "stem": "「산지관리법」상 산지전용허가를 받지 않고 일정 기간 동안 임시로 산지를 사용한 후 원상복구하는 산지일시사용신고의 대상 행위는?", "options": ["아파트 단지 신축", "산림경영관리사(연면적 50㎡ 이하) 설치 및 임도·작업로 개설", "대규모 골프장 건설", "산업단지 공장 설립"], "answer": 1, "explain": "산림경영을 위한 50㎡ 이하의 관리사, 임도, 작업로, 임산물 건조장 등은 산지일시사용신고 대상으로 허가보다 절차가 간소합니다.\n쉬운 풀이: 산지일시사용신고는 '잠깐 쓰고 원래대로 돌려놓는' 작은 사용을 허가보다 간단하게 신고로 처리하는 제도예요. 50㎡ 이하 산림경영관리사, 임도·작업로, 임산물 건조장 같은 산림경영용 시설이 대상이에요.\n용어 풀이:\n· 산지일시사용: 산지를 잠시 쓰고 복구\n· 산림경영관리사: 산림경영을 위한 작은 관리 건물\n· 작업로: 산림 작업용 길", "ref": "산지관리법"}, {"id": "산림관계법규-72", "subject": "산림관계법규", "num": 72, "part": 4, "stem": "「임업 및 산촌 진흥 촉진에 관한 법률」상 임업의 생산성을 높이고 임업을 집약적으로 경영하기 위해 산림을 지정·고시하는 구역은?", "options": ["임업진흥권역", "자연휴양림구역", "산지전용제한지역", "도시계획구역"], "answer": 0, "explain": "관할 시·도지사는 임업의 집약적 육성을 위해 보전산지 등을 대상으로 임업진흥권역을 지정합니다.\n쉬운 풀이: 임업진흥권역은 임업 생산성을 높이고 집약적으로 경영하려고 지정하는 구역이에요. 이곳에 임업 지원을 집중해서 임업을 키워요.\n용어 풀이:\n· 임업진흥권역: 임업을 집중 육성하도록 지정한 권역\n· 집약적 경영: 좁은 면적에 노력·자본을 많이 들이는 경영", "ref": "임업진흥법"}, {"id": "산림관계법규-73", "subject": "산림관계법규", "num": 73, "part": 4, "stem": "「산림복지 진흥에 관한 법률」상 경제적·사회적 여건 등으로 산림복지 혜택을 받기 어려운 소외계층에게 자연휴양림이나 치유의 숲을 이용할 수 있도록 제공하는 바우처의 공식 명칭은?", "options": ["산림복지서비스이용권", "국민행복카드", "녹색성장카드", "산림치유바우처"], "answer": 0, "explain": "산림복지이용권(바우처)은 취약계층의 산림휴양·치유 시설 이용을 국가가 지원하는 복지 제도입니다.\n쉬운 풀이: 산림복지서비스이용권은 형편이 어려운 사람도 자연휴양림·치유의 숲 같은 산림복지 시설을 이용할 수 있게 나라가 주는 바우처(이용권)예요.\n용어 풀이:\n· 산림복지: 숲을 통한 국민 복지\n· 바우처: 특정 서비스를 이용할 수 있는 이용권\n· 소외계층: 혜택에서 멀어진 계층", "ref": "산림복지법"}, {"id": "산림관계법규-74", "subject": "산림관계법규", "num": 74, "part": 4, "stem": "「백두대간 보호에 관한 법률」상 백두대간 보호지역의 완충구역에서 지자체장의 허가를 받아 제한적으로 설치할 수 있는 공익시설은?", "options": ["농림어업인의 주택 신축 및 부대시설", "대규모 위락시설", "카지노 및 경마장", "대형 아웃렛"], "answer": 0, "explain": "완충구역에서는 원주민의 실생활을 위한 농가주택 신축이나 소규모 농림어업 시설은 허가를 받아 설치 가능합니다.\n쉬운 풀이: 백두대간 완충구역은 핵심구역보다는 덜 엄격해서, 원래 살던 주민의 생활을 위한 농가주택이나 소규모 농림어업 시설은 허가를 받아 지을 수 있어요. 위락시설·카지노 같은 건 안 돼요.\n용어 풀이:\n· 완충구역: 핵심구역 보호를 위한 주변 지역\n· 원주민: 원래 그곳에 살던 사람\n· 위락시설: 놀이·오락 시설", "ref": "백두대간법"}, {"id": "산림관계법규-75", "subject": "산림관계법규", "num": 75, "part": 4, "stem": "「산림자원법」상 조림용 묘목이나 산림 종자를 판매하려는 종·묘 생산업자가 소비자에게 교부해야 하는 서류는?", "options": ["종·묘 품질보증서", "사업자등록증 사본", "산림조사서", "산지전용허가증"], "answer": 0, "explain": "불량 묘목 유통을 막기 위해 생산업자는 수종, 원산지, 품질 규격 등이 적힌 품질보증서를 의무 발급해야 합니다.\n쉬운 풀이: 불량 묘목이 팔리지 않도록, 종·묘 생산업자는 수종·원산지·품질 규격이 적힌 '품질보증서'를 구매자에게 줘야 해요. 가전제품 품질보증서와 비슷해요.\n용어 풀이:\n· 품질보증서: 품질을 보증하는 문서\n· 종·묘: 씨앗과 묘목\n· 원산지: 생산된 지역", "ref": "산림자원법"}, {"id": "산림관계법규-76", "subject": "산림관계법규", "num": 76, "part": 4, "stem": "「산지관리법」상 대규모 산지 개발로 인한 재해를 예방하기 위해 사업계획 면적이 얼마 이상일 때 산지전용 타당성조사를 의무화하고 있는가?", "options": ["1만㎡ 이상", "66만㎡(약 20만평) 이상", "10만㎡ 이상", "30만㎡ 이상"], "answer": 1, "explain": "66만㎡ 이상의 대규모 산지 개발은 전문기관의 산지전용타당성조사를 거쳐야 합니다.\n쉬운 풀이: 아주 큰 산지 개발은 산사태·홍수 위험이 크니 미리 전문기관의 타당성조사를 받아야 해요. 그 기준이 66만㎡(약 20만 평) 이상이에요.\n용어 풀이:\n· 산지전용 타당성조사: 개발이 적절한지 사전 조사\n· 평: 약 3.3㎡", "ref": "산지관리법"}, {"id": "산림관계법규-77", "subject": "산림관계법규", "num": 77, "part": 4, "stem": "「산림조합법」상 조합원의 출자금에 대한 배당 이익과 비과세 예탁금에 대한 조세특례의 목적은?", "options": ["임업인의 자산 형성 지원 및 산림자원 육성 자금 조달", "국가 세수 증대", "대기업 자본 유치", "주식 시장 활성화"], "answer": 0, "explain": "산림조합 비과세 예탁금(1인당 3천만원 등)은 농어촌·임업인의 경제적 자립을 지원하기 위한 조세특례입니다.\n쉬운 풀이: 산림조합에 돈을 맡기거나(예탁금) 출자하면 세금을 깎아 주는 특례가 있어요. 임업인이 재산을 모으고, 조합은 그 돈으로 산림 사업 자금을 마련하게 하려는 목적이에요.\n용어 풀이:\n· 출자금: 조합에 낸 자본금\n· 비과세 예탁금: 이자에 세금을 매기지 않는 예금\n· 조세특례: 세금을 줄여 주는 특별 규정", "ref": "산림조합법"}, {"id": "산림관계법규-78", "subject": "산림관계법규", "num": 78, "part": 4, "stem": "「국유림의 경영 및 관리에 관한 법률」상 공익적 목적이 사라져 국가가 계속 보존할 필요가 없다고 인정되어 처분이나 매각이 가능한 국유림은?", "options": ["불요존국유림", "요존국유림", "보안림", "채종림"], "answer": 0, "explain": "보존이 꼭 필요한 요존국유림과 달리, 불요존국유림은 매각, 교환, 대부 등이 가능합니다.\n쉬운 풀이: 불요존국유림은 국가가 계속 보존할 필요가 없다고 인정된 국유림이라 매각·교환·대부(빌려줌)가 가능해요. 꼭 지켜야 하는 요존국유림은 팔 수 없어요.\n용어 풀이:\n· 불요존국유림: 보존 필요가 없는 국유림\n· 대부: 빌려줌\n· 매각: 팔아 넘김", "ref": "국유림법"}, {"id": "산림관계법규-79", "subject": "산림관계법규", "num": 79, "part": 4, "stem": "「임업 및 산촌 진흥 촉진에 관한 법률」상 산림청장이 산촌의 정주 여건 개선과 소득 증대를 위해 수립하는 산촌진흥기본계획의 수립 주기는?", "options": ["5년마다", "10년마다", "15년마다", "20년마다"], "answer": 0, "explain": "· 산촌진흥기본계획은 5년마다 수립·시행됩니다.\n· (산림기본계획·지역산림계획은 20년, 산촌진흥기본계획은 5년!)\n쉬운 풀이: 산촌진흥기본계획은 산림청장이 5년마다 세워요. 산촌 주민의 생활 여건과 소득을 높이기 위한 계획이에요. 산림기본계획·지역산림계획(20년)과 주기가 다르니 비교해서 외우세요.\n용어 풀이:\n· 산촌진흥기본계획: 산촌 발전을 위한 기본계획\n· 정주 여건: 사람이 자리 잡고 살기 위한 조건", "ref": "임업진흥법"}, {"id": "산림관계법규-80", "subject": "산림관계법규", "num": 80, "part": 4, "stem": "「산림보호법」상 산불 발생 위험이 가장 높은 봄철과 가을철에 산림청장이 지정하여 전면 비상근무 체제에 돌입하는 기간은?", "options": ["산불특별대책기간", "산림휴식년제 기간", "수렵금지기간", "산지정화기간"], "answer": 0, "explain": "봄철(통상 3.15~4.15 전후) 대형산불 위험기에는 산불특별대책기간이 선포되어 집중 감시가 이뤄집니다.\n쉬운 풀이: 봄철(3~4월)은 건조하고 바람이 세서 대형 산불 위험이 가장 커요. 이때 산림청장이 '산불특별대책기간'을 정해 비상근무 체제로 집중 감시해요.\n용어 풀이:\n· 산불특별대책기간: 산불 위험기에 집중 대응하는 기간\n· 비상근무: 평소보다 강화된 근무", "ref": "산림보호법"}, {"id": "산림관계법규-81", "subject": "산림관계법규", "num": 81, "part": 4, "stem": "「산림기본법」상 산림정책의 기본방향과 장기 전망을 제시하기 위해 산림청장이 수립하는 산림기본계획의 수립 주기는?", "options": ["5년", "10년", "20년", "30년"], "answer": 2, "explain": "· 「산림기본법」 제11조에 따른 '산림기본계획'은 20년마다 전국 산림을 대상으로 수립·시행합니다.\n· (※ 지역산림계획도 20년, 개별 산림경영계획은 10년 단위임에 유의!)\n쉬운 풀이: 산림기본계획은 나라 산림정책의 큰 방향을 정하는 가장 상위 계획이라 20년이라는 긴 기간으로 세워요(산림기본법 제11조). 지역산림계획도 20년이고, 개별 산주의 산림경영계획은 10년이에요.\n용어 풀이:\n· 산림기본법: 산림정책의 기본 법\n· 장기 전망: 먼 미래에 대한 예측\n· 산림경영계획: 개별 산림의 10년 계획", "ref": "산림기본법 제11조"}, {"id": "산림관계법규-82", "subject": "산림관계법규", "num": 82, "part": 4, "stem": "「산림자원의 조성 및 관리에 관한 법률」상 산림청장 또는 시·도지사가 우량한 조림용 종자의 생산을 위해 지정하는 구역에 해당하지 **않는** 것은?", "options": ["채종림", "채종원", "수형목", "산림욕장"], "answer": 3, "explain": "· 산림자원법상 종·묘 채취 및 생산을 위해 지정하는 대상은 채종원, 채종림, 채수포, 수형목입니다.\n· 산림욕장은 휴양법령에 따른 시설입니다.\n쉬운 풀이: 좋은 씨앗을 얻으려고 지정하는 대상은 채종림(씨앗 얻는 숲), 채종원(씨앗 생산 농장), 채수포(삽수 얻는 밭), 수형목(우수한 어미나무)이에요. 산림욕장은 휴양 시설이라 관계없어요.\n용어 풀이:\n· 수형목: 형질이 뛰어나 선발한 나무\n· 채수포: 꺾꽂이용 가지를 얻는 포지\n· 산림욕장: 숲 휴양 시설", "ref": "산림자원법 제19조"}, {"id": "산림관계법규-83", "subject": "산림관계법규", "num": 83, "part": 4, "stem": "「도시숲 등의 조성 및 관리에 관한 법률(도시숲법)」상 지방자치단체의 장이 관할 구역의 도시숲 등을 체계적으로 관리하기 위해 수립해야 하는 도시숲등 조성·관리계획의 주기는?", "options": ["3년", "5년", "10년", "20년"], "answer": 2, "explain": "지방자치단체의 장은 관할 구역의 도시숲·생활숲·가로수를 체계적으로 조성·관리하기 위하여 10년마다 도시숲등 조성·관리계획을 수립·시행하여야 합니다.\n쉬운 풀이: 지자체장은 관할 지역의 도시숲·생활숲·가로수를 체계적으로 가꾸기 위해 10년마다 '도시숲등 조성·관리계획'을 세워요. 산림청장의 도시숲 기본계획도 10년이에요.\n용어 풀이:\n· 도시숲법: 도시숲 등의 조성·관리에 관한 법률\n· 조성: 만들어 갖춤", "ref": "도시숲 등의 조성 및 관리에 관한 법률 제6조"}, {"id": "산림관계법규-84", "subject": "산림관계법규", "num": 84, "part": 4, "stem": "「산림기술 진흥 및 관리에 관한 법률」상 산림기술용역업을 등록할 수 있는 사업 분야로 옳지 **않은** 것은?", "options": ["산림경영", "산림공학", "녹지조경", "원자력 발전설비 구축"], "answer": 3, "explain": "산림기술용역업의 전문분야: 산림경영, 산림공학(임도·사방), 산림휴양, 녹지조경, 도시림 등입니다.\n쉬운 풀이: 산림기술용역업의 전문 분야는 산림경영, 산림공학(임도·사방), 산림휴양, 녹지조경, 도시림 등 숲과 관련된 것들이에요. 원자력 발전설비는 전혀 관계없어요.\n용어 풀이:\n· 산림기술용역업: 산림 관련 설계·감리 등 전문 용역업\n· 산림공학: 임도·사방 등 토목 분야", "ref": "산림기술법 시행령"}, {"id": "산림관계법규-85", "subject": "산림관계법규", "num": 85, "part": 4, "stem": "「산림기술 진흥 및 관리에 관한 법률」상 산림기술자가 거짓이나 부정한 방법으로 자격증을 발급받은 경우 행정처분 기준은?", "options": ["시정명령", "업무정지 6개월", "자격취소", "과태료 50만원"], "answer": 2, "explain": "· 거짓이나 그 밖의 부정한 방법으로 산림기술자 자격증을 취득한 때에는 반드시 '자격을 취소'하여야 합니다.\n· (필요적 취소 사유)\n쉬운 풀이: 거짓이나 부정한 방법으로 자격증을 받았다면 자격 자체가 처음부터 잘못된 것이라 반드시 자격을 취소해야 해요(필요적 취소). 경고·업무정지로 끝나지 않아요.\n용어 풀이:\n· 필요적 취소: 반드시 취소해야 하는 것\n· 행정처분: 행정기관의 제재\n· 산림기술자: 산림기술 자격을 가진 사람", "ref": "산림기술법 제12조"}, {"id": "산림관계법규-86", "subject": "산림관계법규", "num": 86, "part": 4, "stem": "「산지관리법」상 산지전용허가를 받은 자가 목적 사업을 착수하지 않거나 거짓으로 허가를 받은 경우 행정청이 취할 수 있는 조치로 가장 강력한 것은?", "options": ["산지전용허가의 취소", "주의 처분", "과태료 10만원 부과", "벌채 허용"], "answer": 0, "explain": "거짓이나 부정한 방법으로 허가를 받았거나, 허가 목적 사업을 정당한 사유 없이 2년 이상 착수하지 않는 등의 경우 산림청장 등은 산지전용허가를 취소할 수 있습니다.\n쉬운 풀이: 산지전용허가를 거짓으로 받았거나, 허가 받고 정당한 이유 없이 2년 넘게 사업을 시작하지 않으면 허가를 취소할 수 있어요. 가장 강한 조치는 '허가 취소'예요.\n용어 풀이:\n· 산지전용허가: 산지를 다른 용도로 쓰도록 허가\n· 착수: 일을 시작함", "ref": "산지관리법 제20조"}, {"id": "산림관계법규-87", "subject": "산림관계법규", "num": 87, "part": 4, "stem": "「산지관리법」상 산지를 임도 개설, 산림경영관리사 설치, 임산물 재배 등의 용도로 일시적으로 사용하고자 할 때 거쳐야 하는 행정 절차는?", "options": ["산지전용허가", "산지일시사용신고", "토지수용", "토석채취허가"], "answer": 1, "explain": "영구적인 형질변경이 아닌 임도, 작업로, 간이 산림경영관리사(부지면적 200㎡ 미만), 임산물 재배 등은 산지전용이 아니라 '산지일시사용신고' 대상입니다.\n쉬운 풀이: 임도, 작업로, 작은 산림경영관리사, 임산물 재배처럼 땅을 영구적으로 바꾸지 않고 잠시 쓰는 경우는 허가가 아니라 '산지일시사용신고'로 간단히 처리해요.\n용어 풀이:\n· 산지일시사용신고: 일시적 산지 사용을 신고로 처리\n· 형질변경: 땅 모양을 바꿈\n· 토석채취: 흙·돌을 캐냄", "ref": "산지관리법 제15조의2"}, {"id": "산림관계법규-88", "subject": "산림관계법규", "num": 88, "part": 4, "stem": "「산지관리법」상 허가나 신고 없이 불법으로 산지를 전용하거나 형질변경한 자에 대해 산림청장이나 지자체장이 명할 수 있는 의무는?", "options": ["산지복구명령", "세금 감면", "임업후계자 지정", "지목 자동변경"], "answer": 0, "explain": "불법 산지전용 행위자에 대해서는 형사처벌과 병행하여 원래의 산지 형태로 되돌리도록 '산지복구명령'을 내리며, 불이행 시 대집행으로 복구하고 비용을 징수합니다.\n쉬운 풀이: 허가 없이 산지를 함부로 바꾼 사람에게는 처벌과 함께 원래 산 모습으로 되돌리라는 '산지복구명령'을 내려요. 안 하면 행정기관이 대신 복구하고(대집행) 비용을 받아내요.\n용어 풀이:\n· 산지복구명령: 원래 상태로 복구하라는 명령\n· 대집행: 행정기관이 대신 실행하고 비용을 청구\n· 불법 전용: 허가 없이 용도 변경", "ref": "산지관리법 제44조"}, {"id": "산림관계법규-89", "subject": "산림관계법규", "num": 89, "part": 4, "stem": "「산림보호법」상 산불재난 국가위기경보 발령 기준 중 '산불위험지수가 80 이상이거나 대형 산불이 동시다발적으로 발생할 우려가 극히 높을 때' 발령하는 최고 단계 경보는?", "options": ["관심", "주의", "경계", "심각"], "answer": 3, "explain": "산불재난 위기경보는 관심 → 주의 → 경계 → 심각 4단계로 발령되며, 기상 건조특보와 산불위험지수가 최고조에 달할 때 '심각' 단계가 발령됩니다.\n쉬운 풀이: 산불재난 위기경보는 관심 → 주의 → 경계 → 심각 순서예요. 산불위험지수가 매우 높고 대형 산불이 동시에 여러 곳에서 날 우려가 클 때가 최고 단계인 '심각'이에요.\n용어 풀이:\n· 위기경보: 재난 위험 단계를 알리는 경보\n· 산불위험지수: 기상 조건으로 계산한 산불 위험도", "ref": "산림보호법 시행령 및 산불재난 위기대응 실무매뉴얼"}, {"id": "산림관계법규-90", "subject": "산림관계법규", "num": 90, "part": 4, "stem": "「산림재난방지법」상 산림에서 담배를 피우거나 담배꽁초를 버린 사람에게 부과되는 과태료 기준은? (2026.2.1 이후)", "options": ["20만원 이하", "30만원 이하", "70만원 이하", "200만원 이하"], "answer": 2, "explain": "· 산림재난방지법 제79조③: 70만원 이하\n· 불 피우기·불 가지고 입산 200만원 이하\n· 화기 소지 금지명령 위반 30만원 이하\n· 2026.2.1부터 산불 관련 과태료는 산림보호법에서 산림재난방지법으로 옮겨짐 (2026.11 정정: 기존 문항은 종전 산림보호법 제57조의 '20만원 이하' 기준)\n쉬운 풀이: 2026년 2월부터 산불 관련 과태료가 산림재난방지법으로 옮겨지면서 금액이 바뀌었어요. 산에서 담배를 피우거나 꽁초를 버리면 70만원 이하, 불을 피우거나 불을 가지고 입산하면 200만원 이하예요. 예전 기준(20만원)과 헷갈리지 마세요.\n용어 풀이:\n· 과태료: 행정 규칙 위반에 매기는 돈\n· 화기: 불을 일으키는 물건\n· 산림재난방지법: 2026년 시행된 산림재난 관련 법", "ref": "산림재난방지법 제79조"}, {"id": "산림관계법규-91", "subject": "산림관계법규", "num": 91, "part": 4, "stem": "「사방사업법」상 사방사업의 타당성평가를 반드시 실시하여야 하는 구역에 해당하는 것은?", "options": ["산사태취약지역으로 지정된 지역 또는 대규모 황폐지", "도시지역의 상업용지", "농경지 평야구역", "하천 정비구역"], "answer": 0, "explain": "사방사업법 제7조의3에 따라 사방사업을 시행하려는 경우, 산사태취약지역 등 사방사업이 시급한 구역에 대해 타당성평가를 먼저 실시하여 환경성과 경제성을 검토해야 합니다.\n쉬운 풀이: 사방사업은 큰 예산이 드는 공사라, 산사태취약지역이나 대규모 황폐지처럼 꼭 필요한 곳은 먼저 타당성평가로 환경성과 경제성을 따져 본 뒤에 시행해요.\n용어 풀이:\n· 타당성평가: 사업이 적절한지 미리 평가\n· 황폐지: 나무가 없고 흙이 드러난 땅\n· 사방사업: 산사태·토사를 막는 사업", "ref": "사방사업법 제7조의3"}, {"id": "산림관계법규-92", "subject": "산림관계법규", "num": 92, "part": 4, "stem": "「사방사업법」상 사방지로 지정된 토지의 지정을 전부 또는 일부 해제할 수 있는 사유로 옳지 **않은** 것은?", "options": ["사방사업 시행 후 5년 이상 경과하고 사방시설이 안정되어 지정 목적이 달성된 경우", "공익상 또는 국가 시책상 불가피하게 다른 용도로 사용되는 경우", "토지 소유자가 개인 주택을 신축하기 위해 단순 변심으로 해제를 요청하는 경우", "군사 목적상 불가피한 경우"], "answer": 2, "explain": "사방지는 국가 예산으로 토사를 안정시킨 공익 토지이므로 목적 달성(5년 경과 및 안정 판정)이나 공익 목적이 아닌 단순 개인적 영리 목적의 해제 요청은 불허됩니다.\n쉬운 풀이: 사방지는 나랏돈으로 흙을 안정시킨 공익 토지예요. 공사 후 5년이 지나 안정되었거나, 공익·군사상 꼭 필요할 때만 지정을 해제해요. 개인이 집 짓고 싶다고 단순히 요청하는 건 해제 사유가 아니에요.\n용어 풀이:\n· 사방지: 사방사업을 위해 지정한 토지\n· 지정 해제: 지정을 풂", "ref": "사방사업법 제20조"}, {"id": "산림관계법규-93", "subject": "산림관계법규", "num": 93, "part": 4, "stem": "「임업 및 산촌 진흥 촉진에 관한 법률」상 산림청장이 특별관리임산물로 지정하여 생산신고 및 품질검사를 의무화하고 있는 대표적인 청정 임산물은?", "options": ["산양삼", "송이버섯", "밤", "대추"], "answer": 0, "explain": "산양삼(산양산삼)은 부정 불량 유통 방지와 소비자 보호를 위해 임업진흥법상 '특별관리임산물'로 지정되어 재배지 토양 검사, 생산신고, 출하 전 품질검사 합격증 부착이 의무화되어 있습니다.\n쉬운 풀이: 산양삼은 비싸서 가짜·불량품이 많아 '특별관리임산물'로 정했어요. 재배지 토양 검사, 생산신고, 출하 전 품질검사 합격증 부착이 의무예요.\n용어 풀이:\n· 특별관리임산물: 법으로 특별 관리하는 임산물\n· 산양삼: 산에서 키운 삼\n· 품질검사: 품질 기준 충족 여부 검사", "ref": "임업진흥법 제18조의2"}, {"id": "산림관계법규-94", "subject": "산림관계법규", "num": 94, "part": 4, "stem": "「임업 및 산촌 진흥 촉진에 관한 법률」상 전문임업인의 한 종류로서 미래 임업을 선도할 의욕과 능력을 갖추어 산림청장이 선발·육성하는 자는?", "options": ["임업후계자", "산불감시원", "목재유통업자", "숲해설가"], "answer": 0, "explain": "전문임업인은 '임업후계자', '독림가', '신지식임업인'으로 분류되며, 임업후계자는 일정 규모 이상의 산림경영 기반을 갖추고 선발된 청장년 전문인력입니다.\n쉬운 풀이: 전문임업인은 임업후계자, 독림가, 신지식임업인으로 나뉘어요. 그중 미래 임업을 이끌 의욕과 능력을 갖춘 사람으로 선발·육성하는 사람이 임업후계자예요(55세 미만).\n용어 풀이:\n· 전문임업인: 전문적으로 임업을 하는 사람\n· 신지식임업인: 새로운 지식·기술로 임업을 혁신한 사람", "ref": "임업진흥법 제17조"}, {"id": "산림관계법규-95", "subject": "산림관계법규", "num": 95, "part": 4, "stem": "「목재의 지속가능한 이용에 관한 법률」상 원목을 벌채하여 생산·공급하거나 목재를 가공·유통하려는 자가 등록하여야 하는 업종은?", "options": ["목재생산업(원목생산업, 제재업 등)", "산림토목업", "건설업", "농기계임대업"], "answer": 0, "explain": "목재생산업은 제1종 제재업, 제2종 제재업, 제3종 제재업, 제4종 제재업 및 원목생산업으로 구분되며 관할 시·군·구청장에게 등록해야 합니다.\n쉬운 풀이: 원목을 생산하거나 목재를 가공(제재)·유통하려면 '목재생산업'으로 시장·군수·구청장에게 등록해야 해요. 원목생산업과 제1~4종 제재업으로 나뉘어요.\n용어 풀이:\n· 목재생산업: 원목 생산·제재 등을 하는 업종\n· 제재업: 원목을 켜서 판재·각재로 만드는 업\n· 원목: 베어 낸 통나무", "ref": "목재이용법 제24조"}, {"id": "산림관계법규-96", "subject": "산림관계법규", "num": 96, "part": 4, "stem": "「목재의 지속가능한 이용에 관한 법률」상 목재제품의 안전성과 품질 확보를 위해 지정된 품질표시 대상 품목이 **아닌** 것은?", "options": ["방부목재", "합판 및 파티클보드", "목재펠릿", "플라스틱 사출판"], "answer": 3, "explain": "제재목, 방부목재, 난연목재, 집성재, 합판, 파티클보드(PB), 섬유판(MDF), 목재펠릿, 목재칩 등 15대 목재제품이 품질표시 의무 대상 품목입니다.\n쉬운 풀이: 품질표시 대상은 제재목·방부목재·난연목재·집성재·합판·파티클보드·섬유판·목재펠릿·목재칩 등 15가지 목재제품이에요. 플라스틱 사출판은 목재가 아니니 해당하지 않아요.\n용어 풀이:\n· 방부목재: 썩지 않게 약품 처리한 목재\n· 파티클보드: 나무 조각을 접착해 만든 판\n· 섬유판(MDF): 나무 섬유를 압축한 판", "ref": "목재이용법 제20조"}, {"id": "산림관계법규-97", "subject": "산림관계법규", "num": 97, "part": 4, "stem": "「백두대간 보호에 관한 법률」상 백두대간 중 자연환경, 산림생태계 등이 특별히 우수하여 보전이 절대적으로 필요한 구역으로 지정되는 것은?", "options": ["핵심구역", "완충구역", "일반상업구역", "개발유도구역"], "answer": 0, "explain": "백두대간보호지역은 능선을 중심으로 특별한 보전이 필요한 '핵심구역'과 핵심구역의 연접부로서 완충 역할을 하는 '완충구역'으로 구분 지정됩니다.\n쉬운 풀이: 백두대간 보호지역은 능선 중심의 '핵심구역'(특별히 우수해 절대 보전)과 그 바깥에서 완충 역할을 하는 '완충구역'으로 나눠요. 보전이 절대 필요한 곳은 핵심구역이에요.\n용어 풀이:\n· 핵심구역: 가장 엄격히 보전하는 구역\n· 완충구역: 핵심구역을 둘러싼 보호 지대\n· 연접부: 붙어 있는 부분", "ref": "백두대간 보호에 관한 법률 제6조"}, {"id": "산림관계법규-98", "subject": "산림관계법규", "num": 98, "part": 4, "stem": "「탄소흡수원 유지 및 증진에 관한 법률」상 사업자가 자발적으로 온실가스를 감축한 실적을 정부가 인증해 주는 산림탄소상쇄제도의 사업 유형에 해당하지 **않는** 것은?", "options": ["신규조림 및 재조림", "산림경영", "목제품 이용", "대규모 산지 골프장 개발"], "answer": 3, "explain": "· 산림탄소상쇄사업 유형: 식생복구, 신규조림/재조림, 산림경영, 목제품 이용, 산림바이오매스 에너지 이용 등이 있습니다.\n· 골프장 개발은 산림 파괴로 탄소 배출 행위입니다.\n쉬운 풀이: 산림탄소상쇄사업은 숲으로 탄소를 더 흡수하거나 덜 배출하게 하는 사업이에요. 신규조림·재조림, 산림경영, 목제품 이용, 산림바이오매스 에너지 등이 있어요. 골프장 개발은 숲을 없애 탄소를 배출하니 반대예요.\n용어 풀이:\n· 신규조림: 숲이 없던 땅에 새로 조림\n· 재조림: 숲이 사라진 땅에 다시 조림\n· 상쇄: 서로 비겨 없앰", "ref": "탄소흡수원법 제19조"}, {"id": "산림관계법규-99", "subject": "산림관계법규", "num": 99, "part": 4, "stem": "「산림조합법」상 지역산림조합 조합원의 자격 요건으로 옳지 **않은** 것은?", "options": ["조합의 구역 안에 주소 또는 산림이 있는 산주", "조합의 구역 안에 주소 또는 사업장이 있는 임업인", "산림을 소유하지 않고 임업에도 종사하지 않는 타 시·도 일반 도시민", "3ha 이상의 산림을 경영하는 자"], "answer": 2, "explain": "조합원은 구역 내에 주소나 산림을 둔 산주 또는 임업인(일정 면적 이상 임산물 재배, 연간 90일 이상 임업 종사자 등)이어야 하며, 무관한 비임업인은 준조합원(예탁금 거래 등)만 가능합니다.\n쉬운 풀이: 지역산림조합 조합원은 조합 구역 안에 주소나 산림이 있는 산주, 또는 임업인이어야 해요. 산도 없고 임업도 안 하는 다른 지역 도시민은 조합원이 될 수 없고, 준조합원(예금 거래 등)만 가능해요.\n용어 풀이:\n· 조합원: 조합의 정식 구성원\n· 준조합원: 조합 사업 일부만 이용하는 사람\n· 구역: 조합이 담당하는 지역", "ref": "산림조합법 제18조"}, {"id": "산림관계법규-100", "subject": "산림관계법규", "num": 100, "part": 4, "stem": "「산림조합법」상 조합원이 법령, 정관 또는 총회의 의결을 위반하여 조합에 중대한 손해를 끼쳤을 때 총회의 의결을 거쳐 취할 수 있는 가장 무거운 제재는?", "options": ["제명(除名)", "구두 경고", "출자금 무상 몰수", "강제 노역"], "answer": 0, "explain": "· 조합원에 대한 최고 수위의 징계는 '제명'이며, 제명은 조합원 총회의 특별의결(출석조합원 3분의 2 이상의 찬성)을 거쳐야 합니다.\n· 출자금은 정산 환급됩니다.\n쉬운 풀이: 조합원에게 내릴 수 있는 가장 무거운 제재는 조합에서 내보내는 '제명'이에요. 중요한 결정이라 총회에서 출석 조합원 3분의 2 이상이 찬성해야 해요. 출자금은 정산해서 돌려줘요.\n용어 풀이:\n· 제명: 조합원 자격을 박탈해 내보냄\n· 특별의결: 일반보다 엄격한 찬성 기준의 의결\n· 정산: 계산해서 마무리", "ref": "산림조합법 제29조"}, {"id": "산림관계법규-101", "subject": "산림관계법규", "num": 101, "part": 5, "stem": "2026년 신설되어 2026.10.1부터 시행된 산림자원법상 제도로, 밀원식물 중 목본식물 확충을 위해 산림을 지정·육성하는 것은?", "options": ["경제림육성단지", "밀원수 특화단지", "선도산림경영단지", "특수산림사업지구"], "answer": 1, "explain": "· 법 제37조의2(2026.3.31 신설): 산림청장·지자체장이 밀원수 특화단지 지정\n· 밀원수 = 양봉법상 밀원식물 중 목본식물(시행규칙 제48조의2)\n· 지정절차는 시행규칙 제48조의3(신청서·위치도·경영계획인가서·동의서·운영계획서·수익배분계약서)\n쉬운 풀이: 2026년에 새로 생긴 제도예요. 꿀벌이 꿀을 따는 나무(밀원수)를 늘리기 위해 '밀원수 특화단지'를 지정해 육성해요. 꿀벌 감소 문제에 대응하려는 거예요. 2026.10.1 시행이라 출제 가능성이 높아요.\n용어 풀이:\n· 밀원수: 꿀벌이 꿀을 따는 나무(아까시나무 등)\n· 밀원식물: 꿀의 원료가 되는 식물\n· 특화단지: 특정 목적으로 집중 육성하는 단지", "ref": "산림자원의 조성 및 관리에 관한 법률 제37조의2"}, {"id": "산림관계법규-102", "subject": "산림관계법규", "num": 102, "part": 5, "stem": "산림조합법상 여성조합원이 전체 조합원의 몇 % 이상인 지역조합은 이사 중 1명 이상을 여성조합원 중에서 **선출하여야** 하는가?", "options": ["10%", "20%", "30%", "50%"], "answer": 2, "explain": "제35조⑧: 그 밖의 지역조합은 노력 의무, 30% 이상이면 선출 의무\n쉬운 풀이: 여성 조합원 비율이 30% 이상인 지역조합은 이사 중 1명 이상을 반드시 여성 조합원 중에서 뽑아야 해요. 30% 미만이면 노력할 의무만 있어요.\n용어 풀이:\n· 이사: 조합 운영을 결정하는 임원\n· 선출 의무: 반드시 뽑아야 함\n· 노력 의무: 노력해야 함(강제는 아님)", "ref": "산림조합법 제35조"}, {"id": "산림관계법규-103", "subject": "산림관계법규", "num": 103, "part": 5, "stem": "조합 총회에서 '조합원 과반수 출석 + 출석조합원 3분의 2 이상 찬성'이 필요한 사항이 **아닌** 것은?", "options": ["정관의 변경", "해산 또는 분할", "조합원의 제명", "합병"], "answer": 3, "explain": "· 제31조④: 제5항 1호(정관변경)·2호(해산·분할)·4호(제명)만 특별의결\n· 합병(3호)은 일반의결 대상\n쉬운 풀이: 특별의결(과반수 출석 + 2/3 찬성)이 필요한 건 정관변경, 해산·분할, 조합원 제명이에요. 합병은 이 목록에 없어서 일반의결 대상이에요. '정·해·분·제'만 특별의결로 외우세요.\n용어 풀이:\n· 특별의결: 3분의 2 이상 찬성이 필요한 의결\n· 합병: 두 조합을 합침\n· 분할: 하나를 둘로 나눔", "ref": "산림조합법 제31조"}, {"id": "산림관계법규-104", "subject": "산림관계법규", "num": 104, "part": 5, "stem": "산림조합법상 조합원이 될 수 있는 산림소유자의 최소 산림면적을 정관으로 정할 수 있는 범위는?", "options": ["100~500㎡", "300~1,000㎡", "1,000~3,000㎡", "1ha 이상"], "answer": 1, "explain": "· 제18조③: 300㎡~1,000㎡ 범위에서 정관으로 정함\n· 둘 이상의 지역조합 조합원이 될 수 없음\n쉬운 풀이: 조합원이 될 수 있는 산림소유자의 최소 면적은 300㎡~1,000㎡ 범위에서 각 조합 정관으로 정해요. 그리고 한 사람이 두 지역조합의 조합원이 될 수는 없어요.\n용어 풀이:\n· 정관: 조합의 기본 규칙\n· 최소 면적: 가장 작게 허용되는 면적", "ref": "산림조합법 제18조"}, {"id": "산림관계법규-105", "subject": "산림관계법규", "num": 105, "part": 5, "stem": "조합 설립인가 신청을 받은 시·도지사가 인가 여부를 통지해야 하는 기간은?", "options": ["30일 이내", "45일 이내", "60일 이내", "90일 이내"], "answer": 2, "explain": "· 제14조⑤: 60일 이내 통지\n· 기간 내 통지(또는 연장 통지)가 없으면 끝난 날의 다음 날 인가 간주\n· 설립: 30인 이상 발기인 → 창립총회 → 시·도지사 인가\n쉬운 풀이: 조합 설립인가 신청을 받은 시·도지사는 60일 안에 인가 여부를 알려야 해요. 기간 안에 아무 통지가 없으면 인가한 것으로 봐요(인가 간주).\n용어 풀이:\n· 설립인가: 조합 설립을 승인함\n· 인가 간주: 인가한 것으로 봄\n· 통지: 알림", "ref": "산림조합법 제14조"}, {"id": "산림관계법규-106", "subject": "산림관계법규", "num": 106, "part": 5, "stem": "산림자원법 시행령상 다른 사람의 산림사업을 대행할 수 있는 '산림경영능력이 있다고 인정되는 자'는?", "options": ["10ha 이상 산림을 소유한 개인", "50ha 이상의 산림을 소유하고 경영하는 법인 또는 단체", "산림경영기술자 초급", "임업후계자 누구나"], "answer": 1, "explain": "시행령 제22조: ① 50ha 이상 산림을 소유·경영하는 법인·단체 ② 기술중급 이상 산림경영기술자\n쉬운 풀이: 남의 산림사업을 대신할 수 있는 '산림경영능력 있는 자'는 50ha 이상 산림을 소유·경영하는 법인·단체, 또는 기술중급 이상 산림경영기술자예요. 초급 기술자나 10ha 개인은 해당하지 않아요.\n용어 풀이:\n· 대행: 대신 수행\n· 산림경영기술자 기술중급: 산림경영기술자의 중간 등급\n· 단체: 여러 사람이 모인 조직", "ref": "산림자원의 조성 및 관리에 관한 법률 시행령 제22조"}, {"id": "산림관계법규-107", "subject": "산림관계법규", "num": 107, "part": 5, "stem": "산림자원법상 친환경 벌채에 대한 지원 내용으로 옳은 것은?", "options": ["벌채면적 전부의 조림비를 지원한다.", "허가를 받고 생태·경관·재해위험을 최소화하여 벌채한 경우 남겨진 입목의 예상 판매수익 일부를 예산 범위에서 지원할 수 있다.", "친환경 벌채한 목재는 전량 국가가 매입한다.", "친환경 벌채지는 재산세를 면제한다."], "answer": 1, "explain": "· 법 제36조④: 벌채구역 내 남겨진 입목의 판매를 전제로 한 예상 수익금 일부 지원\n· 신청서는 시행규칙 제45조의3\n쉬운 풀이: 친환경 벌채는 숲을 다 베지 않고 일부를 남겨 생태·경관·재해 위험을 줄이는 벌채예요. 남긴 나무만큼 산주가 손해를 보니, 그 나무를 팔았다면 얻었을 예상 수익의 일부를 예산 범위에서 지원해요.\n용어 풀이:\n· 친환경 벌채: 생태·경관을 고려한 벌채\n· 남겨진 입목: 베지 않고 남긴 나무\n· 예상 판매수익: 팔았을 때 기대되는 수익", "ref": "산림자원의 조성 및 관리에 관한 법률 제36조"}, {"id": "산림관계법규-108", "subject": "산림관계법규", "num": 108, "part": 5, "stem": "조합 설립을 위한 창립총회의 의결 방법은?", "options": ["발기인 전원의 찬성", "개의 전까지 발기인에게 설립동의서를 제출한 자 과반수의 찬성", "조합원 자격자 3분의 2 이상의 찬성", "시·도지사가 정하는 정족수"], "answer": 1, "explain": "· 제14조②: 개의 전까지 설립동의서를 제출한 자 과반수 찬성\n· 발기인 중 인가신청을 거부하는 자가 있으면 나머지 발기인이 사유서 첨부해 신청(③)\n쉬운 풀이: 조합을 만드는 첫 총회(창립총회)에서는 회의 시작 전까지 설립동의서를 낸 사람 중 과반수가 찬성해야 의결돼요.\n용어 풀이:\n· 창립총회: 설립을 위한 첫 총회\n· 설립동의서: 설립에 찬성한다는 문서\n· 개의: 회의를 시작함", "ref": "산림조합법 제14조"}, {"id": "산림관계법규-109", "subject": "산림관계법규", "num": 109, "part": 5, "stem": "조합원이 조합장에게 총회 소집을 청구할 수 있는 요건은?", "options": ["조합원 100인 또는 5% 이상 동의", "조합원 300인 또는 10% 이상 동의", "조합원 500인 또는 20% 이상 동의", "대의원 과반수 동의"], "answer": 1, "explain": "제31조의3: 300인 또는 10% 이상 → 조합장 2주 내 소집 → 안 하면 감사 5일 내 → 그래도 안 하면 청구 조합원 대표\n쉬운 풀이: 조합원 300인 또는 10% 이상이 동의하면 조합장에게 총회를 열라고 요구할 수 있어요. 조합장이 2주 안에 안 열면 감사가 5일 안에, 그래도 안 되면 청구한 조합원 대표가 열어요. '300인/10% → 2주 → 5일'.\n용어 풀이:\n· 총회 소집 청구: 총회를 열라고 요구함\n· 감사: 조합 업무를 감시하는 임원\n· 대의원: 조합원 대표", "ref": "산림조합법 제31조의3"}, {"id": "산림관계법규-110", "subject": "산림관계법규", "num": 110, "part": 5, "stem": "조합의 상임이사·조합원이 아닌 이사의 임기는?", "options": ["1년", "2년", "3년", "4년"], "answer": 1, "explain": "· 제38조: 조합장·조합원 이사 4년\n· 상임이사·비조합원 이사 2년\n· 감사 3년\n· 조합장 두 번까지 연임\n· 설립 당시 임원은 2년 초과 불가\n쉬운 풀이: 조합 임원 임기 정리: 조합장·조합원 이사 4년, 감사 3년, 상임이사와 조합원이 아닌 이사는 2년이에요. 전문 경영인인 상임이사는 성과를 자주 평가하려고 임기가 짧아요.\n용어 풀이:\n· 상임이사: 상근하며 경영을 맡는 이사\n· 비조합원 이사: 조합원이 아닌 외부 이사\n· 연임: 다시 맡음", "ref": "산림조합법 제38조"}]}, {"code": "05", "name": "산림토목", "kind": "선택", "questions": [{"id": "산림토목-1", "subject": "산림토목", "num": 1, "part": 1, "stem": "헤어핀 커브라고도 부르는 곡선은?", "options": ["단곡선", "배향곡선", "반향곡선", "복심곡선"], "answer": 1, "explain": "배향곡선 = 헤어핀 커브\n쉬운 풀이: 배향곡선은 산을 지그재그로 올라갈 때 머리핀처럼 거의 U자로 꺾어 도는 곡선이에요. 그래서 '헤어핀 커브'라고 불러요. '배(背)'는 등을 돌린다는 뜻이라 방향이 거꾸로 돌아간다고 기억하세요.\n용어 풀이:\n· 배향곡선: 헤어핀처럼 크게 꺾여 되돌아가는 곡선\n· 단곡선: 하나의 원호로 된 곡선\n· 곡선반지름: 곡선을 이루는 원의 반지름", "ref": "임도 모듈 p.6"}, {"id": "산림토목-2", "subject": "산림토목", "num": 2, "part": 1, "stem": "학습모듈 정의상 반지름이 작은 원호의 직전이나 직후에 반대 방향 곡선이 이어진 형태로, S-커브라고도 하며 종단기울기를 완화하려고 쓰는 곡선은?", "options": ["단곡선", "배향곡선", "반향곡선", "완화곡선"], "answer": 2, "explain": "모듈 정의: 반향곡선 = S-커브, 종단기울기 완화 목적 (2021·2023 용어 정리)\n쉬운 풀이: 반향곡선은 오른쪽으로 꺾었다가 곧바로 왼쪽으로 꺾는 S자 곡선이에요. '반(反)대 방향(向)'이 이어지는 곡선이죠. 학습모듈에서는 길을 돌아가게 해서 오르막(종단기울기)을 완만하게 하려고 쓴다고 정의해요.\n용어 풀이:\n· 반향곡선: 반대 방향 곡선이 이어진 S-커브\n· 종단기울기: 길 진행 방향의 오르막·내리막 정도\n· 완화: 누그러뜨림", "ref": "임도 모듈 p.6"}, {"id": "산림토목-3", "subject": "산림토목", "num": 3, "part": 1, "stem": "임도 종단기울기가 몇 % 이상이면 콘크리트 포장을 원칙으로 하는가?", "options": ["6%", "8%", "10%", "12%"], "answer": 1, "explain": "8% 이상 콘크리트 포장, 폭 3.0m·두께 0.2m\n쉬운 풀이: 임도 경사가 8% 이상이면 비 올 때 흙길이 쉽게 파이고 차가 미끄러져요. 그래서 콘크리트로 포장하는 게 원칙이고, 포장 폭은 3.0m, 두께는 0.2m예요. '8% 넘으면 콘크리트'.\n용어 풀이:\n· 종단기울기(%): 100m 갈 때 몇 m 오르는지\n· 콘크리트 포장: 시멘트로 길을 덮음", "ref": "임도 모듈 p.27–33"}, {"id": "산림토목-4", "subject": "산림토목", "num": 4, "part": 1, "stem": "설계속도 40km/h인 임도의 일반지형 최대 종단기울기는?", "options": ["7%", "8%", "9%", "10%"], "answer": 0, "explain": "40km/h 7%(특수 10%), 30km/h 8%(12%), 20km/h 9%(14%)\n쉬운 풀이: 설계속도가 빠를수록 차가 안전하게 달리려면 길이 완만해야 해요. 그래서 최대 종단기울기는 40km/h면 7%, 30km/h면 8%, 20km/h면 9%예요(특수지형은 10·12·14%). 속도가 10 줄 때 1%씩 늘어난다고 외우세요.\n용어 풀이:\n· 설계속도: 길을 설계할 때 기준으로 삼는 차량 속도\n· 일반지형: 보통의 지형\n· 특수지형: 험한 지형", "ref": "시행규칙 별표2 (2차 출처)"}, {"id": "산림토목-5", "subject": "산림토목", "num": 5, "part": 1, "stem": "간선임도의 유효너비 기준은? (배향곡선지 제외)", "options": ["2.5m", "2.8m", "3.0m", "3.5m"], "answer": 2, "explain": "· 유효너비 3m, 배향곡선지 6m 이상\n· 산불진화임도 3.5m\n쉬운 풀이: 간선임도의 유효너비(차가 실제 다닐 수 있는 폭)는 3m예요. 헤어핀 같은 배향곡선 구간은 차가 돌기 어려워 6m 이상으로 넓히고, 산불진화임도는 소방차가 비켜 갈 수 있게 3.5m예요.\n용어 풀이:\n· 유효너비: 실제 통행에 쓰는 폭\n· 간선임도: 주요 임도\n· 길어깨: 차도 양옆의 여유 공간", "ref": "별표2"}, {"id": "산림토목-6", "subject": "산림토목", "num": 6, "part": 1, "stem": "미포장 임도의 횡단기울기는?", "options": ["1~2%", "1.5~2%", "2~3%", "3~5%"], "answer": 3, "explain": "미포장 3~5%, 포장 1.5~2%\n쉬운 풀이: 길 가운데를 살짝 높여 양옆으로 물이 빠지게 만든 기울기가 횡단기울기예요. 흙길(미포장)은 물이 잘 안 흘러서 3~5%로 크게, 포장길은 물이 잘 흐르니 1.5~2%로 작게 해요.\n용어 풀이:\n· 횡단기울기: 길을 가로지르는 방향의 기울기\n· 미포장: 포장하지 않은 흙길\n· 배수: 물을 빼냄", "ref": "별표2"}, {"id": "산림토목-7", "subject": "산림토목", "num": 7, "part": 1, "stem": "임도 대피소의 설치 간격은?", "options": ["200m 이내", "300m 이내", "500m 이내", "1,000m 이내"], "answer": 1, "explain": "약 300m 간격, 너비 5m, 유효길이 15m (산불진화임도는 200m)\n쉬운 풀이: 임도는 차 한 대 폭이라 마주 오는 차가 비켜 갈 곳이 필요해요. 그래서 약 300m마다 너비 5m, 길이 15m의 대피소를 만들어요. 산불진화임도는 더 자주(200m) 만들어요.\n용어 풀이:\n· 대피소: 차가 비켜 서는 넓은 공간\n· 유효길이: 실제 쓸 수 있는 길이\n· 교행: 서로 비켜 지나감", "ref": "별표2"}, {"id": "산림토목-8", "subject": "산림토목", "num": 8, "part": 1, "stem": "임도 횡단 배수구의 원칙적인 최소 지름은?", "options": ["300mm", "500mm", "800mm", "1,000mm"], "answer": 3, "explain": "1,000mm 이상, 부득이하면 800mm\n쉬운 풀이: 임도 밑으로 물을 빼는 관(횡단 배수구)이 너무 작으면 흙·나뭇가지로 막혀 길이 무너져요. 그래서 지름 1,000mm(1m) 이상이 원칙이고, 어쩔 수 없을 때만 800mm까지 허용해요.\n용어 풀이:\n· 횡단 배수구: 길 아래를 가로지르는 배수관\n· mm: 밀리미터(1,000mm = 1m)", "ref": "별표2"}, {"id": "산림토목-9", "subject": "산림토목", "num": 9, "part": 1, "stem": "물넘이포장(세월교)을 설치하는 계곡부의 종단기울기는?", "options": ["3~5%", "6~8%", "8~10%", "10% 이상"], "answer": 0, "explain": "계곡부 종단 3~5%일 때 물넘이포장\n쉬운 풀이: 작은 계곡을 건널 때 다리 대신 길을 낮게 콘크리트로 포장해 물이 그 위로 넘어 흐르게 한 게 물넘이포장(세월교)이에요. 계곡부 기울기가 3~5%처럼 완만할 때 적합해요.\n용어 풀이:\n· 물넘이포장: 물이 노면 위로 넘어 흐르게 한 포장\n· 세월교: 물에 잠겨도 되는 낮은 다리\n· 계곡부: 골짜기 부분", "ref": "임도 모듈 p.27–33"}, {"id": "산림토목-10", "subject": "산림토목", "num": 10, "part": 1, "stem": "능선부 임도의 종단기울기 기준과 시공 방법으로 옳은 것은?", "options": ["2% 이내, 성토 위주", "3% 이내, 성토·절토 균형", "4% 이내, 성토 없이 절토", "8% 이내, 콘크리트 포장"], "answer": 2, "explain": "능선부 4% 이내, 성토 없이 절토\n쉬운 풀이: 능선(산등성이)을 따라 내는 임도는 경사를 4% 이내로 완만하게 하고, 흙을 쌓지(성토) 않고 깎아서(절토)만 만들어요. 능선에 흙을 쌓으면 비탈로 무너져 내리기 쉽기 때문이에요.\n용어 풀이:\n· 능선: 산등성이\n· 성토: 흙을 쌓음\n· 절토: 흙을 깎아 냄", "ref": "임도 모듈 p.27–33"}, {"id": "산림토목-11", "subject": "산림토목", "num": 11, "part": 1, "stem": "우리나라 근대 사방사업의 효시는?", "options": ["1910년 남산 사방", "1907년 창의문 주변 식목", "1922년 영일지구 사방", "1961년 산림법 제정"], "answer": 1, "explain": "1907년 창의문 주변 식목\n쉬운 풀이: 우리나라 근대 사방사업은 1907년 서울 창의문 주변에 나무를 심은 것에서 시작됐어요. '효시'는 처음 시작이라는 뜻이에요.\n용어 풀이:\n· 사방사업: 산사태·토사 유출을 막는 사업\n· 효시: 어떤 일의 맨 처음\n· 창의문: 서울 북악산 쪽 성문", "ref": "사방 모듈 p.4–5"}, {"id": "산림토목-12", "subject": "산림토목", "num": 12, "part": 1, "stem": "비탈다듬기의 시공 순서로 옳은 것은?", "options": ["위에서 아래로 시공한다", "아래에서 위로 시공한다", "가운데에서 양쪽으로 시공한다", "순서와 관계없이 동시에 시공한다"], "answer": 0, "explain": "위에서 아래로. 부토 3m 이상이면 속도랑·땅속흙막이 먼저\n쉬운 풀이: 비탈다듬기는 무너진 비탈을 깎아 고르는 작업이에요. 위에서 아래로 해야 깎은 흙이 아래로 내려가며 정리되고, 아래를 먼저 깎으면 위가 무너질 수 있어요. 흙이 3m 이상 쌓여 있으면 속도랑·땅속흙막이를 먼저 설치해요.\n용어 풀이:\n· 비탈다듬기: 비탈면을 깎아 고르게 만드는 작업\n· 부토: 무너져 쌓인 흙\n· 속도랑: 땅속에 묻은 배수로", "ref": "사방 모듈 p.32–80"}, {"id": "산림토목-13", "subject": "산림토목", "num": 13, "part": 1, "stem": "땅속흙막이는 높이의 얼마 이상을 땅속에 묻는가?", "options": ["1/4", "1/3", "1/2", "2/3"], "answer": 3, "explain": "높이의 2/3 이상 매설, 돌쌓기 1:0.3\n쉬운 풀이: 땅속흙막이는 비탈 흙이 미끄러져 내려가지 않도록 땅속에 묻는 옹벽 같은 구조물이에요. 단단히 버티도록 높이의 2/3 이상을 땅속에 묻고, 돌쌓기 기울기는 1:0.3으로 해요.\n용어 풀이:\n· 땅속흙막이: 땅속에 묻어 흙을 받치는 구조물\n· 매설: 땅에 묻음\n· 1:0.3: 높이 1에 수평 0.3 기울기", "ref": "사방 모듈 p.32–80"}, {"id": "산림토목-14", "subject": "산림토목", "num": 14, "part": 1, "stem": "중력식 사방댐의 안정조건이 **아닌** 것은?", "options": ["전도에 대한 안정", "활동에 대한 안정", "월류에 대한 안정", "기초지반 지지력에 대한 안정"], "answer": 2, "explain": "4조건 = 전도·활동·제체 파괴·기초지반 지지력\n쉬운 풀이: 중력식 사방댐은 자기 무게로 흙과 물을 버텨요. 안전하려면 4가지를 견뎌야 해요: 넘어지지 않기(전도), 미끄러지지 않기(활동), 몸체가 부서지지 않기(제체 파괴), 바닥이 꺼지지 않기(기초지반 지지력). '월류'는 안정조건이 아니에요.\n용어 풀이:\n· 전도: 넘어짐\n· 활동: 미끄러짐\n· 제체: 댐 몸체\n· 월류: 물이 댐 위로 넘쳐흐름", "ref": "사방 모듈 p.143–146"}, {"id": "산림토목-15", "subject": "산림토목", "num": 15, "part": 1, "stem": "사방댐이 전도에 안정하려면 합력작용선이 어디를 지나야 하는가?", "options": ["제저 상류 끝", "제저 중앙 1/3 이내", "제저 하류 끝", "제저 중앙 1/2 밖"], "answer": 1, "explain": "합력선이 제저 중앙 1/3 이내 통과\n쉬운 풀이: 댐이 넘어지지 않으려면 모든 힘을 합친 방향선(합력선)이 댐 바닥(제저)의 가운데 1/3 안을 지나야 해요. 바깥으로 벗어나면 한쪽이 들리며 넘어갈 수 있어요. '중앙 1/3'.\n용어 풀이:\n· 합력작용선: 여러 힘을 합친 힘이 지나가는 선\n· 제저: 댐의 바닥면", "ref": "사방 모듈 p.143–146"}, {"id": "산림토목-16", "subject": "산림토목", "num": 16, "part": 1, "stem": "사방댐 방수로 단면은 최대홍수유량의 몇 %로 설계하는가?", "options": ["50~100%", "100~150%", "150~200%", "200~500%"], "answer": 3, "explain": "방수로 = 역사다리꼴, 옆 기울기 1:1, 최대홍수유량의 200~500%\n쉬운 풀이: 방수로는 사방댐 꼭대기의 물이 넘어가는 통로예요. 예상보다 큰 홍수에도 넘치지 않게 최대홍수유량의 200~500%를 흘릴 수 있도록 넉넉히 만들어요. 모양은 역사다리꼴, 옆 기울기 1:1이에요.\n용어 풀이:\n· 방수로: 댐 위로 물이 넘어가는 통로\n· 최대홍수유량: 가장 큰 홍수 때 흐르는 물의 양\n· 역사다리꼴: 위가 넓고 아래가 좁은 사다리꼴", "ref": "사방 모듈 p.143–146"}, {"id": "산림토목-17", "subject": "산림토목", "num": 17, "part": 1, "stem": "사방댐에 신축줄눈을 두는 댐 길이 기준은?", "options": ["25m 초과", "30m 초과", "40m 초과", "50m 초과"], "answer": 0, "explain": "댐 길이 25m 초과 시 신축줄눈\n쉬운 풀이: 콘크리트는 온도에 따라 늘었다 줄었다 해서 긴 댐은 금이 가요. 그래서 댐 길이가 25m를 넘으면 일정 간격으로 틈(신축줄눈)을 만들어 갈라짐을 막아요.\n용어 풀이:\n· 신축줄눈: 늘어나고 줄어드는 것을 흡수하는 이음매\n· 균열: 금이 감", "ref": "사방 모듈 p.143–146"}, {"id": "산림토목-18", "subject": "산림토목", "num": 18, "part": 1, "stem": "앞댐과 본댐의 중복높이는 본댐 높이의 얼마인가?", "options": ["1/2 ~ 1/3", "2/3 ~ 1/2", "1/3 ~ 1/4", "1/5 ~ 1/6"], "answer": 2, "explain": "중복높이 1/3~1/4, 간격 L ≥ (1.5~2.0)(H + t)\n쉬운 풀이: 본댐 아래쪽에 작은 앞댐(물받이댐)을 만들어, 본댐에서 떨어지는 물이 바닥을 깊게 파지 않게 해요. 두 댐이 겹치는 높이는 본댐 높이의 1/3~1/4이에요.\n용어 풀이:\n· 앞댐: 본댐 하류에 만든 작은 댐\n· 중복높이: 두 댐이 겹치는 높이\n· 세굴: 물살에 바닥이 파임", "ref": "사방 모듈 p.143–146"}, {"id": "산림토목-19", "subject": "산림토목", "num": 19, "part": 1, "stem": "합리식으로 최대홍수유량을 구하면? (유출계수 0.8, 강우강도 90mm/h, 유역면적 50ha, Q = C·I·A/360)", "options": ["5㎥/s", "10㎥/s", "18㎥/s", "36㎥/s"], "answer": 1, "explain": "Q = 0.8 × 90 × 50 / 360 = 10㎥/s\n쉬운 풀이: 합리식은 비가 올 때 최대 홍수량을 계산하는 공식이에요. Q = C × I × A ÷ 360 = 0.8 × 90 × 50 ÷ 360 = 3,600 ÷ 360 = 10㎥/s. C는 땅에 스며들지 않고 흘러가는 비율, I는 비의 세기, A는 물이 모이는 면적(ha)이에요.\n용어 풀이:\n· 합리식: 최대홍수유량 계산 공식\n· 유출계수(C): 빗물 중 흘러가는 비율\n· 강우강도(I): 시간당 비의 양(mm/h)\n· 유역면적(A): 빗물이 모이는 면적", "ref": "사방 모듈 p.203–220"}, {"id": "산림토목-20", "subject": "산림토목", "num": 20, "part": 1, "stem": "Manning 공식으로 평균유속을 구하면? (조도계수 n = 0.02, 경심 R = 1m, 수로기울기 S = 0.01)", "options": ["2.5m/s", "5m/s", "10m/s", "20m/s"], "answer": 1, "explain": "V = (1/0.02) × 1^(2/3) × 0.01^(1/2) = 50 × 1 × 0.1 = 5m/s\n쉬운 풀이: Manning 공식은 수로의 물 흐르는 속도를 구해요. V = (1/n) × R^(2/3) × S^(1/2) = (1/0.02) × 1 × √0.01 = 50 × 1 × 0.1 = 5m/s. 바닥이 거칠수록(n 큼) 느리고, 경사가 클수록(S 큼) 빨라요.\n용어 풀이:\n· Manning 공식: 수로 평균유속 공식\n· 조도계수(n): 바닥 거칠기\n· 경심(R): 단면적 ÷ 젖은 둘레\n· 수로기울기(S): 수로 경사", "ref": "사방 모듈 p.203–220"}, {"id": "산림토목-21", "subject": "산림토목", "num": 21, "part": 2, "stem": "사유임도의 정의로 옳은 것은?", "options": ["지방자치단체가 설치·관리하는 임도", "산림소유자 또는 산림을 경영하는 자(국유림 분수림 설정자 포함)가 자기 부담으로 설치하는 임도", "산림조합이 국고로 설치하는 임도", "국가가 설치하고 사유림 소유자가 관리하는 임도"], "answer": 1, "explain": "국유임도 = 국가, 공유임도 = 지자체, 사유임도 = 산주·경영자 자기 부담\n쉬운 풀이: 임도는 누가 돈을 내 만드느냐에 따라 나눠요. 국가가 만들면 국유임도, 지자체는 공유임도, 산주나 산림 경영자(국유림 분수림 설정자 포함)가 자기 돈으로 만들면 사유임도예요.\n용어 풀이:\n· 사유임도: 개인이 자기 부담으로 낸 임도\n· 분수림: 국유림에서 수익을 나누기로 하고 조림한 숲\n· 공유임도: 지자체 임도", "ref": "임도 모듈 p.5"}, {"id": "산림토목-22", "subject": "산림토목", "num": 22, "part": 2, "stem": "임도에서 가장 많이 쓰는 곡선으로, 하나의 원호로 이루어져 곡률이 일정한 것은?", "options": ["단곡선", "복심곡선", "반향곡선", "배향곡선"], "answer": 0, "explain": "단곡선은 설치가 쉬워 임도에서 가장 많이 사용\n쉬운 풀이: 단곡선은 하나의 원으로 된 가장 기본적인 곡선이라 휘는 정도가 일정하고 설치가 쉬워요. 그래서 임도에서 가장 많이 써요.\n용어 풀이:\n· 단곡선: 하나의 원호로 된 곡선\n· 곡률: 휘어진 정도", "ref": "p.6"}, {"id": "산림토목-23", "subject": "산림토목", "num": 23, "part": 2, "stem": "곡선반지름이 다른 두 단곡선이 같은 방향으로 이어진 곡선은?", "options": ["단곡선", "복심곡선", "반향곡선", "완화곡선"], "answer": 1, "explain": "복심곡선 = 같은 방향, 반향곡선 = 반대 방향(S-커브)\n쉬운 풀이: 복심곡선은 같은 방향으로 휘면서 반지름이 다른 두 곡선이 이어진 것이에요. 반대 방향으로 이어지면 반향곡선(S-커브)이에요. '복심=같은 방향, 반향=반대 방향'.\n용어 풀이:\n· 복심곡선: 같은 방향, 다른 반지름의 곡선 연결\n· 반향곡선: 반대 방향 곡선 연결", "ref": "p.6"}, {"id": "산림토목-24", "subject": "산림토목", "num": 24, "part": 2, "stem": "완화곡선을 설치하는 목적은?", "options": ["종단기울기를 줄이기 위해", "배수를 원활하게 하기 위해", "공사비를 줄이기 위해", "직선부에서 곡선부로 넘어갈 때 외쪽물매와 나비넓힘이 원활하게 이어지도록"], "answer": 3, "explain": "완화구간에서 외쪽물매·나비넓힘을 원활하게\n쉬운 풀이: 직선 길에서 곡선으로 갑자기 바뀌면 차가 휘청여요. 그래서 그 사이에 점점 휘는 완화곡선을 넣어, 바깥쪽을 높이는 외쪽물매와 길 폭 넓힘(나비넓힘)이 자연스럽게 이어지게 해요.\n용어 풀이:\n· 완화곡선: 직선과 곡선을 부드럽게 잇는 곡선\n· 외쪽물매: 곡선 바깥쪽을 높인 경사\n· 나비넓힘: 곡선부에서 길 폭을 넓힘", "ref": "p.7"}, {"id": "산림토목-25", "subject": "산림토목", "num": 25, "part": 2, "stem": "노상(路床)의 정의로 옳은 것은?", "options": ["차도 양쪽의 길어깨", "노면을 비스듬히 가로지르는 배수시설", "포장층 아래 두께 약 100cm의 거의 균일한 토층", "흙쌓기 비탈면의 작은 계단"], "answer": 2, "explain": "노상은 교통하중 지지·보조기층 지지력 확보\n쉬운 풀이: 노상은 포장층 바로 아래 약 100cm 두께의 흙층으로, 차 무게를 받쳐 주는 길의 '기초 땅'이에요. 집의 기초처럼 튼튼해야 길이 꺼지지 않아요.\n용어 풀이:\n· 노상: 포장 아래의 기초 흙층\n· 보조기층: 포장과 노상 사이의 층\n· 교통하중: 차량이 누르는 무게", "ref": "p.7"}, {"id": "산림토목-26", "subject": "산림토목", "num": 26, "part": 2, "stem": "임도 노면 아래를 가로질러 흙쌓기 비탈면 아래로 물을 빼는 배수시설은?", "options": ["겉도랑(개거)", "속도랑(암거, 컬버트)", "옆도랑(측구)", "도수로"], "answer": 1, "explain": "· 속도랑 = 암거·컬버트\n· 겉도랑 = 개거(노면 비스듬히 횡단)\n쉬운 풀이: 임도 밑을 가로질러 묻은 관으로 물을 흙쌓기 비탈 아래로 빼는 시설이 속도랑(암거, 컬버트)이에요. 노면 위를 비스듬히 가로지르는 열린 도랑은 겉도랑(개거), 길 옆 도랑은 옆도랑(측구)이에요.\n용어 풀이:\n· 속도랑(암거): 땅속에 묻은 배수로\n· 컬버트: 도로 밑 배수관\n· 개거: 위가 열린 도랑\n· 측구: 길 옆 도랑", "ref": "p.7"}, {"id": "산림토목-27", "subject": "산림토목", "num": 27, "part": 2, "stem": "소계류를 통과하는 구간에서 홍수 때 물이 노면을 가로질러 흐르도록 노면 콘크리트를 호형으로 포장한 시설은?", "options": ["물넘이포장", "세월시설", "옆도랑", "소단"], "answer": 0, "explain": "세월시설은 노면 아래 관거를 함께 설치한 것\n쉬운 풀이: 작은 계곡을 지나는 곳에서 홍수 때 물이 길 위로 넘어 흐르도록, 노면을 둥글게(호형) 콘크리트로 포장한 것이 물넘이포장이에요. 길 아래에 관을 함께 묻은 건 세월시설이라고 해요.\n용어 풀이:\n· 물넘이포장: 물이 노면을 넘어 흐르게 만든 포장\n· 호형: 활처럼 둥근 모양\n· 소계류: 작은 계곡물", "ref": "p.8"}, {"id": "산림토목-28", "subject": "산림토목", "num": 28, "part": 2, "stem": "소단(小段)을 설치하는 목적은?", "options": ["차량 대피", "노면 배수", "차돌림", "긴 비탈면의 안정성을 높이고 비탈면을 따라 흐르는 물의 침식을 막기 위해"], "answer": 3, "explain": "비탈면 안정성 증진 + 유수 침식 방지\n쉬운 풀이: 긴 비탈면 중간에 만든 좁은 계단 같은 평평한 턱이 소단이에요. 비탈을 안정시키고, 위에서 흘러내리는 물의 속도를 끊어 비탈이 깎이지 않게 해요.\n용어 풀이:\n· 소단: 긴 비탈 중간의 작은 평탄면\n· 비탈면: 경사진 면\n· 침식: 물·바람에 깎임", "ref": "p.7"}, {"id": "산림토목-29", "subject": "산림토목", "num": 29, "part": 2, "stem": "전국임도기본계획의 수립 주체와 주기는?", "options": ["산림청장, 10년 단위", "시·도지사, 5년 단위", "시장·군수, 10년 단위", "산림청장, 5년 단위"], "answer": 0, "explain": "산림청장 10년, 임도 설치계획은 시·도지사·지방산림청장 5년\n쉬운 풀이: 임도 계획은 두 단계예요. 전국의 큰 계획인 전국임도기본계획은 산림청장이 10년 단위로, 실제 설치계획은 시·도지사·지방산림청장이 5년 단위로 세워요. 법규 과목에도 나오는 숫자예요.\n용어 풀이:\n· 전국임도기본계획: 전국 임도 장기계획\n· 임도 설치계획: 실제 설치를 위한 계획", "ref": "p.8"}, {"id": "산림토목-30", "subject": "산림토목", "num": 30, "part": 2, "stem": "임도 타당성평가의 평가기준이 **아닌** 것은?", "options": ["필요성", "적합성", "환경성", "경제성"], "answer": 3, "explain": "타당성평가 기준: 필요성·적합성·환경성\n쉬운 풀이: 임도를 새로 낼지 판단하는 타당성평가 기준은 필요성(꼭 필요한가), 적합성(지형 등이 맞는가), 환경성(환경 피해는 없나) 세 가지예요. 경제성은 기준에 없어요.\n용어 풀이:\n· 타당성평가: 사업이 적절한지 평가\n· 필요성·적합성·환경성: 임도 타당성평가 3기준", "ref": "p.10"}, {"id": "산림토목-31", "subject": "산림토목", "num": 31, "part": 2, "stem": "학습모듈에서 산불진화임도의 노폭을 3.5m 이상으로 하는 이유는?", "options": ["대형 트럭 통행을 위해", "산불진화 차량 등이 교행할 수 있도록", "배수로를 넓히기 위해", "등산객 통행을 위해"], "answer": 1, "explain": "산불진화 차량 등 교행 가능하도록 3.5m 이상\n쉬운 풀이: 산불을 끄려면 소방차·진화차가 들어가고 나와야 해요. 차 두 대가 서로 비켜 갈 수 있도록(교행) 산불진화임도 노폭을 3.5m 이상으로 넓게 만들어요.\n용어 풀이:\n· 노폭: 길의 폭\n· 교행: 마주 오는 차가 비켜 지나감\n· 산불진화임도: 산불 진화용 임도", "ref": "p.11"}, {"id": "산림토목-32", "subject": "산림토목", "num": 32, "part": 2, "stem": "작업임도에 대한 설명으로 옳은 것은?", "options": ["주로 임업 기계나 2.5t 정도 소형 트럭이 다니는 저규격 도로", "도로와 도로를 연결하는 영구적 공공시설", "불특정 다수가 이용하는 간선 도로", "노폭 6m 이상의 고규격 도로"], "answer": 0, "explain": "간선임도는 영구적 공공시설, 작업임도는 저규격·특정인 지속 이용\n쉬운 풀이: 작업임도는 산림 작업을 위해 간선임도에서 갈라져 들어가는 길로, 임업 기계나 2.5t 정도 소형 트럭이 다니는 낮은 규격의 길이에요. 영구적 공공시설인 간선임도와 구분돼요.\n용어 풀이:\n· 작업임도: 산림작업용 저규격 임도\n· 저규격: 기준이 낮은(좁고 간단한)\n· 간선임도: 주요 임도", "ref": "p.11"}, {"id": "산림토목-33", "subject": "산림토목", "num": 33, "part": 2, "stem": "'사방의 날'은?", "options": ["4월 5일", "3월 21일", "3월 15일", "11월 1일"], "answer": 2, "explain": "1959년 '사방의 날'(3월 15일) 제정\n쉬운 풀이: 1959년에 '사방의 날'을 3월 15일로 정했어요. 식목일(4월 5일), 임업인의 날(11월 1일)과 함께 외우세요.\n용어 풀이:\n· 사방의 날: 사방사업을 기념하는 날\n· 제정: 정해서 만듦", "ref": "사방 모듈 p.5"}, {"id": "산림토목-34", "subject": "산림토목", "num": 34, "part": 2, "stem": "「사방사업법」이 처음 제정된 해는?", "options": ["1959년", "1962년", "1967년", "1973년"], "answer": 1, "explain": "1962년 사방사업법·시행령 제정\n쉬운 풀이: 「사방사업법」은 1962년에 처음 만들어졌어요. 1960년대 헐벗은 산을 복구하던 시기에 맞춰 법이 생긴 거예요.\n용어 풀이:\n· 제정: 법을 처음 만듦\n· 사방사업법: 사방사업에 관한 법률", "ref": "p.5"}, {"id": "산림토목-35", "subject": "산림토목", "num": 35, "part": 2, "stem": "2008년 사방사업법 개정에 따른 해안사방사업의 구분은?", "options": ["산사태예방사업과 산사태복구사업", "계류보전사업과 사방댐설치사업", "산지보전사업과 산지복원사업", "해안방재림 조성사업과 해안침식방지사업"], "answer": 3, "explain": "산지사방(산사태예방·복구, 산지보전·복원), 해안사방(해안방재림·해안침식방지), 야계사방(계류보전·복원, 사방댐)\n쉬운 풀이: 2008년 개정으로 사방사업이 세 가지로 정리됐어요. 산지사방(산사태 예방·복구, 산지 보전·복원), 해안사방(해안방재림 조성, 해안침식 방지), 야계사방(계류 보전·복원, 사방댐). 해안사방은 바닷가를 지키는 사업이에요.\n용어 풀이:\n· 해안사방: 바닷가 모래·바람 피해를 막는 사업\n· 해안방재림: 해안 재해를 막는 숲\n· 야계사방: 계곡 사방", "ref": "p.8"}, {"id": "산림토목-36", "subject": "산림토목", "num": 36, "part": 2, "stem": "2002년 사방사업법 개정으로 단축된 사방지 지정해제 기간은?", "options": ["사업 시행 후 10년", "사업 시행 후 15년", "사업 시행 후 20년", "사업 시행 후 5년"], "answer": 0, "explain": "1995년 20년 → 15년, 2002년 15년 → 10년\n쉬운 풀이: 사방지는 공사 후 일정 기간이 지나 안정되면 지정을 풀 수 있어요. 이 기간이 1995년 20년 → 15년, 2002년 15년 → 10년으로 줄었어요. 지금 기준은 10년이에요.\n용어 풀이:\n· 사방지 지정해제: 사방지 지정을 풂\n· 단축: 짧게 줄임", "ref": "p.6–7"}, {"id": "산림토목-37", "subject": "산림토목", "num": 37, "part": 2, "stem": "사방지를 지정·고시하는 자는?", "options": ["산림청장만", "시장·군수", "시·도지사 또는 지방산림청장", "산림조합중앙회장"], "answer": 2, "explain": "시·도지사 또는 지방산림청장 지정·고시\n쉬운 풀이: 사방지는 시·도지사 또는 지방산림청장이 지정하고 고시(공식 발표)해요. 사방시설 관리 주체도 같은 기관이니 함께 외우세요.\n용어 풀이:\n· 사방지: 사방사업을 위해 지정한 땅\n· 고시: 공식적으로 알림", "ref": "p.4"}, {"id": "산림토목-38", "subject": "산림토목", "num": 38, "part": 2, "stem": "비류량법으로 최대홍수유량을 구하면? (황폐계류 유역면적 30km², 해당 구간 비류량 g = 15㎥/s/km², Q = A × g)", "options": ["150㎥/s", "450㎥/s", "600㎥/s", "750㎥/s"], "answer": 1, "explain": "30 × 15 = 450㎥/s (비류량 g는 유역 1km²당 최대홍수유량)\n쉬운 풀이: 비류량법은 '유역 1km²당 최대 홍수량(비류량) × 유역 면적'으로 홍수량을 구하는 간단한 방법이에요. 30km² × 15㎥/s/km² = 450㎥/s.\n용어 풀이:\n· 비류량: 유역 1km²당 최대홍수유량\n· 황폐계류: 황폐한 계곡\n· km²: 제곱킬로미터(100ha)", "ref": "p.210"}, {"id": "산림토목-39", "subject": "산림토목", "num": 39, "part": 2, "stem": "학습모듈의 자연상태 유출계수표에서 '침투 불량 토양·급경' 조건일 때 유출계수가 가장 큰 지표는?", "options": ["산림", "농경지", "초지", "암석지"], "answer": 3, "explain": "침투 불량·급경: 산림 0.65, 농경지 0.75, 초지 0.85, 암석지 0.90\n쉬운 풀이: 유출계수는 빗물이 땅에 스며들지 않고 흘러가는 비율이에요. 바위(암석지)는 거의 스며들지 않아 0.90으로 가장 크고, 숲(산림)은 흙과 낙엽이 물을 머금어 0.65로 가장 작아요. 숲이 홍수를 줄이는 이유예요.\n용어 풀이:\n· 유출계수: 강우 중 지표로 흘러가는 비율\n· 침투: 땅속으로 스며듦\n· 급경: 경사가
