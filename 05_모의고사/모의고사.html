\n쉬운 풀이: 합리식(면적 ha): Q = 유출계수 × 강우강도 × 면적 ÷ 360 = 0.8 × 100 × 10 ÷ 360 ≈ 2.22㎥/s예요. 면적 단위가 ha면 360으로 나눈다는 걸 꼭 기억하세요.\n용어 풀이:\n· 합리식: 최대홍수량 계산식\n· 유출계수: 빗물 중 흘러가는 비율\n· 강우강도: 시간당 비의 양", "ref": "사방 모듈 최대홍수유량(합리식)"}, {"id": "공개-산림토목-5", "subject": "산림토목", "num": 5, "part": 0, "stem": "[공통 지문] 접근속도가 있는 개수로(방수로) 단면 결정 순서: 1) 최대홍수유량(Q) 2) 임계유속(Vg) 3) 수로단면적(A) 4) 수로단면 설정 5) 평균수심(R) 6) 안정물매(S)\n\n산림 유역면적 A = 10ha, 유출계수 f = 0.8, 최대시우량 h = 100mm (석력의 길이 b = 0.10m, 마찰계수 k = 4.5, 사다리형 수로 하폭 3.0m)\n\n수로단면적 산출 결과로 옳은 것은?", "options": ["1.57㎡", "1.40㎡", "1.96㎡", "0.45㎡"], "marks": ["가.", "나.", "다.", "라."], "answer": 0, "accept": [0], "explain": "임계유속 Vg = k√b = 4.5 × √0.10 = 4.5 × 0.316 ≒ 1.42m/s → A = Q ÷ Vg = 2.22 ÷ 1.42 ≒ 1.57㎡\n쉬운 풀이: 수로가 깎이지 않는 최대 속도(임계유속)를 먼저 구하고, 홍수량을 그 속도로 나누면 필요한 단면적이 나와요. Vg = 4.5 × √0.10 ≈ 1.42m/s → A = 2.22 ÷ 1.42 ≈ 1.57㎡. '면적 = 유량 ÷ 속도'예요.\n용어 풀이:\n· 임계유속: 수로 바닥이 깎이기 시작하는 속도\n· 수로단면적: 물이 흐르는 단면 넓이\n· 유량: 1초당 흐르는 물의 양", "ref": "사방 모듈 1-2-1 임계유속, 수로단면 결정"}, {"id": "공개-산림토목-6", "subject": "산림토목", "num": 6, "part": 0, "stem": "[공통 지문] 산주가 본인 소유 산림에 임도 3km 개설을 산림조합에 맡겨 공정률 40%까지 진행했다. 임도 피해는 대부분 집중호우 때문이어서, 산주가 현장대리인에게 1) 암거(속도랑) 횡단배수로의 설치간격과 배수구 통수단면, 2) 노면유수를 유도하는 시설의 시공위치를 문의했다.\n\n횡단배수로 설치간격과 배수구 통수단면에 대한 설명으로 옳은 것은?", "options": ["횡단배수로는 자연유선을 따라 100~150m 간격으로 계통적으로 설치", "배수구 통수단면은 100년 빈도 최대홍수량의 1.5배 이상으로 설치한다.", "관의 규격(지름)은 1,000mm 이상으로 하고 현지여건에 따라 600mm 이상으로 설치할 수 있다.", "배수관 길이는 유출구 성토사면 끝 지반선상에 설치되도록 충분하게 반영한다."], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "· 가 — 60~100m 간격\n· 나 — 1.2배 이상\n· 다 — 1,000mm 이상, 현지여건상 800mm 이상\n· 라 — 옳음(배수관 유출구를 성토사면 끝 지반선까지 빼서 성토면 세굴을 막는다)\n쉬운 풀이: 보기를 하나씩 고쳐 보면: 횡단배수로 간격은 60~100m, 통수단면은 1.2배, 관 지름은 1,000mm(부득이 800mm)예요. 배수관 출구는 흙 쌓은 비탈 끝 땅까지 빼야 물이 비탈을 깎지 않아요. 그래서 라가 옳아요.\n용어 풀이:\n· 횡단배수로: 길을 가로지르는 배수로\n· 성토사면: 흙을 쌓아 만든 비탈\n· 유출구: 물이 나오는 구멍", "ref": "임도 모듈 1-1 관매설 가·나·바"}, {"id": "공개-산림토목-7", "subject": "산림토목", "num": 7, "part": 0, "stem": "[공통 지문] 산주가 본인 소유 산림에 임도 3km 개설을 산림조합에 맡겨 공정률 40%까지 진행했다. 임도 피해는 대부분 집중호우 때문이어서, 산주가 현장대리인에게 1) 암거(속도랑) 횡단배수로의 설치간격과 배수구 통수단면, 2) 노면유수를 유도하는 시설의 시공위치를 문의했다.\n\n노면유수를 유도하는 시설(개거)의 시공위치로 잘못된 것은?", "options": ["포장구간의 시·종점 부근을 대상으로 실시한다.", "노면의 종단기울기가 완만한 곳을 대상으로 실시한다.", "구조물 등의 보호를 위하여 노면 유하거리를 차단할 필요가 있는 지점을 대상으로 실시한다.", "급커브의 시작점을 대상으로 실시한다. (원문 표기는 \"마\")"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "· 개거(겉도랑)는 노면의 종단기울기가 급한 곳에 설치한다.\n· 나머지는 모두 옳은 시공위치이다.\n· 원문의 마지막 보기 기호 \"마\"는 \"라\"의 오기다.\n쉬운 풀이: 개거(겉도랑)는 길 위를 비스듬히 가로질러 흐르는 물을 옆으로 빼는 도랑이에요. 물살이 센 '급경사' 구간, 포장 시작·끝, 급커브 시작점 등에 설치해요. '완만한 곳'이 틀렸어요.\n용어 풀이:\n· 개거(겉도랑): 노면을 가로지르는 열린 배수로\n· 노면유수: 길 위로 흐르는 물\n· 유하거리: 물이 흘러가는 거리", "ref": "임도 모듈 3. 개거(겉도랑) 3-2 시공위치"}]}, {"name": "임산가공", "questions": [{"id": "공개-임산가공-1", "subject": "임산가공", "num": 1, "part": 0, "stem": "원목의 재종 구분등급으로 옳지 않은 것은?", "options": ["1등급", "2등급", "3등급", "4등급"], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "원목 재종 = 특용재급 → 1등급 → 2등급 → 3등급 → 원주재급 → 원료재급. 4등급은 없다.\n쉬운 풀이: 원목 등급은 특용재급 → 1등급 → 2등급 → 3등급 → 원주재급 → 원료재급 순이에요. 4등급은 없어요. 3등급 다음은 숫자가 아니라 이름(원주재·원료재)이라고 기억하세요.\n용어 풀이:\n· 재종: 원목의 종류·등급\n· 원주재: 둥근 기둥용 원목\n· 원료재: 펄프·칩 등 원료용 원목", "ref": "임산가공 모듈 2-1 원목의 재종 구분, 국산 원목 등급 규격 제3조"}, {"id": "공개-임산가공-2", "subject": "임산가공", "num": 2, "part": 0, "stem": "원목결점(옹이) 측정방법 중 맞는 것은?", "options": ["산옹이의 지름은 그 실측 짧은 지름으로 한다.", "죽은옹이·썩은옹이의 지름은 그 실측 긴 지름의 3배로 한다.", "재면에 있는 옹이를 대상으로 실측 짧은 지름을 측정한다.", "산옹이, 죽은옹이 또는 썩은옹이가 없고 숨은옹이만 있는 경우의 숨은옹이 크기는 100mm로 한다."], "marks": ["가.", "나.", "다.", "라."], "answer": 3, "accept": [3], "explain": "· 옹이는 모두 긴지름 기준이다.\n· 산옹이 = 실측 긴지름, 죽은·썩은옹이 = 실측 긴지름의 2배, 숨은옹이 = 가장 큰 옹이 긴지름의 1.5배, 숨은옹이만 있으면 100mm\n쉬운 풀이: 옹이는 모두 '긴지름' 기준으로 재요. 산옹이는 긴지름 그대로, 죽은·썩은옹이는 긴지름의 2배(3배 아님), 숨은옹이만 있으면 100mm로 정해요. 예상문제 임산가공 3·4번과 같은 내용이에요.\n용어 풀이:\n· 산옹이: 살아 있던 가지의 옹이\n· 숨은옹이: 표면에 드러나지 않은 옹이\n· 재면: 원목 표면을 4등분한 면", "ref": "임산가공 모듈 5-1 원목결점의 측정방법"}, {"id": "공개-임산가공-3", "subject": "임산가공", "num": 3, "part": 0, "stem": "지름이 큰 대경목의 제재 방법에 대한 설명으로 맞는 것은?\n\n(그림: 원목 단면 위쪽 바깥의 가로로 켠 판재 = A, 중심부를 지나는 넓은 판재 = B, 아래쪽 세로로 켠 판재 = C, 작은 정사각형 = D)", "options": ["A-정목면재, B-중심면재, C-판목면재, D-각재", "A-판목면재, B-중심면재, C-정목면재, D-각재", "A-판목면재, B-정목면재, C-중심면재, D-각재", "A-정목면재, B-판목면재, C-중심면재, D-각재"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "⚠️ 확인 필요\n· 나이테의 접선 방향으로 켠 바깥쪽 판재는 판목면재(널결), 수심을 지나는 판은 중심면재(중심판재), 나이테에 직각(반경 방향)으로 켠 판은 정목면재(곧은결), 네모난 것은 각재다.\n· ⚠️ 모듈의 <대경목의 제재 방법> 그림은 md 변환본에 빠져 있다.\n· 원본 PDF 그림과 대조해 확인할 것.\n쉬운 풀이: 통나무를 켜는 방향에 따라 이름이 달라요. 나이테와 나란히(접선 방향) 켜면 널결 무늬의 판목면재, 중심을 지나면 중심면재, 나이테와 직각으로 켜면 곧은결의 정목면재, 네모난 덩어리는 각재예요. 그림이 없어 '확인 필요'예요.\n용어 풀이:\n· 판목면재(널결): 접선 방향으로 켠 판\n· 정목면재(곧은결): 반지름 방향으로 켠 판\n· 중심면재: 수심을 지나는 판", "ref": "임산가공 모듈 1-1-6 규격에 따른 제재방법"}, {"id": "공개-임산가공-4", "subject": "임산가공", "num": 4, "part": 0, "stem": "제재목 품질 확인 순서로 맞는 것을 고르시오.\n\nA. 작업지시서와 절단 공정을 이해하고 관련 자료, 정보를 확인\n\nB. 원목으로부터 제재한 제재목의 특성을 확인\n\nC. 제재목을 생산할 원목의 소요량, 규격 및 길이 등을 확인\n\nD. 생산된 제재목의 재적이 확인되면, 다음 가공공정에 이송을 준비", "options": ["A – B – C – D", "A – C – B – D", "C – B – A – D", "C – B – D – A"], "marks": ["①", "②", "③", "④"], "answer": 0, "accept": [0], "explain": "· 모듈의 \"제재목 품질 확인\" 순서가 8-1(A) → 8-2(B) → 8-3(C) → 8-4(D)이다.\n· 상식적으로는 ②(소요량 확인 후 특성 확인)가 끌리지만, 출제는 모듈 순서를 그대로 따랐다.\n쉬운 풀이: 학습모듈의 '제재목 품질 확인' 순서를 그대로 물은 문제예요. 작업지시서 확인(A) → 제재목 특성 확인(B) → 원목 소요량 확인(C) → 다음 공정 이송 준비(D). 상식과 달라도 모듈 순서대로 답해요.\n용어 풀이:\n· 제재목: 원목을 켜서 만든 목재\n· 작업지시서: 작업 내용을 적은 지시 문서\n· 이송: 옮겨 보냄", "ref": "임산가공 모듈 8-1~8-4"}, {"id": "공개-임산가공-5", "subject": "임산가공", "num": 5, "part": 0, "stem": "제재목 함수율 검사를 위해 전건중량법으로 함수율을 계산하시오. 시험재의 전건무게가 2,000g이고 건조 중 시험재의 무게가 2,600g일 때 건조 중 함수율은?", "options": ["10%", "20%", "30%", "40%"], "marks": ["가.", "나.", "다.", "라."], "answer": 2, "accept": [2], "explain": "함수율(%) = (W − W₀) ÷ W₀ × 100 = (2,600 − 2,000) ÷ 2,000 × 100 = 30% (분모는 전건중량)\n쉬운 풀이: 함수율은 마른 무게를 기준으로 해요. (지금 무게 − 마른 무게) ÷ 마른 무게 × 100 = (2,600 − 2,000) ÷ 2,000 × 100 = 30%. 분모를 지금 무게(2,600)로 하면 틀려요.\n용어 풀이:\n· 전건중량법: 완전 건조 무게로 함수율을 구하는 법\n· 전건무게: 물이 하나도 없을 때 무게", "ref": "임산가공 모듈 함수율 측정(전건중량법)"}, {"id": "공개-임산가공-6", "subject": "임산가공", "num": 6, "part": 0, "stem": "대청호 둘레길 데크로드 1km에 쓸 방부데크목을 구매하려 한다. 시공 위치는 토양과 접하지 않는 실외 비접지로서 강우로부터 보호되지 않는 지상부 노출 환경이다. 구매해야 할 방부목 등급은?", "options": ["H3A", "H3B", "H4A", "H4B"], "marks": ["가.", "나.", "다.", "라."], "answer": 1, "accept": [1], "explain": "· H3 = 실외 비접지. H3A = 도장되었거나 수직부재여서 강우 침투가 어려운 환경, H3B = 도장되지 않아 강우 침투가 쉬운 환경. 수평으로 깔린 무도장 데크가 비에 노출되므로 H3B이다.\n· H4A·H4B는 접지(토양·담수 접촉) 환경이다.\n쉬운 풀이: 땅에 안 닿는 실외는 H3이에요. 그중 칠하지 않아 비가 잘 스며드는 곳은 H3B, 칠했거나 세워 놔서 비가 잘 안 스며드는 곳은 H3A예요. 바닥에 깔린 무도장 데크는 비가 고이니 H3B예요. H4는 땅에 닿는 곳이에요.\n용어 풀이:\n· H3A·H3B: 실외 비접지 방부등급 세분\n· 무도장: 칠하지 않음\n· 접지: 땅에 닿음", "ref": "임산가공 모듈 방부목재 사용환경범주(KS F 3112 / 목재제품 규격)"}, {"id": "공개-임산가공-7", "subject": "임산가공", "num": 7, "part": 0, "stem": "국내 원목의 재적 및 해당 등급을 고르시오.\n\n굴참나무 원목: 수피 포함 말구 최소지름 300mm, 그 직각지름 330mm / 수피 포함 원구 최소지름 360mm, 그 직각지름 420mm / 원구·말구 수피 30mm / 길이 6.3m / 옹이 150mm 이하, 할렬 30% 이하, 굽음 20% 이하, 썩음 등 20% 이하, 기타결점 경미", "options": ["0.478㎥, 1등급", "0.506㎥, 1등급", "0.537㎥, 3등급", "0.567㎥, 3등급"], "marks": ["가.", "나.", "다.", "라."], "answer": 0, "accept": [0], "explain": "⚠️ 확인 필요\n· ① 말구지름(수피 제외 최소지름) = 300 − 30 = 270mm (최소지름이 300mm 이하라 직각지름 보정 없음)\n· ② 원구지름 = 360 − 30 = 330mm. 300mm를 넘으므로 직각지름(420 − 30 = 390mm)과의 차 60mm → 30mm마다 10mm 가산 → 330 + 20 = 350mm\n· ③ 스말리안식: V = (g₁ + g₂) ÷ 2 × L = π/4 × (0.27² + 0.35²) ÷ 2 × 6.3 ≒ 0.483㎥ → 가장 가까운 보기 0.478㎥\n· ④ 등급: 활엽수류 1등급 = 지름 270mm 이상·재장 2.1m 이상·옹이 긴지름 150mm 이하·할렬 30%·굽음 20%·썩음 20% 이하·기타결점 경미 → 1등급\n· ⚠️ 등급(1등급)은 확실하다.\n· 재적은 현행 모듈 기준(스말리안식)으로 계산하면 0.483㎥로 보기와 정확히 맞지 않는다.\n· 출제 당시(2021) 규격의 재적 계산식이 달랐을 수 있다.\n· 1등급 보기(가·나) 가운데 가까운 가를 골랐다.\n쉬운 풀이: ① 말구지름 = 300 − 껍질 30 = 270mm ② 원구지름 = 330mm에 직각지름 차이 보정(+20) = 350mm ③ 양 끝 단면적 평균 × 길이(스말리안식) ≈ 0.48㎥ ④ 지름 270mm·길이 2.1m 이상·결점 기준 충족 → 활엽수 1등급. 단계별로 차근차근 풀면 돼요.\n용어 풀이:\n· 말구·원구: 원목의 가는 끝·굵은 끝\n· 스말리안식: 양 끝 단면적 평균 × 길이\n· 재적: 원목 부피", "ref": "국산 원목 등급 규격 제9조(지름)·제11조(재적계산)·제12조(활엽수류 품등)"}]}];
const GONGMU = [{"name": "2026 조림", "year": "2026", "subject": "조림", "questions": [{"id": "9급-2026-조림-1", "subject": "조림", "num": 1, "part": 6, "stem": "I 영급부터 벌기령에 이르는 모든 영급으로 구성된 임분은?", "options": ["동령림", "전령림", "성숙림", "유령림"], "answer": 1, "explain": "Ⅰ영급부터 벌기령까지 모든 영급이 고루 있는 임분 = 전령림.\n쉬운 풀이: 숲의 나이 구성으로 이름을 붙여요. 나이가 모두 같으면 동령림, 1영급(1~10년)부터 벌기까지 모든 나이가 고르게 섞이면 '전(全)령림'이에요. '전부 다 있는 숲'이라고 기억하세요.\n용어 풀이:\n· 영급: 나이를 10년씩 묶은 등급\n· 동령림: 나이가 같은 나무로 된 숲\n· 유령림: 어린 숲\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-2", "subject": "조림", "num": 2, "part": 6, "stem": "우리나라 숲에 대한 설명으로 옳지 않은 것은?", "options": ["천연활엽수림은 주로 복잡한 계층구조를 가지며, 미세지형에 따라 종다양성이 다르다.", "소나무－활엽수 혼효림은 경사지에 많으며, 생물다양성 보존에 도움을 줄 수 있다.", "소나무림은 단일 수종으로 가장 넓은 면적을 차지하는 숲으로 산불에 취약하다.", "소나무림에서 낙엽 분해과정 동안 발생하는 유기산은 활엽수의 침입을 용이하게 한다."], "answer": 3, "explain": "소나무림 낙엽에서 나온 유기산은 토양을 산성화해 활엽수 침입을 어렵게 한다.\n쉬운 풀이: 소나무 낙엽이 썩을 때 나오는 유기산은 흙을 산성으로 만들어요. 산성 흙에선 활엽수가 자리 잡기 어려워서, 오히려 활엽수 침입을 '막아요'. ④는 정반대로 써서 틀렸어요.\n용어 풀이:\n· 유기산: 생물에서 나오는 산 성분\n· 혼효림: 침엽수와 활엽수가 섞인 숲\n· 종다양성: 생물 종류의 다양함\n중요도: ★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-3", "subject": "조림", "num": 3, "part": 6, "stem": "우리나라 난대림에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 남해안 및 제주도 저지대에 분포한다.\n\nㄴ. 주요 수종으로는 가시나무류, 구실잣밤나무, 동백나무, 녹나무가 있다.\n\nㄷ. 상록활엽수림은 교란으로 인해 임상이 변한 곳이 많다.\n\nㄹ. 신갈나무, 자작나무 등 활엽수가 극상림을 이룬다.", "options": ["ㄱ, ㄴ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ"], "answer": 2, "explain": "· ㄱ·ㄴ·ㄷ이 옳다.\n· 신갈나무·자작나무 극상림은 온대 북부·냉온대.\n쉬운 풀이: 난대림은 남해안·제주도 낮은 곳의 따뜻한 숲으로, 가시나무·구실잣밤나무·동백나무·녹나무 같은 상록활엽수가 주인공이에요. 신갈나무·자작나무는 추운 곳 나무라 난대림과 안 맞아요.\n용어 풀이:\n· 난대림: 따뜻한 남쪽 지역 숲\n· 상록활엽수: 겨울에도 잎이 푸른 넓은잎나무\n· 극상림: 천이 마지막 단계의 안정된 숲\n중요도: ★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-4", "subject": "조림", "num": 4, "part": 6, "stem": "파종상에서 입고병을 발생시키는 주된 병원균이 아닌 것은?", "options": ["Bacillus", "Fusarium", "Pythium", "Rhizoctonia"], "answer": 0, "explain": "· 입고병(모잘록병)은 곰팡이(Fusarium·Pythium·Rhizoctonia)가 일으킨다.\n· *Bacillus*는 세균.\n쉬운 풀이: 입고병(모잘록병)은 묘상의 어린싹 밑동을 썩게 하는 병으로, 흙 속 곰팡이(Fusarium, Pythium, Rhizoctonia)가 원인이에요. Bacillus는 곰팡이가 아니라 세균이에요. 예상문제 보호 54번과 같은 원리예요.\n용어 풀이:\n· 입고병(모잘록병): 어린 묘가 밑동이 썩어 쓰러지는 병\n· 파종상: 씨 뿌린 묘상\n· 세균: 단세포 미생물\n중요도: ★★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-5", "subject": "조림", "num": 5, "part": 6, "stem": "종자의 정선방법이 아닌 것은?", "options": ["구도법", "풍선법", "사선법", "수선법"], "answer": 0, "explain": "정선법은 풍선법·사선법·수선법·입선법 등. 구도법은 정선법이 아니다.\n쉬운 풀이: 정선은 씨앗에서 쭉정이·이물질을 고르는 일이에요. 바람(풍선법), 체(사선법), 물(수선법), 손으로 골라내기(입선법) 등이 있어요. 구도법은 정선법이 아니에요.\n용어 풀이:\n· 정선: 종자를 깨끗이 고르는 작업\n· 풍선법: 바람으로 가벼운 것을 날림\n· 사선법: 체로 거름\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-6", "subject": "조림", "num": 6, "part": 6, "stem": "임목종자의 노천매장에 대한 설명으로 옳은 것은?", "options": ["은행나무, 주목, 잣나무 등은 파종 1개월 전에 노천매장을 한다.", "종자가 후숙되지 않고 신선도를 유지할 수 있도록 음지가 적합하다.", "노천매장하는 곳에 눈이나 빗물이 그대로 스며들 수 있도록 한다.", "소나무류, 낙엽송, 편백 등은 가을에 종자 정선이 끝나면 바로 노천매장을 한다."], "answer": 2, "explain": "· 노천매장은 눈·빗물이 스며드는 곳에 한다.\n· 은행·주목·잣나무 등은 가을 정선 후 바로, 소나무·낙엽송·편백은 파종 1개월 전에 묻는다(①·④는 거꾸로).\n쉬운 풀이: 노천매장은 씨앗을 땅에 묻어 눈·빗물을 맞히며 겨울을 나게 하는 거예요. 그래서 물이 스며들어야 해요. 휴면이 깊은 은행·주목·잣나무는 가을에 바로 묻고, 소나무·낙엽송은 파종 1개월 전에 묻어요(①④는 거꾸로).\n용어 풀이:\n· 노천매장: 종자를 땅에 묻어 휴면을 깨는 처리\n· 후숙: 수확 후 더 성숙함\n· 정선: 종자 고르기\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-7", "subject": "조림", "num": 7, "part": 6, "stem": "벌채작업 후 단위면적당 잔존 본수가 적은 것부터 순서대로 바르게 나열한 것은?", "options": ["개벌작업, 산벌작업, 모수림작업, 택벌작업", "택벌작업, 모수림작업, 산벌작업, 개벌작업", "택벌작업, 산벌작업, 모수림작업, 개벌작업", "개벌작업, 모수림작업, 산벌작업, 택벌작업"], "answer": 3, "explain": "잔존 본수: 개벌 < 모수림 < 산벌 < 택벌.\n쉬운 풀이: 벤 뒤 남는 나무 수를 생각해 보세요. 개벌은 다 베니 0, 모수림작업은 어미나무 몇 그루, 산벌은 단계적으로 베니 더 많이, 택벌은 다 자란 나무만 골라 베니 가장 많이 남아요. '개 < 모 < 산 < 택'.\n용어 풀이:\n· 개벌: 모두베기\n· 모수림작업: 어미나무만 남기기\n· 산벌: 여러 번 나눠 베기\n· 택벌: 골라베기\n중요도: ★★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-8", "subject": "조림", "num": 8, "part": 6, "stem": "상수리나무 묘목 생산과 종자에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 묘목 생산은 저상에서 한다.\n\nㄴ. 접목묘 양성이 어려운 수종이다.\n\nㄷ. 종자는 개화 다음해에 성숙한다.\n\nㄹ. 곤포당 1년생 묘목 수는 3,000본이다.", "options": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄷ, ㄹ"], "answer": 2, "explain": "상수리나무는 접목이 어렵고 종자는 개화 다음 해에 성숙(ㄴ·ㄷ).\n쉬운 풀이: 상수리나무는 접붙이기(접목)가 잘 안 되고, 꽃이 핀 다음 해 가을에 도토리가 익어요(2년 걸림). 그래서 ㄴ·ㄷ이 옳아요.\n용어 풀이:\n· 접목묘: 접붙이기로 만든 묘목\n· 성숙: 다 익음\n· 곤포: 묘목을 묶은 단위 묶음\n중요도: ★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-9", "subject": "조림", "num": 9, "part": 6, "stem": "수목생장 및 생리에 대한 설명으로 옳은 것은?", "options": ["수목이 생장하면서 필수로 요구하는 영양분 중 미량원소는 황, 염소, 망간 등이 있다.", "직경생장은 형성층이 세포분열을 해서 자신의 안쪽으로 체관부 조직을, 바깥쪽으로 물관부 조직을 생산함으로써 이루어진다.", "고정생장을 하는 은행나무, 낙엽송은 1년에 1개의 마디를 생산하기 때문에 줄기에 있는 마디 수를 세어 나무의 나이를 추정할 수 있다.", "단풍은 여러 가지 색소가 나타나는 현상인데, 노란 단풍은 크산토필 (xanthophyll)이, 빨간 단풍은 안토시아닌(anthocyanin)이 주로 관여한다."], "answer": 3, "explain": "노란 단풍은 크산토필, 빨간 단풍은 안토시아닌. 황은 다량원소, 형성층은 안쪽에 물관부, 바깥쪽에 체관부, 은행·낙엽송은 자유생장.\n쉬운 풀이: 가을 단풍은 엽록소가 사라지면서 숨어 있던 노란 색소(크산토필)가 보이거나, 새로 생긴 빨간 색소(안토시아닌) 때문이에요. 황은 다량원소, 형성층은 안쪽에 물관부·바깥쪽에 체관부를 만들어요.\n용어 풀이:\n· 크산토필: 노란 색소\n· 안토시아닌: 붉은 색소\n· 고정생장: 1년에 한 번 정해진 만큼 자라는 생장\n중요도: ★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-10", "subject": "조림", "num": 10, "part": 6, "stem": "다음 특징을 갖는 수종은?\n\n○ 양수이며, 천근성이다.\n\n○ 잎은 수십 개씩 모여 달린다.\n\n○ 낙엽교목으로 초기생장이 빠르고 수간이 곧은 특징을 보인다.\n\n○ 원산지는 일본이며 우리나라 전역에 인공조림 수종으로 사용되어 왔다.", "options": ["Chamaecyparis obtusa", "Cryptomeria japonica", "Larix kaempferi", "Taxodium distichum"], "answer": 2, "explain": "양수·천근성·잎이 모여 나는 낙엽교목·일본 원산 = 일본잎갈나무(*Larix kaempferi*).\n쉬운 풀이: 잎이 수십 개씩 모여 나는 낙엽 침엽수, 일본 원산, 빨리 곧게 자라는 양수 → 낙엽송(일본잎갈나무, Larix kaempferi)이에요. 학명 Larix가 낙엽송속이라는 걸 기억하세요.\n용어 풀이:\n· 천근성: 뿌리가 얕게 뻗는 성질\n· 학명: 국제 공통 생물 이름\n· Larix: 낙엽송속\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-11", "subject": "조림", "num": 11, "part": 6, "stem": "내음성이 강한 수종으로만 나열한 것은?", "options": ["Abies holophylla, Taxus cuspidata, Torreya nucifera", "Picea jezoensis, Pinus densiflora, Pinus koraiensis", "Castanea crenata, Juniperus chinensis, Robinia pseudoacacia", "Alnus japonica, Carpinus laxiflora, Prunus serrulata"], "answer": 0, "explain": "전나무(*Abies holophylla*)·주목(*Taxus*)·비자나무(*Torreya*)는 내음성이 강하다.\n쉬운 풀이: 그늘을 잘 견디는 음수는 전나무(Abies), 주목(Taxus), 비자나무(Torreya)예요. 소나무·아까시·오리나무 등은 햇빛을 좋아하는 양수예요. 학명 첫 단어(속명)로 나무를 알아보는 연습을 해 두세요.\n용어 풀이:\n· 내음성: 그늘을 견디는 성질\n· 속명: 학명의 첫 단어\n· Abies: 전나무속\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-12", "subject": "조림", "num": 12, "part": 6, "stem": "다음 식물호르몬에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 옥신(auxin)은 일반적으로 줄기 끝에서 생성되어 아래로 이동하며, 정아우세 현상을 유발한다.\n\nㄴ. 지베렐린(gibberellin)은 휴면 타파와 개화 촉진, 줄기의 신장 생장에 관여한다.\n\nㄷ. 아브시스산(abscisic acid)은 수분 스트레스를 받을 때 기공을 열어 증산작용을 촉진한다.\n\nㄹ. 에틸렌(ethylene)은 과실의 성숙을 촉진하고 잎의 탈리를 유도한다.", "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 2, "explain": "· ㄱ·ㄴ·ㄹ이 옳다.\n· 아브시스산은 수분 스트레스 때 기공을 닫는다.\n쉬운 풀이: 옥신은 줄기 끝에서 만들어져 꼭대기 눈이 우선 자라게 하고(정아우세), 지베렐린은 키 크기·휴면 깨기, 에틸렌은 열매 익히기·잎 떨구기를 해요. 아브시스산은 가뭄 때 기공을 '닫아요'. ㄷ만 틀렸어요.\n용어 풀이:\n· 정아우세: 꼭대기 눈이 곁눈보다 먼저 자라는 현상\n· 탈리: 잎·열매가 떨어짐\n· 기공: 잎의 숨구멍\n중요도: ★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-13", "subject": "조림", "num": 13, "part": 6, "stem": "균근에 대한 설명으로 옳지 않은 것은?", "options": ["토양에 있는 영양소 중 특히 인산 흡수를 촉진시켜 준다.", "소나무의 뿌리 피층세포 사이의 간극에 하티그망(Hartig net)을 형성한다.", "산성이 심한 산림토양에서 수목의 암모늄태(NH₄⁺) 질소 흡수에 도움을 준다.", "고산지대와 툰드라 지역과 같이 생육환경이 좋지 않은 곳에서는 공생관계를 맺지 않는다."], "answer": 3, "explain": "균근은 척박한 고산·툰드라에서 오히려 중요하다(공생한다).\n쉬운 풀이: 균근은 곰팡이가 뿌리와 함께 살며 인산·질소 흡수를 도와요. 양분이 부족한 고산지대·툰드라처럼 환경이 나쁜 곳일수록 이 도움이 더 중요해서 오히려 공생을 많이 해요.\n용어 풀이:\n· 균근: 곰팡이와 뿌리의 공생체\n· 하티그망: 균사가 뿌리 세포 사이에 만든 그물 구조\n· 공생: 서로 도우며 함께 삶\n중요도: ★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-14", "subject": "조림", "num": 14, "part": 6, "stem": "이단림에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 상층목에 대한 벌채량 조절이 어렵고, 높은 작업기술 수준을 요한다.\n\nㄴ. 임지의 노출을 방지할 수 있고, 상층목을 통해 천연하종갱신이 가능하다.\n\nㄷ. 상층부와 하층부를 분기시키는 중ㆍ소 직경목은 우선적으로 남겨둬야 한다.\n\nㄹ. 상층부의 수관이 열려 치수의 생장을 촉진할 수 있어, 상층부와 하층부 모두 양수 위주로 조성한다.", "options": ["ㄱ, ㄴ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ"], "answer": 0, "explain": "· ㄱ·ㄴ이 옳다.\n· 상·하층을 가르는 중·소경목은 정리하고, 하층은 음수 위주.\n쉬운 풀이: 이단림은 키 큰 위층과 키 작은 아래층 두 층으로 된 숲이에요. 위층 벌채량 조절이 까다롭고(ㄱ), 땅이 드러나지 않으며 위층 나무 씨앗으로 자연 갱신이 돼요(ㄴ). 아래층은 그늘에 강한 음수로 만들어요.\n용어 풀이:\n· 이단림: 두 층으로 이뤄진 숲\n· 천연하종갱신: 자연적으로 떨어진 씨앗으로 숲이 생김\n· 치수: 어린나무\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-15", "subject": "조림", "num": 15, "part": 6, "stem": "모두베기(개벌) 방법에 대한 설명으로 옳지 않은 것은?", "options": ["양수성 수종의 갱신에 유리하다.", "군상개벌에서 한 벌채구의 최소 면적은 5 ha이다.", "개벌 후 동령림이 형성되어 모든 생육단계에서 숲가꾸기작업이 비교적 편리하다.", "숲을 띠모양으로 나누고, 순차적으로 벌채해 나가는 방법을 대상개벌작업이라고 한다."], "answer": 1, "explain": "· 군상개벌의 한 벌채구는 소면적이다.\n· '최소 5ha'가 틀림.\n쉬운 풀이: 군상개벌은 숲 여기저기를 작은 덩어리(군상)로 베는 방법이라 한 구역이 작아요. '최소 5ha'처럼 넓다는 말은 틀렸어요. 개벌은 양수 갱신에 좋고, 띠 모양으로 차례로 베면 대상개벌이에요.\n용어 풀이:\n· 군상개벌: 작은 무리 단위로 베는 개벌\n· 대상개벌: 띠 모양으로 베는 개벌\n· 갱신: 새 숲 만들기\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-16", "subject": "조림", "num": 16, "part": 6, "stem": "직파(direct seeding) 방법으로 조림하기에 비교적 쉬운 수종만을 모두 고르면?\n\nㄱ. 벚나무\n\nㄴ. 분비나무\n\nㄷ. 전나무\n\nㄹ. 곰솔(해송)", "options": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 1, "explain": "· 벚나무·곰솔(해송)은 직파가 비교적 쉽다.\n· 분비나무·전나무는 어렵다.\n쉬운 풀이: 직파(씨 바로 뿌리기)가 쉬운 나무는 씨가 잘 싹 트고 어린 시절이 튼튼한 수종이에요. 벚나무와 곰솔(해송)이 그렇고, 분비나무·전나무는 어릴 때 약해서 직파가 어려워요.\n용어 풀이:\n· 직파: 씨앗을 조림지에 직접 뿌림\n· 곰솔(해송): 바닷가 소나무\n· 분비나무: 높은 산의 전나무류\n중요도: ★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-17", "subject": "조림", "num": 17, "part": 6, "stem": "어린나무 가꾸기에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 원하지 않는 수종으로부터 목표하는 수종을 보호하기 위해 실시한다.\n\nㄴ. 조림 이후에 조림목 간 수관 경쟁이 발생될 때 실시한다.\n\nㄷ. 형질 불량목 등을 제거하며, 연 3회 이상 실시한다.\n\nㄹ. 작업 시기는 수목 생육이 정지하는 11월 이후 겨울철이다.", "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "answer": 0, "explain": "· ㄱ·ㄴ이 옳다.\n· 어린나무가꾸기는 보통 연 1회, 6~9월(생육기)에 실시.\n쉬운 풀이: 어린나무가꾸기는 원하는 나무를 다른 잡목에게서 지키고(ㄱ), 나무끼리 수관 경쟁이 시작될 때 해요(ㄴ). 보통 1년에 1번, 나무가 자라는 6~9월에 해요. 연 3회·겨울은 틀렸어요.\n용어 풀이:\n· 어린나무가꾸기(제벌): 어린 숲의 잡목·불량목 제거\n· 수관 경쟁: 나무 윗부분끼리 공간 다툼\n· 생육기: 식물이 자라는 시기\n중요도: ★★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-18", "subject": "조림", "num": 18, "part": 6, "stem": "다음 설명에 해당하는 우리나라 천연림 숲가꾸기의 수형급은?\n\n○ 임분구성에 필요한 예비목\n\n○ 미래목과 함께 선발되지 못한 우세목\n\n○ 임분 밀도에 따라 간벌재 또는 미래목으로 대체", "options": ["보호목", "중용목", "무관목", "중립목"], "answer": 1, "explain": "미래목과 함께 선발되지 못한 우세목·예비목 = 중용목(천연림 숲가꾸기 수형급).\n쉬운 풀이: 천연림 숲가꾸기는 나무를 역할별로 나눠요. 미래목(최종 수확목), 중용목(미래목에 못 뽑힌 좋은 예비목), 보호목(미래목을 감싸 줌), 방해목(미래목을 방해해 제거), 무관목(관계없음). 예비목은 중용목이에요.\n용어 풀이:\n· 수형급: 나무 모양·역할에 따른 등급\n· 중용목: 예비로 남기는 우세목\n· 보호목: 미래목을 보호하는 나무\n중요도: ★★★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-19", "subject": "조림", "num": 19, "part": 6, "stem": "수목의 대사에 대한 설명으로 옳지 않은 것은?", "options": ["수목의 지질 함량은 겨울철에 높아지고 여름철에 낮아진다.", "수목세포 내의 단백질 함량은 동물세포에 비해 현저히 낮다.", "질소는 여러 대사작용에 직접 관여하기 때문에 잎, 분열조직, 형성층 등에서 함량이 높다.", "전분은 저장탄수화물로서 체내에서 이동되지 않기 때문에 단단하고 두꺼운 2차세포벽이 있는 후벽세포 내에 저장된다."], "answer": 3, "explain": "전분은 이동하지 않는 저장 탄수화물로 유세포에 저장된다.\n쉬운 풀이: 전분은 몸속에서 이동하지 않는 저장 양분이에요. 그런데 저장은 살아 있는 세포(유세포)에서 해요. 두꺼운 세포벽의 후벽세포는 대부분 죽은 세포라 저장고가 될 수 없어요.\n용어 풀이:\n· 유세포: 살아 있는 얇은 벽 세포\n· 후벽세포: 벽이 두꺼운 지지 세포\n· 저장탄수화물: 저장용 당류\n중요도: ★", "ref": "", "exam": "2026 조림"}, {"id": "9급-2026-조림-20", "subject": "조림", "num": 20, "part": 6, "stem": "종자의 발아에 대한 설명으로 옳지 않은 것은?", "options": ["산소 흡수속도는 종자 발아의 지표로 이용될 수 있다.", "고농도 이산화탄소는 때때로 종자 휴면에 영향을 줄 수 있다.", "에틸렌은 식물체 내에서 생성되는 생장조절물질로 종자 휴면을 촉진시킨다.", "파이토크롬(phytochrome)이 빛의 파장에 가역적으로 반응하기 때문에 발아가 억제되거나 촉진된다."], "answer": 2, "explain": "에틸렌은 종자 휴면을 타파하고 발아를 촉진한다.\n쉬운 풀이: 에틸렌은 씨앗의 휴면을 깨고 싹 트기를 '촉진'해요. 휴면을 유지시키는 건 아브시스산(ABA)이에요. 파이토크롬은 빛(적색·원적색)에 반응해 발아를 켰다 껐다 해요.\n용어 풀이:\n· 에틸렌: 기체 식물호르몬\n· 파이토크롬: 빛을 감지하는 색소 단백질\n· 휴면: 싹 트지 않는 상태\n중요도: ★", "ref": "", "exam": "2026 조림"}]}, {"name": "2026 임업경영", "year": "2026", "subject": "임업경영", "questions": [{"id": "9급-2026-임업경영-1", "subject": "임업경영", "num": 1, "part": 6, "stem": "임분차원(stand level)의 거리독립경쟁지수가 아닌 것은?", "options": ["입목도", "상대공간지수", "생육공간지수", "Reineke의 임분밀도지수"], "answer": 2, "explain": "공식 정답 ③. 입목도·상대공간지수·Reineke 임분밀도지수는 임분 수준 거리독립 경쟁지수.\n쉬운 풀이: 경쟁지수는 나무들이 서로 얼마나 경쟁하는지 나타내요. 임분 전체 밀도로 보는 '거리독립' 지수에는 입목도, 상대공간지수, Reineke 임분밀도지수가 있어요. 공식 정답은 ③(생육공간지수)이에요.\n용어 풀이:\n· 경쟁지수: 나무 간 경쟁 정도 지표\n· 거리독립: 나무 사이 거리 정보를 쓰지 않음\n· 임분: 비슷한 나무로 된 숲 단위\n중요도: ★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-2", "subject": "임업경영", "num": 2, "part": 6, "stem": "2020년 기준 산림의 공익기능 가치가 가장 높게 평가된 것은?", "options": ["수원함양", "온실가스흡수ㆍ저장", "토사유출방지", "생물다양성보전"], "answer": 1, "explain": "2020년 산림 공익기능 평가에서 온실가스 흡수·저장 가치가 가장 컸다.\n쉬운 풀이: 산림이 주는 공익 가치(물 저장·탄소 흡수·산사태 방지 등)를 돈으로 따진 결과, 2020년에는 온실가스 흡수·저장 기능의 가치가 가장 컸어요. 기후변화 시대라 탄소 가치가 크게 평가돼요.\n용어 풀이:\n· 공익기능: 사회 전체에 주는 숲의 혜택\n· 온실가스: 지구를 덥게 하는 기체(CO₂ 등)\n중요도: ★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-3", "subject": "임업경영", "num": 3, "part": 6, "stem": "기후변화 취약성 평가를 위한 규준(criteria)이 아닌 것은?", "options": ["민감성(sensitivity)", "일관성(consistency)", "적응성(adaptive capacity)", "노출(exposure)"], "answer": 1, "explain": "· 기후변화 취약성 = 노출\n· 민감성\n· 적응능력. 일관성은 아니다.\n쉬운 풀이: 기후변화 취약성은 얼마나 기후변화에 노출되고(노출), 얼마나 민감하게 피해를 받으며(민감성), 얼마나 적응할 수 있는지(적응능력)로 평가해요. 일관성은 기준이 아니에요.\n용어 풀이:\n· 취약성: 피해를 입기 쉬운 정도\n· 노출: 영향에 드러남\n· 적응능력: 변화에 맞춰 대응하는 힘\n중요도: ★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-4", "subject": "임업경영", "num": 4, "part": 6, "stem": "다음 이령림의 본수령[년]은?\n\n임령(년) | 10 | 20 | 30 | 40\n본수 | 100 | 200 | 300 | 400", "options": ["20", "25", "30", "35"], "answer": 2, "explain": "본수령 = Σ(임령 × 본수)/Σ본수 = (1,000 + 4,000 + 9,000 + 16,000)/1,000 = 30년\n쉬운 풀이: 본수령은 나무 수로 가중평균한 숲 나이예요. (10×100 + 20×200 + 30×300 + 40×400) ÷ (100+200+300+400) = 30,000 ÷ 1,000 = 30년. 나이 많은 나무가 많아서 단순 평균(25)보다 커요.\n용어 풀이:\n· 본수령: 본수 가중평균 임령\n· 가중평균: 양을 고려한 평균\n· 이령림: 나이가 다른 나무로 된 숲\n중요도: ★★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-5", "subject": "임업경영", "num": 5, "part": 6, "stem": "긴 회귀년에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 입목도를 낮추고자 할 때 선호된다.\n\nㄴ. 임도와 방화시설의 투자비가 많이 들 경우에 면적당 다량의 임목을 벌채하여 시설비로 충당하고자 할 때 선호된다.\n\nㄷ. 벌채작업 측면에서 단위면적당 많은 벌채를 해야만 유리하므로 선호된다.\n\nㄹ. 우량 임목을 생산할 수 있기 때문에 선호된다.", "options": ["ㄱ, ㄴ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ"], "answer": 2, "explain": "ㄱ·ㄴ·ㄷ이 긴 회귀년 선호 이유. 우량 임목 생산은 짧은 회귀년의 장점.\n쉬운 풀이: 회귀년은 같은 곳을 다시 택벌하는 간격이에요. 길게 잡으면 한 번에 많이 베니 입목도를 낮출 때(ㄱ), 임도 투자비를 벌채 수입으로 메울 때(ㄴ), 벌채 작업 효율을 높일 때(ㄷ) 좋아요. 우량 임목 생산은 짧은 회귀년이 유리해요.\n용어 풀이:\n· 회귀년: 택벌 구역을 다시 벌채하기까지 기간\n· 입목도: 나무가 차 있는 정도\n· 방화시설: 산불 방지 시설\n중요도: ★★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-6", "subject": "임업경영", "num": 6, "part": 6, "stem": "산림평가와 관련된 임업 경영요소에 대한 설명으로 옳은 것은?", "options": ["산림평가에서는 계산편의상 비용을 조림비, 육림비, 관리비, 지대, 채취비로 나누고 있다.", "산림의 주산물과 부산물을 수확하고 제품화하는 데 소요되는 비용을 채취비라고 한다.", "임지를 임목 육성 외의 용도로 전환하기 위한 임목벌채에서 얻어지는 임목 판매액은 간벌수익이라고 한다.", "조림비의 대부분은 묘목대이고, 노임은 작은 부분을 차지하고 있다."], "answer": 1, "explain": "주·부산물을 수확·제품화하는 비용 = 채취비. 용도전환 벌채 수익은 간벌수익이 아니며, 조림비의 대부분은 노임.\n쉬운 풀이: 주산물과 부산물을 수확해 제품으로 만드는 데 드는 비용이 채취비예요. 산림평가 비용은 조림비·관리비·지대·채취비로 나누고, 조림비의 대부분은 묘목값이 아니라 사람 인건비(노임)예요.\n용어 풀이:\n· 채취비: 수확·제품화에 드는 비용\n· 지대: 땅을 쓰는 대가\n· 노임: 일한 사람에게 주는 임금\n중요도: ★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-7", "subject": "임업경영", "num": 7, "part": 6, "stem": "소나무 임분의 흉고직경 40 cm인 임목이 10본, 각 임목의 수피 하 1 cm 내 연륜수가 5개, 임분재적생장량이 0.258㎥일 때, 슈나이더 (Schneider)식에 의한 임분의 생장률[%]은?", "options": ["2.25", "2.50", "2.75", "3.00"], "answer": 1, "explain": "Schneider식 P = K/(n·D). K = 500 적용 시 500/(5 × 40) = 2.50%. 임분재적생장량은 함정 조건.\n쉬운 풀이: Schneider 공식 P = K ÷ (n × D)에 넣으면, K = 500일 때 500 ÷ (5 × 40) = 2.5%예요. n은 껍질 안쪽 1cm 안 나이테 수, D는 흉고직경이에요. '임분재적생장량'은 쓰지 않는 함정 숫자예요.\n용어 풀이:\n· Schneider식: 나이테 수와 지름으로 생장률 추정\n· 수피 하: 껍질 바로 안쪽\n· 연륜수: 나이테 개수\n중요도: ★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-8", "subject": "임업경영", "num": 8, "part": 6, "stem": "임지평가에서 임지기망가법 적용상의 문제점에 대한 설명으로 옳은 것은?", "options": ["동일한 작업 방법을 영구적으로 계속함을 전제로 하나, 실제적으로 장기간에 걸쳐 동일한 시업방법을 영속한다는 것은 비현실적이다.", "어떤 시가로 거래되는 임지의 가격을 임지기망가법으로 산정하면 음(－)의 값이 나오는 경우가 없어 실제와 부합한다.", "수익과 비용이 수시로 변동하는 미래가를 적용하여 임지기망가의 값이 평가시점에 따라 불가변적이다.", "임업이자율의 대소가 임지기망가에 미치는 영향은 매우 작다."], "answer": 0, "explain": "· 임지기망가는 같은 시업을 영구히 반복한다고 가정하는 것이 비현실적이다.\n· 실제로는 음(−)의 값이 나올 수 있고, 이율의 영향이 매우 크다.\n쉬운 풀이: 임지기망가는 '같은 방식으로 영원히 조림·벌채를 반복한다'고 가정해요. 현실에선 수십~수백 년 같은 방식이 계속될 수 없으니 비현실적이에요. 또 실제로는 음(−)의 값도 나오고 이율 영향도 아주 커요.\n용어 풀이:\n· 임지기망가: 임지의 미래 순수익 현재가치\n· 시업방법: 산림 관리 방식\n· 영속: 영원히 계속됨\n중요도: ★★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-9", "subject": "임업경영", "num": 9, "part": 6, "stem": "「개발도상국 산림을 통한 온실가스 배출 감축 및 탄소 축적 증진 지원에 관한 법률」상 국외산림탄소축적증진 사업이 아닌 것은? (단, 제시된 사업은 국외산림탄소축적증진을 목적으로 한다)", "options": ["산림전용 방지에 관한 사업", "산림의 황폐화 방지에 관한 사업", "산림의 개발에 관한 사업", "지속가능한 산림관리에 관한 사업"], "answer": 2, "explain": "산림의 개발 사업은 국외산림탄소축적증진 사업이 아니다.\n쉬운 풀이: 국외산림탄소축적증진 사업은 개발도상국 숲을 지켜 탄소를 늘리는 사업이에요. 산림 전용·황폐화 방지, 지속가능한 산림관리가 해당하고, 숲을 개발하는 사업은 정반대라 아니에요.\n용어 풀이:\n· 산림전용: 숲을 다른 용도로 바꿈\n· 황폐화: 숲이 망가짐\n· 탄소축적: 탄소를 저장해 늘림\n중요도: ★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-10", "subject": "임업경영", "num": 10, "part": 6, "stem": "「산림자원의 조성 및 관리에 관한 법률 시행규칙」상 기준벌기령에 대한 설명으로 옳지 않은 것은?", "options": ["공ㆍ사유림의 산림경영계획에서 삼나무의 일반기준벌기령은 30년이다.", "국유림의 국유림경영계획에서 편백의 일반기준벌기령은 60년이다.", "임지생산능력급수 I급지부터 III급지까지의 지역에서 리기다소나무를 벌채하는 경우는 기준벌기령을 적용한다.", "소나무의 경우에는 특수용도기준벌기령을 적용하지 않는다."], "answer": 2, "explain": "공식 정답 ③. 임지생산능력 I~III급지의 리기다소나무 벌채에는 기준벌기령을 적용하지 않는다(시행규칙 별표 3). 삼나무 공·사유림 30년, 편백 국유림 60년은 맞다.\n쉬운 풀이: 기준벌기령 예외 규정이에요. 땅이 좋은(임지생산능력 Ⅰ~Ⅲ급) 곳의 리기다소나무는 다른 좋은 나무로 바꾸려고 언제든 벨 수 있게 기준벌기령을 '적용하지 않아요'. 그래서 ③이 틀렸어요.\n용어 풀이:\n· 기준벌기령: 벌채 가능한 최소 나이\n· 임지생산능력급수: 땅의 생산력 등급\n· 특수용도기준벌기령: 특정 용도에 쓰는 별도 벌기령\n중요도: ★★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-11", "subject": "임업경영", "num": 11, "part": 6, "stem": "공ㆍ사유림 경영계획 작성 및 운영요령 상 산림경영계획작성비의 지원대상 우선순위를 바르게 나열한 것은? (가) 경제림육성단지 (나) 보전산지 중 임업용산지 (다) 협업경영계획구 (라) 일단의 면적이 10 ha 이상인 산림", "options": ["(가), (나), (다), (라)", "(나), (가), (라), (다)", "(다), (가), (나), (라)", "(라), (나), (가), (다)"], "answer": 2, "explain": "🆕 공·사유림 경영계획 작성 및 운영요령(2026 모듈 개정): 작성비 지원 우선순위 = 협업경영계획구 → 경제림육성단지 → 임업용산지 → 10ha 이상 산림.\n쉬운 풀이: 2026년 개정된 경영계획 운영요령의 작성비 지원 우선순위예요. 협업경영계획구 → 경제림육성단지 → 임업용산지 → 10ha 이상 산림 순이에요. 여럿이 함께 경영하는 곳을 가장 먼저 지원해요.\n용어 풀이:\n· 협업경영계획구: 여러 산주가 함께 경영하는 계획구\n· 경제림육성단지: 목재 생산 중점 지역\n· 임업용산지: 임업용 보전산지\n중요도: ★★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-12", "subject": "임업경영", "num": 12, "part": 6, "stem": "지리정보시스템(GIS)의 벡터자료 분석기능에서 도형정보를 이용한 분석에 대한 설명으로 옳은 것은?", "options": ["Intersect는 하나의 도형정보 안에서 여러 개로 나누어진 같은 속성의 객체들을 하나의 객체로 합치는 기능이다.", "Clip은 공간상의 위치가 다른 2개 이상의 도형정보를 하나의 도형정보로 합쳐주는 기능이다.", "Union은 중첩연산에 의한 분석방법으로 입력자료 1과 입력자료 2의 도형정보 및 속성정보 모두가 합쳐지는 기능이다.", "Dissolve는 Clip기능과 유사한 중첩연산을 이용하는 분석방법으로, 입력자료 1과 입력자료 2와의 속성정보를 합하여 공통된 구역의 모양으로 잘라내는 기능이다."], "answer": 2, "explain": "· Union은 두 자료의 도형·속성을 모두 합친다.\n· Dissolve는 같은 속성 합치기, Clip은 잘라내기.\n쉬운 풀이: GIS 중첩 분석에서 Union은 두 지도의 도형과 속성을 모두 합쳐 줘요. Dissolve는 같은 속성끼리 합치기, Clip은 한 지도 모양대로 잘라내기, Intersect는 겹치는 부분만 남기기예요.\n용어 풀이:\n· GIS: 지리정보시스템\n· 중첩연산: 여러 지도를 겹쳐 분석\n· 속성정보: 지도 객체에 붙은 정보\n중요도: ★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-13", "subject": "임업경영", "num": 13, "part": 6, "stem": "국유림경영계획 작성 및 운영요령 상 국유림경영계획의 산림구획에서 소반 내 보조소반을 편성해야 하는 경우는?", "options": ["이용형태ㆍ수종그룹ㆍ계획기간동안 달리 취급할 필요가 있는 경우", "지종이 다른 경우", "임종ㆍ임상ㆍ영급이 다른 경우", "수확ㆍ갱신 방법이 다른 경우"], "answer": 0, "explain": "이용형태·수종그룹·계획기간 동안 달리 취급할 필요가 있으면 보조소반.\n쉬운 풀이: 국유림 산림구획에서 소반 안에서도 이용 형태·수종그룹·계획기간 동안 달리 관리해야 할 부분이 있으면 보조소반으로 따로 나눠요.\n용어 풀이:\n· 보조소반: 소반 안의 세부 구획\n· 소반: 임반을 나눈 작은 구획\n중요도: ★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-14", "subject": "임업경영", "num": 14, "part": 6, "stem": "국유림경영계획 작성 및 운영요령 상 국유림경영계획 수립 시 국유림 산림조사 대상에 반드시 포함되어야 하는 것은?", "options": ["신규 취득한 산림", "대부 또는 사용허가가 된 국유림", "민간인 통제선 북방지역의 국유림", "군사상의 목적 또는 시험연구의 목적으로 사용하는 국유림"], "answer": 0, "explain": "신규 취득한 산림은 반드시 조사 대상에 포함.\n쉬운 풀이: 국유림경영계획을 세울 때 새로 산 국유림은 상태를 모르니 반드시 산림조사를 해야 해요. 대부한 땅, 민통선 북쪽, 군사·연구용 국유림은 조사에서 빠질 수 있어요.\n용어 풀이:\n· 신규 취득: 새로 사들임\n· 대부: 빌려줌\n· 민간인 통제선: 민간인 출입이 제한된 군사 경계선\n중요도: ★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-15", "subject": "임업경영", "num": 15, "part": 6, "stem": "산림투자의 경제성 분석 방법에 대한 설명으로 옳은 것은?", "options": ["회수기간법은 투자안의 회수기간이 설정한 회수기간보다 짧으면 경제성이 있는 것으로 판단한다.", "순현재가치법에 따라 계산한 투자안의 순현재가치가 0보다 크면 투자가치가 없는 것으로 평가한다.", "편익비용비율법으로 계산한 투자안의 편익비용비율이 1.4이면 경제적 효율성을 고려하여 투자하지 않는 것으로 판단한다.", "내부수익률법으로 계산한 투자안의 내부수익률이 0.02이고, 시장이자율이 0.04이면 투자사업으로 가치가 있다고 판단한다."], "answer": 0, "explain": "회수기간이 기준보다 짧으면 경제성 있음. NPV > 0이면 투자 가치 있음, B/C > 1이면 투자, IRR < 시장이자율이면 가치 없음.\n쉬운 풀이: 회수기간법은 '투자금을 언제 돌려받나'를 봐요. 정해 둔 기간보다 빨리 회수되면 경제성이 있어요. NPV > 0, B/C > 1, IRR > 시장이자율이어야 투자 가치가 있으니 ②③④는 거꾸로예요.\n용어 풀이:\n· 회수기간법: 투자 회수 기간으로 판단 / 편익비용비율(B\n· C): 편익 ÷ 비용\n· 내부수익률(IRR): NPV를 0으로 만드는 수익률\n중요도: ★★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-16", "subject": "임업경영", "num": 16, "part": 6, "stem": "제6차 산림기본계획(변경)의 추진전략에서 ‘한국형 산림자원순환 경영으로 탄소중립 실현’의 핵심과제가 아닌 것은?", "options": ["국산목재 이용 촉진", "한반도 산림탄소흡수원 보전 및 복원", "스마트 임업으로 산림자원순환경영 활성화", "산림기반 융ㆍ복합 신산업 저변 확대"], "answer": 3, "explain": "'산림기반 융·복합 신산업 저변 확대'는 이 추진전략의 핵심과제가 아니다.\n쉬운 풀이: 제6차 산림기본계획의 '한국형 산림자원순환경영으로 탄소중립 실현' 전략에는 국산목재 이용 촉진, 산림탄소흡수원 보전·복원, 스마트 임업이 들어가요. 융·복합 신산업 확대는 다른 전략이에요.\n용어 풀이:\n· 탄소중립: 배출한 탄소만큼 흡수해 순배출 0\n· 산림자원순환경영: 심고 가꾸고 베고 다시 심는 순환 경영\n중요도: ★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-17", "subject": "임업경영", "num": 17, "part": 6, "stem": "다음 조건의 노령림이 많은 작업급에서 개량기간 중의 표준연벌 면적[ha/년]은?\n\n○ 작업급의 면적(ha): 2,000\n\n○ 갱신면적(ha): 200\n\n○ 개량기(년): 20", "options": ["60", "70", "80", "90"], "answer": 3, "explain": "노령림이 많을 때 개량기간 연벌면적 = (작업급 면적 − 갱신면적)/개량기 = 1,800/20 = 90ha/년\n쉬운 풀이: 노령림이 많으면 개량기 동안 갱신면적을 뺀 나머지를 나눠 베요. (작업급 면적 − 갱신면적) ÷ 개량기 = (2,000 − 200) ÷ 20 = 90ha/년이에요.\n용어 풀이:\n· 개량기: 불법정한 숲을 법정림에 가깝게 바꾸는 기간\n· 작업급: 같은 방식으로 경영하는 숲 단위\n· 표준연벌면적: 매년 벨 기준 면적\n중요도: ★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-18", "subject": "임업경영", "num": 18, "part": 6, "stem": "수입되는 목재ㆍ목재제품의 합법벌채 판단 세부기준 상 합법벌채된 목재 또는 목재제품임을 증명하는 서류에 해당하지 않는 것은?", "options": ["수입국의 법령에 따라 발급된 수입승인서", "FSC에 의해 발급된 산림경영인증, 임산물제품인증 서류", "수출국의 정부 또는 정부로부터 위임받은 기관에서 운영하는 산림인증제도에 따라 발급된 인증서류", "수출국의 법령에 따라 해당 목재 또는 목재제품이 합법벌채 되었음을 확인할 수 있는 수출허가서"], "answer": 0, "explain": "수입국(우리나라) 수입승인서는 합법벌채 증명서류가 아니다.\n쉬운 풀이: 수입 목재가 합법적으로 벌채됐다는 증명은 '수출국' 쪽 서류로 해요(수출국 수출허가서, FSC 인증, 수출국 정부 인증 등). 우리나라(수입국) 수입승인서는 합법벌채를 증명하지 못해요.\n용어 풀이:\n· 합법벌채: 법을 지켜 벤 것\n· FSC: 국제 산림인증 기관\n· 수출허가서: 수출을 허가한 문서\n중요도: ★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-19", "subject": "임업경영", "num": 19, "part": 6, "stem": "다음 법정림의 법정영급면적[ha]과 영급수[개]를 바르게 연결한 것은?\n\n산림면적 100ha · 윤벌기 40년 · 1개 영급의 영계수 10개", "options": ["법정영급면적 25 · 영급수 2", "법정영급면적 25 · 영급수 4", "법정영급면적 40 · 영급수 2", "법정영급면적 40 · 영급수 4"], "answer": 1, "explain": "법정영급면적 = A/U × n = 100/40 × 10 = 25ha, 영급수 = U/n = 40/10 = 4개\n쉬운 풀이: 법정영급면적 = 면적 ÷ 윤벌기 × 영계수 = 100 ÷ 40 × 10 = 25ha, 영급수 = 윤벌기 ÷ 영계수 = 40 ÷ 10 = 4개예요. 1년치 면적(2.5ha)에 10년치를 곱한 거라고 생각하면 쉬워요.\n용어 풀이:\n· 법정영급면적: 한 영급이 차지하는 법정 면적\n· 영계수: 한 영급에 들어가는 연령 수\n· 영급수: 영급의 개수\n중요도: ★★★", "ref": "", "exam": "2026 임업경영"}, {"id": "9급-2026-임업경영-20", "subject": "임업경영", "num": 20, "part": 6, "stem": "신규조림/재조림 청정개발체제(A/R CDM) 사업에 의한 온실가스 배출 감축량 산정에 대한 설명으로 옳지 않은 것은?", "options": ["사업자는 베이스라인 및 모니터링 방법론에 대하여 사업대상지의 특성에 따라 기존 등록되어 있는 방법론을 선택하거나 또는 사업에 적합한 방법론을 개발하여 사용할 수 있다.", "베이스라인 시나리오란 A/R CDM 활동이 시행되지 않을 경우, 대상지의 토지이용계획에 따라 나타나는 탄소축적량 변화 추이이다.", "탄소저장고는 사업대상지 내 탄소축적량 변화에 관여하는 온실가스 흡수원으로서 지상부 및 지하부 바이오매스, 낙엽, 고사목 및 토양유기물 등이다.", "대상지 구획화는 대상지의 탄소저장고인 목본식물과 다년생 관목의 지상부와 지하부 바이오매스로 구분하는 과정이다."], "answer": 3, "explain": "· 대상지 구획화는 토지·식생 특성이 비슷한 구역으로 나누는 과정이다.\n· 바이오매스 구분이 아니다.\n쉬운 풀이: A/R CDM은 숲을 새로 만들어 탄소를 줄이는 국제 사업이에요. '대상지 구획화'는 땅을 토지이용·식생이 비슷한 구역으로 나누는 과정이지, 바이오매스를 지상부·지하부로 나누는 게 아니에요.\n용어 풀이:\n· A\n· R CDM: 신규조림·재조림 청정개발체제\n· 베이스라인: 사업이 없을 때의 상태\n· 탄소저장고: 탄소가 저장되는 곳(바이오매스·토양 등)\n중요도: ★", "ref": "", "exam": "2026 임업경영"}]}, {"name": "2025 조림", "year": "2025", "subject": "조림", "questions": [{"id": "9급-2025-조림-1", "subject": "조림", "num": 1, "part": 6, "stem": "열대우림의 특성으로 옳지 않은 것은?", "options": ["많은 강우량이 지속되며 연중 고온으로 순생산성이 높다.", "상관은 단조로우나 종다양성이 매우 높다.", "만경식물과 착생식물의 비율이 높다.", "유기물 분해 속도가 빠르고 토양의 비옥도가 높다."], "answer": 3, "explain": "열대우림은 분해가 빠르지만 양분이 쉽게 용탈되어 토양이 척박하다.\n쉬운 풀이: 열대우림은 덥고 비가 많아 낙엽이 아주 빨리 썩어요. 하지만 그 양분을 식물이 금방 흡수하고, 많은 비에 씻겨 나가서 흙 자체는 오히려 척박해요. '분해가 빠르니 흙이 비옥하다'는 함정이에요.\n용어 풀이:\n· 열대우림: 적도 부근의 덥고 습한 숲\n· 순생산성: 식물이 만든 순수 생산량\n· 만경식물: 덩굴식물\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-2", "subject": "조림", "num": 2, "part": 6, "stem": "숲의 종류에 대한 설명으로 옳지 않은 것은?", "options": ["교림은 일반적으로 종자에서 발생한 치수가 기원이 되어 이루어진 숲이다.", "순림은 보호관리에 많은 경비가 소요되어 경제성이 낮다.", "동령림은 흉고직경급별 본수가 정규분포를 이룬다.", "침엽수림은 수목의 줄기가 곧고 재질이 좋아 목재 생산에 유리하다."], "answer": 1, "explain": "· 순림은 관리·작업이 간편하고 경제적이다.\n· 보호관리 경비가 많이 든다는 설명은 틀림.\n쉬운 풀이: 한 가지 나무만 있는 순림은 관리·작업이 간단하고 경제적이에요. 병해충에는 약할 수 있지만 '보호관리에 경비가 많이 들어 경제성이 낮다'는 설명은 틀렸어요.\n용어 풀이:\n· 순림: 한 수종으로 된 숲\n· 교림: 씨앗에서 자란 키 큰 나무 숲\n· 동령림: 나이가 같은 숲\n중요도: ★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-3", "subject": "조림", "num": 3, "part": 6, "stem": "산불이 산림식생에 미치는 영향에 대한 설명으로 옳지 않은 것은?", "options": ["산불 발생 후 소생력은 참나무류보다 소나무가 강한 편이다.", "줄기의 피해는 주로 형성층 조직이 상처를 입음으로써 발생한다.", "지표화로부터 임목의 밑가지에 불이 닿고 바람과 불길이 세어지면 수관화로 이어진다.", "수관화는 수목에 큰 피해를 주며, 임분이 전소할 수 있고 비화로 이어질 수 있다."], "answer": 0, "explain": "소나무는 맹아력이 약해 산불 후 소생력이 참나무류보다 약하다.\n쉬운 풀이: 산불 뒤 살아남아 다시 싹을 내는 힘(소생력)은 맹아력이 강한 참나무류가 커요. 소나무는 그루터기에서 싹이 거의 안 나서 소생력이 약해요. ①은 반대로 써서 틀렸어요.\n용어 풀이:\n· 소생력: 피해 후 다시 살아나는 힘\n· 수관화: 나무 윗부분까지 타는 산불\n· 비화: 불씨가 날아가 번짐\n중요도: ★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-4", "subject": "조림", "num": 4, "part": 6, "stem": "삽목묘 양성에 대한 설명으로 옳은 것은?", "options": ["수목의 가지, 뿌리, 잎, 눈의 일부를 완전한 개체로 발달시키는 방법이다.", "아까시나무, 포플러류, 동백나무는 발근이 어려운 수종이다.", "소나무, 상수리나무, 팽나무는 발근이 용이한 수종이다.", "줄기 삽수의 기극에서는 줄기가 발생한다."], "answer": 0, "explain": "· 삽목은 영양기관 일부로 개체를 만드는 방법. 아까시·포플러는 발근이 쉽고, 소나무·상수리는 어렵다.\n· 기극(아래쪽)에서는 뿌리가 생긴다.\n쉬운 풀이: 삽목은 가지·뿌리·잎·눈 일부를 잘라 완전한 나무로 키우는 방법이에요. 아까시·포플러는 뿌리가 잘 나고, 소나무·상수리는 잘 안 나요. 잘린 가지 아래쪽(기극)에서는 뿌리가 나요.\n용어 풀이:\n· 삽목: 꺾꽂이\n· 기극: 삽수의 아래쪽 끝\n· 정극: 삽수의 위쪽 끝\n중요도: ★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-5", "subject": "조림", "num": 5, "part": 6, "stem": "무성번식에 대한 설명으로 옳은 것은?", "options": ["암ㆍ수 배우자 간의 접합을 통해 번식한다.", "같은 개체 내의 암술과 수술 사이에서 수분이 일어난 것이다.", "피자식물은 중복수정하고, 나자식물은 단일수정한다.", "하나의 모체에서 번식된 개체들은 동일한 유전정보를 갖는다."], "answer": 3, "explain": "무성번식으로 생긴 개체(클론)는 모체와 유전정보가 같다.\n쉬운 풀이: 무성번식은 꽃가루와 밑씨가 만나지 않고 몸 일부로 번식하는 거예요. 그래서 한 어미에서 나온 자손은 유전정보가 모두 같아요(클론). ①~③은 유성번식(수정) 설명이에요.\n용어 풀이:\n· 무성번식: 수정 없이 몸 일부로 번식\n· 유성번식: 암수 배우자의 수정으로 번식\n· 중복수정: 속씨식물의 두 번 수정\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-6", "subject": "조림", "num": 6, "part": 6, "stem": "수목의 근계에 대한 설명으로 옳은 것은?", "options": ["낙우송과 자작나무는 심근성이기 때문에 건조에 강하다.", "건조한 지역에 자라는 수목은 지하부에 대한 지상부의 비율이 낮다.", "일본잎갈나무와 소나무는 천근성이기 때문에 건조에 약하다.", "일반적으로 사토보다 식토에서 근계가 깊게 발달하는 경향이 있다."], "answer": 1, "explain": "· 건조지 수목은 뿌리를 많이 만들어 지상부/지하부 비율이 낮다.\n· 낙우송·자작나무는 천근성, 소나무는 심근성, 근계는 사토에서 더 깊다.\n쉬운 풀이: 건조한 곳의 나무는 물을 찾으려고 뿌리를 많이 키워서 지상부/지하부 비율이 낮아요. 낙우송·자작나무는 천근성, 소나무는 심근성이고, 뿌리는 단단한 식토보다 성긴 사토에서 깊게 뻗어요.\n용어 풀이:\n· 근계: 뿌리 전체\n· 심근성: 뿌리가 깊게 뻗음\n· 사토·식토: 모래흙·진흙\n중요도: ★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-7", "subject": "조림", "num": 7, "part": 6, "stem": "모수림작업에 대한 설명으로 옳지 않은 것은?", "options": ["토양 침식과 표토 유실 등이 우려된다.", "모수 수종 선택에 제한을 받는다.", "벌채가 까다롭고 어린나무에 손상을 줄 수 있다.", "벌채가 일시에 집중되어 경비가 절약된다."], "answer": 2, "explain": "· 모수림작업은 벌채가 간단하다.\n· '벌채가 까다롭고 어린나무 손상'은 산벌·택벌작업의 단점.\n쉬운 풀이: 모수림작업은 어미나무만 남기고 다 베니 벌채가 한 번에 끝나 간단하고 경비도 아껴요. '벌채가 까다롭고 어린나무를 다치게 한다'는 건 여러 번 나눠 베는 산벌·택벌작업의 단점이에요.\n용어 풀이:\n· 모수림작업: 어미나무만 남기는 갱신법\n· 표토 유실: 겉흙이 쓸려 감\n중요도: ★★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-8", "subject": "조림", "num": 8, "part": 6, "stem": "덩굴제거(vine cutting)에 대한 설명으로 옳지 않은 것은?", "options": ["덩굴식물이 수관을 덮어 생육에 장애를 주고, 줄기를 감아 잘록 해지면 목재가치가 떨어진다.", "산림 내 덩굴식물에는 다래, 머루, 마삭줄, 으아리 등이 있다.", "칡의 경우 주두부나 줄기에 약제를 주입하여 처리한다.", "임관이 형성된 후에는 실시하지 않는다."], "answer": 3, "explain": "덩굴은 임관이 형성된 뒤에도 피해가 있으면 제거한다.\n쉬운 풀이: 덩굴은 숲이 다 자란 뒤에도 나무를 감고 올라가 피해를 줘요. 그래서 임관이 형성된 후에도 필요하면 덩굴제거를 해요. '실시하지 않는다'가 틀렸어요.\n용어 풀이:\n· 덩굴제거: 덩굴식물을 없애는 작업\n· 임관: 숲 윗부분의 지붕\n· 주두부: 칡 뿌리 위 굵은 머리 부분\n중요도: ★★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-9", "subject": "조림", "num": 9, "part": 6, "stem": "산림 갱신 작업종에 대한 설명으로 옳은 것은?", "options": ["교호대상개벌법은 전임분을 3개의 조로 나누고, 다시 각 조는 3개의 대로 구분한다.", "군상개벌천연하종갱신은 지형이 불규칙하고 험준하며, 일제성이 없는 동령림에 적용한다.", "산벌작업에서 예비벌은 1회, 하종벌은 3회의 벌채로 목적을 달성하는 것이 바람직하다.", "보잔모수법은 모수림작업법보다 모수의 수를 적게 남겨 품질 좋은 대경재 생산을 목적으로 한다."], "answer": 1, "explain": "· 군상개벌천연하종갱신 설명이 옳다.\n· 교호대상개벌은 2개 조, 산벌의 예비벌·하종벌은 1회씩이고, 보잔모수법은 모수를 더 많이 남긴다.\n쉬운 풀이: 군상개벌천연하종갱신은 지형이 복잡하고 나무가 고르지 않은 숲에서 작은 덩어리로 베어 주변 나무 씨로 갱신하는 방법이에요. 교호대상개벌은 2조, 산벌 예비벌·하종벌은 보통 1회씩, 보잔모수법은 모수를 더 많이 남겨요.\n용어 풀이:\n· 군상개벌: 작은 무리 단위 개벌\n· 보잔모수법: 모수를 많이 남겨 대경재를 키우는 방법\n· 하종벌: 씨를 떨어뜨리는 벌채\n중요도: ★★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-10", "subject": "조림", "num": 10, "part": 6, "stem": "Oliver(1981)는 교란 이후의 산림천이에 대해 4단계의 임분 발달 모델을 제시하였다. 다음 현상이 모두 나타나는 임분 발달 단계는?\n\n○ 수관이 울폐됨\n\n○ 피압된 치수는 고사함\n\n○ 수목 갱신은 제한되거나 정지함", "options": ["임분 시작(임분 이입기)", "수간 배제(수관 경쟁기)", "하층 재진입(하층 재형성기)", "노령림(장령기)"], "answer": 1, "explain": "울폐·피압 치수 고사·갱신 정지 = Oliver의 수간 배제(수관 경쟁)기.\n쉬운 풀이: Oliver의 4단계: 임분 시작 → 수간 배제(수관 경쟁) → 하층 재진입 → 노령림. 숲이 꽉 닫히고 그늘에 눌린 어린나무가 죽으며 새 나무가 못 자라는 시기는 '수간 배제기'예요.\n용어 풀이:\n· 임분 발달 단계: 숲이 자라는 단계\n· 수관 울폐: 나무 윗부분이 꽉 닫힘\n· 피압: 눌려서 자라지 못함\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-11", "subject": "조림", "num": 11, "part": 6, "stem": "산림천이 용어에 대한 설명으로 옳지 않은 것은?", "options": ["교란: 산불, 바람, 병해충, 개벌 등 기존 생태계를 파괴하는 외부 요인에 의한 사건", "천이계열: 초기 식생이 극상군집까지 지속적인 변화 과정을 거치는 일련의 천이단계", "이차천이: 식물군집이 있던 곳에 교란으로 식물군집이 훼손된 후 다시 시작되는 천이", "자발천이: 생태계 내의 생물상이 없는 곳에서 외부 요인에 의해 유발되는 천이"], "answer": 3, "explain": "외부 요인으로 유발되는 천이는 타발천이. 자발천이는 생물 자체의 작용으로 일어난다.\n쉬운 풀이: 천이는 외부 요인으로 생기면 타발천이, 생물 자체의 작용으로 생기면 자발천이예요. ④는 자발천이를 '외부 요인'이라고 해서 틀렸어요.\n용어 풀이:\n· 천이: 식물 군집이 시간에 따라 바뀌는 과정\n· 교란: 산불·벌채 등 생태계를 흔드는 사건\n· 극상: 천이의 마지막 안정 단계\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-12", "subject": "조림", "num": 12, "part": 6, "stem": "산림생태계 복원 관련 용어에 대한 설명으로 옳은 것은?", "options": ["대체(replacement): 현재의 상태를 개선하기 위하여 다른 생태계로 변화시키는 행위", "향상(enhancement): 환경 피해를 완화하기 위한 행위", "개조(remediation): 최소 과거 50년 동안 산림이 없는 지역에 산림을 조성하는 것", "복원(restoration): 환경의 피해를 멈추거나 교정하여 생태계를 좋게 만드는 행위"], "answer": 0, "explain": "· 대체(replacement) 정의가 옳다.\n· 나머지는 용어와 정의를 서로 바꿔 놓았다.\n쉬운 풀이: 복원 용어 중 '대체'는 지금 상태를 개선하려고 아예 다른 생태계로 바꾸는 거예요. 나머지 보기는 용어와 정의를 서로 뒤섞어 놓았어요.\n용어 풀이:\n· 대체(replacement): 다른 생태계로 바꿈\n· 복원(restoration): 원래 상태로 되돌림\n· 개조: 일부를 고쳐 바꿈\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-13", "subject": "조림", "num": 13, "part": 6, "stem": "임목 종자 발아에 대한 설명으로 옳은 것은?", "options": ["소나무는 빛이 있을 때보다 없을 때 발아가 촉진된다.", "아브시스산은 지베렐린 생산을 촉진하여 발아율을 높인다.", "잣나무와 목련은 가을에 파종하면 발아가 촉진된다.", "박달나무는 상수리나무보다 발아율과 효율이 높다."], "answer": 2, "explain": "잣나무·목련 등 휴면이 깊은 종자는 가을 파종(또는 노천매장)이 유리. 소나무는 광발아, ABA는 발아 억제, 박달나무는 발아율이 낮다.\n쉬운 풀이: 잣나무·목련 씨는 겨울 추위를 겪어야 휴면이 깨져서 가을에 뿌리면 발아가 잘 돼요. 소나무는 빛이 있어야 잘 싹 트고(광발아), 아브시스산은 발아를 막아요.\n용어 풀이:\n· 추파: 가을 파종\n· 광발아종자: 빛이 있어야 잘 싹 트는 씨\n· 발아율: 싹 튼 비율\n중요도: ★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-14", "subject": "조림", "num": 14, "part": 6, "stem": "수목의 수분생리에 대한 설명으로 옳지 않은 것은?", "options": ["팽압은 세포의 확장, 기공 개폐, 어린잎의 모양을 유지하는 데 필요하다.", "수분퍼텐셜은 물이 이동하는 데 사용할 수 있는 에너지의 양을 뜻한다.", "세포의 물은 삼투현상에 의해 용질의 농도가 낮은 곳에서 높은 곳으로 이동한다.", "수분퍼텐셜은 잎이 가장 높고, 줄기가 중간이고, 뿌리가 가장 낮다."], "answer": 3, "explain": "수분퍼텐셜은 토양 > 뿌리 > 줄기 > 잎 순으로 낮아진다(잎이 가장 낮음).\n쉬운 풀이: 물은 수분퍼텐셜이 높은 곳에서 낮은 곳으로 흘러요. 그래서 흙 > 뿌리 > 줄기 > 잎 순으로 낮아져야 물이 잎까지 올라가요. 잎이 가장 '낮아요'. ④는 거꾸로예요.\n용어 풀이:\n· 수분퍼텐셜: 물의 이동 방향을 정하는 에너지\n· 팽압: 세포 안 물이 벽을 미는 압력\n· 삼투: 농도가 높은 쪽으로 물이 이동\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-15", "subject": "조림", "num": 15, "part": 6, "stem": "활엽수종의 열매 분류에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 견과는 2개 또는 여러 개의 심피가 유합하여 1실 또는 여러 실로 된 자방을 만들고 각 심피에 종자가 붙어 있다.\n\nㄴ. 삭과는 과피가 목질 또는 혁질로 되어 있으며, 그 안에 1개의 종자가 들어 있으나 과피와 종자가 밀착하지 않는다.\n\nㄷ. 시과는 과피가 발달하여 날개처럼 된 것을 말하며, 물푸레 나무가 이에 해당된다.\n\nㄹ. 장과는 과피가 3개의 층으로 뚜렷이 나누어진다.", "options": ["ㄷ", "ㄱ, ㄴ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ"], "answer": 0, "explain": "· ㄷ(시과–물푸레나무)만 옳다.\n· ㄱ은 삭과, ㄴ은 견과 설명이며, 과피 3층이 뚜렷한 것은 핵과.\n쉬운 풀이: 열매 종류: 시과는 날개 달린 열매(물푸레·단풍나무), 견과는 단단한 껍질에 씨 하나(도토리·밤), 삭과는 여러 칸으로 갈라지는 열매예요. ㄱ은 삭과, ㄴ은 견과 설명이라 ㄷ만 옳아요.\n용어 풀이:\n· 시과: 날개 모양 열매\n· 견과: 딱딱한 껍질 열매\n· 삭과: 익으면 갈라지는 열매\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-16", "subject": "조림", "num": 16, "part": 6, "stem": "묘포 적지 선정 기준에 대한 설명으로 옳은 것은?", "options": ["일반적으로 토심이 깊고, 부식질이 많은 사질양토가 좋다.", "침엽수종을 위한 토양은 알칼리성(pH 7.0 이상)이 적당하다.", "관수와 배수를 고려하면 10 ° 이상의 경사지가 좋다.", "따뜻한 남쪽 지방에서는 남향이 적합하다."], "answer": 0, "explain": "묘포는 토심 깊고 부식질 많은 사질양토. 침엽수는 약산성(pH 5~6), 경사는 5° 이하 완경사, 남쪽 지방은 북향이 알맞다.\n쉬운 풀이: 묘포는 흙이 깊고 부식질이 많은 사질양토가 좋아요. 침엽수는 약산성(pH 5~6), 경사는 5° 이하로 완만하게, 남쪽 따뜻한 지방은 너무 덥지 않게 북향이 좋아요.\n용어 풀이:\n· 묘포: 묘목 키우는 밭\n· 사질양토: 모래가 적당히 섞인 흙\n· 부식질: 썩은 유기물\n중요도: ★★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-17", "subject": "조림", "num": 17, "part": 6, "stem": "산벌작업의 장점만을 모두 고르면?\n\nㄱ. 갱신되는 임분의 유전적 형질을 개량할 수 있다.\n\nㄴ. 성숙한 임목의 보호 아래에서 동령림이 갱신될 수 있는 방법이다.\n\nㄷ. 천연갱신으로 진행할 때 갱신기간이 길어진다.\n\nㄹ. 윤벌기가 끝나기 전에 갱신이 이미 시작되어 윤벌기간을 단축할 수 있다.", "options": ["ㄱ, ㄴ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ"], "answer": 2, "explain": "ㄱ·ㄴ·ㄹ이 장점. 갱신기간이 길어지는 것(ㄷ)은 장점이 아니다.\n쉬운 풀이: 산벌작업 장점: 유전 형질을 개량할 수 있고(ㄱ), 큰 나무 보호 아래 동령림이 갱신되며(ㄴ), 윤벌기 끝나기 전에 갱신이 시작돼 기간을 줄여요(ㄹ). 갱신기간이 길어지는 건 단점이에요.\n용어 풀이:\n· 산벌작업: 여러 번 나눠 베는 갱신법\n· 갱신기간: 새 숲이 자리 잡는 기간\n· 윤벌기: 숲 전체를 다 베는 주기\n중요도: ★★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-18", "subject": "조림", "num": 18, "part": 6, "stem": "자연전지에 대한 설명으로 옳은 것은?", "options": ["임분밀도가 높을수록 자연적으로 고사하는 가지가 굵어진다.", "소나무는 한랭 건조한 북부 지역보다 온난 다습한 남부 지역에서 고사지의 탈락이 빠르다.", "잔지의 매입은 줄기의 직경 생장속도보다 잔지의 굵기와 상관이 높다.", "밑가지의 고사 속도는 주로 임분의 후기 밀도와 관련이 깊다."], "answer": 1, "explain": "공식 정답 ②. 밀도가 높을수록 고사지는 가늘어진다.\n쉬운 풀이: 자연전지는 아래 가지가 그늘 때문에 스스로 죽어 떨어지는 현상이에요. 소나무는 따뜻하고 습한 남부에서 죽은 가지가 빨리 썩어 떨어져요(②). 숲이 빽빽할수록 가지는 가늘어져요.\n용어 풀이:\n· 자연전지: 가지가 스스로 말라 떨어짐\n· 고사지: 죽은 가지\n· 잔지: 남아 있는 가지 밑동\n중요도: ★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-19", "subject": "조림", "num": 19, "part": 6, "stem": "다음 순환택벌 모식도에 적용된 회귀년(가)과 윤벌기(나)를 바르게 연결한 것은? (단, 모식도의 숫자는 수령을 의미한다)\n\n임분 A | 임분 B | 임분 C | 임분 D | 임분 E\n1, 6, 11, 16, 21, 26 | 2, 7, 12, 17, 22, 27 | 3, 8, 13, 18, 23, 28 | 4, 9, 14, 19, 24, 29 | 5, 10, 15, 20, 25, 30", "options": ["(가) 5년 · (나) 5년", "(가) 5년 · (나) 6년", "(가) 5년 · (나) 30년", "(가) 30년 · (나) 30년"], "answer": 2, "explain": "임분 A~E가 매년 하나씩 돌아가며 벌채 → 같은 임분은 5년마다(회귀년), 최고 수령 30년(윤벌기).\n쉬운 풀이: 임분 A~E가 1년에 하나씩 돌아가며 벌채돼요. 그러면 같은 임분은 5년마다 다시 벌채돼서 회귀년은 5년이고, 가장 나이 많은 나무가 30년이니 윤벌기는 30년이에요.\n용어 풀이:\n· 순환택벌: 구역을 돌아가며 택벌\n· 회귀년: 같은 구역을 다시 베는 간격\n· 윤벌기: 나무를 베는 나이\n중요도: ★★★", "ref": "", "exam": "2025 조림"}, {"id": "9급-2025-조림-20", "subject": "조림", "num": 20, "part": 6, "stem": "우리나라 산림토양에 대한 설명으로 옳은 것은?", "options": ["산림토양은 농경지토양에 비해 용적밀도가 높다.", "갈색산림토양군은 화강암과 사암 모재에서 유래한다.", "토양 내 식물유효수분 함량은 사토보다 양토에서 높다.", "주요 분포 토양은 미숙 토양인 엔티솔(Entisols)과 알피솔(Alfisols) 이다."], "answer": 2, "explain": "· 식물유효수분은 사토보다 양토에서 많다.\n· 산림토양은 용적밀도가 낮고, 주요 토양은 인셉티솔·엔티솔.\n쉬운 풀이: 식물이 쓸 수 있는 물(유효수분)은 모래흙(사토)보다 양토에 더 많아요. 모래는 물이 금방 빠지기 때문이에요. 산림토양은 낙엽·뿌리 덕에 푹신해서 용적밀도가 낮아요.\n용어 풀이:\n· 유효수분: 식물이 흡수할 수 있는 물\n· 용적밀도: 흙 부피당 무게\n· 양토: 모래·미사·점토가 고르게 섞인 흙\n중요도: ★", "ref": "", "exam": "2025 조림"}]}, {"name": "2025 임업경영", "year": "2025", "subject": "임업경영", "questions": [{"id": "9급-2025-임업경영-1", "subject": "임업경영", "num": 1, "part": 6, "stem": "우리나라 임업의 기술적 특성에 대한 설명으로 옳지 않은 것은?", "options": ["임목의 성숙기는 경영주의 경영목적에 따라 다를 수 있다.", "파종, 식재, 시비 등 인위적 조절 요인이 많아 토지에 대한 요구도가 높다.", "생산기간이 길기 때문에 대부분 부업 또는 겸업적으로 경영된다.", "농업이나 축산업을 할 수 없는 곳에서 경영할 수 있는 이점이 있다."], "answer": 1, "explain": "임업은 조방적이라 토지에 대한 요구도가 낮다(농업이 불가능한 곳에서도 경영).\n쉬운 풀이: 임업은 농업처럼 비료·물 관리를 많이 하지 않는 조방적 산업이라 땅에 대한 요구가 적어요. 농사가 안 되는 산에서도 할 수 있죠. '토지 요구도가 높다'는 틀렸어요.\n용어 풀이:\n· 조방적: 노동·자본을 적게 들이는\n· 성숙기: 다 자라는 시기\n· 겸업: 다른 일과 함께 함\n중요도: ★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-2", "subject": "임업경영", "num": 2, "part": 6, "stem": "회귀년 길이에 대한 설명으로 옳은 것은?", "options": ["벌채작업 면에서 집재, 운재를 고려하면 짧은 회귀년이 유리하다.", "조림의 기술적인 면에서는 긴 회귀년이 유리하다.", "산림의 보호적인 면에서는 긴 회귀년이 유리하다.", "기반시설 면에서 시설의 투자비가 많이 들 때는 긴 회귀년이 유리하다."], "answer": 3, "explain": "시설 투자비가 많이 들면 긴 회귀년으로 한 번에 많이 벌채해 충당. 집재·운재는 긴 회귀년, 조림 기술·보호는 짧은 회귀년이 유리.\n쉬운 풀이: 회귀년이 길면 한 번에 많이 벨 수 있어서 임도 같은 시설비를 벌채 수입으로 충당하기 좋아요(④). 반대로 조림 기술·숲 보호 면에선 자주 손보는 짧은 회귀년이 유리해요.\n용어 풀이:\n· 회귀년: 택벌을 다시 하는 간격\n· 기반시설: 임도·방화선 등\n· 집재·운재: 모으기·운반하기\n중요도: ★★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-3", "subject": "임업경영", "num": 3, "part": 6, "stem": "법정림에 대한 설명으로 옳은 것은?", "options": ["같은 해의 법정춘계축적은 법정추계축적보다 벌기평균생장량만큼 많다.", "전임분의 법정생장량은 벌기임분재적에서 벌기 직전 영계의 임분재적을 제외한 재적이다.", "법정영급면적을 계산할 때, 갱신기가 필요한 경우에는 윤벌령과 갱신기의 합으로 윤벌기를 구한다.", "법정임분배치는 지황, 임황 및 반출시설에 상관없이 동일해야 한다."], "answer": 2, "explain": "갱신기가 필요하면 윤벌기 = 윤벌령 + 갱신기. 추계축적은 춘계축적보다 1년 생장량만큼 많고, 법정생장량은 벌기임분재적과 같다.\n쉬운 풀이: 법정영급면적을 계산할 때, 베고 나서 새 숲이 자리 잡는 기간(갱신기)이 필요하면 윤벌기 = 윤벌령 + 갱신기로 계산해요(③). 추계축적은 춘계보다 1년 생장량만큼 많고, 법정생장량은 벌기임분재적과 같아요.\n용어 풀이:\n· 법정림: 이상적인 보속 숲\n· 윤벌령: 벌채 나이\n· 갱신기: 새 숲이 자리 잡는 기간\n중요도: ★★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-4", "subject": "임업경영", "num": 4, "part": 6, "stem": "국유림경영계획에서 산림조사에 대한 설명으로 옳은 것은?", "options": ["지위는 수종별 지위지수곡선에서 2 m 괄약을 적용한다.", "소밀도는 입목재적의 비율에 의하여 구분한다.", "지리는 임반경계에서 임도 또는 도로까지의 거리를 100 m 단위로 구분한다.", "임상은 주요 수종으로 구분하되, 점유비율이 높은 다섯 수종의 입목본수 100분율로 구분한다."], "answer": 0, "explain": "지위는 지위지수곡선에서 2m 괄약. 소밀도는 수관 점유면적, 지리는 소반경계 기준, 임상은 침·활·혼효로 구분.\n쉬운 풀이: 국유림 산림조사에서 지위는 지위지수곡선에서 2m 단위로 묶어 판정해요(①). 소밀도는 수관이 덮은 면적으로, 지리는 소반 경계 기준으로, 임상은 침엽수림·활엽수림·혼효림으로 구분해요.\n용어 풀이:\n· 지위: 땅의 생산력\n· 괄약: 일정 단위로 묶음\n· 소밀도: 나무가 빽빽한 정도\n중요도: ★★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-5", "subject": "임업경영", "num": 5, "part": 6, "stem": "국유림경영계획에서 산림구획에 대한 설명으로 옳지 않은 것은?", "options": ["경영계획구의 명칭은 국유림관리소명 다음에 지역명을 붙여 사용한다.", "임반의 번호는 경영계획구 유역 하류에서 시계방향으로 연속되게 아라비아 숫자로 표기한다.", "소반의 면적은 10 ha 이상으로 구획하되, 부득이한 경우 1 ha 단위로 조정할 수 있다.", "지종에 따라 시업상 취급을 달리할 때는 소반을 달리 구획할 수 있다."], "answer": 2, "explain": "공식 정답 ③. 소반 최소 면적 기준을 바꾼 지문. 학습모듈 산림구획 기준으로 확인.\n쉬운 풀이: 공식 정답 ③이에요. 국유림 산림구획에서 소반 최소 면적 기준을 바꿔 놓은 지문이에요. 경영계획구 명칭·임반 번호 매기기·지종별 소반 구획은 맞는 설명이에요.\n용어 풀이:\n· 산림구획: 산림을 관리 단위로 나눔\n· 임반·소반: 큰 구획·작은 구획\n· 지종: 땅의 종류\n중요도: ★★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-6", "subject": "임업경영", "num": 6, "part": 6, "stem": "국유림경영계획 작성 및 운영 요령 상 국유림경영의 주목표인 보호기능에 대한 설명으로 옳지 않은 것은?", "options": ["자연보호: 공식적인 지침이 없더라도 모든 산림계획 및 시행 시 고려하여야 한다.", "경관보호: 임연부의 형성 및 유지관리에 대해 특별히 배려하여야 한다.", "기후보호: 특별히 인구밀집지역에 있어서 평가되는 산림기능으로서 온도의 조절 및 대기의 환류를 통해 생활환경을 개선하는 기능을 말한다.", "토양보호: 산림 안에 소재하는 토양기념물을 보호하고, 산림의 미적 가치를 증대시켜야 한다."], "answer": 3, "explain": "토양기념물 보호·미적 가치 증대는 토양보호 기능 설명이 아니다(토양보호는 침식·유실 방지).\n쉬운 풀이: 토양보호 기능은 흙이 깎이거나 쓸려 가는 걸 막는 거예요. '토양기념물 보호·미적 가치 증대'는 토양보호 기능 설명이 아니라서 ④가 틀렸어요.\n용어 풀이:\n· 보호기능: 숲이 자연·경관·기후·토양을 지키는 기능\n· 임연부: 숲 가장자리\n· 환류: 공기가 돌며 섞임\n중요도: ★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-7", "subject": "임업경영", "num": 7, "part": 6, "stem": "(가)~(다)에 들어갈 내용을 바르게 연결한 것은?\n\n국유림에 대한 지역산림계획은 (가)년마다, 국유림경영계획은 (나)년마다, 국유림종합계획은 (다)년마다 수립해야 한다.", "options": ["10 · 10 · 5", "10 · 10 · 10", "20 · 10 · 10", "20 · 20 · 10"], "answer": 2, "explain": "· 국유림 지역산림계획 20년\n· 국유림경영계획 10년\n· 국유림종합계획 10년.\n쉬운 풀이: 국유림 지역산림계획 20년, 국유림경영계획 10년, 국유림종합계획 10년이에요. 법규·경영 과목에 자주 나오는 숫자 세트예요.\n용어 풀이:\n· 지역산림계획: 지방산림청 단위 장기계획\n· 국유림경영계획: 국유림 관리 단위 10년 계획\n· 국유림종합계획: 국유림 종합 운영 계획\n중요도: ★★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-8", "subject": "임업경영", "num": 8, "part": 6, "stem": "임분재적조사의 표본조사법에서 다른 조건이 동일할 때, 추출할 표본점의 수를 증가시키는 요인만을 모두 고르면?\n\nㄱ. 변이계수가 크다.\n\nㄴ. 변이계수가 작다.\n\nㄷ. 허용오차율이 크다.\n\nㄹ. 허용오차율이 작다.", "options": ["ㄱ, ㄷ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄴ, ㄹ"], "answer": 1, "explain": "변이계수가 크고 허용오차율이 작을수록 표본점 수가 늘어난다.\n쉬운 풀이: 숲 상태가 제각각일수록(변이계수가 클수록), 그리고 오차를 작게 하려 할수록(허용오차율이 작을수록) 표본을 더 많이 뽑아야 정확해요. 그래서 ㄱ·ㄹ이에요.\n용어 풀이:\n· 변이계수: 값이 흩어진 정도\n· 허용오차율: 허용하는 오차 크기\n· 표본점: 조사 지점\n중요도: ★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-9", "subject": "임업경영", "num": 9, "part": 6, "stem": "형수법에 대한 설명으로 옳지 않은 것은?", "options": ["형수는 원주체적을 수간재적으로 나눈 값이다.", "입목의 재적은 흉고단면적ㆍ수고ㆍ형수의 곱으로 구한다.", "절대형수는 비교원주의 직경위치를 최하부에 정한 것이다.", "정형수는 수고의 1/n(보통 1/10)이 되는 부위의 직경을 비교원주의 직경으로 사용한다."], "answer": 0, "explain": "· 형수 = 수간재적\n· 원주체적(거꾸로 쓴 ①이 틀림). 정형수는 수고의 1/10 위치 직경을 쓴다.\n쉬운 풀이: 형수는 '실제 줄기 부피 ÷ 같은 크기 원기둥 부피'예요. ①은 분자·분모를 거꾸로 써서 틀렸어요. 형수는 1보다 작은 값(보통 0.4~0.5)이 나와요.\n용어 풀이:\n· 형수: 수간재적 ÷ 원주체적\n· 절대형수·정형수: 기준 직경 위치에 따른 형수 종류\n· 비교원주: 비교 기준 원기둥\n중요도: ★★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-10", "subject": "임업경영", "num": 10, "part": 6, "stem": "산림청 FGIS상 임상도와 산림입지토양도를 입력하여 두 주제도의 속성정보를 동시에 갖는 주제도를 산출하는 지리정보체계의 분석 기능은?", "options": ["네트워크분석", "Union", "TIN", "지형분석"], "answer": 1, "explain": "두 주제도를 겹쳐 속성을 모두 갖게 하는 중첩 분석 = Union.\n쉬운 풀이: 임상도와 산림입지토양도를 겹쳐 두 지도의 정보를 모두 가진 새 지도를 만드는 기능은 Union(합집합 중첩)이에요.\n용어 풀이:\n· FGIS: 산림청 산림공간정보시스템\n· 임상도: 숲 종류 지도\n· 산림입지토양도: 산림 토양 지도\n중요도: ★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-11", "subject": "임업경영", "num": 11, "part": 6, "stem": "전임분의 표준연벌채량 500㎥/년과 윤벌기 40년을 폰만텔법에 적용할 때, 현실임분 축적량[㎥]은?", "options": ["8,000", "10,000", "13,500", "20,000"], "answer": 1, "explain": "Mantel법 E = 2Vw/U → Vw = E × U / 2 = 500 × 40 / 2 = 10,000㎥\n쉬운 풀이: Mantel법 E = 2V ÷ U를 V에 대해 풀면 V = E × U ÷ 2 = 500 × 40 ÷ 2 = 10,000㎥예요. 공식을 거꾸로 쓰는 문제라 식 변형을 연습해 두세요.\n용어 풀이:\n· 폰만텔법(Mantel법): 축적과 윤벌기로 벌채량을 구하는 법\n· 현실임분 축적량: 지금 숲의 재적\n중요도: ★★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-12", "subject": "임업경영", "num": 12, "part": 6, "stem": "수확조절을 위한 재적조절법에 대한 설명으로 옳지 않은 것은?", "options": ["불법정한 현실림은 제1윤벌기 동안에 경제적 손실이 크다.", "벌채할 재적은 축적량 및 생장량의 양과 분포에 따라 결정된다.", "경영하지 않던 산림에 대한 수확수준을 빠르게 추정하고, 그 수준을 유지할 수 있을지 사정할 수 있다.", "가장 중요한 결정인자는 매년 계획되는 벌채량과 관계가 있다."], "answer": 0, "explain": "재적조절법은 불법정한 현실림에서도 제1윤벌기 동안 경제적 손실이 적다(손실이 큰 것은 면적조절법).\n쉬운 풀이: 재적조절법은 불법정한 현실림에서도 벌채량을 조절해 제1윤벌기 동안 손실을 적게 해요. 경제적 손실이 큰 건 면적만 맞추는 면적조절법이에요. ①이 틀렸어요.\n용어 풀이:\n· 재적조절법: 재적 기준 수확조절\n· 면적조절법: 면적 기준 수확조절\n· 불법정림: 법정림 조건을 못 갖춘 숲\n중요도: ★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-13", "subject": "임업경영", "num": 13, "part": 6, "stem": "비교방식에 의한 임지평가 방법 중 입지법을 이용하여 임지가격을 평가하고자 할 때, 입지지수를 구하는 식은?\n\na: 평가대상 임지의 지위등급별 지수 · a′: 최근 거래된 임지의 지위등급별 지수\n\nb: 평가대상 임지의 지리등급별 지수 · b′: 최근 거래된 임지의 지리등급별 지수\n\nc: 평가대상 임지의 지세등급별 지수 · c′: 최근 거래된 임지의 지세등급별 지수\n\n⚠️ 분수식 보기는 텍스트로 추출되지 않음 — 원문 PDF 참조", "options": ["(원문 PDF의 ① 보기)", "(원문 PDF의 ② 보기)", "(원문 PDF의 ③ 보기)", "(원문 PDF의 ④ 보기)"], "answer": 1, "explain": "· ⚠️ 원문 보기의 분수식이 텍스트로 추출되지 않았다.\n· 입지지수 = (a/a′) × (b/b′) × (c/c′) 형태(평가대상 지수 ÷ 거래 임지 지수의 곱). 정답 ②, 보기는 원문 PDF로 확인.\n쉬운 풀이: 입지법은 비교 방식으로 임지 가격을 정하는데, '평가할 땅 지수 ÷ 최근 거래된 땅 지수'를 지위·지리·지세별로 곱해 입지지수를 구해요. 수식 보기가 원문에서 깨졌으니 정답 ②를 PDF로 확인하세요.\n용어 풀이:\n· 입지법: 입지 조건 비교로 임지가를 구하는 법\n· 지세: 땅의 형세(경사 등)\n· 지리: 접근성(거리)\n중요도: ★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-14", "subject": "임업경영", "num": 14, "part": 6, "stem": "임업의 투자사업 효과분석인 경제분석과 재무분석에 대한 설명으로 옳은 것은?", "options": ["경제분석에서 정부보조금은 비용에서 제외한다.", "경제분석에서 할인율은 자본비용이다.", "재무분석에서 임금은 시장임금이다.", "재무분석에서 지불이자는 비용에서 제외한다."], "answer": 2, "explain": "재무분석은 실제 시장가격(시장임금), 경제분석은 잠재가격과 사회적 할인율을 쓴다.\n쉬운 풀이: 재무분석은 사업자 입장에서 실제 돈(시장가격, 시장임금)으로 따지고, 경제분석은 사회 전체 입장에서 잠재가격·사회적 할인율로 따져요. 그래서 ③ '재무분석에서 임금은 시장임금'이 맞아요.\n용어 풀이:\n· 재무분석: 사업자 관점의 수익성 분석\n· 경제분석: 사회 전체 관점의 분석\n· 잠재가격: 실제 사회적 가치를 반영한 가격\n중요도: ★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-15", "subject": "임업경영", "num": 15, "part": 6, "stem": "임업이율의 성격으로 옳은 것만을 모두 고르면?\n\nㄱ. 자본이자 ㄴ. 대출이자\n\nㄷ. 현실이율 ㄹ. 평정이율", "options": ["ㄱ, ㄷ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄴ, ㄹ"], "answer": 1, "explain": "임업이율은 자본이자이며 평정이율이다(대출이자·현실이율 아님).\n쉬운 풀이: 임업이율은 나무에 묶인 자본에 대한 '자본이자'이고, 실제 시장 이율이 아니라 평가를 위해 정한 '평정이율'이에요. 대출이자나 현실이율이 아니에요.\n용어 풀이:\n· 자본이자: 자본 사용에 대한 이자\n· 평정이율: 평가용으로 정한 이율\n· 현실이율: 실제 시장 이율\n중요도: ★★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-16", "subject": "임업경영", "num": 16, "part": 6, "stem": "국유림의 경영 및 관리에 관한 법률 시행규칙 상 시범림의 종류가 아닌 것은?", "options": ["임업기계화 시범림", "복합경영 시범림", "산림인증 시범림", "탄소흡수원 시범림"], "answer": 3, "explain": "시범림 종류에 탄소흡수원 시범림은 없다.\n쉬운 풀이: 국유림 시범림 종류는 임업기계화·복합경영·산림인증 시범림 등이에요. '탄소흡수원 시범림'은 없어요.\n용어 풀이:\n· 시범림: 새 경영 방법을 보여 주는 본보기 숲\n· 복합경영: 여러 소득원을 함께 하는 경영\n중요도: ★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-17", "subject": "임업경영", "num": 17, "part": 6, "stem": "탄소흡수원 유지 및 증진에 관한 법률 상 탄소흡수원 증진 종합 계획에 포함되어야 할 사항이 아닌 것은?", "options": ["산림탄소배출권의 거래와 운영에 관한 사항", "산림탄소등록부의 구축과 운영에 관한 사항", "탄소흡수원 유지 및 증진을 위한 국제협력 및 해외시장 진출에 관한 사항", "산림부문 온실가스 정보 및 통계 구축에 관한 사항"], "answer": 0, "explain": "산림탄소배출권 거래·운영은 종합계획 포함 사항이 아니다.\n쉬운 풀이: 탄소흡수원 증진 종합계획에는 산림탄소등록부 구축, 국제협력·해외 진출, 온실가스 통계 구축 등이 들어가요. 탄소배출권 거래·운영은 종합계획 포함 사항이 아니에요.\n용어 풀이:\n· 탄소흡수원: 탄소를 흡수하는 숲 등\n· 산림탄소등록부: 산림 탄소량을 기록하는 장부\n· 배출권: 온실가스 배출 허용량\n중요도: ★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-18", "subject": "임업경영", "num": 18, "part": 6, "stem": "임업 및 산촌 진흥촉진에 관한 법률 상 지정권자에 따른 임업진흥 권역의 지정 구분으로 옳은 것은?", "options": ["산림청장: 50만제곱미터 이상의 국유림 및 공유림", "도지사: 10만제곱미터 이상 50만제곱미터 미만의 국유림, 공유림 및 사유림", "군수: 3만제곱미터 이상 10만제곱미터 미만의 공유림 및 사유림", "구청장: 3만제곱미터 미만의 공유림 및 사유림"], "answer": 3, "explain": "공식 정답 ④. 임업진흥권역 지정권자별 면적 기준은 임업진흥법 시행령 원문으로 확인.\n쉬운 풀이: 공식 정답 ④예요. 임업진흥권역은 면적 규모에 따라 지정권자가 달라요(큰 곳은 산림청장·도지사, 작은 곳은 시장·군수·구청장). 정확한 면적 기준은 법령 원문으로 확인하세요.\n용어 풀이:\n· 임업진흥권역: 임업을 집중 육성하는 권역\n· 지정권자: 지정할 권한이 있는 사람\n· ㎡: 제곱미터\n중요도: ★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-19", "subject": "임업경영", "num": 19, "part": 6, "stem": "우리나라 국가온실가스 인벤토리 작성을 위한 방법에 따라, 임목 재적을 탄소배출계수를 이용하여 임목의 탄소량으로 계산하는 데 필요한 항목이 아닌 것은?", "options": ["바이오매스 확장계수", "목재기본밀도", "수관엽면적지수", "탄소전환계수"], "answer": 2, "explain": "탄소량 = 재적 × 목재기본밀도 × 바이오매스 확장계수 × (1 + 뿌리함량비) × 탄소전환계수. 수관엽면적지수는 필요 없다.\n쉬운 풀이: 나무 부피로 탄소량을 계산할 때: 재적 × 목재기본밀도 × 바이오매스 확장계수 × (1 + 뿌리비율) × 탄소전환계수. 잎 면적(수관엽면적지수)은 이 계산에 쓰지 않아요.\n용어 풀이:\n· 바이오매스 확장계수: 줄기 외 가지·잎까지 포함하는 계수\n· 탄소전환계수: 바이오매스 중 탄소 비율(약 0.5)\n· 국가온실가스 인벤토리: 나라 온실가스 통계\n중요도: ★★", "ref": "", "exam": "2025 임업경영"}, {"id": "9급-2025-임업경영-20", "subject": "임업경영", "num": 20, "part": 6, "stem": "제1회 수입은 m년 후에, 제2회부터는 n년마다 R원씩 영구히 얻을 수 있는 이자의 전가합계식은? (단, P는 연이율이다)\n\n⚠️ 수식 보기는 텍스트로 추출되지 않음 — 원문 PDF 참조", "options": ["(원문 PDF의 ① 보기)", "(원문 PDF의 ② 보기)", "(원문 PDF의 ③ 보기)", "(원문 PDF의 ④ 보기)"], "answer": 0, "explain": "· ⚠️ 수식 보기 손실. 첫 수입 m년 후, 이후 n년마다 R 영구 → 전가 = R(1+P)ⁿ⁻ᵐ\n· [(1+P)ⁿ − 1]. 정답 ①.\n쉬운 풀이: 첫 수입이 m년 뒤, 그다음부터 n년마다 R원이 영원히 들어오면 전가 = R × (1+P)^(n−m) ÷ [(1+P)^n − 1]이에요. 매 n년 수입의 무한 전가 공식에서 첫 수입 시점만 조정한 거예요. 정답 ①, 수식은 PDF로 확인하세요.\n용어 풀이:\n· 전가합계: 미래 수입의 현재가치 합\n· 영구히: 끝없이\n· 연이율(P): 1년 이자율\n중요도: ★★★", "ref": "", "exam": "2025 임업경영"}]}, {"name": "2024 조림", "year": "2024", "subject": "조림", "questions": [{"id": "9급-2024-조림-1", "subject": "조림", "num": 1, "part": 6, "stem": "채종원의 조성과 관리에 대한 설명으로 옳은 것은?", "options": ["채종원 주위에 다른 수종으로 방풍림을 조성하는 것은 바람직하지 않다.", "같은 클론을 이웃하여 식재하는 것은 바람직하지 않다.", "외부 화분과의 수정을 유도하기 위해 동종 임분과 가까운 거리에 위치해야 한다.", "채종원은 무성증식된 개체가 아닌 종자에 의한 실생묘로만 조성해야 한다."], "answer": 1, "explain": "· 같은 클론이 이웃하면 근친교배가 일어나므로 피한다.\n· 채종원은 외부 화분을 막도록 동종 임분과 격리하고, 방풍림 조성은 바람직하며, 접목(무성증식) 클론으로도 조성한다.\n쉬운 풀이: 채종원은 좋은 나무끼리만 꽃가루를 주고받게 만든 씨앗 농장이에요. 같은 클론(복제 나무)끼리 붙어 있으면 근친교배가 돼서 씨앗 질이 떨어지니 이웃해 심지 않아요. 외부 꽃가루는 막아야 하고, 접목 클론으로도 만들어요.\n용어 풀이:\n· 채종원: 우량 종자 생산 농장\n· 클론: 유전적으로 같은 복제 개체\n· 근친교배: 가까운 친척끼리의 교배\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-2", "subject": "조림", "num": 2, "part": 6, "stem": "나무가 병에 감염되었을 때 관찰되는 표징이 아닌 것은?", "options": ["가지에 나타나는 마름 증상", "잎에 형성된 자낭각", "가루 모양의 분생포자경", "흰색의 균사매트"], "answer": 0, "explain": "· 가지 마름은 기주의 반응인 병징이다.\n· 자낭각·분생포자경·균사매트는 병원체 자체가 보이는 표징.\n쉬운 풀이: 병징은 식물이 보이는 '증상'(마름, 시듦, 변색), 표징은 병원체 '자체'가 눈에 보이는 것(곰팡이 실, 포자 덩어리)이에요. 가지 마름은 증상이니 병징이에요.\n용어 풀이:\n· 표징: 병원체가 직접 보이는 것\n· 병징: 식물이 나타내는 증상\n· 균사매트: 곰팡이 실이 깔개처럼 덮인 것\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-3", "subject": "조림", "num": 3, "part": 6, "stem": "(가)와 (나)에 들어갈 내용을 바르게 연결한 것은?\n\n하나의 꽃에 암술과 수술이 함께 있는 꽃을 (가) 라고 하며, 그 예로 (나) 가 있다.", "options": ["(가) 단성화 · (나) 소나무", "(가) 단성화 · (나) 벚나무", "(가) 양성화 · (나) 벚나무", "(가) 양성화 · (나) 소나무"], "answer": 2, "explain": "암술·수술이 한 꽃에 있으면 양성화(예: 벚나무). 소나무는 암수한그루의 단성화.\n쉬운 풀이: 한 꽃에 암술과 수술이 같이 있으면 양성화예요. 벚꽃이 대표적이에요. 소나무는 암꽃과 수꽃이 따로 피는 단성화예요(한 나무에 둘 다 있음).\n용어 풀이:\n· 양성화: 암술·수술이 한 꽃에 있음\n· 단성화: 암꽃·수꽃이 따로 있음\n· 자웅동주: 한 그루에 암꽃·수꽃이 함께 핌\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-4", "subject": "조림", "num": 4, "part": 6, "stem": "다음에서 설명하는 수목병은?\n\n○ 병원균: Raffaelea quercus-mongolicae\n\n○ 매개충: 광릉긴나무좀\n\n○ 병징: 매개충의 침입을 받은 나무줄기 하단부에서 관찰되는 나무 부스러기\n\n○ 방제법: 고사목은 벌채 후 훈증 처리", "options": ["참나무 시들음병", "모잘록병", "밤나무 줄기마름병", "벚나무 빗자루병"], "answer": 0, "explain": "*Raffaelea* 균 + 광릉긴나무좀 + 줄기 밑동의 목분(나무 부스러기) = 참나무 시들음병. 고사목은 벌채 후 훈증.\n쉬운 풀이: 병원균 Raffaelea + 매개충 광릉긴나무좀 + 줄기 밑에 쌓이는 나무 부스러기 → 참나무 시들음병이에요. 고사목은 베어서 훈증해요. 예상문제 보호 17·88번과 같은 병이에요.\n용어 풀이:\n· 참나무 시들음병: 물관이 막혀 참나무가 시드는 병\n· 매개충: 병원체를 옮기는 곤충\n· 훈증: 가스로 소독\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-5", "subject": "조림", "num": 5, "part": 6, "stem": "다음 중 뿌리의 나이가 2년생인 묘목만을 모두 고르면?\n\nㄱ. C1/1묘\n\nㄴ. 1－1묘\n\nㄷ. 0/2묘\n\nㄹ. 2－2묘\n\nㅁ. 2/3묘", "options": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄷ, ㄹ", "ㄹ, ㅁ"], "answer": 1, "explain": "'-'는 이식, '/'는 단근. 1-1묘(파종상 1년+이식 1년)와 0/2묘(줄기 0년·뿌리 2년)가 뿌리 나이 2년. 2-2묘는 4년, 2/3묘는 뿌리 3년.\n쉬운 풀이: 묘목 표시에서 '-'는 옮겨 심기(이식), '/'는 뿌리 끊기(단근)예요. 뿌리 나이 2년은 1-1묘(파종 1년+이식 1년)와 0/2묘(뿌리만 2년)예요. 2-2묘는 4년, 2/3묘는 뿌리 3년이에요.\n용어 풀이:\n· 이식: 옮겨 심기\n· 단근: 뿌리 자르기\n· 묘령: 묘목 나이\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-6", "subject": "조림", "num": 6, "part": 6, "stem": "임목의 교잡육종에 대한 설명으로 옳은 것은?", "options": ["현사시나무는 은백양과 수원사시나무의 교잡종이다.", "리기테다소나무는 생장이 빠른 리기다소나무와 내한성이 강한 테다소나무의 교잡종이다.", "잡종강세의 유도는 교잡육종의 목표가 될 수 없다.", "종 간 교잡을 의미하고 품종 간의 교잡은 의미하지 않는다."], "answer": 0, "explain": "현사시 = 은백양 × 수원사시. 리기테다는 내한성 강한 리기다 × 생장 빠른 테다(②는 거꾸로). 잡종강세는 교잡육종의 주목표이고, 품종 간 교잡도 포함.\n쉬운 풀이: 현사시나무(은수원사시)는 은백양과 수원사시나무를 교배해 만든 우리나라 대표 교잡종이에요. 리기테다는 '내한성 강한 리기다 × 빨리 크는 테다'인데 ②는 반대로 썼어요.\n용어 풀이:\n· 교잡육종: 다른 종·품종을 교배해 개량\n· 잡종강세: 잡종이 부모보다 우수한 현상\n· 현사시: 은백양 × 수원사시\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-7", "subject": "조림", "num": 7, "part": 6, "stem": "다음 조건을 가진 소나무 파종상 1,000㎡당 파종량[kg]은?\n\n○ 단위면적당 잔존본수: 800본/㎡\n\n○ 1 g당 종자수: 200개\n\n○ 발아율: 80 %\n\n○ 종자효율: 80 %\n\n○ 득묘율: 50 %", "options": ["1.0", "1.25", "10.0", "12.5"], "answer": 2, "explain": "W = (1,000 × 800) / (200 × 0.8 × 0.8 × 0.5) = 12,500g = 12.5kg\n쉬운 풀이: 파종량 공식: 면적 × 남길 본수 ÷ (g당 씨앗 수 × 발아율 × 효율 × 득묘율) = 1,000 × 800 ÷ (200 × 0.8 × 0.8 × 0.5) = 800,000 ÷ 64 = 12,500g = 12.5kg이에요.\n용어 풀이:\n· 파종량: 뿌릴 씨앗 무게\n· 득묘율: 싹 중 묘목으로 키워지는 비율\n· 종자효율: 순량률 × 발아율\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-8", "subject": "조림", "num": 8, "part": 6, "stem": "임목의 유전과 육종에 대한 설명으로 옳지 않은 것은?", "options": ["수형목은 임목의 표현형이 아닌 유전형을 바탕으로 선발해야 한다.", "차대검정은 선발한 양친수의 유전적 특성을 자손의 형질 조사로 검정하는 것이다.", "유전획득량은 유전력과 선발차의 곱으로 나타낼 수 있다.", "산지시험은 조림 대상 지역의 기후, 풍토 등에 적합한 산지를 선택할 목적으로 실시한다."], "answer": 0, "explain": "수형목은 표현형으로 먼저 선발한 뒤 차대검정으로 유전형을 확인한다.\n쉬운 풀이: 수형목은 겉모습(표현형)이 좋은 나무를 먼저 고르고, 나중에 자손을 키워 보는 차대검정으로 유전적으로도 좋은지 확인해요. '유전형으로 선발'은 순서를 거꾸로 말한 거예요.\n용어 풀이:\n· 수형목: 형질이 우수해 선발한 나무\n· 표현형: 겉으로 드러난 특성\n· 차대검정: 자손으로 부모 유전성을 검정\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-9", "subject": "조림", "num": 9, "part": 6, "stem": "다음 중 파종 시 조파(줄뿌림)하는 수종만을 모두 고르면?\n\nㄱ. Quercus acutissima\n\nㄴ. Alnus japonica\n\nㄷ. Zelkova serrata\n\nㄹ. Larix kaempferi\n\nㅁ. Fraxinus mandshurica", "options": ["ㄱ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㅁ", "ㄹ, ㅁ"], "answer": 2, "explain": "느티나무(*Zelkova serrata*)·물푸레나무(*Fraxinus*)는 줄뿌림. 상수리나무(*Quercus acutissima*)는 점뿌림, 오리나무(*Alnus*)·낙엽송(*Larix*)은 흩어뿌림.\n쉬운 풀이: 씨 크기로 뿌리는 방법이 달라요. 중간 크기인 느티나무(Zelkova)·물푸레나무(Fraxinus)는 줄뿌림, 큰 도토리(Quercus)는 점뿌림, 작은 오리나무(Alnus)·낙엽송(Larix)은 흩어뿌림해요.\n용어 풀이:\n· 조파(줄뿌림): 줄 따라 뿌림\n· 점파(점뿌림): 한 알씩 띄워 뿌림\n· 산파(흩어뿌림): 전면에 흩어 뿌림\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-10", "subject": "조림", "num": 10, "part": 6, "stem": "산림유전자원의 보전 방법에 대한 설명으로 옳지 않은 것은?", "options": ["자연보호구 지정은 현지 내 보전(in situ conservation)에 해당한다.", "현지 외 보전(ex situ conservation)은 자연 생육지 이외의 장소에서 보전하는 방법이다.", "현지 내 보전 방법으로는 대규모의 종 내 다양성을 보전할 수 없다.", "유전자은행 운영은 현지 외 보전에 해당한다."], "answer": 2, "explain": "현지 내 보전은 넓은 자생지를 보호하므로 대규모 종내 다양성 보전에 유리하다.\n쉬운 풀이: 현지 내 보전은 나무가 원래 사는 곳 자체를 보호하는 거라 넓은 범위의 다양한 개체를 지킬 수 있어요. 그래서 '대규모 종내 다양성을 보전할 수 없다'는 틀렸어요.\n용어 풀이:\n· 현지 내 보전(in situ): 자생지에서 보전\n· 현지 외 보전(ex situ): 자생지 밖에서 보전\n· 종내 다양성: 같은 종 안의 유전적 다양성\n중요도: ★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-11", "subject": "조림", "num": 11, "part": 6, "stem": "다음 중 삽목 발근이 상대적으로 어려운 수종만을 고르면?", "options": ["향나무, 은행나무", "비자나무, 버드나무", "삼나무, 낙엽송", "전나무, 자작나무"], "answer": 3, "explain": "· 전나무·자작나무는 삽목 발근이 어렵다.\n· 향나무·버드나무·삼나무 등은 쉬운 편.\n쉬운 풀이: 꺾꽂이로 뿌리 내리기 어려운 나무는 전나무·자작나무예요. 버드나무·삼나무·향나무 등은 비교적 쉬워요. 소나무류도 어려운 편이에요.\n용어 풀이:\n· 삽목 발근: 꺾꽂이 가지에서 뿌리가 나는 것\n· 발근: 뿌리가 남\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-12", "subject": "조림", "num": 12, "part": 6, "stem": "숲의 인위적 피해에 대한 설명으로 옳은 것은?", "options": ["산불이 발생하면 토양의 투수성이 증가하여 토양 침식이 심해진다.", "산성비는 pH 5.6 이하의 빗물을 말하며, 토양 미생물의 유기물 분해 활동이 촉진된다.", "대기오염에 의한 수목의 불가시적 피해로 생장과 결실의 불량이 초래된다.", "지구온난화가 산림생태에 미치는 영향은 특히 열대림에서 가장 심할 것으로 예측된다."], "answer": 2, "explain": "· 불가시적 피해로 생장·결실이 나빠진다.\n· 산불 후 투수성은 감소, 산성비는 미생물 분해를 억제, 온난화 영향은 한대림에서 가장 크다.\n쉬운 풀이: 대기오염은 잎에 반점이 안 보여도 생장과 열매 맺기를 나쁘게 해요(불가시적 피해). 산불 뒤엔 흙이 단단해져 물이 덜 스며들고(투수성 감소), 산성비는 미생물 분해를 억제하고, 온난화 영향은 한대림에서 가장 커요.\n용어 풀이:\n· 불가시적 피해: 눈에 보이지 않는 피해\n· 투수성: 물이 스며드는 정도\n· 한대림: 추운 지방의 숲\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-13", "subject": "조림", "num": 13, "part": 6, "stem": "벌채작업에 대한 설명으로 옳지 않은 것은?", "options": ["산벌작업은 종자가 커서 멀리 날아가지 못하는 수종에는 부적합하다.", "왜림작업은 기상, 병해충 등 외부인자에 대한 저항력이 비교적 크다.", "중림작업의 하층임목은 소경재 생산을 목적으로 한다.", "택벌작업은 면적이 작은 숲에서 보속생산을 하는 데 적당하다."], "answer": 0, "explain": "· 산벌작업은 종자가 무거워 멀리 날지 못하는 수종(참나무류 등)에 알맞은 갱신법이다.\n· ①이 틀린 지문. (이전 자체풀이 ②는 오답이었음)\n쉬운 풀이: 산벌작업은 종자가 무거워 멀리 못 날아가는 참나무 같은 수종에 오히려 '알맞아요'. 어미나무 바로 아래에 씨가 떨어져도 되니까요. ①이 틀렸어요. (예전 자체풀이 ②는 오답이었어요.)\n용어 풀이:\n· 산벌작업: 단계적으로 베며 천연 갱신\n· 왜림작업: 맹아로 갱신\n· 중림작업: 교림과 왜림을 섞은 작업\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-14", "subject": "조림", "num": 14, "part": 6, "stem": "간벌(솎아베기) 작업에 대한 설명으로 옳지 않은 것은?", "options": ["Hawley의 택벌식 간벌은 우세목을 벌채하여 그 아래에 자라는 나무의 생육을 촉진하는 간벌형식이다.", "데라사끼(寺崎)의 간벌은 수관급 구분에 의하지 않고 임목 간 거리를 대상으로 한 간벌 방법이다.", "정성간벌은 줄기의 형태와 수관의 특성으로 구분되는 수관급 또는 수형급을 바탕으로 간벌목을 선정하는 방법이다.", "도태간벌은 조림수종 외에 다른 수종이 많이 혼효되어 정량간벌이나 열식간벌이 어려운 산림에도 적용할 수 있다."], "answer": 1, "explain": "데라사끼 간벌은 수관급(1~5급) 구분에 따라 A~E종으로 간벌한다.\n쉬운 풀이: 데라사끼 간벌은 나무를 수관급(1~5급)으로 나눈 뒤 어떤 급을 얼마나 베는지로 A~E종을 정해요. 그래서 '수관급 구분에 의하지 않는다'가 틀렸어요.\n용어 풀이:\n· 데라사끼 간벌: 일본식 수관급 기준 간벌\n· 수관급: 수관 위치에 따른 나무 등급\n· 정성간벌: 나무 상태를 보고 고르는 간벌\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-15", "subject": "조림", "num": 15, "part": 6, "stem": "다음 중 풀베기에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 모두베기는 주로 음수에 적용된다.\n\nㄴ. 둘레베기는 현장에서 가장 흔히 적용되는 방법이다.\n\nㄷ. 줄베기는 묘목을 한풍해(寒風害)로부터 보호할 수 있다.\n\nㄹ. 한해ㆍ풍해의 위험성이 있는 지역에서는 9월 이후 풀베기를 하지 않는 것이 좋다.", "options": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄷ, ㄹ"], "answer": 3, "explain": "· ㄷ·ㄹ이 옳다.\n· 모두베기는 양수, 현장에서 가장 흔한 것은 줄베기.\n쉬운 풀이: 줄베기는 묘목 줄만 베고 사이 풀은 남겨 찬바람을 막아 줘요(ㄷ). 가뭄·바람 피해가 걱정되는 곳은 9월 이후엔 풀을 베지 않는 게 좋아요(ㄹ). 모두베기는 양수용이고, 현장에서 가장 흔한 건 줄베기예요.\n용어 풀이:\n· 한풍해: 찬바람 피해\n· 줄베기: 줄 따라 풀베기\n· 둘레베기: 나무 둘레만 베기\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-16", "subject": "조림", "num": 16, "part": 6, "stem": "가지치기에 대한 설명으로 옳지 않은 것은?", "options": ["산 가지의 제거는 생장휴지기인 11월 ～ 2월에 실시하는 것이 좋다.", "소나무, 잣나무, 낙엽송, 편백 등의 목재생산 수종을 대상으로 실시한다.", "아랫부분부터 수관의 30 ～ 70 %까지 제거해도 수고생장에는 큰 영향이 미치지 않는다.", "생산력이 떨어지는 아랫가지가 줄기생장을 감소시키지 않는다면 가지치기를 생략하는 것이 좋다."], "answer": 3, "explain": "· 목재생산림의 가지치기는 옹이 없는 무절재 생산이 목적이므로 아랫가지가 생장을 해치지 않아도 실시한다.\n· ④가 틀린 지문. (이전 자체풀이 ③은 오답이었음)\n쉬운 풀이: 목재생산림의 가지치기 목적은 옹이 없는 좋은 목재(무절재)를 얻는 거예요. 그러니 아랫가지가 생장을 방해하지 않아도 가지치기를 해야 해요. ④가 틀렸어요. (예전 자체풀이 ③은 오답이었어요.)\n용어 풀이:\n· 무절재: 옹이가 없는 목재\n· 가지치기: 아래 가지를 잘라 주는 작업\n· 생장휴지기: 나무가 자라지 않고 쉬는 시기\n중요도: ★★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-17", "subject": "조림", "num": 17, "part": 6, "stem": "우리나라 기후대별 조림 수종으로 적합하지 않은 것은?", "options": ["온대 북부 － Abies holophylla", "온대 중부 － Machilus thunbergii", "온대 남부 － Pinus densiflora", "난대 － Chamaecyparis obtusa"], "answer": 1, "explain": "*Machilus thunbergii*(후박나무)는 난대 수종. 전나무(*Abies holophylla*)–온대 북부, 소나무–온대 남부, 편백(*Chamaecyparis obtusa*)–난대는 맞다.\n쉬운 풀이: Machilus thunbergii(후박나무)는 따뜻한 남쪽 해안의 난대 수종이라 온대 중부 조림 수종으로 맞지 않아요. 전나무(Abies)는 온대 북부, 소나무는 온대 남부, 편백(Chamaecyparis)은 난대에 맞아요.\n용어 풀이:\n· 기후대: 기온에 따라 나눈 지역\n· 난대: 따뜻한 남쪽 기후대\n· 학명: 국제 공통 이름\n중요도: ★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-18", "subject": "조림", "num": 18, "part": 6, "stem": "시설양묘와 용기묘에 대한 설명으로 옳은 것은?", "options": ["용기묘의 현지 수송과 묘목 운반은 노지묘에 비해 비교적 용이하다.", "용기묘는 순화과정을 생략하고 조림지로 바로 반출해야 한다.", "시설온실 내에서 용기묘를 월동시킬 경우에는 관수를 실시하지 않는다.", "시설양묘는 노지양묘에 비해 단기에 대량생산이 가능하고 묘목의 굴취가 생략된다."], "answer": 3, "explain": "· 시설양묘는 단기 대량생산이 가능하고 굴취가 필요 없다.\n· 용기묘는 부피가 커 운반이 불리하고, 반출 전 순화(경화) 과정이 필요하며, 월동 중에도 관수한다.\n쉬운 풀이: 시설양묘(온실 용기묘)는 짧은 시간에 많이 키울 수 있고, 흙째 뽑으면 되니 캐는 작업(굴취)이 필요 없어요. 반면 용기 때문에 부피가 커 운반은 불리하고, 내보내기 전 바깥 환경에 적응시키는(순화) 과정이 꼭 필요해요.\n용어 풀이:\n· 시설양묘: 온실 등 시설에서 묘목 생산\n· 굴취: 묘목을 캐냄\n· 순화(경화): 바깥 환경에 적응시킴\n중요도: ★★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-19", "subject": "조림", "num": 19, "part": 6, "stem": "수목의 구조와 직경생장에 대한 설명으로 옳지 않은 것은?", "options": ["형성층은 세포분열을 통하여 바깥쪽으로 2차사부, 안쪽으로 2차목부를 생산한다.", "사세포는 나자식물의 사부조직을 구성하는 기본세포로서 탄수화물을 운반하는 기능을 한다.", "생리적으로 체내 옥신 함량이 높고 지베렐린 농도가 낮으면 사부를 생산하는 것으로 알려져 있다.", "늦가을이 되면 제일 먼저 수간의 밑동에서부터 끝부분을 향해 형성층이 활동을 멈춘다."], "answer": 2, "explain": "옥신이 높고 지베렐린이 낮으면 목부를 만든다.\n쉬운 풀이: 형성층은 바깥쪽에 체관부(사부), 안쪽에 물관부(목부)를 만들어요. 옥신이 많고 지베렐린이 적으면 '목부'를 만들어요. ③은 사부라고 해서 틀렸어요.\n용어 풀이:\n· 형성층: 줄기를 굵게 만드는 세포층\n· 사부(체관부): 양분 통로\n· 목부(물관부): 물 통로\n중요도: ★", "ref": "", "exam": "2024 조림"}, {"id": "9급-2024-조림-20", "subject": "조림", "num": 20, "part": 6, "stem": "다음 중 직파조림이 용이한 수종만을 모두 고르면?\n\nㄱ. 소나무\n\nㄴ. 전나무\n\nㄷ. 가래나무\n\nㄹ. 분비나무\n\nㅁ. 상수리나무", "options": ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㅁ", "ㄴ, ㄷ, ㄹ", "ㄴ, ㄹ, ㅁ"], "answer": 1, "explain": "소나무·가래나무·상수리나무가 직파 용이. 전나무·분비나무는 어렵다.\n쉬운 풀이: 직파(씨 직접 뿌리기)가 쉬운 나무는 소나무, 그리고 씨가 크고 튼튼한 가래나무·상수리나무예요. 전나무·분비나무는 어릴 때 약해서 직파가 어려워요.\n용어 풀이:\n· 직파조림: 씨를 산에 바로 뿌려 조림\n· 가래나무: 호두나무 친척\n· 분비나무: 고산 침엽수\n중요도: ★★", "ref": "", "exam": "2024 조림"}]}, {"name": "2024 임업경영", "year": "2024", "subject": "임업경영", "questions": [{"id": "9급-2024-임업경영-1", "subject": "임업경영", "num": 1, "part": 6, "stem": "임분생장의 특성에 대한 설명으로 옳지 않은 것은?", "options": ["임분은 생장 과정에서 자체 경쟁에 의하여 자연적으로 본수가 감소된다.", "임분의 직경이나 수고의 평균값은 인위적으로 조절되지 않는다.", "지위가 높을수록 흉고직경이나 수고가 크게 마련이다.", "임분의 단위면적당 흉고단면적 및 재적은 간벌 후에는 감소되었다가 생장에 의하여 다음 주기까지 다시 증가하는 형태를 보인다."], "answer": 1, "explain": "간벌로 작은 나무를 제거하면 평균 직경·수고가 달라지므로 인위적으로 조절된다.\n쉬운 풀이: 숲의 평균 지름·키는 간벌로 작은 나무를 빼면 달라지니 사람이 조절할 수 있어요. 그래서 ②가 틀렸어요. 나머지(자연 감소, 좋은 땅일수록 큼, 간벌 후 줄었다 회복)는 맞아요.\n용어 풀이:\n· 임분생장: 숲 전체의 성장\n· 지위: 땅의 생산력\n· 흉고단면적: 가슴높이 단면 넓이\n중요도: ★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-2", "subject": "임업경영", "num": 2, "part": 6, "stem": "선형계획법에서 선형계획모형의 전제조건에 해당하지 않는 것은?", "options": ["비례성", "확률성", "분할성", "제한성"], "answer": 1, "explain": "선형계획 전제는 비례성·부가성·분할성·제한성·선형성·확정성. 확률성은 해당 없음.\n쉬운 풀이: 선형계획법은 결과가 확실하게 정해져 있다고(확정성) 가정해요. '확률성'은 반대 개념이라 전제조건이 아니에요. 비례성·분할성·제한성은 전제조건이에요.\n용어 풀이:\n· 선형계획법: 제약 안에서 최적값을 찾는 수학 기법\n· 확정성: 값이 확실히 정해짐\n· 분할성: 소수 단위로 나눌 수 있음\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-3", "subject": "임업경영", "num": 3, "part": 6, "stem": "벌채목의 재적측정 방법 중 중앙단면적에 가중치를 부여하여 계산 하는 재적공식은?", "options": ["Brereton 식", "Newton 식", "Smalian 식", "Huber 식"], "answer": 1, "explain": "Newton식 V = L/6 × (g₀ + 4gₘ + gₙ) — 중앙단면적에 4배 가중치.\n쉬운 풀이: Newton식은 양 끝과 가운데 단면을 모두 쓰되 가운데에 4배 가중치를 줘요: V = L/6 × (양끝 + 4 × 중앙). 가장 정확한 공식이에요. Huber는 중앙만, Smalian은 양끝 평균만 써요.\n용어 풀이:\n· 재적공식: 통나무 부피 공식\n· 가중치: 더 중요하게 반영하는 배수\n· 중앙단면적: 가운데 단면 넓이\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-4", "subject": "임업경영", "num": 4, "part": 6, "stem": "산림교육의 활성화에 관한 법률 상 산림교육전문가에 해당하지 않는 것은?", "options": ["숲해설가", "유아숲지도사", "숲길등산지도사", "산림치유지도사"], "answer": 3, "explain": "산림교육전문가는 숲해설가·유아숲지도사·숲길등산지도사. 산림치유지도사는 산림복지법상 자격.\n쉬운 풀이: 「산림교육법」의 산림교육전문가는 숲해설가·유아숲지도사·숲길등산지도사 3가지예요. 산림치유지도사는 「산림복지법」의 다른 자격이에요.\n용어 풀이:\n· 산림교육전문가: 숲 교육을 하는 법정 자격자\n· 유아숲지도사: 어린이 숲 교육 전문가\n중요도: ★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-5", "subject": "임업경영", "num": 5, "part": 6, "stem": "산림경영계획서 작성에 있어서 다음 조건의 B층 토양건습도는? 손으로 꽉 쥐었을 때 손바닥 전체에 습기가 묻고 물에 대한 감촉이 뚜렷함", "options": ["약건", "적윤", "약습", "습"], "answer": 1, "explain": "학습모듈(산림경영 p.56) 건습도표: 적윤 = 손바닥 전체에 습기가 묻고 물에 대한 감촉이 뚜렷함. 약습은 손가락 사이에 물기가 비치는 정도. (이전 자료의 '약습'은 오답이었음)\n쉬운 풀이: 학습모듈 건습도표 기준으로 '손바닥 전체에 습기가 묻고 물 감촉이 뚜렷함'은 적윤이에요. 약습은 손가락 사이로 물기가 비칠 정도로 더 젖은 상태예요. 예전 자료에 약습으로 잘못 적혀 있었으니 꼭 '적윤'으로 기억하세요.\n용어 풀이:\n· 건습도: 흙의 젖은 정도\n· 적윤: 알맞게 촉촉함\n· B층: 표층 아래의 흙층\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-6", "subject": "임업경영", "num": 6, "part": 6, "stem": "동령림과 이령림의 임분구조에 대한 설명으로 옳지 않은 것은?", "options": ["동령림은 임령이 증가할수록 평균직경급으로 집중 정도가 강해져 직경급 분포가 점차 좁아지는 형태를 보인다.", "동령림이 2개의 영급과 수고급으로 구성된 복층림의 경우에는 최고점이 2개인 종모양의 분포를 보이기도 한다.", "이령림은 직경급이 증가할수록 본수가 작아지는 전형적인 역J자 형태의 분포를 나타낸다.", "이령림을 10년의 영급으로 구분한다면 각 영급은 동령림과 같은 종모양의 임분구조를 보인다."], "answer": 0, "explain": "동령림은 임령이 늘수록 직경급 분포가 넓어지고 평평해진다.\n쉬운 풀이: 동령림은 나이가 들수록 나무마다 크기 차이가 벌어져서 직경 분포가 점점 '넓어지고 평평해져요'. ①은 좁아진다고 해서 틀렸어요. 이령림은 역J자, 복층림은 봉우리 2개 분포예요.\n용어 풀이:\n· 직경급 분포: 지름 크기별 나무 수 분포\n· 역J자 분포: 작은 나무가 가장 많은 분포\n· 복층림: 두 층 이상의 숲\n중요도: ★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-7", "subject": "임업경영", "num": 7, "part": 6, "stem": "잣나무 동령림의 400㎡ 표준지 조사 결과가 흉고직경 20 cm, 수고 10 m인 입목이 20본일 때, 형수법으로 계산한 이 임분의 ha당 재적[㎥/ha]은? (단, 형수는 0.5이다)", "options": ["39.3", "78.5", "117.6", "157.2"], "answer": 1, "explain": "0.0314 × 10 × 0.5 = 0.157㎥ × 20본 = 3.14㎥/400㎡ → ×25 = 78.5㎥/ha\n쉬운 풀이: 단목 재적 = 단면적 0.0314㎡ × 키 10m × 형수 0.5 = 0.157㎥. 20본이면 3.14㎥/400㎡. ha로 바꾸려면 × 25(10,000 ÷ 400) = 78.5㎥/ha예요.\n용어 풀이:\n· 형수법: 단면적 × 수고 × 형수로 재적 계산\n· 표준지: 표본 조사 구역\n· ha 환산: 1ha 기준으로 바꿈\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-8", "subject": "임업경영", "num": 8, "part": 6, "stem": "우리나라 산림계획에 대한 설명으로 옳은 것은?", "options": ["제1차 치산녹화 10개년 계획은 100만 ha의 조림계획을 4년 앞당겨 달성하였다.", "제2차 치산녹화 10개년 계획은 녹화의 바탕 위에 산지자원화 기반을 조성한다는 목표를 수립하였다.", "제3차 산림기본계획은 지속 가능한 산림경영기반 구축과 사람과 숲이 어우러진 풍요로운 녹색국가 실현이라는 목표를 수립하였다.", "제4차 산림기본계획은 가치 있는 국가자원, 건강한 국토환경, 쾌적한 녹색공간 조성을 통한 산림기능의 최적 발휘를 목표로 하였다."], "answer": 0, "explain": "· 제1차 치산녹화계획(1973~)은 100만ha 조림을 4년 앞당겨 달성했다.\n· 나머지 지문은 계획 차수와 목표가 맞지 않는다.\n쉬운 풀이: 1973년 시작한 제1차 치산녹화 10개년 계획은 100만ha 조림을 6년 만에, 즉 4년 앞당겨 달성했어요. 우리나라 산림녹화의 대표 성공 사례예요.\n용어 풀이:\n· 치산녹화: 산을 다스려 푸르게 함\n· 산림기본계획: 국가 산림 장기계획\n· 산지자원화: 산을 경제 자원으로 만듦\n중요도: ★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-9", "subject": "임업경영", "num": 9, "part": 6, "stem": "국유림경영계획 수립ㆍ운영의 지황조사에 대한 설명으로 옳지 않은 것은?", "options": ["경사 25 ～ 30도 미만은 급경사지이다.", "입목도 30 %를 초과하는 임지는 입목지이다.", "해당 수종의 지위지수곡선이 없는 경우 침엽수는 잣나무 지위지수 곡선을 적용한다.", "소반경계에서 임도까지 거리가 250 m이면 지리는 3급지이다."], "answer": 0, "explain": "· 학습모듈 경사 구분: 완경사 15° 미만\n· 경사 15~20°\n· 급경사 20~25°\n· 험준 25~30°\n· 절험 30° 이상. 25~30°는 험준지.\n쉬운 풀이: 모듈 경사 구분: 완경사 15° 미만, 경사 15~20°, 급경사 20~25°, 험준 25~30°, 절험 30° 이상. 25~30°는 '험준지'라서 ①이 틀렸어요. 입목지는 입목도 30% 초과, 맞아요.\n용어 풀이:\n· 지황조사: 땅 상태 조사\n· 험준지: 매우 가파른 땅\n· 입목지: 나무가 서 있는 땅\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-10", "subject": "임업경영", "num": 10, "part": 6, "stem": "산림의 생산기간에 대한 설명으로 옳은 것은?", "options": ["윤벌기는 임분 또는 수목에 성립하며, 전체 산림을 일순벌 하는 데 요하는 기간이다.", "개벌작업에서의 갱신기란 벌채 후 벌채목이 반출되고 새로 산림이 성립될 때까지의 연수를 말한다.", "회귀년은 조림의 측면에서 기간을 길게 하여 1회 벌채량을 많게 하는 것이 유리하다.", "개량기는 유령림에서 윤벌기보다 짧기 때문에 개량기 종료 후에 수확의 지속성을 고려하여 결정해야 한다."], "answer": 1, "explain": "· 개벌작업의 갱신기 정의가 옳다.\n· 윤벌기는 작업급에 성립하고, 회귀년은 조림 측면에서 짧을수록 유리하다.\n쉬운 풀이: 개벌작업의 갱신기는 벤 뒤 나무를 다 내가고 새 숲이 성립할 때까지의 기간이에요(②). 윤벌기는 작업급에 성립하는 개념이고, 회귀년은 조림 측면에선 짧은 게 유리해요.\n용어 풀이:\n· 갱신기: 새 숲이 자리 잡는 기간\n· 작업급: 같은 방식으로 경영하는 숲 단위\n· 개량기: 숲을 개량하는 기간\n중요도: ★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-11", "subject": "임업경영", "num": 11, "part": 6, "stem": "인공조림에 의한 개벌교림작업에서 임지기망가를 증가시키는 인자의 조건으로 옳지 않은 것은? (단, 다른 인자는 변하지 않는 것으로 가정한다)", "options": ["주벌수익의 증가", "조림비의 감소", "이율의 증가", "관리비의 감소"], "answer": 2, "explain": "· 이율이 오르면 기망가는 감소한다.\n· 주벌수익↑, 조림비↓, 관리비↓는 기망가를 키운다.\n쉬운 풀이: 임지기망가는 미래 수익의 현재가치라서 이율이 오르면 '감소'해요. 주벌수익이 늘거나 조림비·관리비가 줄면 증가해요. 그래서 '이율의 증가'가 틀렸어요.\n용어 풀이:\n· 임지기망가: 임지의 미래 순수익 현재가치\n· 개벌교림작업: 모두베기로 키 큰 숲을 만드는 작업\n· 주벌수익: 최종 수확 수익\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-12", "subject": "임업경영", "num": 12, "part": 6, "stem": "산림평가와 관련된 임업 경영요소에 대한 설명으로 옳은 것은?", "options": ["조림비는 조림 초년도에 지출되는 것으로 보고 전가합계로 계산한다.", "관리비는 조림비 이외의 일체의 경비를 말한다.", "조림비의 대부분은 묘목대이다.", "주수익은 주벌수익과 간벌수익으로 나누어지며, 일반적으로 간벌 수익의 단가가 높다."], "answer": 0, "explain": "공식 정답 ①. 조림비의 대부분은 노임이고, 주벌수익의 단가가 간벌수익보다 높다.\n쉬운 풀이: 공식 정답 ①이에요. 조림비는 첫해에 드는 비용으로 보고 계산해요. 조림비의 대부분은 묘목값이 아니라 노임(인건비)이고, 단가는 간벌보다 주벌 목재가 더 높아요.\n용어 풀이:\n· 임업 경영요소: 경영에 쓰이는 비용·수익 항목\n· 관리비: 매년 드는 관리 비용\n· 간벌수익: 솎아베기로 얻은 수익\n중요도: ★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-13", "subject": "임업경영", "num": 13, "part": 6, "stem": "다음 조건의 산림을 오스트리안(Austrian) 공식으로 계산한 표준 연벌채량[㎥]은?\n\n○ 현실임분의 축적: 150㎥/ha\n\n○ 연년생장량: 6㎥/ha\n\n○ 법정축적: 180㎥/ha\n\n○ 면적: 100 ha\n\n○ 갱정기: 20년\n\n○ 윤벌기: 50년", "options": ["450", "500", "550", "600"], "answer": 0, "explain": "E = Z + (Vw − Vn)/a = 600 + (15,000 − 18,000)/20 = 450㎥\n쉬운 풀이: 오스트리안 공식: 생장량 + (현실축적 − 법정축적) ÷ 갱정기. 100ha 기준으로 생장량 600, 현실 15,000, 법정 18,000 → 600 + (15,000 − 18,000) ÷ 20 = 600 − 150 = 450㎥. 윤벌기 50년은 함정이에요.\n용어 풀이:\n· 오스트리안 공식(Kameraltaxe): 축적 차이를 조정한 벌채량 공식\n· 갱정기: 조정 기간\n· 연년생장량: 1년 생장량\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-14", "subject": "임업경영", "num": 14, "part": 6, "stem": "33년 후에 주벌수입 2,000만 원을 얻기 위한 현재가[만 원]는? (단, 연이율은 5 %이고 1.05³³ ＝ 5.0으로 한다)", "options": ["400", "450", "500", "550"], "answer": 0, "explain": "2,000 / 1.05³³ = 2,000 / 5 = 400만원\n쉬운 풀이: 현재가 = 미래 금액 ÷ (1+이율)^기간 = 2,000 ÷ 1.05³³ = 2,000 ÷ 5 = 400만원. 33년이면 돈 가치가 5배 차이 난다는 뜻이에요.\n용어 풀이:\n· 현재가(전가): 미래 돈의 지금 가치\n· 연이율: 1년 이자율\n· 주벌수입: 최종 수확 수입\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-15", "subject": "임업경영", "num": 15, "part": 6, "stem": "사회공헌형 산림탄소상쇄 운영표준 상 용어의 정의로서 옳지 않은 것은?", "options": ["탄소함량비: 건조된 바이오매스 내에 함유되어 있는 탄소량의 비율이다.", "누출량: 산림탄소상쇄사업을 실시함으로써 사업 경계 밖에서 발생하는 이산화탄소 배출 증가량을 말한다.", "베이스라인 흡수(배출)량: 산림탄소상쇄사업을 하지 않았을 경우 사업경계 내에서 통상적으로 이루어지는 활동 가운데 발생가능성이 가장 높은 활동(베이스라인)을 고려한 이산화탄소 흡수(배출)량을 말한다.", "순흡수량: 이산화탄소 총흡수량에서 베이스라인 흡수량을 뺀 값을 말한다."], "answer": 3, "explain": "순흡수량 = 총흡수량 − 베이스라인 흡수량 − 누출량. 누출량을 빼지 않아 틀림.\n쉬운 풀이: 순흡수량은 총흡수량에서 베이스라인(사업 없어도 흡수됐을 양)과 누출량(사업 때문에 밖에서 늘어난 배출)을 '모두' 빼야 해요. ④는 누출량을 빼지 않아서 틀렸어요.\n용어 풀이:\n· 순흡수량: 실제로 늘어난 흡수량\n· 베이스라인: 사업 없을 때의 흡수량\n· 누출량: 사업 경계 밖 배출 증가\n중요도: ★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-16", "subject": "임업경영", "num": 16, "part": 6, "stem": "산림기본법령상 산림기본계획 및 지역산림계획에 대한 설명으로 옳지 않은 것은?", "options": ["산림청장은 지방자치단체에 대하여 산림기본계획 및 지역산림계획의 추진실적 등을 평가하고 그 결과에 따라 예산을 차등 지원할 수 있다.", "시장ㆍ군수는 20년마다 시ㆍ군산림계획을 수립한다.", "산림기본계획구의 명칭은 산림기본계획구 앞에 해당 시ㆍ도 또는 지방산림청의 명칭을 붙인다.", "산림청장은 20년마다 산림기본계획을 수립하되, 산림의 상황 또는 경제사정의 현저한 변경 등의 사유가 있는 경우에는 이를 변경할 수 있다."], "answer": 1, "explain": "지역산림계획은 시·도지사·지방산림청장이 20년마다 수립(학습모듈 산림경영 p.42). 시장·군수는 수립 주체가 아니다.\n쉬운 풀이: 학습모듈 기준 지역산림계획은 시·도지사와 지방산림청장이 20년마다 세워요. 시장·군수는 수립 주체가 아니라서 '시장·군수가 20년마다 시·군산림계획'이 틀렸어요.\n용어 풀이:\n· 산림기본계획구: 산림기본계획을 세우는 지역 단위\n· 지역산림계획: 시·도 단위 산림계획\n· 차등 지원: 차이를 두어 지원\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-17", "subject": "임업경영", "num": 17, "part": 6, "stem": "국유림 경영계획서 작성의 임황조사에 대한 설명으로 옳지 않은 것은?", "options": ["임종은 산림이 성립된 원인을 규명하기 위한 조사사항으로 천연림과 인공림으로 구분한다.", "혼효율은 주요 수종의 입목재적ㆍ본수ㆍ수관점유면적 비율에 의하여 100분율로 산정한다.", "수종은 주수종을 기재하고 혼효림의 경우에는 점유비율 순으로 모든 수종을 차례로 기재한다.", "임령은 임분의 나이를 의미하며 임분의 최저 ～ 최고 수령의 범위를 분모로 하고 평균수령을 분자로 하여 정수단위로 표시한다."], "answer": 2, "explain": "· 혼효림은 주요 수종을 점유비율 순으로 기재한다.\n· '모든 수종'이 틀림.\n쉬운 풀이: 혼효림의 수종을 적을 땐 '주요 수종'만 점유비율 순으로 적어요. '모든 수종을 차례로 기재'가 틀렸어요. 임종·혼효율·임령 설명은 맞아요.\n용어 풀이:\n· 임황조사: 숲 상태 조사\n· 혼효율: 섞인 비율\n· 임종: 숲의 성립 원인(천연림·인공림)\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-18", "subject": "임업경영", "num": 18, "part": 6, "stem": "매년 3,000,000원씩 조림비를 8년간 지불한다면, 마지막 지불이 끝났을 때의 후가[만 원]는? (단, 연이율은 5 %이고 1.05⁸ ＝ 1.5로 한다)", "options": ["1,500", "2,000", "2,500", "3,000"], "answer": 3, "explain": "유한 연년 후가 = R[(1+P)ⁿ − 1]/P = 300 × 0.5 / 0.05 = 3,000만원\n쉬운 풀이: 매년 같은 돈을 n년 적립한 후가 = 매년 금액 × [(1+이율)^n − 1] ÷ 이율 = 300만 × (1.5 − 1) ÷ 0.05 = 300만 × 10 = 3,000만원이에요.\n용어 풀이:\n· 후가: 미래 가치\n· 유한연년이자: 정해진 기간 매년 같은 금액\n· 조림비: 나무 심는 비용\n중요도: ★★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-19", "subject": "임업경영", "num": 19, "part": 6, "stem": "임업 및 산촌 진흥촉진에 관한 법률 상 산촌진흥기본계획에 포함 되어야 하는 내용이 아닌 것은?", "options": ["도시와의 교류 촉진에 관한 사항", "도시민의 산촌 정착 지원에 관한 사항", "산촌의 녹색관광 및 생태관광 육성에 관한 사항", "산림시책의 기본목표 및 추진방향에 관한 사항"], "answer": 3, "explain": "'산림시책의 기본목표 및 추진방향'은 산림기본계획의 내용이다.\n쉬운 풀이: 산촌진흥기본계획에는 도시와의 교류, 도시민 산촌 정착 지원, 녹색·생태관광 육성 등이 들어가요. '산림시책의 기본목표·추진방향'은 산림기본계획의 내용이에요.\n용어 풀이:\n· 산촌진흥기본계획: 산촌 발전 계획\n· 녹색관광: 농산촌 체험 관광\n· 생태관광: 자연을 보며 배우는 관광\n중요도: ★★", "ref": "", "exam": "2024 임업경영"}, {"id": "9급-2024-임업경영-20", "subject": "임업경영", "num": 20, "part": 6, "stem": "산림기본법 의 내용에 대한 설명으로 옳지 않은 것은?", "options": ["산림기본법 은 산림정책의 기본이 되는 사항을 정하여 산림의 다양한 기능을 증진하고 임업의 발전을 도모함으로써 국민의 삶의 질 향상과 국민경제의 건전한 발전에 이바지함을 목적으로 한다.", "산촌이란 산림면적의 비율이 현저히 높고 인구밀도가 낮은 지역 으로서 대통령령으로 정하는 지역을 말한다.", "산림은 국토의 많은 부분을 이루는 귀중한 자산이므로 국민의 행복한 삶을 위하여 사회ㆍ경제ㆍ문화 등 다양한 분야에서 그 기능이 가장 조화롭고 알맞게 발휘될 수 있도록 경영ㆍ관리함을 산림기본법 의 기본이념으로 한다.", "산림복지란 국민에게 산림을 기반으로 산림문화ㆍ휴양, 산림교육 및 치유 등의 서비스를 창출ㆍ제공함으로써 국민의 복리 증진에 기여하기 위한 경제적ㆍ사회적ㆍ정서적 지원을 말한다."], "answer": 2, "explain": "공식 정답 ③. 산림기본법 기본이념 조문의 문구와 다르게 바꾼 지문.\n쉬운 풀이: 공식 정답 ③이에요. 산림기본법 기본이념 조문의 표현을 일부 바꿔 놓은 지문이에요. 목적·산촌·산림복지 정의는 맞는 내용이니, 기본이념 원문 문구를 한 번 읽어 두세요.\n용어 풀이:\n· 산림기본법: 산림정책의 기본 법\n· 기본이념: 법이 추구하는 근본 생각\n· 산림복지: 숲을 통한 복지 서비스\n중요도: ★", "ref": "", "exam": "2024 임업경영"}]}];
const MARKS = ["①", "②", "③", "④"];
const EXAM_MIN = 150;
const PER_SUBJECT = 20;

const store = {
  get(k, d) { try { const v = localStorage.getItem("nfcf-" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("nfcf-" + k, JSON.stringify(v)); } catch (e) {} },
};
const byId = {};
DATA.concat(PUBLIC, GONGMU).forEach(s => s.questions.forEach(q => { byId[q.id] = q; }));
const app = document.getElementById("app");
let state = null;
let timerId = null;

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => el.append(c instanceof Node ? c : document.createTextNode(c)));
  return el;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function partLabel(p) { return ["2021 공개", "기본", "심화", "참고자료", "기사기출", "법령·지침 원문", "국가직 9급 기출"][p]; }
function mark(q, k) { return q.marks ? q.marks[k] : MARKS[k]; }
function isRight(q, k) { return q.accept ? q.accept.includes(k) : k === q.answer; }
function wrongSet() { return new Set(store.get("wrong", [])); }
function saveWrong(set) { store.set("wrong", [...set]); }
function recordAnswers(list) {
  const w = wrongSet();
  list.forEach(({ q, picked }) => { if (isRight(q, picked)) w.delete(q.id); else w.add(q.id); });
  saveWrong(w);
}

/* ---------- 홈 ---------- */

  clearInterval(timerId);
  state = null;
  app.replaceChildren();
  const total = DATA.reduce((n, s) => n + s.questions.length, 0);
