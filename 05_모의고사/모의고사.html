<title>산림경영지도원 모의고사</title>
<style>
:root {
  --bg: #f6f7f4; --surface: #ffffff; --surface-2: #eef1ec; --text: #1d2420; --muted: #5d6a62;
  --line: #d8ded8; --accent: #2f6b45; --accent-soft: #e2efe6; --good: #2f7a4a; --good-soft: #e3f3e8;
  --bad: #b23b3b; --bad-soft: #f8e5e3; --warn: #9a6a12; --warn-soft: #f7eed9;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --surface: #1c221f; --surface-2: #232b27; --text: #e6ebe7; --muted: #9aa69f;
    --line: #333d38; --accent: #7cc49a; --accent-soft: #233a2d; --good: #7cc49a; --good-soft: #1f3528;
    --bad: #e58a84; --bad-soft: #3a2422; --warn: #e2b95c; --warn-soft: #3a3020;
  }
}
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1c221f; --surface-2: #232b27; --text: #e6ebe7; --muted: #9aa69f;
  --line: #333d38; --accent: #7cc49a; --accent-soft: #233a2d; --good: #7cc49a; --good-soft: #1f3528;
  --bad: #e58a84; --bad-soft: #3a2422; --warn: #e2b95c; --warn-soft: #3a3020;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
.wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.15rem; margin: 0 0 12px; }
.sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
label.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line);
  border-radius: 999px; cursor: pointer; background: var(--surface); font-size: .92rem; }
label.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
label.chip input { accent-color: var(--accent); margin: 0; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); padding: 8px 16px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
button:disabled { opacity: .45; cursor: not-allowed; }
.muted { color: var(--muted); font-size: .9rem; }
.topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 10px 0; margin-bottom: 16px; }
.topbar .inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; }
.timer.low { color: var(--bad); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button { padding: 6px 12px; font-size: .9rem; }
.tabs button.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.q { padding: 16px 0; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; }
.q .stem { font-weight: 600; margin-bottom: 10px; white-space: pre-line; }
.q .tag { font-size: .78rem; color: var(--muted); margin-left: 6px; font-weight: 400; }
.opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.explain { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: .93rem; white-space: pre-line; }
.omr { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 8px; }
.omr button { padding: 4px 0; font-size: .78rem; }
.omr button.done { background: var(--accent-soft); border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: .85rem; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.no { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.big { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.hidden { display: none !important; }
select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); }
@media (max-width: 560px) { .omr { grid-template-columns: repeat(5, 1fr); } .big { font-size: 1.8rem; } }
</style>

<script>
const DATA = [{"code": "01", "name": "조림", "kind": "필수", "questions": [{"id": "조림-1", "subject": "조림", "num": 1, "part": 1, "stem": "「지속가능한 산림자원 관리지침」상 ha당 식재본수 기준이 나머지와 다른 수종은?", "options": ["소나무", "편백", "낙엽송", "상수리나무"], "answer": 2, "explain": "낙엽송·잣나무는 ha당 3,000본, 나머지는 5,000본\n쉬운 풀이: 조림할 때 1ha(가로세로 100m 땅)에 나무를 몇 그루 심는지 묻는 문제예요. 대부분 수종은 5,000본인데, 잣나무와 낙엽송만 3,000본으로 적게 심어요. 이 두 나무는 어릴 때 빨리 자라고 가지를 넓게 펼쳐서 간격을 넓게(약 1.8m) 줘야 하기 때문이에요. '잣·낙 3천, 나머지 5천'으로 외우세요.\n용어 풀이:\n· ha(헥타르): 10,000㎡, 축구장 약 1.4개 넓이\n· 식재본수: 일정 면적에 심는 나무 그루 수\n· 낙엽송: 가을에 잎이 노랗게 지는 바늘잎나무(일본잎갈나무)", "ref": "모듈 p.29–30"}, {"id": "조림-2", "subject": "조림", "num": 2, "part": 1, "stem": "조림지 활착률 조사 결과가 65%로 나왔다. 알맞은 조치는?", "options": ["조치 불필요", "보식", "재조림", "풀베기 생략"], "answer": 1, "explain": "80% 미만 보식, 50% 미만 재조림 → 65%는 보식\n쉬운 풀이: 활착률은 심은 묘목 중 살아남아 뿌리를 내린 비율이에요. 80% 이상이면 그대로 두고, 80% 미만이면 죽은 자리만 다시 심는 '보식', 50% 미만이면 절반 넘게 죽었으니 처음부터 다시 심는 '재조림'을 해요. 65%는 50~80% 사이라서 보식이 정답이에요.\n용어 풀이:\n· 활착률: 심은 나무 중 살아서 뿌리 내린 비율\n· 보식(補植): 죽은 자리에만 보충해서 심기\n· 재조림: 실패한 조림지 전체를 다시 심기", "ref": "p.33"}, {"id": "조림-3", "subject": "조림", "num": 3, "part": 1, "stem": "사업지 면적 1ha 이상인 조림지의 활착률 조사 표준지 크기로 옳은 것은?", "options": ["100㎡ (반지름 5.67m 원)", "200㎡ (반지름 8.0m 원)", "400㎡ (20m × 20m)", "50㎡ (반지름 4.0m 원)"], "answer": 1, "explain": "200㎡(반지름 8.0m). 1ha 미만이면 100㎡(5.67m) 가능\n쉬운 풀이: 조림지가 잘 됐는지 보려면 전체를 다 세지 않고 일부만 표본으로 조사해요. 이 표본 구역을 표준지라고 하는데, 사업지가 1ha 이상이면 200㎡(반지름 8m인 원) 크기로 잡아요. 1ha 미만인 작은 사업지는 100㎡(반지름 5.67m)로 줄여도 돼요.\n용어 풀이:\n· 표준지: 전체를 대표하도록 골라 조사하는 작은 구역\n· 사업지: 조림 등 산림사업을 하는 땅", "ref": "p.149 붙임2"}, {"id": "조림-4", "subject": "조림", "num": 4, "part": 1, "stem": "온대중부 지역의 봄철 식재 적기는?", "options": ["2월 하순 ~ 3월 하순", "3월 상순 ~ 4월 상순", "3월 중순 ~ 4월 중순", "3월 하순 ~ 4월 하순"], "answer": 2, "explain": "난대 2하~3하, 온대남부 3상~4상, 온대중부 3중~4중, 온대북부 3하~4하\n쉬운 풀이: 봄에 나무를 심기 좋은 시기는 따뜻한 남쪽일수록 빠르고 추운 북쪽일수록 늦어요. 난대(제주·남해안) 2월 하순~3월 하순 → 온대남부 3월 상순~4월 상순 → 온대중부 3월 중순~4월 중순 → 온대북부 3월 하순~4월 하순 순서로 열흘씩 밀린다고 기억하면 쉬워요.\n용어 풀이:\n· 식재 적기: 묘목을 심기에 가장 알맞은 때\n· 온대중부: 우리나라 중부 지방(경기·충청 등) 기후대\n· 상순·중순·하순: 한 달의 초(1~10일)·중(11~20일)·말(21일~)", "ref": "p.29"}, {"id": "조림-5", "subject": "조림", "num": 5, "part": 1, "stem": "같은 지역에서 표고가 300m 높은 조림지의 침엽수 봄 식재 적기는 어떻게 되는가?", "options": ["약 5일 빨라진다", "약 5일 늦어진다", "약 15일 늦어진다", "약 15일 빨라진다"], "answer": 2, "explain": "표고 100m마다 약 5일 늦어짐 → 300m면 약 15일\n쉬운 풀이: 산은 높이 올라갈수록 기온이 낮아져서 봄이 늦게 와요. 그래서 표고(해발고도)가 100m 높아질 때마다 식재 시기를 약 5일 늦춰요. 300m 높으면 5일 × 3 = 15일 늦어지는 거예요.\n용어 풀이:\n· 표고: 바닷물 높이를 0으로 잰 땅의 높이(해발고도)\n· 침엽수: 소나무처럼 바늘 모양 잎을 가진 나무", "ref": "p.30"}, {"id": "조림-6", "subject": "조림", "num": 6, "part": 1, "stem": "산벌작업의 벌채 순서로 옳은 것은?", "options": ["예비벌 → 하종벌 → 후벌", "하종벌 → 예비벌 → 후벌", "후벌 → 하종벌 → 예비벌", "예비벌 → 후벌 → 하종벌"], "answer": 0, "explain": "산벌 = 예비벌 → 하종벌 → 후벌 (전갱작업)\n쉬운 풀이: 산벌작업은 숲을 한 번에 다 베지 않고 세 번에 나눠 베면서 어미나무 씨앗으로 새 숲을 키우는 방법이에요. ① 예비벌로 숲을 솎아 씨가 잘 맺히고 땅이 준비되게 하고 → ② 하종벌로 씨가 떨어지게(하종) 베고 → ③ 어린나무가 자라면 남은 어미나무를 후벌로 벱니다. '준비-씨뿌리기-마무리' 순서예요.\n용어 풀이:\n· 산벌작업: 여러 번 나눠 베며 천연 씨앗으로 갱신하는 방법\n· 하종(下種): 씨앗이 땅에 떨어지는 것\n· 갱신: 늙은 숲을 베고 새 숲으로 바꾸는 일", "ref": "p.34–36"}, {"id": "조림-7", "subject": "조림", "num": 7, "part": 1, "stem": "참나무류 움싹갱신지에서 벌채 후 3년 안에 움싹이 ha당 몇 본 미만이면 조림하는가?", "options": ["900본", "1,600본", "3,000본", "5,000본"], "answer": 2, "explain": "3년 안에 움싹 ha당 3,000본 미만이면 조림\n쉬운 풀이: 참나무는 베고 나면 그루터기에서 새싹(움싹)이 올라와 다시 숲이 돼요. 하지만 베고 3년이 지나도 움싹이 1ha에 3,000본이 안 되면 숲이 제대로 안 만들어지니 사람이 묘목을 심어(조림) 보충해야 해요.\n용어 풀이:\n· 움싹(맹아): 그루터기나 뿌리에서 새로 돋는 싹\n· 움싹갱신: 움싹을 키워 새 숲을 만드는 방법\n· 그루터기: 나무를 베고 남은 밑동", "ref": "p.38–40"}, {"id": "조림-8", "subject": "조림", "num": 8, "part": 1, "stem": "산림자원법상 벌채 후 조림하지 않아도 되는 경우가 **아닌** 것은?", "options": ["어린나무가 ha당 2만본 이상 고르게 자라는 경우", "참나무류 어린나무가 ha당 5천본 이상인 경우", "움싹이 왕성한 참나무류 그루터기가 ha당 900개 정도인 경우", "소나무 어린나무가 ha당 5천본 이상인 경우"], "answer": 3, "explain": "면제 기준은 어린나무 2만본, 참나무류 어린나무 5천본, 참나무 그루터기 900개\n쉬운 풀이: 나무를 벤 뒤에는 원칙적으로 다시 심어야 하지만, 이미 어린나무가 충분히 자라고 있으면 안 심어도 돼요. 면제 기준은 ① 어린나무 2만본 이상 ② '참나무류' 어린나무 5천본 이상 ③ 움싹 좋은 참나무 그루터기 900개 정도예요. 5천본 기준은 참나무류에만 해당하니 '소나무 5천본'은 틀린 거예요.\n용어 풀이:\n· 조림 의무 면제: 벌채 후 다시 심지 않아도 되는 경우\n· 어린나무(치수): 자연적으로 나서 자라는 어린 나무", "ref": "법규 모듈 p.7"}, {"id": "조림-9", "subject": "조림", "num": 9, "part": 1, "stem": "풀베기에 대한 설명으로 옳지 **않은** 것은?", "options": ["조림 당년부터 5년차까지 실시한다", "줄베기 폭은 90~100cm로 한다", "둘레베기는 조림목 주위 반경 50cm를 벤다", "연 2회 실시할 때 2차 풀베기는 10월에 한다"], "answer": 3, "explain": "2회면 2차는 8월~9월 초순(최대 9월 중순)\n쉬운 풀이: 풀베기는 어린 묘목이 잡초에 가려 햇빛을 못 받지 않도록 주변 풀을 베는 작업이에요. 심은 해부터 5년차까지 하고, 1년에 두 번 하면 두 번째는 8월~9월 초에 해요. 10월은 이미 풀이 시들고 나무도 겨울 준비를 하는 때라 의미가 없어요.\n용어 풀이:\n· 풀베기(하예): 조림목 주변 잡초를 베는 작업\n· 줄베기: 나무가 심긴 줄을 따라 띠 모양으로 베기\n· 둘레베기: 나무 둘레만 동그랗게 베기", "ref": "p.51–52"}, {"id": "조림-10", "subject": "조림", "num": 10, "part": 1, "stem": "덩굴제거 대상지 기준이 되는 덩굴 피복도는?", "options": ["30%", "50%", "70%", "80%"], "answer": 1, "explain": "피복도 50% 이상\n쉬운 풀이: 칡 같은 덩굴은 나무를 감고 올라가 햇빛을 가리고 줄기를 조여요. 덩굴이 땅이나 나무를 덮은 비율(피복도)이 50% 이상, 즉 절반 이상을 덮으면 덩굴제거 대상지가 돼요.\n용어 풀이:\n· 덩굴제거: 칡·다래 등 덩굴식물을 없애는 작업\n· 피복도: 식물이 땅을 덮고 있는 비율", "ref": "p.55"}, {"id": "조림-11", "subject": "조림", "num": 11, "part": 1, "stem": "어린나무가꾸기 대상지 기준으로 옳은 것은?", "options": ["조림 후 3~10년, 평균 흉고직경 1~4cm", "조림 후 10~20년, 평균 흉고직경 8~14cm", "조림 후 1~5년, 평균 흉고직경 2cm 미만", "조림 후 5~15년, 평균 흉고직경 2~8cm"], "answer": 3, "explain": "조림 후 5~15년, DBH 2~8cm\n쉬운 풀이: 어린나무가꾸기는 심은 나무가 어느 정도 자랐을 때 쓸모없는 나무와 모양 나쁜 나무를 정리해주는 작업이에요. 조림 후 5~15년 된 숲, 가슴높이 지름이 2~8cm 정도인 숲이 대상이에요. '5~15년, 2~8cm'를 세트로 외우세요.\n용어 풀이:\n· 어린나무가꾸기(제벌): 어린 숲에서 불필요한 나무를 베는 작업\n· 흉고직경(DBH): 사람 가슴 높이(1.2m)에서 잰 나무 지름", "ref": "p.64"}, {"id": "조림-12", "subject": "조림", "num": 12, "part": 1, "stem": "가지치기에 대한 설명으로 옳지 **않은** 것은?", "options": ["산 가지치기는 11월부터 이듬해 5월 이전에 한다", "지름 5cm 이상인 가지는 자르지 않는다", "침엽수는 절단면이 줄기와 평행하게 자른다", "목표생산재가 일반소경재(톱밥·펄프·숯)인 임분도 반드시 실시한다"], "answer": 3, "explain": "일반소경재가 목표면 가지치기 안 함\n쉬운 풀이: 가지치기는 옹이 없는 좋은 목재를 얻으려고 아래쪽 가지를 자르는 작업이에요. 그런데 톱밥·펄프·숯처럼 잘게 부숴 쓰는 목재(일반소경재)를 만들 숲이라면 옹이가 있어도 상관없으니 가지치기를 할 필요가 없어요. 그래서 '반드시 실시한다'가 틀렸어요.\n용어 풀이:\n· 가지치기: 나무의 아래쪽 가지를 잘라 주는 작업\n· 옹이: 가지가 붙어 있던 자리가 목재에 남은 흔적\n· 소경재: 굵기가 가는 목재", "ref": "p.69–70"}, {"id": "조림-13", "subject": "조림", "num": 13, "part": 1, "stem": "정량간벌·도태간벌을 적용할 수 있는 임분 조건은?", "options": ["우세목 평균수고 10m 이상이면서 15년생 이상", "우세목 평균수고 8m 이상이면서 10년생 이상", "평균 흉고직경 20cm 이상이면서 20년생 이상", "평균수고 15m 이상이면서 30년생 이상"], "answer": 0, "explain": "우세목 평균수고 10m 이상 + 15년생 이상\n쉬운 풀이: 간벌(솎아베기)을 시작해도 될 만큼 숲이 자랐는지 보는 기준이에요. 우세목(키 큰 나무들)의 평균 키가 10m 이상이고 나이가 15년 이상이어야 정량간벌·도태간벌을 할 수 있어요. '10m·15년'으로 외우세요.\n용어 풀이:\n· 간벌(솎아베기): 빽빽한 숲에서 일부 나무를 베어 남은 나무가 잘 자라게 하는 작업\n· 우세목: 숲에서 키가 크고 세력이 좋은 나무\n· 정량간벌: 표에 정해진 본수만큼 남기는 간벌", "ref": "p.72"}, {"id": "조림-14", "subject": "조림", "num": 14, "part": 1, "stem": "간벌 후 입목본수 기준표에서 낙엽송, 평균 흉고직경 16cm일 때 ha당 잔존본수는?", "options": ["760본", "900본", "940본", "1,100본"], "answer": 1, "explain": "낙엽송 16cm = 900본 (잣나무 760, 리기다 940, 소나무 강원 1,100)\n쉬운 풀이: 간벌을 할 때 몇 그루를 남길지는 수종과 나무 굵기별로 표에 정해져 있어요. 나무가 굵어질수록 한 그루가 차지하는 공간이 커지니 남기는 본수는 줄어들어요. 낙엽송 지름 16cm면 900본을 남겨요.\n용어 풀이:\n· 입목본수: 서 있는 나무의 그루 수\n· 잔존본수: 간벌 후 남겨 두는 나무 수", "ref": "p.150 붙임3"}, {"id": "조림-15", "subject": "조림", "num": 15, "part": 1, "stem": "도태간벌에 대한 설명으로 옳지 **않은** 것은?", "options": ["미래목 사이는 최소 5m 이상 띄운다", "활엽수 미래목은 ha당 200본 내외로 고른다", "미래목은 가슴높이에 폭 10cm 적색 수성페인트로 표시한다", "하층의 보호목은 제거하지 않는다"], "answer": 2, "explain": "미래목 표시는 황색\n쉬운 풀이: 도태간벌은 끝까지 키울 좋은 나무(미래목)를 먼저 고르고, 그 나무 성장을 방해하는 나무를 베는 방법이에요. 미래목은 가슴 높이에 폭 10cm의 '황색(노란색)' 띠로 표시해요. 적색이라고 하면 틀려요.\n용어 풀이:\n· 도태간벌: 미래목 위주로 방해목을 제거하는 간벌\n· 미래목: 최종 수확까지 키울 우량한 나무\n· 보호목: 미래목 줄기를 감싸 보호하는 아래층 나무", "ref": "p.76–78"}, {"id": "조림-16", "subject": "조림", "num": 16, "part": 1, "stem": "공·사유림 기준벌기령으로 짝지은 것 중 옳지 **않은** 것은?", "options": ["소나무 – 40년", "잣나무 – 50년", "낙엽송 – 30년", "참나무류 – 40년"], "answer": 3, "explain": "참나무류는 공·사유림 25년(기업경영림 20년)\n쉬운 풀이: 기준벌기령은 나무를 수확(벌채)해도 되는 최소 나이예요. 공·사유림에서 소나무 40년, 잣나무 50년, 낙엽송 30년이고 참나무류는 25년이에요. 참나무는 표고버섯 원목 등으로 일찍 쓰기 때문에 기준이 짧아요.\n용어 풀이:\n· 기준벌기령: 벌채할 수 있는 나무의 최소 나이\n· 공·사유림: 국가 소유가 아닌 공공기관·개인 소유 산림", "ref": "p.151 붙임4"}, {"id": "조림-17", "subject": "조림", "num": 17, "part": 1, "stem": "「산림자원법 시행규칙」 [별표 3](모듈 붙임4)상 모두베기 1개 벌채구역의 최대 면적은?", "options": ["5만㎡", "10만㎡", "30만㎡", "50만㎡"], "answer": 2, "explain": "별표3 기준 최대 30만㎡, 5만㎡ 이상이면 20% 이상 존치. (지침 본문 p.90은 \"모두베기 대상지 최대 50ha 이내\"로 표현이 다르니 지문의 근거를 확인할 것)\n쉬운 풀이: 모두베기(개벌)는 한 구역의 나무를 한 번에 다 베는 방법이에요. 너무 넓게 베면 산사태·토사 유출 위험이 커지니 한 구역 최대 30만㎡(30ha)로 제한하고, 5만㎡ 이상이면 20% 이상은 숲을 남겨 둬야 해요.\n용어 풀이:\n· 모두베기(개벌): 한 구역의 나무를 모두 베는 수확 방법\n· 존치: 베지 않고 남겨 두는 것", "ref": "p.152"}, {"id": "조림-18", "subject": "조림", "num": 18, "part": 1, "stem": "골라베기(택벌)의 벌채 재적 한도는? (표고용 제외)", "options": ["20% 이내", "30% 이내", "40% 이내", "50% 이내"], "answer": 1, "explain": "30% 이내, 표고용은 50%\n쉬운 풀이: 골라베기(택벌)는 다 자란 나무만 골라서 베는 방법이에요. 숲이 망가지지 않도록 한 번에 전체 재적(나무 부피)의 30%까지만 벨 수 있어요. 표고버섯 재배용 참나무를 벨 때만 50%까지 허용해요.\n용어 풀이:\n· 골라베기(택벌): 성숙한 나무만 골라서 베는 방법\n· 재적: 나무 줄기의 부피(㎥)", "ref": "p.152"}, {"id": "조림-19", "subject": "조림", "num": 19, "part": 1, "stem": "[전공서적 범위] 순량률 90%, 발아율 80%인 종자의 효율은?", "options": ["72%", "80%", "85%", "90%"], "answer": 0, "explain": "효율 = 순량률 × 발아율 = 0.9 × 0.8 = 72%\n쉬운 풀이: 종자 효율은 '실제로 싹이 날 수 있는 쓸 만한 씨앗의 비율'이에요. 먼저 쭉정이·흙을 뺀 깨끗한 씨앗 비율(순량률)을 구하고, 거기에 싹 트는 비율(발아율)을 곱해요. 0.9 × 0.8 = 0.72, 즉 72%예요.\n용어 풀이:\n· 순량률: 전체 종자 중 이물질을 뺀 순수 종자의 무게 비율\n· 발아율: 뿌린 씨앗 중 싹이 트는 비율\n· 효율: 순량률 × 발아율", "ref": "산림기사 조림학"}, {"id": "조림-20", "subject": "조림", "num": 20, "part": 1, "stem": "목재생산림의 목표생산재 중 대경재의 가슴높이지름 기준은?", "options": ["20cm 이상", "30cm 이상", "36cm 이상", "40cm 이상"], "answer": 3, "explain": "대경재 40cm 이상, 중경재 20~40cm, 소경재 20cm 미만\n쉬운 풀이: 목재생산림에서 최종 목표로 하는 목재 굵기 기준이에요. 가슴높이 지름 40cm 이상이면 대경재, 20~40cm면 중경재, 20cm 미만이면 소경재예요. '20, 40'이 경계선이에요.\n용어 풀이:\n· 목재생산림: 좋은 목재 생산을 주목적으로 관리하는 숲\n· 대경재: 굵은 목재\n· 목표생산재: 숲을 가꿔 최종적으로 얻으려는 목재", "ref": "p.8–9"}, {"id": "조림-21", "subject": "조림", "num": 21, "part": 2, "stem": "수원함양림에서 솎아베기를 할 때 유지하는 수관울폐도의 원칙은?", "options": ["30~50%", "50~80%", "80~90%", "90% 이상"], "answer": 1, "explain": "수원함양림 솎아베기는 수관울폐도 50~80% 유지가 원칙\n쉬운 풀이: 수원함양림은 비를 머금었다가 천천히 흘려보내 물을 공급하는 숲이에요. 너무 많이 베면 땅이 드러나 물을 못 머금으니, 솎아베기 후에도 나무 윗부분(수관)이 하늘을 50~80% 가리도록 유지해요.\n용어 풀이:\n· 수원함양림: 물을 저장·공급하는 기능을 우선하는 숲\n· 수관울폐도: 나무의 잎·가지(수관)가 하늘을 가리는 비율", "ref": "모듈 p.12"}, {"id": "조림-22", "subject": "조림", "num": 22, "part": 2, "stem": "수원함양림의 덩굴제거에서 약제를 쓰지 않고 인력으로만 제거해야 하는 범위는? (하천·계곡 홍수위, 호소 만수위 등 수계 기준)", "options": ["30m 이내", "50m 이내", "100m 이내", "200m 이내"], "answer": 2, "explain": "수계로부터 100m 이내 또는 집수유역 안은 인력 제거\n쉬운 풀이: 물을 공급하는 숲에서 약을 뿌리면 약 성분이 하천·호수로 흘러들어 물을 오염시킬 수 있어요. 그래서 하천·계곡·호수 등 물가에서 100m 안쪽에서는 약제 없이 사람 손으로만 덩굴을 제거해요.\n용어 풀이:\n· 수계: 하천·계곡·호수처럼 물이 흐르거나 모이는 곳\n· 홍수위: 홍수 때 물이 차오르는 높이\n· 만수위: 호수에 물이 가득 찼을 때의 높이", "ref": "p.11"}, {"id": "조림-23", "subject": "조림", "num": 23, "part": 2, "stem": "산지재해방지림 중 사방지 조림수종으로 권장되는 질소고정 수종이 **아닌** 것은?", "options": ["오리나무", "아까시나무", "싸리나무", "잣나무"], "answer": 3, "explain": "사방지는 오리나무·아까시나무·싸리나무 등 질소고정 수종 + 속성수 혼합\n쉬운 풀이: 사방지는 흙이 무너지거나 쓸려 내려간 곳을 복구한 땅이라 영양분이 부족해요. 그래서 뿌리에 사는 세균의 도움으로 공기 중 질소를 비료처럼 만드는 '질소고정 수종'(오리나무, 아까시나무, 싸리나무)을 심어요. 잣나무는 질소고정을 못 해요.\n용어 풀이:\n· 사방지: 산사태·토사 유출을 막기 위해 공사한 땅\n· 질소고정: 공기 중 질소를 식물이 쓸 수 있는 양분으로 바꾸는 작용\n· 속성수: 빨리 자라는 나무", "ref": "p.13"}, {"id": "조림-24", "subject": "조림", "num": 24, "part": 2, "stem": "사방지 등 토사유출 우려 산림의 조림수종 선정 기준으로 옳은 것은?", "options": ["토심이 깊은 곳은 침엽수, 얕은 곳은 활엽수 위주", "토심이 깊은 곳은 활엽수, 얕은 곳은 침엽수 위주", "토심과 관계없이 천근성 수종 위주", "토심과 관계없이 속성수 단순림"], "answer": 1, "explain": "토심 깊은 곳 활엽수, 얕은 곳 침엽수\n쉬운 풀이: 흙이 깊은 곳에는 뿌리를 깊고 넓게 뻗는 활엽수를 심어 흙을 단단히 붙잡게 하고, 흙이 얕은 곳에는 척박한 땅에도 강한 침엽수를 심어요. '깊으면 활엽, 얕으면 침엽'으로 외우세요.\n용어 풀이:\n· 토심: 흙의 깊이\n· 활엽수: 넓은 잎을 가진 나무(참나무 등)\n· 토사유출: 흙과 모래가 빗물에 쓸려 내려가는 것", "ref": "p.13"}, {"id": "조림-25", "subject": "조림", "num": 25, "part": 2, "stem": "대형산불 피해지를 복구할 때 내화수림대 조성 기준으로 옳은 것은?", "options": ["주풍 방향을 고려해 30m 내외의 내화수림대를 교호로 조성하고, 내화수림대 간 간격은 30m 이상", "주풍과 직각 방향으로 10m 내외, 간격 10m 이상", "능선을 따라서만 100m 폭으로 조성", "침엽수 위주로 50m 폭, 간격 제한 없음"], "answer": 0, "explain": "주풍 방향 고려, 참나무류 등 내화수종 30m 내외 교호 조성, 간격 30m 이상\n쉬운 풀이: 큰 산불이 난 곳을 다시 숲으로 만들 때는 불에 잘 안 타는 나무(참나무류 등)로 띠 모양 숲(내화수림대)을 만들어 다음 산불이 번지는 걸 막아요. 바람 방향을 고려해 폭 30m 정도로 번갈아 만들고, 띠 사이 간격도 30m 이상 둬요.\n용어 풀이:\n· 내화수림대: 불에 강한 나무로 만든 띠 모양 숲(방화선 역할)\n· 주풍: 그 지역에서 주로 부는 바람\n· 교호: 서로 번갈아", "ref": "p.14"}, {"id": "조림-26", "subject": "조림", "num": 26, "part": 2, "stem": "자연환경보전림 중 '문화형'에서 모두베기·어미나무작업을 할 때 하나의 벌채구역 면적은?", "options": ["1ha 미만", "2ha 미만", "5ha 미만", "10ha 미만"], "answer": 1, "explain": "문화형 2ha 미만 + 벌채구역 사이 20m 이상 수림대 존치 (보전형은 5ha 미만)\n쉬운 풀이: 자연환경보전림은 자연·문화 가치를 지키는 숲이라 한꺼번에 넓게 베면 안 돼요. 그중 문화형(문화재 주변 숲 등)은 더 엄격해서 한 벌채구역을 2ha 미만으로 하고, 구역 사이엔 20m 이상 숲띠를 남겨요. 보전형은 조금 넓은 5ha 미만이에요. '문화 2, 보전 5'.\n용어 풀이:\n· 자연환경보전림: 생태·문화·학술 가치를 지키기 위한 숲\n· 어미나무작업(모수작업): 씨앗을 떨어뜨릴 어미나무만 남기고 베는 방법\n· 수림대: 띠 모양으로 남긴 숲", "ref": "p.17–18"}, {"id": "조림-27", "subject": "조림", "num": 27, "part": 2, "stem": "자연환경보전림의 유형 구분이 **아닌** 것은?", "options": ["보전형", "문화형", "학술·교육형", "경관형"], "answer": 3, "explain": "· 보전형·문화형·학술교육형\n· 경관형은 생활환경보전림 유형\n쉬운 풀이: 자연환경보전림은 '무엇을 지키느냐'에 따라 보전형(생태계), 문화형(문화유산), 학술·교육형(연구·교육)으로 나눠요. 경관형은 도시 주변 생활환경보전림의 유형이에요. 자연환경보전림은 '보·문·학' 세 가지로 외우세요.\n용어 풀이:\n· 보전형: 생태계·희귀동식물 보호 목적\n· 문화형: 사찰·문화재 주변 숲\n· 경관형: 보기 좋은 풍경을 위해 관리하는 숲(생활환경보전림)", "ref": "p.15"}, {"id": "조림-28", "subject": "조림", "num": 28, "part": 2, "stem": "산림휴양림에서 '공간이용지역'으로 구분하는 범위는?", "options": ["시설부지·등산로·산책로 주변 가시권을 고려한 30m 이내", "시설부지 주변 100m 이내", "휴양림 전체 면적의 50%", "진입도로에서 500m 이내"], "answer": 0, "explain": "가시권 고려 30m 이내 = 공간이용지역, 나머지 = 자연유지지역\n쉬운 풀이: 자연휴양림은 사람이 많이 다니는 곳과 자연 그대로 둘 곳을 나눠 관리해요. 시설·등산로·산책로에서 눈에 보이는 범위인 30m 이내를 '공간이용지역'으로 정해 보기 좋게 가꾸고, 나머지는 '자연유지지역'으로 그대로 둬요.\n용어 풀이:\n· 산림휴양림: 사람들이 쉬고 즐기도록 조성한 숲\n· 가시권: 눈으로 볼 수 있는 범위\n· 공간이용지역: 방문객이 이용하는 공간 주변", "ref": "p.18"}, {"id": "조림-29", "subject": "조림", "num": 29, "part": 2, "stem": "산림휴양림 공간이용지역의 숲가꾸기 기준으로 옳지 **않은** 것은?", "options": ["제초제 사용 금지", "희귀식물·노령목·괴목은 보존", "열식간벌 등 기계적 솎아베기를 우선 적용", "작업은 방문객이 적은 시기에 실시"], "answer": 2, "explain": "열식간벌 등 기계적 솎아베기는 금지, 약도의 솎아베기\n쉬운 풀이: 휴양림 공간이용지역은 방문객이 보는 곳이라 자연스럽고 보기 좋게 가꿔야 해요. 줄을 맞춰 기계적으로 베는 열식간벌은 숲이 인공적으로 보여서 금지하고, 조금씩만 베는 약도의 솎아베기를 해요. 제초제도 안 쓰고 노령목·희귀식물은 보존해요.\n용어 풀이:\n· 열식간벌: 나무 줄을 기준으로 일정 줄마다 베는 기계적 간벌\n· 약도: 약한 정도(조금만)\n· 괴목: 모양이 특이한 오래된 나무", "ref": "p.19"}, {"id": "조림-30", "subject": "조림", "num": 30, "part": 2, "stem": "생활환경보전림의 유형이 **아닌** 것은?", "options": ["공원형", "방풍·방음형", "미세먼지 저감형", "수원함양형"], "answer": 3, "explain": "공원형·경관형·방풍방음형·생산형·미세먼지 저감형\n쉬운 풀이: 생활환경보전림은 도시·마을 사람들의 생활환경을 좋게 하는 숲이에요. 공원형, 경관형, 방풍·방음형, 생산형, 미세먼지 저감형이 있어요. 수원함양은 별도의 '수원함양림'이라는 다른 기능이에요.\n용어 풀이:\n· 생활환경보전림: 생활권 주변의 쾌적한 환경을 위한 숲\n· 방풍·방음: 바람과 소음을 막음\n· 미세먼지 저감: 미세먼지를 줄임", "ref": "p.19–20"}, {"id": "조림-31", "subject": "조림", "num": 31, "part": 2, "stem": "자연환경보전림(보전형) 중 채종림의 솎아베기 원칙은?", "options": ["솎아베기를 하지 않는다", "강도의 솎아베기로 종자 생산량과 품질을 개선한다", "약도의 솎아베기를 10년 간격으로 한다", "열식간벌만 한다"], "answer": 1, "explain": "채종림은 강도의 솎아베기로 종자 생산량·품질 개선\n쉬운 풀이: 채종림은 좋은 씨앗을 얻으려고 지정한 숲이에요. 나무가 빽빽하면 햇빛을 못 받아 씨가 적게 열리니, 강하게(많이) 솎아베어서 남은 나무가 햇빛을 듬뿍 받고 씨를 많이·좋게 맺도록 해요.\n용어 풀이:\n· 채종림: 우량 종자를 채취하기 위해 지정한 숲\n· 강도의 솎아베기: 많은 양을 베는 간벌", "ref": "p.17"}, {"id": "조림-32", "subject": "조림", "num": 32, "part": 2, "stem": "단목택벌로 복층림을 조성할 때 수하식재 방법은?", "options": ["상층목에서 2m 떨어진 공간에 1.8m 간격으로 식재", "상층목 바로 아래에 1m 간격으로 식재", "상층목에서 5m 떨어진 공간에 3m 간격으로 식재", "상층목을 모두 벌채한 뒤 1.4m 간격으로 식재"], "answer": 0, "explain": "· 상층목에서 2m 떨어진 공간에 1.8m 간격\n· 최종 수확 ha당 200~300본\n· Ⅴ영급 이상\n쉬운 풀이: 단목택벌로 위층 큰 나무를 몇 그루씩 베고 그 아래에 어린나무를 심어 2층 숲(복층림)을 만드는 방법이에요. 큰 나무 바로 밑은 그늘이 짙으니 2m 떨어진 곳에 1.8m 간격으로 심어요. 최종 수확은 ha당 200~300본, Ⅴ영급(41~50년) 이상 숲이 대상이에요.\n용어 풀이:\n· 복층림: 키가 다른 나무들이 위아래 2층 이상으로 자라는 숲\n· 수하식재: 큰 나무 아래에 묘목을 심는 것\n· 영급: 나무 나이를 10년 단위로 묶은 등급(Ⅴ영급=41~50년)", "ref": "p.87"}, {"id": "조림-33", "subject": "조림", "num": 33, "part": 2, "stem": "임연부의 범위는 산림과 비산림의 경계에서 산림 쪽으로 어느 정도인가?", "options": ["10m 내외", "20m 내외", "30m 내외", "50m 내외"], "answer": 2, "explain": "경계에서 산림 쪽 30m 내외 (5m 미만 임도·시설물은 제외)\n쉬운 풀이: 임연부는 숲과 숲이 아닌 곳(농경지·도로 등)이 만나는 숲의 가장자리예요. 경계선에서 숲 안쪽으로 30m 정도를 임연부로 봐요. 가장자리는 바람·햇빛을 많이 받아 생태적으로 특별한 공간이에요.\n용어 풀이:\n· 임연부(林緣部): 숲의 가장자리 지역\n· 비산림: 농경지·도로·주택처럼 숲이 아닌 땅", "ref": "p.88"}, {"id": "조림-34", "subject": "조림", "num": 34, "part": 2, "stem": "임연부를 조성할 때 비산림 쪽에서부터의 바람직한 구조는?", "options": ["초본 → 관목 → 아교목 → 교목 순의 계단형", "교목 → 아교목 → 관목 → 초본 순", "교목만으로 밀식", "초본만 유지"], "answer": 0, "explain": "초본 → 관목 → 아교목 → 교목 계단형\n쉬운 풀이: 숲 가장자리는 바깥에서부터 키 작은 식물 → 큰 나무 순서로 계단처럼 높아지게 만드는 게 좋아요. 풀(초본) → 떨기나무(관목) → 작은 나무(아교목) → 큰 나무(교목) 순이에요. 이렇게 하면 바람이 숲 안으로 바로 들이치지 않고 동물 서식지도 다양해져요.\n용어 풀이:\n· 초본: 풀\n· 관목: 진달래처럼 키가 작고 줄기가 여러 개인 나무\n· 아교목: 중간 키 나무\n· 교목: 소나무처럼 줄기가 하나이고 키 큰 나무", "ref": "p.88"}, {"id": "조림-35", "subject": "조림", "num": 35, "part": 2, "stem": "「지속가능한 산림자원 관리지침」상 수확을 위한 벌채금지구역이 **아닌** 것은?", "options": ["생태통로 역할을 하는 주능선 8부 이상부터 정상부", "호소·저수지·하천 등 수변 만수위로부터 30m 내외", "벌채구역과 벌채구역 사이 20m 폭의 잔존수림대", "도로로부터 폭 50m 이내 지역"], "answer": 3, "explain": "도로변은 폭 20m 이내\n쉬운 풀이: 수확 벌채를 해서는 안 되는 곳이 정해져 있어요. 동물이 이동하는 주능선 윗부분, 물가(만수위에서 30m 내외), 벌채구역 사이에 남기는 20m 숲띠 등이에요. 도로변은 50m가 아니라 폭 20m 이내가 벌채금지구역이에요.\n용어 풀이:\n· 벌채금지구역: 나무를 베면 안 되는 구역\n· 생태통로: 동물이 이동하는 길\n· 주능선 8부: 능선 높이의 80% 지점", "ref": "p.90"}, {"id": "조림-36", "subject": "조림", "num": 36, "part": 2, "stem": "지침상 어미나무작업 후 3년 이내에 어린나무 발생량이 ha당 얼마 미만이면 조림 또는 보완조림을 하는가?", "options": ["3,000본", "5,000본", "10,000본", "20,000본"], "answer": 1, "explain": "3년 이내 ha당 5,000본 미만이면 조림·보완조림\n쉬운 풀이: 어미나무작업은 씨를 떨어뜨릴 어미나무만 남기고 베어 자연적으로 어린나무가 나게 하는 방법이에요. 3년이 지나도 어린나무가 ha당 5,000본이 안 되면 자연 갱신이 부족하니 사람이 심어 보충해요. 참나무 움싹(3,000본) 기준과 헷갈리지 마세요.\n용어 풀이:\n· 어미나무작업(모수작업): 씨앗을 공급할 어미나무만 남기는 갱신법\n· 보완조림: 부족한 곳에 추가로 심기", "ref": "p.91"}, {"id": "조림-37", "subject": "조림", "num": 37, "part": 2, "stem": "친환경 벌채에서 군상 또는 수림대 존치구역 경계목 표시 방법은?", "options": ["백색 페인트, 폭 5cm", "적색 페인트, 폭 10cm", "노란색 페인트, 폭 10cm", "청색 리본"], "answer": 2, "explain": "경계부 나무 가슴높이에 노란색 페인트 폭 10cm (산주 직접 벌채 시 생략 가능)\n쉬운 풀이: 친환경 벌채 때 남겨 둘 숲(군상·수림대)의 경계에 있는 나무에는 노란색 페인트로 가슴높이에 10cm 폭 띠를 칠해 '여기부터는 베지 마세요' 표시를 해요. 숲 관련 '남겨라/좋은 나무' 표시는 대체로 노란색(황색)이라고 기억하세요.\n용어 풀이:\n· 군상: 무리 지어 남긴 나무 덩어리\n· 경계목: 구역 경계에 있는 나무\n· 산주: 산의 주인", "ref": "p.92"}, {"id": "조림-38", "subject": "조림", "num": 38, "part": 2, "stem": "🆕 2026 개정 '산림사업 작업종류별 고위험 사용 장비'에서 굴착기 부착 나무집게(우드그랩)를 사용할 수 있는 지형은?", "options": ["15° 이하 완경사면", "25° 이하", "35° 이하", "경사 제한 없음"], "answer": 0, "explain": "우드그랩은 15° 이하 완경사면에서 사용 (2026.8.30 개정 반영 표)\n쉬운 풀이: 2026년 학습모듈에 새로 들어간 내용이에요. 굴착기에 붙여 통나무를 집어 옮기는 나무집게(우드그랩)는 경사가 급하면 굴착기가 넘어질 위험이 커서 15° 이하의 완만한 경사에서만 써요.\n용어 풀이:\n· 우드그랩: 굴착기 팔 끝에 달아 통나무를 집는 집게 장비\n· 완경사: 완만한 경사\n· 고위험 장비: 사고 위험이 큰 작업 장비", "ref": "p.106"}, {"id": "조림-39", "subject": "조림", "num": 39, "part": 2, "stem": "2025년 산림사업 재해형태 중 비율이 가장 높은 것은? ('기타' 제외)", "options": ["넘어짐", "절단·베임·찔림", "깔림·뒤집힘", "물체에 맞음"], "answer": 1, "explain": "절단·베임·찔림 24% > 깔림·뒤집힘 20% > 물체에 맞음 13% > 넘어짐 12%\n쉬운 풀이: 산림 작업 사고는 기계톱·낫 등 날카로운 도구를 많이 쓰기 때문에 '절단·베임·찔림'이 24%로 가장 많아요. 그다음이 나무나 장비에 깔리는 사고(20%)예요. 안전교육에서 날붙이 사고 예방이 가장 강조되는 이유예요.\n용어 풀이:\n· 재해형태: 사고가 일어난 방식(넘어짐·깔림 등)\n· 절단·베임: 날카로운 것에 잘리거나 베이는 사고", "ref": "p.107"}, {"id": "조림-40", "subject": "조림", "num": 40, "part": 2, "stem": "기계톱 벌목 안전작업 요령으로 옳지 **않은** 것은?", "options": ["벌목 대상 수목을 중심으로 수고의 2배 이상 안전거리를 유지한다", "방향베기는 수평으로 입목지름의 1/5~1/3 정도로 한다", "따라베기는 방향베기 밑면보다 2~3cm 낮게 절단한다", "근주직경 15cm 이하 소경목은 방향베기·따라베기 없이 벌도할 수 있다"], "answer": 2, "explain": "· 따라베기는 방향베기 밑면보다 2~3cm 높게\n· ⚠️ 「산림사업 표준안전 작업지침」(고시)은 방향베기 1/3~1/4, 따라베기 직경 1/10 이상 높이로 다르게 적음 → 101·102번 참고\n쉬운 풀이: 나무를 넘길 때는 먼저 넘어질 방향 쪽에 쐐기 모양 홈(방향베기)을 파고, 반대쪽을 잘라(따라베기) 넘겨요. 따라베기를 방향베기보다 2~3cm '높게' 해야 경첩 역할을 하는 부분(벌도맥)이 남아 나무가 원하는 방향으로 안전하게 넘어가요. 낮게 자르면 나무가 뒤로 튈 수 있어 위험해요.\n용어 풀이:\n· 방향베기(수구): 넘길 방향에 내는 홈\n· 따라베기(추구): 반대편에서 마지막으로 자르는 것\n· 벌도맥: 두 절단면 사이에 남겨 경첩 역할을 하는 부분\n· 근주직경: 그루터기 지름", "ref": "p.118–121"}, {"id": "조림-41", "subject": "조림", "num": 41, "part": 3, "stem": "아까시나무처럼 종피가 단단한 경실종자의 발아를 촉진하는 데 가장 알맞은 처리는?", "options": ["노천매장", "저온저장", "황산처리", "건조저장"], "answer": 2, "explain": "· 경실종자는 황산·열탕처리로 종피를 연화\n· 노천매장은 배 미숙·휴면 종자(잣나무 등)\n쉬운 풀이: 아까시나무 씨앗은 껍질(종피)이 너무 단단해서 물이 안 스며들어 싹이 잘 안 나요(경실종자). 진한 황산에 잠깐 담그거나 뜨거운 물에 넣어 껍질을 연하게 만들면 물이 들어가 싹이 터요. 노천매장은 껍질보다는 씨 안의 배가 덜 자란 잣나무 같은 종자에 써요.\n용어 풀이:\n· 경실종자: 껍질이 딱딱해 물이 안 들어가는 씨앗\n· 종피: 씨앗 껍질\n· 노천매장: 씨앗을 땅에 묻어 겨울을 나게 하는 처리", "ref": "조림학"}, {"id": "조림-42", "subject": "조림", "num": 42, "part": 3, "stem": "다음 중 음수(내음성이 강한 수종)는?", "options": ["소나무", "주목", "자작나무", "낙엽송"], "answer": 1, "explain": "· 음수: 주목·전나무·가문비나무·서어나무\n· 양수: 소나무·낙엽송·자작나무\n쉬운 풀이: 음수는 그늘에서도 잘 견디는 나무, 양수는 햇빛을 많이 받아야 자라는 나무예요. 주목·전나무·가문비나무·서어나무는 음수, 소나무·낙엽송·자작나무는 대표적인 양수예요. '주·전·가·서는 그늘파'로 외우세요.\n용어 풀이:\n· 음수(陰樹): 그늘에 강한 나무\n· 양수(陽樹): 햇빛을 좋아하는 나무\n· 내음성: 그늘을 견디는 성질", "ref": "조림학"}, {"id": "조림-43", "subject": "조림", "num": 43, "part": 3, "stem": "산림토양 단면에서 용탈층에 해당하는 층위는?", "options": ["A층", "B층", "C층", "A₀층"], "answer": 0, "explain": "A층 용탈층 → B층 집적층 → C층 모재층 (A₀는 유기물층)\n쉬운 풀이: 흙을 위에서 아래로 파 보면 층이 나뉘어 있어요. 맨 위 A₀층은 낙엽이 쌓인 유기물층, A층은 빗물에 양분이 씻겨 내려가는 '용탈층', B층은 씻겨 내려온 양분이 쌓이는 '집적층', C층은 바위가 부서진 '모재층'이에요. '빠지는 A, 쌓이는 B'.\n용어 풀이:\n· 용탈: 빗물에 성분이 녹아 아래로 씻겨 나가는 것\n· 집적: 씻겨 내려온 성분이 쌓이는 것\n· 모재: 흙의 재료가 되는 풍화된 바위", "ref": "산림토양학"}, {"id": "조림-44", "subject": "조림", "num": 44, "part": 3, "stem": "질소고정 방선균(*Frankia*)과 공생하여 뿌리혹을 만드는 수종은?", "options": ["소나무", "오리나무", "잣나무", "신갈나무"], "answer": 1, "explain": "· 오리나무류 = *Frankia*\n· 아까시나무·싸리 = 근류균(*Rhizobium*)\n쉬운 풀이: 어떤 나무는 뿌리에 혹(뿌리혹)을 만들고 그 안의 미생물이 공기 중 질소를 양분으로 바꿔 줘요. 오리나무는 '프랑키아'라는 방선균과, 아까시나무·싸리 같은 콩과 식물은 '근류균(리조비움)'과 짝을 이뤄요. '오리-프랑키아'로 묶어 외우세요.\n용어 풀이:\n· 방선균: 곰팡이처럼 실 모양으로 자라는 세균 무리\n· 공생: 서로 도우며 함께 사는 관계\n· 뿌리혹(근류): 질소고정 미생물이 사는 뿌리의 혹", "ref": "수목생리학"}, {"id": "조림-45", "subject": "조림", "num": 45, "part": 3, "stem": "종자의 '발아세'에 대한 설명으로 옳은 것은?", "options": ["순정종자 무게를 전체 시료 무게로 나눈 값", "종자 1L의 무게", "발아시험 기간 전체에 발아한 종자의 비율", "일정 기간(발아 최성기) 안에 발아한 종자의 비율"], "answer": 3, "explain": "· 발아세 = 발아 최성기까지의 발아율\n· ③은 발아율\n· ①은 순량률\n쉬운 풀이: 발아율은 '결국 몇 %가 싹 텄나'이고, 발아세는 '얼마나 빨리, 한꺼번에 싹 텄나'예요. 싹이 가장 많이 나는 시기(발아 최성기)까지 싹 튼 비율을 발아세라고 해요. 발아세가 높으면 묘목이 고르게 자라요.\n용어 풀이:\n· 발아세: 짧은 기간(최성기) 안에 발아한 비율\n· 발아율: 전체 기간 동안 발아한 비율\n· 순량률: 순수 종자 무게 비율", "ref": "종자학"}, {"id": "조림-46", "subject": "조림", "num": 46, "part": 3, "stem": "광보상점에 대한 설명으로 옳은 것은?", "options": ["광합성량과 호흡량이 같아지는 광도", "광합성량이 최대가 되는 광도", "잎이 타기 시작하는 광도", "음수가 양수보다 광보상점이 높다"], "answer": 0, "explain": "· 광합성 = 호흡인 광도\n· 음수가 양수보다 낮다\n쉬운 풀이: 식물은 광합성으로 양분을 만들고 호흡으로 양분을 써요. 빛이 약해지다 보면 만드는 양과 쓰는 양이 딱 같아지는 밝기가 있는데, 이게 광보상점이에요. 그늘에 강한 음수는 적은 빛으로도 버티니 광보상점이 '낮아요'.\n용어 풀이:\n· 광보상점: 광합성량 = 호흡량이 되는 빛의 세기\n· 광도: 빛의 밝기\n· 호흡: 양분을 분해해 에너지를 얻는 작용", "ref": "수목생리학"}, {"id": "조림-47", "subject": "조림", "num": 47, "part": 3, "stem": "묘목의 T/R률에 대한 설명으로 옳은 것은?", "options": ["묘목의 수고를 근원경으로 나눈 값으로, 클수록 좋다", "지하부 무게를 지상부 무게로 나눈 값이다", "지상부 무게를 지하부 무게로 나눈 값으로, 값이 작을수록 뿌리가 발달한 건전한 묘목이다", "질소 비료를 많이 주면 작아진다"], "answer": 2, "explain": "· T/R률 = 지상부 ÷ 지하부, 작을수록 건전\n· 질소 과다 시 커짐\n쉬운 풀이: T/R률은 지상부(Top: 줄기·잎) 무게를 지하부(Root: 뿌리) 무게로 나눈 값이에요. 값이 작을수록 몸통에 비해 뿌리가 튼튼하다는 뜻이라 옮겨 심어도 잘 살아요. 질소 비료를 많이 주면 잎·줄기만 웃자라서 T/R률이 커져요.\n용어 풀이:\n· T\n· R률: 지상부 무게 ÷ 지하부 무게\n· 지상부: 땅 위 부분(줄기·잎)\n· 지하부: 땅속 부분(뿌리)\n· 웃자람: 영양 과다로 약하게 길게 자람", "ref": "묘포학"}, {"id": "조림-48", "subject": "조림", "num": 48, "part": 3, "stem": "묘목 표시 '1-1묘'의 뜻은?", "options": ["파종상 1년, 묘령 1년", "파종상 1년 + 이식상 1년, 2년생 묘목", "접목 후 1년, 이식 후 1년, 3년생 묘목", "삽목 1년생"], "answer": 1, "explain": "앞 숫자 파종상 연수, 뒤 숫자 이식상 연수 → 2년생\n쉬운 풀이: 묘목 나이 표시에서 '-' 앞 숫자는 씨를 뿌린 밭(파종상)에서 자란 햇수, 뒤 숫자는 옮겨 심은 밭(이식상)에서 자란 햇수예요. 1-1묘는 파종상 1년 + 이식상 1년이니 2년생 묘목이에요.\n용어 풀이:\n· 파종상: 씨를 뿌려 키우는 묘상\n· 이식상: 묘목을 옮겨 심어 키우는 묘상\n· 묘령: 묘목의 나이", "ref": "묘포학"}, {"id": "조림-49", "subject": "조림", "num": 49, "part": 3, "stem": "개벌작업의 단점으로 옳은 것은?", "options": ["작업이 복잡하고 비용이 많이 든다", "음수 수종 갱신에만 쓸 수 있다", "임지가 노출되어 토양 침식과 지력 저하가 생기기 쉽다", "벌채 목재 품질이 고르지 않다"], "answer": 2, "explain": "개벌은 작업이 간편하고 양수 갱신에 유리하지만, 임지 노출로 침식·지력 저하\n쉬운 풀이: 개벌(모두베기)은 한꺼번에 다 베니 작업이 쉽고, 햇빛을 좋아하는 양수를 키우기 좋아요. 대신 땅이 통째로 드러나 비가 오면 흙이 쓸려가고(침식), 양분도 빠져나가 땅심(지력)이 약해지기 쉬워요.\n용어 풀이:\n· 개벌: 모두베기\n· 임지: 나무가 자라는 땅\n· 지력: 땅이 식물을 키우는 힘(땅심)", "ref": "조림학"}, {"id": "조림-50", "subject": "조림", "num": 50, "part": 3, "stem": "일반적인 인공림 숲가꾸기의 작업 순서로 옳은 것은?", "options": ["풀베기 → 덩굴제거 → 어린나무가꾸기 → 솎아베기", "솎아베기 → 어린나무가꾸기 → 풀베기 → 덩굴제거", "어린나무가꾸기 → 풀베기 → 솎아베기 → 덩굴제거", "덩굴제거 → 솎아베기 → 풀베기 → 어린나무가꾸기"], "answer": 0, "explain": "숲가꾸기 표준교재 순서: 풀베기 → 덩굴제거 → 어린나무가꾸기 → (가지치기) → 솎아베기\n쉬운 풀이: 심은 나무가 자라는 순서대로 작업을 떠올리면 쉬워요. 막 심었을 땐 잡초를 베고(풀베기) → 덩굴이 감으면 걷어내고(덩굴제거) → 좀 자라면 잡목·불량목을 정리하고(어린나무가꾸기) → 더 크면 가지치기 → 빽빽해지면 솎아베기(간벌)를 해요.\n용어 풀이:\n· 숲가꾸기: 숲을 건강하게 키우기 위한 모든 관리 작업\n· 인공림: 사람이 심어서 만든 숲", "ref": "숲가꾸기 표준교재"}, {"id": "조림-51", "subject": "조림", "num": 51, "part": 4, "stem": "수목 잎의 엽록소 구성 성분이며 결핍 시 오래된 잎부터 황화현상(Chlorosis)이 일어나는 무기양분은?", "options": ["질소(N)", "마그네슘(Mg)", "철(Fe)", "칼슘(Ca)"], "answer": 1, "explain": "엽록소 중심 원소는 마그네슘(Mg)이며, 이동성이 좋아 결핍 시 늙은 잎부터 황화현상 발생 (질소도 황화현상이 있으나 엽록소의 중심핵은 마그네슘)\n쉬운 풀이: 엽록소는 잎을 초록색으로 만들고 광합성을 하는 색소인데, 그 한가운데 있는 원소가 마그네슘(Mg)이에요. 마그네슘은 식물 몸속에서 잘 이동해서, 부족하면 늙은 잎에서 빼내 어린 잎으로 보내기 때문에 '오래된 잎부터' 노랗게 변해요.\n용어 풀이:\n· 엽록소: 광합성을 하는 초록 색소\n· 황화현상(Chlorosis): 잎이 노랗게 변하는 증상\n· 무기양분: 흙에서 흡수하는 광물성 양분", "ref": "수목생리학"}, {"id": "조림-52", "subject": "조림", "num": 52, "part": 4, "stem": "수목의 직경 생장 시 봄철에 형성되는 춘재(조재)와 여름·가을에 형성되는 만재(만재)에 대한 설명으로 옳은 것은?", "options": ["춘재는 세포벽이 두껍고 내강이 좁아 색이 짙다", "만재는 가도관의 직경이 크고 유조직이 풍부하다", "춘재는 세포분열이 왕성하여 세포벽이 얇고 색이 연하다", "만재의 비율이 높을수록 목재의 비중과 강도가 낮아진다"], "answer": 2, "explain": "· 춘재는 생장이 왕성하여 가도관 직경이 크고 벽이 얇으며 색이 연함\n· 만재는 세포벽이 두껍고 치밀하여 색이 짙음\n쉬운 풀이: 나무는 봄에 빨리 자라고 여름·가을엔 천천히 자라요. 봄에 만든 춘재는 세포가 크고 벽이 얇아 색이 연하고, 늦게 만든 만재(추재)는 세포가 작고 벽이 두꺼워 색이 짙어요. 이 연한·짙은 띠가 반복되어 나이테가 보여요. 만재가 많을수록 목재가 무겁고 단단해요.\n용어 풀이:\n· 춘재(조재): 봄에 만들어진 목재 부분\n· 만재(추재): 여름·가을에 만들어진 목재 부분\n· 가도관: 침엽수에서 물을 나르는 세포", "ref": "목재이학"}, {"id": "조림-53", "subject": "조림", "num": 53, "part": 4, "stem": "채종원(Seed orchard) 조성 시 외부 불량 화분의 유입을 막기 위한 최소 격리대(차단대) 폭 기준은? (소나무류 기준)", "options": ["50m", "100m", "300m", "500m"], "answer": 3, "explain": "채종원의 격리대 폭은 외부 불량 화분 차단을 위해 소나무류 500m 이상, 낙엽송 300m 이상\n쉬운 풀이: 채종원은 좋은 나무끼리만 꽃가루를 주고받아 우량 씨앗을 만드는 곳이에요. 바깥의 평범한 소나무 꽃가루가 날아오면 씨앗 품질이 떨어지니, 주변에 같은 수종이 없는 띠(격리대)를 둬요. 소나무류는 꽃가루가 멀리 날아서 500m, 낙엽송은 300m 이상이에요.\n용어 풀이:\n· 채종원: 우량 종자를 생산하기 위해 만든 나무 농장\n· 화분: 꽃가루\n· 격리대: 외부 꽃가루를 막기 위해 비워 두는 띠 모양 공간", "ref": "종자생산학"}, {"id": "조림-54", "subject": "조림", "num": 54, "part": 4, "stem": "묘목 생산을 위한 삽목(꺾꽂이) 시 부정근 발근을 촉진하기 위해 처리하는 대표적인 식물호르몬은?", "options": ["지베렐린(GA)", "옥신(IBA, NAA)", "시토키닌", "아브시스산(ABA)"], "answer": 1, "explain": "· 옥신류(IBA, NAA)는 부정근 형성 촉진\n· 지베렐린은 신장 생장\n· 시토키닌은 세포분열 촉진\n쉬운 풀이: 꺾꽂이(삽목)는 가지를 잘라 흙에 꽂아 뿌리를 내리게 하는 방법이에요. 줄기에서 새로 나는 뿌리(부정근)를 잘 나게 하려고 '옥신' 계열 호르몬(IBA, NAA)을 잘린 끝에 발라요. 지베렐린은 키 크기, 시토키닌은 세포분열, ABA는 휴면·기공 닫기와 관련돼요.\n용어 풀이:\n· 삽목(꺾꽂이): 가지를 잘라 꽂아 번식\n· 부정근: 원래 뿌리가 아닌 곳(줄기 등)에서 나는 뿌리\n· 옥신: 뿌리 형성·정아우세를 일으키는 식물호르몬", "ref": "식물생리학"}, {"id": "조림-55", "subject": "조림", "num": 55, "part": 4, "stem": "종자의 발아력 검사법 중 살아있는 배(Embryo)의 호흡 효소 작용으로 무색의 시약이 붉은색(포르마잔)으로 염색되는 원리를 이용한 생화학적 검정법은?", "options": ["환원테트라졸륨법(TTC 검정)", "절단법", "X선 검사법", "전기전도도법"], "answer": 0, "explain": "환원 테트라졸륨(TTC)이 배의 탈수소효소와 반응하여 적색의 포르마잔으로 환원됨\n쉬운 풀이: 씨앗이 살아 있는지 빨리 알아보는 방법이에요. 테트라졸륨(TTC) 용액에 씨를 담그면, 살아 있는 배(씨눈)는 숨을 쉬면서 효소가 작용해 무색 용액을 빨간색으로 바꿔요. 빨갛게 물들면 살아 있는 씨, 안 물들면 죽은 씨예요.\n용어 풀이:\n· 배(胚): 씨앗 속에서 나중에 싹이 될 부분(씨눈)\n· TTC: 살아 있는 세포에서 붉게 변하는 시약\n· 포르마잔: TTC가 변해서 생긴 붉은 물질", "ref": "종자검사학"}, {"id": "조림-56", "subject": "조림", "num": 56, "part": 4, "stem": "다음 중 뿌리에 외생균근(Ectomycorrhiza)을 형성하여 영양분 흡수를 돕는 대표적인 임목 과(Family)는?", "options": ["단풍나무과", "물푸레나무과", "소나무과", "콩과"], "answer": 2, "explain": "소나무과, 참나무과, 자작나무과는 대표적인 외생균근 형성 수종\n쉬운 풀이: 균근은 곰팡이(균)가 나무뿌리와 함께 살면서 물과 양분(특히 인)을 대신 흡수해 주는 관계예요. 균이 뿌리 바깥을 감싸는 '외생균근'은 소나무과·참나무과·자작나무과에서 대표적으로 나타나요. 송이버섯도 소나무 외생균근 버섯이에요.\n용어 풀이:\n· 균근: 곰팡이와 식물 뿌리의 공생체\n· 외생균근: 균사가 뿌리 표면을 감싸는 균근\n· 과(Family): 생물 분류 단위(소나무과 등)", "ref": "산림미생물학"}, {"id": "조림-57", "subject": "조림", "num": 57, "part": 4, "stem": "크래프트(Kraft) 수관급 분류에서 수관이 임관의 상층을 차지하고 이웃 나무의 압박을 받지 않는 가장 우수한 나무의 수관급은?", "options": ["제1급 우세목", "제2급 준우세목", "제3급 중간목", "제4급 피압목"], "answer": 0, "explain": "제1급 우세목(Dominant tree)은 임관 최상층을 형성하며 생육이 가장 왕성한 목\n쉬운 풀이: 크래프트는 숲속 나무를 수관(잎·가지 덩어리) 위치에 따라 1~5급으로 나눴어요. 1급 우세목은 맨 위층에서 햇빛을 독차지하며 가장 잘 자라는 나무, 2급 준우세목, 3급 중간목, 4급 피압목(눌린 나무), 5급은 거의 죽어가는 나무예요.\n용어 풀이:\n· 수관급: 수관의 위치·크기에 따른 나무 등급\n· 우세목: 가장 위층의 세력 좋은 나무\n· 피압목: 다른 나무에 눌려 자라지 못하는 나무", "ref": "조림학본론"}, {"id": "조림-58", "subject": "조림", "num": 58, "part": 4, "stem": "침엽수 중 특이하게 줄기 밑동이나 줄기에서 맹아(부정아)가 왕성하게 돋아나 맹아갱신이 가능한 수종은?", "options": ["잣나무", "전나무", "낙엽송", "리기다소나무"], "answer": 3, "explain": "리기다소나무는 맹아력이 강해 원줄기나 그루터기에서 맹아가 돋아남 (방화선, 척박지 조림)\n쉬운 풀이: 대부분 침엽수는 베면 그루터기에서 새싹이 안 나요. 그런데 리기다소나무는 특이하게 줄기·그루터기에서 새싹(맹아)이 잘 나서 맹아로 갱신할 수 있어요. 척박한 땅과 불에도 강해서 예전에 헐벗은 산 복구용으로 많이 심었어요.\n용어 풀이:\n· 맹아: 줄기나 그루터기에서 돋는 새싹\n· 맹아갱신: 맹아를 키워 숲을 다시 만드는 방법\n· 부정아: 정해진 자리가 아닌 곳에서 나는 눈", "ref": "조림수종학"}, {"id": "조림-59", "subject": "조림", "num": 59, "part": 4, "stem": "종자 결실을 촉진하기 위해 줄기 수피의 체관부를 띠 모양으로 벗겨 탄수화물이 뿌리로 내려가는 것을 일시 차단하는 방법은?", "options": ["단근작업", "환상박피", "적심", "맹아제거"], "answer": 1, "explain": "환상박피(Girdling)는 체관부를 고리 모양으로 박피하여 광합성 산물의 하향 이동을 막아 결실 유도\n쉬운 풀이: 나뭇잎이 만든 양분(탄수화물)은 껍질 안쪽 체관부를 타고 뿌리로 내려가요. 줄기 껍질을 고리 모양으로 벗기면(환상박피) 양분이 아래로 못 내려가 윗부분에 쌓이고, 그 양분이 꽃과 열매 맺는 데 쓰여 결실이 늘어나요.\n용어 풀이:\n· 환상박피: 줄기 껍질을 고리 모양으로 벗기는 것\n· 체관부(사부): 양분이 이동하는 통로\n· 결실: 열매·씨앗을 맺음", "ref": "수목생리학"}, {"id": "조림-60", "subject": "조림", "num": 60, "part": 4, "stem": "택벌작업에서 1회 벌채 시 벌채량(택벌률)과 다음 벌채까지 걸리는 기간(택벌회기)에 대한 설명으로 옳은 것은?", "options": ["택벌회기가 길수록 1회 택벌률을 낮추어야 한다", "택벌회기가 짧을수록 1회 택벌률을 높여야 한다", "택벌회기가 길수록 1회 택벌률을 높일 수 있다", "택벌률은 법정축적과 무관하게 항상 80% 이상 적용한다"], "answer": 2, "explain": "택벌회기(간격)가 길면 그동안 자란 양이 많으므로 1회 벌채량(택벌률)을 높일 수 있음\n쉬운 풀이: 택벌은 일정 간격(택벌회기)마다 다 자란 나무만 골라 베는 방법이에요. 다음 벌채까지 기간이 길면 그동안 나무가 더 많이 자라 있으니 한 번에 더 많이(택벌률 높게) 벨 수 있어요. 반대로 자주 베면 한 번에 조금씩 베야 해요.\n용어 풀이:\n· 택벌회기: 같은 곳을 다시 택벌하기까지의 기간\n· 택벌률: 한 번에 베는 양의 비율\n· 축적: 숲에 서 있는 나무의 총 부피", "ref": "산림경영학"}, {"id": "조림-61", "subject": "조림", "num": 61, "part": 4, "stem": "파종상에서 묘목의 웃자람을 방지하고 잔뿌리 발달을 유도하기 위해 삽이나 전용 칼로 묘목의 주근(원뿌리)을 잘라주는 작업은?", "options": ["단근(Root pruning)", "상체", "가식", "경화"], "answer": 0, "explain": "단근(Root pruning)은 곧은뿌리를 잘라 잔뿌리 발달을 돕고 T/R율을 낮춤\n쉬운 풀이: 묘목의 굵은 원뿌리(주근)를 땅속에서 칼로 잘라 주면, 나무가 위로만 웃자라지 않고 잔뿌리를 많이 만들어요. 잔뿌리가 많으면 옮겨 심을 때 잘 살아요. 이 작업을 단근이라고 해요.\n용어 풀이:\n· 단근: 뿌리를 잘라 잔뿌리 발달을 유도\n· 주근(원뿌리): 아래로 곧게 뻗는 굵은 뿌리\n· 가식: 심기 전 임시로 묻어 두기\n· 경화: 묘목을 바깥 환경에 적응시키기", "ref": "묘목육성학"}, {"id": "조림-62", "subject": "조림", "num": 62, "part": 4, "stem": "모수작업(Seed-tree method)에서 단위면적(1ha)당 잔존시켜야 할 모수(어미나무)의 표준 본수로 적절한 것은?", "options": ["1~2본", "15~30본", "100~200본", "500본 이상"], "answer": 1, "explain": "모수작업의 모수 본수는 통상 ha당 15~30본(전체 재적의 10% 내외)\n쉬운 풀이: 모수작업은 씨앗을 떨어뜨릴 어미나무만 몇 그루 남기고 나머지는 다 베는 방법이에요. 너무 적으면 씨가 부족하고 너무 많으면 그늘이 져서, 보통 1ha에 15~30본(전체 부피의 10% 정도)을 남겨요.\n용어 풀이:\n· 모수(母樹): 씨앗을 공급하는 어미나무\n· 모수작업: 어미나무만 남겨 천연 갱신하는 방법", "ref": "조림학본론"}, {"id": "조림-63", "subject": "조림", "num": 63, "part": 4, "stem": "온대 활엽수의 맹아갱신(왜림작업) 시 그루터기 벌채 높이로 가장 바람직한 것은?", "options": ["지상 50cm 이상", "지상 10~15cm 이하로 낮게", "지표면 아래 10cm", "높이는 무관함"], "answer": 1, "explain": "왜림 벌채 시 그루터기가 높으면 썩기 쉽고 싹이 부실하므로 10~15cm 이하로 낮게 비스듬히 자름\n쉬운 풀이: 참나무 같은 활엽수를 베고 그루터기에서 새싹을 키우는 왜림작업에서는 그루터기를 땅 가까이 10~15cm 이하로 낮게, 비스듬히 잘라요. 높게 자르면 물이 고여 썩기 쉽고 싹도 약하게 나요.\n용어 풀이:\n· 왜림작업: 그루터기 맹아로 작은 나무 숲을 반복 갱신하는 방법\n· 맹아갱신: 새싹으로 숲을 다시 만드는 것", "ref": "육림학"}, {"id": "조림-64", "subject": "조림", "num": 64, "part": 4, "stem": "종자의 휴면 원인 중 배(Embryo) 자체가 미숙하여 후숙(After-ripening) 기간이 필요한 수종은?", "options": ["은행나무", "밤나무", "자작나무", "버드나무"], "answer": 0, "explain": "은행나무, 주목, 인삼 등은 낙과 시 배가 미숙 상태로 후숙 과정이 필요\n쉬운 풀이: 씨앗이 떨어졌는데 바로 싹이 안 나는 걸 휴면이라고 해요. 은행나무·주목은 열매가 떨어질 때 씨앗 안의 배(씨눈)가 아직 덜 자란 상태라서, 일정 기간 더 성숙시키는 '후숙'이 필요해요.\n용어 풀이:\n· 휴면: 조건이 맞아도 싹이 트지 않는 상태\n· 배(胚): 싹이 될 씨눈\n· 후숙: 수확 후 추가로 성숙하는 과정", "ref": "종자생리학"}, {"id": "조림-65", "subject": "조림", "num": 65, "part": 4, "stem": "침엽수 묘포장의 토양 조건으로 가장 알맞은 산도(pH) 범위는?", "options": ["pH 4.0 이하", "pH 5.0 ~ 6.0", "pH 7.0 ~ 7.5", "pH 8.0 이상"], "answer": 1, "explain": "침엽수는 약산성(pH 5.0~6.0), 활엽수는 약산성~중성(pH 5.5~6.5)이 최적\n쉬운 풀이: pH는 흙의 산성·알칼리성 정도로 7이 중성, 낮을수록 산성이에요. 침엽수는 약산성인 pH 5.0~6.0을 좋아하고, 활엽수는 약산성~중성(5.5~6.5)을 좋아해요. 우리나라 산 흙은 대부분 약산성이에요.\n용어 풀이:\n· pH: 산성도 지표(7 중성, 낮으면 산성)\n· 묘포장: 묘목을 키우는 밭\n· 약산성: 약한 산성", "ref": "산림토양학"}, {"id": "조림-66", "subject": "조림", "num": 66, "part": 4, "stem": "종자의 발아시험 시 발아율(Germination percentage)을 구하는 공식으로 옳은 것은?", "options": ["(발아한 종자수 ÷ 전체 치상 종자수) × 100", "(순정종자 무게 ÷ 전체 시료 무게) × 100", "(발아한 종자수 ÷ 순정종자 무게) × 100", "발아세 × 순량률 ÷ 100"], "answer": 0, "explain": "· 발아율 = (발아립수 ÷ 치상립수) × 100\n· ②는 순량률\n쉬운 풀이: 발아율은 '뿌린 씨앗 중 몇 개가 싹 텄나'예요. (싹 튼 수 ÷ 시험에 놓은 씨앗 수) × 100으로 구해요. 100개 놓고 80개 싹 트면 80%예요. ②번 무게 비율은 순량률이에요.\n용어 풀이:\n· 치상: 시험용 씨앗을 배지에 놓는 것\n· 발아립수: 싹 튼 씨앗 수\n· 순량률: 순수 종자 무게 비율", "ref": "종자검사규정"}, {"id": "조림-67", "subject": "조림", "num": 67, "part": 4, "stem": "수목의 광합성 속도에서 온도가 상승할 때 광합성량보다 호흡량이 급증하여 순광합성량이 0 이하로 떨어지는 주원인은?", "options": ["기공 폐쇄 및 효소 변성", "엽록소 급증", "수분 흡수 과다", "책상조직 팽창"], "answer": 0, "explain": "고온 시 기공이 닫혀 CO₂ 흡수가 저해되고 효소가 변성되어 호흡량이 광합성량을 초과함\n쉬운 풀이: 너무 더우면 나무는 물을 아끼려고 잎의 숨구멍(기공)을 닫아요. 그러면 광합성 재료인 이산화탄소가 못 들어오고, 광합성 효소도 열에 망가져요. 반면 호흡은 더 왕성해져서 결국 쓰는 양이 만드는 양보다 많아져요.\n용어 풀이:\n· 기공: 잎 뒷면의 숨구멍\n· 효소 변성: 열 등으로 효소 구조가 망가져 기능을 잃음\n· 순광합성: 광합성량 - 호흡량", "ref": "수목생리학"}, {"id": "조림-68", "subject": "조림", "num": 68, "part": 4, "stem": "숲가꾸기 작업 중 형질이 불량하거나 병든 나무를 우선적으로 베어내어 임분 내 공간을 개방하는 하층간벌(저벌)의 제1종(A종) 간벌 대상목은?", "options": ["피압된 고사목 및 피압목", "우세목", "미래목", "준우세목"], "answer": 0, "explain": "A종 간벌(경벌)은 피압 고사목과 피압 소경목만 제거하는 가장 소극적인 간벌\n쉬운 풀이: 하층간벌은 아래층의 약한 나무부터 베는 방법이에요. 그중 A종은 가장 약하게(소극적으로) 하는 간벌로, 이미 죽었거나 다른 나무에 눌려 거의 자라지 못하는 피압목만 제거해요. B·C종으로 갈수록 더 많이 베요.\n용어 풀이:\n· 하층간벌: 아래층의 열세목 위주로 베는 간벌\n· 피압목: 다른 나무에 눌려 자라지 못하는 나무\n· 경벌: 약하게 하는 간벌", "ref": "간벌지침"}, {"id": "조림-69", "subject": "조림", "num": 69, "part": 4, "stem": "종자 수집 시 구과(솔방울 등)를 채취하여 건조실이나 햇볕에서 건조시켜 종자를 털어내는 건조탈립법을 적용하는 수종은?", "options": ["소나무, 잣나무", "밤나무, 도토리", "버드나무, 사시나무", "은행나무, 주목"], "answer": 0, "explain": "구과류(소나무, 잣나무, 낙엽송)는 햇볕 건조나 양건실에서 인공 건조하여 탈립\n쉬운 풀이: 소나무·잣나무·낙엽송은 씨앗이 솔방울(구과) 속에 들어 있어요. 솔방울을 햇볕이나 건조실에서 말리면 비늘이 벌어지면서 씨앗이 떨어져 나와요. 이걸 건조탈립법이라고 해요.\n용어 풀이:\n· 구과: 솔방울처럼 비늘 사이에 씨가 든 열매\n· 탈립: 씨앗을 열매에서 떼어 내는 것\n· 양건실: 열매를 말리는 방", "ref": "채종학"}, {"id": "조림-70", "subject": "조림", "num": 70, "part": 4, "stem": "산림자원법상 조림용 종·묘 생산업자의 등록 관청은?", "options": ["산림청장", "특별시장·광역시장·특별자치시장·도지사 또는 특별자치도지사", "시장·군수·구청장", "산림조합장"], "answer": 1, "explain": "산림자원법상 종·묘생산업의 등록은 시·도지사 관할\n쉬운 풀이: 조림용 씨앗·묘목을 생산해 파는 사업자는 시·도지사(특별시장·광역시장·도지사 등)에게 등록해요. 법규 문제는 '누가 하느냐(주체)'를 자주 물으니 '종묘생산업 등록 = 시·도지사'로 외우세요.\n용어 풀이:\n· 종·묘생산업: 씨앗과 묘목을 생산·판매하는 사업\n· 시·도지사: 특별시·광역시·도의 장", "ref": "산림자원법"}, {"id": "조림-71", "subject": "조림", "num": 71, "part": 4, "stem": "종자의 정선법 중 종자 간의 비중(무게) 차이를 이용하여 물이나 소금물에 띄워 가라앉은 충실한 종자만을 가려내는 수선법(Water separation)에 가장 적합한 종자는?", "options": ["소나무, 잣나무", "밤나무, 참나무류(도토리)", "자작나무, 오리나무", "포플러, 버드나무"], "answer": 1, "explain": "밤나무, 상수리나무 등 대형 종자는 껍질이 두껍고 속이 꽉 찬 종자가 물에 가라앉으므로 물에 띄워 쭉정이와 벌레 먹은 종자를 가려내는 수선법이 가장 효과적입니다.\n쉬운 풀이: 밤·도토리 같은 큰 씨앗은 물에 넣으면 속이 꽉 찬 좋은 씨는 가라앉고, 벌레 먹거나 빈 씨는 떠요. 이 차이로 좋은 씨를 고르는 방법이 수선법이에요. 소나무처럼 작고 가벼운 씨는 바람으로 고르는 풍선법을 써요.\n용어 풀이:\n· 정선: 씨앗에서 쭉정이·이물질을 골라내는 작업\n· 수선법: 물을 이용한 정선법\n· 비중: 같은 부피일 때의 무게 비율", "ref": "조림학 종자정선"}, {"id": "조림-72", "subject": "조림", "num": 72, "part": 4, "stem": "시설 양묘에서 플라스틱이나 친환경 튜브 용기(포트)에 인공 상토를 넣어 육묘하는 용기묘(Container seedling)의 장점으로 옳지 **않은** 것은?", "options": ["뿌리의 손상이 거의 없어 늦봄이나 가을 등 식재 가능 기간이 길다.", "묘목의 활착률이 일반 노지 묘목보다 높다.", "노지 양묘에 비해 묘포장 시설비와 초기 투자비가 전혀 들지 않는다.", "좁은 면적에서 규격화된 우량 묘목을 집약적으로 대량 생산할 수 있다."], "answer": 2, "explain": "용기묘는 온실, 자동 관수, 인공상토 등 시설 투자가 필수적이므로 노지 묘목보다 초기 시설비가 많이 듭니다.\n쉬운 풀이: 용기묘는 작은 화분(포트)에 키운 묘목이라 뿌리가 안 다쳐서 잘 살고, 심는 시기도 넓어요. 하지만 온실·자동 물주기 장치·인공 흙 같은 시설이 꼭 필요해서 처음 비용이 많이 들어요. '투자비가 전혀 안 든다'가 틀렸어요.\n용어 풀이:\n· 용기묘: 용기(포트)에서 키운 묘목\n· 노지묘: 밭에서 키운 묘목\n· 상토: 묘목을 키우는 흙", "ref": "NCS 학습모듈 조림"}, {"id": "조림-73", "subject": "조림", "num": 73, "part": 4, "stem": "우수한 형질을 가진 나무의 가지나 눈을 떼어내어 무성번식시키는 클론(Clone) 증식의 가장 큰 이점은?", "options": ["유전적 다양성이 극대화된다.", "모수(어미나무)가 가진 우수한 유전 형질을 변형 없이 그대로 후대에 보존할 수 있다.", "씨앗으로 번식할 때보다 돌연변이가 많이 발생한다.", "어떤 토양 환경에서도 병해충 피해가 전혀 발생하지 않는다."], "answer": 1, "explain": "무성증식(접목, 삽목, 조직배양)은 어미나무의 유전자를 100% 그대로 복제하므로 우수 형질을 안정적으로 유지합니다.\n쉬운 풀이: 클론은 한 나무에서 떼어 낸 가지·눈으로 만든 '복제 나무'예요. 씨앗으로 번식하면 부모 유전자가 섞여 자식이 달라지지만, 무성번식(접목·삽목·조직배양)은 어미나무 유전자를 그대로 복사하니 우수한 성질을 그대로 이어받아요.\n용어 풀이:\n· 클론: 유전적으로 똑같은 복제 개체\n· 무성번식: 씨앗 없이 몸의 일부로 번식\n· 형질: 생물의 모양·성질", "ref": "임목육종학"}, {"id": "조림-74", "subject": "조림", "num": 74, "part": 4, "stem": "임분의 밀도 조절 시 평균 흉고직경 25cm를 기준으로 하여 단위면적당 본수의 상관관계를 나타낸 라이네케(Reineke)의 척도는?", "options": ["지위지수", "임분밀도지수(SDI)", "형수", "형상비"], "answer": 1, "explain": "Reineke의 임분밀도지수(Stand Density Index, SDI)는 기준 직경 25cm(10인치)에서 ha당 입목 본수를 나타내는 표준 척도입니다.\n쉬운 풀이: 숲이 얼마나 빽빽한지를 나무 크기와 상관없이 비교하려고 만든 지표예요. 라이네케는 '평균 지름 25cm(10인치)짜리 숲이라면 ha당 몇 그루일까'로 환산해 임분밀도지수(SDI)를 만들었어요.\n용어 풀이:\n· 임분: 나무 종류·나이가 비슷한 숲 덩어리\n· 임분밀도지수(SDI): 표준 지름 기준으로 환산한 밀도\n· 지위지수: 땅의 비옥도를 나타내는 지수", "ref": "산림경영학"}, {"id": "조림-75", "subject": "조림", "num": 75, "part": 4, "stem": "높은 키를 가진 나무(수고 30~50m) 꼭대기까지 물이 끊어지지 않고 올라가는 원리를 설명하는 가장 정설인 물리생리학적 학설은?", "options": ["근압설", "모세관현상설", "응집력-증산-장력설", "대기압설"], "answer": 2, "explain": "잎에서의 증산작용으로 생기는 끌어당기는 힘(장력)과 물 분자 간의 강력한 결합력(응집력)에 의해 수분 기둥이 끊어지지 않고 꼭대기까지 끌어올려집니다.\n쉬운 풀이: 잎에서 물이 증발(증산)하면 물관 속 물기둥을 위로 잡아당기는 힘(장력)이 생겨요. 물 분자끼리는 서로 꽉 붙어 있으려는 힘(응집력)이 강해서, 물기둥이 끊어지지 않고 수십 m 꼭대기까지 쭉 끌려 올라가요. 빨대로 음료를 빨아올리는 것과 비슷해요.\n용어 풀이:\n· 증산작용: 잎에서 물이 수증기로 빠져나가는 것\n· 응집력: 같은 분자끼리 붙으려는 힘\n· 장력: 끌어당기는 힘", "ref": "수목생리학"}, {"id": "조림-76", "subject": "조림", "num": 76, "part": 4, "stem": "우량 종자를 대량 생산하기 위해 우수 가계의 접목묘를 일정한 간격으로 배치하여 격리 조성한 집약적 종자 생산 포지는?", "options": ["모수림", "채종원(Seed orchard)", "천연보호림", "유전자원림"], "answer": 1, "explain": "유전적으로 검증된 우수 클론을 인위적으로 정원처럼 심어 우량 종자만 전문 생산하는 곳을 채종원(Seed orchard)이라 합니다.\n쉬운 풀이: 채종원은 유전적으로 우수하다고 확인된 나무(클론)의 접목묘를 과수원처럼 일정 간격으로 심고, 외부 꽃가루를 막아 좋은 씨앗만 생산하는 '씨앗 공장'이에요.\n용어 풀이:\n· 채종원: 우량 종자 생산 전용 포지\n· 접목묘: 접붙이기로 만든 묘목\n· 가계: 같은 부모에서 나온 자손 집단", "ref": "산림자원법"}, {"id": "조림-77", "subject": "조림", "num": 77, "part": 4, "stem": "수목의 가지치기 시 생가지(살아있는 가지)를 잘랐을 때 상처 부위에서 수액이 다량 흘러나오거나 상처 유합이 늦어 생가지치기를 피해야 하는 수종은?", "options": ["소나무", "삼나무", "자작나무, 단풍나무류", "편백"], "answer": 2, "explain": "단풍나무, 자작나무 등은 봄철 생가지를 자르면 수액 누출이 극심하고 부후균이 침투하기 쉬워 휴면기에만 가지치기합니다.\n쉬운 풀이: 자작나무·단풍나무는 수액(나무즙)이 많아서, 봄에 살아 있는 가지를 자르면 수액이 줄줄 흘러나오고 상처가 잘 안 아물어 썩는 균이 들어가기 쉬워요. 그래서 이 나무들은 수액이 덜 도는 휴면기(겨울)에만 가지치기해요. 고로쇠 수액이 단풍나무류에서 나오는 걸 떠올리세요.\n용어 풀이:\n· 생가지: 살아 있는 가지\n· 수액: 나무 속을 흐르는 물과 양분\n· 부후균: 나무를 썩게 하는 곰팡이", "ref": "조림학 가지치기"}, {"id": "조림-78", "subject": "조림", "num": 78, "part": 4, "stem": "조림 예정지의 척박한 토양을 개량하기 위해 클로버나 자운영 등 콩과 식물을 심어 갈아엎는 녹비(Green manure) 작물의 주된 효과는?", "options": ["토양 내 염분 농도 증가", "공기 중 질소 고정을 통한 토양 비옥도 및 유기물 증대", "토양 알칼리화 촉진", "토양 수분 완전 건조"], "answer": 1, "explain": "콩과 녹비작물은 뿌리혹박테리아와 공생하여 질소를 고정하고 땅을 비옥하게 만듭니다.\n쉬운 풀이: 콩과 식물(클로버·자운영)은 뿌리혹 세균 덕분에 공기 중 질소를 비료로 만들어요. 이런 식물을 키워서 땅에 갈아엎으면 질소와 유기물이 흙에 더해져 척박한 땅이 기름지게 돼요. 이게 '녹비(초록 비료)'예요.\n용어 풀이:\n· 녹비: 식물을 그대로 갈아엎어 쓰는 비료\n· 질소고정: 공기 중 질소를 양분으로 바꿈\n· 비옥도: 땅이 기름진 정도", "ref": "산림토양학"}, {"id": "조림-79", "subject": "조림", "num": 79, "part": 4, "stem": "가을철 노지 묘포장에서 기온이 급강하할 때 흙 속의 수분이 얼어붙어 묘목을 땅 위로 솟구쳐 올리며 뿌리를 끊어놓는 서리발 피해(서릿발)의 방지 대책은?", "options": ["묘포 바닥에 모래와 짚을 덮거나 배토(흙덮기)를 실시하고 롤러로 눌러줌", "질소질 비료를 과다 시비함", "묘포장 물을 가두어 얼림", "가지치기를 강하게 실시함"], "answer": 0, "explain": "서리발(동상) 피해를 막으려면 배수를 양호하게 하고 짚이나 왕겨를 덮어 지온 저하를 완화해야 합니다.\n쉬운 풀이: 추운 날 흙 속 물이 얼면서 기둥 모양 얼음(서릿발)이 생기면 묘목을 위로 밀어 올려 뿌리가 끊어져요. 막으려면 배수를 좋게 하고, 짚·모래로 덮거나 흙을 덮고(배토) 롤러로 눌러 흙이 들뜨지 않게 해요.\n용어 풀이:\n· 서릿발(상주): 흙 속 물이 얼어 기둥처럼 솟는 현상\n· 배토: 흙을 덮거나 북돋아 주기\n· 동상: 추위에 의한 피해", "ref": "묘포관리학"}, {"id": "조림-80", "subject": "조림", "num": 80, "part": 4, "stem": "산림사업 안전관리 지침상 예초기(풀베기 기계) 작업 시 작업자 간에 유지해야 할 최소 안전 반경은?", "options": ["2m 이상", "5m 이상", "15m 이상", "50m 이상"], "answer": 2, "explain": "예초기 날에 돌이나 나뭇가지가 튕겨 나갈 위험이 있으므로 작업자 간 15m 이상의 안전거리를 의무 확보해야 합니다.\n쉬운 풀이: 예초기 칼날은 아주 빠르게 돌아서 돌멩이나 나뭇가지가 총알처럼 튕겨 나갈 수 있어요. 그래서 함께 일하는 사람끼리는 15m 이상 떨어져서 작업해야 해요.\n용어 풀이:\n· 예초기: 풀을 베는 회전 칼날 기계\n· 안전반경: 사고를 피하기 위해 유지하는 거리", "ref": "산림사업 안전사고 예방기준"}, {"id": "조림-81", "subject": "조림", "num": 81, "part": 4, "stem": "광합성 기작 중 고온·건조 기후에 적응하여 수분 손실을 최소화하고 광호흡을 억제하는 C4 식물의 해부학적 특징은?", "options": ["잎살세포(엽육세포)에만 엽록체가 발달해 있다.", "유관속초세포(관다발초세포)가 발달하고 내부에 엽록체가 풍부한 크란츠(Kranz) 구조를 갖는다.", "잎의 책상조직이 완전히 퇴화되어 없다.", "기공이 밤에만 열리고 낮에는 완전히 닫힌다."], "answer": 1, "explain": "C4 식물은 유관속초세포가 크고 엽록체가 풍부한 크란츠(Kranz) 구조를 가지며, 엽육세포에서 고정한 옥살아세트산을 말산으로 변환해 유관속초세포로 전달하여 루비스코(Rubisco) 주변의 CO2 농도를 높여 광호흡을 억제합니다.\n쉬운 풀이: 옥수수·사탕수수 같은 C4 식물은 덥고 건조한 곳에 맞게 진화했어요. 잎맥 둘레의 세포(유관속초세포)가 크고 엽록체가 많은 '크란츠(화환) 구조'를 가져서, 이산화탄소를 모아 농축한 뒤 광합성을 해요. 덕분에 기공을 덜 열어도 되고 광호흡 손실이 적어요. 참고로 대부분의 나무는 C3 식물이에요.\n용어 풀이:\n· C4 식물: 이산화탄소를 4탄소 화합물로 먼저 고정하는 식물\n· 유관속초세포: 잎맥을 둘러싼 세포\n· 광호흡: 빛이 강할 때 광합성 효율을 떨어뜨리는 반응", "ref": "수목생리학"}, {"id": "조림-82", "subject": "조림", "num": 82, "part": 4, "stem": "수목 체내 수분 흡수 및 이동을 지배하는 수분포텐셜(Water potential, Ψw)의 구성 요소로 옳지 **않은** 것은?", "options": ["삼투포텐셜(Ψs)은 용질 농도가 높을수록 음(-)의 값이 커져 수분을 끌어당긴다.", "압력포텐셜(Ψp)은 세포벽이 팽압을 받을 때 양(+)의 값을 갖는다.", "매트릭포텐셜(Ψm)은 토양 입자나 세포벽 표면에 물이 흡착되는 힘이다.", "중력포텐셜은 수고 10m당 약 1.0 MPa씩 수분포텐셜을 상승시킨다."], "answer": 3, "explain": "중력포텐셜은 수고 10m 상승할 때마다 수두압에 의해 수분포텐셜을 약 0.1 MPa (1 bar)씩 감소(저하)시킵니다.\n쉬운 풀이: 수분퍼텐셜은 '물이 어디로 움직이려 하는가'를 나타내는 에너지예요. 물은 높은 곳에서 낮은 곳으로 흘러요. 나무가 높아질수록 물을 중력을 이기며 올려야 하니 10m마다 약 0.1MPa씩 낮아져요. '1.0MPa 상승'은 크기도 방향도 틀렸어요.\n용어 풀이:\n· 수분퍼텐셜(Ψw): 물의 이동 방향을 정하는 에너지\n· 삼투퍼텐셜: 녹아 있는 물질 때문에 생기는 성분\n· MPa(메가파스칼): 압력 단위", "ref": "수목생리학"}, {"id": "조림-83", "subject": "조림", "num": 83, "part": 4, "stem": "우리나라 주요 조림 수종 중 종자 결실 주기가 1년(매년 풍채)으로 가장 짧고 안정적인 수종은?", "options": ["소나무", "일본잎갈나무(낙엽송)", "잣나무", "삼나무"], "answer": 3, "explain": "삼나무, 편백, 오리나무 등은 매년 결실하는 편이며, 소나무는 1~2년, 잣나무는 2~3년, 낙엽송은 5~7년 주기로 풍흉(해거리)이 심합니다.\n쉬운 풀이: 나무마다 씨앗이 많이 열리는 해(풍년)가 돌아오는 주기가 달라요. 삼나무·편백·오리나무는 거의 매년 씨를 맺고, 소나무 1~2년, 잣나무 2~3년, 낙엽송은 5~7년에 한 번 풍년이 와서 씨앗 구하기가 어려워요.\n용어 풀이:\n· 결실 주기: 종자가 많이 열리는 해가 돌아오는 간격\n· 풍흉(해거리): 열매가 많이 열리는 해와 적게 열리는 해가 번갈아 오는 현상", "ref": "조림학 종자생산학"}, {"id": "조림-84", "subject": "조림", "num": 84, "part": 4, "stem": "종자의 장기 저장을 위해 함수율을 5~10% 수준으로 건조시킨 후 밀봉하여 저온(0~4℃)에 보관해야 하는 종자(정통종자, Orthodox seed)로만 묶인 것은?", "options": ["밤나무, 상수리나무", "소나무, 일본잎갈나무", "은행나무, 호두나무", "회송, 들메나무"], "answer": 1, "explain": "· 소나무, 낙엽송, 가문비나무 등 대부분의 침엽수 종자는 함수율을 5~10%로 낮추어 저온 밀봉저장하는 정통종자(Orthodox seed)입니다.\n· 반면 밤, 참나무류, 은행나무 등은 건조하면 활력을 잃는 난저장성(Recalcitrant) 종자입니다.\n쉬운 풀이: 씨앗에는 말려서 오래 보관할 수 있는 정통종자와, 마르면 죽는 난저장성종자가 있어요. 소나무·낙엽송 같은 침엽수 씨는 수분을 5~10%로 말린 뒤 밀봉해 냉장(0~4℃) 보관하면 오래가요. 밤·도토리·은행은 마르면 죽어서 이렇게 못 해요.\n용어 풀이:\n· 정통종자(Orthodox): 건조·저온 저장에 견디는 종자\n· 난저장성종자(Recalcitrant): 건조하면 활력을 잃는 종자\n· 함수율: 물이 들어 있는 비율", "ref": "산림종자학"}, {"id": "조림-85", "subject": "조림", "num": 85, "part": 4, "stem": "양묘장에서 봄철 식재 전까지 묘목의 뿌리가 마르지 않도록 임시로 묻어두는 가식(假植) 요령으로 옳지 **않은** 것은?", "options": ["바람이 적고 배수가 잘되는 그늘진 곳을 선정한다.", "묘목의 줄기 끝이 북쪽을 향하도록 비스듬히 눕혀 묻는다.", "뿌리 사이에 흙이 골고루 들어가도록 흙을 채우고 밟아준다.", "가식 기간 중 건조하지 않도록 충분히 관수한다."], "answer": 1, "explain": "· 가식할 때는 묘목의 끝(수간)이 남쪽을 향하게 기울여 묻거나, 직사광선을 피해 북사면의 차광된 곳에 두어 눈(동아)의 조기 발아를 방지해야 합니다.\n· (줄기를 북쪽으로 하면 이른 봄 햇볕에 줄기가 직접 노출되어 건조·동해를 받기 쉽습니다.)\n쉬운 풀이: 가식은 캔 묘목을 심기 전까지 뿌리가 마르지 않게 임시로 흙에 묻어 두는 거예요. 그늘지고 배수 잘되는 곳에, 뿌리 사이에 흙을 채워 밟아 주고 물도 줘요. 이때 줄기 끝은 남쪽으로 눕혀 묻어야 해요. 북쪽을 향하게 하면 줄기가 이른 봄 햇볕에 그대로 드러나 마르거나 얼기 쉬워요.\n용어 풀이:\n· 가식(假植): 정식으로 심기 전 임시로 묻어 두기\n· 동아: 겨울눈\n· 관수: 물주기", "ref": "양묘학"}, {"id": "조림-86", "subject": "조림", "num": 86, "part": 4, "stem": "건전한 묘목 생육을 위한 이상적인 묘포 토양의 삼상(Three phases) 용적 조성 비율로 옳은 것은?", "options": ["고상 50%, 액상 25%, 기상 25%", "고상 70%, 액상 15%, 기상 15%", "고상 30%, 액상 40%, 기상 30%", "고상 40%, 액상 40%, 기상 20%"], "answer": 0, "explain": "토양 물리학적으로 가장 이상적인 묘포 토양 삼상 비율은 고상(무기물+유기물) 약 50%, 액상(토양수분) 25%, 기상(토양공기) 25%입니다.\n쉬운 풀이: 흙은 알갱이(고상), 물(액상), 공기(기상) 세 부분으로 이뤄져요. 묘목이 잘 자라는 이상적인 흙은 알갱이 50%, 물 25%, 공기 25%예요. 물과 공기가 반반이어야 뿌리가 물도 마시고 숨도 쉴 수 있어요.\n용어 풀이:\n· 삼상: 흙의 고체·액체·기체 세 상태\n· 고상: 흙 알갱이\n· 액상: 흙 속 물\n· 기상: 흙 속 공기", "ref": "산림토양학"}, {"id": "조림-87", "subject": "조림", "num": 87, "part": 4, "stem": "산벌작업(Shelterwood system)에서 모수로부터 떨어진 종자가 발아하여 어린 묘목이 안전하게 발생할 수 있도록 상층 임관을 성기게 열어주는 벌채 단계는?", "options": ["예비벌(Preparatory cutting)", "하종벌(Seed cutting)", "후벌(Removal cutting)", "수벌(Final cutting)"], "answer": 1, "explain": "산벌작업은 예비벌(결실 촉진) → 하종벌(치수 발생을 위한 하종 및 광선 유입) → 후벌(치수가 자란 후 상층목 수확벌채) 순으로 진행됩니다.\n쉬운 풀이: 산벌작업 3단계 중 '하종벌'은 씨앗이 떨어지게(하종) 하면서 위층을 성글게 베어 햇빛이 땅에 들어오게 하는 단계예요. 그래야 떨어진 씨가 싹 트고 어린나무가 자랄 수 있어요. 예비벌(준비) → 하종벌(씨 뿌리기) → 후벌(마무리) 순서를 다시 확인하세요.\n용어 풀이:\n· 하종벌: 종자를 떨어뜨리고 빛을 들이는 벌채\n· 임관: 나무 윗부분이 이룬 지붕\n· 치수: 어린나무", "ref": "조림학 갱신론"}, {"id": "조림-88", "subject": "조림", "num": 88, "part": 4, "stem": "다음 중 맹아력(그루터기에서 새싹이 돋아나는 힘)이 가장 약하여 왜림작업에 의한 갱신이 불가능한 수종은?", "options": ["신갈나무", "아까시나무", "잣나무", "상수리나무"], "answer": 2, "explain": "· 잣나무, 소나무, 전나무, 가문비나무 등 대부분의 침엽수는 맹아력이 거의 없어 왜림작업이 불가능합니다.\n· (리기다소나무, 주목 등은 예외적으로 맹아력이 있음)\n쉬운 풀이: 맹아력은 그루터기에서 새싹이 돋아나는 힘이에요. 참나무류(신갈·상수리)와 아까시나무는 맹아력이 아주 강하지만, 잣나무·소나무·전나무 같은 대부분의 침엽수는 맹아가 거의 안 나서 그루터기로 숲을 되살릴 수 없어요. 예외는 리기다소나무·주목이에요.\n용어 풀이:\n· 맹아력: 그루터기·줄기에서 새싹이 나는 능력\n· 왜림작업: 맹아로 숲을 갱신하는 방법", "ref": "조림학 왜림론"}, {"id": "조림-89", "subject": "조림", "num": 89, "part": 4, "stem": "천연하종갱신 대상지에서 수간의 낙엽과 유기물층이 너무 두꺼워 종자가 광물질 토양에 닿지 못할 때 취하는 가장 효과적인 임상 정리 방법은?", "options": ["지면긁기(Scarification)", "객토", "짚 피복", "복토"], "answer": 0, "explain": "두꺼운 유기물(낙엽·부식토) 층은 종자의 수분 흡수를 방해하고 뿌리가 광물질 토양에 정착하지 못하게 하므로, 종자 낙하 직전에 긁어주어 광물질 토양을 노출시키는 '지면긁기'를 실시합니다.\n쉬운 풀이: 낙엽이 두껍게 쌓여 있으면 떨어진 씨앗이 진짜 흙(광물질 토양)에 닿지 못해 말라 죽어요. 씨가 떨어지기 직전에 땅 표면을 긁어서 낙엽층을 걷어내고 흙을 드러내 주면 싹이 잘 나요. 이걸 지면긁기라고 해요.\n용어 풀이:\n· 천연하종갱신: 자연적으로 떨어진 씨앗으로 숲을 만드는 것\n· 지면긁기: 지표를 긁어 흙을 드러내는 작업\n· 광물질 토양: 유기물이 적은 원래 흙", "ref": "조림학 천연갱신론"}, {"id": "조림-90", "subject": "조림", "num": 90, "part": 4, "stem": "식물 호르몬 중 가뭄 등 환경 스트레스에 처했을 때 기공을 닫아 수분 증산을 차단하고, 종자의 휴면을 유지시키는 역할을 하는 호르몬은?", "options": ["옥신(Auxin)", "지베렐린(Gibberellin)", "앱시스산(Abscisic acid, ABA)", "시토키닌(Cytokinin)"], "answer": 2, "explain": "앱시스산(ABA)은 식물의 대표적인 스트레스 호르몬으로, 수분 부족 시 공변세포의 칼륨(K+) 이온 유출을 유도하여 기공을 신속히 닫고 종자 휴면을 유지시킵니다.\n쉬운 풀이: 앱시스산(ABA)은 '위기 대응 호르몬'이에요. 가뭄이 오면 기공을 재빨리 닫아 물이 날아가지 않게 하고, 씨앗이 나쁜 계절에 싹 트지 않도록 잠들게(휴면) 해요. 옥신은 뿌리·정아우세, 지베렐린은 키 크기, 시토키닌은 세포분열이에요.\n용어 풀이:\n· 앱시스산(ABA): 스트레스·휴면 호르몬\n· 공변세포: 기공을 열고 닫는 한 쌍의 세포\n· 휴면: 싹 트지 않고 쉬는 상태", "ref": "수목생리학"}, {"id": "조림-91", "subject": "조림", "num": 91, "part": 4, "stem": "다층혼효림 및 복층림 조성을 위해 상층목 아래에 그늘을 견디며 자랄 수 있도록 식재하는 하층 수종(수하식재 수종)으로 가장 적합한 것은?", "options": ["편백, 주목", "자작나무, 은사시나무", "낙엽송, 이태리포플러", "소나무, 상수리나무"], "answer": 0, "explain": "복층림의 하층 식재 수종은 상층목의 피압 그늘을 견뎌야 하므로 내음성이 강한 음수(주목, 전나무, 편백 등)를 선정해야 합니다.\n쉬운 풀이: 큰 나무 아래 그늘진 곳에 심을 나무는 그늘을 잘 견뎌야 해요. 그래서 음수인 주목·전나무·편백이 알맞아요. 자작나무·포플러·낙엽송·소나무는 햇빛을 많이 필요로 하는 양수라 그늘에서는 잘 못 자라요.\n용어 풀이:\n· 수하식재: 큰 나무 아래에 심기\n· 복층림: 위아래 두 층 이상의 숲\n· 음수: 그늘에 강한 나무", "ref": "조림학 숲가꾸기 지침"}, {"id": "조림-92", "subject": "조림", "num": 92, "part": 4, "stem": "조림지 풀베기(모두베기, 줄베기, 둘레베기) 작업 중 경사지에서 토양 유실과 풍해를 방지하면서 묘목 주변의 잡초만 효율적으로 제거하는 방식은?", "options": ["모두베기(전면베기)", "줄베기(대상베기)", "방치", "화입"], "answer": 1, "explain": "줄베기는 묘목이 심겨진 식재 열을 따라 폭 90~100cm 정도로 띠 모양으로 베어주는 방식으로, 전면베기에 비해 토양 침식을 방지하고 노력을 절감할 수 있어 경사지 조림지에 적합합니다.\n쉬운 풀이: 줄베기는 묘목이 심긴 줄을 따라 90~100cm 폭으로 띠처럼 풀을 베고, 줄 사이 풀은 남겨 두는 방법이에요. 남은 풀이 흙을 붙잡아 경사지에서 흙이 쓸려 내려가지 않고, 바람도 막아줘요. 일도 전면베기보다 적게 들어요.\n용어 풀이:\n· 줄베기(대상베기): 식재 줄을 따라 띠 모양으로 베기\n· 모두베기(전면베기): 전체 풀을 다 베기\n· 풍해: 바람 피해", "ref": "조림학 숲가꾸기"}, {"id": "조림-93", "subject": "조림", "num": 93, "part": 4, "stem": "수목의 가지치기 절단면에서 병원균의 침입을 막고 상처를 스스로 구획화하여 치유하는 원리를 설명한 Shigo의 수목 방어 메커니즘 모델은?", "options": ["CODIT 모델 (Compartmentalization of Decay in Trees)", "ABCDE 모델", "압류설(Pressure-flow hypothesis)", "생장조절설"], "answer": 0, "explain": "Alex Shigo의 CODIT 모델은 나무가 상처를 입었을 때 도관 차단, 만재 방어벽, 방사유조직 방어벽, 상처 후 형성층의 신생벽(Barrier zone) 등 4대 벽을 형성하여 부후의 확산을 공간적으로 가두어 격리한다는 구획화 모델입니다.\n쉬운 풀이: 나무는 상처가 나면 사람처럼 상처를 '고치는' 게 아니라, 썩는 부분이 퍼지지 않게 방어벽을 쳐서 '가둬 버려요'. 쉬고(Shigo)라는 학자가 이를 CODIT(나무 속 부후의 구획화) 모델로 설명했어요. 가지치기를 할 때 가지 깃(branch collar)을 남기는 이유이기도 해요.\n용어 풀이:\n· CODIT: 수목의 부후 구획화 모델\n· 부후: 나무가 썩는 것\n· 구획화: 칸을 나눠 가두는 것\n· 형성층: 줄기를 굵게 만드는 세포층", "ref": "수목생리학 및 수목관리학"}, {"id": "조림-94", "subject": "조림", "num": 94, "part": 4, "stem": "산림 숲가꾸기 간벌 방식 중 상층의 불량 대경목과 병해충 피해목을 제거하고 중·하층의 건전목을 존치하여 지속적인 복층 수확을 유도하는 방식은?", "options": ["정량간벌", "하층간벌(독일식)", "택벌간벌(Selection thinning)", "열식간벌"], "answer": 2, "explain": "택벌간벌은 임관 상층의 성숙목이나 불량목을 골라 베어 하층의 유령목 생장을 촉진하는 방법으로, 이령림이나 복층림 경영에 적합합니다.\n쉬운 풀이: 택벌간벌은 위층에 있는 다 자랐거나 모양이 나쁜 큰 나무를 골라 베어, 아래층의 건강한 어린나무가 잘 크도록 하는 방법이에요. 나이가 다른 나무가 섞인 숲(이령림·복층림)을 계속 유지하며 수확할 때 써요.\n용어 풀이:\n· 택벌간벌: 상층의 성숙목·불량목을 골라 베는 간벌\n· 이령림: 나이가 다양한 나무로 이뤄진 숲\n· 대경목: 굵은 나무", "ref": "조림학 간벌론"}, {"id": "조림-95", "subject": "조림", "num": 95, "part": 4, "stem": "수목 체내에서 재이동성(Mobility)이 낮아 결핍 증상이 성숙한 늙은 잎이 아닌 최상부 어린잎이나 신초부터 먼저 나타나는 무기영양소는?", "options": ["질소(N)", "칼슘(Ca)", "칼륨(K)", "마그네슘(Mg)"], "answer": 1, "explain": "칼슘(Ca), 철(Fe), 붕소(B) 등은 체관 내 이동성이 극히 불량하여 체내 결핍 시 늙은 잎에서 어린잎으로 이동하지 못하므로, 생장점과 어린잎에서 기형, 황화, 마름 등의 결핍 증상이 가장 먼저 발생합니다.\n쉬운 풀이: 양분마다 몸속에서 옮겨 다니는 정도가 달라요. 칼슘·철·붕소는 한번 자리 잡으면 거의 안 움직여서, 부족해도 늙은 잎에서 빼내 쓸 수 없어요. 그래서 새로 자라는 어린잎·새순부터 이상이 생겨요. 반대로 질소·칼륨·마그네슘은 잘 움직여서 늙은 잎부터 증상이 나와요.\n용어 풀이:\n· 재이동성: 양분이 몸속에서 다른 곳으로 옮겨 가는 성질\n· 신초: 새로 자란 가지\n· 결핍 증상: 양분이 부족해서 생기는 이상", "ref": "수목생리학"}, {"id": "조림-96", "subject": "조림", "num": 96, "part": 4, "stem": "묘목의 건전도를 평가하는 지표 중 지상부 묘고(cm)를 뿌리목 근원경(mm)으로 나눈 값으로, 묘목의 가늘고 긴 웃자람 상태를 평가하는 지수는?", "options": ["묘목 형질비(간주형태 지수, Sturdiness quotient)", "T/R률", "근계분기도", "발아세"], "answer": 0, "explain": "형질비(SQ, 간주형태) = 묘고(cm) / 근원경(mm)이며, 이 값이 지나치게 크면 묘목이 연약하게 웃자라 바람이나 건조에 약하다는 뜻입니다.\n쉬운 풀이: 형질비는 묘목 키(cm)를 뿌리목 굵기(mm)로 나눈 값이에요. 키만 크고 줄기가 가늘면 값이 커지는데, 이런 묘목은 콩나물처럼 웃자라서 바람·가뭄에 약해요. 키와 굵기가 균형 잡혀 값이 적당해야 튼튼한 묘목이에요.\n용어 풀이:\n· 형질비(SQ): 묘고(cm) ÷ 근원경(mm)\n· 근원경: 뿌리와 줄기 경계(뿌리목)의 지름\n· 웃자람: 가늘고 약하게 길게 자람", "ref": "양묘학"}, {"id": "조림-97", "subject": "조림", "num": 97, "part": 4, "stem": "산림자원법령상 우량 종자 채취를 위해 지정된 채종림의 지정 및 관리에 관한 설명으로 옳지 **않은** 것은?", "options": ["산림청장 또는 시·도지사가 형질이 우수한 림분을 채종림으로 지정할 수 있다.", "채종림에서는 임목의 결실을 방해하는 덩굴류와 형질 불량목을 제거한다.", "수관 발달과 채광을 촉진하기 위해 강도의 솎아베기(간벌)를 실시한다.", "채종림 내에서는 종자 채취 목적이라 하더라도 일체의 임목 벌채가 엄격히 금지된다."], "answer": 3, "explain": "채종림의 우량한 수관 형성과 개화·결실을 돕기 위해 불량목 제거 및 강도 간벌, 종자 채취를 위한 가지치기 등은 적극적으로 허용 및 권장됩니다.\n쉬운 풀이: 채종림은 좋은 씨앗을 얻는 숲이라 오히려 적극적으로 관리해요. 덩굴과 모양 나쁜 나무를 없애고, 강하게 솎아베어 남은 나무가 햇빛을 많이 받아 꽃·열매를 많이 맺게 해요. 그러니 '벌채가 일체 금지된다'는 말이 틀렸어요.\n용어 풀이:\n· 채종림: 우량 종자를 채취하기 위해 지정한 숲\n· 형질 불량목: 모양·성질이 나쁜 나무\n· 림분(임분): 비슷한 나무로 이뤄진 숲 덩어리", "ref": "산림자원법 시행규칙"}, {"id": "조림-98", "subject": "조림", "num": 98, "part": 4, "stem": "종자의 발아 촉진을 위해 일정 기간 습윤한 상태에서 저온(0~5℃)에 보관하여 휴면을 깨뜨리는 인공 처리는?", "options": ["춘화처리(Vernalization)", "습적처리(저온층적법, Stratification)", "열탕처리", "황산침지"], "answer": 1, "explain": "종자의 내적 휴면(배 휴면)을 타파하기 위해 젖은 모래나 피트모스와 섞어 1~3개월간 저온(0~5℃)에 보관하는 처리를 습적처리(층적법, Stratification) 또는 노천매장이라 합니다.\n쉬운 풀이: 어떤 씨앗은 겨울 추위를 겪어야 '이제 봄이구나' 하고 싹을 틔워요. 그래서 젖은 모래와 섞어 0~5℃ 냉장 상태로 1~3개월 두어 겨울을 흉내 내 주는데, 이걸 습적처리(층적법)라고 해요. 땅에 묻어 겨울을 나게 하는 노천매장도 같은 원리예요.\n용어 풀이:\n· 습적처리(층적법): 젖은 상태로 저온 보관해 휴면을 깨는 처리\n· 휴면타파: 잠든 씨앗을 깨우는 것\n· 피트모스: 이끼가 쌓여 만든 흙 재료", "ref": "산림종자학"}, {"id": "조림-99", "subject": "조림", "num": 99, "part": 4, "stem": "산림의 1차 건생천이(Xerarch succession) 과정에서 맨 처음 나지(암반)에 정착하여 유기물을 형성하는 선구 식생은?", "options": ["선태류 및 지의류", "일년생 초본", "다년생 관목", "양수 교목"], "answer": 0, "explain": "척박한 건조 암반 나지에서 시작하는 1차 건생천이의 개척자(Pioneer)는 지의류와 이끼류(선태류)이며, 이들이 암석을 풍화시키고 유기물을 축적한 뒤 초본 → 관목 → 양수림 → 음수림(극상)으로 천이가 진행됩니다.\n쉬운 풀이: 용암이 굳은 바위처럼 아무것도 없는 땅에서 시작하는 천이를 1차 천이라고 해요. 맨 처음엔 바위에 붙어 사는 지의류·이끼가 자리 잡아 바위를 부수고 흙을 만들어요. 그 뒤 풀 → 떨기나무 → 양수림 → 음수림(극상) 순으로 바뀌어요.\n용어 풀이:\n· 천이: 시간이 지나며 식물 군집이 바뀌어 가는 과정\n· 지의류: 균류와 조류가 함께 사는 생물(바위옷)\n· 선태류: 이끼\n· 극상: 천이의 마지막 안정 단계", "ref": "산림생태학"}, {"id": "조림-100", "subject": "조림", "num": 100, "part": 4, "stem": "훼손된 산림 복원 시 생태계의 건강성과 자생력을 회복하기 위해 권장되는 식재 식생 선정 원칙으로 가장 옳은 것은?", "options": ["속성 외래종을 밀식하여 조기에 녹화를 달성한다.", "대상지의 자생 수종 및 주변 천연림의 잠재자연식생에 부합하는 수종을 도입한다.", "경제적 가치가 높은 수종 단일종으로 단순림을 조성한다.", "지피 식물 도입을 배제하고 교목류만 전면 식재한다."], "answer": 1, "explain": "생태적 산림복원은 해당 입지의 기후·토양 환경에 적응된 자생 수종과 다층 구조의 잠재자연식생을 바탕으로 생물다양성을 확보하는 것이 기본 원칙입니다.\n쉬운 풀이: 망가진 숲을 되살릴 때는 그 지역에 원래 살던 자생 수종, 그리고 주변 자연림이 보여주는 '원래 자랄 숲'(잠재자연식생)에 맞는 나무를 심는 게 원칙이에요. 그래야 그 땅 기후·흙에 잘 맞고 생물다양성도 회복돼요. 외래종 밀식·단일 수종은 반대 방향이에요.\n용어 풀이:\n· 자생 수종: 그 지역에 원래 자라던 나무\n· 잠재자연식생: 사람 간섭이 없으면 자연히 자랄 식생\n· 단순림: 한 종류 나무로만 된 숲", "ref": "산림생태복원공학"}, {"id": "조림-101", "subject": "조림", "num": 101, "part": 5, "stem": "「산림사업 표준안전 작업지침」(산림청 고시)상 임업용 동력기계톱 벌목 시 **방향베기의 깊이** 기준은?", "options": ["벌근직경의 1/2 ~ 1/3", "벌근직경의 1/3 ~ 1/4", "벌근직경의 1/6 ~ 1/8", "벌근직경의 1/10"], "answer": 1, "explain": "· 고시 제48조제1호: 방향베기 깊이는 벌근직경의 1/3~1/4, 바닥절단부와 상부(하부)절단부가 이루는 각은 30° 이상\n· ⚠️ 학습모듈(조림 p.105~ 안전사고 예방)은 '입목지름의 1/5~1/3'로 적혀 있음 → 지문이 '고시'를 말하면 1/3~1/4\n쉬운 풀이: 같은 '방향베기 깊이'인데 자료마다 숫자가 달라서 헷갈리는 문제예요. 산림청 고시(표준안전 작업지침)는 그루터기 지름의 1/3~1/4, 학습모듈은 1/5~1/3로 적어요. 문제에 '고시' '작업지침'이 나오면 1/3~1/4를 고르세요. 홈 각도는 30° 이상이에요.\n용어 풀이:\n· 방향베기: 나무가 넘어갈 쪽에 내는 쐐기 홈\n· 벌근직경: 베는 위치의 줄기 지름\n· 고시: 행정기관이 공식 발표한 규정", "ref": "산림사업 표준안전 작업지침 제48조"}, {"id": "조림-102", "subject": "조림", "num": 102, "part": 5, "stem": "「산림사업 표준안전 작업지침」상 **따라베기의 위치**로 옳은 것은?", "options": ["방향베기 바닥절단부와 같은 높이", "방향베기 바닥절단부보다 직경의 1/10 이상 높게", "방향베기 바닥절단부보다 직경의 1/3 이상 높게", "방향베기 바닥절단부보다 낮게"], "answer": 1, "explain": "· 고시 제48조제3·4호: 따라베기는 바닥절단부보다 직경의 1/10 이상 높이, 깊이는 벌도맥 폭이 벌근직경의 1/10 정도 남도록\n· ⚠️ 학습모듈은 '방향베기 밑면보다 2~3cm 높게'로 설명 → 출처별로 구분\n쉬운 풀이: 따라베기는 반대편에서 마지막으로 자르는 작업인데, 방향베기 바닥보다 높게 잘라야 경첩(벌도맥)이 남아 나무가 안전하게 넘어가요. 고시는 '지름의 1/10 이상 높게', 학습모듈은 '2~3cm 높게'라고 표현해요. 둘 다 '높게'가 핵심이에요.\n용어 풀이:\n· 따라베기(추구): 방향베기 반대편에서 하는 마지막 절단\n· 벌도맥: 넘어갈 방향을 잡아 주는 남겨진 띠\n· 바닥절단부: 방향베기의 아래쪽 수평 절단면", "ref": "산림사업 표준안전 작업지침 제48조"}, {"id": "조림-103", "subject": "조림", "num": 103, "part": 5, "stem": "표준안전 작업지침상 수구각(방향베기) 따기와 따라베기 기술, 벌목 안전보조장치를 반드시 적용해야 하는 입목 기준과 수구각으로 옳은 것은?", "options": ["가슴높이지름 10cm 이상 — 15° 이상", "가슴높이지름 20cm 이상 — 30° 이상", "가슴높이지름 30cm 이상 — 45° 이상", "가슴높이지름 40cm 이상 — 60° 이상"], "answer": 1, "explain": "· 고시 제38조제10호: 가슴높이 지름 20cm 이상 나무는 수구각 30° 이상 따기 + 따라베기로 벌도맥을 남기고 안전보조장치로 목적 방향 벌목\n· 걸림목도 흉고직경 20cm 기준: 미만은 돌림대·밧줄, 이상은 견인기구·안전보조장치(제43조)\n쉬운 풀이: 가슴높이 지름 20cm 이상인 굵은 나무는 넘어질 때 힘이 커서 위험해요. 그래서 30° 이상 홈을 내는 방향베기와 따라베기를 정확히 하고, 쐐기·견인기 같은 안전보조장치를 써서 원하는 방향으로 넘겨야 해요. 숫자는 '20cm·30°' 세트예요.\n용어 풀이:\n· 수구각: 방향베기 홈이 벌어진 각도\n· 안전보조장치: 쐐기·견인기 등 벌목 보조 도구\n· 걸림목: 넘어지다 다른 나무에 걸린 나무", "ref": "산림사업 표준안전 작업지침 제38조·제43조"}, {"id": "조림-104", "subject": "조림", "num": 104, "part": 5, "stem": "표준안전 작업지침상 벌목·조재·집재·적재 등 **고위험 산림작업** 시 산림사업장에 같이 있어야 하는 최소 작업자 수는?", "options": ["1명", "2명", "3명", "5명"], "answer": 1, "explain": "고시 제19조(단독작업의 금지): 고위험 작업은 최소 2명 이상, 시각·청각으로 확인할 수 없는 장소와 추락·전복·깔림 위험 작업에는 단독 배치 금지\n쉬운 풀이: 벌목·나무 옮기기 같은 위험한 작업은 사고가 나면 혼자서는 구조 요청도 못 해요. 그래서 반드시 최소 2명 이상이 함께 있어야 하고, 서로 보이지 않거나 들리지 않는 곳에 혼자 일하게 해선 안 돼요.\n용어 풀이:\n· 단독작업: 혼자 하는 작업\n· 조재: 벤 나무의 가지를 치고 일정 길이로 자르기\n· 집재: 벤 나무를 한곳에 모으기\n· 적재: 차에 싣기", "ref": "산림사업 표준안전 작업지침 제19조"}, {"id": "조림-105", "subject": "조림", "num": 105, "part": 5, "stem": "작업 대상 수목의 수고 몇 배 이내에 송전선이 있으면 송전선 관리주체·산림사업 주체와 협의하여 안전한 작업환경을 확보한 뒤 작업해야 하는가?", "options": ["1배", "1.5배", "2배", "3배"], "answer": 2, "explain": "고시 제14조: 수고 2배 이내 송전선 → 협의 후 작업. 벌목 시 작업자 배치도 벌도목 수고 2배 이상 거리(제38조·제40조)\n쉬운 풀이: 나무가 넘어질 때 쓰러지는 거리는 대략 나무 키만큼이고 튕기면 더 멀리 가요. 그래서 나무 키의 2배 안에 송전선이 있으면 전기 관리 기관과 미리 협의해야 하고, 다른 작업자도 나무 키 2배 이상 떨어져 있어야 해요. '수고 2배'가 핵심 숫자예요.\n용어 풀이:\n· 수고: 나무의 높이\n· 송전선: 전기를 보내는 고압선\n· 벌도목: 베어서 넘어뜨리는 나무", "ref": "산림사업 표준안전 작업지침 제14조"}, {"id": "조림-106", "subject": "조림", "num": 106, "part": 5, "stem": "표준안전 작업지침상 안전거리 기준의 조합으로 옳은 것은?", "options": ["기계톱 들고 이동 3m 이상 · 예불기 들고 이동 5m 이상 · 예불기 작업 15m 이상", "기계톱 들고 이동 5m 이상 · 예불기 들고 이동 3m 이상 · 예불기 작업 10m 이상", "기계톱 들고 이동 10m 이상 · 예불기 들고 이동 10m 이상 · 예불기 작업 20m 이상", "기계톱 들고 이동 3m 이상 · 예불기 들고 이동 15m 이상 · 예불기 작업 5m 이상"], "answer": 0, "explain": "기계톱 이동: 엔진 정지·날 덮개, 이동자 간 3m 이상(제38조) / 예불기 이동: 시동 끄고 칼날 제거·덮개, 5m 이상(제33·62조) / 예불기 작업: 안전거리 15m 이상(제62조)\n쉬운 풀이: 장비를 들고 이동할 때와 작업할 때의 안전거리를 구분해요. 기계톱 들고 이동은 3m, 예불기 들고 이동은 5m, 예불기로 풀 벨 땐 돌이 튈 수 있어 15m 이상이에요. '3·5·15'로 외우세요.\n용어 풀이:\n· 예불기(예초기): 풀 베는 기계\n· 기계톱(체인톱): 사슬 톱날이 도는 톱\n· 날 덮개: 칼날을 덮는 안전 커버", "ref": "산림사업 표준안전 작업지침 제33·38·62조"}, {"id": "조림-107", "subject": "조림", "num": 107, "part": 5, "stem": "기계톱·예불기 조작 시 손에 전달되는 일일 국소 진동이 얼마 이상이면 방진장갑을 착용하게 해야 하는가?", "options": ["2 m/s²", "4 m/s²", "6 m/s²", "10 m/s²"], "answer": 1, "explain": "고시 제26조(손의 보호)제2항: 일일 국소 진동 4m/s² 이상 → 방진장갑\n쉬운 풀이: 기계톱·예초기를 오래 쓰면 손에 계속 진동이 전해져 혈관·신경이 상하는 '진동장애'가 생길 수 있어요. 하루 진동이 4m/s² 이상이면 진동을 흡수하는 방진장갑을 끼게 해야 해요.\n용어 풀이:\n· 국소 진동: 손·팔 등 일부에 전달되는 진동\n· 방진장갑: 진동을 줄여 주는 장갑 / m\n· s²: 진동 세기(가속도) 단위", "ref": "산림사업 표준안전 작업지침 제26조"}, {"id": "조림-108", "subject": "조림", "num": 108, "part": 5, "stem": "표준안전 작업지침상 와이어로프·달기체인의 **안전계수** 기준으로 옳지 **않은** 것은?", "options": ["작업자가 탑승하는 운반구 지지: 10 이상", "화물 하중을 직접 지지: 5 이상", "훅·샤클·클램프·리프팅 빔: 3 이상", "그 밖의 경우: 2 이상"], "answer": 3, "explain": "· 고시 제36조: 탑승 10 / 화물 직접 5 / 훅·샤클 등 3 / 그 밖의 경우 4 이상\n· 폐기 기준(제35조): 한 꼬임 소선 10% 이상 끊어짐, 지름 감소가 공칭지름의 7% 초과\n쉬운 풀이: 안전계수는 '견딜 수 있는 힘이 실제 걸리는 힘의 몇 배인가'예요. 사람이 타는 것은 10배, 짐을 직접 매다는 것은 5배, 훅·샤클 같은 연결 부품은 3배, 그 밖의 경우는 4배 이상이에요. '2 이상'이 틀렸어요. '사람10·짐5·고리3·기타4'.\n용어 풀이:\n· 안전계수: 파괴 하중 ÷ 실제 하중\n· 와이어로프: 강철선을 꼬아 만든 밧줄\n· 샤클: U자 모양 연결 고리", "ref": "산림사업 표준안전 작업지침 제35·36조"}, {"id": "조림-109", "subject": "조림", "num": 109, "part": 5, "stem": "임업용 예불기 작업 방법으로 옳은 것은?", "options": ["칼날 회전방향이 우측이므로 좌측에서 우측으로 진행한다.", "칼날 회전방향이 좌측이므로 허리를 축으로 우측에서 좌측으로 진행한다.", "급경사지에서는 비탈면 아래쪽을 향해 진행한다.", "덩굴은 아래 부분을 먼저 자른 뒤 위 부분을 작업한다."], "answer": 1, "explain": "· 고시 제61조: 회전방향이 좌측 → 우측에서 좌측으로\n· 급경사지에서 아래쪽으로 진행 금지\n· 덩굴은 위 부분 1차 작업 후 아래 부분\n쉬운 풀이: 예불기 칼날은 왼쪽(반시계)으로 돌아서, 오른쪽에서 왼쪽으로 쓸어 가야 벤 풀이 작업자 반대쪽으로 날아가요. 급경사에서 아래로 내려가며 하면 미끄러질 수 있어 금지이고, 덩굴은 위를 먼저 자른 뒤 아래를 잘라요.\n용어 풀이:\n· 회전방향: 칼날이 도는 방향\n· 급경사지: 경사가 가파른 곳\n· 덩굴: 다른 물체를 감고 오르는 식물", "ref": "산림사업 표준안전 작업지침 제61조"}, {"id": "조림-110", "subject": "조림", "num": 110, "part": 5, "stem": "「숲가꾸기 설계·감리 및 사업시행 지침」상 산림조합(중앙회)의 **산림경영지도원**이 선목을 수행하거나 현장대리인이 되기 위해 필요한 숲가꾸기 사업 실무경력은?", "options": ["1년 이상", "2년 이상", "3년 이상", "5년 이상"], "answer": 1, "explain": "· 제17조(선목의 자격) 제1항제5호, 제19조(현장대리인): 산림경영지도원 중 숲가꾸기 사업 실무경력 2년 이상인 자\n· 선목 가능자: 임업직 공무원\n· 설계·감리 업체(해당 감리업체 제외)\n· 사업시행자\n· 기능인영림단(국유림)\n· 산림경영지도원(2년↑)\n· 독림가·임업후계자(자기 산림)\n쉬운 풀이: 선목은 숲가꾸기 때 '이 나무를 벨지, 남길지'를 골라 표시하는 일이에요. 산림경영지도원은 숲가꾸기 실무경력이 2년 이상이어야 선목을 하거나 현장대리인이 될 수 있어요. 이 시험 직무와 직접 관련된 숫자라 꼭 외우세요.\n용어 풀이:\n· 선목: 벨 나무·남길 나무를 고르는 작업\n· 현장대리인: 사업 현장을 책임지는 사람\n· 실무경력: 실제 현장 일 경험", "ref": "숲가꾸기 설계·감리 및 사업시행 지침 제17·19조"}, {"id": "조림-111", "subject": "조림", "num": 111, "part": 5, "stem": "설계·감리를 용역으로 시행하는 숲가꾸기 사업 중 지방자치단체장이 시행하는 사업의 규모 기준은?", "options": ["솎아베기를 수반하는 10ha 이상", "솎아베기를 수반하는 30ha 이상", "솎아베기를 수반하는 50ha 이상", "솎아베기를 수반하는 100ha 이상"], "answer": 2, "explain": "· 지침 제5조: 솎아베기 수반 50ha 이상(지자체 시행, 산주 직접시행+보조) / 50ha 미만 분산 사업은 위탁 설계·감리 업체 지정\n· 분산 사업지 집단화도 국·공유림 임반 단위, 사유림 유역 단위 50ha 이상(제8조)\n쉬운 풀이: 솎아베기가 들어간 숲가꾸기 사업이 50ha 이상이면 규모가 커서, 지자체가 전문 업체에 설계·감리를 용역으로 맡겨요. 50ha가 안 되는 흩어진 작은 사업지는 모아서(집단화) 처리해요.\n용어 풀이:\n· 설계: 작업 계획을 세우는 것\n· 감리: 계획대로 작업했는지 확인·감독하는 것\n· 용역: 전문 업체에 맡기는 일", "ref": "숲가꾸기 설계·감리 및 사업시행 지침 제5·8조"}, {"id": "조림-112", "subject": "조림", "num": 112, "part": 5, "stem": "솎아베기를 수반하는 숲가꾸기 사업에서 산림경영기술자 **기능2급 이상**이 차지해야 하는 작업원 비율은? (산주·독림가·임업후계자 직접 실행 사업 제외)", "options": ["전체 작업인원의 30% 이상", "전체 작업인원의 50% 이상", "전체 작업인원의 70% 이상", "전원"], "answer": 1, "explain": "· 지침 제20조: 일반 50% 이상\n· 산주·독림가·임업후계자 직접 실행은 30% 이상\n· 현장대리인: 600ha 이하 1인, 600ha 초과 2인(제19조)\n쉬운 풀이: 솎아베기는 나무를 베는 위험하고 전문적인 일이라 자격 있는 사람이 일정 비율 이상 있어야 해요. 산림경영기술자 기능2급 이상인 작업원이 전체의 50% 이상이어야 하고, 산주·독림가가 직접 하는 사업은 30% 이상이에요.\n용어 풀이:\n· 산림경영기술자: 산림사업 기술 자격을 가진 사람\n· 기능2급: 기술자 등급 중 하나\n· 독림가: 모범적으로 산림을 경영하는 사람", "ref": "숲가꾸기 설계·감리 및 사업시행 지침 제19·20조"}, {"id": "조림-113", "subject": "조림", "num": 113, "part": 5, "stem": "숲가꾸기 지침상 **제거대상목 선목**의 대상과 표식 방법으로 옳은 것은?", "options": ["가슴높이지름 6cm 이상, 황색 수성페인트", "가슴높이지름 10cm 이상, 적색 수성페인트", "가슴높이지름 10cm 이상, 백색 수성페인트", "가슴높이지름 20cm 이상, 적색 유성페인트"], "answer": 1, "explain": "· 지침 제18조제3호: 제거대상목 선목은 DBH 10cm 이상만, 친환경 수성페인트(적색) / 미래목은 황색, 경계는 흰색\n· 경관 고려 지역은 미래목을 나무 뒤쪽 원형 표식 등으로 표시 가능\n쉬운 풀이: 숲가꾸기 표시 색은 시험에 자주 나와요. 베어 낼 나무(제거대상목)는 적색, 키울 나무(미래목)는 황색, 구역 경계는 흰색이에요. 제거대상목 표시는 가슴높이 지름 10cm 이상인 나무에만 하고, 환경을 위해 수성페인트를 써요. '빨강=베고, 노랑=키우고, 흰색=경계'.\n용어 풀이:\n· 제거대상목: 베어 낼 나무\n· 수성페인트: 물에 녹는 친환경 페인트\n· 미래목: 끝까지 키울 우량목", "ref": "숲가꾸기 설계·감리 및 사업시행 지침 제18조"}, {"id": "조림-114", "subject": "조림", "num": 114, "part": 5, "stem": "숲가꾸기 **실시설계 표준지**(용역 수행) 조사비율로 옳은 것은?", "options": ["풀베기 2% · 덩굴제거 1% · 어린나무가꾸기 0.25% · 솎아베기 0.5%", "풀베기 1% · 덩굴제거 0.5% · 어린나무가꾸기 0.5% · 솎아베기 1%", "풀베기 1% · 덩굴제거 1% · 어린나무가꾸기 1% · 솎아베기 1%", "풀베기 0.5% · 덩굴제거 0.5% · 어린나무가꾸기 1% · 솎아베기 2%"], "answer": 1, "explain": "· 실시설계 표준지: 1 / 0.5 / 0.5 / 1% (최대 200m×200m 격자)\n· 감리 표준지: 2 / 1 / 0.25 / 0.5% (최대 400m×400m 격자) — ①은 감리 표준지 비율\n쉬운 풀이: 표준지 조사 비율은 '설계'와 '감리'가 달라서 헷갈려요. 실시설계는 풀베기 1%·덩굴제거 0.5%·어린나무가꾸기 0.5%·솎아베기 1%이고, 감리는 2%·1%·0.25%·0.5%예요. 설계는 '1-0.5-0.5-1' 대칭 모양이라고 기억하면 쉬워요.\n용어 풀이:\n· 실시설계: 실제 작업을 위한 상세 설계\n· 표준지: 표본 조사 구역\n· 격자: 바둑판 모양 배치", "ref": "지속가능한 산림자원 관리지침 Ⅳ-1·2, 학습모듈 p.97"}, {"id": "조림-115", "subject": "조림", "num": 115, "part": 5, "stem": "숲가꾸기 표준지 조사·관리 방법으로 옳지 **않은** 것은?", "options": ["가슴높이지름은 6cm 이상 교목을 2cm 괄약으로 측정한다.", "설계표준지는 황색 테이프, 감리표준지는 적색 테이프로 표시한다.", "표준지는 숲가꾸기 사업 시행 때 원칙적으로 작업하지 않고 보존한다.", "표준지 경계는 적색 페인트, 제거대상목은 흰색 페인트로 표시한다."], "answer": 3, "explain": "경계 = 흰색, 제거대상목 = 적색, 도태간벌 미래목·정량간벌 형질우세목·가지치기 대상목 = 황색. 단, 풀베기 등 조림목 피해 방지 사업은 표준지에도 작업\n쉬운 풀이: 표준지는 나중에 결과를 비교하려고 손대지 않고 남겨 두는 기준 구역이에요. 표시 색은 경계 흰색, 제거대상목 적색, 미래목 등 남길 나무는 황색이에요. ④는 경계와 제거대상목 색을 서로 바꿔 놓아서 틀렸어요.\n용어 풀이:\n· 괄약: 일정 단위로 묶어 재는 것(2cm 괄약 = 2cm 단위)\n· 설계표준지: 설계 때 정하는 표준지\n· 감리표준지: 감리 때 정하는 표준지", "ref": "지속가능한 산림자원 관리지침 Ⅳ-1"}, {"id": "조림-116", "subject": "조림", "num": 116, "part": 5, "stem": "지속가능한 산림자원 관리지침상 풀베기 **작업 횟수** 기준으로 옳은 것은?", "options": ["잣나무·소나무류 3회, 낙엽송·참나무류 2회", "잣나무·소나무류 5~8회, 낙엽송·참나무류(상수리나무) 5회", "모든 수종 10회", "잣나무·소나무류 5회, 낙엽송·참나무류 8~10회"], "answer": 1, "explain": "· 조림목 수고가 풀베기 대상물보다 약 1.5배 또는 60~80cm 더 클 때까지 실시\n· 잣·소나무 5~8회, 낙엽송·참나무 5회\n· 비료 준 조림지는 식재 당년·이듬해 연 2회\n· 지역별 시기: 온대남부 5월 중순~9월 초순\n· 온대중부 5월 하순~8월 하순\n· 고산·온대북부 6월 초순~8월 중순\n쉬운 풀이: 풀베기는 묘목이 잡초보다 충분히 커질 때(잡초의 1.5배 또는 60~80cm 더 클 때)까지 해요. 천천히 크는 잣나무·소나무는 5~8회, 빨리 크는 낙엽송·참나무는 5회 정도면 돼요. 남쪽이 더 일찍 시작하고 늦게 끝나요.\n용어 풀이:\n· 풀베기 횟수: 조림 후 풀베기를 반복하는 총 횟수\n· 시비: 비료 주기\n· 온대남부: 남부 지방 기후대", "ref": "지속가능한 산림자원 관리지침 Ⅲ-1-나, 학습모듈 「조림」 풀베기 1-4"}, {"id": "조림-117", "subject": "조림", "num": 117, "part": 5, "stem": "국고보조 풀베기 작업과정에서 발생하는 조림목 피해의 **허용 피해율**은?", "options": ["5% 미만", "10% 미만", "15% 미만", "20% 미만"], "answer": 1, "explain": "· 피해율 허용치 10% 미만\n· 예취기 작업 전 낫으로 조림목 반경 20cm 이내 식생을 제거하는 '묘목찾기' 선행\n쉬운 풀이: 예초기로 풀을 베다 보면 실수로 묘목까지 자를 수 있어요. 나랏돈(국고보조)으로 하는 풀베기는 이런 피해가 10% 미만이어야 해요. 그래서 예초기 작업 전에 낫으로 묘목 둘레 20cm 풀을 먼저 치워 묘목 위치를 찾아 두는 '묘목찾기'를 해요.\n용어 풀이:\n· 국고보조: 나라에서 비용 일부를 지원\n· 피해율: 작업 중 다친 묘목 비율\n· 예취기: 풀 베는 기계", "ref": "지속가능한 산림자원 관리지침 Ⅲ-1-나, 학습모듈 「조림」 풀베기 1-7"}, {"id": "조림-118", "subject": "조림", "num": 118, "part": 5, "stem": "**3본 군상식재**의 식재 간격 기준으로 옳은 것은?", "options": ["식재목 간 0.6m, 식재군 간 3.3m × 3.0m", "식재목 간 1.2m, 식재군 간 4.1m", "식재목 간 1.0m, 식재군 간 6.6m", "식재목 간 1.4m, 식재군 간 1.4m"], "answer": 0, "explain": "· 3본 군상 0.6m / 3.3×3.0m\n· 5본 군상 1.2m / 4.1m\n· 2열 부분밀식 1m / 6.6m\n· ha당 5,000본 1.4m, 3,000본 1.8m 정방형\n쉬운 풀이: 군상식재는 묘목 몇 그루를 한 무리로 모아 심는 방법이에요. 3본씩 모아 심을 땐 무리 안 간격 0.6m, 무리끼리 간격 3.3m×3.0m예요. 5본이면 1.2m/4.1m예요. 일반 정사각형 식재는 5,000본이면 1.4m, 3,000본이면 1.8m 간격이에요.\n용어 풀이:\n· 군상식재: 여러 그루를 무리 지어 심기\n· 정방형 식재: 정사각형 간격으로 심기\n· 식재군: 함께 심은 나무 무리", "ref": "지속가능한 산림자원 관리지침 Ⅲ-1-가, 학습모듈 「조림」 인공림 식재목 배열"}, {"id": "조림-119", "subject": "조림", "num": 119, "part": 5, "stem": "조림지의 **활착 조사** 시기로 옳은 것은?", "options": ["조림 당해연도 3월~5월", "조림 당해연도 6월~9월", "조림 이듬해 3월~4월", "조림 3년 후 가을"], "answer": 1, "explain": "· 활착 조사는 조림 당해연도 6~9월\n· 활착률 80% 미만 보식, 50% 미만 재조림\n쉬운 풀이: 묘목이 잘 살았는지는 심은 해 여름~초가을(6~9월)에 조사해요. 이때면 살 나무는 잎이 나 있고 죽은 나무는 말라 있어서 구분이 쉬워요. 결과가 80% 미만이면 보식, 50% 미만이면 재조림이에요.\n용어 풀이:\n· 활착 조사: 묘목이 살았는지 확인하는 조사\n· 당해연도: 그해\n· 보식: 죽은 자리 보충 식재", "ref": "지속가능한 산림자원 관리지침 Ⅲ-1-가-(3)·(4)"}, {"id": "조림-120", "subject": "조림", "num": 120, "part": 5, "stem": "「산림자원법 시행규칙」(2026.10.1 시행)상 조림을 위한 벌채허가·신고 후 벌채한 자가 **조림해야 하는 기간**은?", "options": ["벌채한 날부터 1년 이내", "벌채한 날부터 2년 이내", "벌채한 날부터 3년 이내", "벌채한 날부터 5년 이내"], "answer": 2, "explain": "· 시행규칙 제6조: 벌채자 3년 이내\n· 조림지 훼손자 1년 이내\n· 조림 의무 면제지는 시장·군수·구청장이 벌채일부터 2년 이내 통지\n쉬운 풀이: 조림을 목적으로 허가·신고를 받고 나무를 벤 사람은 벤 날부터 3년 안에 다시 나무를 심어야 해요. 조림지를 훼손한 사람은 1년 이내로 더 짧아요. 2026년 10월 시행 최신 규칙이니 숫자를 정확히 외우세요.\n용어 풀이:\n· 벌채허가·신고: 나무를 베기 전 관청의 허락을 받거나 알리는 절차\n· 조림 의무: 벤 자리에 다시 심어야 하는 의무\n· 시행규칙: 법 시행에 필요한 세부 규정", "ref": "산림자원의 조성 및 관리에 관한 법률 시행규칙 제6조"}]}, {"code": "02", "name": "산림보호", "kind": "필수", "questions": [{"id": "산림보호-1", "subject": "산림보호", "num": 1, "part": 1, "stem": "볕데기(피소) 피해가 잘 생기는 수종이 **아닌** 것은?", "options": ["오동나무", "호두나무", "가문비나무", "소나무"], "answer": 3, "explain": "볕데기는 수피가 평활한 오동나무·호두나무·가문비나무, 남서방향 임연부\n쉬운 풀이: 볕데기(피소)는 강한 햇볕에 나무껍질이 데어서 말라 터지는 피해예요. 껍질이 얇고 매끈한 오동나무·호두나무·가문비나무가 잘 걸리고, 햇빛을 정면으로 받는 숲 가장자리 남서쪽에서 많이 생겨요. 소나무는 껍질이 두껍고 거칠어 잘 안 생겨요.\n용어 풀이:\n· 볕데기(피소): 강한 햇볕에 수피가 타서 죽는 피해\n· 수피: 나무껍질\n· 평활: 매끈함", "ref": "모듈 p.4"}, {"id": "산림보호-2", "subject": "산림보호", "num": 2, "part": 1, "stem": "만상(晩霜)에 대한 설명으로 옳은 것은?", "options": ["봄에 내리는 늦서리로 새순이 피해를 입는다", "늦가을에 내리는 이른서리로 생장이 덜 끝난 부분이 피해를 입는다", "겨울철 줄기가 얼어 세로로 갈라진다", "여름철 고온으로 묘목 뿌리목이 피해를 입는다"], "answer": 0, "explain": "만상 = 봄 늦서리, 조상 = 늦가을 이른서리\n쉬운 풀이: 서리 피해는 시기에 따라 이름이 달라요. '만(晩)'은 늦다는 뜻이라 만상은 봄에 늦게 내리는 서리로, 막 나온 새순이 얼어요. '조(早)'는 이르다는 뜻이라 조상은 가을에 일찍 내린 서리예요. '늦봄 만상, 이른가을 조상'.\n용어 풀이:\n· 만상(晩霜): 봄의 늦서리\n· 조상(早霜): 가을의 이른서리\n· 새순: 새로 돋은 어린 가지·잎", "ref": "p.4"}, {"id": "산림보호-3", "subject": "산림보호", "num": 3, "part": 1, "stem": "한 해에 연륜이 2개 생기는 '상륜'의 원인은?", "options": ["조상", "만상", "동계건조", "볕데기"], "answer": 1, "explain": "만상 피해로 한 해에 연륜이 2개 생김\n쉬운 풀이: 봄에 늦서리(만상)로 새순이 얼어 생장이 멈췄다가, 다시 자라기 시작하면 나이테 비슷한 선이 한 해에 하나 더 생겨요. 그래서 한 해에 나이테가 2개처럼 보이는 '상륜'이 생겨요.\n용어 풀이:\n· 상륜: 서리 피해로 생긴 가짜 나이테\n· 연륜: 나이테", "ref": "p.4"}, {"id": "산림보호-4", "subject": "산림보호", "num": 4, "part": 1, "stem": "잎 뒷면이 은회색 광택을 띠는 피해를 주는 대기오염물질은?", "options": ["SO₂", "O₃", "HF", "PAN"], "answer": 3, "explain": "· PAN = 잎 뒷면 은회색\n· O₃ = 잎 앞면(책상조직)\n쉬운 풀이: 대기오염물질마다 잎에 남기는 흔적이 달라요. PAN은 잎 뒷면을 은회색으로 번들거리게 만들고, 오존(O₃)은 잎 앞면(책상조직)에 반점을 만들어요. 'PAN 뒷면 은색'으로 외우세요.\n용어 풀이:\n· PAN: 자동차 배기가스 등에서 생기는 광화학 오염물질\n· 책상조직: 잎 앞쪽의 광합성 세포층\n· O₃(오존): 강한 산화력의 오염물질", "ref": "p.8"}, {"id": "산림보호-5", "subject": "산림보호", "num": 5, "part": 1, "stem": "수관화가 대부분 발생하는 상대습도 조건은?", "options": ["25% 이하", "40% 이하", "50% 이하", "60% 이하"], "answer": 0, "explain": "50% 이하에서 산불 발생 쉬움, 25% 이하에서 수관화 대부분\n쉬운 풀이: 공기가 건조할수록 나무와 낙엽이 바싹 말라 잘 타요. 상대습도 50% 이하면 산불이 나기 쉽고, 25% 이하로 매우 건조하면 불이 나무 꼭대기(수관)까지 타오르는 수관화로 번지는 경우가 대부분이에요.\n용어 풀이:\n· 상대습도: 공기 중 수증기가 최대량 대비 몇 %인지\n· 수관화: 나무 윗부분(잎·가지)이 타는 산불\n· 지표화: 땅 위 낙엽만 타는 산불", "ref": "p.12–13"}, {"id": "산림보호-6", "subject": "산림보호", "num": 6, "part": 1, "stem": "내화력이 강한 수종은?", "options": ["소나무", "삼나무", "은행나무", "편백"], "answer": 2, "explain": "소나무·삼나무·편백은 내화력 약함\n쉬운 풀이: 내화력은 불에 견디는 힘이에요. 은행나무는 잎과 껍질에 수분이 많고 기름기가 적어 잘 안 타요. 반대로 소나무·삼나무·편백은 송진 같은 기름 성분(수지)이 많아 불이 잘 붙어요. '은행은 불에 강하다'.\n용어 풀이:\n· 내화력: 불에 견디는 능력\n· 수지(송진): 침엽수에서 나오는 끈적한 기름 성분", "ref": "p.13"}, {"id": "산림보호-7", "subject": "산림보호", "num": 7, "part": 1, "stem": "산불 진화용 소화약제 MAP의 성분은?", "options": ["제2인산암모늄", "제1인산암모늄", "탄산수소나트륨", "황산암모늄"], "answer": 1, "explain": "MAP = 제1인산암모늄, DAP = 제2인산암모늄\n쉬운 풀이: 산불 끄는 약제 중 MAP는 '제1인산암모늄', DAP는 '제2인산암모늄'이에요. 이름 첫 글자 M(Mono=1), D(Di=2)를 떠올리면 쉽게 구분돼요.\n용어 풀이:\n· 소화약제: 불을 끄는 화학 약품\n· Mono: 하나\n· Di: 둘", "ref": "p.14"}, {"id": "산림보호-8", "subject": "산림보호", "num": 8, "part": 1, "stem": "내화수림대의 조성 폭은?", "options": ["10m 내외", "20m 내외", "30m 내외", "50m 내외"], "answer": 2, "explain": "내화수림대 폭 30m 내외\n쉬운 풀이: 내화수림대는 불에 강한 나무로 띠처럼 만든 숲으로, 산불이 넘어오지 못하게 막는 방어선 역할을 해요. 폭은 30m 내외로 만들어요. 조림 과목에서도 같은 숫자(30m)가 나오니 함께 외우세요.\n용어 풀이:\n· 내화수림대: 불에 강한 수종으로 만든 띠 숲\n· 방화선: 불이 번지지 못하게 만든 빈 띠", "ref": "p.14"}, {"id": "산림보호-9", "subject": "산림보호", "num": 9, "part": 1, "stem": "파이토플라스마가 일으키는 병은?", "options": ["잣나무털녹병", "대추나무 빗자루병", "뿌리혹병", "흰가루병"], "answer": 1, "explain": "· 대추나무·붉나무 빗자루병, 뽕나무 오갈병 = 파이토플라스마\n· ①④ 균류, ③ 세균\n쉬운 풀이: 파이토플라스마는 세포벽이 없는 아주 작은 세균 비슷한 병원체로, 매미충 같은 곤충이 옮겨요. 가지가 빗자루처럼 잔뜩 나는 대추나무·붉나무 빗자루병, 잎이 오그라드는 뽕나무 오갈병이 대표예요. 털녹병·흰가루병은 곰팡이(균류), 뿌리혹병은 세균이에요.\n용어 풀이:\n· 파이토플라스마: 세포벽 없는 미생물 병원체\n· 빗자루병: 가지가 빗자루처럼 많이 나는 병\n· 매개충: 병원체를 옮기는 곤충", "ref": "p.18"}, {"id": "산림보호-10", "subject": "산림보호", "num": 10, "part": 1, "stem": "각피를 뚫지 못해 매개충이나 접목 상처로만 침입하는 병원체가 **아닌** 것은?", "options": ["파이토플라스마", "바이러스", "소나무재선충", "균류"], "answer": 3, "explain": "균류는 각피를 직접 뚫고 침입 가능\n쉬운 풀이: 식물 표면은 각피(큐티클)라는 방어막으로 덮여 있어요. 곰팡이(균류)는 이걸 스스로 뚫고 들어갈 수 있지만, 바이러스·파이토플라스마·재선충은 못 뚫어서 곤충이 찔러 넣거나 상처를 통해서만 들어가요.\n용어 풀이:\n· 각피(큐티클): 잎·줄기 표면의 왁스 층\n· 균류: 곰팡이 무리\n· 침입: 병원체가 식물 안으로 들어가는 것", "ref": "p.18–21"}, {"id": "산림보호-11", "subject": "산림보호", "num": 11, "part": 1, "stem": "우리나라 소나무재선충병의 매개충은?", "options": ["광릉긴나무좀", "소나무좀", "솔수염하늘소", "박쥐나방"], "answer": 2, "explain": "솔수염하늘소·북방수염하늘소\n쉬운 풀이: 소나무재선충은 아주 작은 선충(실 같은 벌레)인데 스스로 이동하지 못해서 하늘소가 옮겨요. 우리나라에서는 솔수염하늘소와 북방수염하늘소가 매개충이에요. 광릉긴나무좀은 참나무시들음병을 옮기니 헷갈리지 마세요.\n용어 풀이:\n· 소나무재선충: 소나무를 말라 죽게 하는 선충\n· 선충: 실처럼 가늘고 작은 벌레\n· 하늘소: 긴 더듬이를 가진 딱정벌레", "ref": "p.21"}, {"id": "산림보호-12", "subject": "산림보호", "num": 12, "part": 1, "stem": "소나무재선충병 방제지침상 반출금지구역은 발생지역과 그로부터 몇 km 이내 지역인가?", "options": ["1km", "2km", "3km", "5km"], "answer": 1, "explain": "반출금지구역 = 발생지역 + 2km 이내\n쉬운 풀이: 재선충병이 퍼지지 않게 감염 지역의 소나무를 밖으로 옮기지 못하게 해요. 이 반출금지구역은 병이 생긴 지역과 그 주변 2km 이내예요. 매개충 하늘소가 날아갈 수 있는 거리를 고려한 거예요.\n용어 풀이:\n· 반출금지구역: 나무를 밖으로 옮길 수 없는 구역\n· 방제: 병해충을 막고 없애는 것", "ref": "p.42"}, {"id": "산림보호-13", "subject": "산림보호", "num": 13, "part": 1, "stem": "소나무재선충병 예방 나무주사 약제는?", "options": ["포스팜액제", "부프로페진", "티아클로프리드", "아바멕틴 1.8%"], "answer": 3, "explain": "· 예방 나무주사 = 아바멕틴 1.8%, 에마멕틴벤조에이트 2.15%\n· ③은 매개충 살포용\n쉬운 풀이: 건강한 소나무에 미리 약을 주사해 재선충이 들어와도 못 번지게 하는 게 예방 나무주사예요. 약제는 아바멕틴 1.8%, 에마멕틴벤조에이트 2.15%예요. 티아클로프리드는 나무에 주사하는 게 아니라 하늘소를 잡으려고 뿌리는 약이에요.\n용어 풀이:\n· 나무주사: 줄기에 구멍을 뚫어 약을 넣는 방법\n· 예방: 병이 생기기 전에 막음\n· 살포: 약을 뿌림", "ref": "p.21–22"}, {"id": "산림보호-14", "subject": "산림보호", "num": 14, "part": 1, "stem": "재선충병 감염목을 1~2㎥ 크기로 쌓아 처리하는 훈증 약제는?", "options": ["클로르피크린", "취화메틸", "메탐소디움", "인화알루미늄"], "answer": 2, "explain": "메탐소디움 훈증 후 밀봉\n쉬운 풀이: 재선충에 감염된 나무는 베어서 1~2㎥ 크기로 쌓고, 메탐소디움 약을 뿌린 뒤 비닐로 덮어 밀봉해요. 약이 가스가 되어 안에 있는 하늘소 애벌레와 재선충을 죽여요. 이렇게 가스로 죽이는 것을 훈증이라고 해요.\n용어 풀이:\n· 훈증: 가스로 해충을 죽이는 방법\n· 감염목: 병에 걸린 나무\n· 밀봉: 공기가 안 통하게 꽉 막음", "ref": "p.22"}, {"id": "산림보호-15", "subject": "산림보호", "num": 15, "part": 1, "stem": "솔잎혹파리 나무주사 방제의 기준과 시기로 옳은 것은?", "options": ["벌레혹 형성률 20% 이상 임지, 6월", "벌레혹 형성률 10% 이상 임지, 3월", "벌레혹 형성률 50% 이상 임지, 9월", "피해율과 관계없이 12월"], "answer": 0, "explain": "형성률 20% 이상, 6월 포스팜액제 50% 나무주사\n쉬운 풀이: 솔잎혹파리 애벌레는 솔잎 밑에 혹(벌레혹)을 만들어 솔잎을 망가뜨려요. 혹이 생긴 비율이 20% 이상인 숲에서, 애벌레가 활동하는 6월에 포스팜액제를 나무에 주사해 방제해요. '20%·6월'을 외우세요.\n용어 풀이:\n· 벌레혹(충영): 곤충 때문에 식물 조직이 부풀어 생긴 혹\n· 형성률: 혹이 생긴 비율\n· 포스팜액제: 침투성 살충제", "ref": "p.22–23"}, {"id": "산림보호-16", "subject": "산림보호", "num": 16, "part": 1, "stem": "솔껍질깍지벌레 피해가 가장 큰 수종은?", "options": ["잣나무", "곰솔", "리기다소나무", "낙엽송"], "answer": 1, "explain": "솔껍질깍지벌레는 곰솔 피해가 큼\n쉬운 풀이: 솔껍질깍지벌레는 나무껍질 틈에 붙어 즙을 빨아먹는 벌레예요. 바닷가에 많이 심은 곰솔(해송)에서 피해가 가장 커요. 그래서 남해안 곰솔 숲이 이 벌레 때문에 많이 말라 죽었어요.\n용어 풀이:\n· 깍지벌레: 몸이 껍데기로 덮인 즙 빨아먹는 벌레\n· 곰솔(해송): 바닷가에 잘 자라는 소나무 종류", "ref": "p.23"}, {"id": "산림보호-17", "subject": "산림보호", "num": 17, "part": 1, "stem": "참나무시들음병의 매개충은?", "options": ["솔수염하늘소", "북방수염하늘소", "소나무좀", "광릉긴나무좀"], "answer": 3, "explain": "매개충 광릉긴나무좀, 병원균 *Raffaelea*\n쉬운 풀이: 참나무시들음병은 광릉긴나무좀이라는 작은 딱정벌레가 나무에 구멍을 뚫고 들어가면서 라펠리아라는 곰팡이를 옮겨 생겨요. 곰팡이가 물관을 막아 나무가 시들어 죽어요. '참나무-광릉긴나무좀', '소나무-하늘소'로 짝지어 외우세요.\n용어 풀이:\n· 시들음병: 물관이 막혀 시들어 죽는 병\n· 나무좀: 나무에 구멍을 뚫는 작은 딱정벌레\n· 라펠리아: 참나무시들음병 곰팡이", "ref": "p.23"}, {"id": "산림보호-18", "subject": "산림보호", "num": 18, "part": 1, "stem": "솔나방의 월동 형태는?", "options": ["알", "번데기", "5령 유충", "성충"], "answer": 2, "explain": "연 1회 발생, 5령 유충으로 월동\n쉬운 풀이: 솔나방은 1년에 한 번 생기고, 애벌레(유충)가 다섯 번째 탈피 단계인 5령 상태로 겨울을 나요. 봄이 되면 다시 솔잎을 갉아먹어요. 곤충 문제는 '무엇으로 겨울을 나는지(월동 형태)'를 자주 물어요.\n용어 풀이:\n· 월동: 겨울을 나는 것\n· 유충: 애벌레\n· 령(齡): 애벌레가 허물을 벗은 횟수로 나눈 단계", "ref": "p.24–25"}, {"id": "산림보호-19", "subject": "산림보호", "num": 19, "part": 1, "stem": "개정 산림보호법 시행령상 나무병원이 처방전 없이 농약을 사용한 경우 1차 과태료는?", "options": ["50만원", "100만원", "150만원", "300만원"], "answer": 2, "explain": "150 / 300 / 500만원 (2026.1.30 개정 반영)\n쉬운 풀이: 2026년에 새로 바뀐 과태료예요. 나무병원은 나무의사의 처방전이 있어야 농약을 쓸 수 있는데, 없이 쓰면 1차 150만원, 2차 300만원, 3차 이상 500만원이에요. 신고 없는 숲가꾸기 벌채(100/300/500)와 숫자가 비슷하니 구분해서 외우세요.\n용어 풀이:\n· 과태료: 행정 규칙을 어겼을 때 내는 돈\n· 나무병원: 나무를 진료하는 사업체\n· 처방전: 나무의사가 발급하는 치료 지시서", "ref": "p.17"}, {"id": "산림보호-20", "subject": "산림보호", "num": 20, "part": 1, "stem": "농약 보조제가 **아닌** 것은?", "options": ["전착제", "유화제", "증량제", "훈증제"], "answer": 3, "explain": "· 보조제 = 용제·유화제·증량제·전착제·협력제\n· 훈증제는 살충제 종류\n쉬운 풀이: 농약은 주성분 외에 효과를 돕는 보조제를 섞어요. 잘 퍼지고 붙게 하는 전착제, 물과 기름을 섞어 주는 유화제, 양을 늘려 고루 뿌리게 하는 증량제 등이 보조제예요. 훈증제는 가스로 벌레를 죽이는 '살충제' 자체라서 보조제가 아니에요.\n용어 풀이:\n· 보조제: 농약 효과를 돕는 첨가물\n· 전착제: 약이 잘 퍼지고 붙게 하는 물질\n· 유화제: 물과 기름을 섞이게 하는 물질", "ref": "p.39"}, {"id": "산림보호-21", "subject": "산림보호", "num": 21, "part": 2, "stem": "상렬(霜裂)에 대한 설명으로 옳은 것은?", "options": ["수액이 얼어 부피가 커지고 수간 외층이 냉각수축하여 수선 방향으로 갈라지며, 단단하고 수선이 발달한 활엽수 거목에 많다", "봄철 늦서리로 새순이 말라 죽는 현상이다", "강한 직사광선으로 수피가 말라 떨어지는 현상이다", "토양 수분이 얼어 기둥 모양으로 솟는 현상이다"], "answer": 0, "explain": "②는 만상, ③은 볕데기, ④는 상주(서릿발)\n쉬운 풀이: 아주 추운 밤에 나무 줄기 바깥쪽이 급히 식어 줄어들면서 세로로 쩍 갈라지는 게 상렬이에요. 줄기 안쪽은 덜 줄어들어 힘 차이가 생기기 때문이에요. 단단한 활엽수 큰 나무에서 많이 생겨요.\n용어 풀이:\n· 상렬(霜裂): 추위로 줄기가 세로로 갈라지는 피해\n· 수선: 줄기 중심에서 바깥으로 뻗은 선(방사조직)\n· 냉각수축: 차가워져서 줄어듦", "ref": "모듈 p.5"}, {"id": "산림보호-22", "subject": "산림보호", "num": 22, "part": 2, "stem": "상주(서릿발) 피해가 잘 생기는 토양은?", "options": ["사질토", "점토질 토양", "수분이 아주 적은 토양", "자갈 토양"], "answer": 1, "explain": "· 상주는 점토질 토양에서 잘 생기고 수분이 아주 적으면 잘 안 생김\n· 방제로 묘상을 15cm 높임\n쉬운 풀이: 서릿발(상주)은 흙 속 물이 얼어 기둥처럼 솟는 현상이에요. 물을 많이 머금는 점토질 흙에서 잘 생기고, 물이 거의 없는 흙에선 잘 안 생겨요. 묘상을 15cm 정도 높이면 물빠짐이 좋아져 예방돼요.\n용어 풀이:\n· 상주(서릿발): 흙 속 얼음 기둥\n· 점토질: 고운 진흙이 많은 흙\n· 묘상: 묘목을 키우는 밭이랑", "ref": "p.5"}, {"id": "산림보호-23", "subject": "산림보호", "num": 23, "part": 2, "stem": "한해(가뭄 피해)에 강한 수종은?", "options": ["버드나무", "포플러", "리기다소나무", "오리나무"], "answer": 2, "explain": "건생식물(소나무·곰솔·리기다·자작·서어나무)은 강함, 습생식물(버드나무·포플러·오리나무·들메나무)은 약함\n쉬운 풀이: 건조한 땅에서 잘 사는 건생식물(소나무·곰솔·리기다소나무·자작나무 등)은 가뭄에 강하고, 물가를 좋아하는 습생식물(버드나무·포플러·오리나무)은 가뭄에 약해요. 리기다소나무가 척박한 산에 많이 심긴 이유예요.\n용어 풀이:\n· 한해(旱害): 가뭄 피해\n· 건생식물: 건조한 곳에 적응한 식물\n· 습생식물: 습한 곳에 적응한 식물", "ref": "p.6"}, {"id": "산림보호-24", "subject": "산림보호", "num": 24, "part": 2, "stem": "주풍(主風)과 폭풍의 풍속 기준으로 옳은 것은?", "options": ["주풍 5~10m/s, 폭풍 20m/s 이상", "주풍 10~15m/s, 폭풍 29m/s 이상", "주풍 15~20m/s, 폭풍 35m/s 이상", "주풍 20m/s 이상, 폭풍 40m/s 이상"], "answer": 1, "explain": "주풍 10~15m/s로 장기간 같은 방향, 폭풍 29m/s 이상\n쉬운 풀이: 주풍
